<style>
/* ===== Dominoes: a felt tray seen from straight above (like the chess board), drawn in the browser =====
   Tiles are thick 3D pieces; wood, felt and finishes are painted in code, so there are no picture files.
   Boards (the Boards card): Garden Pearl is free; Sunroom Walnut and Midnight Ebony are for Club members.
   Your hand lies face up along your side; your opponent's lies face down along the far side; the boneyard
   waits in two face-down stacks in the corner on your side. Tile backs carry the gold BW monogram. */
.do-pad{width:100%;flex:none;display:flex;justify-content:center}
.do-fit{position:relative;flex:none;overflow:hidden}
.do-scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.do-scene{position:relative;width:868px;height:868px;perspective:3000px;perspective-origin:50% 50%}
.do-tray{position:absolute;left:4px;top:4px;width:860px;height:860px;transform-style:preserve-3d}
.do-tray *{transform-style:preserve-3d}
/* the tiles sit a little below the tray's top plane, so the tray itself must not catch taps; only the playable pieces do */
.do-tray,.do-tray *{pointer-events:none}
.do-tray .dm.play,.do-tray .dm.play *,.do-tray .dm.glow,.do-tray .dm.glow *,.do-tray .do-ghost{pointer-events:auto}
.do-p{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.do-tsh{left:-8px;top:-2px;width:876px;height:876px;transform:translateZ(-30px);border-radius:14px;background:rgba(0,0,0,.6);filter:blur(12px)}
.do-wh{background-image:var(--do-wood);background-size:1200px 600px;background-repeat:no-repeat;background-color:var(--do-woodc)}
.do-wv{background-image:var(--do-woodv);background-size:600px 1200px;background-repeat:no-repeat;background-color:var(--do-woodc)}
.do-felt{width:394px;height:394px;transform:translateZ(-22px);background-image:var(--do-felt);background-size:256px 256px;background-color:var(--do-feltc)}
.do-felt.a{left:36px;top:36px}.do-felt.b{left:430px;top:36px}.do-felt.c{left:36px;top:430px}.do-felt.d{left:430px;top:430px}
.do-feltsh{left:36px;top:36px;width:788px;height:788px;transform:translateZ(-21.6px);pointer-events:none;
  background:radial-gradient(ellipse 70% 70% at 45% 55%,rgba(255,240,200,.08),rgba(0,0,0,0) 60%),linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,0) 9%),linear-gradient(to right,rgba(0,0,0,.4),rgba(0,0,0,0) 5%,rgba(0,0,0,0) 95%,rgba(0,0,0,.35)),linear-gradient(to top,rgba(0,0,0,.3),rgba(0,0,0,0) 7%)}
.do-rim{transform:translateZ(1px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.do-rim.b,.do-rim.t{box-shadow:inset 0 1px 0 rgba(0,0,0,.3),inset 0 -1px 0 rgba(0,0,0,.3)}
.do-rim::after{content:"";position:absolute;inset:0}
.do-rim.t{left:0;top:0;width:430px;height:36px}.do-rim.t2{left:430px;background-position:-430px 0}
.do-rim.b{left:0;top:824px;width:430px;height:36px;background-position:-100px -300px}.do-rim.b2{left:430px;background-position:-530px -300px}
.do-rim.t::after{background:linear-gradient(to bottom,rgba(255,235,200,.22),rgba(0,0,0,0) 40%,rgba(0,0,0,.3))}
.do-rim.b::after{background:linear-gradient(to bottom,rgba(255,235,200,.3),rgba(0,0,0,0) 45%,rgba(0,0,0,.25))}
.do-rim.l{left:0;top:36px;width:36px;height:788px;background-position:-40px 0}.do-rim.r{left:824px;top:36px;width:36px;height:788px;background-position:-300px -100px}
.do-rim.l::after{background:linear-gradient(to right,rgba(255,235,200,.2),rgba(0,0,0,.3))}.do-rim.r::after{background:linear-gradient(to right,rgba(255,235,200,.12),rgba(0,0,0,.35))}
.do-rack{left:136px;width:588px;height:118px;border-radius:10px;transform:translateZ(-21.4px);background:rgba(0,0,0,.18);box-shadow:inset 0 2px 8px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.08);pointer-events:none}
.do-rack.near{top:722px}.do-rack.far{top:56px}
.do-gold{position:absolute;pointer-events:none;transform:translateZ(1.6px);background:linear-gradient(90deg,#8a6526,#f3d790 30%,#b8913f 60%,#f3d790 85%,#8a6526)}
/* ---- a domino: stacked slabs make the edge, a face (or back) on top ---- */
.dm{position:absolute;left:0;top:0;-webkit-tap-highlight-color:transparent}
.dm .s,.dm .f,.dm .bk{position:absolute;inset:0;border-radius:var(--rad,7px)}
.dm .s{background:var(--do-edge)}
.dm .f{background:var(--do-face);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset 0 -5px 9px rgba(0,0,0,.18),inset 0 4px 7px rgba(255,255,255,.5);display:flex}
.dm.v .f{flex-direction:column}
.dm .bk{background:var(--do-back);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 -5px 9px rgba(0,0,0,.25),inset 0 4px 7px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
/* tile backs: the gold-stamped BW monogram (B in Montserrat, W in the Pacifico of "Whim"), letters only */
.dm .mono{display:flex;align-items:baseline;justify-content:center;line-height:1.25;opacity:.92}
.dm.h .mono{transform:rotate(-90deg)}
.dm .mono b,.dm .mono i{display:inline-block;background:linear-gradient(170deg,#fff1bf 0%,var(--do-emb) 45%,#8f6a22 75%,#f3d68b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.45))}
.dm .mono b{font:500 1em Montserrat,sans-serif;letter-spacing:-.02em}
.dm .mono i{font:400 .76em Pacifico,cursive;font-style:normal;margin-left:.06em;padding:0 .18em 0 .02em}
.dm .half{flex:1;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%}
.dm.v .half{padding:14% 16%}
.dm .half i{width:66%;aspect-ratio:1;border-radius:50%;margin:auto;visibility:hidden;background:radial-gradient(circle at 60% 65%,var(--do-pip) 45%,var(--do-pip2) 100%);box-shadow:inset 0 2px 2px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.55)}
.dm .half i.on{visibility:visible}
.dm .bar{flex:none;background:var(--do-bar);box-shadow:0 1px 0 rgba(255,255,255,.5)}
.dm.h .bar{width:2px;margin:12% 0}.dm.v .bar{height:2px;margin:0 12%}
.dm .spin{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3cc,#b8913f 55%,#6e4f1d);box-shadow:0 1px 1px rgba(0,0,0,.45)}
.dm .sh{position:absolute;inset:-5px;border-radius:12px;background:rgba(0,0,0,.5);filter:blur(5px)}
.dm.play{cursor:pointer}
.dm.play .f{box-shadow:inset 0 0 0 3px rgba(214,164,62,.95),inset 0 0 18px 2px rgba(240,190,90,.5)}
.dm.pick .f{box-shadow:inset 0 0 0 4px #e9b949,inset 0 0 22px 6px rgba(250,205,110,.7)}
.dm.glow{cursor:pointer}
.dm.hint .f{box-shadow:inset 0 0 0 5px #f2c75a,inset 0 0 26px 8px rgba(250,205,95,.75)!important;animation:dm-hint 1.3s ease-in-out infinite}
@keyframes dm-hint{50%{filter:brightness(1.18)}}
.dm.glow .bk{box-shadow:inset 0 0 0 3px rgba(214,164,62,.95),inset 0 0 18px 2px rgba(240,190,90,.5);animation:do-glow 1.6s ease-in-out infinite}
@keyframes do-glow{50%{box-shadow:inset 0 0 0 2px rgba(214,164,62,.5),inset 0 0 8px 1px rgba(240,190,90,.25)}}
.do-ghost{position:absolute;left:0;top:0;border-radius:8px;border:3px dashed rgba(241,207,122,.95);background:rgba(255,214,120,.18);box-shadow:0 0 18px 4px rgba(255,206,110,.35);cursor:pointer;animation:do-ghost 1.4s ease-in-out infinite}
@keyframes do-ghost{50%{background:rgba(255,214,120,.06);border-color:rgba(241,207,122,.55)}}
/* coloured pips (Garden Pearl) */
.do-colour .half[data-n="1"] i{--do-pip:#1f5fbf;--do-pip2:#5d8de0}.do-colour .half[data-n="2"] i{--do-pip:#2f8f4e;--do-pip2:#62c07f}.do-colour .half[data-n="3"] i{--do-pip:#c0392b;--do-pip2:#e27063}
.do-colour .half[data-n="4"] i{--do-pip:#6b3fa0;--do-pip2:#9a74c9}.do-colour .half[data-n="5"] i{--do-pip:#c58a10;--do-pip2:#e7b54a}.do-colour .half[data-n="6"] i{--do-pip:#14141a;--do-pip2:#4a4a52}
body.do-quick .dm.glow .bk,body.do-quick .do-ghost{animation:none}
@media (min-width:1000px){ body.pk .pk-stage{justify-content:center} }
.do-pad{flex-direction:column;align-items:center;gap:10px}
/* the Draw button: only shown when nothing in your hand fits (its space is kept so the board doesn't jump) */
.do-draw{position:absolute;z-index:5;left:50%;transform:translateX(-50%);width:auto;min-width:170px;min-height:44px;padding:11px 22px;border-radius:6px;background:rgba(15,23,42,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(231,199,122,.55);box-shadow:0 2px 10px rgba(0,0,0,.25),0 0 16px rgba(240,190,90,.25);color:#e6c25a;font-size:15px;font-weight:700;letter-spacing:.45px}
.do-draw:hover{background:rgba(15,23,42,.85);color:#f0d27a}
.do-draw.off{display:none}
/* Deal Next Hand: over the middle of the felt between hands (phones: in the middle of the hand bar) */
.do-next{top:40%!important}
.do-hand .do-draw.do-next{left:50%;right:auto;top:50%!important;transform:translate(-50%,-50%);padding:11px 18px}
/* phones: one slim score line above the tray (the two score strips step aside) */
.do-score{display:none;width:var(--pk-size,100%);max-width:100%;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;font-size:13px;color:#fff;
  background:rgba(255,250,242,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3)}
.do-score b{font-weight:700;margin-right:4px}.do-score .mid{font-size:11px;opacity:.8}
body.do-bighand .do-score{display:flex}
/* phones: a compact Draw button at the right end of the hand bar */
.do-hand .do-draw{left:auto;right:8px;top:50%;transform:translateY(-50%);min-width:0;padding:10px 12px;font-size:14px}
/* phones: your hand moves out of the tray into a full-size row under it, so the tiles are easy to tap */
.do-hand{display:none;position:relative;height:96px;border-radius:12px;transform-style:preserve-3d;background:var(--do-feltc,#16284a);background-image:var(--do-felt);background-size:256px 256px;
  box-shadow:inset 0 0 0 3px var(--do-woodc,#e6dcc6),inset 0 4px 14px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35)}
.do-hand *{transform-style:preserve-3d}
body.do-bighand .do-hand{display:block}
body.do-bighand .do-rack.near{display:none}
/* phones: both hands are on the table and the bar says whose turn it is, so the two score strips step aside for a bigger tray */
body.do-bighand.pk .pk-mini{display:none}
</style>

<script>
/* =====================================================================
   Painted materials
   ===================================================================== */
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}
function noise2(seed){var r=rng(seed),P=new Uint16Array(512),G=new Float32Array(256),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=Math.floor(r()*(i+1));t=p[i];p[i]=p[j];p[j]=t;}for(i=0;i<512;i++)P[i]=p[i&255];for(i=0;i<256;i++)G[i]=r();function f(x){return x*x*(3-2*x);}return function(x,y){var xi=Math.floor(x),yi=Math.floor(y),u=f(x-xi),v=f(y-yi),X=xi&255,Y=yi&255;var a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(n,x,y,o){var s=0,a=.5,t=0;for(var i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function mix(a,b,t){return a+(b-a)*t;}
function canvasOf(w,h,fn){var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d"),im=g.createImageData(w,h),D=im.data;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var col=fn(x,y),i=(y*w+x)*4;D[i]=col[0];D[i+1]=col[1];D[i+2]=col[2];D[i+3]=255;}g.putImageData(im,0,0);return c;}
function cssUrl(c){return 'url('+c.toDataURL("image/jpeg",.88)+')';}
function rot(c){var d=document.createElement("canvas");d.width=c.height;d.height=c.width;var g=d.getContext("2d");g.translate(d.width,0);g.rotate(Math.PI/2);g.drawImage(c,0,0);return d;}
function woodFn(o){var n=noise2(o.seed),n2=noise2(o.seed+77),r=rng(o.seed+5);return function(x,y){var warp=fbm(n,x/o.wx,y/o.wy,4),v=y*o.freq+warp*o.turb;v-=Math.floor(v);var ring=Math.pow(Math.abs(Math.sin(v*Math.PI)),o.sharp),st=fbm(n2,x/180,y/1.6,3);var t=Math.min(1,Math.max(0,(1-ring)*o.ringAmt+st*o.streakAmt));var k=r()<o.pores?.8:1,l=1+(fbm(n2,x/400,y/90,2)-.5)*o.blotch;return [mix(o.light[0],o.dark[0],t)*k*l,mix(o.light[1],o.dark[1],t)*k*l,mix(o.light[2],o.dark[2],t)*k*l];};}
function feltFn(rgb,seed){var r=rng(seed),n=noise2(seed);return function(x,y){var k=.86+r()*.22+(fbm(n,x/22,y/22,3)-.5)*.14;return [rgb[0]*k,rgb[1]*k,rgb[2]*k];};}
var DESIGNS={
  pearl:{wood:{light:[236,226,204],dark:[206,192,164],freq:.03,turb:5,wx:260,wy:30,sharp:.8,ringAmt:.3,streakAmt:.35,pores:0,blotch:.12,seed:12},woodc:"#e6dcc6",
    felt:[22,40,74],face:"linear-gradient(150deg,#ffffff,#f4f1ea 55%,#e4ddd0)",edge:"#e2dbcd",pip:"#14141a",pip2:"#4a4a52",bar:"#c9b98f",back:"linear-gradient(150deg,#f4f1ea,#d9d1c0)",emb:"#b8913f",colour:true,dot:"#d9d1c0"},
  walnut:{wood:{light:[120,78,46],dark:[58,34,18],freq:.04,turb:9,wx:220,wy:20,sharp:.7,ringAmt:.66,streakAmt:.42,pores:.02,blotch:.3,seed:23},woodc:"#5e3c22",
    felt:[26,62,44],face:"linear-gradient(150deg,#fffdf4,#f1e7cf 60%,#e2d3b0)",edge:"#d9c9a4",pip:"#16110c",pip2:"#4a3a2a",bar:"#b9a57c",back:"linear-gradient(150deg,#2f4d8a,#1b2f5e)",emb:"#d9b25a",colour:false,dot:"#2f4d8a"},
  ebony:{wood:{light:[132,52,32],dark:[62,20,12],freq:.035,turb:5,wx:420,wy:30,sharp:.9,ringAmt:.32,streakAmt:.5,pores:.012,blotch:.3,seed:41},woodc:"#6a2a18",
    felt:[86,22,30],face:"linear-gradient(150deg,#3a3430,#1b1714 60%,#0e0b09)",edge:"#120e0c",pip:"#f6efdc",pip2:"#cdbf9c",bar:"#8f6a22",back:"linear-gradient(150deg,#3a3430,#141110)",emb:"#d9b25a",colour:false,dot:"#1b1714"}
};

/* =====================================================================
   The tray
   ===================================================================== */
var stage=document.createElement("div"); stage.className="do-pad";
var scoreEl=document.createElement("div"); scoreEl.className="do-score";
stage.innerHTML='<div class="do-fit" id="doFit"><div class="do-scaler" id="doScaler"><div class="do-scene"><div class="do-tray" id="doTray">'+
  '<div class="do-p do-tsh"></div>'+
  '<div class="do-p do-felt a"></div><div class="do-p do-felt b"></div><div class="do-p do-felt c"></div><div class="do-p do-felt d"></div><div class="do-p do-feltsh"></div>'+
  '<div class="do-p do-rack near"></div><div class="do-p do-rack far"></div>'+
  '<div id="doTiles" style="position:absolute;left:0;top:0"></div>'+
  '<div class="do-p do-rim t do-wh"></div><div class="do-p do-rim t t2 do-wh"></div><div class="do-p do-rim b do-wh"></div><div class="do-p do-rim b b2 do-wh"></div><div class="do-p do-rim l do-wv"></div><div class="do-p do-rim r do-wv"></div>'+
  '<div class="do-gold" style="left:30px;top:30px;width:800px;height:2px"></div><div class="do-gold" style="left:30px;top:828px;width:400px;height:2px"></div><div class="do-gold" style="left:430px;top:828px;width:400px;height:2px"></div><div class="do-gold" style="left:30px;top:30px;width:2px;height:800px"></div><div class="do-gold" style="left:828px;top:30px;width:2px;height:800px"></div>'+
  '</div></div></div><button type="button" class="pk-btn do-draw off" id="doDrawBtn">Draw a Tile</button><button type="button" class="pk-btn do-draw do-next off" id="doNextBtn">Deal Next Hand</button></div><div class="do-hand" id="doHand"></div>';
stage.insertBefore(scoreEl,stage.firstChild);
var fitEl=stage.querySelector("#doFit"), drawBtn=stage.querySelector("#doDrawBtn"), nextBtn=stage.querySelector("#doNextBtn"), trayEl=stage.querySelector("#doTray"), TL=stage.querySelector("#doTiles"), HB=stage.querySelector("#doHand"), FZ=-22;
function bigHand(){ return document.body.classList.contains("do-bighand"); }
var texCache={}, curDesign=null;
function applyDesign(k){
  if(!DESIGNS[k]) k="pearl"; if(k===curDesign) return; curDesign=k;
  var d=DESIGNS[k]; if(!texCache[k]){ var w=canvasOf(1200,600,woodFn(d.wood)); texCache[k]={w:cssUrl(w),v:cssUrl(rot(w)),f:cssUrl(canvasOf(256,256,feltFn(d.felt,k.length*31)))}; }
  var s=stage.style, b=document.body.style, t=texCache[k];   /* on the stage, so the tray and the phone hand bar share them */
  s.setProperty("--do-wood",t.w); s.setProperty("--do-woodv",t.v); s.setProperty("--do-woodc",d.woodc); s.setProperty("--do-felt",t.f); s.setProperty("--do-feltc","rgb("+d.felt+")");
  s.setProperty("--do-face",d.face); s.setProperty("--do-edge",d.edge); s.setProperty("--do-pip",d.pip); s.setProperty("--do-pip2",d.pip2); s.setProperty("--do-bar",d.bar); s.setProperty("--do-back",d.back); s.setProperty("--do-emb",d.emb);
  b.setProperty("--do-dot",d.dot);
  stage.classList.toggle("do-colour",d.colour);
}
var PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function half(n){ var s='<div class="half" data-n="'+n+'">'; for(var k=0;k<9;k++) s+='<i class="'+(PIPS[n].indexOf(k)>=0?"on":"")+'"></i>'; return s+'</div>'; }
/* a domino: w = short side, l = long side, dir h or v, face up or back up */
function mkTile(a,b,o){
  var holder=o.into||TL;
  var w=o.w,l=o.l,hz=o.dir==="h",W=hz?l:w,H=hz?w:l,e=document.createElement("div");
  e.className="dm "+(hz?"h":"v"); e.style.width=W+"px"; e.style.height=H+"px"; e.style.margin=(-H/2)+"px 0 0 "+(-W/2)+"px"; e.style.setProperty("--rad",Math.round(w*.14)+"px");
  var th=o.th||12, s='<div class="sh" style="transform:translateZ(.5px)"></div>';
  for(var k=0;k<6;k++) s+='<div class="s" style="transform:translateZ('+(1+k*th/6)+'px);filter:brightness('+(.78+k*.04)+')"></div>';
  if(o.back) s+='<div class="bk" style="transform:translateZ('+(th+1)+'px);font-size:'+Math.round(w*.34)+'px"><span class="mono"><b>B</b><i>W</i></span></div>';
  else s+='<div class="f" style="transform:translateZ('+(th+1)+'px)">'+half(a)+'<div class="bar"></div>'+half(b)+'<div class="spin"></div></div>';
  e.innerHTML=s; holder.appendChild(e); return e;
}
function setAt(e,x,y,z,rz){ e._x=x; e._y=y; e.style.transform="translate3d("+x+"px,"+y+"px,"+(z||0)+"px)"+(rz?" rotateZ("+rz+"deg)":""); }
function glide(e,to,z1,rz){

  {title:"Both Ends", text:"<p>This tile fits <b>both ends</b>. Tap it, then tap the dashed outline where you want it to go.</p>", done:"<p>When a tile fits both ends, you choose which end to play it on.</p>", sub:"Tap the tile, then an outline"},
  {title:"Drawing", text:"<p>Nothing in your hand matches the ends, so you must <b>draw</b> from the boneyard until something fits.</p><p>Tap <b>Draw a Tile</b> (or the glowing boneyard), then play the tile you drew.</p>", done:"<p>When the boneyard is empty and nothing fits, you pass instead.</p>", sub:"Tap Draw a Tile"},
  {title:"Scoring", text:"<p>A hand ends when someone plays their <b>last tile</b>: they score the pips left in the other hand. If nobody can move, the <b>lower pip total</b> wins and scores the other hand.</p><p>Play hands until someone reaches the target score. Ready for a practice match to 50?</p>"}
]; }
function lessonSetup(k){
  practice=false; hintIdx=-1; pickIdx=-1; busy=false; mySide=1; TARGET=100;
  S=deal([0,0,0],1,1); lacks={1:[],2:[]};
  if(k===2){ S.chain=[[3,5]]; S.h1=[[5,2],[1,1],[6,4],[3,0]]; }
  else if(k===3){ S.chain=[[2,4]]; S.h1=[[4,2],[6,6],[1,5]]; }
  else if(k===4){ S.chain=[[1,6]]; S.h1=[[2,3],[4,5]]; S.bone=S.bone.filter(function(t){ return !(t[0]===6&&t[1]===2)&&!(t[0]===2&&t[1]===6)&&t[0]!==1&&t[1]!==1&&t[0]!==6&&t[1]!==6; }).slice(0,6).concat([[6,2]]); }
  render();
}
function startPractice(){ practice=true; tipN=0; hintIdx=-1; mySide=1; TARGET=50; newGame();
  Parlor.practiceSay("Your Turn","<p>You lead. Tap any glowing tile to start the train. This practice match is to <b>50 points</b>.</p><p>Stuck? Tap <b>Hint</b>.</p>"); }
function myScore(t,side){
  var keep=S, c={chain:S.chain.map(function(x){ return x.slice(); }),startAt:S.startAt}; S=c; attach(t,side); var e=ends(); S=keep;
  var rest=S.h1.filter(function(x){ return x!==t; }), v=(t[0]+t[1])*1.2+(t[0]===t[1]?5:0);
  [e[0],e[1]].forEach(function(n){ var mineN=rest.filter(function(x){ return x[0]===n||x[1]===n; }).length; v+=mineN*3.5; if(!mineN) v-=3; if(lacks[2].indexOf(n)>=0) v+=7; });
  return v;
}
function showHint(){
  if(!practice||S.over||S.handOver||busy||S.turn!==1) return;
  var pl=playable(1);
  if(!pl.length){ Parlor.hintSay(S.bone.length?"<p>Nothing fits: tap <b>Draw a Tile</b> or the glowing boneyard.</p>":"<p>Nothing fits and the boneyard is empty, so you pass.</p>"); return; }
  var best=null,bv=-1e9; pl.forEach(function(i){ fits(S.h1[i]).forEach(function(side){ var v=myScore(S.h1[i],side); if(v>bv){ bv=v; best={i:i,side:side}; } }); });
  hintIdx=best.i; render(); var t=S.h1[best.i], e=ends();
  Parlor.hintSay("<p>Play the <b>gold-ringed tile</b> ("+t[0]+"|"+t[1]+")"+(e&&fits(t).length>1?" on the <b>"+(best.side===0?"left":"right")+" end</b>":"")+".</p>");
}
function practiceTip(s,what){
  if(S.over||S.handOver) return;
  var pl=playable(1), dbl=pl.filter(function(i){ return S.h1[i][0]===S.h1[i][1]; }).length;
  if(!pl.length&&S.bone.length) Parlor.practiceSay("Nothing Fits","<p>Draw from the boneyard until a tile matches an end.</p>");
  else if(s===2&&what==="pass") Parlor.practiceSay("The House Passed","<p>It couldn't match "+ends().join(" or ")+". Keep those numbers at the ends if you can.</p>");
  else if(dbl) Parlor.practiceSay("Your Turn","<p>You can play a double. Doubles only fit one number, so play them while you can.</p>");
  else { Parlor.practiceSay("Your Turn","<p>"+TIPS[tipN++%TIPS.length]+"</p>"); }
}

/* ---------- online table (same page: ?code=XXXX) ---------- */
var lastMv=null;
function snapshot(){ return {game:"dominoes", h1:S.h1, h2:S.h2, bone:S.bone, chain:S.chain, turn:S.turn, over:S.over, startAt:S.startAt, passes:S.passes, winner:S.winner,
  score:S.score, hand:S.hand, leader:S.leader, handOver:S.handOver, lastHand:S.lastHand, seq:seq, mv:lastMv}; }
async function push(){
  if(!online||!room) return;
  await sb.from("rooms").update({state:snapshot(), status:S.over?"done":"live", updated_at:new Date().toISOString()}).eq("id",room.id);
  if(S.over) report();
}
function report(){ if(reported||!S.over||!room||!window.bwRateGame) return; reported=true; room.state=snapshot(); bwRateGame(sb,room,me,S.winner); }
function fromSnap(s){
  if(!s||!s.h1){ S=deal([0,0,0],1,1); return; }
  S={h1:s.h1,h2:s.h2,bone:s.bone||[],chain:s.chain||[],turn:s.turn||1,over:!!s.over,startAt:s.startAt!=null?s.startAt:Math.floor((s.chain||[]).length/2),passes:s.passes||0,
     winner:s.winner!=null?s.winner:(s.over?(!(s.h1||[]).length?1:!(s.h2||[]).length?2:0):0),
     score:s.score||[0,0,0],hand:s.hand||1,leader:s.leader||1,handOver:!!s.handOver,lastHand:s.lastHand||null};
  seq=s.seq||0;
}
var queue=Promise.resolve();
function remote(s){
  queue=queue.then(async function(){
    if(!s||s.seq==null||s.seq===seq) return;
    var mv=s.mv, wasOver=S.over, wasHandOver=S.handOver;
    if(mv&&mv.s&&mv.s!==mySide){
      busy=true;
      try{
        if(mv.k==="play"){ var h=handOf(mv.s), i=h.findIndex(function(t){ return (t[0]===mv.t[0]&&t[1]===mv.t[1])||(t[0]===mv.t[1]&&t[1]===mv.t[0]); }); if(i>=0) await doPlay(mv.s,i,mv.side); }
        else if(mv.k==="draw"&&S.bone.length) await doDraw(mv.s);
      }catch(e){}
      busy=false;
    }
    if(mv&&mv.k==="deal") lacks={1:[],2:[]};
    fromSnap(s); render();
    if(S.over&&!wasOver) end();
    else if(S.handOver&&!wasHandOver) handEnd();
    else { msg(); if(S.turn===mySide&&!S.handOver&&!playable(mySide).length&&!S.bone.length&&!S.over) autoPass(); }
  });
}
async function bootOnline(){
  online=true; Parlor.seatOnline({label:"Online table "+CODE});
  var cfg=window.BW_PLAY||{};
  if(!cfg.url){ say("Can't connect","Missing play-config.js"); return; }
  sb=(window.BW&&BW.client&&BW.client())||supabase.createClient(cfg.url,cfg.anonKey);
  if(window.BW) await BW.settled();
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ say("Sign in to join","Use the Lobby to sign in"); if(window.BW){ var a=await BW.openAuth({reason:"Sign in to join this table."}); if(!a.ok) return; sess=(await sb.auth.getSession()).data.session; } if(!sess) return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code",CODE).single();
  if(q.error){ say("Table not found",q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==="function" && bwSendToGame(bwGuessGame(room),CODE)) return;
  if(room.host===me) mySide=1; else if(room.guest===me) mySide=2;
  else if(!room.guest){ var u=await sb.from("rooms").update({guest:me,status:"live"}).eq("id",room.id).select().single(); if(!u.error){ room=u.data; mySide=2; } }
  else mySide=0;   /* watching */
  Parlor.names(mySide===2?["Opponent","You"]:["You","Opponent"]);
  Parlor.mySeat(mySide===2?1:0); Parlor.table&&Parlor.table({sb:sb,room:room,me:me,side:mySide});
  fromSnap(room.state&&room.state.h1?room.state:null);
  render(); if(S.over) end(); else msg();
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"code=eq."+CODE},function(p){
    var hadGuest=room&&room.guest; room=p.new; var s=p.new.state||{};
    if(!hadGuest&&room.guest){ render(); msg(); }
    if(s.seq!=null&&s.seq!==seq) remote(s);
  }).subscribe();
}

/* ---------- fit the tray to its space ----------
   Desktop: the full height between the game switcher and the bottom of the window (like the chess board).
   Phones: the full width; your hand sits in a slim bar under the tray and the score strips step aside. */
function fit(){
  var W=868, wide=window.innerWidth>=1000, availW, availH, big=false;
  if(wide){
    var st2=document.querySelector(".pk-stage"), top=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185;
    availW=(st2&&st2.clientWidth)||(window.innerWidth-560); availH=window.innerHeight-top-22;
  } else {
    var shortL=window.innerHeight<=520&&window.innerWidth>window.innerHeight;
    availW=window.innerWidth-12;
    big=!shortL&&window.innerWidth<700;
    if(shortL) availH=window.innerHeight-56-64-34-10;
    else if(big) availH=window.innerHeight-56-(64+30)-106-24-40;    /* header, floating bar, hand bar, score line */
    else availH=window.innerHeight-56-64-34-100;
  }
  var s=Math.max(.2,Math.min(availW/W,availH/W,1.25));
  var f=fitEl, sc=document.getElementById("doScaler"); if(!f) return;
  var was=document.body.classList.contains("do-bighand"); document.body.classList.toggle("do-bighand",big);
  if(HB) HB.style.width=Math.round(W*s)+"px";
  sc.style.transform="scale("+s+")"; f.style.width=Math.round(W*s)+"px"; f.style.height=Math.round(W*s)+"px";
  drawBtn.style.top=big?"":Math.round((4+690)*s-22)+"px";   /* over the felt, just above your tiles (phones: in the hand bar) */
  document.body.style.setProperty("--pk-size",Math.round(W*s)+"px");
  if(was!==big&&S) setTimeout(render,0);
}
window.addEventListener("resize",fit);
