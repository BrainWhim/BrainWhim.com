<style>
/* Captain Zayden's Map (The Outpost · The Telescope). Kids' kit only: no Google Fonts, no outside files, nothing sent anywhere. */
:root{--tm-ink:#3b2412;--tm-teal:#169e9a;--tm-gold:#e9c46a}
body{overflow:hidden;touch-action:manipulation}
.bg{position:fixed;inset:-24px;z-index:0;background:#0b1630 url("kids-outpost-sm.jpg") 77% 38%/cover no-repeat;filter:blur(2px) brightness(.5) saturate(1.1)}
.bg2{position:fixed;inset:0;z-index:0;background:radial-gradient(120% 90% at 22% 8%,rgba(255,200,120,.16),transparent 55%),linear-gradient(180deg,rgba(5,11,28,.2),rgba(5,11,28,.55))}
#app{position:fixed;inset:0;z-index:1;padding:calc(76px + var(--k-safe-t)) 12px calc(10px + var(--k-safe-b))}
@media (max-width:420px){#app{padding-top:calc(70px + var(--k-safe-t))}}
.scr{display:none;height:100%}
body.m-menu #menu{display:flex}
body.m-play #play{display:flex}

/* ---------- menu ---------- */
#menu{align-items:center;justify-content:center}
.mcard{width:min(470px,100%);max-height:100%;overflow:auto;border-radius:28px;padding:22px 22px 20px;text-align:center;
  background:linear-gradient(180deg,rgba(27,45,87,.94),rgba(14,26,56,.94));border:1px solid rgba(95,209,193,.35);
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);animation:kRise .45s cubic-bezier(.2,.9,.3,1.2)}
.emb{width:120px;height:92px;margin:0 auto 4px;display:block}
.emb .ndl{transform-origin:94px 66px;animation:quiver 3.2s ease-in-out infinite}
@keyframes quiver{0%,100%{transform:rotate(-6deg)}20%{transform:rotate(5deg)}45%{transform:rotate(-2deg)}70%{transform:rotate(3deg)}}
.mcard h1{margin:0 0 4px;font-size:30px;line-height:1.1;color:var(--k-warm)}
.mcard .lead{margin:0 auto 12px;max-width:380px;font-size:16.5px;line-height:1.4;color:#d5e2f0}
.week{display:flex;justify-content:center;gap:6px;margin:4px 0 14px}
.wd{width:40px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#9fb3cc}
.wd i{width:34px;height:34px;border-radius:50%;border:2px dashed rgba(232,241,248,.25);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;color:#b9c9dc;background:rgba(255,255,255,.03)}
.wd.today b{color:var(--k-warm)}
.wd.today i{border-style:solid;border-color:var(--k-gold)}
.wd.done i{border:2px solid #c9a24a;background:radial-gradient(circle at 35% 30%,#f6e7c1,#d9bf85);color:#b03a22;font-weight:700}
.mbtns{display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:340px;margin:0 auto}
.mbtns .k-btn{width:100%}
.k-btn small{font-size:13px;font-weight:400;opacity:.85;margin-left:4px}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 #3f7499,0 8px 18px rgba(0,0,0,.35),0 0 0 0 rgba(126,182,217,.55)}50%{box-shadow:0 4px 0 #3f7499,0 8px 18px rgba(0,0,0,.35),0 0 0 10px rgba(126,182,217,0)}}
.mfoot{margin:12px 0 0;font-size:14px;color:#a9bad0}
@media (max-height:700px) and (orientation:portrait){.mcard{padding:14px 18px 12px}.emb{width:84px;height:64px}.mcard h1{font-size:25px}.mcard .lead{font-size:15px;margin-bottom:8px}.week{margin:2px 0 10px}.wd i{width:30px;height:30px}.mbtns{gap:8px}.mbtns .k-btn{min-height:46px;font-size:17px}.mfoot{margin-top:8px;font-size:13px}}
@media (max-height:580px) and (orientation:portrait){.emb{display:none}.mcard .lead{font-size:14px}}

/* ---------- play ---------- */
#play{flex-direction:column;gap:8px;align-items:center}
.side{display:contents}
.bar{order:1;display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:17px;color:var(--k-warm);text-shadow:0 2px 6px rgba(0,0,0,.6);min-height:24px}
.bar span{font-weight:400;font-size:15px;color:#cfe0f0}
.coach{order:2;display:none;width:min(560px,100%);border-radius:20px;padding:12px 14px;background:linear-gradient(180deg,rgba(27,45,87,.95),rgba(14,26,56,.95));
  border:1px solid rgba(233,196,106,.38);box-shadow:0 10px 26px rgba(0,0,0,.45);animation:kRise .3s ease}
.coach.on{display:block}
.coach .ct{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--k-teal);margin-bottom:3px}
.coach p{margin:0;font-size:16px;line-height:1.38;color:#e3ecf6}
.coach p b{color:var(--k-warm)}
.coach .cr{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.coach .k-btn{min-height:44px;font-size:16px;padding:0 18px}
.coach.hint{border-color:rgba(95,209,193,.6)}
.wrap{order:3;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.paper{position:relative;flex:none;border-radius:6px;
  background:radial-gradient(130% 100% at 30% 20%,#f8ecc9 0%,#efdcae 55%,#d9bc83 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 0 0 1px rgba(120,80,30,.35),0 0 40px rgba(150,100,40,.35) inset,0 18px 34px rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.45)}
.paper::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background:radial-gradient(90% 80% at 12% 6%,rgba(255,226,160,.30),transparent 60%);animation:flick 4.5s infinite}
@keyframes flick{0%,100%{opacity:1}12%{opacity:.82}16%{opacity:.97}41%{opacity:.88}58%{opacity:1}77%{opacity:.86}83%{opacity:.98}}
.roll{position:absolute;left:-3.5%;width:107%;height:5.2%;border-radius:999px;pointer-events:none;
  background:linear-gradient(180deg,#d7a868 0%,#a66b32 35%,#6e4019 75%,#4a2a10 100%);box-shadow:0 6px 10px rgba(0,0,0,.45)}
.roll::before,.roll::after{content:"";position:absolute;top:-12%;width:3.2%;height:124%;border-radius:40%;background:linear-gradient(180deg,#ffe7a3,#c79a3c 50%,#7c5a1a)}
.roll::before{left:-1%}.roll::after{right:-1%}
.roll.t{top:-3.6%}.roll.b{bottom:-3.6%}
#bd{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
#bd text{font-family:var(--k-font);font-weight:700;pointer-events:none}
.tools{order:4;display:flex;gap:8px;justify-content:center;width:min(560px,100%)}
.tb{appearance:none;flex:1;max-width:130px;min-height:60px;border-radius:18px;border:1px solid var(--k-line);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px;font-weight:700;color:#e3ecf6;
  background:linear-gradient(180deg,rgba(30,50,94,.92),rgba(14,26,56,.92));box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .12s}
.tb svg{width:26px;height:26px}
.tb:active{transform:translateY(2px)}
.tb.hint{color:var(--k-warm);border-color:rgba(233,196,106,.45)}
.tb[disabled]{opacity:.4}
/* phone sideways and other short wide screens: notes and buttons at the left, map at the right */
@media (orientation:landscape) and (max-height:560px){
  #app{padding-top:calc(72px + var(--k-safe-t));padding-left:calc(12px + env(safe-area-inset-left,0px));padding-right:calc(12px + env(safe-area-inset-right,0px))}
  #play{flex-direction:row;gap:14px;align-items:stretch}
  .side{display:flex;flex-direction:column;gap:8px;width:min(330px,42%);height:100%;justify-content:center}
  .bar,.coach,.tools{width:100%}
  .tools{flex-wrap:wrap}.tb{flex:1 1 40%;max-width:none;min-height:52px}
  .coach p{font-size:15px}
  .mcard{padding:14px 18px}.emb{display:none}.mcard h1{font-size:24px}.mcard .lead{font-size:14.5px;margin-bottom:6px}
  .week{margin:2px 0 8px}.mbtns{max-width:none;display:grid;grid-template-columns:1fr 1fr}.mbtns .k-btn{min-height:46px;font-size:16px}.k-btn small,.mfoot{display:none}.wd i{width:28px;height:28px}
}
/* lines, crosses, pins, numbers */
.gl{stroke:rgba(90,60,25,.38);stroke-width:.03;stroke-dasharray:.045 .085;stroke-linecap:round}
.ln{stroke:var(--tm-ink);stroke-width:.13;stroke-linecap:round;opacity:0}
.ln.on{opacity:1}
.ln.new{stroke-dasharray:1;animation:ink .22s ease-out}
@keyframes ink{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.xx{stroke:#a8402a;stroke-width:.055;stroke-linecap:round;opacity:0}
.xx.on{opacity:.9}
.pin{fill:url(#tmPinG);stroke:rgba(60,35,10,.55);stroke-width:.018}
.pin.bad{fill:#d9452f}
.num{font-size:.56px;fill:var(--tm-ink);transition:fill .2s}
.num.met{fill:#14776d}
.num.over{fill:#c0392b}
#bd.won .num{opacity:.3;transition:opacity .8s}
.ring{fill:none;stroke:#ffb020;stroke-width:.07;animation:ringP 1s ease-in-out infinite}
@keyframes ringP{0%,100%{stroke-opacity:1;stroke-width:.07}50%{stroke-opacity:.45;stroke-width:.12}}
.land{animation:landIn .9s ease both}
@keyframes landIn{from{opacity:0}to{opacity:1}}
.palm{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
.chest{transform-box:fill-box;transform-origin:50% 100%;animation:pop .55s 1s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:translateY(-1px) scale(0);opacity:0}to{transform:none;opacity:1}}
.coin{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;pointer-events:none;z-index:3;
  background:radial-gradient(circle at 35% 30%,#fff3b8,#f0c341 45%,#b8860b);box-shadow:0 0 0 1px #8a6408 inset;animation:coin 1.4s ease-out forwards}
@keyframes coin{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
/* result sheet */
.patch{display:flex;align-items:center;gap:12px;margin:6px 0 10px;padding:10px 12px;border-radius:16px;background:rgba(22,158,154,.14);border:1px solid rgba(95,209,193,.4)}
.patch svg{width:58px;height:58px;flex:none}
.patch p{margin:0;font-size:15.5px}
.fact{margin:8px 0 4px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--k-line)}
.fact b{display:block;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--k-teal);margin-bottom:2px}
.fact span{font-size:15px;line-height:1.4;color:#dbe6f3}
.rb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rb .k-btn{min-height:50px;font-size:16px;padding:0 10px}
.rb .wide{grid-column:1/-1}
@media (max-height:700px){.k-sheet{padding:20px 18px 16px}.k-sheet h2{font-size:23px}.fact span{font-size:14px}.patch svg{width:48px;height:48px}}
</style>

<script id="tmCore">
/* ===== The Map Room core (rules, graded solver, daily picker): shared by the page and the tools =====
   An n x n chart of the sea, with a brass pin at every grid corner. Draw ONE closed coastline along the lines between
   the pins: no branches, no crossings, no loose ends. A number tells how many of its square's four sides the coast
   runs along. Every daily chart is worked out step by step with no guessing by a careful-cartographer solver that
   scores each kind of reasoning it needs (so every chart has exactly one answer). The score sets the day; the same
   solver drives the hints. The daily charts come from a graded pool grown offline (tools/maproom/grow.js) and are
   "dressed" for the date by turning or flipping the chart, which never changes the reasoning needed. */
(function(root){
"use strict";
function rng(seed){ var h=1779033703^seed.length; for(var i=0;i<seed.length;i++){ h=Math.imul(h^seed.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function shuffle(a,r){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- geometry: edges, the pins (vertices) they join, the squares beside them ---------- */
var GEO={};
function geom(n){
  if(GEO[n]) return GEO[n];
  var HN=(n+1)*n, E=2*HN, V=(n+1)*(n+1), i, r, c;
  function H(r,c){ return r*n+c; } function Vt(r,c){ return HN+r*(n+1)+c; } function P(r,c){ return r*(n+1)+c; }
  var cellE=[], vertE=[], edgeV=[], edgeC=[], corner=[];
  for(i=0;i<V;i++) vertE.push([]);
  for(i=0;i<E;i++) edgeC.push([]);
  for(r=0;r<=n;r++) for(c=0;c<n;c++){ var e=H(r,c); edgeV[e]=[P(r,c),P(r,c+1)]; vertE[P(r,c)].push(e); vertE[P(r,c+1)].push(e); }
  for(r=0;r<n;r++) for(c=0;c<=n;c++){ var e2=Vt(r,c); edgeV[e2]=[P(r,c),P(r+1,c)]; vertE[P(r,c)].push(e2); vertE[P(r+1,c)].push(e2); }
  for(r=0;r<n;r++) for(c=0;c<n;c++){ var ci=r*n+c, L=[H(r,c),H(r+1,c),Vt(r,c),Vt(r,c+1)]; cellE.push(L); L.forEach(function(x){ edgeC[x].push(ci); });
    /* its four corners: the pin, the square's two sides at that pin, and the pin's other paths (outward) */
    var cs=[[P(r,c),H(r,c),Vt(r,c)],[P(r,c+1),H(r,c),Vt(r,c+1)],[P(r+1,c),H(r+1,c),Vt(r,c)],[P(r+1,c+1),H(r+1,c),Vt(r,c+1)]];
    corner.push(cs.map(function(k){ return {v:k[0],a:k[1],b:k[2],out:vertE[k[0]].filter(function(x){ return x!==k[1]&&x!==k[2]; })}; })); }
  return (GEO[n]={n:n,HN:HN,E:E,V:V,cellE:cellE,vertE:vertE,edgeV:edgeV,edgeC:edgeC,corner:corner,H:H,Vt:Vt,P:P});
}

/* ---------- the careful cartographer ----------
   Edge states: 0 not yet known, 1 coast, -1 sea (a cross). Each rule finds one step; LVL is the hardest rule allowed.
   1 count:  a number with all its coast, or needing every side it has left; a pin with the coast through it, or one way on
   2 loop:   a line that would close a small loop while other coast is left out
   3 corner: a 1 or 3 tucked into a corner the coast can't leave by
   4 ahead:  try a line (or a cross) and follow the simple steps until the coast breaks */
var COST={count:1,loop:3,corner:4,ahead:14};
function solver(G,clue){
  var n=G.n, E=G.E;
  function bad(){ return {k:"bad"}; }
  function cellStep(s,i){
    var q=clue[i]; if(q<0) return null; var L=G.cellE[i], on=0, un=[];
    for(var j=0;j<4;j++){ var x=s[L[j]]; if(x===1) on++; else if(x===0) un.push(L[j]); }
    if(on>q||on+un.length<q) return bad();
    if(!un.length) return null;
    if(on===q) return {k:"full",lvl:1,cell:i,set:un.map(function(e){ return [e,-1]; })};
    if(on+un.length===q) return {k:"need",lvl:1,cell:i,set:un.map(function(e){ return [e,1]; })};
    return null;
  }
  function vertStep(s,v){
    var L=G.vertE[v], on=0, un=[];
    for(var j=0;j<L.length;j++){ var x=s[L[j]]; if(x===1) on++; else if(x===0) un.push(L[j]); }
    if(on>2||(on===1&&!un.length)) return bad();
    if(!un.length) return null;
    if(on===2) return {k:"vfull",lvl:1,v:v,set:un.map(function(e){ return [e,-1]; })};
    if(on===1&&un.length===1) return {k:"vgo",lvl:1,v:v,set:[[un[0],1]]};
    if(on===0&&un.length===1) return {k:"vdead",lvl:1,v:v,set:[[un[0],-1]]};
    return null;
  }
  /* path pieces: which pins the coast lines join (union-find), and how many lines in each piece */
  function pieces(s){
    var par=new Int32Array(G.V), cnt=new Int32Array(G.V), i;
    for(i=0;i<G.V;i++) par[i]=i;
    function f(x){ while(par[x]!==x){ par[x]=par[par[x]]; x=par[x]; } return x; }
    var cyc=0;
    for(i=0;i<E;i++) if(s[i]===1){ var a=f(G.edgeV[i][0]), b=f(G.edgeV[i][1]); if(a===b){ cyc++; cnt[a]++; } else { par[a]=b; cnt[b]+=cnt[a]+1; } }
    return {f:f,cnt:cnt,cyc:cyc};
  }

/* ---------------- hints: the captain's spyglass ---------------- */

function plural(q,w){ return q+" "+w+(q===1?"":"s"); }
function hintText(s,on,cl){
  var q=s.cell!=null?cl[s.cell]:0;
  switch(s.k){
    case "full": return q===0?"A <b>0</b> means no coast touches this square. Put an <b>X</b> on every side that's still open.":"This <b>"+q+"</b> already has "+plural(q,"coast line")+". Its other sides are sea, so put <b>X</b>'s there.";
    case "need": return "This <b>"+q+"</b> needs "+plural(q,"coast line")+", and that's exactly how many sides are left open. Draw lines on all of them!";
    case "vfull": return "Two lines already meet at this pin. The coast can't branch, so the other paths from it are sea.";
    case "vgo": return "The coast comes into this pin, and there's only <b>one way</b> to go on. Keep drawing!";
    case "vdead": return "Only one path is left at this pin. A coast can't stop at a dead end, so that path is sea.";
    case "loop": return "Careful! A line here would close a <b>little loop</b> and leave the rest of the coast out. Put an <b>X</b> here.";
    case "close": return "This line closes the coast into <b>one big loop</b>. Draw it!";
    case "done": return "The coast is all drawn! Every other side is sea.";
    case "c1": return "This <b>1</b> sits in a corner the coast can't get out of. So its two corner sides are sea.";
    case "c3": return "This <b>3</b> sits in a corner the coast can't get out of, so both of its corner sides must be coast.";
    case "ahead": return "Let's think ahead! If this side were "+(s.tried===1?"coast":"sea")+", the coast would break somewhere. So it must be <b>"+(s.tried===1?"sea (an X)":"coast (a line)")+"</b>!";
  }

}
function hint(){
  if(!P||solved||locked) return; clearRing(); sfx("hint");
  var wrong=-1, e;
  for(e=0;e<G.E;e++){ if(st[e]===1&&P.sol[e]!==1){ wrong=e; break; } if(st[e]===-1&&P.sol[e]===1){ wrong=e; break; } }
  if(wrong>=0){ ringEdge(wrong); var was=st[wrong];
    pend={hint:true,set:[[wrong,was===1?0:1]]};
    coach({t:"Spyglass",h:true,txt:was===1?"Oops! This line isn't part of the coast. Tap it until it's clear.":"Oops! This side is really coast, so it needs a <b>line</b>, not an X.",btn:"Fix it for me"}); return; }
  var s=MR.solver(G,cluesNow()).step(Int8Array.from(st),4);
  if(!s||s.k==="bad"){ pend={hint:true,set:[]}; coach({t:"Spyglass",h:true,txt:"Everything you've drawn is right! Keep going.",btn:null}); return; }
  s.set.forEach(function(x){ ringEdge(x[0]); }); if(s.cell!=null) ringCell(s.cell); if(s.v!=null) ringPin(s.v);
  pend={hint:true,set:s.set};
  var tx=hintText(s,0,cluesNow()); coach({t:"Spyglass",h:true,txt:tx,btn:"Do it for me"}); BWK.say(tx.replace(/<[^>]+>/g,""));
}
function doHint(){ if(!pend) return; var g=[], fresh=[]; pend.set.forEach(function(x){ if(setE(x[0],x[1],g)&&x[1]===1) fresh.push(x[0]); });
  pend=null; el.ring.innerHTML=""; coach(null); if(g.length){ undo.push(g); sfx(g.some(function(x){ return st[x[0]]===1; })?"line":"cross"); } draw(fresh); after(true); }

/* ---------------- loading a map ---------------- */
function load(p,mode,saved){

  if(!P.sol){ var g=MR.solver(MR.geom(P.n),P.showAll?P.all:P.clue).run(4); P.sol=g.s; }
  document.body.className="m-play"; build();
  st=saved&&saved.length===G.E?Int8Array.from(saved):new Int8Array(G.E);
  draw(); lastMet=metCount(); $("#tUndo").disabled=true; $("#tHint").disabled=false;
  var b=$("#bar");
  if(mode==="daily") b.innerHTML=WDN[todayWd]+"'s Map <span>· "+P.isle+" · "+P.n+" × "+P.n+"</span>";
  else if(mode==="practice") b.innerHTML="Practice Map <span>· "+P.n+" × "+P.n+"</span>";
  else b.innerHTML="Learn to Play";
  coach(null); requestAnimationFrame(fit);
  if(saved&&isSolved()){ solved=true; locked=true; showLand(st,true); if(mode!=="lesson") svg.classList.add("won"); }
}
function loadToday(){
  var p=tmForDay(todayKey,todayWd), dn=tmDayNum(todayKey); p.isle=ISLES[((dn%ISLES.length)+ISLES.length)%ISLES.length];
  var sv=ST.now&&ST.now.key===todayKey?ST.now.st:null;
  sfx("unroll"); load(p,"daily",sv);
  if(!sv) BWK.say(WDN[todayWd]+"'s map. "+p.isle+". Draw the coast all the way around the island.");
}
function loadPractice(){
  var n=Math.random()<.5?4:5, p=MR.make("practice"+Date.now(),{n:n,lvl:2,keep:n===4?9:12}); sfx("unroll"); load({n:n,clue:p.clue,lvl:2},"practice");
}

/* ---------------- treasure found ---------------- */
var PATCH='<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="27" fill="#169e9a" stroke="#0c5f5c" stroke-width="3"/><circle cx="30" cy="30" r="23" fill="none" stroke="#bff3ea" stroke-width="1.5" stroke-dasharray="3 3"/><path d="m15 33 22-10 3 6-22 10z" fill="#e9c46a"/><path d="m37 23 5-2 3 6-5 2z" fill="#f6dd96"/><path d="M26 38l-3 9M28 37l4 9" stroke="#e9c46a" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="18" r="2" fill="#fff"/><circle cx="44" cy="40" r="1.5" fill="#fff"/></svg>';
function win(){
  solved=true; locked=true; clearRing(); $("#tHint").disabled=true; svg.classList.add("won");
  if(P.mode==="lesson"){ sfx("lesson"); showLand(st,true); coins(); lessonDone(); return; }
  sfx("solve"); showLand(st,true); coins();
  var fresh=false, first=false;
  if(P.mode==="daily"){ if(!ST.done[todayKey]){ ST.done[todayKey]=1; first=true; } save();
    var bd=LS.get("badges",{}); if(!bd||typeof bd!=="object") bd={}; if(!bd.tele){ bd.tele=true; LS.set("badges",bd); fresh=true; } }
  var s=BWK.seat(), who=s&&s.name?s.name:"Captain";
  var dn=tmDayNum(todayKey)+(P.mode==="practice"?Math.floor(Math.random()*7):0), fact=FACTS[((dn%FACTS.length)+FACTS.length)%FACTS.length];
  setTimeout(function(){
    var box=BWK.sheet('<h2>Treasure found!</h2><p>Great job, '+who.replace(/</g,"")+'! '+(P.mode==="daily"?'You drew the whole coast of <b>'+P.isle+'</b>.':'You drew the whole coast.')+'</p>'+
      (fresh?'<div class="patch">'+PATCH+'<p><b style="color:var(--k-warm)">New patch!</b> The Telescope patch is on your badge wall.</p></div>':'')+
      '<div class="fact"><b>Map fact</b><span>'+fact+'</span></div>'+
      (P.mode==="daily"?'<p class="k-small" style="margin:8px 0 0">Maps found: '+foundCount()+'. '+(todayWd===0?'A brand-new week of maps starts tomorrow!':'A new map washes up tomorrow.')+'</p>':'')+
      '<div class="rb"><button class="k-btn wide" id="rOut">Back to The Outpost</button><button class="k-btn k-cool" id="rPr">Practice Map</button><button class="k-btn k-ghost" id="rLook">See my map</button></div>');
    box.querySelector("#rOut").onclick=goOutpost;
    box.querySelector("#rPr").onclick=function(){ BWK.closeSheet(true); loadPractice(); };
    box.querySelector("#rLook").onclick=function(){ BWK.closeSheet(true); coach({t:"Treasure found",txt:"What a map! Tap <b>Menu</b> when you're ready.",btn:null}); };
    BWK.say("Treasure found! Great job, "+who+"!"+(fresh?" New patch! The Telescope patch is on your badge wall.":"")+" Map fact: "+fact);
  },2300);
}

/* ---------------- Learn to Play ---------------- */
var LISL=[0,0,0,0, 0,1,1,0, 0,1,1,1, 0,0,1,0];
var LP=[
  {look:true,nums:false,txt:"A storm washed the coastline off Captain Zayden's map! Your job: draw <b>one path</b> along the dotted lines, all the way around the island. It must join up into <b>one loop</b>: no branches and no loose ends."},
  {look:true,nums:true,ring:[4,5],txt:"Numbers are clues. A number tells how many sides of its square are coast. <b>Numbers can be out in the sea, too!</b> This sea 1 touches the coast on one side. This land 2 touches it on two sides."},
  {try:"zero",ring:[0],txt:"A <b>0</b> means no coast touches that square. Tap a side once to draw a line. Tap it again for an <b>X</b>, which means sea. Put an <b>X</b> on all four sides of this 0."},
  {try:"solve",txt:"Now draw the whole coast! Tip: a brass pin has <b>no lines or two lines</b>, never one or three. You can also drag your finger from pin to pin."},
  {end:true,look:true,txt:"You're ready, Captain! If you get stuck, tap <b>Hint</b>: the spyglass shows the next step. A new map washes up every day. Monday's map is small, and by Sunday they're big and tricky!"}
];
var lpage=0, lessonSt=null;
function lessonSolution(){ var g=MR.geom(4), s=new Int8Array(g.E); for(var e=0;e<g.E;e++){ var cs=g.edgeC[e], a=cs[0]!=null?LISL[cs[0]]:0, b=cs.length>1?LISL[cs[1]]:0; s[e]=a!==b?1:-1; } return s; }
function startLesson(){ lpage=0; lessonSt=null; showLesson(); }
function showLesson(){
  var pg=LP[lpage], all=MR.numbers(4,LISL), sol=lessonSolution();
  var hidden=all.map(function(){ return -1; });
  load({n:4,clue:pg.nums===false?hidden:all,all:all,showAll:false,sol:sol},"lesson", pg.look?Array.from(sol).map(function(v){ return v===1?1:0; }):(lpage===3&&lessonSt?lessonSt:null));
  if(pg.look){ locked=true; showLand(sol,!!pg.end); $("#tHint").disabled=true; $("#tUndo").disabled=true; }
  if(pg.ring) pg.ring.forEach(ringCell);
  lessonCard(); BWK.say(pg.txt.replace(/<[^>]+>/g,"")+(pg.look&&!pg.end?" Just look for now, then tap Next.":""));
}
function lessonCard(){
  var pg=LP[lpage], c=$("#coach"), t="Learn to Play · "+(lpage+1)+" of "+LP.length;
  var txt=pg.txt+(pg.look&&!pg.end?" Just look for now, then tap <b>Next</b>.":"");
  if(pg.end){ coach2({t:t,txt:txt,btn:"Today's Map",go:function(){ ST.lesson=1; save(); loadToday(); },btn2:"Menu",go2:function(){ ST.lesson=1; save(); toMenu(); }}); return; }
  coach2({t:t,txt:txt,btn:pg.look||pg.doneNow?"Next":null,go:nextPage});
}
function coach2(o){ var keepP=P; coach(o); }
function nextPage(){ sfx("next"); if(lpage===2) lessonSt=Array.from(st); LP[lpage].doneNow=false; lpage++; showLesson(); }
function lessonCheck(){
  var pg=LP[lpage]; if(pg.try==="zero"){ var ok=G.cellE[0].every(function(e){ return st[e]===-1; });
    if(ok&&!pg.doneNow){ pg.doneNow=true; el.ring.innerHTML=""; sfx("lesson"); coach2({t:"Learn to Play · 3 of 5",txt:"Nice! Those X's mean sea. No coast can touch a 0. Tap <b>Next</b>.",btn:"Next",go:nextPage}); BWK.say("Nice! Those X's mean sea. Tap Next."); } }
}
function lessonDone(){ var pg=LP[lpage]; pg.doneNow=true; coach2({t:"Learn to Play · 4 of 5",txt:"You found the treasure! That's the whole game. Tap <b>Next</b>.",btn:"Next",go:nextPage}); BWK.say("You found the treasure! Tap Next."); }

/* ---------------- menu ---------------- */
function weekRow(){
  var w=$("#week"), d=new Date(today); d.setDate(d.getDate()-((d.getDay()+6)%7)); var h="";
  for(var i=0;i<7;i++){ var k=ymd(d), wd=d.getDay(), done=!!ST.done[k], cls="wd"+(k===todayKey?" today":"")+(done?" done":"");
    h+='<div class="'+cls+'"><b>'+"SMTWTFS"[wd]+'</b><i>'+(done?"✕":TM_WEEK[wd].n)+'</i></div>'; d.setDate(d.getDate()+1); }
  w.innerHTML=h;
}
function toMenu(){
  document.body.className="m-menu"; P=null; weekRow();
  var done=!!ST.done[todayKey], sp=TM_WEEK[todayWd];
  $("#bToday").innerHTML=(done?"Today's Map ✓":"Today's Map")+'<small>'+WDN[todayWd]+' · '+sp.n+' × '+sp.n+'</small>';
  $("#bLearn").classList.toggle("pulse",!ST.lesson);
  var n=foundCount(); $("#mfoot").textContent=n?("Maps found: "+n+". Each map is a little harder than the day before, all week long."):"Each day's map is a little harder than the day before, all week long.";
}
function goOutpost(){ BWK.closeSheet(true); BWK.sfx("whoosh"); setTimeout(function(){ location.href="outpost.html"; },200); }
$("#bToday").onclick=function(){ loadToday(); };
$("#bLearn").onclick=function(){ sfx("next"); startLesson(); };
$("#bPractice").onclick=function(){ loadPractice(); };
$("#bBack").onclick=goOutpost;
$("#tHint").onclick=hint;
$("#tUndo").onclick=function(){ var g=undo.pop(); if(!g||locked) { if(g) undo.push(g); return; } for(var i=g.length-1;i>=0;i--) st[g[i][0]]=g[i][1]; sfx("clear"); clearRing(); draw(); after(false); };
$("#tRestart").onclick=function(){ if(!P) return; if(P.mode==="lesson"){ if(LP[lpage].look) return; LP[lpage].doneNow=false; lessonSt=null; showLesson(); sfx("unroll"); return; }
  if(solved&&P.mode==="daily"){ coach({t:"Treasure found",txt:"You already found today's treasure! Try a <b>Practice Map</b> from the menu.",btn:null}); return; }
  var g=[]; for(var e=0;e<G.E;e++) setE(e,0,g); if(g.length) undo.push(g); solved=false; locked=false; el.land.innerHTML=""; clearRing(); sfx("unroll"); draw(); after(false); };
$("#tMenu").onclick=function(){ BWK.sfx("tap"); clearRing(); toMenu(); };

toMenu();
BWK.init({here:"tmap", helloWord:"Ahoy, ",
  intro:"Captain Zayden's Map. A storm washed the coastlines off the captain's island maps. Draw each coast back to find the treasure. Tap Learn to Play to see how."});
/* test hook */
window.TMO={load:load,today:loadToday,lesson:startLesson,practice:loadPractice,st:function(){ return st; },P:function(){ return P; },sol:function(){ return P&&P.sol; },
  set:function(a){ for(var i=0;i<a.length;i++) st[i]=a[i]; draw(); after(true); }};
})();
</script>
</body>
