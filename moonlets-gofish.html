/* ==========================================================================
   BrainWhim · Moonlets: Go Fish (Nov 18, 2026), a Moon Games card game by a sunny lily pond in the late afternoon.
   Story: Finn's animal friends sit on the dock by the pond with a deck of animal cards (the 13 photo animals,
   sl/c-*.webp). The face-down cards float in the pond. Real Go Fish rules:
   Little: you and one friend, 8 animals x 2 cards, 5 cards each; make PAIRS. Tap a card to ask "Do you have a fox?".
     The friend gives you all of them (go again), or says "Go fish!": tap the pond to fish a card. Fish the one you
     asked for: go again. When a friend asks you, your matching cards glow: tap them to give, or tap Go fish.
   Big Moonlet: you and two friends, all 13 animals x 4 = 52 cards, 7 each; make SETS of four. Tap a card, then
     tap the friend to ask. No glow when a friend asks you (honesty check: "Look again!"). Each friend's last ask
     shows under them (the memory trick). Friends remember asks 3 times in 10 (sim: a kid with a good memory wins
     ~1 in 3 against two friends; Little is luck, ~1 in 2).
   An empty hand fishes one card first. Most sets wins. First game: a look-only How to play (3 pictures).
   Pictures (Judy, ChatGPT; BrainWhim-GoFish-Prompts): gf/bg(.jpg, -sm), gf/water(.jpg, -sm), gf/back, gf/face,
   gf/dock, gf/basket, gf/fish (.webp); each switches on when its file loads. Drawn stand-ins until then.
   Saved: bwk.gofish {games, wins, seen}. Lines gf-*. Test hook GFO.
   ========================================================================== */

  padding:calc(84px + var(--k-safe-t)) 10px calc(10px + var(--k-safe-b))}

      if(!os.length){ friendFish(pi,kind); return; } opp=os[Math.random()*os.length|0]; }
    ask(pi,opp,kind); }
  function ask(pi,oi,kind){ var a=G.P[pi], o=G.P[oi]; G.ph="asking"; G.want={p:pi,o:oi,kind:kind}; if(pi>0) a.asked=kind; G.know[kind]=pi;
    render(); SND.ask(); bubble(pi,(pi>0&&big?"Hey "+(oi===0?"you":o.a.name)+"! ":"")+"Do you have a "+AN[kind].kind+"?",kind);
    if(oi>0) $("opp").querySelector('.fr[data-p="'+oi+'"]').classList.add("turn");
    sayThen(ASK(kind),"gf-a-"+AN[kind].kind,function(){
      if(oi===0){ G.ph="give"; render(); if(!big&&count(G.P[0],kind)) sayQ(GIVE,"gf-give"); else if(!big) sayQ(NONE,"gf-none"); idle(); return; }
      answer(); },4500,pi===0); }
  /* the asked friend answers */
  function answer(){ var w=G.want, o=G.P[w.o], n=count(o,w.kind);
    if(n){ give(w.o,w.p,w.kind); return; }
    bubble(w.o,"Go fish!"); SND.splash();
    if(w.p===0){ G.ph="fish"; G.emptyFish=false; render(); later(function(){ sayQ(FISH,"gf-fish"); idle(); },300); }
    else{ G.ph="wait"; render(); later(function(){ friendFish(w.p,w.kind); },1300); } }
  function give(from,to,kind){ var n=count(G.P[from],kind), src=from===0?($("hand").querySelector('.grp[data-k="'+kind+'"]')||$("hand")):elOf(from);
    G.P[from].hand=G.P[from].hand.filter(function(x){ return x!==kind; }); G.know[kind]=to;
    if(from>0) bubble(from,"Here you go!",kind); G.ph="moving"; render();
    for(var j=0;j<n;j++) (function(j){ later(function(){ SND.flick(); fly(src,elOf(to),(to===0||from===0)?kind:null,480,function(){ G.P[to].hand.push(kind); if(j===n-1){ render(); fit(); } }); },j*130); })(j);
    later(function(){ var go=function(){ layAll(to,function(){ turn(); }); };
      if(to===0) sayThen(n>1?AGAIN:YES,n>1?"gf-again":"gf-yes",go,3500); else go(); }, n*130+700); }
  /* fishing */
  function drawTo(pi,srcEl,cb){ var k=G.deck.pop(), src=srcEl||pondCard(); ripple(src); jump(src); SND.splash();
    G.ph="moving"; render();
    fly(src,elOf(pi),pi===0?k:null,560,function(){ G.P[pi].hand.push(k); SND.plop(); if(G.deck.length<G.spots.length&&G.deck.length>0) {} render(); fit(); cb(k); }); }
  function friendFish(pi,kind){ if(!G.deck.length){ next(); return; }
    drawTo(pi,null,function(k){
      if(kind!=null&&k===kind){ bubble(pi,"Lucky!",k); sayThen(FLUCKY,"gf-flucky",function(){ layAll(pi,function(){ turn(); }); },3000); }
      else layAll(pi,function(){ if(kind==null) turn(); else next(); }); }); }
  function myFish(el){ if(G.ph!=="fish"||!G.deck.length) return; var w=G.want, emp=G.emptyFish; G.emptyFish=false;
    drawTo(0,el,function(k){
      if(emp){ layAll(0,function(){ turn(); }); return; }
      if(w&&k===w.kind){ bubble(0,"Lucky!",k); SND.pair(); sayThen(LUCKY,"gf-lucky",function(){ layAll(0,function(){ turn(); }); },3000); }
      else layAll(0,function(){ next(); }); }); }
  /* my answer to a friend */
  function myGive(k){ var w=G.want; if(G.ph!=="give"||!w) return;
    if(k!==w.kind){ var g=$("hand").querySelector('.grp[data-k="'+k+'"]'); if(g){ g.classList.remove("no"); void g.offsetWidth; g.classList.add("no"); } SND.no(); say(NOTIT,"gf-notit"); return; }
    give(0,w.p,k); }
  function myGoFish(){ var w=G.want; if(G.ph!=="give"||!w) return;
    if(count(G.P[0],w.kind)){ SND.no(); say(LOOK,"gf-look"); var g=$("hand").querySelector('.grp[data-k="'+w.kind+'"]'); if(g&&!big){ g.classList.add("nudge"); } return; }
    G.ph="moving"; bubble(0,"Go fish!"); render(); sayThen(GOFISH,"gf-gofish",function(){ friendFish(w.p,w.kind); },1800); }
  function finish(){ G.ph="done"; G.want=null; var best=-1, who=[];
    G.P.forEach(function(p,i){ if(p.sets.length>best){ best=p.sets.length; who=[i]; } else if(p.sets.length===best) who.push(i); });
    S.games++; if(who.length===1&&who[0]===0) S.wins++; save(); BWK.played&&BWK.played("gofish"); render();
    if(who.length===1&&who[0]===0){ SND.win(); sayQ(WIN,"gf-win"); }
    else if(who.length>1&&who.indexOf(0)>=0){ SND.soft(); sayQ(TIE,"gf-tie"); }
    else { SND.soft(); var a=G.P[who[0]].a; sayQ(LOSE(a),"gf-l-"+a.id); } }

  /* ---------- taps ---------- */
  var lastPd=0;
  function onTap(el,fn){ el.addEventListener("pointerdown",function(e){ if(e.button>0) return; lastPd=Date.now(); fn(e); });
    el.addEventListener("click",function(e){ if(Date.now()-lastPd<800) return; fn(e); }); }
  onTap($("hand"),function(e){ var b=e.target.closest(".grp"); if(!b||!G) return; var k=+b.dataset.k; lastAct=Date.now();
    if(G.ph==="ask"&&G.cur===0){
      if(!big){ BWK.sfx("tap"); ask(0,1,k); return; }
      G.sel=k; G.ph="pick"; render(); say(WHO,"gf-who"); return; }
    if(G.ph==="pick"){ G.sel=k; render(); return; }
    if(G.ph==="give") myGive(k); });
  onTap($("opp"),function(e){ var f=e.target.closest(".fr"); if(!f||!G||G.ph!=="pick"||G.sel==null) return; var i=+f.dataset.p; if(!G.P[i].hand.length) return;
    lastAct=Date.now(); var k=G.sel; G.sel=null; ask(0,i,k); });
  onTap($("pond"),function(e){ var c=e.target.closest(".pc"); if(!G||G.ph!=="fish") return; lastAct=Date.now(); myFish(c||null); });
  /* waiting for me: after a while, a little wiggle on what to tap (no voice) */
  function idle(){ lastAct=Date.now(); clearInterval(idleT); idleT=setInterval(function(){ if(!G) return; if(Date.now()-lastAct<6000) return; lastAct=Date.now();
    var t=G.ph==="fish"?$("pond").querySelectorAll(".pc .cd"):G.ph==="ask"?$("hand").querySelectorAll(".grp"):G.ph==="pick"?$("opp").querySelectorAll(".fr"):G.ph==="give"?$("bar").querySelectorAll(".chip.go"):[];
    [].forEach.call(t,function(x){ x.classList.remove("nudge"); void x.offsetWidth; x.classList.add("nudge"); setTimeout(function(){ x.classList.remove("nudge"); },1300); }); },1000); }
  document.addEventListener("pointerdown",function(){ lastAct=Date.now(); },true);

  /* ---------- How to play (look-only; first game, or the ? button) ---------- */
  function how(){ var k=[0,4,9]; $("howSt").innerHTML=
      '<div><span class="pic">'+cardF(k[1])+'<i class="q">?</i></span><p>'+H1+'</p></div>'+
      '<div><span class="pic">'+(big?cardF(k[1])+cardF(k[1])+cardF(k[1])+cardF(k[1]):cardF(k[1])+cardF(k[1]))+'</span><p>'+(big?BH2:H2)+'</p></div>'+
      '<div><span class="pic"><span class="mini-pond">'+cardB()+cardB()+'</span></span><p>'+H3+'</p></div>';
    $("how").querySelectorAll("#howSt .pic").forEach(function(p,i){ if(big&&i===1) p.style.setProperty("--cw","34px"); });
    $("how").hidden=false; say(H1,"gf-h1",{onend:function(){ if($("how").hidden) return; say(big?BH2:H2,big?"gf-bh2":"gf-h2",{onend:function(){ if(!$("how").hidden) say(H3,"gf-h3"); }}); }}); }
  $("howGo").onclick=function(){ BWK.sfx("tap"); BWK.finnStop(); $("how").hidden=true; S.seen=1; save(); if(G.ph==="ready") deal(); };

  /* ---------- the bottom row (no data-say: these make Finn talk or redraw the row, Nov 17) ---------- */
  function bar(){ var ph=G?G.ph:"ready", h="";
    if(ph==="give") h+='<button class="chip go pulse" data-a="gofish" aria-label="Go fish"><em>🎣</em><span>Go fish!</span></button>';
    else if(ph==="ready") h+='<button class="chip go pulse" data-a="deal" aria-label="Deal"><em>🂠</em><span>Deal</span></button>';
    else if(ph==="done") h+='<button class="chip go pulse" data-a="again" aria-label="Play again"><em>↺</em><span>Play again</span></button>';
    else h+='<button class="chip" data-a="again" aria-label="New game"><em>↺</em><span>New game</span></button>';
    h+='<button class="chip" data-a="how" aria-label="How to play"><em>?</em><span>How to play</span></button>'+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="games" aria-label="More games"><em>☾</em><span>More games</span></button>';
    $("bar").innerHTML=h; }
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b||!G) return; BWK.sfx("tap"); lastAct=Date.now(); var a=b.dataset.a;
    if(a==="deal"){ BWK.finnStop(); if(!S.seen) how(); else deal(); }
    else if(a==="again"){ newGame(); deal(); }
    else if(a==="gofish") myGoFish();
    else if(a==="how") how();
    else if(a==="big"){ big=!big; talked=true; BWK.setBig(big,top); newGame(); }
    else if(a==="games"){ BWK.finnStop(); BWK.sfx("whoosh"); setTimeout(function(){ location.href="moonlets-games.html"; },200); } });
  window.addEventListener("bwk-big",function(e){ if(!!e.detail!==big){ big=!!e.detail; newGame(); } });
  document.addEventListener("click",function(e){ if(talked||!e.target.isConnected||e.target.closest("#pond,#hand,#opp,#how,.chip,.k-head,.k-sheet,.k-veil")) return; say(big?BHI:HI,big?"gf-bhi":"gf-hi"); });

  newGame();
  window.GFO={newGame:newGame, deal:deal, big:function(v){ big=!!v; BWK.setBig(big); newGame(); },
    state:function(){ return G&&{ph:G.ph, cur:G.cur, deck:G.deck.length, want:G.want, sets:G.P.map(function(p){ return p.sets.length; }), hands:G.P.map(function(p){ return p.hand.slice(); }), sel:G.sel}; },
    G:function(){ return G; }, myFish:function(){ myFish(pondCard()); }, myGive:myGive, myGoFish:myGoFish, ask:function(k,o){ if(big){ G.sel=k; G.ph="pick"; ask(0,o||1,k); } else ask(0,1,k); }};
})();
</script>
</body>
