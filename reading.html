/* ===== The Reading Room (Learn · The Library Wing, Nov 21, 2026): a five-minute lesson a day, three questions, a streak =====

  background:linear-gradient(90deg,#7a1424,#a8243a 45%,#7a1424);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);

(function(){

BACK.onclick=function(){ go(step-1,true); };
NEXT.onclick=function(){ if(NEXT.disabled) return; if(step>=lastStep()){ finish(); return; } go(step+1); };
document.addEventListener("keydown",function(e){
  if(!document.body.classList.contains("seated")||document.querySelector(".pk-veil.on")) return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var qi=step>nPages()+1?qIndex(step):-1;
  if(qi>=0&&picks[qi]==null&&/^[1-3abc]$/i.test(e.key)){ var k=/[1-3]/.test(e.key)?+e.key-1:"abc".indexOf(e.key.toLowerCase()); var b=SCROLL.querySelectorAll(".rr-a")[k]; if(b){ b.click(); e.preventDefault(); } return; }
  if(e.key==="ArrowRight"&&!NEXT.disabled){ NEXT.click(); e.preventDefault(); }
  else if(e.key==="ArrowLeft"&&step>0){ BACK.click(); e.preventDefault(); }
});

function load(d,m){
  day=d; mode=m; L=lessonFor(d); step=0; picks=[]; t0=0; finished=false;
  draw(); status(); if(window.Parlor&&Parlor.score) Parlor.score([0]);
  if(window.Parlor){ Parlor.info("No. "+dayNo(d)+" · "+niceDate(d)); Parlor.coach(null); }
}
function status(){
  if(!window.Parlor||!L) return;
  var head=mode==="archive"?"Past Lesson · "+shortDate(day):mode==="again"?"Reading Again":"Today's Lesson";
  var n=nPages(), sub=step===0?trackOf(day).name+" · about 5 minutes":step<=n?"Page "+step+" of "+n:step===n+1?"Remember This":"Question "+(qIndex(step)+1)+" of "+L.qs.length;
  Parlor.status(head,sub);
}
function go(s,back){
  s=Math.max(0,Math.min(lastStep(),s)); if(s===step) return;
  if(s>0&&!t0) t0=Date.now();
  step=s; snd(s===1&&!back?"rr-open":"rr-page",{back:!!back});
  draw(back); status();
}
function dots(){
  var h="", n=lastStep();
  for(var i=1;i<=n;i++) h+='<i class="'+(i>nPages()+1?"q":"")+(i===step?" on":"")+'"></i>';
  DOTS.innerHTML=step===0?"":h;
}
function draw(back){
  if(!L){ SCROLL.innerHTML='<p class="rr-kick">The Reading Room</p><h2 class="rr-title">A lesson is on its way</h2>'; FOOT.style.display="none"; return; }
  var n=nPages(), tr=trackOf(day), h="";
  if(step===0){
    var r=mode==="archive"?rec(ymd(day)):mode==="daily"?rec():null;
    h='<p class="rr-kick">'+esc(DAYS[day.getDay()])+' · '+esc(tr.name)+'</p><h2 class="rr-title">'+esc(L.title)+'</h2><p class="rr-dek">'+esc(L.dek)+'</p>'+
      '<div class="rr-rule"></div><p class="rr-tag">The Reading Room \u00b7 <span style="white-space:nowrap">A Fascinating Fact a Day</span></p><p class="rr-meta"><span><b>No. '+dayNo(day)+'</b> · '+esc(niceDate(day))+'</span><span>'+n+' short pages · 3 questions · about 5 minutes</span></p>'+
      (r?'<p class="rr-done">✓ Read'+(mode==="daily"?" today":"")+' · '+r.s+' of 3 right</p>':"")+
      '<div class="rr-row"><button class="rr-btn" type="button" data-a="begin">'+(r?"Read It Again":"Begin Reading")+'</button>'+
      (mode==="daily"?'<button class="rr-btn gh" type="button" data-a="past">Past Lessons</button>':'<button class="rr-btn gh" type="button" data-a="today">Today’s Lesson</button>')+'</div>';
  } else if(step<=n){
    var pg=L.pages[step-1];
    h='<p class="rr-kick">'+esc(L.title)+'</p><h3 class="rr-h">'+esc(pg.h)+'</h3><div class="rr-text">'+pg.p.map(function(p){ return "<p>"+esc(p)+"</p>"; }).join("")+'</div>';
  } else if(step===n+1){
    h='<p class="rr-kick">'+esc(L.title)+'</p><h3 class="rr-h">Remember This</h3><p class="rr-remember">'+esc(L.remember)+'</p>'+
      '<div class="rr-text" style="margin-top:16px"><p>Now three quick questions. Take your time: the pages are only a tap back.</p></div>';
  } else {
    var qi=qIndex(step), Q=L.qs[qi], o=order(L,qi), pk=picks[qi];
    h='<p class="rr-kick">Check Yourself · '+(qi+1)+' of '+L.qs.length+'</p><p class="rr-q">'+esc(Q.q)+'</p><div class="rr-ans">'+
      o.map(function(ai,k){
        var cls=pk==null?"":ai===Q.c?" right":ai===pk?" wrong":" dim";
        return '<button class="rr-a'+cls+'" type="button" data-ai="'+ai+'"'+(pk!=null?" disabled":"")+'><i>'+"ABC"[k]+'</i><span>'+esc(Q.a[ai])+'</span></button>';
      }).join("")+'</div>'+
      (pk!=null?'<p class="rr-why '+(pk===Q.c?"ok":"no")+'"><b>'+(pk===Q.c?"RIGHT":"NOT QUITE")+'</b>  '+esc(Q.why)+'</p>':"");
  }
  SCROLL.innerHTML=h; SCROLL.scrollTop=0;
  SCROLL.classList.remove("turn","turnb"); void SCROLL.offsetWidth; if(step>0||back) SCROLL.classList.add(back?"turnb":"turn");
  FOOT.style.display=step===0?"none":"";
  BACK.disabled=step===0;
  var qi2=step>n+1?qIndex(step):-1;
  NEXT.textContent=step===n+1?"Check Yourself →":step===lastStep()?"Finish ✓":qi2>=0?"Next Question →":"Next →";
  NEXT.disabled=qi2>=0&&picks[qi2]==null;
  dots();
}
SCROLL_CLICK();
function SCROLL_CLICK(){
  SCROLL.addEventListener("click",function(e){
    if(!e.target.isConnected) return;
    var b=e.target.closest("[data-a]"); if(b){ var a=b.getAttribute("data-a");
      if(a==="begin") go(1); else if(a==="past") pastLessons(); else if(a==="today") load(today,"daily"); return; }
    var x=e.target.closest(".rr-a"); if(!x||x.disabled) return;
    var qi=qIndex(step), Q=L.qs[qi]; if(picks[qi]!=null) return;
    picks[qi]=+x.getAttribute("data-ai"); snd(picks[qi]===Q.c?"rr-right":"rr-wrong"); if(window.Parlor&&Parlor.score) Parlor.score([score()]);
    draw(); SCROLL.classList.remove("turn","turnb");
    var w=$(".rr-why",SCROLL); if(w&&w.scrollIntoView) setTimeout(function(){ try{ w.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(er){} },60);
  });
}

/* ---------- finishing ---------- */
function score(){ var s=0; L.qs.forEach(function(Q,i){ if(picks[i]===Q.c) s++; }); return s; }
function finish(){
  if(finished) return; finished=true;
  var s=score(), secs=t0?Math.round((Date.now()-t0)/1000):0, first=false, sk=streak(), srv=null, k=ymd(day);
  snd("rr-done",{stars:s});
  if(mode==="daily"&&!rec()){
    first=true; store("bwRead:"+todayKey,JSON.stringify({s:s,sec:secs,id:L.id}));
    var y=new Date(today); y.setDate(y.getDate()-1);
    sk.n=sk.last===ymd(y)?sk.n+1:sk.last===todayKey?sk.n:1; sk.last=todayKey; sk.best=Math.max(sk.best||0,sk.n); store("bwReadStreak",JSON.stringify(sk));
    srv=window.Parlor&&Parlor.dailyFinish?Parlor.dailyFinish(todayKey,{s:s,sec:secs,id:L.id}):null;
  } else if(mode==="archive"&&!rec(k)){
    first=true; store("bwRead:"+k,JSON.stringify({s:s,sec:secs,id:L.id,past:1}));
    srv=window.Parlor&&Parlor.dailyFinish?Parlor.dailyFinish(k,{s:s,sec:secs,id:L.id},true):null;   /* Club catch-up: mends the streak */
  }
  setTimeout(function(){ withServer(srv,function(sv){ if(sv&&sv.ok) sk={n:sv.n,best:sv.best,last:sv.last}; result(s,secs,first,sk,sv); }); },650);
}
function withServer(srv,go2){ if(!srv){ go2(null); return; } var t=setTimeout(function(){ t=0; go2(null); },1500); srv.then(function(sv){ if(t){ clearTimeout(t); go2(sv); } },function(){ if(t){ clearTimeout(t); go2(null); } }); }
function fmt(sec){ var m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function veil(id){ var v=$("#"+id); if(!v){ v=document.createElement("div"); v.className="pk-veil"; v.id=id; v.innerHTML='<div class="pk-modal"></div>'; document.body.appendChild(v);
  v.addEventListener("click",function(e){ if(e.target===v) v.classList.remove("on"); }); } return v; }
function result(s,secs,first,sk,sv){
  var v=veil("rrEnd"), b=v.firstChild;
  var head=mode==="archive"?"Past Lesson · "+niceDate(day):"The Reading Room · No. "+dayNo(day);
  var title=s===3?"Well Read!":s===2?"Nicely Done":s===1?"Lesson Read":"Lesson Read";
  b.innerHTML='<p class="pk-kick">'+esc(head)+'</p><h2>'+title+'</h2>'+
    '<div class="rr-stars">'+"★★★".slice(0,s)+'<i>'+"★★★".slice(s)+'</i></div>'+
    '<div class="rr-facts"><div><b>'+s+' of 3</b><small>Right</small></div><div><b>'+fmt(secs)+'</b><small>Time</small></div><div><b>'+(mode==="daily"?(sk.n||1):"–")+'</b><small>Streak</small></div></div>'+
    '<p class="rr-note"><b>'+esc(L.title)+':</b> '+esc(L.remember)+'</p>'+
    (mode==="daily"?(first?"":'<p class="rr-note" style="opacity:.75">You’d already read today’s lesson; your first result is the one kept.</p>'):"")+
    '<div class="pk-row" style="flex-wrap:wrap"></div>';
  var row=b.querySelector(".pk-row");
  if(mode==="daily"&&window.Parlor&&Parlor.dailyNote) b.insertBefore(Parlor.dailyNote(sk.n||1,sv),row);
  function bt(label,cls,fn){ var x=document.createElement("button"); x.type="button"; x.className="pk-btn"+(cls?" "+cls:""); x.textContent=label; x.onclick=fn; row.appendChild(x); return x; }
  if(mode==="daily") bt("Share Result","",function(){ share(s,sk); });
  bt("Past Lessons","",function(){ v.classList.remove("on"); pastLessons(); });
  if(mode!=="daily") bt("Today’s Lesson","",function(){ v.classList.remove("on"); load(today,"daily"); });
  var a=document.createElement("a"); a.className="pk-btn"; a.href="learn.html"; a.textContent="Back to Learn"; row.appendChild(a);
  v.classList.add("on");
}
function share(s,sk){
  var txt="BrainWhim · The Reading Room No. "+dayNo(today)+"\n"+"★★★".slice(0,s)+"☆☆☆".slice(s)+" "+s+" of 3 · "+L.title+(sk&&sk.n>1?" · "+sk.n+"-day streak":"")+"\nbrainwhim.com/reading.html";
  if(window.BWShare){ BWShare.go(txt); return; }
  if(navigator.share){ navigator.share({text:txt}).catch(function(){}); return; }
  try{ navigator.clipboard.writeText(txt).then(function(){ Parlor.toast("Result copied: paste it to a friend."); }); }catch(e){ Parlor.toast(txt); }
}

/* ---------- Past Lessons (Club): the last 30 days ---------- */
function pastLessons(){
  var v=veil("rrPast"), b=v.firstChild, club=member(), items="";
  for(var i=1;i<=30;i++){
    var d=new Date(today); d.setDate(d.getDate()-i); var Lx=lessonFor(d); if(!Lx) continue; var r=rec(ymd(d));
    items+='<button type="button" class="rr-pl'+(club?"":" lock")+'" data-k="'+ymd(d)+'"><span class="d">'+esc(shortDate(d))+'</span><span class="t"><small>'+esc(trackOf(d).name)+'</small>'+esc(Lx.title)+'</span><span class="s">'+(r?"★★★".slice(0,r.s)+(r.s?"":"✓"):club?"":"🔒")+'</span></button>';
  }
  b.innerHTML='<p class="pk-kick">The Reading Room</p><h2>Past Lessons</h2>'+
    (club?'<p class="rr-note">Any lesson from the last 30 days. Reading a day you missed mends your streak.</p>'
         :'<div class="rr-club">Past lessons open with the <b>Club</b>: read any of the last 30 days, and a missed day mends your streak. Today’s lesson is always free.</div>')+
    '<div class="rr-past">'+items+'</div><div class="pk-row" style="flex-wrap:wrap"></div>';
  var row=b.querySelector(".pk-row");
  if(!club){ var j=document.createElement("a"); j.className="pk-btn"; j.href="member.html"; j.textContent="Join the Club"; row.appendChild(j); }
  var c=document.createElement("button"); c.type="button"; c.className="pk-btn"; c.textContent="Close"; c.onclick=function(){ v.classList.remove("on"); }; row.appendChild(c);
  [].forEach.call(b.querySelectorAll(".rr-pl"),function(x){ x.onclick=function(){
    if(!member()){ if(window.Parlor) Parlor.toast("Past lessons open with the Club."); return; }
    var p=x.getAttribute("data-k").split("-"); v.classList.remove("on"); load(new Date(+p[0],+p[1]-1,+p[2]),"archive");
    if(!document.body.classList.contains("seated")&&window.Parlor&&Parlor.sitHouse) Parlor.sitHouse(); }; });
  v.classList.add("on");
}

/* ---------- fitting the book to the screen ---------- */
function seatedNow(){ return document.body.classList.contains("seated"); }
function fit(){
  var wide=window.innerWidth>=1000, st2=document.querySelector(".pk-stage");
  var top=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185;
  var h=wide?window.innerHeight-top-28:window.innerHeight-(seatedNow()?top:56)-(64+24)-8;
  h=Math.max(window.innerHeight<560?230:380,Math.min(820,h));
  BOOK.style.setProperty("--rr-h",Math.round(h)+"px");
}
window.addEventListener("resize",function(){ requestAnimationFrame(fit); });
new MutationObserver(function(){ setTimeout(fit,30); setTimeout(fit,400); }).observe(document.body,{attributes:true,attributeFilter:["class"]});

/* ---------- the room ---------- */
Parlor.init({
  game:"reading", cat:"learn", solo:true, free:true, daily:{key:"bwRead:",streak:"bwReadStreak"}, title:"The Reading Room", bg:"pw/learn-reading.jpg?v=1120a", home:"learn.html", stage:stage,
  soloLabel:"Today's lesson", dealLabel:"Today's Lesson",
  tagline:"A Fascinating Fact a Day.", invite:"A fascinating fact a day. Rain on the tall window, a lamp on the table: read today's short lesson, then answer three questions.",
  players:[{name:"You",color:"#b8862b"}],
  setsLabel:"Pages",
  sets:[
    {id:"linen",name:"Cream Linen",need:0,dots:["#f6eedb","#2b2218"]},
    {id:"lamp",name:"Evening Lamp",need:0,dots:["#33261a","#f1e6cf"]},
    {id:"vellum",name:"Gilt-Edged Vellum",club:true,dots:["#fffdf6","#c8992f"]}
  ],
  rules:{
    play:"<ol><li><b>One lesson a day:</b> a few short pages on one good idea. Tap <b>Next</b> (or press →) to turn the page, <b>Back</b> to look again.</li><li><b>Remember This:</b> the one line worth keeping.</li><li><b>Check Yourself:</b> three questions. Tap an answer to see if it’s right and why. You can always turn back to the pages.</li></ol>",
    score:"<ul><li><b>A new lesson every day</b>, the same for everyone. It changes at midnight on your device.</li><li><b>Each weekday has its subject:</b> Monday Science, Tuesday History, Wednesday Words, Thursday Money & Life, Friday Art & Music, Saturday Nature & Places, Sunday How Things Work.</li><li><b>Stars:</b> one for each question right the first time.</li><li><b>Your streak</b> counts the days in a row you read the lesson.</li><li><b>Club Members</b> can open any lesson from the last 30 days; reading a day you missed mends your streak.</li></ul>"
  },
  onNew:function(){ var nb=document.querySelectorAll(".pk-menu .pk-btn, .pk-bar .pk-btn.primary"); [].forEach.call(nb,function(b){ if(b.textContent==="New Game") b.textContent="Today's Lesson"; }); load(today,"daily"); }
});
document.addEventListener("DOMContentLoaded",function(){ load(today,"daily"); fit(); });
if(document.readyState!=="loading"){ load(today,"daily"); fit(); }
window.RRO={get:function(){ return {L:L,step:step,picks:picks,mode:mode,day:ymd(day)}; },go:go,finish:finish,load:function(k,m){ var p=k.split("-"); load(new Date(+p[0],+p[1]-1,+p[2]),m||"archive"); },lessonFor:function(k){ var p=k.split("-"); return lessonFor(new Date(+p[0],+p[1]-1,+p[2])); },order:order,past:pastLessons};   /* for testing */
})();
</script>
