<style>
/* ===== Observatory FreeCell: a card table under the dome, seen from straight above, drawn in the browser =====
   A frame around a leather (or velvet) top tooled with the night sky: a star chart, a field of stars, or an orrery.
   Same desk machinery as Writing Desk Solitaire; cards from the shared card kit (bw-cards.js / .css).
   Tables (the Tables card): one free, two for Club members. ?preview=1 shows a picker for all three. */
.so-pad{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.so-fit{position:relative;flex:none}
.so-table{position:absolute;left:0;top:0;transform-origin:0 0}
.so-desk{position:absolute;inset:0;border-radius:12px;background:var(--so-woodc);box-shadow:0 22px 44px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35)}
.so-rim{position:absolute;background-color:var(--so-woodc);background-repeat:repeat}
.so-rim.t,.so-rim.b{left:0;right:0;height:var(--so-r);background-image:var(--so-wood)}
.so-rim.t{top:0;border-radius:12px 12px 0 0;clip-path:polygon(0 0,100% 0,calc(100% - var(--so-r)) 100%,var(--so-r) 100%)}
.so-rim.b{bottom:0;border-radius:0 0 12px 12px;clip-path:polygon(var(--so-r) 0,calc(100% - var(--so-r)) 0,100% 100%,0 100%);background-position:-300px -90px}
.so-rim.l,.so-rim.r{top:0;bottom:0;width:var(--so-r);background-image:var(--so-woodv)}
.so-rim.l{left:0;border-radius:12px 0 0 12px;clip-path:polygon(0 0,100% var(--so-r),100% calc(100% - var(--so-r)),0 100%)}
.so-rim.r{right:0;border-radius:0 12px 12px 0;clip-path:polygon(0 var(--so-r),100% 0,100% 100%,0 calc(100% - var(--so-r)));background-position:-90px -400px}
.so-rim::after{content:"";position:absolute;inset:0}
.so-rim.t::after{background:linear-gradient(to bottom,rgba(255,232,200,.26),rgba(0,0,0,0) 35%,rgba(0,0,0,.28))}
.so-rim.b::after{background:linear-gradient(to bottom,rgba(255,232,200,.12),rgba(0,0,0,0) 40%,rgba(0,0,0,.4))}
.so-rim.l::after{background:linear-gradient(to right,rgba(255,232,200,.22),rgba(0,0,0,0) 40%,rgba(0,0,0,.25))}
.so-rim.r::after{background:linear-gradient(to right,rgba(255,232,200,.08),rgba(0,0,0,0) 40%,rgba(0,0,0,.42))}
/* polished brass: bright bevels and a dark inner edge */
.so-desk.metal .so-rim.t::after{background:linear-gradient(to bottom,rgba(255,250,215,.7),rgba(255,236,170,.18) 26%,rgba(0,0,0,0) 55%,rgba(70,44,0,.5))}
.so-desk.metal .so-rim.b::after{background:linear-gradient(to bottom,rgba(255,244,200,.45),rgba(0,0,0,0) 40%,rgba(60,38,0,.6))}
.so-desk.metal .so-rim.l::after{background:linear-gradient(to right,rgba(255,250,215,.6),rgba(255,236,170,.12) 30%,rgba(0,0,0,0) 55%,rgba(70,44,0,.45))}
.so-desk.metal .so-rim.r::after{background:linear-gradient(to right,rgba(255,244,200,.3),rgba(0,0,0,0) 40%,rgba(60,38,0,.62))}
.so-desk.metal{box-shadow:0 22px 44px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,240,190,.5)}
.so-leather{position:absolute;inset:var(--so-r);border-radius:3px;overflow:hidden;background-image:radial-gradient(ellipse 70% 55% at 84% 8%,rgba(255,214,150,.14),rgba(255,214,150,0) 70%),radial-gradient(ellipse 120% 90% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.38)),var(--so-leath);
  background-size:auto,auto,1024px 1024px;background-color:var(--so-leathc);box-shadow:inset 0 3px 7px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.5)}
.so-deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.so-tool{position:absolute;inset:var(--so-t1);border:2px solid var(--so-tool);border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(0,0,0,.35);pointer-events:none}
.so-tool.i{inset:var(--so-t2);border-width:1px;opacity:.8}
.so-fl{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);border:1.5px solid var(--so-tool);background:rgba(0,0,0,.1);pointer-events:none}
.so-mono{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:baseline;line-height:1;font-size:22px;pointer-events:none;opacity:.75}
.so-mono b,.so-mono i{display:inline-block;color:transparent;background:var(--so-toolg);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 0 rgba(0,0,0,.45))}
.so-mono b{font:500 1em Montserrat,sans-serif}.so-mono i{font:400 .76em Pacifico,cursive;font-style:normal;margin-left:.05em;padding-right:.15em}
#soSlots,#soCards{position:absolute;left:0;top:0}
.so-table{--bwc-slot:var(--so-slot)}
.so-table .bwc.can{cursor:grab}
.so-table .bwc.nope{animation:so-nope .32s ease}
@keyframes so-nope{25%{margin-left:-5px}75%{margin-left:5px}}
.bwc-slot.cell span{font-size:15px;font-family:Montserrat,sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-align:center;line-height:1.3}
/* the toolbar under the table: Undo · Hint · Restart Deal · time on phones */
.so-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px;border-radius:12px;background:rgba(15,23,42,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.so-tools .pk-btn{width:auto;margin:0;padding:8px 16px;min-height:0}
.so-tools .pk-btn.gold{border-color:rgba(231,199,122,.75);color:#f0d27a;background:rgba(212,175,55,.16)}
.so-stat{font:600 13px Montserrat,sans-serif;color:#fff;padding:0 8px;white-space:nowrap;display:none}
.so-stat b{color:#f0d27a;font-weight:700}
.so-toast{position:absolute;z-index:600;left:50%;top:44%;transform:translate(-50%,-50%);padding:9px 16px;border-radius:12px;background:rgba(15,23,42,.84);border:1px solid rgba(231,199,122,.6);color:#f3d68b;font:700 14px Montserrat,sans-serif;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
.so-toast.on{opacity:1}
.so-pick{position:fixed;z-index:60;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px;border-radius:12px;
  background:rgba(15,23,42,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(231,199,122,.45);max-width:94vw}
.so-pick button{font:600 13px Montserrat,sans-serif;color:#f3ead8;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px 12px;cursor:pointer}
.so-pick button.on{background:rgba(255,255,255,.18);border-color:rgba(231,199,122,.6);color:#fff}
@media (max-width:999px){
  .so-pick{top:8px;flex-wrap:nowrap;gap:2px;padding:4px}.so-pick button{font-size:11px;padding:7px 7px;white-space:nowrap}
  .so-stat{display:block}
  .so-tools{gap:6px;padding:5px;width:100%;max-width:calc(100vw - 16px);flex-wrap:nowrap}
  .so-tools .pk-btn{padding:8px 11px;font-size:13px}
  body.pk.seated .pk-stage{justify-content:flex-start}
}
@media (max-width:420px){ .so-tools .pk-btn{padding:8px 9px} }
</style>

<script>
var K=BWCards, PT=K.paint;
/* ---------- the three tables ---------- */
var STARBACK="radial-gradient(circle at 30% 30%,rgba(255,240,205,.55) 0 .9px,rgba(0,0,0,0) 1.4px) 0 0/11px 11px,radial-gradient(circle at 70% 70%,rgba(255,240,205,.35) 0 .7px,rgba(0,0,0,0) 1.1px) 0 0/7px 7px";
function brushedFn(o){ var n=PT.noise2(o.seed), n2=PT.noise2(o.seed+9), r=K.rng(o.seed+3); return function(x,y){ var st=PT.fbm(n,x/700,y/.9,3), cl=PT.fbm(n2,x/260,y/60,2), k=.74+st*.36+(cl-.5)*.22+(r()-.5)*.07; return [Math.min(255,o.c[0]*k),Math.min(255,o.c[1]*k),Math.min(255,o.c[2]*k)]; }; }
var DESIGNS={
  /* Rosewood & Star Chart: the room photo's dark rosewood table; midnight leather tooled with constellations and a celestial ring */
  rosewood:{name:"Rosewood & Star Chart",wood:function(){ return PT.woodFn({light:[100,40,32],dark:[30,12,10],freq:.045,turb:7,wx:260,wy:22,sharp:.8,ringAmt:.5,streakAmt:.62,pores:.01,blotch:.28,seed:61}); },woodc:"#3e1712",
    leath:[24,32,60],leather:true,tool:"rgba(222,186,98,.7)",toolg:"linear-gradient(170deg,#fff1bf,#d9b25a 45%,#8f6a22 75%,#f3d68b)",slot:"rgba(231,199,122,.38)",deco:"chart",
    back:"linear-gradient(150deg,#22305e,#0b1230)",gold:"rgba(231,199,122,.8)",pat:STARBACK,dots:["#3e1712","#18203c","#d9b25a"]},
  /* Brass & Night Sky: a brushed brass frame (like the telescope) around midnight velvet scattered with stars */
  brass:{name:"Brass & Night Sky",metal:true,wood:function(){ return brushedFn({c:[206,160,74],seed:13}); },woodc:"#a9832f",
    leath:[14,20,42],leather:false,tool:"rgba(226,192,110,.62)",toolg:"linear-gradient(170deg,#fff1bf,#d9b25a 45%,#8f6a22 75%,#f3d68b)",slot:"rgba(231,199,122,.34)",deco:"sky",
    back:"linear-gradient(150deg,#1b1d28,#05060a)",gold:"rgba(231,199,122,.85)",pat:STARBACK,dots:["#b8913f","#0e142a","#f3e6c4"]},
  /* Ebony & Orrery: an ebonised frame, slate leather and the brass rings of an orrery */
  ebony:{name:"Ebony & Orrery",wood:function(){ return PT.woodFn({light:[44,36,32],dark:[12,10,8],freq:.05,turb:4,wx:300,wy:30,sharp:.7,ringAmt:.5,streakAmt:.5,pores:0,blotch:.2,seed:3}); },woodc:"#1b1714",
    leath:[48,54,62],leather:true,tool:"rgba(214,180,100,.6)",toolg:"linear-gradient(170deg,#fff1bf,#d9b25a 45%,#8f6a22 75%,#f3d68b)",slot:"rgba(226,196,120,.34)",deco:"orrery",
    back:"linear-gradient(150deg,#3b414c,#14171c)",gold:"rgba(231,199,122,.8)",pat:STARBACK,dots:["#1b1714","#30363e","#c9a24f"]}
};
var texCache={}, curDesign=null;
function applyDesign(k){
  if(!DESIGNS[k]) k="rosewood"; if(k===curDesign) return; curDesign=k; var d=DESIGNS[k];
  if(!texCache[k]){ var w=PT.canvasOf(1400,260,d.wood()), top=d.leather?PT.leatherFn(d.leath,k.length*31+7):PT.feltFn(d.leath,k.length*17+3);
    texCache[k]={w:PT.cssUrl(w),v:PT.cssUrl(PT.rot(w)),l:PT.cssUrl(PT.seamless(PT.canvasOf(512,512,top)))}; }
  var t=texCache[k], s=stage.style;
  s.setProperty("--so-wood",t.w); s.setProperty("--so-woodv",t.v); s.setProperty("--so-woodc",d.woodc); s.setProperty("--so-leath",t.l); s.setProperty("--so-leathc","rgb("+d.leath+")");
  s.setProperty("--so-tool",d.tool); s.setProperty("--so-toolg",d.toolg); s.setProperty("--so-slot",d.slot); s.setProperty("--bwc-back",d.back); s.setProperty("--bwc-gold",d.gold); s.setProperty("--bwc-pat",d.pat||"none"); stage.querySelector(".so-desk").classList.toggle("metal",!!d.metal);
  drawDeco();
}
var PREVIEW=/[?&]preview=1/.test(location.search), previewPick=null;
function previewBar(){
  if(!PREVIEW) return;
  var bar=document.createElement("div"); bar.className="so-pick";
  Object.keys(DESIGNS).forEach(function(k){ var b=document.createElement("button"); b.type="button"; b.textContent=DESIGNS[k].name; b.dataset.k=k;
    b.onclick=function(){ previewPick=k; document.body.setAttribute("data-set",k); mark(); }; bar.appendChild(b); });
  function mark(){ [].forEach.call(bar.children,function(b){ b.classList.toggle("on",b.dataset.k===(previewPick||curDesign)); }); }
  document.body.appendChild(bar); previewPick="rosewood"; document.body.setAttribute("data-set","rosewood"); mark();
}
/* the sky worked into the table top (SVG, redrawn when the table changes size) */
function drawDeco(){
  var svg=stage.querySelector(".so-deco"); if(!svg||!curDesign) return;
  var d=DESIGNS[curDesign], w=G.W-2*G.R, h=(G.H||760)-2*G.R, r=K.rng(97), o="", ink=d.tool;
  var cx=w/2, cy=h*.64, R=Math.min(w*.44,h*.46);   /* large and low, so the rings show around the columns */
  if(d.deco==="chart"){
    o+='<g fill="none" stroke="'+ink+'" opacity=".42"><circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" stroke-width="1.6"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(R-12)+'" stroke-width=".8"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(R*.62)+'" stroke-width=".7" stroke-dasharray="3 6"/>';
    for(var a=0;a<360;a+=5){ var L=a%30===0?10:a%10===0?6:3, ra=a*Math.PI/180; o+='<line x1="'+(cx+Math.cos(ra)*R)+'" y1="'+(cy+Math.sin(ra)*R)+'" x2="'+(cx+Math.cos(ra)*(R-L))+'" y2="'+(cy+Math.sin(ra)*(R-L))+'" stroke-width=".8"/>'; }
    o+='<line x1="'+(cx-R)+'" y1="'+cy+'" x2="'+(cx+R)+'" y2="'+cy+'" stroke-width=".6"/><line x1="'+cx+'" y1="'+(cy-R)+'" x2="'+cx+'" y2="'+(cy+R)+'" stroke-width=".6"/>';
    o+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+R+'" ry="'+(R*.36)+'" stroke-width=".7" transform="rotate(-23 '+cx+' '+cy+')"/></g>';
    /* constellations: little groups of stars joined by fine lines */
    for(var g=0;g<7;g++){ var gx=r()*w, gy=r()*h, pts=[]; for(var p=0;p<4+Math.floor(r()*3);p++){ gx+=(r()-.5)*90; gy+=(r()-.5)*70; pts.push([gx,gy]); }
      o+='<polyline points="'+pts.map(function(q){ return q[0].toFixed(1)+","+q[1].toFixed(1); }).join(" ")+'" fill="none" stroke="'+ink+'" stroke-width=".7" opacity=".32"/>';
      pts.forEach(function(q){ o+=star(q[0],q[1],2+r()*2.2,ink,.6); }); }
    for(var s=0;s<70;s++) o+='<circle cx="'+(r()*w).toFixed(1)+'" cy="'+(r()*h).toFixed(1)+'" r="'+(.6+r()*1.1).toFixed(2)+'" fill="'+ink+'" opacity="'+(.2+r()*.35).toFixed(2)+'"/>';
  } else if(d.deco==="sky"){
    o+='<defs><radialGradient id="mw" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#dfe6ff" stop-opacity=".16"/><stop offset="1" stop-color="#dfe6ff" stop-opacity="0"/></radialGradient></defs>';
    o+='<ellipse cx="'+(w*.52)+'" cy="'+(h*.55)+'" rx="'+(w*.75)+'" ry="'+(h*.12)+'" fill="url(#mw)" transform="rotate(-28 '+(w*.52)+' '+(h*.55)+')"/>';
    for(var s2=0;s2<260;s2++){ var x=r()*w, y=r()*h, b=r(); o+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(.4+b*b*1.3).toFixed(2)+'" fill="#fff6e0" opacity="'+(.18+b*.55).toFixed(2)+'"/>'; }
    for(var s3=0;s3<9;s3++) o+=star(r()*w,r()*h,5+r()*5,"#fff3d6",.75);
  } else {
    /* an orrery: the sun, its rings and their planets */
    o+='<g fill="none" stroke="'+ink+'" opacity=".62">';
    [.22,.38,.55,.74,.94,1.1].forEach(function(k2,i){ o+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(R*k2)+'" ry="'+(R*k2*.5)+'" stroke-width="'+(i%2?1:1.6)+'"/>'; });
    o+='</g><circle cx="'+cx+'" cy="'+cy+'" r="'+(R*.07)+'" fill="'+ink+'" opacity=".65"/>';
    for(var ry=0;ry<16;ry++){ var ra2=ry*Math.PI/8; o+='<line x1="'+(cx+Math.cos(ra2)*R*.09)+'" y1="'+(cy+Math.sin(ra2)*R*.09)+'" x2="'+(cx+Math.cos(ra2)*R*.13)+'" y2="'+(cy+Math.sin(ra2)*R*.13)+'" stroke="'+ink+'" stroke-width="1.2" opacity=".55"/>'; }
    [.22,.38,.55,.74,.94,1.1].forEach(function(k2,i){ var t=1.1+i*.9, px=cx+Math.cos(t)*R*k2, py=cy+Math.sin(t)*R*k2*.5; o+='<circle cx="'+px+'" cy="'+py+'" r="'+(4+i%3*2)+'" fill="'+ink+'" opacity=".6"/>'; if(i===3) o+='<ellipse cx="'+px+'" cy="'+py+'" rx="13" ry="4" fill="none" stroke="'+ink+'" opacity=".6"/>'; });
    for(var s4=0;s4<40;s4++) o+='<circle cx="'+(r()*w).toFixed(1)+'" cy="'+(r()*h).toFixed(1)+'" r="'+(.6+r()).toFixed(2)+'" fill="'+ink+'" opacity="'+(.15+r()*.3).toFixed(2)+'"/>';
  }
  svg.setAttribute("viewBox","0 0 "+w+" "+h); svg.innerHTML=o;
}
function star(x,y,s,c,op){ return '<path d="M'+x+' '+(y-s)+'L'+(x+s*.22)+' '+(y-s*.22)+'L'+(x+s)+' '+y+'L'+(x+s*.22)+' '+(y+s*.22)+'L'+x+' '+(y+s)+'L'+(x-s*.22)+' '+(y+s*.22)+'L'+(x-s)+' '+y+'L'+(x-s*.22)+' '+(y-s*.22)+'Z" fill="'+c+'" opacity="'+op+'"/>'; }

/* ---------- the table ---------- */
var stage=document.createElement("div"); stage.className="so-pad";
stage.innerHTML='<div class="so-fit" id="soFit"><div class="so-table" id="soT"><div class="so-desk"><div class="so-rim t"></div><div class="so-rim b"></div><div class="so-rim l"></div><div class="so-rim r"></div>'+
  '<div class="so-leather"><svg class="so-deco" preserveAspectRatio="none"></svg><div class="so-tool"></div><div class="so-tool i"></div><span class="so-fl"></span><span class="so-fl"></span><span class="so-fl"></span><span class="so-fl"></span><span class="so-mono"><b>B</b><i>W</i></span></div></div>'+
  '<div id="soSlots"></div><div id="soCards"></div><div class="so-toast" id="soToast" role="status"></div></div></div>'+
  '<div class="so-tools" id="soTools"></div>';
var T=stage.querySelector("#soT"), FIT=stage.querySelector("#soFit"), SL=stage.querySelector("#soSlots"), CL=stage.querySelector("#soCards"), TOOLS=stage.querySelector("#soTools"), toastEl=stage.querySelector("#soToast");

/* layout in table units: eight columns. Wide (desktop, tablets, landscape) and narrow (portrait phones: cards nearly
   edge to edge, big corner indices, a slim frame). Foundations top left and free cells top right, as in Solitaire. */
var G={};
function layoutFor(narrow){
  if(narrow) return {narrow:true,W:856,R:10,PX:104,X0:14,TY:28,GAP:24,UP:56,UPMIN:22,Hmin:980,Hmax:1640,T1:5,T2:8};
  return {narrow:false,W:1000,R:28,PX:112,X0:58,TY:50,GAP:32,UP:34,UPMIN:17,Hmin:680,Hmax:960,T1:11,T2:17};
}
G=layoutFor(false); G.H=760;
function colX(i){ return G.X0+i*G.PX; }
function tabY(){ return G.TY+K.H+G.GAP; }
function tabYc(){ return tabY()-G.R; }

/* ---------- the game ----------
   tab[8] (columns, every card face up), cells[4] (one card or null), found[4] (built up by suit from the ace). */
var GID=0, S=null, hist=[], busy=false, tickT=0, cardEl={}, slotEl={}, lessonOnly=null, inLesson=false, practice=false, stuckShown=false;
var BYID={}; K.deck().forEach(function(c){ BYID[c.id]=c; });
function cd(r,s){ return BYID[s+"-"+r]; }
/* Microsoft's numbered deals: the same deal number gives the same layout as Windows FreeCell (1 to 32000) */
function msDeal(n){
  var seed=n, deck=[], cols=[[],[],[],[],[],[],[],[]], i;
  for(i=0;i<52;i++) deck.push(i);   /* card i: rank i/4, suit i%4 (clubs, diamonds, hearts, spades) */
  for(var left=52,k=0;left>0;left--,k++){ seed=(seed*214013+2531011)%2147483648; var j=(Math.floor(seed/65536)&32767)%left, c=deck[j]; deck[j]=deck[left-1]; cols[k%8].push(cd(Math.floor(c/4),c%4)); }
  return cols;
}
function randomDeal(){ var n; do { n=1+Math.floor(Math.random()*32000); } while(n===11982); return n; }   /* 11982 is the one deal no one can win */

}
var solverW=null, solverSync=null, askId=0, asks={};

function position(){

function solveOnce(o){

/* a careful search first (it keeps free cells open, the way a good player would); if that takes too long, a quick one */
async function solveNow(){

/* the solver's move, turned into the game's own pick and place */
