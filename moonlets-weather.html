      '<button class="chip" data-a="again" aria-label="New game"><em>↺</em><span>New game</span></button>')+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="day" aria-label="My Moon Day"><em>☾</em><span>My Moon Day</span></button>'; }
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; BWK.sfx("tap"); var a=b.dataset.a;
    if(a==="next"){ BWK.finnStop(); if(G.r>=G.order.length-1) allDone(); else nextWeather(); }
    else if(a==="again"){ BWK.finnStop(); newGame(); }
    else if(a==="big"){ big=!big; talked=true; document.body.classList.toggle("big",big); BWK.setBig(big,top); G.first=false; G.r--; nextWeather(); }
    else if(a==="day"){ BWK.finnStop(); BWK.sfx("whoosh"); setTimeout(function(){ location.href="moonlets-day.html"; },200); } });
  window.addEventListener("bwk-big",function(e){ if(!!e.detail!==big){ big=!!e.detail; document.body.classList.toggle("big",big); G.r--; nextWeather(); } });
  document.addEventListener("click",function(e){ if(talked||!e.target.isConnected||e.target.closest("#shelf,#scene,.chip,.k-head,.k-sheet,.k-veil")) return; say(HI,"dw-hi"); });

  document.body.classList.toggle("big",big);
  G={order:[],r:-1,done:{},need:[],got:{},ph:"intro",first:true,w:null};
  $("buddy").innerHTML='<img src="'+buddyImg()+'" alt="">';
  newGame();
  (function(){ function fw(){ var w=$("win"), m=Math.min(w.clientWidth,w.clientHeight); w.style.setProperty("--fw",Math.max(14,Math.min(44,Math.round(m*.085)))+"px"); }
    fw(); if(window.ResizeObserver) new ResizeObserver(fw).observe($("win")); else window.addEventListener("resize",fw); })();
  (function(){ function fitBoard(){ var b=$("board"), sc=$("scene"); if(!b||!G) return; var sls=[].slice.call(b.querySelectorAll(".sl")); sls.forEach(function(e){ e.style.removeProperty("--sl"); });
      var col=getComputedStyle(b).flexDirection==="column", n=Math.max(1,G.need.length), gap=col?8:6, pad=col?20:12;
      var room=col? sc.clientHeight-pad : (b.clientWidth||sc.clientWidth)-pad, base=parseFloat(getComputedStyle(b.querySelector(".sl")||b).getPropertyValue("--sl"))||64;
      var fit=Math.floor((room-(n-1)*gap)/n); if(fit<base) sls.forEach(function(e){ e.style.setProperty("--sl",Math.max(34,fit)+"px"); }); }
    window.addEventListener("resize",fitBoard); if(window.ResizeObserver) new ResizeObserver(fitBoard).observe($("scene")); DWfit=fitBoard; })();
  window.DWO={state:function(){ return G&&{ph:G.ph, w:G.w, r:G.r, need:G.need, got:Object.keys(G.got), shelf:G.shelf&&G.shelf.map(function(c){return c.id;}), done:Object.keys(G.done)}; },
    pickRight:function(){ for(var i=0;i<G.shelf.length;i++){ var c=G.shelf[i]; if(c.ok.indexOf(G.w)>=0&&!G.got[c.slot]&&G.need.indexOf(c.slot)>=0){ tapItem(i,$("shelf").querySelector('.cl[data-i="'+i+'"]')); return c.id; } } },
    pickWrong:function(){ for(var i=0;i<G.shelf.length;i++){ var c=G.shelf[i]; if(c.ok.indexOf(G.w)<0){ tapItem(i,$("shelf").querySelector('.cl[data-i="'+i+'"]')); return c.id; } } },
    next:function(){ if(G.r>=G.order.length-1) allDone(); else nextWeather(); }, big:function(on){ big=!!on; document.body.classList.toggle("big",big); BWK.setBig(big); newGame(); }};
})();
</script>
