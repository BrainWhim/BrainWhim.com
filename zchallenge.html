/* Zayden's Challenge (The Outpost · The Lab), Nov 16. Brick Towers, picked by Judy for Zayden (a deep thinker: math, science, big brick kits).

   (a taller tower hides every shorter one behind it). A daily warm-up (Mon 4x4 gentle .. Sun 5x5) and one big 6x6 Challenge a week

.nb:active{transform:translateY(2px);box-shadow:none}

function sClue(){ tone(1046,0,.18,.07,"triangle"); tone(1568,.06,.22,.05,"triangle"); }
function sWin(){ [523,659,784,1047,1319,1568].forEach(function(f,i){ tone(f,i*.08,.42,.08,"triangle"); }); for(var i=0;i<8;i++) noise(.5+i*.05,.03,.08,2500,7000); }

/* ---------- the day and the week ---------- */
var DAYN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var FOOT=["4 by 4 with lots of clues. A gentle start!","4 by 4, a few clues missing.","4 by 4, fewer clues.","4 by 4, even fewer clues.","4 by 4 with only a few clues!",
  "5 by 5 towers.","5 by 5 with fewer clues. The trickiest warm-up!"];
function today(){ var d=new Date(); return {n:Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5), wd:d.getDay()}; }
function lvOf(wd){ return (wd+6)%7; }

var P=null, gen=0, SEL=null, NOTES=false, said={};
function msg(t){ $("#cmsg").textContent=t||""; }
function say(t){ BWK.say(t); }
function sayOnce(k,t){ if(said[k]) return; said[k]=1; say(t); }
function start(kind){ gen++; said={}; clearHint(); SEL=null; NOTES=false; BR=0; var t=today(), wk=TWG.weekOf(t.n), chal=kind==="chal";
  var key=chal?"c":"w", stamp=chal?wk:t.n, lv=chal?7:lvOf(t.wd), seed=chal?wk*7+5:t.n;
  if(kind==="bonus"){ key="b"; lv=lvOf(t.wd); seed=(Math.random()*1e9)|0; stamp=-1; }
  document.body.className="m-play";
  $("#cday").textContent=chal?"This Week's Challenge":kind==="bonus"?"Bonus Warm-up":(DAYN[t.wd]+"'s Warm-up");
  var Z=TWG.make(lv,seed), sv=ST[key];
  P={kind:kind,key:key,stamp:stamp,lv:lv,Z:Z,N:Z.N,g:[],notes:[],hints:0,done:false,hist:[]};
  for(var r=0;r<Z.N;r++){ P.g.push(new Array(Z.N).fill(0)); P.notes.push(new Array(Z.N).fill(0)); }
  if(kind!=="bonus"&&sv&&sv.stamp===stamp&&sv.g&&sv.g.length===Z.N){ P.g=sv.g; P.notes=sv.notes||P.notes; P.hints=sv.hints||0; P.done=!!sv.done; P.giv=sv.giv||{}; }
  P.giv=P.giv||{};
  $("#cnum").textContent=Z.N+" by "+Z.N+(chal?" · the big one!":"");
  layout(); drawNums(); $("#aNote").classList.remove("on");
  if(P.done){ msg(chal?"You finished this week's Challenge! A new one comes on Monday.":"Today's warm-up is done! Try the Challenge, or come back tomorrow."); return; }
  if(ST.n<1&&kind==="warm") { msg("Pick a tower below, then tap a square to build it."); say(FIRST); }
  else if(chal){ msg("The big one! Use Notes to keep track of what each square could be."); say(CHAL); }
  else msg(""); }
function saveCur(){ if(!P||P.kind==="bonus") return; ST[P.key]={stamp:P.stamp,g:P.g,notes:P.notes,hints:P.hints,done:P.done,giv:P.giv}; save(); }

/* ---------- layout: a real 3-D baseplate lying on the table (Judy, Nov 16). The board can turn a quarter at a time,
   and "Eye level" drops the view to the table edge so you can see which towers hide which. ---------- */
var GEO=null, VIEW={yaw:0,tilt:50}, LH=.26;
function layout(){ if(!P) return; var st=$("#stage"), W=st.clientWidth, H=st.clientHeight; if(!W||!H) return; var N=P.N, m=.74, S=N+2*m; LH=Math.min(.26,1.2/N);
  var u=Math.floor(Math.min(W*.97/S,H*.95/(S*.66+N*LH*.77+.3),88)); if(u<24) u=24;
  var bw=Math.round(u*S), o=Math.round(u*m), w=Math.round(u*.74);
  GEO={u:u,o:o,w:w,bw:bw}; st.style.perspective=Math.round(bw*2.6)+"px";
  var b=$("#board"); b.style.cssText="left:"+Math.round((W-bw)/2)+"px;top:"+Math.round((H-bw)/2+u*.25)+"px;width:"+bw+"px;height:"+bw+"px;--u:"+u+"px;--w:"+w+"px;--lh:"+(u*LH)+"px";
  var pl='left:'+(o-u*.14)+'px;top:'+(o-u*.14)+'px;width:'+(N*u+u*.28)+'px;height:'+(N*u+u*.28)+'px';
  var h='<div class="plate under" style="'+pl+'"></div><div class="plate" style="'+pl+'"></div>';
  for(var r=0;r<N;r++) for(var c=0;c<N;c++) h+='<button class="cell" data-r="'+r+'" data-c="'+c+'" aria-label="Row '+(r+1)+', column '+(c+1)+'" style="left:'+(o+c*u)+'px;top:'+(o+r*u)+'px;width:'+u+'px;height:'+u+'px"></button>';
  for(var r2=0;r2<N;r2++) for(var c2=0;c2<N;c2++) h+='<div class="tw3" id="tw'+r2+'_'+c2+'" data-r="'+r2+'" data-c="'+c2+'" style="left:'+(o+c2*u+(u-w)/2)+'px;top:'+(o+r2*u+(u-w)/2)+'px;width:'+w+'px;height:'+w+'px"></div>';
  var cs=Math.round(u*.6);
  ["top","bottom","left","right"].forEach(function(s){ for(var i=0;i<N;i++){ var k=P.Z.clues[s][i]; if(!k) continue; var x,y;
    if(s==="top"){ x=o+i*u+u/2; y=o*.5; } else if(s==="bottom"){ x=o+i*u+u/2; y=o+N*u+o*.5; } else if(s==="left"){ x=o*.5; y=o+i*u+u/2; } else { x=o+N*u+o*.5; y=o+i*u+u/2; }
    h+='<div class="clue" data-s="'+s+'" data-i="'+i+'" style="left:'+(x-cs/2)+'px;top:'+(y-cs/2)+'px;width:'+cs+'px;height:'+cs+'px">'+k+'</div>'; } });
  h+='<span class="bwp3" style="left:'+(o+N*u+o/2)+'px;top:'+(o+N*u+o/2)+'px">BW</span>';
  b.innerHTML=h; b.onclick=function(ev){ if(DRAG.moved) return; var q=ev.target.closest("[data-r]"); if(q) tapCell(+q.dataset.r,+q.dataset.c); };
  view(true); drawCells(); if(SEL) select(SEL[0],SEL[1]); }
function view(now){ var b=$("#board"); if(!b) return; if(now) b.style.transition="none";
  b.style.setProperty("--yaw",VIEW.yaw+"deg"); b.style.setProperty("--tilt",VIEW.tilt+"deg"); b.style.setProperty("--tz",VIEW.tilt>64?-.62:.34);
  if(now){ void b.offsetWidth; b.style.transition=""; } $("#vEye").classList.toggle("on",VIEW.tilt>60); }
function cellEl(r,c){ return $('#board .cell[data-r="'+r+'"][data-c="'+c+'"]'); }
function twEl(r,c){ return $("#tw"+r+"_"+c); }
/* a tower: a box of v brick layers (four sides + a studded top with its number) */
var SHADE=[.16,.30,.04,.10];
function tower3(v){ var c=COL[v], h='', hpx='calc(var(--lh)*'+v+')';
  for(var k=0;k<4;k++) h+='<i class="fc sd" style="height:'+hpx+';background-color:'+c+';--sh:'+SHADE[k]+';transform:translate(calc(var(--w)/2),calc(var(--w)/2)) rotateZ('+(k*90)+'deg) translate3d(calc(var(--w)/-2),calc(var(--w)/2),'+hpx+') rotateX(-90deg)"></i>';
  h+='<i class="fc tp3" style="background-color:'+c+';transform:translateZ('+hpx+')"><b class="'+(v===1?"dk":"")+'">'+v+'</b></i>';
  return h; }
function drawCell(r,c,drop){ var e=cellEl(r,c), tw=twEl(r,c); if(!e||!tw) return; var v=P.g[r][c], nt=P.notes[r][c], h="";
  if(!v&&nt){ h='<span class="nt">'; for(var k=1;k<=P.N;k++) h+='<span>'+(nt&(1<<k)?k:"")+'</span>'; h+='</span>'; }
  e.innerHTML=h; tw.innerHTML=v?tower3(v):""; tw.classList.toggle("giv",!!P.giv[r+","+c]); e.classList.toggle("giv",!!P.giv[r+","+c]);
  tw.classList.remove("drop"); if(drop&&v){ void tw.offsetWidth; tw.classList.add("drop"); } }
function drawCells(){ for(var r=0;r<P.N;r++) for(var c=0;c<P.N;c++) drawCell(r,c); marks(); }
function drawNums(){ var h=""; for(var v=1;v<=P.N;v++) h+='<button class="nb" data-v="'+v+'" aria-label="Tower of '+v+'">'+towerSVG(v,P.N,true)+'<b>'+v+'</b></button>';
  $("#nums").innerHTML=h; [].forEach.call(document.querySelectorAll(".nb"),function(b){ b.onclick=function(){ tapNum(+b.dataset.v); }; }); doneNums(); brushOn(); }
function doneNums(){ [].forEach.call(document.querySelectorAll(".nb"),function(b){ var v=+b.dataset.v, n=0; P.g.forEach(function(row){ row.forEach(function(x){ if(x===v) n++; }); }); b.classList.toggle("done",n>=P.N); }); }
/* conflicts and clue checks */
function lineVals(s,i){ var N=P.N, a=[]; for(var k=0;k<N;k++){ var r,c; if(s==="top"){ r=k;c=i; } else if(s==="bottom"){ r=N-1-k;c=i; } else if(s==="left"){ r=i;c=k; } else { r=i;c=N-1-k; } a.push(P.g[r][c]); } return a; }
function marks(){ var N=P.N;
  for(var r=0;r<N;r++) for(var c=0;c<N;c++){ var v=P.g[r][c], bad=false; if(v) for(var i=0;i<N;i++){ if((i!==c&&P.g[r][i]===v)||(i!==r&&P.g[i][c]===v)) bad=true; }
    var e=cellEl(r,c); if(e) e.classList.toggle("bad",bad); var tw=twEl(r,c); if(tw) tw.classList.toggle("bad",bad); }
  [].forEach.call(document.querySelectorAll("#board .clue"),function(e){ var l=lineVals(e.dataset.s,+e.dataset.i), full=l.indexOf(0)<0, k=+e.textContent;
    var was=e.classList.contains("ok"); e.classList.toggle("ok",full&&TWG.seen(l)===k); e.classList.toggle("no",full&&TWG.seen(l)!==k);
    if(!was&&e.classList.contains("ok")&&P.live) sClue(); }); }
function select(r,c){ SEL=[r,c]; [].forEach.call(document.querySelectorAll("#board .cell,#board .tw3"),function(e){ var rr=+e.dataset.r, cc=+e.dataset.c;
  e.classList.toggle("sel",rr===r&&cc===c); if(e.classList.contains("cell")) e.classList.toggle("peer",rr===r||cc===c); }); }
/* turning the board and eye level */
function turn(d){ VIEW.yaw=Math.round(VIEW.yaw/90)*90+d*90; view(); sTurn(); }
function eye(){ VIEW.tilt=VIEW.tilt>60?50:80; view(); sTurn(); if(VIEW.tilt>60) sayOnce("eye",EYE); msg(VIEW.tilt>60?"Eye level! Look along a row: which towers can you see from this side?":""); }
/* drag anywhere on the table to spin the board freely (sideways) and tilt it (up and down), from looking straight down to eye level (Judy, Nov 16) */
var DRAG={on:false,moved:false};
$("#stage").addEventListener("pointerdown",function(e){ if(e.target.closest(".vbtns")) return; DRAG={on:true,moved:false,x:e.clientX,y:e.clientY,yaw:VIEW.yaw,tilt:VIEW.tilt,id:e.pointerId}; });
$("#stage").addEventListener("pointermove",function(e){ if(!DRAG.on||e.pointerId!==DRAG.id) return; var dx=e.clientX-DRAG.x, dy=e.clientY-DRAG.y;
  if(!DRAG.moved&&Math.hypot(dx,dy)<9) return;
  if(!DRAG.moved){ DRAG.moved=true; $("#board").style.transition="none"; try{ $("#stage").setPointerCapture(e.pointerId); }catch(er){} }
  VIEW.yaw=DRAG.yaw-dx*.45; VIEW.tilt=Math.max(0,Math.min(84,DRAG.tilt-dy*.35)); view(); if(!DRAG.snd){ DRAG.snd=1; sTurn(); } });
function dragEnd(){ if(!DRAG.on) return; DRAG.on=false; $("#board").style.transition=""; setTimeout(function(){ DRAG.moved=false; },30);
  if(VIEW.tilt>64) sayOnce("eye",EYE); }
$("#stage").addEventListener("pointerup",dragEnd); $("#stage").addEventListener("pointercancel",dragEnd);
$("#vL").onclick=function(){ turn(1); }; $("#vR").onclick=function(){ turn(-1); }; $("#vEye").onclick=eye;

/* ---------- building ---------- */
/* pick a tower in the tray first, then tap squares to build it (Judy, Nov 16: piece first feels natural). The tower stays picked,
   so you can build several. Tapping a square with no tower picked just selects it (for Erase). */
var BR=0;
function tapCell(r,c){ if(!P||P.done) return; clearHint(); if(P.giv[r+","+c]){ sBad(); msg("Zayden's tip built that tower. It's right!"); return; } select(r,c);
  if(BR){ placeAt(BR); return; } sSel();
  if(!P.g[r][c]&&!P.notes[r][c]){ msg("Pick a tower below first, then tap a square."); sayOnce("sq",SQ); } }
function tapNum(v){ if(!P||P.done) return; clearHint(); BR=(BR===v?0:v); sSel(); brushOn();
  if(BR&&ST.n<1&&!said.num){ msg("Now tap a square to build it there."); sayOnce("num",NUMS); } else if(BR) msg(""); }
function brushOn(){ [].forEach.call(document.querySelectorAll(".nb"),function(b){ b.classList.toggle("on",+b.dataset.v===BR); }); }
function push(){ P.hist.push(JSON.stringify([P.g,P.notes])); if(P.hist.length>200) P.hist.shift(); }
function placeAt(v){ if(!P||P.done||!SEL) return;
  var r=SEL[0], c=SEL[1]; if(P.giv[r+","+c]) return; push();
  if(NOTES){ if(P.g[r][c]) { P.hist.pop(); return; } P.notes[r][c]^=(1<<v); sNote(); drawCell(r,c); saveCur(); return; }
  if(P.g[r][c]===v){ P.g[r][c]=0; sErase(); drawCell(r,c); P.live=true; marks(); P.live=false; doneNums(); saveCur(); return; }
  P.g[r][c]=v; P.notes[r][c]=0;
  /* clear this height from the notes in the same row and column (it can't go there now) */
  for(var i=0;i<P.N;i++){ if(P.notes[r][i]&(1<<v)){ P.notes[r][i]&=~(1<<v); drawCell(r,i); } if(P.notes[i][c]&(1<<v)){ P.notes[i][c]&=~(1<<v); drawCell(i,c); } }
  sSnap(v); drawCell(r,c,true); P.live=true; marks(); P.live=false; doneNums(); saveCur();
  var e=cellEl(r,c); if(e&&e.classList.contains("bad")){ msg("Oops! There's already a "+v+" in that row or column."); sayOnce("dup",DUP); }
  else msg("");
  check(); }
function check(){ var N=P.N; for(var r=0;r<N;r++) for(var c=0;c<N;c++) if(!P.g[r][c]) return;
  var ok=true; for(var r2=0;r2<N;r2++) for(var c2=0;c2<N;c2++) if(P.g[r2][c2]!==P.Z.sol[r2][c2]) ok=false;
  if(ok){ win(); return; }
  msg("Every square has a tower, but something isn't right yet. Look for red numbers and red clues."); say(ALMOST); }
$("#aNote").onclick=function(){ NOTES=!NOTES; this.classList.toggle("on",NOTES); this.setAttribute("aria-pressed",NOTES); sNote();
  msg(NOTES?"Notes are on: tap towers to jot down what a square could be.":""); if(NOTES) sayOnce("notes",NOTESL); };
$("#aErase").onclick=function(){ if(!P||!SEL||P.done) return; var r=SEL[0], c=SEL[1]; if(P.giv[r+","+c]||(!P.g[r][c]&&!P.notes[r][c])) return; push(); P.g[r][c]=0; P.notes[r][c]=0; sErase(); drawCell(r,c); marks(); doneNums(); saveCur(); };
$("#aUndo").onclick=function(){ if(!P||!P.hist.length||P.done) return; var s=JSON.parse(P.hist.pop()); P.g=s[0]; P.notes=s[1]; sErase(); drawCells(); doneNums(); saveCur(); };

/* ---------- hints: a wrong tower first; otherwise build the next tower that the clues force (and say why) ---------- */
var HR=[];
function ringOn(el){ if(!el) return; el.classList.add("ring"); HR.push(el); }
function clearHint(){ HR.forEach(function(e){ e.classList.remove("ring"); }); HR=[]; }
function hint(){ if(!P||P.done) return; clearHint(); sSel(); P.hints++; say(HINT); var N=P.N;
  for(var r=0;r<N;r++) for(var c=0;c<N;c++) if(P.g[r][c]&&P.g[r][c]!==P.Z.sol[r][c]){ select(r,c); ringOn(cellEl(r,c)); msg("Zayden's tip: this tower isn't right. Tap Erase and think again."); saveCur(); return; }
  var giv=[]; for(var r2=0;r2<N;r2++) for(var c2=0;c2<N;c2++) if(P.g[r2][c2]) giv.push([r2,c2,P.g[r2][c2]]);
  var L=TWG.logic({N:N,clues:P.Z.clues,givens:giv,stopAtFirst:true}), f=L.first;
  if(!f){ for(var r3=0;r3<N&&!f;r3++) for(var c3=0;c3<N&&!f;c3++) if(!P.g[r3][c3]) f=[r3,c3,P.Z.sol[r3][c3],"only"]; }
  if(!f) return; push(); var r4=f[0], c4=f[1], v=f[2]; P.g[r4][c4]=v; P.notes[r4][c4]=0; P.giv[r4+","+c4]=1; select(r4,c4); sSnap(v); drawCell(r4,c4,true); marks(); doneNums(); ringOn(cellEl(r4,c4));
  msg("Zayden's tip: "+(f[3]==="row"?"this row needs a "+v+", and this is the only square where it fits.":f[3]==="col"?"this column needs a "+v+", and this is the only square where it fits.":"the clues leave only a "+v+" for this square.")); saveCur(); check(); }
$("#tHint").onclick=hint;

function starsOf(h){ return h===0?3:h<=2?2:1; }
function win(){ P.done=true; saveCur(); var g=gen; if(P.kind!=="bonus"){ ST.n++; save(); } var fresh=BWG.patch("challenge"); sWin();
  [].forEach.call(document.querySelectorAll("#board .cell"),function(e,i){ setTimeout(function(){ e.classList.remove("drop"); void e.offsetWidth; e.classList.add("drop"); },i*35); });
  setTimeout(function(){ if(g!==gen) return; var s=starsOf(P.hints), chal=P.kind==="chal";
    var box=BWK.sheet('<h2>'+(chal?'Challenge complete!':'Warm-up done!')+'</h2>'+BWG.patchLine(fresh)+'<div class="stars">'+"★★★".slice(0,s)+'<i>'+"★★★".slice(0,3-s)+'</i></div>'+
      '<p>'+(chal?'You cracked this week\'s big one'+(P.hints?' with '+P.hints+' hint'+(P.hints>1?'s':''):' with no hints')+'! A new Challenge comes on Monday.':
        'Every tower is in place'+(P.hints?', with '+P.hints+' hint'+(P.hints>1?'s':''):', with no hints')+'.')+'</p>'+
      '<div class="k-row">'+(chal?'':'<button class="k-btn" data-a="chal">The Challenge</button>')+'<button class="k-btn'+(chal?'':' k-ghost')+'" data-a="more">Bonus Warm-up</button><button class="k-btn k-ghost" data-a="out">The Outpost</button></div>');
    var bc=box.querySelector('[data-a=chal]'); if(bc) bc.onclick=function(){ BWK.closeSheet(true); start("chal"); };
    box.querySelector('[data-a=more]').onclick=function(){ BWK.closeSheet(true); start("bonus"); };
    box.querySelector('[data-a=out]').onclick=BWG.toOutpost;
    say(fresh?WINP:chal?WINC:WIN); },900); }

/* ---------- keys on a computer: arrows move, 1-6 build, N notes, Backspace erases, U undo, H hint ---------- */
document.addEventListener("keydown",function(e){ if(!document.body.classList.contains("m-play")||document.querySelector(".k-veil.on")||!P) return; var k=e.key;
  if(k>="1"&&k<="9"&&+k<=P.N){ if(SEL) placeAt(+k); else tapNum(+k); return; }
  if(k.indexOf("Arrow")===0){ e.preventDefault(); var s=SEL||[0,0], d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[k];
    select(Math.max(0,Math.min(P.N-1,s[0]+d[0])),Math.max(0,Math.min(P.N-1,s[1]+d[1]))); return; }
  var l=k.toLowerCase(); if(l==="q") turn(1); else if(l==="e") turn(-1); else if(l==="v") eye(); else if(l==="n") $("#aNote").onclick(); else if(k==="Backspace"||k==="Delete") $("#aErase").onclick(); else if(l==="u") $("#aUndo").onclick(); else if(l==="h") hint(); });

$("#bHow").onclick=function(){ BWK.sheet('<div class="how"><h2>How to Play</h2>'+howPic()+'<p>'+HOW+'</p>'+

  '<p><b>The clues:</b> a clue on the edge is how many towers you can see when you look along that row or column from that side. A taller tower hides every shorter tower behind it. So a <b>1</b> means the tallest tower is right next to the clue, and the biggest clue means the towers go up in order, 1, 2, 3...</p>'+
  '<p><b>Look around:</b> drag the table to spin the board and tilt it, from straight down to eye level. ⟲ and ⟳ turn it a quarter, and Eye level drops your view to the table edge so you can see which towers hide which.</p>'+
  '<p><b>Notes:</b> tap Notes to jot small numbers in a square for what it could be. Red numbers mean the same height is twice in a row or column. A clue turns green when its line is right.</p>'+
  '<p><b>Warm-ups</b> come every day, a little harder each day. <b>The Challenge</b> is one big 6 by 6 puzzle a week, new every Monday. Take all week if you like!</p>'+
  '<p>On a computer: arrow keys move, 1-6 build, N for notes, Backspace erases, U undo, H hint.</p></div>'); say(HOW); };
