<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Play · BrainWhim</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky: #6BA3C9;
            --berry: #F24C7A;
            --text: #F4F8FC;
            --muted: #B7C6D6;
            --glass: rgba(8, 16, 36, 0.42);
            --line: rgba(210, 228, 242, 0.16);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Montserrat, sans-serif;
            color: var(--text);
            background-color: #0a1630;
        }
        body::before {
            content: "";
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: #0a1630 url("galaxy-home.jpg") center / cover no-repeat;
            filter: brightness(1.12) saturate(1.06);
        }
        body::after {
            content: "";
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: linear-gradient(108deg, rgba(40,130,210,.14) 0%, rgba(242,76,122,.16) 42%, rgba(242,76,122,.44) 100%);
        }
        header {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 5%;
            background: rgba(6, 12, 28, 0.22);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(186, 214, 232, 0.16);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
        }
        .brand img { width: 52px; height: 52px; object-fit: contain; margin-right: -6px; }
        .brand span:last-child { color: var(--sky); }
        .crumb {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .crumb a {
            color: #E8F1F8;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
        }
        .crumb a:hover { color: var(--sky); }
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 18px 64px;
        }
        .kicker {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--berry);
            margin: 0 0 8px;
        }
        h1 { font-size: clamp(26px, 5vw, 34px); margin: 0 0 8px; }
        .lede {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 22px;
            max-width: 38em;
        }
        .rooms {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        @media (min-width: 700px) {
            .rooms { grid-template-columns: repeat(3, 1fr); }
        }
        .room {
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px 16px 14px;
            text-align: left;
            color: inherit;
            cursor: pointer;
            width: 100%;
            backdrop-filter: blur(12px);
            min-height: 118px;
        }
        .room small {
            display: block;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--berry);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .room strong { display: block; font-size: 17px; margin-bottom: 6px; }
        .room span { color: var(--muted); font-size: 13px; line-height: 1.45; }
        .room.is-on {
            border-color: rgba(242, 76, 122, 0.75);
            box-shadow: 0 0 0 1px rgba(242, 76, 122, 0.28), 0 12px 30px rgba(0,0,0,.25);
        }
        .stage {
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 18px 16px 20px;
            backdrop-filter: blur(14px);
            min-height: 340px;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .toolbar p { margin: 0; font-size: 13px; color: var(--muted); }
        .ghost {
            background: rgba(255,255,255,.08);
            border: 1px solid var(--line);
            color: #fff;
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .ghost:hover { color: var(--sky); }
        .grid {
            display: grid;
            gap: 8px;
            margin: 0 auto;
        }
        .cell {
            aspect-ratio: 1;
            border: 0;
            border-radius: 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 22px;
            cursor: pointer;
            background: rgba(255,255,255,.08);
            color: #fff;
            transition: background .15s ease, transform .12s ease;
        }
        .cell:active { transform: scale(.96); }
        .cell.on { background: rgba(242,76,122,.88); }
        .cell.matched { background: rgba(107,163,201,.38); cursor: default; }
        .cell.face { background: rgba(242,76,122,.58); }
        .letters, .guess {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .guess { min-height: 48px; margin-bottom: 10px; }
        .letters button, .guess button {
            min-width: 42px;
            height: 46px;
            border-radius: 12px;
            border: 0;
            font-size: 18px;
            font-weight: 700;
            font-family: inherit;
            background: rgba(255,255,255,.12);
            color: #fff;
            cursor: pointer;
        }
        .hint, .win {
            text-align: center;
            margin: 12px 0 0;
        }
        .hint { color: var(--muted); font-size: 13px; }
        .win {
            color: #fff;
            font-weight: 700;
            font-size: 15px;
        }
        .best {
            font-size: 12px;
            color: var(--sky);
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="index.html">
            <img src="logo-image.png" alt="">
            <span>Brain</span><span>Whim</span>
        </a>
        <nav class="crumb">
            <a href="play.html">Play</a>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="wrap">
        <p class="kicker">Play · Puzzle</p>
        <h1>Puzzle Play</h1>
        <p class="lede">Three quiet rooms. Pick one, finish a round, stay as long as you like. Progress on this device is saved.</p>

        <div class="rooms">
            <button class="room is-on" data-game="match">
                <small>Room 01</small>
                <strong>Star Match</strong>
                <span>Turn cards. Find the pairs.</span>
            </button>
            <button class="room" data-game="word">
                <small>Room 02</small>
                <strong>Drift Word</strong>
                <span>Unscramble a short sky word.</span>
            </button>
            <button class="room" data-game="grid">
                <small>Room 03</small>
                <strong>Signal Grid</strong>
                <span>Flip a cell and its neighbors dark.</span>
            </button>
        </div>

        <section class="stage" id="stage" aria-live="polite"></section>
    </main>

    <script>
        const KEY = 'bw-puzzle-v1';
        const store = JSON.parse(localStorage.getItem(KEY) || '{}');
        function save() { localStorage.setItem(KEY, JSON.stringify(store)); }

        const stage = document.getElementById('stage');
        const rooms = document.querySelectorAll('.room');
        let game = store.lastGame || 'match';

        rooms.forEach(btn => {
            btn.classList.toggle('is-on', btn.dataset.game === game);
            btn.addEventListener('click', () => {
                game = btn.dataset.game;
                store.lastGame = game;
                save();
                rooms.forEach(x => x.classList.toggle('is-on', x === btn));
                start();
            });
        });

        function start() {
            if (game === 'match') startMatch();
            if (game === 'word') startWord();
            if (game === 'grid') startGrid();
        }

        function startMatch() {
            const icons = ['✦','☾','☀','☄','★','✧','✺','✶'];
            const deck = shuffle([...icons, ...icons]);
            let first = null, lock = false, moves = 0, found = 0;
            const best = store.matchBest;
            stage.innerHTML = `
                <div class="toolbar">
                    <p id="mStat">Moves 0 · 0 / 8 pairs</p>
                    <button class="ghost" id="mNew" type="button">New round</button>
                </div>
                <div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr));max-width:380px"></div>
                <p class="win" id="mWin"></p>
                <p class="best">${best ? 'Best on this device: ' + best + ' moves' : 'No best yet — finish a board.'}</p>`;
            const grid = stage.querySelector('.grid');
            const stat = stage.querySelector('#mStat');
            const win = stage.querySelector('#mWin');
            deck.forEach((icon) => {
                const b = document.createElement('button');
                b.className = 'cell';
                b.dataset.icon = icon;
                b.setAttribute('aria-label', 'hidden card');
                b.onclick = () => {
                    if (lock || b.classList.contains('matched') || b.classList.contains('face')) return;
                    b.textContent = icon;
                    b.classList.add('face');
                    if (!first) { first = b; return; }
                    moves++;
                    if (first.dataset.icon === icon && first !== b) {
                        first.classList.add('matched');
                        b.classList.add('matched');
                        first = null;
                        found++;
                        stat.textContent = `Moves ${moves} · ${found} / 8 pairs`;
                        if (found === 8) {
                            win.textContent = 'Board clear.';
                            if (!store.matchBest || moves < store.matchBest) {
                                store.matchBest = moves;
                                save();
                                stage.querySelector('.best').textContent = 'New best: ' + moves + ' moves';
                            }
                        }
                    } else {
                        lock = true;
                        const a = first;
                        setTimeout(() => {
                            a.textContent = ''; a.classList.remove('face');
                            b.textContent = ''; b.classList.remove('face');
                            first = null; lock = false;
                            stat.textContent = `Moves ${moves} · ${found} / 8 pairs`;
                        }, 620);
                    }
                };
                grid.appendChild(b);
            });
            stage.querySelector('#mNew').onclick = startMatch;
        }

        const WORDS = ['WHIM','STAR','ORBIT','PLAY','SPARK','DREAM','GLOW','NOVA','LUNAR','COMET','QUIET','LIGHT'];
        function startWord() {
            const word = WORDS[Math.floor(Math.random() * WORDS.length)];
            const letters = shuffle(word.split(''));
            let guess = [];
            const solved = store.wordsSolved || 0;
            stage.innerHTML = `
                <div class="toolbar">
                    <p>Unscramble · ${word.length} letters</p>
                    <button class="ghost" id="wNew" type="button">New word</button>
                </div>
                <div class="guess" id="guess"></div>
                <div class="letters" id="pool"></div>
                <p class="hint">Tap letters up, tap again to send them back.</p>
                <p class="win" id="wWin"></p>
                <p class="best">Words finished on this device: ${solved}</p>`;
            const pool = stage.querySelector('#pool');
            const guessEl = stage.querySelector('#guess');
            const win = stage.querySelector('#wWin');
            function render() {
                guessEl.innerHTML = '';
                guess.forEach((ch, i) => {
                    const b = document.createElement('button');
                    b.textContent = ch;
                    b.onclick = () => { guess.splice(i,1); render(); };
                    guessEl.appendChild(b);
                });
                pool.innerHTML = '';
                const used = [...guess];
                letters.forEach((ch) => {
                    const idx = used.indexOf(ch);
                    const b = document.createElement('button');
                    b.textContent = ch;
                    if (idx >= 0) {
                        used.splice(idx, 1);
                        b.style.opacity = '.28';
                        b.disabled = true;
                    } else {
                        b.onclick = () => {
                            guess.push(ch);
                            render();
                            if (guess.join('') === word) {
                                win.textContent = word + ' — yes.';
                                store.wordsSolved = (store.wordsSolved || 0) + 1;
                                save();
                                stage.querySelector('.best').textContent = 'Words finished on this device: ' + store.wordsSolved;
                            }
                        };
                    }
                    pool.appendChild(b);
                });
            }
            render();
            stage.querySelector('#wNew').onclick = startWord;
        }

        function startGrid() {
            const n = 4;
            let cells = Array(n * n).fill(0).map(() => Math.random() > 0.55 ? 1 : 0);
            let taps = 0;
            const best = store.gridBest;
            stage.innerHTML = `
                <div class="toolbar">
                    <p id="gStat">Turn every cell dark</p>
                    <button class="ghost" id="gNew" type="button">New grid</button>
                </div>
                <div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr));max-width:340px"></div>
                <p class="hint">A tap flips that cell and the ones beside it.</p>
                <p class="win" id="gWin"></p>
                <p class="best">${best ? 'Best on this device: ' + best + ' taps' : 'No best yet — clear a grid.'}</p>`;
            const grid = stage.querySelector('.grid');
            const win = stage.querySelector('#gWin');
            function flip(i) {
                const x = i % n, y = Math.floor(i / n);
                [[0,0],[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx,dy]) => {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < n && ny >= 0 && ny < n) cells[ny * n + nx] ^= 1;
                });
            }
            function draw() {
                grid.innerHTML = '';
                cells.forEach((v, i) => {
                    const b = document.createElement('button');
                    b.className = 'cell' + (v ? ' on' : '');
                    b.onclick = () => {
                        taps++;
                        flip(i);
                        draw();
                        stage.querySelector('#gStat').textContent = taps + ' taps';
                        if (cells.every(c => c === 0)) {
                            win.textContent = 'Signal quiet.';
                            if (!store.gridBest || taps < store.gridBest) {
                                store.gridBest = taps;
                                save();
                                stage.querySelector('.best').textContent = 'New best: ' + taps + ' taps';
                            }
                        }
                    };
                    grid.appendChild(b);
                });
            }
            draw();
            stage.querySelector('#gNew').onclick = startGrid;
        }

        function shuffle(a) {
            const x = [...a];
            for (let i = x.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [x[i], x[j]] = [x[j], x[i]];
            }
            return x;
        }

        start();
    </script>
</body>
</html>
