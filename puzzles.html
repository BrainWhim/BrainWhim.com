<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sky Word · BrainWhim Play</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A2744;--bg:#F3F4F6;--line:#D0D5DD;--muted:#4B5E73;--whim:#7EB6D9;--exact:#3D8B5C;--close:#C9A227;--miss:#8A94A3}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--navy);font-family:Montserrat,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--navy)}
.brand{display:flex;align-items:center;text-decoration:none;color:#fff;font-size:18px}
.brand img{width:44px;height:44px;object-fit:contain;margin-right:-6px}
.brand .brain{font-weight:600;color:#fff}
.brand .whim{font-family:Pacifico,cursive;color:var(--whim);font-size:1.08em;margin-left:-1px;font-weight:400}
.hdr{display:flex;gap:12px;align-items:center}
.hdr button,.hdr a{background:0;border:0;color:#fff;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer;font-family:inherit}
.shell{max-width:420px;margin:0 auto;padding:18px 14px 28px}
.title{text-align:center;margin:4px 0 2px;font-size:26px}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 14px}
.modes{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.modes button{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.modes button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:300px;margin:0 auto 16px}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;text-transform:uppercase;background:#fff;color:var(--navy);transition:transform .32s ease}
.cell.fill{border-color:var(--navy)}
.cell.flip{transform:rotateX(90deg)}
.cell.exact{background:var(--exact);border-color:var(--exact);color:#fff}
.cell.close{background:var(--close);border-color:var(--close);color:#fff}
.cell.miss{background:var(--miss);border-color:var(--miss);color:#fff}
.keys{display:grid;gap:6px}
.kr{display:flex;justify-content:center;gap:5px}
.keys button{min-width:28px;height:48px;padding:0 7px;border:0;border-radius:8px;background:#E5E8ED;color:var(--navy);font-weight:700;font-size:13px;font-family:inherit;cursor:pointer}
.keys button.wide{min-width:56px;font-size:11px}
.keys button.exact{background:var(--exact);color:#fff}
.keys button.close{background:var(--close);color:#fff}
.keys button.miss{background:var(--miss);color:#fff}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(26,39,68,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.modal.on{display:flex}
.card{background:#fff;border-radius:18px;padding:0;width:100%;max-width:340px;overflow:hidden;text-align:center}
.card-top{background:var(--navy);color:#fff;padding:18px 18px 16px}
.card-top .mark{font-family:Pacifico,cursive;color:var(--whim);font-size:20px}
.card-top h2{margin:6px 0 4px;font-size:22px}
.card-top p{margin:0;opacity:.85;font-size:13px}
.card-body{padding:16px 18px 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.stats b{display:block;font-size:22px}
.stats span{font-size:11px;color:var(--muted)}
.sharebox{font-family:ui-monospace,Menlo,monospace;font-size:16px;line-height:1.25;margin:0 0 12px;letter-spacing:2px}
.card-body button,.card-body .ghost{display:block;width:100%;margin-top:8px;border-radius:12px;padding:12px;font-weight:700;font-family:inherit;cursor:pointer;font-size:14px}
.card-body button{background:var(--navy);color:#fff;border:0}
.card-body .ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}

.games{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 12px}
.games button{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.games button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mg{display:grid;gap:8px;margin:0 auto;max-width:340px}
.mtile{aspect-ratio:1;border:0;border-radius:12px;background:#E5E8ED;color:var(--navy);font-size:26px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .22s ease,background .2s}
.mtile.back{color:transparent}
.mtile.face,.mtile.matched{background:#fff;border:2px solid var(--navy);color:var(--navy);transform:rotateY(0)}
.mtile.matched{background:#D7E8F4;border-color:#6BA3C9}
.mbar{display:flex;justify-content:space-between;align-items:center;max-width:340px;margin:0 auto 12px;font-size:13px;color:var(--muted)}
.mbar button{border:0;border-radius:999px;padding:7px 12px;background:var(--navy);color:#fff;font-weight:700;font-family:inherit;cursor:pointer;font-size:12px}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.letters button{min-width:44px;height:48px;border:0;border-radius:10px;background:#E5E8ED;color:var(--navy);font-weight:800;font-size:18px;font-family:inherit;cursor:pointer}
.letters button.used{opacity:.28}
.gcell.on{background:var(--navy);color:#fff}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html"><img src="logo-image.png" alt=""><span class="brain">Brain</span><span class="whim">Whim</span></a>
<div class="hdr"><button type="button" id="btnStats">Stats</button><a href="play.html">Play</a><a href="index.html">Home</a></div>
</header>
<div class="toast" id="toast"></div>
<main class="shell">
<div class="games" id="gameNav">
<button class="on" data-g="sky" type="button">Sky Word</button>
<button data-g="match" type="button">Star Match</button>
<button data-g="drift" type="button">Drift Word</button>
<button data-g="grid" type="button">Signal Grid</button>
</div>
<div id="skyApp">
<h1 class="title">Sky Word</h1>
<p class="sub" id="sub">Daily five-letter word. Six tries.</p>
<div class="modes">
<button class="on" id="mDaily" type="button">Daily</button>
<button id="mPractice" type="button">Practice</button>
</div>
<div class="board" id="board"></div>
<div class="keys" id="keys"></div>
</div>
<div id="otherApp" hidden></div>
</main>
<div class="modal" id="modal">
<div class="card">
<div class="card-top">
<div class="mark">BrainWhim</div>
<h2 id="mTitle">Sky Word</h2>
<p id="mBody"></p>
</div>
<div class="card-body">
<div class="stats">
<div><b id="sP">0</b><span>Played</span></div>
<div><b id="sW">0</b><span>Win %</span></div>
<div><b id="sC">0</b><span>Streak</span></div>
<div><b id="sB">0</b><span>Best</span></div>
</div>
<div class="sharebox" id="sharebox"></div>
<button type="button" id="mShare">Copy result</button>
<button type="button" class="ghost" id="mClose">Close</button>
</div>
</div>
</div>

function startMatch(){
  const icons=["✦","☾","☀","☄","★","✧","✺","✶"];
  const deck=shuffle([...icons,...icons]);
  let first=null,lock=false,moves=0,found=0;
  if(!S.matchBest) S.matchBest=null;
  other.innerHTML=`<h1 class="title">Star Match</h1><p class="sub">Eight pairs. Flip two at a time.</p>
    <div class="mbar"><span id="ms">0 moves · 0 / 8</span><button type="button" id="mn">New board</button></div>
    <div class="mg" id="mg" style="grid-template-columns:repeat(4,1fr)"></div>
    <p class="sub">${S.matchBest?("Best "+S.matchBest+" moves"):"Finish a board for a best."}</p>`;
  const mg=other.querySelector("#mg");
  deck.forEach((icon,i)=>{
    const b=document.createElement("button");
    b.className="mtile back"; b.textContent="✦";
    b.onclick=()=>{
      if(lock||b.classList.contains("matched")||b.classList.contains("face")) return;
      b.classList.remove("back"); b.classList.add("face"); b.textContent=icon;
      if(!first){ first=b; return; }
      moves++;
      if(first!==b && first.dataset.i===icon){
        first.classList.add("matched"); b.classList.add("matched"); first=null; found++;
        other.querySelector("#ms").textContent=moves+" moves · "+found+" / 8";
        if(found===8){
          if(!S.matchBest||moves<S.matchBest){ S.matchBest=moves; save(); }
          otherWin("Board clear.", moves+" moves"+(S.matchBest===moves?" · best":""));
        }
      } else {
        lock=true; const a=first;
        setTimeout(()=>{ a.textContent="✦"; a.className="mtile back"; b.textContent="✦"; b.className="mtile back"; first=null; lock=false;
          other.querySelector("#ms").textContent=moves+" moves · "+found+" / 8"; }, 650);
      }
    };
    b.dataset.i=icon; mg.appendChild(b);
  });
  other.querySelector("#mn").onclick=startMatch;
}
const DRIFT=["ORBIT","SPARK","CLOUD","LIGHT","DREAM","QUIET","TRACE","FIELD","STONE","RIVER","OCEAN","MAPLE","NORTH","SOUTH","EARTH","SPACE","MOONS","PRISM","QUEST","BRAIN","HOUSE","WORLD","MUSIC","HEART","PLANT","WATER","STORY","SMILE","THINK","BRING","CLEAR","SHARE","START","PLACE","POINT","RIGHT","SOUND","STILL","HONOR","PEACE","GRACE","FRESH","BLOOM","FLAME","STORM","NIGHT","CHART","CRAFT"];
function startDrift(){
  const W=DRIFT[Math.floor(Math.random()*DRIFT.length)];
  const letters=shuffle(W.split(""));
  let guess=[];
  S.driftSolved=S.driftSolved||0;
  other.innerHTML=`<h1 class="title">Drift Word</h1><p class="sub">Unscramble · ${W.length} letters</p>
    <div class="mbar"><span id="ds">${S.driftSolved} solved on this device</span><button type="button" id="dn">New word</button></div>
    <div class="letters" id="built"></div>
    <div class="letters" id="pool"></div>
    <p class="sub">Tap up to spell. Tap a letter to send it back.</p>`;
  const built=other.querySelector("#built");
  const pool=other.querySelector("#pool");
  function draw(){
    built.innerHTML="";
    guess.forEach((ch,i)=>{ const b=document.createElement("button"); b.textContent=ch; b.onclick=()=>{ guess.splice(i,1); draw(); }; built.appendChild(b); });
    pool.innerHTML="";
    const used=[...guess];
    letters.forEach(ch=>{
      const b=document.createElement("button"); b.textContent=ch;
      const idx=used.indexOf(ch);
      if(idx>=0){ used.splice(idx,1); b.className="used"; b.disabled=true; }
      else b.onclick=()=>{ guess.push(ch); draw(); if(guess.join("")===W){ S.driftSolved++; save(); otherWin(W,"Unscrambled."); } };
      pool.appendChild(b);
    });
  }
  draw(); other.querySelector("#dn").onclick=startDrift;
}
function startGrid(){
  const n=5;
  let cells=Array(n*n).fill(0);
  // generate solvable: start dark, apply random taps
  for(let k=0;k<12;k++){
    const i=Math.floor(Math.random()*n*n);
    flipAt(cells,i,n);
  }
  if(cells.every(c=>c===0)) cells[0]=1;
  let taps=0;
  other.innerHTML=`<h1 class="title">Signal Grid</h1><p class="sub">Turn every cell dark. A tap flips a cell and its neighbors.</p>
    <div class="mbar"><span id="gs">0 taps</span><button type="button" id="gn">New grid</button></div>
    <div class="mg" id="gg" style="grid-template-columns:repeat(5,1fr);max-width:320px"></div>`;
  const gg=other.querySelector("#gg");
  function flipAt(arr,i,n){
    const x=i%n,y=Math.floor(i/n);
    [[0,0],[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx,dy])=>{
      const nx=x+dx,ny=y+dy; if(nx>=0&&nx<n&&ny>=0&&ny<n) arr[ny*n+nx]^=1;
    });
  }
  function draw(){
    gg.innerHTML="";
    cells.forEach((v,i)=>{
      const b=document.createElement("button");
      b.className="mtile"+(v?" on gcell":"");
      b.onclick=()=>{ taps++; flipAt(cells,i,n); other.querySelector("#gs").textContent=taps+" taps"; draw();
        if(cells.every(c=>c===0)){
          if(!S.gridBest||taps<S.gridBest){ S.gridBest=taps; save(); }
          otherWin("Signal quiet.", taps+" taps");
        }
      };
      gg.appendChild(b);
    });
  }
  draw(); other.querySelector("#gn").onclick=startGrid;
}

function type(ch){ if(done||flipping||col>=5)return; rows[row][col]=ch; col++; paintBoard(); }
function back(){ if(done||flipping||col===0)return; col--; rows[row][col]=""; paintBoard(); }
function score(guess){
  const res=Array(5).fill("miss"); const left=answer.split("");
  guess.forEach((ch,i)=>{ if(ch===answer[i]){ res[i]="exact"; left[i]=null; }});
  guess.forEach((ch,i)=>{ if(res[i]==="exact")return; const at=left.indexOf(ch); if(at>=0){ res[i]="close"; left[at]=null; }});
  return res;
}
function finish(win){
  done=true;
  if(mode==="daily" && S.dailyDay!==dayIndex){
    S.stats.played++;
    if(win){ S.stats.wins++; S.stats.streak++; S.stats.best=Math.max(S.stats.best,S.stats.streak); }
    else S.stats.streak=0;
    S.dailyDay=dayIndex; save();
  }
  document.getElementById("mTitle").textContent=win?"You got it.":"Not this time.";
  document.getElementById("mBody").textContent=win?answer+" · "+(row+1)+" of 6":"The word was "+answer+".";
  const st=S.stats;
  document.getElementById("sP").textContent=st.played;
  document.getElementById("sW").textContent=st.played?Math.round(st.wins/st.played*100):0;
  document.getElementById("sC").textContent=st.streak;
  document.getElementById("sB").textContent=st.best;
  document.getElementById("sharebox").textContent=shareLines.join("\n");
  setTimeout(()=>modal.classList.add("on"), 280);
}
function submit(){
  if(done||flipping) return;
  if(col<5){ say("Need 5 letters"); return; }
  const guess=rows[row], g=guess.join("");
  if(!ALLOW.has(g)){ say("Not in this list"); return; }
  const res=score(guess);
  flipping=true;
  const cells=[...board.children].slice(row*5, row*5+5);
  cells.forEach((cell,i)=>{
    setTimeout(()=>{ cell.classList.add("flip"); }, i*160);
    setTimeout(()=>{
      cell.classList.remove("flip");
      cell.classList.add(res[i]);
      marks[row][i]=res[i];
    }, i*160+160);
  });
  const map={miss:"⬛",close:"🟨",exact:"🟩"};
  shareLines.push(res.map(x=>map[x]).join(""));
  const rank={miss:1,close:2,exact:3};
  res.forEach((m,i)=>{ const ch=guess[i]; if(!keyMap[ch]||rank[m]>rank[keyMap[ch]]) keyMap[ch]=m; });
  const wait=5*160+220;
  setTimeout(()=>{
    flipping=false; paintKeys();
    if(res.every(x=>x==="exact")) finish(true);
    else if(row===5) finish(false);
    else { row++; col=0; }
  }, wait);
}

  const icons=["✦","☾","☀","☄","★","✧","✺","✶"];
  const deck=shuffle([...icons,...icons]);
  let first=null,lock=false,moves=0,found=0;
  if(!S.matchBest) S.matchBest=null;
  other.innerHTML=`<h1 class="title">Star Match</h1><p class="sub">Eight pairs. Flip two at a time.</p>
    <div class="mbar"><span id="ms">0 moves · 0 / 8</span><button type="button" id="mn">New board</button></div>
    <div class="mg" id="mg" style="grid-template-columns:repeat(4,1fr)"></div>
    <p class="sub">${S.matchBest?("Best "+S.matchBest+" moves"):"Finish a board for a best."}</p>`;
  const mg=other.querySelector("#mg");
  deck.forEach((icon,i)=>{
    const b=document.createElement("button");
    b.className="mtile back"; b.textContent="✦";
    b.onclick=()=>{
      if(lock||b.classList.contains("matched")||b.classList.contains("face")) return;
      b.classList.remove("back"); b.classList.add("face"); b.textContent=icon;
      if(!first){ first=b; return; }
      moves++;
      if(first!==b && first.dataset.i===icon){
        first.classList.add("matched"); b.classList.add("matched"); first=null; found++;
        other.querySelector("#ms").textContent=moves+" moves · "+found+" / 8";
        if(found===8){
          if(!S.matchBest||moves<S.matchBest){ S.matchBest=moves; save(); }
          otherWin("Board clear.", moves+" moves"+(S.matchBest===moves?" · best":""));
        }
      } else {
        lock=true; const a=first;
        setTimeout(()=>{ a.textContent="✦"; a.className="mtile back"; b.textContent="✦"; b.className="mtile back"; first=null; lock=false;
          other.querySelector("#ms").textContent=moves+" moves · "+found+" / 8"; }, 650);
      }
    };
    b.dataset.i=icon; mg.appendChild(b);
  });
  other.querySelector("#mn").onclick=startMatch;
}
const DRIFT=["ORBIT","SPARK","CLOUD","LIGHT","DREAM","QUIET","TRACE","FIELD","STONE","RIVER","OCEAN","MAPLE","NORTH","SOUTH","EARTH","SPACE","MOONS","PRISM","QUEST","BRAIN","HOUSE","WORLD","MUSIC","HEART","PLANT","WATER","STORY","SMILE","THINK","BRING","CLEAR","SHARE","START","PLACE","POINT","RIGHT","SOUND","STILL","HONOR","PEACE","GRACE","FRESH","BLOOM","FLAME","STORM","NIGHT","CHART","CRAFT"];
function startDrift(){
  const W=DRIFT[Math.floor(Math.random()*DRIFT.length)];
  const letters=shuffle(W.split(""));
  let guess=[];
  S.driftSolved=S.driftSolved||0;
  other.innerHTML=`<h1 class="title">Drift Word</h1><p class="sub">Unscramble · ${W.length} letters</p>
    <div class="mbar"><span id="ds">${S.driftSolved} solved on this device</span><button type="button" id="dn">New word</button></div>
    <div class="letters" id="built"></div>
    <div class="letters" id="pool"></div>
    <p class="sub">Tap up to spell. Tap a letter to send it back.</p>`;
  const built=other.querySelector("#built");
  const pool=other.querySelector("#pool");
  function draw(){
    built.innerHTML="";
    guess.forEach((ch,i)=>{ const b=document.createElement("button"); b.textContent=ch; b.onclick=()=>{ guess.splice(i,1); draw(); }; built.appendChild(b); });
    pool.innerHTML="";
    const used=[...guess];
    letters.forEach(ch=>{
      const b=document.createElement("button"); b.textContent=ch;
      const idx=used.indexOf(ch);
      if(idx>=0){ used.splice(idx,1); b.className="used"; b.disabled=true; }
      else b.onclick=()=>{ guess.push(ch); draw(); if(guess.join("")===W){ S.driftSolved++; save(); otherWin(W,"Unscrambled."); } };
      pool.appendChild(b);
    });
  }
  draw(); other.querySelector("#dn").onclick=startDrift;
}
function startGrid(){
  const n=5;
  let cells=Array(n*n).fill(0);
  // generate solvable: start dark, apply random taps
  for(let k=0;k<12;k++){
    const i=Math.floor(Math.random()*n*n);
    flipAt(cells,i,n);
  }
  if(cells.every(c=>c===0)) cells[0]=1;
  let taps=0;
  other.innerHTML=`<h1 class="title">Signal Grid</h1><p class="sub">Turn every cell dark. A tap flips a cell and its neighbors.</p>
    <div class="mbar"><span id="gs">0 taps</span><button type="button" id="gn">New grid</button></div>
    <div class="mg" id="gg" style="grid-template-columns:repeat(5,1fr);max-width:320px"></div>`;
  const gg=other.querySelector("#gg");
  function flipAt(arr,i,n){
    const x=i%n,y=Math.floor(i/n);
    [[0,0],[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx,dy])=>{
      const nx=x+dx,ny=y+dy; if(nx>=0&&nx<n&&ny>=0&&ny<n) arr[ny*n+nx]^=1;
    });
  }
  function draw(){
    gg.innerHTML="";
    cells.forEach((v,i)=>{
      const b=document.createElement("button");
      b.className="mtile"+(v?" on gcell":"");
      b.onclick=()=>{ taps++; flipAt(cells,i,n); other.querySelector("#gs").textContent=taps+" taps"; draw();
        if(cells.every(c=>c===0)){
          if(!S.gridBest||taps<S.gridBest){ S.gridBest=taps; save(); }
          otherWin("Signal quiet.", taps+" taps");
        }
      };
      gg.appendChild(b);
    });
  }
  draw(); other.querySelector("#gn").onclick=startGrid;
}

paintBoard(); paintKeys();
</script>
