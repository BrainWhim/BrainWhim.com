<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Puzzle Play · BrainWhim</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1A2744;
            --bg: #F3F4F6;
            --panel: #FFFFFF;
            --panel-2: #E5E8ED;
            --line: #D0D5DD;
            --text: #1A2744;
            --muted: #4B5E73;
            --sky: #6BA3C9;
            --whim: #7EB6D9;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Montserrat, sans-serif;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 18px;
            background: var(--navy);
            border-bottom: 1px solid #243456;
        }
        .brand {
            display: flex; align-items: center; gap: 0;
            text-decoration: none; color: #fff; font-weight: 700; font-size: 18px;
        }
        .brand img { width: 48px; height: 48px; object-fit: contain; margin-right: -6px; }
        .brand .brain { font-weight: 600; color: #fff; }
        .brand .whim {
            font-family: Pacifico, cursive;
            font-weight: 400;
            font-size: 1.1em;
            color: var(--whim);
            margin-left: -1px;
        }
        .links { display: flex; gap: 16px; }
        .links a { color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; }
        .links a:hover { color: var(--whim); }
        .app {
            max-width: 430px;
            margin: 0 auto;
            min-height: calc(100dvh - 58px);
            padding: 20px 16px 36px;
        }
        @media (min-width: 800px) {
            .app { max-width: 820px; padding-top: 28px; }
        }
        .kicker { color: var(--navy); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 6px; }
        h1 { margin: 0 0 8px; font-size: 28px; color: var(--navy); }
        .lede { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.55; }
        .lobby { display: grid; gap: 10px; margin-bottom: 16px; grid-template-columns: 1fr 1fr; }
        @media (min-width: 800px) { .lobby { grid-template-columns: repeat(4, 1fr); } }
        .game-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px;
            text-align: left;
            color: var(--navy);
            width: 100%;
            cursor: pointer;
        }
        .game-card strong { display: block; font-size: 16px; margin-bottom: 4px; }
        .game-card span { color: var(--muted); font-size: 12px; line-height: 1.4; }
        .game-card.is-on { border-color: var(--navy); background: #E8EEF4; }
        .playfield {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 14px 12px 16px;
        }
        .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
        .bar p { margin: 0; font-size: 13px; color: var(--muted); }
        .btn {
            border: 0; border-radius: 999px; padding: 8px 12px;
            background: var(--panel-2); color: var(--navy);
            font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit;
        }
        .grid { display: grid; gap: 8px; margin: 0 auto; }
        .tile {
            aspect-ratio: 1; border: 0; border-radius: 12px;
            background: var(--panel-2); color: var(--navy);
            font-size: 22px; font-weight: 700; font-family: inherit; cursor: pointer;
        }
        .tile.on { background: var(--navy); color: #fff; }
        .tile.face { background: #C5D0DE; color: var(--navy); }
        .tile.matched { background: var(--sky); color: #fff; }
        .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .row button {
            min-width: 42px; height: 44px; border: 0; border-radius: 10px;
            background: var(--panel-2); color: var(--navy); font-weight: 700;
            font-size: 17px; font-family: inherit; cursor: pointer;
        }
        .note, .win { text-align: center; margin: 10px 0 0; font-size: 13px; color: var(--navy); }
        .note { color: var(--muted); }
        .win { font-weight: 700; }
        .wdl {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 280px;
            margin: 0 auto 14px;
        }
        .wdl div {
            aspect-ratio: 1;
            border: 2px solid var(--line);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; text-transform: uppercase;
            background: #fff; color: var(--navy);
        }
        .wdl div.exact { background: #3d8b5c; border-color: #3d8b5c; color: #fff; }
        .wdl div.close { background: #c9a227; border-color: #c9a227; color: #fff; }
        .wdl div.miss { background: #8a94a3; border-color: #8a94a3; color: #fff; }
        .keys { display: grid; gap: 6px; max-width: 420px; margin: 0 auto; }
        .keys .kr { display: flex; justify-content: center; gap: 5px; }
        .keys button {
            min-width: 28px; height: 42px; padding: 0 8px;
            border: 0; border-radius: 8px;
            background: var(--panel-2); color: var(--navy);
            font-weight: 700; font-size: 13px; font-family: inherit; cursor: pointer;
        }
        .keys button.wide { min-width: 52px; font-size: 11px; }
        .keys button.exact { background: #3d8b5c; color: #fff; }
        .keys button.close { background: #c9a227; color: #fff; }
        .keys button.miss { background: #8a94a3; color: #fff; }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="index.html"><img src="logo-image.png" alt="BrainWhim"><span class="brain">Brain</span><span class="whim">Whim</span></a>
        <nav class="links">
            <a href="play.html">Play</a>
            <a href="index.html">Home</a>
        </nav>
    </header>
    <main class="app">
        <p class="kicker">Play</p>
        <h1>Puzzle Play</h1>
        <p class="lede">Four rooms. Paper field, navy bar. Sky Word is a five-letter guess — six tries.</p>
        <div class="lobby">
            <button class="game-card is-on" data-game="match"><strong>Star Match</strong><span>Find the pairs.</span></button>
            <button class="game-card" data-game="word"><strong>Drift Word</strong><span>Unscramble.</span></button>
            <button class="game-card" data-game="grid"><strong>Signal Grid</strong><span>Lights out.</span></button>
            <button class="game-card" data-game="sky"><strong>Sky Word</strong><span>Five letters. Six tries.</span></button>
        </div>
        <section class="playfield" id="stage"></section>
    </main>
    <script>
        const KEY = 'bw-puzzle-v3';
        const store = JSON.parse(localStorage.getItem(KEY) || '{}');
        const save = () => localStorage.setItem(KEY, JSON.stringify(store));
        const stage = document.getElementById('stage');
        const cards = document.querySelectorAll('.game-card');
        let game = store.last || 'match';
        cards.forEach(c => {
            c.classList.toggle('is-on', c.dataset.game === game);
            c.onclick = () => {
                game = c.dataset.game; store.last = game; save();
                cards.forEach(x => x.classList.toggle('is-on', x === c));
                start();
            };
        });
        function start(){
            if (game==='match') match();
            else if (game==='word') word();
            else if (game==='grid') grid();
            else sky();
        }
        function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }

        function match(){
            const icons=['✦','☾','☀','☄','★','✧','✺','✶'];
            const deck=shuffle([...icons,...icons]);
            let first=null,lock=false,moves=0,found=0;
            stage.innerHTML=`<div class="bar"><p id="s">0 moves · 0/8</p><button class="btn" id="n">New</button></div>
                <div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr));max-width:360px"></div>
                <p class="win" id="w"></p><p class="note">${store.mb?('Best '+store.mb+' moves'):'Finish a board to set a best.'}</p>`;
            const g=stage.querySelector('.grid');
            deck.forEach(icon=>{
                const b=document.createElement('button'); b.className='tile';
                b.onclick=()=>{
                    if(lock||b.classList.contains('matched')||b.classList.contains('face'))return;
                    b.textContent=icon; b.classList.add('face');
                    if(!first){first=b;return;}
                    moves++;
                    if(first!==b && first.dataset.i===icon){
                        first.classList.add('matched'); b.classList.add('matched'); first=null; found++;
                        stage.querySelector('#s').textContent=moves+' moves · '+found+'/8';
                        if(found===8){ stage.querySelector('#w').textContent='Clear.';
                            if(!store.mb||moves<store.mb){store.mb=moves;save();} }
                    } else {
                        lock=true; const a=first;
                        setTimeout(()=>{a.textContent='';a.classList.remove('face');b.textContent='';b.classList.remove('face');first=null;lock=false;
                            stage.querySelector('#s').textContent=moves+' moves · '+found+'/8';},600);
                    }
                };
                b.dataset.i=icon; g.appendChild(b);
            });
            stage.querySelector('#n').onclick=match;
        }
        function word(){
            const WORDS=['WHIM','STAR','ORBIT','PLAY','SPARK','DREAM','GLOW','NOVA','LUNAR','COMET'];
            const W=WORDS[Math.floor(Math.random()*WORDS.length)];
            const L=shuffle(W.split('')); let guess=[];
            stage.innerHTML=`<div class="bar"><p>${W.length} letters</p><button class="btn" id="n">New word</button></div>
                <div class="row" id="guess" style="min-height:46px;margin-bottom:10px"></div>
                <div class="row" id="pool"></div>
                <p class="note">Tap up to spell. Tap a letter to send it back.</p>
                <p class="win" id="w"></p>`;
            const draw=()=>{
                const ge=stage.querySelector('#guess'); const po=stage.querySelector('#pool');
                ge.innerHTML=''; guess.forEach((ch,i)=>{ const b=document.createElement('button'); b.textContent=ch; b.onclick=()=>{guess.splice(i,1);draw();}; ge.appendChild(b); });
                po.innerHTML=''; const used=[...guess];
                L.forEach(ch=>{
                    const b=document.createElement('button'); b.textContent=ch;
                    const idx=used.indexOf(ch);
                    if(idx>=0){ used.splice(idx,1); b.style.opacity='.3'; b.disabled=true; }
                    else b.onclick=()=>{ guess.push(ch); draw(); if(guess.join('')===W) stage.querySelector('#w').textContent=W+' — yes.'; };
                    po.appendChild(b);
                });
            };
            draw(); stage.querySelector('#n').onclick=word;
        }
        function grid(){
            const n=4; let cells=Array(16).fill(0).map(()=>Math.random()>0.55?1:0); let taps=0;
            stage.innerHTML=`<div class="bar"><p id="s">Darken the board</p><button class="btn" id="n">New</button></div>
                <div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr));max-width:320px"></div>
                <p class="note">Tap flips that tile and its neighbors.</p><p class="win" id="w"></p>`;
            const g=stage.querySelector('.grid');
            const flip=i=>{ const x=i%n,y=Math.floor(i/n); [[0,0],[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy; if(nx>=0&&nx<n&&ny>=0&&ny<n) cells[ny*n+nx]^=1;}); };
            const draw=()=>{
                g.innerHTML='';
                cells.forEach((v,i)=>{
                    const b=document.createElement('button'); b.className='tile'+(v?' on':'');
                    b.onclick=()=>{ taps++; flip(i); draw(); stage.querySelector('#s').textContent=taps+' taps';
                        if(cells.every(c=>c===0)) stage.querySelector('#w').textContent='Quiet.'; };
                    g.appendChild(b);
                });
            };
            draw(); stage.querySelector('#n').onclick=grid;
        }

        const SKY = ['WHIMY','STARS','ORBIT','SPARK','GLOWY','NOVAX','LUNAR','COMET','DREAM','PLAYS','BRAIN','CLOUD','NIGHT','LIGHT','QUIET','TRACE','FIELD','STONE','RIVER','OCEAN','MAPLE','NORTH','SOUTH','EARTH','SPACE','SKIES','MOONS','TIDAL','PRISM','QUEST'];
        const ALLOW = new Set(SKY.concat(['ABOUT','AFTER','HOUSE','WORLD','MUSIC','HEART','PLANT','WATER','STORY','SMILE','THINK','BRING','CLEAR','SHARE','START','PLACE','POINT','RIGHT','SOUND','STILL']));

        function sky(){
            const answer = SKY[Math.floor(Math.random()*SKY.length)];
            let row = 0, col = 0, done = false;
            const rows = Array.from({length:6}, () => Array(5).fill(''));
            const marks = Array.from({length:6}, () => Array(5).fill(''));
            const keyState = {};
            stage.innerHTML = `<div class="bar"><p id="s">Guess 1 of 6</p><button class="btn" id="n">New word</button></div>
                <div class="wdl" id="wdl"></div>
                <div class="keys" id="keys"></div>
                <p class="win" id="w"></p>
                <p class="note">Enter a 5-letter word. Green = right spot. Gold = in the word.</p>`;
            const wdl = stage.querySelector('#wdl');
            const keys = stage.querySelector('#keys');
            const win = stage.querySelector('#w');
            const stat = stage.querySelector('#s');

            function paintBoard(){
                wdl.innerHTML = '';
                for (let r=0;r<6;r++) for (let c=0;c<5;c++){
                    const d = document.createElement('div');
                    d.textContent = rows[r][c] || '';
                    if (marks[r][c]) d.className = marks[r][c];
                    wdl.appendChild(d);
                }
            }
            function paintKeys(){
                const lines = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
                keys.innerHTML = '';
                lines.forEach((line, i) => {
                    const kr = document.createElement('div'); kr.className = 'kr';
                    if (i===2){
                        const ent = document.createElement('button'); ent.className='wide'; ent.textContent='ENTER';
                        ent.onclick = submit; kr.appendChild(ent);
                    }
                    [...line].forEach(ch => {
                        const b = document.createElement('button');
                        b.textContent = ch;
                        if (keyState[ch]) b.classList.add(keyState[ch]);
                        b.onclick = () => type(ch);
                        kr.appendChild(b);
                    });
                    if (i===2){
                        const del = document.createElement('button'); del.className='wide'; del.textContent='DEL';
                        del.onclick = back; kr.appendChild(del);
                    }
                    keys.appendChild(kr);
                });
            }
            function type(ch){
                if (done || col>=5) return;
                rows[row][col] = ch; col++; paintBoard();
            }
            function back(){
                if (done || col===0) return;
                col--; rows[row][col]=''; paintBoard();
            }
            function scoreGuess(guess){
                const res = Array(5).fill('miss');
                const remain = answer.split('');
                guess.forEach((ch,i) => { if (ch===answer[i]) { res[i]='exact'; remain[i]=null; } });
                guess.forEach((ch,i) => {
                    if (res[i]==='exact') return;
                    const at = remain.indexOf(ch);
                    if (at>=0){ res[i]='close'; remain[at]=null; }
                });
                return res;
            }
            function submit(){
                if (done || col<5) return;
                const guess = rows[row];
                const gstr = guess.join('');
                if (!ALLOW.has(gstr) && !SKY.includes(gstr)) {
                    win.textContent = 'Not in this list — try another word.';
                    return;
                }
                win.textContent = '';
                const res = scoreGuess(guess);
                marks[row] = res;
                res.forEach((m,i) => {
                    const ch = guess[i];
                    const rank = {miss:1, close:2, exact:3};
                    if (!keyState[ch] || rank[m] > rank[keyState[ch]]) keyState[ch] = m;
                });
                if (res.every(x => x==='exact')) {
                    done = true;
                    win.textContent = answer + ' — you got it.';
                    store.skyWins = (store.skyWins||0)+1; save();
                } else if (row === 5) {
                    done = true;
                    win.textContent = 'It was ' + answer + '.';
                } else {
                    row++; col = 0;
                    stat.textContent = 'Guess ' + (row+1) + ' of 6';
                }
                paintBoard(); paintKeys();
            }
            document.onkeydown = (e) => {
                if (game !== 'sky') return;
                if (e.key === 'Enter') submit();
                else if (e.key === 'Backspace') back();
                else if (/^[a-zA-Z]$/.test(e.key)) type(e.key.toUpperCase());
            };
            paintBoard(); paintKeys();
            stage.querySelector('#n').onclick = sky;
        }
        start();
    </script>
</body>
</html>
