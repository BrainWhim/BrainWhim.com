/* ===== The Writing Desk (Create · The Studio, Nov 21, 2026): a prompt a day, a quiet page, a word goal, a streak =====
   One prompt a day, the same for everyone (by the writer's own date). Each weekday has its own kind of writing (writing-prompts.js).
   The page is a sheet of writing paper on the desk: the prompt card, then the page itself (a lined textarea).
   The writing is saved ONLY on this device (localStorage "bwWdText:<date>"); nothing written is ever sent to BrainWhim.
   Reaching the goal (50 / 150 / 300 words, the writer's pick) finishes the day and keeps the streak ("bwWrite:<date>").
   Club Members: Past Prompts (last 30 days; writing a missed day mends the streak), the Notebook (every page, by date), Deckled Cotton paper. */
.wd-pad{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.wd-paper{--ink:#26201a;--soft:#6a5c48;--gold:#9a6a1c;--rule:rgba(110,80,40,.2);--line:rgba(80,110,160,.22);--margin:rgba(190,70,70,.32);--edgeA:#efe8d6;--edgeB:#d6ccb4;--lh:32px;
  position:relative;width:min(100%,720px);height:var(--wd-h,560px);display:flex;flex-direction:column;color:var(--ink);border-radius:4px;
  background:
    radial-gradient(120% 90% at 25% 0%,rgba(255,255,255,.6),rgba(255,255,255,0) 60%),
    repeating-linear-gradient(90deg,rgba(120,100,60,.016) 0 1px,rgba(0,0,0,0) 1px 3px),
    linear-gradient(180deg,#fcf8ee,#f2ead8);
  box-shadow:2px 3px 0 -1px var(--edgeA),2px 3px 0 0 var(--edgeB),5px 6px 0 -1px var(--edgeA),5px 6px 0 0 var(--edgeB),
    0 26px 50px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.35)}
/* a brass paper clip on the top edge */
.wd-paper::before{content:"";position:absolute;top:-12px;left:14px;width:14px;height:46px;z-index:3;pointer-events:none;border-radius:9px;
  border:3px solid #c9a050;border-bottom-color:#a77c2e;box-shadow:inset 0 0 0 3px transparent,1px 2px 3px rgba(0,0,0,.35)}
.wd-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:34px clamp(22px,6%,56px) 22px;-webkit-overflow-scrolling:touch}
.wd-scroll,.wd-ta,.wd-nb-read{scrollbar-width:thin;scrollbar-color:rgba(154,106,28,.45) transparent}
.wd-scroll::-webkit-scrollbar,.wd-ta::-webkit-scrollbar{width:6px}.wd-scroll::-webkit-scrollbar-thumb,.wd-ta::-webkit-scrollbar-thumb{background:rgba(154,106,28,.4);border-radius:3px}
.wd-kick{margin:0 0 10px;font:700 12px/1.3 Montserrat,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.wd-title{margin:0 0 12px;font:700 clamp(30px,4.6vw,42px)/1.08 "Cormorant Garamond",Georgia,serif;color:var(--ink)}
.wd-prompt{margin:0 0 14px;font:19px/1.55 Georgia,"Times New Roman",serif;color:var(--ink)}
.wd-start{margin:0 0 14px;padding:12px 16px;border-left:3px solid #b8862b;background:rgba(184,134,43,.08);border-radius:4px;font:italic 18px/1.5 Georgia,serif;color:var(--soft)}
.wd-start b{display:block;font:700 11.5px/1.3 Montserrat,system-ui,sans-serif;font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.wd-nudge{margin:0 0 6px;font:16px/1.5 Georgia,serif;color:var(--soft)}
.wd-nudge b{font:700 12px Montserrat,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.wd-try{display:block;margin-top:9px;padding-top:9px;border-top:1px solid rgba(70,100,160,.18);font-size:16px}
.wd-try i{font:700 11.5px/1 Montserrat,system-ui,sans-serif;font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:#3d5a8c;margin-right:4px}
body[data-set="ink"] .wd-try i{color:#a9c0f0}
.wd-hsk{display:block;margin-top:8px;padding:8px 11px;border-radius:7px;background:rgba(70,100,160,.08);border:1px solid rgba(70,100,160,.2);font:14.5px/1.45 Georgia,serif;color:var(--ink)}
.wd-hsk b{display:block;margin-bottom:3px;font:700 10.5px/1.3 Montserrat,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#3d5a8c}
body[data-set="ink"] .wd-hsk{background:rgba(150,170,255,.08);border-color:rgba(170,190,240,.22)}body[data-set="ink"] .wd-hsk b{color:#a9c0f0}
.wd-row.wd-stick{position:sticky;bottom:-22px;z-index:2;margin:14px -8px 0;padding:14px 8px 16px;
  background:linear-gradient(180deg,rgba(244,237,222,0),#f3ecdb 9px)}
body[data-set="ink"] .wd-row.wd-stick{background:linear-gradient(180deg,rgba(26,33,53,0),#1b2237 9px)}

.wd-rule{height:1px;background:var(--rule);margin:16px 0}
.wd-tag{margin:0;font:italic 600 18px/1.3 "Cormorant Garamond",Georgia,serif;color:var(--gold)}
.wd-meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;font:600 13.5px/1.4 Montserrat,system-ui,sans-serif;color:var(--soft)}
.wd-meta b{color:var(--ink)}
.wd-private{margin:12px 0 0;font:600 13px/1.45 Montserrat,system-ui,sans-serif;color:var(--soft)}
.wd-done{display:inline-flex;align-items:center;gap:6px;margin:14px 0 0;padding:7px 12px;border-radius:8px;font:700 14px/1.2 Montserrat,system-ui,sans-serif;
  color:#2f5a2a;background:rgba(80,140,70,.12);border:1px solid rgba(80,140,70,.3)}
.wd-done.draft{color:var(--soft);background:rgba(120,90,50,.08);border-color:rgba(120,90,50,.22)}
/* the goal picker */
.wd-goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0 0}
.wd-goal{appearance:none;padding:10px 6px;border-radius:10px;cursor:pointer;text-align:center;color:var(--ink);background:rgba(255,255,255,.5);
  border:1.5px solid rgba(120,90,50,.25);font:inherit;-webkit-tap-highlight-color:transparent}
.wd-goal b{display:block;font:700 20px/1.1 Montserrat,system-ui,sans-serif}
.wd-goal small{display:block;margin-top:3px;font:600 11.5px/1.3 Montserrat,system-ui,sans-serif;color:var(--soft)}
.wd-goal.on{border-color:#b8862b;background:rgba(242,190,69,.18);box-shadow:0 0 0 3px rgba(184,134,43,.18)}
@media (hover:hover){.wd-goal:not(.on):hover{border-color:rgba(154,106,28,.6)}}
.wd-glabel{margin:18px 0 0;font:700 12px/1.3 Montserrat,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
/* the page: a lined sheet that scrolls with the words */
.wd-write{flex:1;min-height:0;display:none;flex-direction:column}
.wd-paper.writing .wd-write{display:flex}.wd-paper.writing .wd-scroll{display:none}
.wd-whead{flex:none;display:flex;align-items:flex-start;gap:10px;padding:18px clamp(18px,5%,44px) 8px clamp(56px,9%,76px)}
.wd-whead .t{flex:1;min-width:0}
.wd-whead .k{display:block;font:700 11px/1.3 Montserrat,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.wd-whead .h{display:block;margin-top:2px;font:700 22px/1.15 "Cormorant Garamond",Georgia,serif;color:var(--ink)}
.wd-whead{flex-wrap:wrap}.wd-whead .p{flex:0 0 100%;display:none;margin:2px 0 0;font:15.5px/1.45 Georgia,serif;color:var(--soft)}
.wd-whead.open .p{display:block}
.wd-pbtn{appearance:none;flex:none;margin-top:2px;padding:6px 10px;border-radius:7px;cursor:pointer;font:700 12px/1 Montserrat,system-ui,sans-serif;color:var(--soft);
  background:transparent;border:1.5px solid rgba(120,90,50,.28)}
.wd-ta{flex:1;min-height:0;width:100%;box-sizing:border-box;resize:none;border:0;outline:0;margin:0;display:block;
  padding:8px clamp(18px,5%,44px) 24px clamp(56px,9%,76px);color:var(--ink);caret-color:#9a6a1c;
  font:19px/var(--lh) Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%;
  background-color:transparent;
  background-image:linear-gradient(90deg,rgba(0,0,0,0) calc(clamp(56px,9%,76px) - 12px),var(--margin) calc(clamp(56px,9%,76px) - 12px),var(--margin) calc(clamp(56px,9%,76px) - 11px),rgba(0,0,0,0) calc(clamp(56px,9%,76px) - 11px)),
    repeating-linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) calc(var(--lh) - 1px),var(--line) calc(var(--lh) - 1px),var(--line) var(--lh));
  background-position:0 0,0 8px;background-attachment:local,local}
.wd-ta::placeholder{color:rgba(106,92,72,.55);font-style:italic}
/* the foot: back to the prompt · word count · keys · finish */
.wd-foot{flex:none;display:flex;align-items:center;gap:10px;padding:10px clamp(14px,3.5%,30px) 14px;border-top:1px solid var(--rule)}
.wd-count{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.wd-count span{font:700 13.5px/1.2 Montserrat,system-ui,sans-serif;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wd-bar{height:6px;border-radius:3px;background:rgba(120,90,50,.15);overflow:hidden}
.wd-bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#d9b35c,#b8862b);transition:width .25s}
.wd-paper.met .wd-bar i{background:linear-gradient(90deg,#f2be45,#e6a52a);box-shadow:0 0 10px rgba(242,190,69,.7)}
.wd-btn{appearance:none;flex:none;min-height:44px;padding:0 16px;border-radius:8px;cursor:pointer;white-space:nowrap;font:700 15px/1 Montserrat,system-ui,sans-serif;
  color:#3a2306;background:linear-gradient(180deg,#ffe7a6,#e9c46a);border:0;box-shadow:0 3px 0 #a97a1c;-webkit-tap-highlight-color:transparent}
.wd-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a97a1c}
.wd-btn.gh{background:transparent;color:var(--soft);box-shadow:none;border:1.5px solid rgba(120,90,50,.3)}
.wd-btn.ic{min-width:44px;padding:0 10px;font-size:17px}
.wd-btn.ic.off{opacity:.45}
.wd-row{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 4px}
.wd-scroll.turn{animation:wdTurn .32s ease}
@keyframes wdTurn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.wd-paper.writing .wd-write{animation:wdTurn .32s ease}
@media (prefers-reduced-motion:reduce){.wd-scroll.turn,.wd-paper.writing .wd-write{animation:none}}

<script>
(function(){
"use strict";
function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){} return null; }
function jget(k){ try{ return JSON.parse(store(k)||"null"); }catch(e){ return null; } }

/* ---------- the dates (same numbering as the Reading Room) ---------- */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fromKey(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
var EPOCH=new Date(2026,10,1);
function dayNo(d){ return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5)+1; }
var DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function niceDate(d){ return DAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate(); }
function shortDate(d){ return DAYS[d.getDay()].slice(0,3)+" "+MONTHS[d.getMonth()].slice(0,3)+" "+d.getDate(); }
var today=new Date(); today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
var todayKey=ymd(today);

/* ---------- which prompt a day gets: its weekday's kind, that kind's prompts in turn a week at a time ---------- */
function ell(t){ return /[.!?:,;]$/.test(t)?t:t+"…"; }   /* an opening line trails off, unless it already ends in a mark */
function kindOf(d){ return WD_KINDS[d.getDay()]; }
function promptFor(d){ var kd=kindOf(d), list=WD_PROMPTS[kd.id]||[]; if(!list.length) return null; var w=Math.floor((dayNo(d)-1)/7)-2; /* -2: the week of Nov 15-21, 2026 uses each kind's first prompt */ return list[((w%list.length)+list.length)%list.length]; }
function findPrompt(id){ for(var k in WD_PROMPTS){ var l=WD_PROMPTS[k]; for(var i=0;i<l.length;i++) if(l[i].id===id) return l[i]; } return null; }

/* ---------- what's kept (on this device only) ----------
   bwWrite:<date>   = the finished day {w, goal, sec, id} (the kit's daily key; streaks)
   bwWdText:<date>  = the page itself {id, t, w, sec, upd}
   bwWriteStreak    = {n, best, last}   ·   bwWdGoal = 50 | 150 | 300   ·   bwWdKeys = "0" when typewriter keys are off */
var GOALS=[[50,"A few lines","About 5 min"],[150,"A page","About 10 min"],[300,"A long sit","About 20 min"]];
function goal(){ var g=+store("bwWdGoal"); return g===50||g===300?g:150; }

function page(k){ return jget("bwWdText:"+k); }

function member(){ try{ return !!(window.BW&&BW.member&&BW.member()); }catch(e){ return false; } }
function words(t){ var m=String(t||"").match(/\S+/g); return m?m.length:0; }
function allPages(){ var out=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf("bwWdText:")===0){ var p=jget(k); if(p&&p.t&&p.t.trim()) out.push({k:k.slice(9),p:p}); } } }catch(e){} out.sort(function(a,b){ return a.k<b.k?1:-1; }); return out; }

/* ---------- sounds: the typewriter on the desk (keys, the return, the bell at the goal), paper, a warm close ---------- */

    h.osc(d,t+.004,"sine",210+Math.random()*40,140,.05*v,.002,.05,["lowpass",600]); });
  D("wd-space",function(h){ var d=h.out(.1), t=h.t; h.burst(d,t,.05,"bandpass",1500,1.4,.13,.002,.04); h.osc(d,t+.006,"sine",160,110,.05,.002,.06,["lowpass",500]); });
  D("wd-return",function(h){ var d=h.out(.14), t=h.t;   /* the carriage return: a ratchet and a stop */
    for(var i=0;i<6;i++) h.burst(d,t+i*.028,.025,"bandpass",3200-i*120,2.5,.07,.001,.02);
    h.burst(d,t+.2,.06,"bandpass",1200,1.2,.16,.002,.05); h.osc(d,t+.2,"sine",180,120,.08,.003,.08,["lowpass",500]); });
  D("wd-bell",function(h){ var d=h.out(.3), tine=[[1,1,1],[2.76,.22,.35],[5.4,.07,.2]]; h.bell(d,h.t,1760,.08,1.6,tine); });   /* the typewriter's margin bell: the goal is reached */
  D("wd-paper",function(h,o){ var d=h.out(.16), t=h.t;   /* a sheet slides out and settles */
    h.burst(d,t,.22,"bandpass",2200,1,.16,.03,.16); h.burst(d,t+.08,.14,"highpass",4800,.7,.07,.02,.1); h.burst(d,t+.22,.05,"lowpass",900,1,.1,.003,.04); });
  D("wd-done",function(h){ var d=h.out(.4), t=h.t, tine=[[1,1,1],[2.76,.18,.3],[5.4,.06,.15]];
    [392,523.3,659.3,784,1046.5].forEach(function(f,i){ h.bell(d,t+i*.1,f,.065,1.7,tine); });
    h.osc(d,t+.02,"sine",110,70,.12,.004,.2,["lowpass",380]); });
})();
function snd(n,o){ if(window.Parlor&&Parlor.sfx) Parlor.sfx(n,o||{}); }

  '<textarea class="wd-ta" data-bws="off" spellcheck="true" autocapitalize="sentences" aria-label="Your page"></textarea></div>'+
  '<div class="wd-foot"><button class="wd-btn gh" type="button" id="wdBack" title="Back to today’s prompt, goal and Notebook">← Back</button><div class="wd-count"><span></span><div class="wd-bar"><i></i></div></div>'+
  '<button class="wd-btn gh ic" type="button" id="wdKeys" aria-label="Typewriter sounds" title="Typewriter sounds">⌨</button><button class="wd-btn" type="button" id="wdFin">Finish ✓</button></div></article>';
var PAPER=$(".wd-paper",stage), SCROLL=$(".wd-scroll",stage), TA=$(".wd-ta",stage), HEAD=$(".wd-whead",stage), FOOT=$(".wd-foot",stage),
    COUNT=$(".wd-count span",stage), BAR=$(".wd-bar i",stage), FIN=$("#wdFin",stage), KEYS=$("#wdKeys",stage), PBTN=$(".wd-pbtn:not(.wd-lbtn)",stage);

TA.addEventListener("focus",function(){ setTimeout(fit,60); setTimeout(fit,400); });

function count(){
  var w=words(TA.value), g=goal(), r=rec(ymd(day));
  COUNT.innerHTML='<b>'+w+'</b> / '+g+' words'+(r?' · ✓ Finished':w>=g?' · Goal reached!':'');
  BAR.style.width=Math.min(100,w/g*100)+"%";
  var nowMet=w>=g; PAPER.classList.toggle("met",nowMet||!!r);
  if(nowMet&&!met&&writing&&!r){ snd("wd-bell"); if(window.Parlor) Parlor.toast("Goal reached! Keep going, or tap Finish."); }
  met=nowMet;
  FIN.classList.toggle("gh",!(nowMet||r)); FIN.textContent=r?"Done ✓":"Finish ✓";
  if(window.Parlor&&Parlor.score) Parlor.score([w]);
}
function save(){
  if(!P) return; clearTimeout(saveT);
  var t=TA.value, k=ymd(day), old=page(k);
  if(!t.trim()&&!old) return;
  store("bwWdText:"+k,JSON.stringify({id:P.id,t:t,w:words(t),sec:Math.round(active/1000),upd:Date.now()}));
}

function load(d,m){
  if(P) save();
  day=d; mode=m; P=promptFor(d); finished=false;
  var pg=P?page(ymd(d)):null;
  TA.value=pg&&pg.id===P.id?pg.t:""; active=pg?(pg.sec||0)*1000:0; lastIn=0; met=words(TA.value)>=goal();
  if(window.Parlor){ Parlor.info("No. "+dayNo(d)+" · "+niceDate(d)); Parlor.coach(null); }
  showCover(); count();
}

  if(!window.Parlor||!P) return;
  var head=mode==="archive"?"Past Prompt · "+shortDate(day):"Today’s Prompt";
  Parlor.status(head,writing?kindOf(day).name+" · "+goal()+"-word goal":kindOf(day).name+" · "+DAYS[day.getDay()]);
}

  if(!P){ SCROLL.innerHTML='<p class="wd-kick">The Writing Desk</p><h2 class="wd-title">A prompt is on its way</h2>'; return; }

    '<p class="wd-prompt">'+esc(P.prompt)+'</p>'+
    (P.start?'<p class="wd-start"><b>An opening line, if you want it</b>“'+esc(ell(P.start))+'”</p>':'')+
    (P.skill?'<div class="wd-skill"><b>Today’s skill · '+esc(P.skill.name)+'</b>'+esc(P.skill.tip)+(P.nudge?'<span class="wd-try"><i>Try it today:</i> '+esc(P.nudge)+'</span>':'')+'</div>'
            :(P.nudge?'<p class="wd-nudge"><b>Try it today:</b> '+esc(P.nudge)+'</p>':''))+
    '<div class="wd-rule"></div><p class="wd-tag">The Writing Desk · <span style="white-space:nowrap">Hone Your Writing Skills</span></p>'+
    '<p class="wd-meta"><span><b>No. '+dayNo(day)+'</b> · '+esc(niceDate(day))+'</span><span>'+esc(kd.line)+'</span></p>'+
    (r?'<p class="wd-done">✓ Written'+(mode==="daily"?" today":"")+' · '+w+' words</p>':w?'<p class="wd-done draft">Your page is saved · '+w+' words so far</p>':'')+
    '<p class="wd-glabel">Today’s goal</p><div class="wd-goals">'+GOALS.map(function(G){ return '<button type="button" class="wd-goal'+(G[0]===g?" on":"")+'" data-g="'+G[0]+'" aria-pressed="'+(G[0]===g)+'"><b>'+G[0]+'</b><small>'+G[1]+' · '+G[2]+'</small></button>'; }).join("")+'</div>'+
    '<div class="wd-row wd-stick"><button class="wd-btn" type="button" data-a="write">'+(w?"Keep Writing":"Start Writing")+'</button>'+
    (P.start&&!w?'<button class="wd-btn gh" type="button" data-a="start">Use the Opening Line</button>':'')+
    (mode==="daily"?'<button class="wd-btn gh" type="button" data-a="past">Past Prompts</button>':'<button class="wd-btn gh" type="button" data-a="today">Today’s Prompt</button>')+
    '<button class="wd-btn gh" type="button" data-a="nb">Notebook</button></div>'+
    '<p class="wd-private">🔒 Your writing stays on this device. Nothing you write is sent to BrainWhim.</p>';
  SCROLL.innerHTML=h; SCROLL.scrollTop=0;
  SCROLL.classList.remove("turn"); void SCROLL.offsetWidth; if(back) SCROLL.classList.add("turn");

function showWrite(starter){
  if(!P) return;
  writing=true; PAPER.classList.add("writing"); FOOT.style.display="";
  var kd=kindOf(day);
  $(".k",HEAD).textContent=DAYS[day.getDay()]+" · "+kd.name; $(".h",HEAD).textContent=P.title; $(".p",HEAD).innerHTML=esc(P.prompt)+(P.skill?'<span class="wd-hsk"><b>Today’s skill · '+esc(P.skill.name)+'</b>'+esc(P.nudge||P.skill.tip)+'</span>':(P.nudge?'<span class="wd-hsk"><b>Try it today</b>'+esc(P.nudge)+'</span>':''));
  HEAD.classList.remove("open"); PBTN.textContent="Show Prompt"; PBTN.setAttribute("aria-expanded","false");
  TA.placeholder=P.start?ell(P.start):"Begin anywhere. Your page saves as you go.";

SCROLL.addEventListener("click",function(e){
  if(!e.target.isConnected) return;

  if(a==="write") showWrite(false); else if(a==="start") showWrite(true); else if(a==="past") pastPrompts(); else if(a==="nb") notebook(); else if(a==="today") load(today,"daily");
});

/* ---------- Look It Over: suggestions to make the page stronger, worked out right here on the device (nothing is sent) ---------- */
var STOP=" a an the and but or nor so yet for of to in on at by with from up down out over under into onto about as than then that this these those it its it's is are was were be been being am do does did have has had i me my mine we us our you your he him his she her they them their there here what which who whom whose when where why how not no all any each every some one two very just only also too more most such own same can could will would shall should may might must said says say into like through after before again once while because if just ";
function sentences(t){ return (String(t).replace(/\s+/g," ").trim().match(/[^.!?]+[.!?]+["'”’)]*|[^.!?]+$/g)||[]).map(function(x){ return x.trim(); }).filter(function(x){ return /\w/.test(x); }); }
function wlist(t){ return (String(t).toLowerCase().match(/[a-z][a-z'’-]*/g)||[]); }
function clip(s,n){ s=String(s).trim(); var w=s.split(/\s+/); return w.length>n?w.slice(0,n).join(" ")+"…":s; }
var SENSES={

  smell:/\b(smell|smelled|smelt|smells|scent|scented|odor|aroma|fragrance|perfume|stink|stank|musty|smoky|smoke|whiff|sniff|sniffed|reek|reeked|stench|bread|coffee|cinnamon|pine|diesel|rain-soaked)\b/i,
  touch:/\b(cold|warm|hot|cool|chill|chilly|damp|wet|dry|rough|smooth|soft|hard|sharp|sticky|silky|velvet|icy|freezing|burning|heavy|weight|texture|touch|touched|brushed|grip|gripped|pressed|shiver|shivered|prickly|slick|gritty|fuzzy|tingle|ache|numb)\b/i,
  taste:/\b(taste|tasted|tastes|sweet|sour|bitter|salty|salt|sugar|savory|spicy|tang|tangy|flavor|sip|sipped|bite|bit|chewed|swallowed|honey|lemon|mint|delicious)\b/i,
  sight:/\b(saw|see|seen|looked|look|watched|glance|glanced|light|dark|shadow|shadows|bright|dim|gleam|glow|glowed|color|red|blue|green|yellow|gold|golden|silver|white|black|gray|grey|pink|purple|orange|brown|shine|shining|sparkle|flicker|flickered)\b/i
};
var FILLER={very:"very",really:"really",just:"just",actually:"actually",basically:"basically",quite:"quite",literally:"literally",totally:"totally",somewhat:"somewhat",stuff:"stuff",things:"things",thing:"thing",nice:"nice",got:"got",kind:"kind of",sort:"sort of"};
var BOOKISH=/\b(exclaimed|retorted|interjected|queried|opined|ejaculated|chortled|hissed|growled|snapped|barked|declared|stated|uttered|proclaimed|inquired|responded|replied)\b/gi;
function analyze(t){
  var good=[], tips=[], W=wlist(t), n=W.length, S=sentences(t), lens=S.map(function(x){ return (x.match(/\S+/g)||[]).length; });
  if(n<15) return {good:good,tips:[{h:"Write a little more first",p:"Suggestions need a few sentences to look at. Keep going, then tap Suggestions again."}],few:true};
  var kd=kindOf(day).id, sk=P&&P.skill;
  /* the senses (Place and Memory lean on them most) */
  var have=[], miss=[]; ["sight","sound","smell","touch","taste"].forEach(function(k){ (SENSES[k].test(t)?have:miss).push(k); });
  if(have.length>=3) good.push({h:"You used "+have.length+" senses",p:"Your page reaches the reader through "+have.join(", ")+". That’s what makes a scene feel real."});
  else if(kd==="place"||kd==="memory"||(sk&&/sense/i.test(sk.name))) tips.push({h:"Add another sense",p:"So far the page leans on "+(have.length?have.join(" and "):"what things look like")+". Try one line of "+miss.filter(function(x){ return x!=="sight"; }).slice(0,2).join(" or ")+": what can you hear or smell there?"});
  /* filler words */
  var fc={}, ft=0; W.forEach(function(w,i){ var k=w.replace(/['’]s$/,""); if(FILLER[k]&&(k!=="kind"&&k!=="sort"||W[i+1]==="of")){ fc[FILLER[k]]=(fc[FILLER[k]]||0)+1; ft++; } });
  var fl=Object.keys(fc).sort(function(a,b){ return fc[b]-fc[a]; });
  if(ft>=2||fc["very"]||fc["really"]) tips.push({h:"Trim the filler words",p:"Words like "+fl.slice(0,4).map(function(k){ return "“"+k+"” ("+fc[k]+")"; }).join(", ")+" soften a sentence without adding much. Cut them, or trade “very cold” for one sharper word like “freezing.”"});
  else if(n>=60) good.push({h:"Lean and clear",p:"Hardly any filler words. Every word is pulling its weight."});
  /* a word used too often */
  var cnt={}; W.forEach(function(w){ if(w.length>=4&&STOP.indexOf(" "+w+" ")<0) cnt[w]=(cnt[w]||0)+1; });
  var rep=Object.keys(cnt).filter(function(w){ return cnt[w]>=Math.max(3,Math.round(n/60)); }).sort(function(a,b){ return cnt[b]-cnt[a]; }).slice(0,3);
  if(rep.length) tips.push({h:"A word is repeating",p:rep.map(function(w){ return "“"+w+"” appears "+cnt[w]+" times"; }).join("; ")+". Repeating on purpose can be powerful; if it wasn’t on purpose, try a different word or cut one."});
  /* sentence starts */
  var st={}; S.forEach(function(x){ var f=(x.replace(/^["'“‘(]+/,"").match(/^[A-Za-z']+/)||[""])[0].toLowerCase(); if(f) st[f]=(st[f]||0)+1; });
  var same=Object.keys(st).filter(function(f){ return st[f]>=3&&st[f]>=S.length*.3; });
  if(same.length) tips.push({h:"Vary how sentences begin",p:st[same[0]]+" of your "+S.length+" sentences start with “"+same[0].charAt(0).toUpperCase()+same[0].slice(1)+".” Try opening a few with a place, a sound or an action instead."});
  /* sentence length: rhythm */
  if(S.length>=5){
    var avg=lens.reduce(function(a,b){ return a+b; },0)/lens.length, sd=Math.sqrt(lens.reduce(function(a,b){ return a+(b-avg)*(b-avg); },0)/lens.length);
    if(sd>=6) good.push({h:"Good rhythm",p:"You mix short and long sentences, which keeps the reader’s ear awake."});
    else if(sd<3.5) tips.push({h:"Mix up sentence lengths",p:"Most of your sentences run about "+Math.round(avg)+" words. Drop in one very short sentence. It lands like a drumbeat."});
  }
  var longI=lens.findIndex(function(l){ return l>32; });
  if(longI>=0) tips.push({h:"One sentence runs long",p:"“"+clip(S[longI],9)+"” has "+lens[longI]+" words. Try splitting it in two where it takes a breath.",ex:1});
  /* -ly adverbs */
  var ly=W.filter(function(w){ return /^[a-z]{3,}ly$/.test(w)&&!/^(only|family|early|holy|ugly|lonely|lovely|friendly|daily|reply|supply|fly|july|italy|belly|jelly|silly|curly|chilly|hilly|bully|rally|ally|lily|holly|apply|rely|likely|elderly|costly|deadly|lively|orderly|smelly|wobbly|bubbly|sly|imply|comply|unlikely)$/.test(w); });
  if(ly.length>=Math.max(3,n/50)) tips.push({h:"Let verbs do the work",p:"You have "+ly.length+" -ly words (like “"+ly.slice(0,3).join("”, “")+"”). Often a stronger verb does the job alone: “walked slowly” becomes “shuffled.”"});
  /* passive voice (a rough check) */
  var pv=(t.match(/\b(was|were|is|are|been|being|be)\s+(\w+ly\s+)?(\w+ed|given|taken|seen|done|made|known|written|broken|forgotten|hidden|stolen|told|found|left|held|built|thrown|shown|kept)\b(\s+by\b)?/gi)||[]).filter(function(m){ return !/\b(was|were|is|are)\s+(tired|excited|interested|bored|scared|worried|surprised|pleased|married|used|supposed|closed|crowded|tied|tucked|painted|lined|covered|filled|located|dressed|stuck|tangled|frozen|faded|cracked|chipped|worn|old-fashioned)\b/i.test(m); });
  if(pv.length>=2) tips.push({h:"Who is doing it?",p:"A few sentences hide who acts (“"+pv[0].trim()+"”). Try naming the doer first: “The porter locked the door” is stronger than “The door was locked.”"});
  /* dialogue */
  var quotes=(t.match(/["“”]/g)||[]).length;
  if(kd==="dialogue"){
    if(quotes<4) tips.push({h:"Let them talk",p:"Today is a dialogue day: put the characters’ own words in quotation marks, each speaker on a new line."});
    else good.push({h:"Real conversation",p:"Your characters speak in their own words. Read it aloud: does each one sound like a different person?"});
  }
  var bk=t.match(BOOKISH)||[];
  if(bk.length>=2) tips.push({h:"Keep “said” simple",p:"Tags like “"+bk.slice(0,2).join("” and “").toLowerCase()+"” call attention to themselves. “Said” disappears, and the words themselves can carry the feeling."});
  /* paragraphs */
  var paras=t.split(/\n\s*\n|\n/).filter(function(x){ return x.trim(); });
  if(n>=180&&paras.length<2) tips.push({h:"Give it room to breathe",p:"It’s all one block. Start a new paragraph when the moment, place or speaker changes: white space helps the reader."});
  if(kd==="dialogue"&&quotes>=6&&paras.length<2) tips.push({h:"New speaker, new line",p:"Each time a different person speaks, start a new line. It makes a conversation easy to follow."});
  /* small mechanics */
  var low=S.filter(function(x){ return /^[a-z]/.test(x.trim()); }).length, ii=(t.match(/(^|\s)i(\s|['’])/g)||[]).length;
  var dbl=(t.match(/\b(\w+)\s+\1\b/gi)||[]).filter(function(m){ return !/^(had had|that that|very very|no no|yes yes|bye bye|tick tick|knock knock|so so|ha ha)$/i.test(m); });
  var mech=[]; if(low) mech.push(low===1?"one sentence starts with a small letter":low+" sentences start with a small letter"); if(ii) mech.push("“i” on its own should be “I”"); if(dbl.length) mech.push("a doubled word (“"+dbl[0]+"”)");
  var ex=(t.match(/!/g)||[]).length; if(ex>=3) mech.push(ex+" exclamation points (one is usually plenty)");
  if(mech.length) tips.unshift({h:"A quick proofread",p:"Watch for: "+mech.join("; ")+"."});
  /* strong points to encourage */
  if(n>=goal()) good.unshift({h:"You reached your goal",p:words(t)+" words on the page. Showing up is the hardest part of writing."});
  if(S.length>=3&&/[?]/.test(S[0])) good.push({h:"A strong opening",p:"You open with a question: it pulls the reader straight in."});
  return {good:good.slice(0,3),tips:tips.slice(0,6)};
}

  b.innerHTML='<p class="pk-kick">The Writing Desk · Hone Your Writing Skills</p><h2>Suggestions</h2>'+
    (sk?'<div class="wd-skill-m"><b>Today’s skill: '+esc(sk.name)+'</b>'+esc(sk.tip)+'</div>':'')+
    (r.good.length?'<p class="wd-lh ok">What’s working</p>'+r.good.map(function(g){ return '<div class="wd-sug ok"><b>✓ '+esc(g.h)+'</b>'+esc(g.p)+'</div>'; }).join(""):'')+
    (r.tips.length?'<p class="wd-lh">'+(r.few?"":"Try this")+'</p>'+r.tips.map(function(g){ return '<div class="wd-sug"><b>'+esc(g.h)+'</b>'+esc(g.p)+'</div>'; }).join("")
                  :'<div class="wd-sug ok"><b>✓ Nothing to flag</b>Read it aloud once: your ear will catch anything a checklist can’t.</div>')+

/* ---------- finishing ---------- */
function finish(){
  if(finished) return; finished=true; save();
  var k=ymd(day), w=words(TA.value), g=goal(), secs=Math.round(active/1000), first=false, sk=streak(), srv=null, r0={w:w,goal:g,sec:secs,id:P.id};
  if(mode==="daily"&&!rec()){
    first=true; store("bwWrite:"+todayKey,JSON.stringify(r0));
    var y=new Date(today); y.setDate(y.getDate()-1);
    sk.n=sk.last===ymd(y)?sk.n+1:sk.last===todayKey?sk.n:1; sk.last=todayKey; sk.best=Math.max(sk.best||0,sk.n); store("bwWriteStreak",JSON.stringify(sk));
    srv=window.Parlor&&Parlor.dailyFinish?Parlor.dailyFinish(todayKey,r0):null;
  } else if(mode==="archive"&&!rec(k)){
    first=true; r0.past=1; store("bwWrite:"+k,JSON.stringify(r0));
    srv=window.Parlor&&Parlor.dailyFinish?Parlor.dailyFinish(k,r0,true):null;   /* Club catch-up: mends the streak */
  }
  if(first) snd("wd-done");
  count(); TA.blur();
  setTimeout(function(){ withServer(srv,function(sv){ if(sv&&sv.ok) sk={n:sv.n,best:sv.best,last:sv.last}; result(w,secs,first,sk,sv); }); },first?650:0);
}
function withServer(srv,go2){ if(!srv){ go2(null); return; } var t=setTimeout(function(){ t=0; go2(null); },1500); srv.then(function(sv){ if(t){ clearTimeout(t); go2(sv); } },function(){ if(t){ clearTimeout(t); go2(null); } }); }
function fmt(sec){ var m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function veil(id){ var v=$("#"+id); if(!v){ v=document.createElement("div"); v.className="pk-veil"; v.id=id; v.innerHTML='<div class="pk-modal"></div>'; document.body.appendChild(v);
  v.addEventListener("click",function(e){ if(e.target===v) v.classList.remove("on"); }); } return v; }
function btnIn(row,label,fn,href){ var x=document.createElement(href?"a":"button"); if(href) x.href=href; else x.type="button"; x.className="pk-btn"; x.textContent=label; if(fn) x.onclick=fn; row.appendChild(x); return x; }
function result(w,secs,first,sk,sv){
  var v=veil("wdEnd"), b=v.firstChild, g=goal();
  var head=mode==="archive"?"Past Prompt · "+niceDate(day):"The Writing Desk · No. "+dayNo(day);
  var title=w>=g*2?"What a Page!":w>=300?"Beautifully Done":"Page Written";
  b.innerHTML='<p class="pk-kick">'+esc(head)+'</p><h2>'+title+'</h2><div class="wd-orn" aria-hidden="true"></div>'+
    '<div class="wd-facts"><div><b>'+w+'</b><small>Words</small></div><div><b>'+fmt(secs)+'</b><small>Writing</small></div><div><b>'+(mode==="daily"?(sk.n||1):"–")+'</b><small>Streak</small></div></div>'+
    '<p class="wd-note"><b>'+esc(P.title)+'.</b> Your page is saved on this device'+(member()?" and in your Notebook":"")+'. You can keep adding to it all day.</p>'+
    (mode==="daily"&&!first?'<p class="wd-note" style="opacity:.75">You’d already finished today’s page; your first finish is the one counted.</p>':'')+
    '<div class="pk-row" style="flex-wrap:wrap"></div>';
  var row=b.querySelector(".pk-row");
  if(mode==="daily"&&window.Parlor&&Parlor.dailyNote) b.insertBefore(Parlor.dailyNote(sk.n||1,sv),row);
  btnIn(row,"Suggestions",function(){ v.classList.remove("on"); lookItOver(); });
  if(mode==="daily") btnIn(row,"Share Result",function(){ share(w,sk); });
  btnIn(row,"Keep Writing",function(){ v.classList.remove("on"); finished=false; showWrite(false); });
  btnIn(row,"Notebook",function(){ v.classList.remove("on"); notebook(); });
  if(mode!=="daily") btnIn(row,"Today’s Prompt",function(){ v.classList.remove("on"); load(today,"daily"); });
  btnIn(row,"Back to Create",null,"create.html");
  v.classList.add("on");
}
function share(w,sk){
  var txt="BrainWhim · The Writing Desk No. "+dayNo(today)+"\n"+w+" words · "+P.title+(sk&&sk.n>1?" · "+sk.n+"-day streak":"")+"\nbrainwhim.com/writing.html";
  if(window.BWShare){ BWShare.go(txt); return; }
  if(navigator.share){ navigator.share({text:txt}).catch(function(){}); return; }
  try{ navigator.clipboard.writeText(txt).then(function(){ Parlor.toast("Result copied: paste it to a friend."); }); }catch(e){ Parlor.toast(txt); }
}

function pageText(e){ var Px=findPrompt(e.p.id), d=fromKey(e.k); return (Px?Px.title:"The Writing Desk")+"\n"+niceDate(d)+(Px?" · "+kindOf(d).name:"")+"\n\n"+e.p.t.trim()+"\n"; }
function download(name,text){ try{ var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500); }catch(e){ if(window.Parlor) Parlor.toast("Saving a file isn’t possible here."); } }

function fit(){

  var top=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185;
  var h=wide?window.innerHeight-top-28:window.innerHeight-(seatedNow()?top:56)-(64+24)-8;
  h=Math.max(window.innerHeight<560?230:380,Math.min(860,h));
  var vv=window.visualViewport, typing=document.activeElement===TA&&!wide;
  if(typing&&vv&&vv.height<window.innerHeight-80){ h=Math.max(200,vv.height-16); }

}
