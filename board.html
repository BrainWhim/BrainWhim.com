<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four · BrainWhim</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Montserrat,sans-serif;background:#E8EDF3;color:#1A2744}
header{display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:#1A2744;height:110px}
.brand{display:flex;align-items:center;color:#fff;text-decoration:none;font-size:30px}
.brand img{width:100px;height:100px;object-fit:contain;margin-right:-8px}
.whim{font-family:Pacifico,cursive;color:#7EB6D9;font-size:1.1em}
.hdr a{color:#fff;font-weight:700;font-size:16px;text-decoration:none;margin-left:16px}
.wrap{max-width:460px;margin:20px auto;padding:16px;background:#fff;border-radius:22px}
h1{text-align:center;margin:0 0 6px}
.sub,.msg{text-align:center;color:#4B5E73;font-size:14px}
.btns{text-align:center;margin:10px 0}
.btns button{margin:0 4px;border:0;border-radius:999px;padding:8px 14px;background:#1A2744;color:#fff;font-weight:700;cursor:pointer}
.board{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;background:#16325C;padding:12px;border-radius:16px}
.hole{height:48px;border-radius:50%;background:#C5D6EA;border:0;cursor:pointer}
.hole.p1{background:#D94A4A}
.hole.p2{background:#E7C15A}
@media(max-width:700px){header{height:64px;padding:0 10px}.brand{font-size:18px}.brand img{width:52px;height:52px}.hdr a{font-size:13px}.hole{height:38px}}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html"><img src="logo-image.png" alt=""><span>Brain</span><span class="whim">Whim</span></a>
<div class="hdr"><a href="play.html">Play</a><a href="puzzles.html">Puzzles</a><a href="cards.html">Cards</a><a href="index.html">Home</a></div>
</header>
<div class="wrap">
<h1>Connect Four</h1>
<p class="sub">You are red. Tap a circle in the column you want.</p>
<p class="msg" id="msg">Your turn</p>
<div class="btns">
<button type="button" onclick="newGame()">New game</button>
</div>
<div class="board" id="board"></div>
</div>
<script>
var grid, over;
function newGame(){
  grid = [];
  over = false;
  for (var r=0;r<6;r++){ grid[r]=[0,0,0,0,0,0,0]; }
  document.getElementById("msg").textContent = "Your turn";
  paint();
}
function paint(){
  var html = "";
  for (var r=0;r<6;r++){
    for (var c=0;c<7;c++){
      var cls = "hole";
      if (grid[r][c]===1) cls += " p1";
      if (grid[r][c]===2) cls += " p2";
      html += '<button type="button" class="'+cls+'" onclick="play('+c+')"></button>';
    }
  }
  document.getElementById("board").innerHTML = html;
}
function rowFor(c){
  for (var r=5;r>=0;r--) if (grid[r][c]===0) return r;
  return -1;
}
function won(p){
  var d=[[0,1],[1,0],[1,1],[1,-1]];
  for (var r=0;r<6;r++) for (var c=0;c<7;c++){
    if (grid[r][c]!==p) continue;
    for (var i=0;i<4;i++){
      var n=1, dr=d[i][0], dc=d[i][1];
      for (var k=1;k<4;k++){
        var rr=r+dr*k, cc=c+dc*k;
        if (rr<0||cc<0||rr>5||cc>6||grid[rr][cc]!==p) break;
        n++;
      }
      if (n>=4) return true;
    }
  }
  return false;
}
function play(c){
  if (over) return;
  var r = rowFor(c);
  if (r<0) { document.getElementById("msg").textContent="That column is full"; return; }
  grid[r][c]=1;
  paint();
  if (won(1)) { over=true; document.getElementById("msg").textContent="You win"; return; }
  computer();
}
function computer(){
  var choice=-1;
  for (var c=0;c<7;c++){
    var r=rowFor(c); if(r<0) continue;
    grid[r][c]=2; var w=won(2); grid[r][c]=0;
    if (w) { choice=c; break; }
  }
  if (choice<0){
    for (var c=0;c<7;c++){
      var r=rowFor(c); if(r<0) continue;
      grid[r][c]=1; var w=won(1); grid[r][c]=0;
      if (w) { choice=c; break; }
    }
  }
  if (choice<0){
    var order=[3,2,4,1,5,0,6];
    for (var i=0;i<7;i++) if (rowFor(order[i])>=0) { choice=order[i]; break; }
  }
  if (choice<0){ over=true; document.getElementById("msg").textContent="Draw"; return; }
  var rr=rowFor(choice);
  grid[rr][choice]=2;
  paint();
  if (won(2)) { over=true; document.getElementById("msg").textContent="Gold wins"; return; }
  document.getElementById("msg").textContent="Your turn";
}
newGame();
</script>
</body>
</html>
