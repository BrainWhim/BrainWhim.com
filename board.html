<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Board Night · Connect Four · BrainWhim Play</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A2744;--whim:#7EB6D9;--you:#D94A4A;--cpu:#E7C15A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#E8EDF3;color:var(--navy);font-family:Montserrat,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:0 4%;background:var(--navy);height:110px}
.brand{display:flex;align-items:center;text-decoration:none;color:#fff;font-size:30px}
.brand img{width:100px;height:100px;object-fit:contain;margin-right:-8px}
.brand .whim{font-family:Pacifico,cursive;color:var(--whim);font-size:1.1em;font-weight:400}
.hdr{display:flex;gap:16px}
.hdr a{color:#fff;font-weight:700;font-size:16px;text-decoration:none}
.shell{max-width:480px;margin:0 auto;padding:18px 14px 48px}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 14px 34px rgba(26,39,68,.12)}
h1{margin:0 0 4px;text-align:center;font-size:24px}
.sub{text-align:center;color:#4B5E73;font-size:13px;margin:0 0 12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar button{border:0;border-radius:999px;padding:8px 12px;background:var(--navy);color:#fff;font-weight:700;font-family:inherit;cursor:pointer;font-size:12px}
.bar button.ghost{background:#E8EDF3;color:var(--navy)}
.frame{background:linear-gradient(180deg,#2A4F86,#16325C);border-radius:18px;padding:12px 10px 16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 10px 24px rgba(0,0,0,.2)}
.cols{display:grid;grid-template-columns:repeat(7,minmax(28px,1fr));grid-auto-rows:minmax(36px,1fr);gap:6px;min-height:280px}
.cell{width:100%;min-height:36px;aspect-ratio:1/1;border-radius:50%;background:#0E1C33;box-shadow:inset 0 4px 8px rgba(0,0,0,.45);border:0;padding:0;cursor:pointer}
.cell.you{background:radial-gradient(circle at 30% 30%,#f08a8a,#D94A4A);box-shadow:inset 0 -4px 6px rgba(0,0,0,.25)}
.cell.cpu{background:radial-gradient(circle at 30% 30%,#f4de9a,#E7C15A);box-shadow:inset 0 -4px 6px rgba(0,0,0,.25)}
.cell.win{outline:3px solid #fff;outline-offset:-3px}
.cell.drop{animation:drop .28s ease}
@keyframes drop{from{transform:translateY(-80px);opacity:.3}to{transform:none;opacity:1}}
@media(max-width:700px){header{height:64px;padding:0 10px}.brand{font-size:18px}.brand img{width:52px;height:52px}.hdr a{font-size:13px}}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html"><img src="logo-image.png" alt=""><span>Brain</span><span class="whim">Whim</span></a>
<div class="hdr"><a href="play.html">Play</a><a href="puzzles.html">Puzzles</a><a href="cards.html">Cards</a><a href="index.html">Home</a></div>
</header>
<main class="shell">
<div class="card">
<h1>Connect Four</h1>
<p class="sub">Tap a column to drop. Four in a line wins. You are red.</p>
<div class="bar">
<span id="msg">Your drop</span>
<div>
<button type="button" class="ghost" id="diff">Normal</button>
<button type="button" id="new">New game</button>
</div>
</div>
<div class="frame"><div class="cols" id="grid"></div></div>
</div>
</main>
<script>
const R=6,C=7;
let board,lock,last,winCells=[],depth=3,di=1;
const DIFF=["Easy","Normal","Hard"], DEPTH=[2,3,5];
function empty(){return Array.from({length:R},()=>Array(C).fill(0))}
function start(){board=empty();lock=false;last=null;winCells=[];document.getElementById("msg").textContent="Your drop";draw()}
function top(c){for(let r=R-1;r>=0;r--) if(!board[r][c]) return r; return -1}
function line(p){
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    if(board[r][c]!==p) continue;
    for(const [dr,dc] of dirs){
      const cells=[[r,c]];
      for(let k=1;k<4;k++){
        const rr=r+dr*k,cc=c+dc*k;
        if(rr<0||cc<0||rr>=R||cc>=C||board[rr][cc]!==p) break;
        cells.push([rr,cc]);
      }
      if(cells.length>=4) return cells;
    }
  }
  return null;
}
function openCols(){ const o=[]; for(let c=0;c<C;c++) if(top(c)>=0) o.push(c); return o; }
function aiMove(){
  const open=openCols();
  if(!open.length) return 0;
  const prefer=[3,2,4,1,5,0,6].filter(c=>open.includes(c));
  for(const c of prefer){ const r=top(c); board[r][c]=2; const w=!!line(2); board[r][c]=0; if(w) return c; }
  for(const c of prefer){ const r=top(c); board[r][c]=1; const w=!!line(1); board[r][c]=0; if(w) return c; }
  if(di===0) return prefer[Math.floor(Math.random()*prefer.length)];
  if(di===2){
    for(const c of prefer){
      const r=top(c); if(r<=0) continue;
      board[r][c]=2; board[r-1][c]=1;
      const gives=!!line(1);
      board[r][c]=0; board[r-1][c]=0;
      if(gives) continue;
      return c;
    }
  }
  return prefer[0];
}
function place(c,p){const r=top(c);if(r<0)return false;board[r][c]=p;last=[r,c];return true}
function after(p){
  const w=line(p);
  if(w){lock=true;winCells=w;document.getElementById("msg").textContent=p===1?"You connect four.":"Gold connects four.";draw();return true}
  if(board[0].every(Boolean)){lock=true;document.getElementById("msg").textContent="The board is full.";draw();return true}
  return false;
}
function drop(c){
  if(lock) return;
  if(!place(c,1)) return;
  draw();
  if(after(1)) return;
  lock=true; document.getElementById("msg").textContent="Gold is thinking…";
  setTimeout(()=>{
    try{
      const col=aiMove();
      if(!place(col,2)){
        const open=openCols();
        if(open.length) place(open[0],2);
      }
      if(!after(2)) document.getElementById("msg").textContent="Your drop";
      draw();
    } finally { lock=false; }
  },180);
}
function draw(){
  const g=document.getElementById("grid");
  if(!g||!board) return;
  g.innerHTML="";
  for(let r=0;r<R;r++){
    for(let c=0;c<C;c++){
      const cell=document.createElement("button");
      const v=board[r][c];
      cell.type="button";
      cell.className="cell"+(v===1?" you":v===2?" cpu":"");
      if(last&&last[0]===r&&last[1]===c) cell.classList.add("drop");
      if(winCells.some(([rr,cc])=>rr===r&&cc===c)) cell.classList.add("win");
      cell.onclick=()=>drop(c);
      g.appendChild(cell);
    }
  }
}
document.getElementById("new").onclick=start;
document.getElementById("diff").onclick=e=>{di=(di+1)%3;depth=DEPTH[di];e.target.textContent=DIFF[di];start()};
start();
</script>
</body>
</html>
