    else { bounce("happy"); burst("silly"); say(NONE,"mf-none"); } }
  /* Big: five feelings in a row */
  function startBig(){ var l=BIGF.slice(); for(var i=l.length-1;i>0;i--){ var j=Math.random()*(i+1)|0, x=l[i]; l[i]=l[j]; l[j]=x; }
    G={auto:false, list:l.slice(0,5), i:0, got:0, want:null}; goal(); }
  function nextAsk(){ if(!big) return; G.want=G.list[G.i]; F={}; save(); draw(); cur="e"; tabs(); tray(); goal(); say(ASK(G.want),"mf-a-"+G.want); bar(); }
  function goal(){ if(!big||!G.list){ $("goal").innerHTML=""; return; } var h="";
    if(G.want){ var fe=FE[G.want]; h+='<span>Make:</span><span class="fe" style="background:'+fe.c+'">'+fe.n+'</span>'; }
    h+='<span class="st" aria-label="'+G.got+' of 5">'; for(var i=0;i<5;i++) h+=i<G.got?'<b>★</b>':'★'; h+='</span>';
    $("goal").innerHTML=h; }
  function mix(){ var nf={}; TABS.forEach(function(s){ var o=ORDER[s]; if(SLOT[s].none&&Math.random()<.25) return; nf[s]=o[Math.random()*o.length|0]; });
    if(!nf.e) nf.e="round"; if(!nf.m) nf.m="smile"; F=nf; save(); SND.dice(); popped=null; draw(); tray(); }

  /* ---------- the bottom row (no data-say: Ta-da, Mix and Fresh make Finn talk; Big redraws the row) ---------- */
  function bar(){ var done=big&&G.list&&G.i>=G.list.length;
    $("bar").innerHTML=(done?'<button class="chip go pulse" data-a="again" aria-label="Play again"><em>↺</em><span>Play again</span></button>':
        '<button class="chip go'+(F.e&&F.m?' pulse':'')+'" data-a="tada" aria-label="Ta-da"><em>✨</em><span>Ta-da!</span></button>')+
      '<button class="chip" data-a="mix" aria-label="Mix it up"><em>🎲</em><span>Mix it up</span></button>'+
      '<button class="chip" data-a="fresh" aria-label="Fresh face"><em>↺</em><span>Fresh face</span></button>'+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="games" aria-label="More games"><em>☾</em><span>More games</span></button>'; }
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; BWK.sfx("tap"); var a=b.dataset.a;
    if(a==="tada") tada();
    else if(a==="mix"){ mix(); if(!busy()) say(MIX,"mf-mix"); bar(); }
    else if(a==="fresh"){ F={}; save(); SND.off(); draw(); cur="e"; tabs(); tray(); say(FRESH,"mf-fresh"); bar(); }
    else if(a==="again"){ startBig(); bar(); nextAsk(); }
    else if(a==="big"){ big=!big; talked=true; BWK.setBig(big,top); setMode(); }
    else if(a==="games"){ BWK.finnStop(); BWK.sfx("whoosh"); setTimeout(function(){ location.href="moonlets-games.html"; },200); } });
  /* keep the Ta-da glow in step with the face */
  var _draw=draw; draw=function(){ _draw(); var t=$("bar").querySelector('[data-a="tada"]'); if(t) t.classList.toggle("pulse",!!(F.e&&F.m)); };
  function setMode(){ if(big){ startBig(); bar(); setTimeout(nextAsk,big&&talked?2600:0); } else { G={auto:false}; goal(); bar(); } }
  window.addEventListener("bwk-big",function(e){ if(!!e.detail!==big){ big=!!e.detail; setMode(); } });
  document.addEventListener("click",function(e){ if(talked||!e.target.isConnected||e.target.closest(".k-head,.k-sheet,.k-veil,.chip")) return;
    if(big&&G.list&&!G.want&&G.i===0) say(BHI,"mf-bhi",{onend:function(){ setTimeout(nextAsk,400); }}); else say(HI,"mf-hi"); },true);

  /* tray tiles: as big as fit */
  function fit(){ var w=window.innerWidth, h=window.innerHeight, land=w>=820&&w>h, tw=land?Math.min(96,Math.max(70,(h-360)/4)):Math.max(56,Math.min(84,h*.11,w/5.4));
    document.documentElement.style.setProperty("--tw",(tw|0)+"px"); }
  window.addEventListener("resize",fit); fit();
  tabs(); tray(); draw(); bar(); if(big){ startBig(); G.want=null; goal(); }
  /* Big starts its first ask with the first tap anywhere (sound and voice need a tap) */
  window.MFO={face:function(){ return JSON.parse(JSON.stringify(F)); }, set:function(o){ F=o||{}; save(); draw(); tray(); }, feeling:function(o){ return feeling(o||F); },
    tada:tada, big:function(v){ big=!!v; BWK.setBig(big); setMode(); }, state:function(){ return {big:big, want:G.want||null, i:G.i||0, got:G.got||0, cur:cur}; }, P:P, ORDER:ORDER};
})();
</script>
