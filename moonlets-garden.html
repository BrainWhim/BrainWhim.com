<style>
/* ==========================================================================
   BrainWhim · Moonlets: the Moon Garden (Nov 10, 2026), the green moon's Garden spot
   A wooden raised bed on the meadow with six patches of dirt. Six seed packets below (Finn names each).
   Pick a packet, tap a patch to plant it, then tap it again to water it: seed → sprout → bud → flower.
   Finn counts the flowers as they open ("One flower!" … ); six flowers: chord, sparkles, "Your whole garden is blooming!".
   The basket picks every open flower and keeps count. No wrong answers, no timer.
   Saved on the device: bwk.garden {plots:[{k,s}|null ×6], seed, basket, recent:[k…], big:{done, got}}. Test hook GDO.
   Nov 11: Big Moonlet (BWK.big; the switch after the packets): Finn's flower orders on a note pinned in the bed's corner (10 orders, then 4-10 again);
   picked flowers the order needs fill its dots; done orders unlock Lily (3), Pansy (5), Marigold (7).
   ========================================================================== */
.bg{position:fixed;inset:-12px;z-index:-1;background:url("kids-moonlets-sm.jpg") center/cover;filter:blur(2px) brightness(.5)}
.gd{height:100svh;min-height:500px;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:calc(84px + var(--k-safe-t)) 12px calc(14px + var(--k-safe-b))}
.top{width:min(100%,720px);display:flex;justify-content:center;padding-top:16px}
.top .k-finn-in{margin:0}
.top .k-finn{display:block;position:relative;width:fit-content;max-width:100%}
.top .k-fm{position:absolute;left:-12px;top:-18px;z-index:2;width:62px;height:62px;cursor:pointer}
.top .k-finn .k-fb{margin:0;padding:12px 18px 12px 54px;border-radius:20px}

/* the garden bed */
.yard{position:relative;flex:1 1 0;min-height:150px;width:100%;container-type:size;display:flex;align-items:center;justify-content:center}
.bed{position:relative;width:min(100cqw - 16px,(100cqh - 6px)*600/380,960px);aspect-ratio:600/380}
.bed>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.plot{cursor:pointer;-webkit-tap-highlight-color:transparent}
.plot .hit{fill:rgba(0,0,0,0);stroke:none}
.plot.hint .hit{stroke:rgba(200,255,200,.85);stroke-width:3;stroke-dasharray:7 7;animation:hint 1.6s ease-in-out infinite}
@keyframes hint{50%{stroke:rgba(200,255,200,.15)}}
.pl{transform-box:fill-box;transform-origin:50% 100%}
.pl.wig{animation:wig .6s ease-in-out}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* watering can, drops, sparkles, flying flowers, the butterfly */
.can{position:absolute;z-index:6;width:15%;pointer-events:none;transform-origin:70% 60%;animation:can 1.15s ease-in-out forwards}
.can svg{width:100%;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
@keyframes can{0%{opacity:0;transform:translateY(-14px) rotate(0)}18%{opacity:1;transform:translateY(0) rotate(-8deg)}
  32%,72%{opacity:1;transform:rotate(-34deg)}100%{opacity:0;transform:translateY(-10px) rotate(0)}}
.drop{position:absolute;z-index:6;width:1.1%;aspect-ratio:2/3;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;pointer-events:none;
  background:radial-gradient(circle at 35% 35%,#fff,#9fd8ff 45%,#3d93e0);opacity:0;animation:drop .5s ease-in forwards}
@keyframes drop{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.spk{position:absolute;z-index:7;pointer-events:none;font-size:20px;line-height:1;color:var(--c,#ffe08a);text-shadow:0 0 8px var(--c,#ffe08a);
  animation:spk .9s ease-out forwards}
@keyframes spk{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 60px)) scale(1.2)}}
.fly{position:absolute;z-index:8;width:9%;aspect-ratio:1;pointer-events:none;transform:translate(-50%,-50%)}
.fly svg{width:100%;height:100%;display:block;overflow:visible}
.bfly{position:absolute;z-index:5;width:6%;aspect-ratio:1;pointer-events:none;opacity:0;transform:translate(-50%,-50%);
  transition:left 2.6s ease-in-out,top 2.6s ease-in-out,opacity .8s}
.bfly.on{opacity:1}
.bfly svg{width:100%;height:100%;display:block;overflow:visible;animation:bob 1.2s ease-in-out infinite}
.bfly .wl,.bfly .wr{transform-box:fill-box;animation:flap .32s ease-in-out infinite alternate}
.bfly .wl{transform-origin:100% 50%}.bfly .wr{transform-origin:0 50%}
@keyframes flap{to{transform:scaleX(.35)}}

/* the basket */
.bask{position:absolute;z-index:4;right:-1%;bottom:-2%;width:17%;aspect-ratio:100/92;appearance:none;border:0;padding:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .15s}
.bask:active{transform:scale(.95)}
.bask svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.bask.hop{animation:bhop .45s ease-out}
@keyframes bhop{0%{transform:scale(1)}35%{transform:scale(1.12,.9)}70%{transform:scale(.96,1.05)}100%{transform:scale(1)}}
.bask::before{content:"";position:absolute;left:-18%;top:-14%;width:136%;height:128%;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,rgba(255,228,140,.75),rgba(255,210,90,.28) 55%,rgba(255,210,90,0));transition:opacity .4s}
.bask.ready::before{animation:bglow 2.4s ease-in-out infinite}
.bask.call::before{animation:bglow 1.2s ease-in-out infinite}
.bask.call svg{animation:bnudge 2.4s ease-in-out infinite}
@keyframes bglow{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes bnudge{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-9%) rotate(-4deg)}86%{transform:translateY(0) rotate(3deg)}92%{transform:translateY(-4%)}}
.bask .n{position:absolute;right:-4%;top:-2%;min-width:34%;padding:0 6%;aspect-ratio:1;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:clamp(13px,2.2cqw,22px);color:#3a2604;background:radial-gradient(circle at 35% 30%,#fff3c0,#f3c447 60%,#c8901c);
  box-shadow:0 3px 6px rgba(0,0,0,.4),0 0 10px rgba(255,210,90,.6)}
.bask .n:empty{display:none}

/* Finn sits on the back right corner post of the bed */
.perch{position:absolute;z-index:3;left:calc(81.7% - var(--hw,58px)/2);top:calc(27% - var(--hw,58px)*.9);width:var(--hw,58px);height:var(--hw,58px);pointer-events:none}
.perch svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(255,214,140,.55));transform-origin:50% 90%;animation:bob 2.6s ease-in-out infinite}
.perch.land svg{animation:land .3s ease-out}
@keyframes land{0%{transform:scale(1.14,.84)}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-6px)}}

/* seed packets */
.seeds{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex:none;width:min(100%,900px);padding-top:6px}
.pk{appearance:none;border:0;padding:0;background:none;cursor:pointer;position:relative;flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .15s;-webkit-tap-highlight-color:transparent}
.pk svg{width:100%;aspect-ratio:60/76;display:block;filter:drop-shadow(0 5px 6px rgba(0,0,0,.45))}
.pk span{font-size:12.5px;font-weight:700;color:#e8f7ea;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pk.on{transform:translateY(-8px)}
.pk.on::after{content:"";position:absolute;left:10%;right:10%;bottom:-9px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 12px 3px var(--c)}
.pk:active{transform:translateY(-3px) scale(.95)}

@media (max-width:600px),(max-aspect-ratio:4/5){
  .gd>:not(:first-child){margin-top:auto}
  .gd>.yard{margin-top:0}
}
@media (max-width:600px){
  .top .k-fm{width:56px;height:56px}.top .k-finn .k-fb{font-size:15.5px;padding:10px 14px 10px 48px;margin-top:0}
  .seeds{gap:6px}.pk{width:min(56px,14vw)}.pk span{display:none}
  .bed{width:min(100cqw - 4px,(100cqh - 4px)*600/380)}
  .bask{width:19%}
}
@media (min-width:700px) and (min-height:700px){.pk{width:76px}.pk span{font-size:14.5px}.seeds{gap:16px}}
@media (max-height:560px){.gd{gap:6px;padding-top:calc(78px + var(--k-safe-t))}.pk{width:50px}.pk span{display:none}
  .top .k-fm{width:52px;height:52px}.top .k-finn .k-fb{font-size:15px;padding:8px 12px 8px 46px;margin-top:0}}
/* taller phones: packets in two rows of three, big enough for small fingers; upright tablets: big packets */
@media (max-width:600px) and (min-height:620px){.seeds{display:grid;grid-template-columns:repeat(3,auto);gap:10px 26px;justify-content:center}.pk{width:min(72px,19vw)}}
@media (min-width:601px) and (max-aspect-ratio:4/5){.pk{width:100px}.pk span{font-size:16px}.seeds{gap:24px}}
/* Big Moonlet (Nov 11): the switch after the packets (same look as the piano's and the easel's) and Finn's order note */
.pk.bigc .bf{width:100%;aspect-ratio:60/76;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-sizing:border-box;
  background:linear-gradient(180deg,rgba(60,40,110,.92),rgba(30,20,70,.92));border:1.5px solid rgba(214,190,255,.45);box-shadow:0 5px 8px rgba(0,0,0,.45)}
.pk.bigc .bf b{font-size:13px;font-weight:800;color:#f1eafc;line-height:1}
.pk.bigc i.sw{position:relative;display:block;width:34px;height:18px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25)}
.pk.bigc i.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#cfc6e6;transition:left .2s,background .2s}
.pk.bigc[aria-pressed="true"] .bf{background:linear-gradient(180deg,#e6d6ff,#b89cf2);border-color:#efe4ff;box-shadow:0 0 0 3px rgba(190,160,255,.4),0 0 18px rgba(190,160,255,.55),0 6px 14px rgba(0,0,0,.4)}
.pk.bigc[aria-pressed="true"] .bf b{color:#2a1650}
.pk.bigc[aria-pressed="true"] i.sw{background:#6a48c8}
.pk.bigc[aria-pressed="true"] i.sw::after{left:18px;background:#fff6d0}
.pk.new{animation:pknew .8s ease-out}
@keyframes pknew{0%{transform:scale(.3);opacity:0}60%{transform:translateY(-12px) scale(1.18);opacity:1}100%{transform:translateY(-8px) scale(1)}}
.order{position:absolute;z-index:4;left:.5%;top:1%;display:none;appearance:none;border:0;padding:0;background:none;cursor:pointer;font:inherit;font-size:12px;
  -webkit-tap-highlight-color:transparent;transform:rotate(-3deg);transform-origin:50% 0}
.gd.big .order{display:block}
.order::after{content:"";position:absolute;left:50%;top:96%;width:1em;height:3em;margin-left:-.5em;z-index:-1;border-radius:0 0 .3em .3em;
  background:linear-gradient(90deg,#7a4a24,#c08a52 45%,#6e401d);box-shadow:0 .3em .4em rgba(0,0,0,.35)}
.order .note{position:relative;display:block;padding:1.15em .6em .6em;border-radius:.35em;transition:transform .12s;
  background:linear-gradient(170deg,#fffaf0,#f1e2bf);box-shadow:0 .5em .9em rgba(0,0,0,.45),inset 0 0 0 1px rgba(150,110,60,.35)}
.order:active .note{transform:scale(.96)}
.order .pin{position:absolute;left:50%;top:.3em;width:.9em;height:.9em;margin-left:-.45em;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffb3b3,#d23a3a 60%,#8a1c1c);box-shadow:0 .15em .25em rgba(0,0,0,.45)}
.order .rows{display:grid;grid-template-columns:repeat(var(--oc,1),auto);gap:.35em .6em;justify-content:center}
.order .r{display:flex;align-items:center;gap:.3em}
.order .r svg{width:2.4em;height:2.4em;display:block;overflow:visible}
.order .ds{display:flex;gap:.16em}
.order .d{width:.8em;height:.8em;border-radius:50%;border:.13em dashed #a88a5c;box-sizing:border-box}
.order .d.f{border:.13em solid var(--dk);background:var(--c);box-shadow:0 0 .35em var(--c);animation:dpop .35s ease-out}
@keyframes dpop{0%{transform:scale(.2)}70%{transform:scale(1.35)}100%{transform:scale(1)}}
.order .num{position:absolute;left:-.5em;top:-.6em;height:1.75em;padding:0 .45em;border-radius:1em;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.85em;color:#2a1650;background:radial-gradient(circle at 35% 30%,#f3eaff,#c7aef5 60%,#8f6fd6);box-shadow:0 .15em .3em rgba(0,0,0,.4)}
.order .num:empty{display:none}
.order .stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.4em;font-weight:900;color:#2f9a4a;opacity:0;pointer-events:none;
  text-shadow:0 0 .15em #fff,0 0 .3em #fff}
.order.ok .stamp{animation:stamp 1.5s ease-out forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-20deg)}25%{opacity:1;transform:scale(1) rotate(-8deg)}80%{opacity:1}100%{opacity:0}}
.order.ok .note,.order.wig .note{animation:wig .6s ease-in-out}
/* the packet rows: a grid of --cols (half of packets + switch, rounded up) on phones and upright tablets */
.seeds{width:min(100%,980px)}
@media (max-width:600px){.seeds{display:grid;grid-template-columns:repeat(var(--cols,4),auto);gap:8px 12px;justify-content:center}
  .pk{width:min(72px,calc((100vw - 32px)/var(--cols,4) - 12px))}}
@media (max-width:600px) and (max-height:619px){.seeds{display:flex;gap:6px}.pk{width:min(50px,calc((100vw - 24px)/var(--n,7) - 6px))}
  .seeds.two{display:grid;grid-template-columns:repeat(var(--cols,4),auto);gap:5px 12px}.seeds.two .pk{width:min(50px,calc((100vw - 32px)/var(--cols,4) - 12px))}}
@media (min-width:601px) and (max-aspect-ratio:4/5){.seeds{display:grid;grid-template-columns:repeat(var(--cols,4),auto);gap:14px 24px;justify-content:center}}
@media (prefers-reduced-motion:reduce){.perch svg,.bfly svg,.bfly .wl,.bfly .wr,.plot.hint .hit{animation:none}}
</style>
</head>
<body class="moon-green">
<div class="bg" aria-hidden="true"></div>
<main class="gd">
  <section class="top" id="finnHere"></section>
  <div class="yard">
    <div class="bed" id="bed">
      <svg id="art" viewBox="0 0 600 380" aria-label="The garden bed"></svg>
      <div class="perch" id="perch" aria-hidden="true"></div>
      <div class="bfly" id="bfly" aria-hidden="true"></div>
      <button class="bask" id="bask" aria-label="The flower basket: pick the flowers"><svg viewBox="0 0 100 92" aria-hidden="true" id="baskArt"></svg><span class="n" id="bn"></span></button>
      <button class="order" id="order" aria-label="Finn's flower order"><span class="note"><span class="pin" aria-hidden="true"></span><span class="rows" id="orows"></span><span class="stamp" aria-hidden="true">✓</span></span><span class="num" id="onum" aria-hidden="true"></span></button>
    </div>
  </div>
  <nav class="seeds" id="seeds" aria-label="Seed packets"></nav>
</main>

<script src="kids.js?v=1110d"></script>
<script>
(function(){
  var HI="This is the moon garden! Pick a seed, then tap the dirt to plant it.";
  var WATER="Now tap it again to water it, and watch it grow!";
  var YAY="Six flowers! Your whole garden is blooming! Now tap the basket to pick them all.";
  var FIRST="One flower! Tap the basket any time to pick it.";
  var NUDGE="Tap the basket to pick your flowers!";
  var toldBask=false, nudgeT=0;
  var PICK="Into the basket they go! Let's plant some more.";
  var EMPTY="Grow some flowers first, then put them in the basket!";
  var COUNT=["One flower!","Two flowers!","Three flowers!","Four flowers!","Five flowers!"];
  var big=BWK.big();
  var BIGHI="Big Moonlet garden! I have flower orders for you. Grow what I ask for, then pick them into the basket.";
  var DONE="Order done! Thank you so much!", NEWSEED="You earned a new seed!", ALL="You finished every order! You're a real moon gardener!";
  var ORDERS=[{tulip:2},{daisy:3},{rose:2,sunflower:1},{lily:3,poppy:1},{bluebell:2,tulip:2},{pansy:2,rose:2,daisy:1},
    {sunflower:3,bluebell:2},{marigold:3,lily:2,poppy:1},{tulip:2,pansy:2,marigold:2},{rose:1,daisy:1,poppy:1,bluebell:1,sunflower:1,lily:1}];
  var OTXT=["Can you grow me two tulips?","Now I need three daisies, please!","Two roses and one sunflower, please!","Three lilies and one poppy, please!",
    "Two bluebells and two tulips, please!","Two pansies, two roses, and one daisy, please!","Three sunflowers and two bluebells, please!",
    "Three marigolds, two lilies, and one poppy, please!","Two tulips, two pansies, and two marigolds, please!",
    "A rainbow order! One rose, one daisy, one poppy, one bluebell, one sunflower, and one lily."];
  BWK.lines({"gd-hi":HI});
  BWK.init({here:"moonlets", voice:"finn", intro:HI, noHello:true});
  var $=function(id){return document.getElementById(id);};
  var NS="http://www.w3.org/2000/svg";
  /* ---------- Finn's face (the same drawing as the kit's speech bubble) ---------- */
  function face(id){ return '<svg class="k-fm" viewBox="0 0 100 100" aria-hidden="true"><defs>'+
    '<radialGradient id="'+id+'g" cx="30%" cy="35%" r="75%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#f6e6bd"/><stop offset="1" stop-color="#dcc188"/></radialGradient>'+
    '<mask id="'+id+'m"><rect width="100" height="100" fill="#fff"/><circle cx="71" cy="37" r="31" fill="#000"/></mask></defs>'+
    '<circle cx="48" cy="54" r="38" fill="url(#'+id+'g)" mask="url(#'+id+'m)"/>'+
    '<ellipse cx="25" cy="58" rx="3.2" ry="4.2" fill="#3b2a12"/><ellipse cx="40" cy="67" rx="3.2" ry="4.2" fill="#3b2a12"/>'+
    '<circle cx="24.2" cy="56.6" r="1.1" fill="#fff"/><circle cx="39.2" cy="65.6" r="1.1" fill="#fff"/>'+
    '<ellipse cx="20" cy="68" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/><ellipse cx="44" cy="78" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/>'+
    '<path d="M27 72 q5 7 11 3" stroke="#3b2a12" stroke-width="2.6" fill="#a5523a" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<g><path d="M68 50l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#fff3c4"/><path d="M80 40l1.1 2.7 2.7 1.1-2.7 1.1-1.1 2.7-1.1-2.7-2.7-1.1 2.7-1.1z" fill="#ffe7a0"/>'+
    '<circle cx="75" cy="58" r="1.6" fill="#fff"/><circle cx="62" cy="44" r="1.2" fill="#ffeab0"/></g></svg>'; }
  var top=$("finnHere");
  top.innerHTML='<div class="k-finn k-finn-in">'+face("gdS")+'<p class="k-fb">'+HI+'</p></div>';
  var talked=false;
  var sayN=0; function say(t,clip,then){ talked=true; var n=++sayN; BWK.finn(t,{into:top, clip:clip, onend:then?function(){ if(n===sayN) then(); }:null}); }
  top.addEventListener("click",function(e){ if(e.target.closest(".k-fm") && !talked) greet(); });
  document.addEventListener("click",function(e){
    if(talked || e.target.closest(".plot,.pk,.bask,.order,.k-head,.k-sheet,.k-veil")) return; greet(); });
  function greet(){ if(big) say(BIGHI,"gd-bighi",sayOrder); else say(HI,"gd-hi"); }
  var perch=$("perch"); perch.innerHTML=face("gdP");
  function hopFinn(){ perch.classList.remove("land"); void perch.offsetWidth; perch.classList.add("land"); }

  /* ---------- sounds: rustle (packet), dig, pour, grow, bloom chime, pick ---------- */
  var AC=null;
  function ac(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
    if(AC.state==="suspended") AC.resume(); return AC; }
  document.addEventListener("pointerdown",ac,{capture:true,passive:true});
  function snd(){ return BWK.store.get("sound",true) ? ac() : null; }
  function tone(c,f,t,dur,vol,type,f2){ var o=c.createOscillator(), g=c.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur*.7);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); }
  function noise(c,t,dur,ftype,freq,q,vol,shape){ var n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++){ var x=i/n; d[i]=(Math.random()*2-1)*(shape?shape(x):Math.sin(Math.PI*x)); }
    var s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=b; f.type=ftype; f.frequency.value=freq; f.Q.value=q;
    g.gain.value=vol; s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); }

  function finish(){ setTimeout(function(){ chord(); for(var k=0;k<8;k++) (function(k){ setTimeout(function(){ sparkle(10+k*11,18+(k%3)*18,"#ffe08a",2); },k*90); })(k); },300);
    setTimeout(function(){ toldBask=true; say(YAY,"gd-yay-2"); },500);
    clearTimeout(nudgeT); nudgeT=setTimeout(function(){ if(blooms()===6) say(NUDGE,"gd-nudge"); },16000); }
  function baskState(){ var n=blooms(); bask.classList.toggle("ready",n>0&&n<6); bask.classList.toggle("call",n===6); }
  /* ---------- the basket ---------- */
  var bask=$("bask"), bn=$("bn");
  function drawBasket(){ var s='<defs><linearGradient id="gdWick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfa760"/><stop offset="1" stop-color="#9c6129"/></linearGradient></defs>'+
      '<path d="M16 46 Q50 -6 84 46" stroke="#8a5426" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M18 44 Q50 -2 82 44" stroke="#d7a15f" stroke-width="3" fill="none" stroke-linecap="round"/>';
    var r=save.recent.slice(-5), xs=[30,70,42,58,50], ys=[42,42,36,36,30];
    r.forEach(function(k,j){ s+='<g transform="translate('+xs[j]+' '+ys[j]+') scale(.42)">'+head(k)+'</g>'; });
    s+='<path d="M10 46 H90 L81 86 Q50 92 19 86Z" fill="url(#gdWick)" stroke="#6e3f18" stroke-width="2" stroke-linejoin="round"/>';
    for(var y=56;y<86;y+=8) s+='<path d="M'+(12+(y-46)*.22)+' '+y+' H'+(88-(y-46)*.22)+'" stroke="#7a4519" stroke-width="1.4" opacity=".55"/>';
    for(var x=22;x<82;x+=8) s+='<path d="M'+x+' 48 L'+(50+(x-50)*.86)+' 88" stroke="#7a4519" stroke-width="1.2" opacity=".4"/>';
    s+='<rect x="7" y="42" width="86" height="9" rx="4.5" fill="#c58748" stroke="#6e3f18" stroke-width="1.8"/><path d="M12 45 H88" stroke="#f2c88e" stroke-width="1.6" opacity=".7"/>';
    $("baskArt").innerHTML=s; bn.textContent=save.basket?String(save.basket):""; }
  bask.addEventListener("click",function(){ var list=[], picked=[]; save.plots.forEach(function(p,i){ if(p&&p.s===4&&!busy[i]) list.push(i); });
    if(!list.length){ BWK.sfx("tap"); say(EMPTY,"gd-empty"); return; }
    var br=bask.getBoundingClientRect(), bd=bed.getBoundingClientRect(), tx=(br.left+br.width/2-bd.left)/bd.width*100, ty=(br.top+br.height*.4-bd.top)/bd.height*100;
    list.forEach(function(i,j){ var p=save.plots[i], q=headXY(i), f=document.createElement("div"); f.className="fly";
      f.innerHTML='<svg viewBox="-40 -40 80 80" aria-hidden="true">'+head(p.k)+'</svg>'; f.style.left=q[0]+"%"; f.style.top=q[1]+"%"; bed.appendChild(f);
      save.recent.push(p.k); picked.push(KINDS[p.k].id); save.plots[i]=null; render(i,false);
      var a=f.animate?f.animate([{left:q[0]+"%",top:q[1]+"%",transform:"translate(-50%,-50%) scale(1)"},
        {left:((q[0]+tx)/2)+"%",top:(Math.min(q[1],ty)-12)+"%",transform:"translate(-50%,-50%) scale(.9) rotate(20deg)",offset:.5},
        {left:tx+"%",top:ty+"%",transform:"translate(-50%,-50%) scale(.45) rotate(40deg)"}],{duration:650,delay:j*110,easing:"ease-in-out",fill:"forwards"}):null;
      if(a) a.onfinish=function(){ f.remove(); }; else setTimeout(function(){ f.remove(); },700); });
    if(save.recent.length>5) save.recent=save.recent.slice(-5);
    clearTimeout(nudgeT); save.basket+=list.length; persist(); baskState(); pickSnd(list.length); hints(); flutter();
    setTimeout(function(){ drawBasket(); bask.classList.remove("hop"); void bask.offsetWidth; bask.classList.add("hop"); },650+list.length*110);
    if(!(big&&orderPick(picked,list.length))) say(PICK,"gd-pick"); });
  /* ---------- a butterfly visits the flowers ---------- */
  var bf=$("bfly");
  bf.innerHTML='<svg viewBox="-20 -16 40 32"><g class="wl"><path d="M-1 -2 C-8 -16 -20 -12 -17 -3 C-15 2 -7 2 -1 0Z" fill="#ffb3e1" stroke="#a24a86" stroke-width="1.2"/>'+
    '<path d="M-1 1 C-7 3 -14 10 -9 13 C-5 15 -2 8 -1 3Z" fill="#c9a2ff" stroke="#7b4fc8" stroke-width="1.2"/></g>'+
    '<g class="wr"><path d="M1 -2 C8 -16 20 -12 17 -3 C15 2 7 2 1 0Z" fill="#ffb3e1" stroke="#a24a86" stroke-width="1.2"/>'+
    '<path d="M1 1 C7 3 14 10 9 13 C5 15 2 8 1 3Z" fill="#c9a2ff" stroke="#7b4fc8" stroke-width="1.2"/></g>'+
    '<ellipse rx="1.8" ry="8" fill="#3a2f4a"/><path d="M-1 -7 q-3 -6 -6 -7 M1 -7 q3 -6 6 -7" stroke="#3a2f4a" stroke-width="1" fill="none"/></svg>';
  var bfAt=-1;
  function flutter(){ var open=[]; save.plots.forEach(function(p,i){ if(p&&p.s===4&&i!==bfAt) open.push(i); });
    if(!open.length){ if(!blooms()){ bf.classList.remove("on"); bfAt=-1; } return; }
    var i=open[Math.floor(Math.random()*open.length)], q=headXY(i); bfAt=i;
    if(!bf.classList.contains("on")){ bf.style.transition="none"; bf.style.left=(q[0]>50?104:-4)+"%"; bf.style.top=(q[1]-10)+"%"; void bf.offsetWidth; bf.style.transition=""; }
    bf.classList.add("on"); bf.style.left=q[0]+"%"; bf.style.top=(q[1]-7)+"%"; }
  setInterval(flutter,4200);
  /* ---------- seed packets ---------- */
  function packet(k){ var K=KINDS[k]; return '<svg viewBox="0 0 60 76" aria-hidden="true">'+
    '<path d="M4 8 H56 V70 Q56 74 52 74 H8 Q4 74 4 70Z" fill="#fff4dc" stroke="#b8935c" stroke-width="1.6"/>'+
    '<path d="M4 2 L8 8 L12 2 L16 8 L20 2 L24 8 L28 2 L32 8 L36 2 L40 8 L44 2 L48 8 L52 2 L56 8 V12 H4Z" fill="#e8cf9e" stroke="#b8935c" stroke-width="1.2" stroke-linejoin="round"/>'+
    '<path d="M4 56 H56 V70 Q56 74 52 74 H8 Q4 74 4 70Z" fill="'+K.band+'" stroke="#b8935c" stroke-width="1.2"/>'+
    '<path d="M10 62 H50 M14 67 H46" stroke="#fff" stroke-width="1.6" opacity=".55" stroke-linecap="round"/>'+
    '<path d="M30 56 C28 48 32 42 30 36" stroke="#3f9a45" stroke-width="2.4" fill="none"/>'+leaf(30,48,-150,9)+leaf(30,46,-30,9)+
    '<g transform="translate('+(K.id==="bluebell"?20:30)+' '+(K.id==="bluebell"?32:31)+') scale(.6)">'+head(k)+'</g>'+
    '<path d="M8 12 V52" stroke="#fff" stroke-width="2.4" opacity=".6" stroke-linecap="round"/></svg>'; }
  var seedsEl=$("seeds"), pkBtns=[];
  seedsEl.addEventListener("click",function(e){ var b=e.target.closest(".pk"); if(!b) return; if(b===bigB){ toggleBig(); return; } var k=+b.dataset.k; save.seed=k; persist();
    pkBtns.forEach(function(x){ x.classList.toggle("on",x===b); }); rustle(); say(KINDS[k].name+"!","gd-"+KINDS[k].id); });
  /* ---------- Big Moonlet (Nov 11): Finn's flower orders; new seeds as orders are done ---------- */
  var gdMain=document.querySelector("main.gd"), card=$("order"), orows=$("orows"), onum=$("onum");
  var KI={}; KINDS.forEach(function(K,k){ KI[K.id]=k; });
  var UNLOCK={3:"lily",5:"pansy",7:"marigold"};
  function oIdx(){ var d=save.big.done; return d<10?d:3+((d-10)%7); }
  function cur(){ return ORDERS[oIdx()]; }
  function unlocked(){ var d=save.big.done; return 6+(d>=3?1:0)+(d>=5?1:0)+(d>=7?1:0); }
  function sayOrder(){ var i=oIdx(); say(OTXT[i],"gd-o"+(i+1)); }
  function orderRow(id,n,g){ var k=KI[id], K=KINDS[k], vb=id==="bluebell"?"-4 -16 46 46":"-25 -25 50 50", d="";
    for(var j=0;j<n;j++) d+='<i class="d'+(j<g?' f':'')+'"></i>';
    return '<span class="r" style="--c:'+K.c+';--dk:'+K.d+'"><svg viewBox="'+vb+'" aria-hidden="true">'+head(k)+'</svg><span class="ds">'+d+'</span></span>'; }
  function drawOrder(){ var O=cur(), got=save.big.got, s="", n=0; for(var id in O){ s+=orderRow(id,O[id],Math.min(got[id]|0,O[id])); n++; }
    orows.innerHTML=s; orows.style.setProperty("--oc",n>3?2:1); onum.textContent=save.big.done?"☾ "+save.big.done:"";
    card.setAttribute("aria-label","Finn's flower order: "+OTXT[oIdx()]); }
  function tick(n){ var c=snd(); if(!c) return; var t=c.currentTime+.02; for(var k=0;k<n;k++) tone(c,1046.5*(1+k*.125),t+k*.09,.14,.05,"triangle"); }
  /* picked flowers that the order still needs fill its dots; true when the order is now complete */
  function orderPick(ids,n){ var O=cur(), got=save.big.got, add=0;
    ids.forEach(function(id){ if((got[id]|0)<(O[id]|0)){ got[id]=(got[id]|0)+1; add++; } });
    if(!add) return false; persist(); var wait=650+n*110;
    setTimeout(function(){ drawOrder(); tick(add); },wait);
    var full=true; for(var id in O) if((got[id]|0)<O[id]) full=false;
    if(full) setTimeout(orderDone,wait+350);
    return full; }
  function orderDone(){ card.classList.remove("ok"); void card.offsetWidth; card.classList.add("ok"); chord();
    var r=card.getBoundingClientRect(), bd=bed.getBoundingClientRect(), cx=(r.left+r.width/2-bd.left)/bd.width*100, cy=(r.top+r.height/2-bd.top)/bd.height*100;
    for(var k=0;k<4;k++) (function(k){ setTimeout(function(){ sparkle(cx+(k-1.5)*4,cy,"#ffe08a",2); },k*110); })(k);
    save.big.done++; save.big.got={}; persist(); var d=save.big.done, nk=UNLOCK[d];
    setTimeout(function(){ card.classList.remove("ok"); drawOrder(); },1500);
    if(nk) setTimeout(function(){ var k=KI[nk]; save.seed=k; persist(); buildSeeds(k); rustle(); },3400);
    say(DONE,"gd-done",function(){
      if(d===10) say(ALL,"gd-allorders",sayOrder);
      else if(nk) say(NEWSEED,"gd-newseed",function(){ say(KINDS[KI[nk]].name+"!","gd-"+nk,sayOrder); });
      else sayOrder(); }); }
  var bigB=document.createElement("button"); bigB.className="pk bigc"; bigB.setAttribute("aria-label","Big Moonlet");
  bigB.innerHTML='<span class="bf" aria-hidden="true"><i class="sw"></i><b>Big</b></span><span>Big Moonlet</span>';
  function bigShow(){ bigB.setAttribute("aria-pressed",big?"true":"false"); gdMain.classList.toggle("big",big); }
  function buildSeeds(newK){ var n=big?unlocked():6; if(save.seed>=n) save.seed=0; seedsEl.innerHTML=""; pkBtns=[];
    for(var k=0;k<n;k++){ var K=KINDS[k], b=document.createElement("button"); b.className="pk"+(k===save.seed?" on":"")+(k===newK?" new":""); b.dataset.k=k;
      b.setAttribute("aria-label",K.name+" seeds"); b.style.setProperty("--c",K.band); b.innerHTML=packet(k)+'<span>'+K.name+'</span>';
      seedsEl.appendChild(b); pkBtns.push(b); }
    seedsEl.appendChild(bigB); seedsEl.style.setProperty("--cols",Math.ceil((n+1)/2)); seedsEl.style.setProperty("--n",n+1); seedsEl.classList.toggle("two",n+1>7); }
  function toggleBig(){ big=!big; BWK.setBig(big); bigShow(); BWK.sfx("tap"); buildSeeds(); drawOrder(); requestAnimationFrame(size);
    if(big) say(BWK.BIG_LINES.on,"bg-on",function(){ say(BIGHI,"gd-bighi",sayOrder); }); else say(BWK.BIG_LINES.off,"bg-off"); }
  card.addEventListener("click",function(){ BWK.sfx("tap"); card.classList.remove("wig"); void card.offsetWidth; card.classList.add("wig");
    setTimeout(function(){ card.classList.remove("wig"); },650); sayOrder(); });
  /* ---------- start ---------- */
  buildSeeds(); bigShow(); drawOrder();
  for(var i=0;i<6;i++) render(i,false); hints(); drawBasket(); baskState(); setTimeout(flutter,900);
  function size(){ var w=bed.getBoundingClientRect().width; perch.style.setProperty("--hw",Math.round(Math.max(44,Math.min(74,w*.085)))+"px");
    card.style.fontSize=Math.min(20,Math.max(10.5,w*.034)).toFixed(1)+"px"; }
  requestAnimationFrame(size); window.addEventListener("resize",size);
  window.GDO={tap:tapPlot, seed:function(k){ seedsEl.children[k].click(); }, pick:function(){ bask.click(); },
    growAll:function(){ for(var i=0;i<6;i++){ if(!save.plots[i]) save.plots[i]={k:i,s:1}; save.plots[i].s=4; render(i,false); } persist(); hints(); baskState(); flutter(); },
    reset:function(){ save={plots:[null,null,null,null,null,null],seed:0,basket:0,recent:[],big:{done:0,got:{}}}; persist(); for(var i=0;i<6;i++) render(i,false); hints(); drawBasket(); baskState(); buildSeeds(); drawOrder(); },
    state:function(){ return {plots:save.plots.map(function(p){ return p?p.k+":"+p.s:"-"; }).join(" "), basket:save.basket, seed:save.seed, busy:busy.join(), big:big, done:save.big.done, order:oIdx(), got:JSON.stringify(save.big.got), seeds:pkBtns.length}; },
    big:function(on){ if(!!on!==big) toggleBig(); },
    setDone:function(n){ save.big.done=n; save.big.got={}; persist(); buildSeeds(); drawOrder(); },
    orderBed:function(){ var O=cur(), list=[]; for(var id in O) for(var j=0;j<O[id];j++) list.push(KI[id]);
      for(var i=0;i<6;i++){ save.plots[i]=i<list.length?{k:list[i],s:4}:null; render(i,false); } persist(); hints(); baskState(); flutter(); }};
})();
