  /* ---------- sticker pictures with a white die-cut edge (drawn once per picture) ---------- */

    x.font=(n*.72)+"px serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(s.e||"⭐",n/2,n*.55); return c; }
  function dieCut(src){ var M=300, sc=Math.min(1,M/Math.max(src.width,src.height)), w=Math.round(src.width*sc), h=Math.round(src.height*sc), p=Math.round(Math.max(w,h)*.06)+4;

  function artFor(id,cb){ if(ART[id]) cb(); else makeArt(ST[id],cb); }

  /* ---------- the page ---------- */
  var stage=$("stage"), cur=S.page;
  function P(){ return PAGES[cur]; }
  function bgUrl(p,big){ return p.bg+(big?".jpg":"-sm.jpg")+"?v="+(p.bgv||AV); }
  function setBg(){ var p=P(); stage.style.background=p.stand; var im=new Image(), u=bgUrl(p,window.innerWidth>=1100);

  /* depth: a sticker shrinks as it goes up toward the sky line; sky stickers keep one size */

  function sheet(){ var used={}; S.pages[cur].forEach(function(r){ used[r[0]]=1; });
    $("sheet").innerHTML=P().ids.map(function(id){ return '<button class="ti'+(used[id]?' used':'')+'" data-id="'+id+'" aria-label="'+ST[id].n+'"></button>'; }).join("");

  /* a good spot for a tapped sticker: sky stickers in the sky, water ones in the water, the rest on the ground, away from others */

    if(s.k==="s") box=z.sky; else if(s.k==="w") box=z.water||z.pond||z.ground; else box=cur==="beach"?z.sand:(z.field||z.ground);
    var best=null, bd=-1;

    var hp=s.w*(ART[id]?ART[id].ar:1)*1.5*(s.k==="s"?1:.8), y0=Math.max(box[1]+3,hp+3), y1=Math.max(y0+2,box[3]-2);

  /* ---------- dragging (pointer events; no Finn lines here: lines start from clicks) ---------- */

  $("sheet").addEventListener("pointerdown",function(e){ var b=e.target.closest(".ti"); if(!b) return; var sh=$("sheet");

        D={el:el, i:i, id:id, dx:0, dy:4, sx:e.clientX, sy:e.clientY, moved:true, fromSheet:true}; el.classList.add("drag"); SND.peel(); } }

    if(!D.moved) return;
    var x=Math.max(0,Math.min(100,p2[0]+D.dx)), y=Math.max(4,Math.min(104,p2[1]+D.dy)), r=S.pages[cur][D.i]; r[1]=x; r[2]=y;

    sheet(); dropped=true; lastDrop=Date.now(); setTimeout(check,250); });

  var dropped=false, lastDrop=0;

  $("sheet").addEventListener("click",function(e){ var b=e.target.closest(".ti"); if(!b) return; var id=b.dataset.id;
    if(Date.now()-lastDrop<500) return;
    if(!talked&&!big) talked=true;
    var s=spot(id); S.pages[cur].push([id,s[0],s[1]]); S.made++; save(); var el=addEl(id,s[0],s[1],S.pages[cur].length-1);
    SND.peel(); setTimeout(function(){ SND.stick(); el.classList.add("press"); },180); sheet(); say(NAME(ST[id]),"sc-n-"+id); setTimeout(check,300); });
  stage.addEventListener("click",function(e){ var el=e.target.closest(".sk"); if(!el||Date.now()-lastDrop<350) return; var id=el.dataset.id, s=ST[id];
    el.classList.remove("wig"); void el.offsetWidth; el.classList.add("wig"); if(s.k==="a") SND.friend(); else SND.thing(); say(NAME(s),"sc-n-"+id); });

  /* ---------- Big Moonlet: the page's three challenges ---------- */
  function inBox(r,b){ return r[1]>=b[0]&&r[1]<=b[2]&&r[2]>=b[1]&&r[2]<=b[3]; }

    function n(f){ return L.filter(f).length; }
    switch(key){
      case "three": return n(function(r){ return ST[r[0]].k==="a"&&r[2]>=P().hz; })>=3;
      case "pond": return n(function(r){ return ST[r[0]].k==="a"&&inBox(r,z.pond); })>=1;
      case "skyb": return n(function(r){ return r[0]==="butterfly"&&inBox(r,z.sky); })>=1;

      case "sand": return n(function(r){ return r[0]==="castle"&&inBox(r,z.sand); })>=1;

  var T=null;   /* {page, i, done} */

    h+='<span class="st" aria-label="'+T.done+' of 3">'; for(var i=0;i<3;i++) h+=i<T.done?'<b>★</b>':'★'; h+='</span>'; $("goal").innerHTML=h; }

  function check(){ if(!big||!T||T.page!==cur) return; var t=P().tasks[T.i]; if(!t||!met(t[0])) return;
    T.done++; T.i++; goal(); SND.yes(); BWK.played&&BWK.played("stickers");
    if(T.i>=P().tasks.length){ say(ALL,"sc-all"); bar(); return; }
    say(YES,"sc-yes",{onend:function(){ setTimeout(ask,300); }}); }

      (big?'<button class="chip go" data-a="next" aria-label="Next page"><em>➜</em><span>Next page</span></button>':'<button class="chip go" data-a="tada" aria-label="Ta-da"><em>✨</em><span>Ta-da!</span></button>')+
      '<button class="chip" data-a="clear" aria-label="Fresh page"><em>↺</em><span>Fresh page</span></button>'+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="games" aria-label="More games"><em>☾</em><span>More games</span></button>'; }

  $("pages").addEventListener("click",function(e){ var b=e.target.closest(".pg"); if(!b||b.dataset.p===cur) return; go2(b.dataset.p,true); });
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; BWK.sfx("tap"); var a=b.dataset.a;
    if(a==="tada") tada();
    else if(a==="next"){ go2(ORDER[(ORDER.indexOf(cur)+1)%3],true); }

})();
