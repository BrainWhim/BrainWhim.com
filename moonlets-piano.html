<style>
/* ==========================================================================
   BrainWhim · Moonlets: the Moon Piano (Nov 10, 2026)
   A big friendly toy piano on the meadow (the pink moon's music spot). Eight colored white keys (C to high C)
   and five black keys; every note is made in the browser (Web Audio, a soft toy-piano tone with a little moon bell).
   Free play: Finn bounces onto whatever key you press. Pick a song: Finn hops onto the key to tap next;
   Listen: Finn plays it first, hopping along. No wrong notes, no losing, no timer. Slide a finger for a glissando.
   Desktop: keys A W S E D F T G Y H U J K. Songs (all public domain, pre-1929): Twinkle Twinkle, Mary Had a
   Little Lamb, Hot Cross Buns, Row Row Row Your Boat, London Bridge. Saved on the device: bwk.piano {songs:{id:n}}.
   Nov 10 night, Big Moonlet (ages about 5-7; the kit's BWK.big switch, the moon chip at the end of the song row):
   songs with no glowing keys (Finn hops over to help after a few seconds' wait), and the Echo game: Finn plays a
   short tune, you play it back from memory; 3 notes on C D E, growing to 8 notes on all eight keys (6 levels).
   A wrong note: Finn plays it again (no losing). Saved: bwk.piano {bigs:{id:n}, echo:{lv, best}}.
   ========================================================================== */
.bg{position:fixed;inset:-12px;z-index:-1;background:url("kids-moonlets-sm.jpg") center/cover;filter:blur(2px) brightness(.5)}
.pn{height:100svh;min-height:500px;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:calc(84px + var(--k-safe-t)) 12px calc(14px + var(--k-safe-b))}
.top{width:min(100%,720px);margin-top:auto}
.pn>:last-child{margin-bottom:auto}
/* phones and upright tablets: Finn right under the menu, the piano at the bottom, the spare height shared equally between the rows */
@media (max-width:600px),(max-aspect-ratio:4/5){
  .top{margin-top:0}.pn>:last-child{margin-bottom:0}
  .pn>:not(:first-child):not(.hint){margin-top:auto}
}
.top .k-finn-in{margin:0}
/* Finn's bubble is centered on the page; her moon perches on its top-left corner (Nov 10, Judy: the moon beside it pushed the bubble off center) */
.top{display:flex;justify-content:center;padding-top:16px}
.top .k-finn{display:block;position:relative;width:fit-content;max-width:100%}
.top .k-fm{position:absolute;left:-12px;top:-18px;z-index:2;width:62px;height:62px}
.top .k-finn .k-fb{margin:0;padding:12px 18px 12px 54px;border-radius:20px}
.k-fm{cursor:pointer}
.songs{display:flex;gap:8px;max-width:100%;overflow-x:auto;padding:4px 2px 6px;justify-content:safe center;scrollbar-width:none}
.songs::-webkit-scrollbar{display:none}
.song{flex:none;position:relative;appearance:none;cursor:pointer;min-width:84px;height:66px;padding:6px 10px;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,rgba(32,44,90,.88),rgba(16,24,54,.88));border:1px solid rgba(255,236,190,.28);
  box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .12s}
.song:active{transform:scale(.95)}
.song em{font-style:normal;font-size:26px;line-height:1}
.song span{font-size:12.5px;font-weight:700;color:#e9f0fb;white-space:nowrap}
.song.on{background:linear-gradient(180deg,#fff4d6,#f2d892);border-color:#fff2c8;box-shadow:0 0 0 3px rgba(255,226,150,.35),0 6px 14px rgba(0,0,0,.4)}
.song.on span{color:#3a2a10}
.song.bigc{background:linear-gradient(180deg,rgba(60,40,110,.9),rgba(30,20,70,.9));border-color:rgba(214,190,255,.45)}
.song.bigc i.sw{position:relative;display:block;width:34px;height:18px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25)}
.song.bigc i.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#cfc6e6;transition:left .2s,background .2s}
.song.bigc[aria-pressed="true"]{background:linear-gradient(180deg,#e6d6ff,#b89cf2);border-color:#efe4ff;box-shadow:0 0 0 3px rgba(190,160,255,.4),0 0 18px rgba(190,160,255,.55),0 6px 14px rgba(0,0,0,.4)}
.song.bigc[aria-pressed="true"] span{color:#2a1650}
.song.bigc[aria-pressed="true"] i.sw{background:#6a48c8}
.song.bigc[aria-pressed="true"] i.sw::after{left:18px;background:#fff6d0}
.song .moon{position:absolute;top:3px;left:7px;font-size:12px;color:#d9c8ff;text-shadow:0 0 6px rgba(190,160,255,.9)}
.lvl{display:none;gap:5px;align-items:center}.ctl.echo .lvl{display:flex}
.lvl i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,236,190,.3)}
.lvl i.on{background:radial-gradient(circle at 35% 30%,#fff,#ffd84d 60%,#c79a12);border-color:#fff2c8;box-shadow:0 0 6px rgba(255,210,90,.8)}
.song .got{position:absolute;top:3px;right:7px;font-size:12px;color:#ffd35c;text-shadow:0 0 6px rgba(255,200,80,.8)}
.ctl{display:flex;align-items:center;gap:10px;width:min(100%,560px)}
.cb:disabled{opacity:.4;cursor:default;box-shadow:0 2px 0 #b8954a}
.ctl.off .prog{opacity:.35}
.cb{appearance:none;border:0;cursor:pointer;height:46px;padding:0 16px;border-radius:999px;font-size:16px;font-weight:700;
  background:linear-gradient(180deg,#fff4d6,#f0d48a);color:#3a2a10;box-shadow:0 4px 0 #b8954a,0 8px 14px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px}
.cb:active{transform:translateY(2px);box-shadow:0 2px 0 #b8954a,0 4px 8px rgba(0,0,0,.35)}
.cb.round{width:46px;padding:0;justify-content:center;font-size:22px}
.prog{flex:1;height:14px;border-radius:999px;background:rgba(10,18,40,.7);border:1px solid rgba(255,236,190,.25);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:inherit;transition:width .25s;
  background:linear-gradient(90deg,#ff8fc8,#ffd84d,#7ee08a,#7cc4ff,#b79bff);box-shadow:0 0 10px rgba(255,220,150,.7)}

/* the piano: midnight-blue lacquer, gold trim, red felt, ivory keys with moonstone dots */
.piano{position:relative;flex:1 1 0;display:flex;flex-direction:column;width:min(100%,980px);min-height:150px;
  max-height:calc(min(100vw - 24px,980px)*.42 + 56px);  /* keys stay toy-piano shaped (about 3.4 times as tall as wide) */
  padding:0 12px 16px;border-radius:24px 24px 28px 28px;
  background:radial-gradient(120% 80% at 30% 0,rgba(140,160,255,.22),transparent 55%),linear-gradient(180deg,#2c3274,#1c2052 55%,#13163a);
  border:2px solid #c9a75a;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -8px 14px rgba(0,0,0,.45),inset 0 0 0 4px rgba(10,12,40,.5),
    0 4px 0 #8f7333,0 22px 40px rgba(0,0,0,.6)}
.lid{position:relative;height:40px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.lid b{font-size:15px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#f3d98e;
  text-shadow:0 1px 0 rgba(0,0,0,.6),0 0 8px rgba(255,210,120,.35)}
.lid .st{position:absolute;top:50%;color:#e8c96f;opacity:.75;font-size:13px;transform:translateY(-50%)}
.felt{height:7px;margin:0 2px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#9b2747,#6d1530);box-shadow:inset 0 1px 0 rgba(255,140,170,.25)}
.keys{position:relative;flex:1;display:flex;touch-action:none;user-select:none;-webkit-user-select:none;
  background:#0c0e26;border-radius:0 0 14px 14px;padding:0 1px 2px}
.key{appearance:none;border:0;padding:0;cursor:pointer;-webkit-touch-callout:none;outline:none}
.key.w{position:relative;flex:1;margin:0 1.5px;border-radius:0 0 14px 14px;
  background:linear-gradient(180deg,#e9e1cf 0,#fffdf7 9%,#fbf5e7 82%,#efe4cc 100%);
  box-shadow:0 7px 0 #cdbf9f,0 9px 12px rgba(0,0,0,.45),inset 0 -3px 0 rgba(120,100,60,.08),inset 1px 0 0 rgba(255,255,255,.9);
  transition:transform .05s,box-shadow .05s,background .2s}
.key.w .dot{position:absolute;left:50%;bottom:16%;width:min(58%,46px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff 0 10%,var(--c) 52%,var(--cd));
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.18),0 0 0 3px rgba(255,255,255,.6)}
.key.w .lt{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-size:12px;font-weight:700;color:#9a8c6c}
.key.w.down{transform:translateY(5px);box-shadow:0 2px 0 #cdbf9f,0 3px 6px rgba(0,0,0,.4),inset 0 0 26px color-mix(in srgb,var(--c) 55%,transparent);
  background:linear-gradient(180deg,#e3d9c3 0,#fbf6ea 12%,#f6eedb 100%)}
.key.b{position:absolute;top:0;z-index:2;width:8.6%;height:58%;transform:translateX(-50%);border-radius:0 0 9px 9px;
  background:linear-gradient(180deg,#14141e 0,#2a2a38 78%,#3d3d52 92%,#2a2a38 100%);
  box-shadow:0 6px 0 #07070c,0 8px 10px rgba(0,0,0,.55),inset 1px 0 0 rgba(255,255,255,.1),inset -1px 0 0 rgba(0,0,0,.5);
  transition:transform .05s,box-shadow .05s}
.key.b::after{content:"";position:absolute;left:18%;right:18%;top:6%;height:44%;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent)}
.key.b.down{transform:translate(-50%,4px);box-shadow:0 2px 0 #07070c,0 3px 6px rgba(0,0,0,.5),0 0 14px rgba(200,170,255,.6)}
.key.next::before{content:"";position:absolute;inset:-3px;border-radius:0 0 16px 16px;pointer-events:none;
  box-shadow:0 0 0 5px var(--c,#ffe08a),0 0 26px 8px var(--c,#ffe08a);animation:nx 1.1s ease-in-out infinite}
.key.w.next{background:linear-gradient(180deg,#e9e1cf 0,color-mix(in srgb,var(--c) 30%,#fffdf7) 14%,color-mix(in srgb,var(--c) 22%,#fbf5e7) 82%,#efe4cc 100%)}
@keyframes nx{0%,100%{opacity:.45}50%{opacity:1}}

/* Finn on the keys */
.hop{position:absolute;left:0;top:0;z-index:6;pointer-events:none;will-change:transform;width:var(--hw,60px);height:var(--hw,60px)}
.hop svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(255,214,140,.55));transform-origin:50% 90%}
.hop .sh{position:absolute;left:18%;right:18%;bottom:-4%;height:12%;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(2px)}
.hop.land svg{animation:land .26s ease-out}
@keyframes land{0%{transform:scale(1.12,.84)}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
.hop.wig svg{animation:wig .45s ease-in-out}
@keyframes wig{20%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}80%{transform:rotate(-5deg)}}
.hop.idle svg{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.spk{position:absolute;z-index:7;pointer-events:none;font-size:18px;line-height:1;color:var(--c,#ffe08a);text-shadow:0 0 8px var(--c,#ffe08a);
  animation:spk .8s ease-out forwards}
@keyframes spk{0%{opacity:1;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-70px) scale(1.2)}}
.hint{font-size:13px;color:#cdd8ea;text-shadow:0 1px 4px rgba(0,0,0,.7);margin:0;display:none}
@media (hover:hover) and (pointer:fine){.hint{display:block}}

/* upright tablets: the row wraps onto two lines rather than scrolling (Big Moonlet adds two chips) */
@media (min-width:601px) and (max-aspect-ratio:4/5){.songs{flex-wrap:wrap;overflow:visible;justify-content:center}}
@media (max-width:600px){.songs{display:grid;grid-template-columns:repeat(4,1fr);width:100%;overflow:visible;padding:0}
  .song{min-width:0;height:54px;padding:4px 6px}.song em{font-size:22px}.song span{font-size:12px;white-space:normal;text-align:center;line-height:1.1}
  .songs .song:nth-child(7):last-child{grid-column:span 2}.lvl i{width:9px;height:9px}
  .top .k-fm{width:56px;height:56px}.top .k-finn .k-fb{font-size:15.5px;padding:10px 14px 10px 48px;margin-top:0}.hint{display:none!important}}
@media (min-width:700px) and (min-height:700px){.song{height:82px;min-width:112px;border-radius:24px}.song em{font-size:32px}.song span{font-size:15px}.cb{height:52px;font-size:18px}.cb.round{width:52px}}
@media (max-width:600px) and (min-height:740px){.song{height:68px}.song em{font-size:27px}.song span{font-size:13px}}
@media (max-width:520px){.piano{padding:0 7px 12px}.lid{height:32px}.lid b{font-size:12px}.key.w .lt{display:none}.key.w .dot{bottom:9%}}
@media (max-height:560px){.pn{gap:6px;padding-top:calc(78px + var(--k-safe-t))}.song{height:52px;min-width:70px}.song em{font-size:22px}.song span{font-size:11px}
  .top .k-fm{width:52px;height:52px}.top .k-finn .k-fb{font-size:15px;padding:8px 12px 8px 46px;margin-top:0}.cb{height:40px}.cb.round{width:40px}.lid{height:28px}}
@media (max-height:440px){.song span{display:none}.song{height:44px;min-width:52px}.hint{display:none!important}}
@media (prefers-reduced-motion:reduce){.key.next::before,.hop.idle svg{animation:none}}
</style>

<body class="moon-pink">
<div class="bg" aria-hidden="true"></div>
<main class="pn">
  <section class="top" id="finnHere"></section>
  <nav class="songs" id="songs" aria-label="Songs"></nav>
  <div class="ctl off" id="ctl">
    <button class="cb" id="bListen" disabled><span aria-hidden="true">👂</span> Listen</button>
    <div class="prog" aria-hidden="true"><i id="progF"></i></div>

  </div>

    <div class="lid" aria-hidden="true"><span class="st" style="left:12%">✦</span><span class="st" style="left:24%">☾</span><b>Moon Piano</b><span class="st" style="right:24%">☾</span><span class="st" style="right:12%">✦</span></div>

</main>

<script src="kids.js?v=1112a"></script>
<script>
(function(){
  var HI="This is the moon piano! Tap the keys to make music, or pick a song and follow me.";
  var SONGLN="Tap the key where I land! Then I'll hop to the next one.";
  var LISTEN="Listen first! Watch me hop along the keys.";
  var YAY="You played the whole song! You're a little star!";
  var FREE="Free play! Tap any key you like.", WATCH="Listen and watch me!";
  var BIGSONG="No glowing keys this time! If you get stuck, wait, and I'll hop over to help.";
  var BIGYAY="You played it all by yourself! Amazing!";
  var ECHO="The echo game! I play a little tune, then you play it back.";
  var EGO="Your turn! Play it back.", EOOPS="Oops! Listen again.", EYES="You got it! Here comes a longer one.";
  var ESTAR="Wow, eight notes! You're an echo star!";
  BWK.lines({"pn-hi":HI});
  BWK.init({here:"moonlets", voice:"finn", intro:HI, noHello:true});
  var $=function(id){return document.getElementById(id);};

  /* ---------- Finn's face (the same drawing as the kit's speech bubble) ---------- */
  function face(id){ return '<svg class="k-fm" viewBox="0 0 100 100" aria-hidden="true"><defs>'+
    '<radialGradient id="'+id+'g" cx="30%" cy="35%" r="75%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#f6e6bd"/><stop offset="1" stop-color="#dcc188"/></radialGradient>'+
    '<mask id="'+id+'m"><rect width="100" height="100" fill="#fff"/><circle cx="71" cy="37" r="31" fill="#000"/></mask></defs>'+
    '<circle cx="48" cy="54" r="38" fill="url(#'+id+'g)" mask="url(#'+id+'m)"/>'+
    '<ellipse cx="25" cy="58" rx="3.2" ry="4.2" fill="#3b2a12"/><ellipse cx="40" cy="67" rx="3.2" ry="4.2" fill="#3b2a12"/>'+
    '<circle cx="24.2" cy="56.6" r="1.1" fill="#fff"/><circle cx="39.2" cy="65.6" r="1.1" fill="#fff"/>'+
    '<ellipse cx="20" cy="68" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/><ellipse cx="44" cy="78" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/>'+
    '<path d="M27 72 q5 7 11 3" stroke="#3b2a12" stroke-width="2.6" fill="#a5523a" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<g><path d="M68 50l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#fff3c4"/><path d="M80 40l1.1 2.7 2.7 1.1-2.7 1.1-1.1 2.7-1.1-2.7-2.7-1.1 2.7-1.1z" fill="#ffe7a0"/>'+
    '<circle cx="75" cy="58" r="1.6" fill="#fff"/><circle cx="62" cy="44" r="1.2" fill="#ffeab0"/></g></svg>'; }
  var top=$("finnHere");
  // before the first tap Finn's bubble just shows her words (sound can't start until a tap)
  top.innerHTML='<div class="k-finn k-finn-in">'+face("pnS")+'<p class="k-fb">'+HI+'</p></div>';
  var talked=false;
  function say(t,clip){ talked=true; BWK.finn(t,{into:top, clip:clip}); }
  top.addEventListener("click",function(e){ if(e.target.closest(".k-fm") && !talked) say(HI,"pn-hi"); });
  document.addEventListener("click",function(e){
    if(talked || e.target.closest(".keys,.song,.cb,.k-head,.k-sheet,.k-veil")) return; say(HI,"pn-hi"); });
  ["bg-on","bg-off","pn-echo","pn-echo-go","pn-echo-oops","pn-echo-yes"].forEach(BWK.preload);

  /* ---------- the keys ---------- */
  var WH=[["C",261.63,"#ff7a7a","#c93c4a"],["D",293.66,"#ffad5c","#c9701f"],["E",329.63,"#ffd84d","#c79a12"],["F",349.23,"#7ee08a","#2f9a4a"],
          ["G",392.00,"#5fd6c8","#1f8f86"],["A",440.00,"#7cc4ff","#2f6fc4"],["B",493.88,"#b79bff","#6a48c8"],["c",523.25,"#ff8fc8","#c4447f"]];
  var BL=[["C#",277.18,1],["D#",311.13,2],["F#",369.99,4],["G#",415.30,5],["A#",466.16,6]];
  var KB={a:"C",w:"C#",s:"D",e:"D#",d:"E",f:"F",t:"F#",g:"G",y:"G#",h:"A",u:"A#",j:"B",k:"c"};
  var keysEl=$("keys"), K={}, FREQ={};
  WH.forEach(function(w){ var b=document.createElement("button"); b.className="key w"; b.dataset.k=w[0];
    b.setAttribute("aria-label",(w[0]==="c"?"high C":w[0])); b.style.setProperty("--c",w[2]); b.style.setProperty("--cd",w[3]);
    b.innerHTML='<i class="dot"></i><span class="lt">'+w[0].toUpperCase()+'</span>'; keysEl.appendChild(b); K[w[0]]=b; FREQ[w[0]]=w[1]; });
  BL.forEach(function(x){ var b=document.createElement("button"); b.className="key b"; b.dataset.k=x[0]; b.setAttribute("aria-label",x[0].replace("#"," sharp"));
    b.style.left=(x[2]/8*100)+"%"; b.style.setProperty("--c","#c9b2ff"); keysEl.appendChild(b); K[x[0]]=b; FREQ[x[0]]=x[1]; });

  /* ---------- the sound: a soft toy-piano tone with a little moon bell, made in the browser ---------- */
  var AC=null, OUT=null;
  function ac(){
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C();
      var comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=4;
      OUT=AC.createGain(); OUT.gain.value=.9; OUT.connect(comp); comp.connect(AC.destination); }
    if(AC.state==="suspended") AC.resume(); return AC; }
  document.addEventListener("pointerdown",ac,{capture:true,passive:true});
  function note(f,vel){
    if(!BWK.store.get("sound",true)) return; var c=ac(); if(!c) return; vel=vel||1;
    var t=c.currentTime+.004, g=c.createGain(), lp=c.createBiquadFilter();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.3*vel,t+.006);
    g.gain.exponentialRampToValueAtTime(.11*vel,t+.28); g.gain.exponentialRampToValueAtTime(.0006,t+2.1);
    lp.type="lowpass"; lp.Q.value=.5; lp.frequency.setValueAtTime(Math.min(9000,f*10),t); lp.frequency.exponentialRampToValueAtTime(Math.max(700,f*2.6),t+1.1);
    lp.connect(g); g.connect(OUT);
    [[1,.5,"triangle",0],[1,.32,"sine",4],[2,.16,"sine",-3],[3,.06,"sine",0],[4,.03,"sine",0]].forEach(function(p){
      var o=c.createOscillator(), og=c.createGain(); o.type=p[2]; o.frequency.value=f*p[0]; o.detune.value=p[3];
      og.gain.setValueAtTime(p[1],t); if(p[0]>=3) og.gain.exponentialRampToValueAtTime(.0004,t+.5);
      o.connect(og); og.connect(lp); o.start(t); o.stop(t+2.2); });
    var b=c.createOscillator(), bg=c.createGain(); b.type="sine"; b.frequency.value=f*4;
    bg.gain.setValueAtTime(.022*vel,t); bg.gain.exponentialRampToValueAtTime(.0003,t+.8); b.connect(bg); bg.connect(OUT); b.start(t); b.stop(t+.9);
  }

  /* ---------- Finn on the keys ---------- */
  var piano=$("piano"), hop=$("hop"), pos=null, hopAt=null;
  hop.innerHTML=face("pnH")+'<i class="sh"></i>';
  function hw(){ var w=K.C.getBoundingClientRect().width; return Math.round(Math.max(46,Math.min(92,w*1.18))); }
  function spot(k){
    var p=piano.getBoundingClientRect(), s=hw();
    if(!k){ return {x:p.width-s-18, y:-s*.52}; }
    var r=K[k].getBoundingClientRect(), black=K[k].classList.contains("b");
    return {x:r.left-p.left+r.width/2-s/2, y:r.top-p.top+r.height*(black?.4:.64)-s/2}; }
  function place(k){ hopAt=k; hop.style.setProperty("--hw",hw()+"px"); pos=spot(k); hop.style.transform="translate("+pos.x+"px,"+pos.y+"px)"; }
  function hopTo(k,ms){
    hop.classList.remove("idle"); var a=pos||spot(hopAt), b=spot(k); hopAt=k; pos=b;
    var up=Math.min(a.y,b.y)-Math.max(26,Math.abs(b.x-a.x)*.25), tr=function(x,y){return "translate("+x+"px,"+y+"px)";};
    hop.style.transform=tr(b.x,b.y);
    if(hop.animate) hop.animate([{transform:tr(a.x,a.y)},{transform:tr((a.x+b.x)/2,up)},{transform:tr(b.x,b.y)}],{duration:ms||300,easing:"ease-in-out"});
    setTimeout(function(){ hop.classList.remove("land"); void hop.offsetWidth; hop.classList.add("land"); },(ms||300)-30);
  }
  function wiggle(){ hop.classList.remove("wig"); void hop.offsetWidth; hop.classList.add("wig"); }
  function sparkle(k){ var r=K[k].getBoundingClientRect(), p=piano.getBoundingClientRect();
    for(var i=0;i<2;i++){ var s=document.createElement("i"); s.className="spk"; s.textContent=i?"✦":"★";
      s.style.left=(r.left-p.left+r.width/2+(i?10:-8))+"px"; s.style.top=(r.top-p.top+r.height*.3)+"px";
      s.style.setProperty("--c",getComputedStyle(K[k]).getPropertyValue("--c")||"#ffe08a"); s.style.setProperty("--dx",(i?16:-14)+"px");
      s.addEventListener("animationend",function(){ this.remove(); }); piano.appendChild(s); } }

  /* ---------- playing ---------- */
  var mode="free", song=null, idx=0, demo=0, played=BWK.store.get("piano",{songs:{}}), help=0;
  played.songs=played.songs||{}; played.bigs=played.bigs||{}; played.echo=played.echo||{lv:1,best:0};
  var big=BWK.big();
  function down(k){ var b=K[k]; b.classList.add("down"); note(FREQ[k]); sparkle(k); }
  function up(k){ K[k].classList.remove("down"); }
  function press(k){
    down(k);
    if(mode==="free"){ hopTo(k,240); return; }
    if(mode==="echo"){ echoPress(k); return; }
    if(mode!=="song") return;
    if(k!==song.notes[idx].k){ wiggle(); return; }
    K[k].classList.remove("next"); idx++; prog();
    if(idx>=song.notes.length){ finish(); return; }
    var nk=song.notes[idx].k;
    if(big){ mark(null); if(hopAt) hopTo(null,300); helpLater(); return; }
    setTimeout(function(){ if(mode==="song"&&song.notes[idx]&&song.notes[idx].k===nk){ hopTo(nk,280); mark(nk); } },140);
  }
  // Big Moonlet songs: no glow; after a few seconds with no right note, Finn hops onto the key
  function helpLater(){ clearTimeout(help); var me=demo, at=idx;
    help=setTimeout(function(){ if(me===demo && mode==="song" && idx===at && song.notes[idx]){ hopTo(song.notes[idx].k,300); mark(song.notes[idx].k); } },4000); }
  function mark(k){ [].forEach.call(keysEl.querySelectorAll(".next"),function(x){x.classList.remove("next");}); if(k) K[k].classList.add("next"); }
  function prog(){ $("progF").style.width=(song?idx/song.notes.length*100:0)+"%"; }

  var held={};
  keysEl.addEventListener("pointerdown",function(e){ var b=e.target.closest(".key"); if(!b) return; e.preventDefault();
    try{ keysEl.setPointerCapture(e.pointerId); }catch(_){} held[e.pointerId]=b.dataset.k; press(b.dataset.k); });
  keysEl.addEventListener("pointermove",function(e){ var was=held[e.pointerId]; if(!was) return;
    var el=document.elementFromPoint(e.clientX,e.clientY), b=el&&el.closest&&el.closest(".key");
    if(b && b.dataset.k!==was){ up(was); held[e.pointerId]=b.dataset.k; press(b.dataset.k); } });
  function lift(e){ var k=held[e.pointerId]; if(k){ up(k); delete held[e.pointerId]; } }
  keysEl.addEventListener("pointerup",lift); keysEl.addEventListener("pointercancel",lift); keysEl.addEventListener("lostpointercapture",lift);
  keysEl.addEventListener("contextmenu",function(e){ e.preventDefault(); });
  var kd={};
  document.addEventListener("keydown",function(e){ if(e.metaKey||e.ctrlKey||e.altKey||e.repeat) return; var k=KB[e.key&&e.key.toLowerCase()]; if(!k||kd[k]) return;
    if(document.querySelector(".k-veil.on")) return; kd[k]=1; e.preventDefault(); ac(); press(k); });
  document.addEventListener("keyup",function(e){ var k=KB[e.key&&e.key.toLowerCase()]; if(k&&kd[k]){ delete kd[k]; up(k); } });

  /* ---------- songs ---------- */
  var SONGS=[
    {id:"twinkle",em:"⭐",name:"Twinkle",say:"Twinkle, Twinkle, Little Star!",bpm:112,n:"C C G G A A G2 F F E E D D C2 G G F F E E D2 G G F F E E D2 C C G G A A G2 F F E E D D C2"},
    {id:"lamb",em:"🐑",name:"Little Lamb",say:"Mary Had a Little Lamb!",bpm:116,n:"E D C D E E E2 D D D2 E G G2 E D C D E E E E D D E D C2"},
    {id:"buns",em:"🥐",name:"Hot Cross Buns",say:"Hot Cross Buns!",bpm:104,n:"E D C2 E D C2 C.5 C.5 C.5 C.5 D.5 D.5 D.5 D.5 E D C2"},
    {id:"boat",em:"🚣",name:"Row Your Boat",say:"Row, Row, Row Your Boat!",bpm:230,n:"C3 C3 C2 D1 E3 E2 D1 E2 F1 G6 c1 c1 c1 G1 G1 G1 E1 E1 E1 C1 C1 C1 G2 F1 E2 D1 C6"},
    {id:"bridge",em:"🌉",name:"London Bridge",say:"London Bridge!",bpm:116,n:"G1.5 A.5 G F E F G2 D E F2 E F G2 G1.5 A.5 G F E F G2 D2 G2 E C2"}];
  SONGS.forEach(function(s){ s.notes=s.n.split(" ").map(function(t){ var m=/^([A-Gc]#?)([\d.]*)$/.exec(t); return {k:m[1],d:m[2]?parseFloat(m[2]):1}; }); });
  var songsEl=$("songs");
  function chip(id,em,name){ var b=document.createElement("button"); b.className="song"; b.dataset.id=id;
    b.innerHTML='<em aria-hidden="true">'+em+'</em><span>'+name+'</span>'+(played.songs[id]?'<i class="got" aria-hidden="true">★</i>':''); songsEl.appendChild(b); return b; }
  function chips(){ songsEl.innerHTML=""; chip("free","🎹","Free play").classList.add("on");
    if(big) chip("echo","🔁","Echo game");
    SONGS.forEach(function(s){ var c=chip(s.id,s.em,s.name); if(played.bigs[s.id]) c.insertAdjacentHTML("beforeend",'<i class="moon" aria-hidden="true">☾</i>'); });
    var b=document.createElement("button"); b.className="song bigc"; b.dataset.id="big"; b.setAttribute("aria-pressed",big);
    b.innerHTML='<i class="sw" aria-hidden="true"></i><span>Big Moonlet</span>'; songsEl.appendChild(b); }
  chips();
  songsEl.addEventListener("click",function(e){ var b=e.target.closest(".song"); if(!b) return; BWK.sfx("tap");
    if(b.dataset.id==="big"){ big=!big; talked=true; BWK.setBig(big,top); chips(); free(); return; }
    [].forEach.call(songsEl.children,function(x){ if(x.dataset.id!=="big") x.classList.toggle("on",x===b);});
    if(b.dataset.id==="free"){ free(); say(FREE,"pn-free"); return; }
    if(b.dataset.id==="echo"){ echoStart(); return; }
    var s=SONGS.filter(function(x){return x.id===b.dataset.id;})[0]; start(s,false); say(s.say,"pn-"+s.id);
    // the first song of the visit: after its name, Finn explains how to follow her (Big Moonlet: how she helps)
    var tk=big?"b":"l"; if(!taught[tk]){ taught[tk]=true; var me=demo; setTimeout(function(){ if(me===demo && mode==="song" && idx===0) say(big?BIGSONG:SONGLN,big?"pn-bigsong":"pn-song"); },3400); } });
  var taught={};
  function ctlOn(on,echo){ $("ctl").classList.toggle("off",!on); $("ctl").classList.toggle("echo",!!echo); $("bListen").disabled=!on; $("bAgain").disabled=!on;
    $("bAgain").setAttribute("aria-label",echo?"A new tune":"Start the song again"); }
  function free(){ demo++; clearTimeout(help); mode="free"; song=null; mark(null); ctlOn(false); prog(); hopTo(null,380); setTimeout(function(){ if(mode==="free") hop.classList.add("idle"); },420); }
  function start(s,talk){ demo++; clearTimeout(help); song=s; idx=0; mode="song"; ctlOn(true); prog();
    if(big){ mark(null); hopTo(null,380); helpLater(); return; }
    hopTo(s.notes[0].k,380); mark(s.notes[0].k); if(talk) say(SONGLN,"pn-song"); }
  function finish(){ mode="done"; mark(null); clearTimeout(help);
    var bag=big?played.bigs:played.songs; bag[song.id]=(bag[song.id]||0)+1; BWK.store.set("piano",played);
    var c=songsEl.querySelector('[data-id="'+song.id+'"]'), mk=big?"moon":"got";
    if(c && !c.querySelector("."+mk)) c.insertAdjacentHTML("beforeend",big?'<i class="moon" aria-hidden="true">☾</i>':'<i class="got" aria-hidden="true">★</i>');
    setTimeout(function(){ ["C","E","G","c"].forEach(function(k,i){ setTimeout(function(){ note(FREQ[k],.7); sparkle(k); },i*90); });
      WH.forEach(function(w,i){ setTimeout(function(){ sparkle(w[0]); },300+i*60); }); },250);
    hopTo("c",420); setTimeout(function(){ if(big) say(BIGYAY,"pn-bigyay"); else say(YAY,"pn-yay"); },900);
    var me=demo; setTimeout(function(){ if(me===demo && mode==="done") start(song,false); },5200);
  }
  $("bAgain").onclick=function(){ if(!song) return; BWK.sfx("tap"); if(song.id==="echo"){ newTune(); listen(song,1200); } else start(song,false); };
  $("bListen").onclick=function(){ if(!song) return; say(WATCH,"pn-watch"); listen(song,1900); };
  function listen(s,t){ var me=++demo; clearTimeout(help); mode="demo"; idx=0; prog(); mark(null);
    hopTo(s.notes[0].k,360);
    var beat=60000/s.bpm;
    s.notes.forEach(function(n,i){ var at=t, d=n.d*beat;
      setTimeout(function(){ if(me!==demo) return; if(i>0) hopTo(n.k,Math.min(300,Math.max(150,d*.6))); },Math.max(0,at-Math.min(300,Math.max(150,d*.6))));
      setTimeout(function(){ if(me!==demo) return; down(n.k); idx=i+1; prog(); setTimeout(function(){ up(n.k); },Math.min(260,d*.7)); },at);
      t+=d; });
    setTimeout(function(){ if(me!==demo) return; if(s.id==="echo") echoGo(); else start(s,false); },t+900);
  }

  /* ---------- the Echo game (Big Moonlet): Finn plays, you play it back from memory ---------- */
  var EKEYS=[["C","D","E"],["C","D","E"],["C","D","E","F","G"],["C","D","E","F","G"],null,null];
  function lvDots(){ var h=""; for(var i=1;i<=6;i++) h+='<i class="'+(i<=played.echo.lv?"on":"")+'"></i>'; $("lvl").innerHTML=h; }
  function newTune(){ var lv=played.echo.lv, ks=EKEYS[lv-1]||WH.map(function(w){return w[0];}), n=Math.min(8,lv+2), t=[], j=Math.floor(Math.random()*ks.length);
    for(var i=0;i<n;i++){ if(i){ var step=Math.floor(Math.random()*5)-2; if(!step) step=Math.random()<.5?-1:1;  // small steps, sounds like a tune
        j=Math.max(0,Math.min(ks.length-1,j+step)); if(t.length>=2 && t[i-1]===ks[j] && t[i-2]===ks[j]) j=(j+1)%ks.length; }
      t.push(ks[j]); }
    song={id:"echo", bpm:lv<=2?92:lv<=4?104:112, notes:t.map(function(k){return {k:k,d:1};})}; }
  function echoStart(){ demo++; newTune(); ctlOn(true,true); lvDots(); say(ECHO,"pn-echo"); listen(song,4300); }
  function echoGo(){ mode="echo"; idx=0; prog(); hopTo(null,360); say(EGO,"pn-echo-go"); }
  function echoPress(k){
    if(k!==song.notes[idx].k){ wiggle(); mode="demo"; idx=0; prog(); var me=++demo; say(EOOPS,"pn-echo-oops");
      setTimeout(function(){ if(me===demo) listen(song,600); },1700); return; }
    idx++; prog(); if(idx<song.notes.length) return;
    mode="done"; var me=++demo, lv=played.echo.lv, n=song.notes.length;
    played.echo.best=Math.max(played.echo.best||0,n); if(lv<6) played.echo.lv=lv+1; BWK.store.set("piano",played);
    setTimeout(function(){ ["C","E","G","c"].forEach(function(k,i){ setTimeout(function(){ note(FREQ[k],.7); sparkle(k); },i*90); }); },250);
    hopTo("c",420); setTimeout(function(){ lvDots(); if(n>=8) say(ESTAR,"pn-echo-star"); else say(EYES,"pn-echo-yes"); },900);
    setTimeout(function(){ if(me===demo){ newTune(); listen(song,600); } },n>=8?5200:4200);
  }

  // Finn starts up on the lid, bobbing; keep her on her key when the screen changes size
  requestAnimationFrame(function(){ place(null); });
  window.addEventListener("resize",function(){ place(hopAt); });
  window.PNO={press:press,start:function(id){ start(SONGS.filter(function(s){return s.id===id;})[0],false); },echo:function(){ echoStart(); },
    big:function(on){ big=!!on; BWK.setBig(big); chips(); free(); },
    state:function(){ return {mode:mode,idx:idx,at:hopAt,big:big,tune:song&&song.id==="echo"?song.notes.map(function(n){return n.k;}).join(" "):"",lv:played.echo.lv}; }};
})();
</script>
</body>
