  var pi=-1, li=-1; room.forEach(function(f,i){ if(f>=need&&pi<0) pi=i; }); for(var i=room.length-1;i>=0;i--){ if(room[i]>=L.bw*.82+8&&(i!==pi||room[i]>=need)){ li=i; break; } }

/* ---------- where to get a book: Bookshop.org (affiliate, once Judy has her ID), and a word about the library (Judy, Nov 23: no WorldCat button) ---------- */
var BC_AFF="131948";   /* Judy's Bookshop.org affiliate ID (Nov 24). Each pick links to bookshop.org/a/<ID>/<isbn> (isbn in bookclub-shelf.js, each checked on Bookshop.org); a pick without one falls back to a Bookshop.org search. The disclosure line shows itself while this is set */
function q(b){ return encodeURIComponent(b.t+" "+b.by); }
function buyURL(b){ return (BC_AFF&&b.isbn) ? "https://bookshop.org/a/"+BC_AFF+"/"+b.isbn : "https://bookshop.org/search?keywords="+q(b); }
/* ---------- the staff-pick card ---------- */
var cur=-1, NAV=null, FROM="";   /* NAV: the books Previous/Next walk through; FROM: the My Books tab the card was opened from */
var MW={w:"Want to Read",n:"Reading Now",r:"Read"};
function undoTxt(m){ return m?"It\u2019s in My Books under "+MW[m]+". Tap it again to undo.":"Save it for later, mark it while you\u2019re reading, or once you\u2019ve read it."; }
function open(id,nav,from){
  NAV=nav||BOOKS; FROM=from||"";
  cur=NAV.map(function(b){ return b.id; }).indexOf(id); if(cur<0) return;
  var b=NAV[cur], m=mark(b.id);
  veil.innerHTML='<div class="bc-card"><div class="bc-cin">'+
    '<div class="bc-top">'+cover(b,"").replace('<button type="button"','<div aria-hidden="true"').replace(/<\/button>$/,"</div>")+
    '<div><div class="bc-sh">'+b.sh.map(function(s){ return '<span>'+esc(SH[s])+'</span>'; }).join("")+'</div>'+
    '<h2>'+esc(b.t)+'</h2><p class="bc-by">'+esc(b.by)+' · '+b.yr+'</p></div></div>'+
    '<p class="bc-blurb">'+esc(b.blurb)+'</p>'+
    '<div class="bc-why"><b>Why We Picked It</b>'+esc(b.why)+'</div>'+
    '<div class="bc-marks"><button type="button" class="bc-btn wt" data-m="w" aria-pressed="'+(m==="w")+'"><i class="bc-rb w"></i>Want to Read</button>'+
    '<button type="button" class="bc-btn nw" data-m="n" aria-pressed="'+(m==="n")+'"><i class="bc-rb n"></i>Reading Now</button>'+
    '<button type="button" class="bc-btn r" data-m="r" aria-pressed="'+(m==="r")+'"><i class="bc-sl">'+SEAL+'</i>I\u2019ve Read It</button></div>'+
    '<p class="bc-undo">'+undoTxt(m)+'</p>'+
    '<div class="bc-find"><b>Find This Book</b><div class="bc-fb">'+
      '<a class="bc-btn" href="'+buyURL(b)+'" target="_blank" rel="noopener sponsored">Buy It at Bookshop.org</a>'+
      '</div>'+
      '<p class="bc-disc">Bookshop.org ships the book to your door and supports independent bookstores. Or borrow it free from your local library: many lend e-books and audiobooks too.'+(BC_AFF?' BrainWhim is a Bookshop.org affiliate: we earn a small commission when you buy through this link, at no extra cost to you.':'')+'</p></div>'+
    '<div class="bc-talk"><b>Talk About It</b>Comments open soon: you’ll be able to share what you thought of this book with other readers, right here.</div>'+
    '</div><div class="bc-foot"><button type="button" class="bc-btn gh" data-a="prev" aria-label="Previous book">\u2190 Previous</button>'+
    '<button type="button" class="bc-btn" data-a="close" style="flex:1">'+(FROM?'<span class="lg">Back to </span>My Books':"Back to the Shelf")+'</button>'+
    '<button type="button" class="bc-btn gh" data-a="next" aria-label="Next book">Next \u2192</button></div></div>';
  /* the mini cover is a div: give it the book look */
  var mini=veil.querySelector(".bc-top > div.bc-book"); if(mini) mini.setAttribute("role","img");
  [].forEach.call(veil.querySelectorAll("[data-m]"),function(x){ x.onclick=function(){
    var k=x.getAttribute("data-m"), on=mark(b.id)!==k, m2=on?k:"";
    setMark(b.id,m2); snd(on?"bc-mark":"bc-unmark");
    [].forEach.call(veil.querySelectorAll("[data-m]"),function(y){ y.setAttribute("aria-pressed",String(m2===y.getAttribute("data-m"))); });
    var u=veil.querySelector(".bc-undo"); if(u) u.textContent=undoTxt(m2);
    if(window.Parlor&&Parlor.toast) Parlor.toast(on?{w:"Saved to Want to Read.",n:"Moved to Reading Now.",r:"Marked as read."}[k]:{w:"Removed from Want to Read.",n:"Removed from Reading Now.",r:"No longer marked as read."}[k]);
    render(); }; });
  veil.querySelector('[data-a="prev"]').onclick=function(){ snd("bc-pull"); open(NAV[(cur-1+NAV.length)%NAV.length].id,NAV===BOOKS?null:NAV,FROM); };
  veil.querySelector('[data-a="next"]').onclick=function(){ snd("bc-pull"); open(NAV[(cur+1)%NAV.length].id,NAV===BOOKS?null:NAV,FROM); };
  veil.querySelector('[data-a="close"]').onclick=function(){ if(FROM){ snd("bc-pull"); mine(FROM); } else close(); };
  if(!veil.classList.contains("on")){ veil.classList.add("on"); snd("bc-pull"); }
}
var MINE_EMPTY={w:"Nothing saved yet. Open any book on the shelf and tap <b>Want to Read</b> to keep it here for later.",
  n:"Nothing on the go right now. When you start one of our picks, tap <b>Reading Now</b> on its card.",
  r:"No finished books yet. When you finish one, tap <b>I\u2019ve Read It</b> on its card, and it lands here."};
var MINE_DAY={w:"Saved",n:"Started",r:"Finished"}, MTH=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dayTxt(d){ if(!d) return ""; var a=d.split("-"); return MTH[+a[1]-1]+" "+(+a[2])+(a[0]!==todayKey.slice(0,4)?", "+a[0]:""); }
function mineList(t){ return ALL.filter(function(b){ return mark(b.id)===t; }).sort(function(a,b){ var x=markDay(a.id), y=markDay(b.id); return x<y?1:x>y?-1:0; }); }
var MINE_TAB="";
function mine(tab){
  var c=counts();
  tab=tab||MINE_TAB||(c.n?"n":c.w?"w":c.r?"r":"w"); MINE_TAB=tab; NAV=null; FROM="";
  var list=mineList(tab);
  function T(k,ic){ return '<button type="button" class="bc-tab" role="tab" data-t="'+k+'" aria-selected="'+(k===tab)+'"><span class="tn">'+ic+c[k]+'</span>'+MW[k]+'</button>'; }
  veil.innerHTML='<div class="bc-card"><div class="bc-cin">'+
    '<p class="bc-mk">The Book Club</p><h2>My Books</h2><p class="bc-by">Kept on this device. Tap a book to open it.</p>'+
    '<div class="bc-tabs" role="tablist">'+T("w",'<i class="bc-rb w"></i>')+T("n",'<i class="bc-rb n"></i>')+T("r",'<i class="bc-sl">'+SEAL+'</i>')+'</div>'+
    '<div class="bc-list" role="tabpanel">'+(list.length?list.map(function(b){
      var d=dayTxt(markDay(b.id));
      return '<button type="button" class="bc-li" data-id="'+b.id+'">'+cover(b,"").replace('<button type="button"','<span aria-hidden="true"').replace(/<\/button>$/,"</span>")+
        '<span class="tx"><span class="tt">'+esc(b.t)+'</span><span class="ta">'+esc(b.by)+'</span>'+(d?'<span class="td">'+MINE_DAY[tab]+' '+d+'</span>':"")+'</span><i class="ch" aria-hidden="true"></i></button>';
    }).join(""):'<p class="bc-empty">'+MINE_EMPTY[tab]+'</p>')+'</div>'+
    '</div><div class="bc-foot"><button type="button" class="bc-btn" data-a="close" style="flex:1">Back to the Shelf</button></div></div>';
  [].forEach.call(veil.querySelectorAll(".bc-tab"),function(x){ x.onclick=function(){ var k=x.getAttribute("data-t"); if(k===MINE_TAB) return; snd("bc-pull"); mine(k); }; });
  [].forEach.call(veil.querySelectorAll(".bc-li"),function(x){ x.onclick=function(){ snd("bc-pull"); open(x.getAttribute("data-id"),list,tab); }; });
  veil.querySelector('[data-a="close"]').onclick=close;
  if(!veil.classList.contains("on")){ veil.classList.add("on"); snd("bc-pull"); }
}
function close(){ if(!veil.classList.contains("on")) return; veil.classList.remove("on"); veil.innerHTML=""; snd("bc-set"); }
veil.addEventListener("click",function(e){ if(e.target===veil) close(); });
document.addEventListener("keydown",function(e){
  if(!veil.classList.contains("on")) return;
  if(e.key==="Escape"){ if(FROM&&veil.querySelector('[data-a="next"]')) mine(FROM); else close(); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ var nx=veil.querySelector('[data-a="next"]'); if(nx){ nx.click(); e.preventDefault(); } }
  else if(e.key==="ArrowLeft"){ var pv=veil.querySelector('[data-a="prev"]'); if(pv){ pv.click(); e.preventDefault(); } }
});

/* ---------- fitting the shelves to the screen ---------- */
function seatedNow(){ return document.body.classList.contains("seated"); }
function fit(){
  var wide=window.innerWidth>=1000, st2=document.querySelector(".pk-stage");
  var top=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185;
  var h=wide?window.innerHeight-top-20:window.innerHeight-(seatedNow()?top:56)-(64+12);
  h=Math.max(window.innerHeight<560?230:360,Math.min(1100,h));
  SCROLL.style.setProperty("--bc-h",Math.round(h)+"px");
}
var lastW=0;
window.addEventListener("resize",function(){ requestAnimationFrame(function(){ fit(); maybeRender(); }); });
var lastSeat=null;
function maybeRender(){ var st=seatedNow(), w=CASE.clientWidth; if(st!==lastSeat||w!==lastW){ lastSeat=st; lastW=w; render(); } }
new MutationObserver(function(){ setTimeout(function(){ fit(); maybeRender(); },30); setTimeout(fit,400); }).observe(document.body,{attributes:true,attributeFilter:["class"]});

Parlor.init({ scoreLabel:"About the Book Club", seatHead:"Your Armchair", setWord:"Shelf",
  game:"bookclub", cat:"learn", solo:true, free:true, title:"The Book Club", bg:"bc/room.jpg?v=1123a", home:"learn.html", stage:stage,
  soloLabel:"This Month’s Shelf", dealLabel:"This Month’s Shelf",
  tagline:"A Book for Every Shelf.", invite:"A bright bookshop café with a fresh pick on every shelf each month. Browse the shelves, read why we chose each book, and keep track of what you’ve read.",
  players:[{name:"You",color:"#5f8a65"}],
  setsLabel:"Shelves",
  sets:[
    {id:"oak",name:"White Oak",need:0,dots:["#e3c597","#9d7a4c"]},
    {id:"walnut",name:"Walnut",club:true,dots:["#6e4529","#33190b"]},
    {id:"ash",name:"Ebonized Ash",club:true,dots:["#2c2926","#6a645b"]}
  ],
  rules:{
    play:"<ol><li><b>Browse the shelves:</b> each month we choose one book for every shelf, from Fiction to Do It Yourself.</li><li><b>Tap a book</b> to read what it’s about and why we picked it. Use <b>Previous</b> and <b>Next</b> to walk along the shelves.</li><li><b>Want to Read</b>, <b>Reading Now</b> or <b>I’ve Read It</b> tucks a ribbon or a seal into the book, so you can see at a glance what’s next, what you’re reading and what you’ve read.</li><li><b>My Books:</b> tap the counts on the sign to see your three lists. Tap a book there to open it.</li></ol>",
    score:"<ul><li><b>A new shelf every month:</b> one pick for each of our 14 shelves. Past months stay on their shelves.</li><li><b>Your marks and My Books stay on this device.</b> Nobody else sees them.</li><li><b>Coming soon:</b> comments under every book, and then your own recommendations for the shelves.</li><li><b>The covers</b> are our own designs, made for the Book Club.</li></ul>"
  },
  onNew:function(){ close(); render(); SCROLL.scrollTop=0; }
});
document.addEventListener("DOMContentLoaded",function(){ render(); fit(); });
if(document.readyState!=="loading"){ render(); fit(); }
window.BCO={get:function(){ return {month:MONTH.id,books:BOOKS.length,all:ALL.length,counts:counts(),cur:cur,from:FROM}; },open:open,close:close,render:render,mark:setMark,mine:mine,list:mineList};   /* for testing */
})();
</script>
