/* ---------- Read It / Want to Read: on this device only ---------- */
function mark(id){ return store("bwBook:"+id)||""; }
function setMark(id,v){ store("bwBook:"+id,v||null); }
function counts(){ var r=0,w=0; BOOKS.forEach(function(b){ var m=mark(b.id); if(m.indexOf("r")>=0) r++; if(m.indexOf("w")>=0) w++; }); return {r:r,w:w}; }

/* ---------- sounds (the room's own: a book slid off the shelf, a ribbon tucked in, the book set back) ---------- */
(function(){
  if(!window.Parlor||!Parlor.defSfx) return;
  var D=Parlor.defSfx;
  D("bc-pull",function(h){ var d=h.out(.17), t=h.t;
    h.burst(d,t,.2,"bandpass",1500,.8,.12,.03,.16);
    h.burst(d,t+.06,.1,"highpass",4200,.7,.06,.02,.08);
    h.osc(d,t+.17,"sine",150,90,.12,.004,.12,["lowpass",420]); });
  D("bc-mark",function(h){ var d=h.out(.3), t=h.t;
    h.burst(d,t,.04,"highpass",3800,1,.07,.002,.03);
    h.bell(d,t+.03,1318.5,.05,.9); });
  D("bc-unmark",function(h){ var d=h.out(.14), t=h.t; h.burst(d,t,.05,"bandpass",2400,1.2,.07,.003,.04); });
  D("bc-set",function(h){ var d=h.out(.16), t=h.t;
    h.burst(d,t,.12,"bandpass",1200,.9,.08,.02,.09);
    h.osc(d,t+.08,"sine",130,80,.14,.004,.14,["lowpass",380]); });
})();
function snd(n){ if(window.Parlor&&Parlor.sfx) Parlor.sfx(n,{}); }

/* ---------- a cover of our own design ---------- */
function cover(b,extra){
  var m=mark(b.id), hf=.95+(hash(b.id)%10)/100, lw=Math.max.apply(null,b.t.split(/\s+/).map(function(x){ return x.length; })), tf=lw>7?Math.max(.72,7/lw):1;
  return '<button type="button" class="bc-book m-'+b.m+(extra||"")+'" data-id="'+b.id+'" style="--c:'+b.c+';--k:'+b.k+';--a:'+b.a+';--hf:'+hf.toFixed(2)+';--tf:'+tf.toFixed(2)+'" aria-label="'+esc(b.t+" by "+b.by)+'">'+
    (m.indexOf("r")>=0?'<i class="rib r"></i>':"")+(m.indexOf("w")>=0?'<i class="rib w"></i>':"")+
    '<span class="bc-cv"><i class="mo"></i><span class="t">'+esc(b.t)+'</span><span class="a">'+esc(b.by)+'</span></span></button>';
}

/* ---------- the room ---------- */
var stage=document.createElement("div"); stage.className="bc-pad";
stage.innerHTML='<div class="bc-scroll"><div class="bc-case"></div></div>';
var SCROLL=$(".bc-scroll",stage), CASE=$(".bc-case",stage);
var veil=document.createElement("div"); veil.className="bc-veil"; veil.setAttribute("role","dialog"); veil.setAttribute("aria-modal","true");
document.body.appendChild(veil);

function layout(){
  var w=CASE.clientWidth||Math.min(920,window.innerWidth)-16, bw, gap, cols;
  if(w>=820){ bw=118; gap=30; } else if(w>=600){ bw=108; gap=22; } else { gap=w<380?12:16; bw=Math.min(112,Math.floor((w-20-gap*2)/3)); }
  cols=Math.max(3,Math.floor((w-20+gap)/(bw+gap)));
  return {bw:bw,gap:gap,cols:cols};
}
function render(){
  var L=layout(), n=BOOKS.length, rows=Math.ceil(n/L.cols), base=Math.floor(n/rows), extra=n%rows, i=0, html="";
  CASE.style.setProperty("--bc-bw",L.bw+"px"); CASE.style.setProperty("--bc-gap",L.gap+"px");
  var c=counts();
  html+='<div class="bc-sign"><i class="sc s1"></i><i class="sc s2"></i><i class="sc s3"></i><i class="sc s4"></i>'+
    '<p class="bc-kick">The Book Club</p><h2 class="bc-title">'+esc(MONTH.name)+'</h2>'+
    '<p class="bc-sub">'+esc(MONTH.sub)+' · '+n+' Books, One for Every Shelf</p>'+
    '<div class="bc-count"><span><i class="bc-rb r"></i>Read <b>'+c.r+'</b></span><span><i class="bc-rb w"></i>Want to Read <b>'+c.w+'</b></span></div></div>';
  for(var r=0;r<rows;r++){
    var k=base+(r<extra?1:0), part=BOOKS.slice(i,i+k); i+=k;
    html+='<div class="bc-row"><div class="bc-books">'+part.map(function(b){ return cover(b); }).join("")+'</div><div class="bc-plank"></div>'+
      '<div class="bc-tags">'+part.map(function(b){ return '<span class="bc-tag">'+esc(SH[b.sh[0]])+'</span>'; }).join("")+'</div></div>';
  }
  CASE.innerHTML=html;
  if(seatedNow()&&window.Parlor&&Parlor.status) Parlor.status(MONTH.name, n+" Books \u00b7 Read "+c.r);
  words();
  [].forEach.call(CASE.querySelectorAll(".bc-book"),function(x){ x.onclick=function(){ open(x.getAttribute("data-id")); }; });
}

/* the kit says "New Game" in its menu and phone bar: here the menu says This Month's Shelf and the bar has no such button */
function words(){
  [].forEach.call(document.querySelectorAll("button"),function(x){ if(x.textContent!=="New Game") return;
    var br=x.closest(".pk-bar"); if(br){ x.remove(); br.classList.add("pk-bar-2"); } else x.textContent="This Month\u2019s Shelf"; });
}
/* ---------- the staff-pick card ---------- */
var cur=-1;
function open(id){
  cur=BOOKS.map(function(b){ return b.id; }).indexOf(id); if(cur<0) return;
  var b=BOOKS[cur], m=mark(b.id);
  veil.innerHTML='<div class="bc-card"><div class="bc-cin">'+
    '<div class="bc-top">'+cover(b,"").replace('<button type="button"','<div aria-hidden="true"').replace(/<\/button>$/,"</div>")+
    '<div><div class="bc-sh">'+b.sh.map(function(s){ return '<span>'+esc(SH[s])+'</span>'; }).join("")+'</div>'+
    '<h2>'+esc(b.t)+'</h2><p class="bc-by">'+esc(b.by)+' · '+b.yr+'</p></div></div>'+
    '<p class="bc-blurb">'+esc(b.blurb)+'</p>'+
    '<div class="bc-why"><b>Why We Picked It</b>'+esc(b.why)+'</div>'+
    '<div class="bc-marks"><button type="button" class="bc-btn r" data-m="r" aria-pressed="'+(m.indexOf("r")>=0)+'"><i class="bc-rb r"></i>Read It</button>'+
    '<button type="button" class="bc-btn wt" data-m="w" aria-pressed="'+(m.indexOf("w")>=0)+'"><i class="bc-rb w"></i>Want to Read</button></div>'+
    '<div class="bc-talk"><b>Talk About It</b>Comments open soon: you’ll be able to share what you thought of this book with other readers, right here.</div>'+
    '</div><div class="bc-foot"><button type="button" class="bc-btn gh" data-a="prev" aria-label="Previous book">\u2190 Previous</button>'+
    '<button type="button" class="bc-btn" data-a="close" style="flex:1">Back to the Shelf</button>'+
    '<button type="button" class="bc-btn gh" data-a="next" aria-label="Next book">Next \u2192</button></div></div>';
  /* the mini cover is a div: give it the book look */
  var mini=veil.querySelector(".bc-top > div.bc-book"); if(mini) mini.setAttribute("role","img");
  [].forEach.call(veil.querySelectorAll("[data-m]"),function(x){ x.onclick=function(){
    var k=x.getAttribute("data-m"), m2=mark(b.id), on=m2.indexOf(k)<0;
    if(on){ m2+=k; if(k==="r") m2=m2.replace("w",""); } else m2=m2.replace(k,"");
    setMark(b.id,m2); snd(on?"bc-mark":"bc-unmark");
    if(on&&window.Parlor&&Parlor.toast) Parlor.toast(k==="r"?"Marked as read.":"Added to your Want to Read.");
    render(); open(b.id); }; });
  veil.querySelector('[data-a="prev"]').onclick=function(){ snd("bc-pull"); open(BOOKS[(cur-1+BOOKS.length)%BOOKS.length].id); };
  veil.querySelector('[data-a="next"]').onclick=function(){ snd("bc-pull"); open(BOOKS[(cur+1)%BOOKS.length].id); };
  veil.querySelector('[data-a="close"]').onclick=close;
  if(!veil.classList.contains("on")){ veil.classList.add("on"); snd("bc-pull"); }
}
function close(){ if(!veil.classList.contains("on")) return; veil.classList.remove("on"); veil.innerHTML=""; snd("bc-set"); }
veil.addEventListener("click",function(e){ if(e.target===veil) close(); });
document.addEventListener("keydown",function(e){
  if(!veil.classList.contains("on")) return;
  if(e.key==="Escape"){ close(); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ veil.querySelector('[data-a="next"]').click(); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ veil.querySelector('[data-a="prev"]').click(); e.preventDefault(); }
});

/* ---------- fitting the shelves to the screen ---------- */
function seatedNow(){ return document.body.classList.contains("seated"); }
function fit(){
  var wide=window.innerWidth>=1000, st2=document.querySelector(".pk-stage");
  var top=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185;
  var h=wide?window.innerHeight-top-20:window.innerHeight-(seatedNow()?top:56)-(64+12);
  h=Math.max(window.innerHeight<560?230:360,Math.min(1100,h));
  SCROLL.style.setProperty("--bc-h",Math.round(h)+"px");
}
var lastW=0;
window.addEventListener("resize",function(){ requestAnimationFrame(function(){ fit(); if(CASE.clientWidth!==lastW){ lastW=CASE.clientWidth; render(); } }); });
new MutationObserver(function(){ setTimeout(function(){ fit(); render(); },30); setTimeout(fit,400); }).observe(document.body,{attributes:true,attributeFilter:["class"]});

Parlor.init({ scoreLabel:"About the Book Club", seatHead:"Your Armchair", setWord:"Shelf",
  game:"bookclub", cat:"learn", solo:true, free:true, title:"The Book Club", bg:"bc/room.jpg?v=1123a", home:"learn.html", stage:stage,
  soloLabel:"This Month’s Shelf", dealLabel:"This Month’s Shelf",
  tagline:"A Book for Every Shelf.", invite:"A bright bookshop café with a fresh pick on every shelf each month. Browse the shelves, read why we chose each book, and keep track of what you’ve read.",
  players:[{name:"You",color:"#5f8a65"}],
  setsLabel:"Shelves",
  sets:[
    {id:"oak",name:"White Oak",need:0,dots:["#e3c597","#9d7a4c"]},
    {id:"walnut",name:"Walnut",club:true,dots:["#6e4529","#33190b"]}
  ],
  rules:{
    play:"<ol><li><b>Browse the shelves:</b> each month we choose one book for every shelf, from Fiction to Do It Yourself.</li><li><b>Tap a book</b> to read what it’s about and why we picked it. Use <b>Previous</b> and <b>Next</b> to walk along the shelves.</li><li><b>Read It</b> or <b>Want to Read</b> tucks a ribbon into the book, so you can see at a glance what you’ve read and what’s next.</li></ol>",
    score:"<ul><li><b>A new shelf every month:</b> one pick for each of our 14 shelves. Past months stay on their shelves.</li><li><b>Your marks stay on this device.</b> Nobody else sees them.</li><li><b>Coming soon:</b> comments under every book, and then your own recommendations for the shelves.</li><li><b>The covers</b> are our own designs, made for the Book Club.</li></ul>"
  },
  onNew:function(){ close(); render(); SCROLL.scrollTop=0; }
});
document.addEventListener("DOMContentLoaded",function(){ render(); fit(); });
if(document.readyState!=="loading"){ render(); fit(); }
window.BCO={get:function(){ return {month:MONTH.id,books:BOOKS.length,counts:counts(),cur:cur}; },open:open,close:close,render:render,mark:setMark};   /* for testing */
})();
</script>
</body>
