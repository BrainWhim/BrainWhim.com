/* Sophie's Style Studio (The Outpost · The Workshop), Nov 13-14. Sophie's second game: an animal friend brings a style card for
   a big day (Beach Day, Royal Ball...). Pick a dress, color, pattern, extra and shoes on Sophie's dress form until the look
   matches every line on the card, then show it on the runway. 3 looks a day: pictures on Monday, words midweek, riddles,
   color mixes and "No pink" lines by the weekend. Bonus Look once today's are done; Free Style any time. */
:root{--bgx:83%;--bgy:83%}
#play{flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
.cbar{width:min(640px,100%);display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:16px;color:#2b2116;flex:none;
  background:linear-gradient(180deg,#f4ead3,#e6d6b2);box-shadow:0 4px 0 #b39c70,0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.cday{flex:1;text-align:center;line-height:1.15}
.cday b{display:block;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#c2418a}
.cday span{font-size:14px;font-weight:700;color:#5a4220}
.ib{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;min-height:38px;padding:0 13px;border-radius:12px;color:#3a2306;
  background:linear-gradient(180deg,#ffe7a6,#e9c46a);box-shadow:0 3px 0 #a97a1c}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #a97a1c}
.ib.gh{background:rgba(120,80,20,.1);box-shadow:none;color:#6b4a1a}
.ib:disabled{opacity:.4;cursor:default}
/* the style card */
.ticket{position:relative;width:min(560px,100%);flex:none;display:flex;align-items:flex-start;gap:10px;padding:8px 12px 8px 8px;border-radius:6px 6px 14px 14px;color:#4a3518;
  background:linear-gradient(180deg,#f4ead3,#e6d6b2);box-shadow:0 2px 0 #c7b088,0 10px 20px rgba(0,0,0,.4);transform:rotate(-.6deg)}
.ticket::before{content:"";position:absolute;left:50%;top:-8px;width:64px;height:18px;margin-left:-32px;transform:rotate(2deg);
  background:linear-gradient(180deg,rgba(255,250,235,.75),rgba(235,225,200,.6));box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ticket.new{animation:tin .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes tin{0%{transform:translateY(-30px) rotate(-4deg);opacity:0}100%{transform:rotate(-.6deg);opacity:1}}
.cust{flex:none;width:64px;text-align:center}
.cust .face{display:block;width:54px;height:54px;margin:0 auto;border-radius:50%;font-size:34px;line-height:54px;
  background:radial-gradient(circle at 35% 30%,#fff,#efe1c2 70%);box-shadow:inset 0 -3px 6px rgba(120,90,40,.25),0 2px 4px rgba(0,0,0,.2)}
.cust b{display:block;font-size:12.5px;line-height:1.1;margin-top:3px}
.items{flex:1;min-width:0}
.wants{appearance:none;border:0;background:none;padding:0;font:inherit;cursor:pointer;display:block;text-align:left;font-size:14px;font-weight:800;color:#b23a7e;margin:0 0 5px;line-height:1.15}
.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px}
.cl{appearance:none;border:0;background:rgba(255,255,255,.38);font:inherit;cursor:pointer;color:inherit;text-align:left;display:flex;align-items:center;gap:5px;min-height:30px;
  padding:3px 6px 3px 4px;border-radius:9px;font-size:12.5px;font-weight:700;line-height:1.12;box-shadow:inset 0 0 0 1px rgba(150,115,60,.18)}
.cl .ck{flex:none;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(140,105,55,.5);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:background .2s,box-shadow .2s}
.cl.ok .ck{background:#2fae7a;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.cl.ok .ck::after{content:"✓"}
.cl.no .ck{background:#e0475b;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.cl.no .ck::after{content:"✗"}
.cl.no{animation:shk .4s}
.cl.lit{box-shadow:inset 0 0 0 2px #f2be45,0 0 12px rgba(242,190,69,.8)}
.cl svg{flex:none;width:30px;height:28px;display:block}
.cl .tx{min-width:0}
.cl.neg .tx{color:#a3324a}
.cmsg{min-height:22px;max-width:640px;text-align:center;font-weight:700;font-size:16px;line-height:1.3;color:#ffe9b8;text-shadow:0 2px 6px rgba(0,0,0,.7);padding:0 6px;flex:none}
#stage{position:relative;flex:1 1 auto;width:100%;max-width:680px;min-height:0;user-select:none;-webkit-user-select:none}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.rwb{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);z-index:2;appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:17px;letter-spacing:.02em;
  padding:9px 22px;border-radius:999px;color:#4a1636;background:linear-gradient(180deg,#ffd6ec,#ff8cc6);box-shadow:0 4px 0 #b4417f,0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7);
  display:none;animation:rwg 1.6s ease-in-out infinite}
.rwb.on{display:block}
.rwb:active{transform:translateX(-50%) translateY(2px);box-shadow:0 2px 0 #b4417f}
@keyframes rwg{50%{box-shadow:0 4px 0 #b4417f,0 0 0 3px #ffe2f1,0 0 22px 6px rgba(255,140,198,.75)}}
.cface{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(2deg)}}
.bulb{animation:bulb 3.1s ease-in-out infinite}
@keyframes bulb{50%{opacity:.4}}
.flag{transform-box:fill-box;transform-origin:50% 0;animation:flag 4s ease-in-out infinite}
@keyframes flag{50%{transform:rotate(4deg)}}
/* the tray: tabs + choices on a wooden shelf */
.tray{position:relative;z-index:1;width:min(640px,100%);flex:none;border-radius:16px;padding:6px 8px 9px;
  background:repeating-linear-gradient(92deg,rgba(60,30,10,0) 0 37px,rgba(60,30,10,.14) 37px 39px,rgba(255,220,170,.05) 39px 61px,rgba(60,30,10,.08) 61px 62px),
    linear-gradient(180deg,#c48a52 0,#a46a37 50%,#7b4a22 100%);

.tabs{display:flex;justify-content:center;gap:4px;margin:0 0 6px}
.tab{appearance:none;border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:99px;color:rgba(255,240,215,.8);background:rgba(50,25,8,.32);min-height:26px}
.tab.done{color:#d8fff0;background:rgba(30,120,90,.6)}
.tab.on{color:#3a2306;background:linear-gradient(180deg,#ffe7a6,#e9c46a);box-shadow:0 2px 0 #8a5f12}
.tbox{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.ing{appearance:none;border:0;cursor:pointer;font:inherit;flex:1 1 0;min-width:0;max-width:86px;height:82px;padding:4px 2px 5px;border-radius:14px;

  background:linear-gradient(180deg,#f4ead3,#e6d6b2);box-shadow:0 3px 0 #8a6236,0 6px 10px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent;position:relative}
.ing svg{width:100%;height:52px;display:block;pointer-events:none}
.ing:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6236}
.ing.sel{box-shadow:0 3px 0 #8a6236,0 0 0 3px #ff8cc6 inset}
.ing.glow{animation:ingg .9s ease-in-out infinite}
@keyframes ingg{50%{box-shadow:0 3px 0 #8a6236,0 0 0 3px #ffd98a,0 0 18px 5px rgba(242,190,69,.85)}}
.tbox.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px 6px}
.tbox.cols .ing{max-width:none;height:38px;flex-direction:row;justify-content:flex-start;gap:6px;padding:0 6px;font-size:12.5px}
.tbox.cols .ing i{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 -3px 4px rgba(0,0,0,.22),inset 0 2px 3px rgba(255,255,255,.5),0 0 0 1px rgba(0,0,0,.25)}
@keyframes shk{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.stars{font-size:34px;letter-spacing:4px;color:#f2be45;text-shadow:0 2px 0 #8a5f12;margin:2px 0 4px}
.stars i{font-style:normal;color:rgba(255,255,255,.18);text-shadow:none}
.how .sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
@media (max-height:640px){.wants{font-size:13px;margin-bottom:3px}.cl{min-height:26px;font-size:11.5px;padding:2px 5px 2px 3px}.cl svg{width:24px;height:22px}.cust{width:54px}.cust .face{width:44px;height:44px;font-size:28px;line-height:44px}
  .cust b{font-size:11.5px}.ticket{padding:6px 10px 6px 6px}.ing{height:70px}.ing svg{height:42px}.tbox.cols .ing{height:32px}.cmsg{font-size:14px;min-height:19px}.ib{min-height:34px;font-size:14px}.tabs{margin-bottom:4px}.rwb{font-size:15px;padding:7px 18px}}
@media (min-height:900px) and (min-width:700px){.tray,.cbar{width:min(760px,100%)}.ticket{width:min(680px,100%);padding:10px 16px 10px 10px}.ing{height:100px;font-size:14px;max-width:120px}.ing svg{height:64px}
  .tab{font-size:13px;padding:5px 11px}.cday span{font-size:15px}.cust{width:84px}.cust .face{width:68px;height:68px;font-size:44px;line-height:68px}.cl{font-size:14px;min-height:36px}.cl svg{width:38px;height:34px}
  .wants{font-size:16px}.cmsg{font-size:18px}.tbox.cols .ing{height:46px;font-size:14px}.tbox.cols .ing i{width:30px;height:30px}.rwb{font-size:20px;padding:11px 28px}}

</style>
</head>

function tw(ms,f,done){ var g=gen, t0=performance.now(); (function step(now){ if(g!==gen) return; var u=Math.min(1,(now-t0)/ms); f(u); if(u<1) requestAnimationFrame(step); else if(done) done(); })(t0); }

  tw(380,function(u){ var e=1-Math.pow(1-u,2); c.setAttribute("r",(4+e*26).toFixed(1)); c.setAttribute("opacity",(.9*(1-u)).toFixed(2)); ray.setAttribute("opacity",(1-u).toFixed(2)); },function(){ c.remove(); ray.remove(); }); }
function sparkles(x,y,n){ for(var k=0;k<n;k++){ (function(k){ var a=k/n*6.28, s=el("path",{d:starPath(0,0,4),fill:k%2?"#fff4c2":"#ffc2e2"});
  tw(800,function(u){ var e=1-Math.pow(1-u,3); s.setAttribute("transform","translate("+(x+Math.cos(a)*80*e).toFixed(1)+" "+(y+Math.sin(a)*56*e-16*e).toFixed(1)+") scale("+(1.3-u*.9).toFixed(2)+")"); s.setAttribute("opacity",(1-u).toFixed(2)); },function(){ s.remove(); }); })(k); } }
function hearts(){ for(var k=0;k<6;k++){ (function(k){ var h=el("path",{d:heartPath(0,0,6),fill:k%2?"#ff5f9e":"#ff8fc4"}), x=342+(k-2.5)*9;
  setTimeout(function(){ tw(1300,function(u){ h.setAttribute("transform","translate("+(x+Math.sin(u*6+k)*6).toFixed(1)+" "+(185-u*110).toFixed(1)+") scale("+(.6+u*.5).toFixed(2)+")"); h.setAttribute("opacity",(1-u*u).toFixed(2)); },function(){ h.remove(); }); },k*120); })(k); } }
function done(){
  if(P.bonus){ var fresh=BWG.patch("sophie"); ST.n++; save(); finish(fresh,true); return; }
  if(P.i<2){ P.i++; ST.n++; save(); saveCur(); look(); return; }
  P.done=true; ST.n++; saveCur(); var fresh2=BWG.patch("sophie"); save(); finish(fresh2,false); }
function starsOf(h){ return h===0?3:h<=2?2:1; }
function finish(fresh,bonus){ sWin(); var g=gen, s=starsOf(P.help), names=P.looks.map(function(o){ return o.cust.short; });
  setTimeout(function(){ if(g!==gen) return;
    var box=BWK.sheet('<h2>'+(bonus?'Look done!':'All looks done!')+'</h2>'+BWG.patchLine(fresh)+'<div class="stars">'+"★★★".slice(0,s)+'<i>'+"★★★".slice(0,3-s)+'</i></div>'+
      '<p>'+(bonus?'You styled '+names[0]:'You styled '+names[0]+', '+names[1]+' and '+names[2])+(P.help?', with '+P.help+' hint'+(P.help>1?'s or tries':' or try'):', first try, no hints')+'.</p>'+
      '<p>'+(bonus?'Another friend needs a look!':'Come back tomorrow for new style cards.')+'</p>'+
      '<div class="k-row"><button class="k-btn" data-a="more">Bonus Look</button><button class="k-btn k-ghost" data-a="free">Free Style</button></div>'+
      '<div class="k-row"><button class="k-btn k-ghost" data-a="out">The Outpost</button></div>');
    box.querySelector('[data-a=more]').onclick=function(){ BWK.closeSheet(true); start("bonus"); };
    box.querySelector('[data-a=free]').onclick=function(){ BWK.closeSheet(true); start("free"); };
    box.querySelector('[data-a=out]').onclick=BWG.toOutpost;
    talk(fresh?SAY.winp:bonus?SAY.bdone:SAY.win);
  },700); }
$("#rwb").onclick=function(){ BWK.sfx("tap"); runway(); };

/* ---------- keys on a computer: 1-8 pick, Tab/arrows switch part, H hint, R runway ---------- */
document.addEventListener("keydown",function(e){ if(!document.body.classList.contains("m-play")||document.querySelector(".k-veil.on")||!S||busy) return;
  if(e.key>="1"&&e.key<="8"){ var b=document.querySelectorAll("#tbox .ing")[+e.key-1]; if(b) b.click(); }
  else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ var i=SLOTS.indexOf(S.tab)+(e.key==="ArrowRight"?1:-1); if(i>=0&&i<5){ sTab(); tab(SLOTS[i]); } }
  else if(e.key==="h"||e.key==="H") hint(); else if(e.key==="r"||e.key==="R") runway(); });

/* ---------- menu ---------- */
$("#ssEmb").innerHTML=formArt()+dressArt({dress:"gown",color:"pink",pattern:"sparkles"})+extraArt("tiara")+shoesArt("party");
function toMenu(){ gen++; busy=false; document.body.className="m-menu"; var t=today();
  var doneToday=ST.day===t.n&&ST.cur&&ST.cur.done;
  $("#bPlay").textContent=doneToday?"Today's Looks ✓":"Today's Looks";
  $("#bBonus").style.display=doneToday?"":"none"; $("#bPlay").classList.toggle("k-ghost",!!doneToday);
  $("#mfoot").textContent=(ST.n?("Looks styled: "+ST.n+". "):"")+DAYN[t.wd]+": "+FOOT[lvOf(t.wd)]; }
$("#bPlay").onclick=function(){ BWK.sfx("open"); start("day"); };
$("#bBonus").onclick=function(){ BWK.sfx("open"); start("bonus"); };
$("#bFree").onclick=function(){ BWK.sfx("open"); start("free"); };
$("#bHow").onclick=function(){
  BWK.sheet('<div class="how"><h2>How to Play</h2><p>'+INTRO+'</p><p>'+HOW+'</p>'+
   '<p><b>Reading the card:</b> early in the week it shows pictures. Later it uses words and riddles, like "Shoes for hot sand" (sandals!). A line that starts with <b>No</b> means anything but that. On Thursday to Sunday the card is only checked when you tap Runway.</p>'+
   '<p><b>Color mixing</b> works like in the Slime Lab: <span class="sw" style="background:#e0343f"></span> red + <span class="sw" style="background:#ffd23a"></span> yellow = orange, yellow + <span class="sw" style="background:#3477e0"></span> blue = green, red + blue = purple, red + white = pink.</p>'+
   '<p>Tap any line on the card to hear it. On a computer, press 1-8 to pick, the arrow keys to switch parts, H for a hint and R for the runway.</p></div>'); talk(HOW); };
$("#bBack").onclick=BWG.toOutpost;
$("#tMenu").onclick=function(){ BWK.sfx("tap"); toMenu(); };
$("#tHint").onclick=hint;

var INTRO="Sophie's Style Studio! Sophie designs outfits for her animal friends. Read each style card, then pick the dress, color, pattern, extra and shoes, and show the look on the runway.";
var HOW="Each friend brings a style card for a big day. Pick a dress, a color, a pattern, an extra and shoes, until every line on the card matches. Tap a line on the card to hear it. When every part is picked, tap Runway! Stuck? Tap Hint for Sophie's tip.";
var SAY={card:"Read the style card, then pick a dress!",ready:"Every part is picked! Check the card, then tap Runway.",ready2:"Looking good! Tap Runway to show it off.",
  almost:"Almost! Check the style card again.",hint:"Here's Sophie's tip!",allgood:"It all matches! Tap Runway!",free:"Free Style! Design anything you like, then show it on the runway.",
  win:"All looks done! Come back tomorrow for new style cards.",winp:"All done! You earned a new patch for your badge wall!",bdone:"Look done! Another friend needs a look!"};
var L={"ss-intro":INTRO,"ss-how":HOW};
for(var k in SAY) L["ss-"+k]=SAY[k];
WOW.forEach(function(w,i){ L["ss-wow-"+i]=w; });
CUST.forEach(function(c){ L["ss-c-"+c.id]=c.n+" needs a new look!"; });
THEMES.forEach(function(t){ L["ss-t-"+t.id]=themeLine(t); });
SLOTS.forEach(function(s){ W[s].forEach(function(it){ L["ss-i-"+s+"-"+it.id]=it.n; L["ss-r-"+s+"-"+it.id]=it.r; L["ss-x-"+s+"-"+it.id]=noText(s,it); if(it.m) L["ss-m-"+it.id]=it.m; }); });
BWK.lines(L);
toMenu();
BWK.init({here:"sophie", voice:"outpost", intro:INTRO, noHello:true});
window.SSO={start:start,hint:hint,runway:runway,looks:makeLooks,meets:meets,lines:L,W:W,THEMES:THEMES,
  pick:function(s,id){ if(S.tab!==s) tab(s); var b=document.querySelector('.ing[data-k="'+id+'"]'); if(b) b.click(); },
  solve:function(){ var o=O(); SLOTS.forEach(function(s){ var pos=o.clues.filter(function(c){ return c.s===s&&c.k!=="not"; })[0], nots=o.clues.filter(function(c){ return c.s===s&&c.k==="not"; }).map(function(c){ return c.v; });
    S.sel[s]=pos?pos.v:W[s].filter(function(it){ return nots.indexOf(it.id)<0; })[0].id; }); draw(); ticket(false); tab(S.tab); runwayBtn(); },
  state:function(){ return {P:P,S:S,busy:busy}; }};
})();
