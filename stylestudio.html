function hint(){ if(!S||busy||P.free) return; BWK.sfx("tap"); unglow();
  var o=O(), bad=-1; for(var j=0;j<o.rules.length;j++){ if(!o.rules[j].f(S.sel)){ bad=j; break; } }
  if(bad<0&&complete(S.sel)){ msg("It all fits the brief! Tap Runway!"); talk(SAY.allgood); return; }
  /* the closest outfit that meets the brief: keep as much of what's on the mannequin as we can */
  var R=rng((Math.random()*1e9)|0), best=null, bs=-1;
  for(var t=0;t<60;t++){ var f=findFit(o.rules,R,S.sel,400); if(!f) continue; var sc=0; for(var k in f) if(S.sel[k]&&S.sel[k].id===f[k].id) sc+=2+(S.sel[k].c===f[k].c?1:0); if(sc>bs){ bs=sc; best=f; } }
  best=best||o.fit; P.help++; saveCur();
  var order=["dress","top","bottom","shoes","layer"].concat(Object.keys(OPT)), want=null, k2;
  for(k2 in S.sel) if(!best[k2]){ want={rm:k2}; break; }
  if(!want) for(var i=0;i<order.length;i++){ var s=order[i]; if(best[s]&&(!S.sel[s]||S.sel[s].id!==best[s].id)){ want={s:s,id:best[s].id}; break; } }
  if(!want) for(var s2 in best){ if(S.sel[s2]&&BY[best[s2].id].w&&S.sel[s2].c!==best[s2].c){ want={s:s2,id:best[s2].id,c:best[s2].c}; break; } }
  if(bad>=0){ var row=document.querySelector('.cl[data-i="'+bad+'"]'); if(row) row.classList.add("lit"); }
  if(!want){ msg("Sophie's tip: check the lit line on the brief!"); talk(SAY.hint); return; }
  if(want.rm){ var p0=BY[S.sel[want.rm].id]; if(S.tab!==tabOf(want.rm)) tab(tabOf(want.rm)); glow(p0.id); msg("Sophie's tip: take off the "+p0.n.toLowerCase()+" (tap it again)."); talk(SAY.hint); return; }
  if(S.tab!==tabOf(want.s)) tab(tabOf(want.s));
  if(want.c){ S.cfor=want.s; colorBar(); glowCol(want.c); msg("Sophie's tip: try the glowing color!"); }
  else { glow(want.id); msg("Sophie's tip: try the glowing one!"); }
  talk(SAY.hint); }

  tw(800,function(u){ var e=1-Math.pow(1-u,3); s.setAttribute("transform","translate("+(x+Math.cos(a)*80*e).toFixed(1)+" "+(y+Math.sin(a)*56*e-16*e).toFixed(1)+") scale("+(1.3-u*.9).toFixed(2)+")"); s.setAttribute("opacity",(1-u).toFixed(2)); },function(){ s.remove(); }); })(k); } }

  setTimeout(function(){ tw(1300,function(u){ h.setAttribute("transform","translate("+(x+Math.sin(u*6+k)*6).toFixed(1)+" "+(185-u*110).toFixed(1)+") scale("+(.6+u*.5).toFixed(2)+")"); h.setAttribute("opacity",(1-u*u).toFixed(2)); },function(){ h.remove(); }); },k*120); })(k); } }
