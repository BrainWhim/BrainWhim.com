<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play · BrainWhim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --studio-bg: #0D1630; 
            --white: #ffffff;
            --silver-text: #CBD5E1;
            --brand-whim-sky: #6BA3C9;   
            --glow-berry: #B01E51;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--studio-bg);
            color: var(--silver-text);
            font-family: 'Montserrat', sans-serif;
            position: relative;
            overflow-x: hidden;
            padding-top: 110px;            
        }

        /* --- IMMERSIVE COSMIC STARFIELD BACKGROUND --- */
        .page-wrap {
            background-color: var(--studio-bg);
            background-image: 
                radial-gradient(1px 1px at 15px 25px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 60px 110px, rgba(255,255,255,0.4), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 110px 180px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 220px 40px, rgba(255,255,255,0.6), rgba(0,0,0,0));
            background-size: 450px 450px;
            position: relative;
            z-index: 5;
            min-height: calc(100vh - 110px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 24px;
        }

        /* --- MASTER UNIFIED NAV HEADER --- */
        header {
            background: linear-gradient(to top, rgba(13, 22, 48, 0.7) 0%, rgba(19, 32, 56, 0.95) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(107, 163, 201, 0.2);
            padding: 0 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 999999;
            box-sizing: border-box;
            height: 110px;
            box-shadow: 0 12px 45px rgba(0,0,0,0.45);
        }
        .header-left-group { display: flex; align-items: center; gap: 10px; }
        .header-brand-container { display: flex; align-items: center; text-decoration: none; color: inherit; }
        .header-logo-asset { width: 100px; height: 100px; object-fit: contain; margin-right: -8px; }
        .header-brand-text { font-size: 30px; display: flex; align-items: baseline; margin-left: -4px; }
        .brand-brain { font-family: 'Montserrat', sans-serif; font-weight: 600; color: #ffffff; letter-spacing: -0.6px; }
        .brand-whim { font-family: 'Pacifico', cursive; font-weight: 400; color: #7EB6D9; margin-left: -1px; }
        
        .header-navigation-menu { display: flex; gap: 42px; }
        .nav-link { font-family: 'Montserrat', sans-serif; color: var(--white); text-decoration: none; font-size: 16px; font-weight: 700; opacity: 0.85; transition: color 0.2s; }
        .nav-link:hover { opacity: 1; color: var(--brand-whim-sky); }

        .aurora-glow { position: absolute; width: 85vw; height: 85vw; max-width: 850px; max-height: 850px; border-radius: 50%; filter: blur(160px); pointer-events: none; z-index: 1; }
        .berry-light { background: radial-gradient(circle, var(--glow-berry) 0%, transparent 70%); top: 5%; left: 5%; opacity: 0.35; }
        .warm-light { background: radial-gradient(circle, #3B82F6 0%, transparent 70%); bottom: 5%; right: 5%; opacity: 0.25; }

        /* --- ORBIT PLATFORM --- */
        .orbit { position: relative; width: 72vw; height: 72vw; max-width: 420px; max-height: 420px; }    
        .orbit::before {
            content: ""; position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; transform: translate(-50%, -50%); border-radius: 50%;
            border: 2px dashed rgba(176, 30, 81, 0.2); box-shadow: 0 0 20px rgba(176, 30, 81, 0.05); pointer-events: none; z-index: 0;
        }                
        
        .center-orb, .sat-orb { border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; text-decoration: none; position: relative; z-index: 2; }
        .center-orb {
            width: 31vw; height: 31vw; max-width: 170px; max-height: 170px; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #111827;
            box-shadow: 0 20px 45px rgba(0,0,0,0.8), inset 0 0 35px var(--glow-berry);
            font-size: 20px; font-weight: 700; animation: coreBreathe 5.5s ease-in-out infinite;
        }
        .center-orb-label { font-family: 'Montserrat', sans-serif; font-weight: 700; letter-spacing: 0.5px; }

        .sat-wrap { position: absolute; top: 50%; left: 50%; width: 24vw; height: 24vw; max-width: 120px; max-height: 120px; margin: 0; z-index: 2; }
        .sat-orb {
            width: 100%; height: 100%; background: #111827;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 25px var(--glow-berry);
            font-size: 11px; font-weight: 600; line-height: 1.3; padding: 10px; transition: transform 0.2s ease;
        }
        .sat-orb:hover { transform: scale(1.08); }
        .orb-icon { font-size: 24px; margin-bottom: 4px; display: block; }

        .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-168px) rotate(0deg); }
        .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-168px) rotate(-120deg); }
        .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-168px) rotate(-240deg); }

        .orbit-ring { position: absolute; inset: 0; animation: orbitSpin 28s linear infinite; pointer-events: none; }
        .sat-orb { animation: orbitCounter 28s linear infinite; pointer-events: auto; }
        
        @keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes orbitCounter { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }            
        @keyframes coreBreathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.045); } }

        .back-link { margin-top: 35px; color: #7EB6D9; text-decoration: none; font-weight: 600; font-size: 14px; }
        .page-nav { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
        .page-nav a { font-size: 13px; color: #7EB6D9; text-decoration: none; font-weight: 600; }

        /* --- COMPLIANT FOOTER --- */
        .site-footer { width: 100%; padding: 28px 8% 40px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); background: var(--studio-bg); margin-top: auto; }
        .footer-brand { display: flex; align-items: center; }
        .footer-logo { width: 46px; height: 46px; object-fit: contain; margin-right: -6px; }
        .footer-brand-text { margin: 0; font-size: 20px; display: flex; align-items: center; transform: translateX(-6px); }
        .footer-year { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.45); margin-left: 8px; }                
        .footer-legal-links { display: flex; gap: 20px; }
        .site-footer a { font-size: 13px; color: #7EB6D9; text-decoration: none; }

        @media (max-width: 992px) {
            header { height: 88px !important; padding: 0 16px; }
            .header-navigation-menu { display: none; }
            .header-logo-asset { width: 58px !important; height: 58px !important; }
            .header-brand-text { font-size: 22px !important; margin-left: -8px !important; }
            body { padding-top: 88px; }
            .orbit { width: 72vw; height: 72vw; max-width: 420px; max-height: 420px; }
            .center-orb { width: 38vw; height: 38vw; max-width: 150px; max-height: 150px; font-size: 18px; }
            .sat-orb, .sat-wrap { width: 26vw; height: 26vw; max-width: 96px; max-height: 96px; }
            .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-118px) rotate(0deg); }
            .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-118px) rotate(-120deg); }
            .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-118px) rotate(-240deg); }
            .site-footer { flex-direction: column; gap: 20px; text-align: center; }
            .footer-legal-links { flex-direction: column; gap: 10px; }
        }
        .orbit, .orbit-ring, .sat-wrap { pointer-events: none; }
        .center-orb, .sat-orb, .back-link, .page-nav, .page-nav a { pointer-events: auto; }
    </style>        
</head>
<body>
    <header>
        <div class="header-left-group">
            <a href="index.html" class="header-brand-container">
                <img src="logo-image.png" alt="BrainWhim Logo" class="header-logo-asset">
                <div class="header-brand-text"><span class="brand-brain">Brain</span><span class="brand-whim">Whim</span></div>
            </a>    
        </div>
        <nav class="header-navigation-menu">
            <a href="index.html#apps" class="nav-link">Apps</a>
            <a href="index.html#about" class="nav-link">About</a>
            <a href="index.html#support" class="nav-link">Support</a>
        </nav>
    </header>

    <div class="aurora-glow berry-light"></div>
    <div class="aurora-glow warm-light"></div>

    <div class="page-wrap">
        <div class="orbit">
            <div class="center-orb"><span class="center-orb-label">Play</span></div>            
            <div class="orbit-ring">
                <div class="sat-wrap sat-1"><a class="sat-orb" href="play-waitlist.html"><span class="orb-icon">🕹️</span>Casual<br>Games</a></div>
                <div class="sat-wrap sat-2"><a class="sat-orb" href="play-waitlist.html"><span class="orb-icon">🎲</span>Family<br>Games</a></div>
                <div class="sat-wrap sat-3"><a class="sat-orb" href="play-waitlist.html"><span class="orb-icon">🧩</span>Puzzle<br>Play</a></div>
            </div>
        </div>               

        <a class="back-link" href="index.html">Back to BrainWhim</a>
        <div class="page-nav">
            <a href="learn.html">Learn</a>
            <a href="live.html">Live</a>
            <a href="play.html">Play</a>
            <a href="create.html">Create</a>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-brand">
            <img src="logo-image.png" alt="BrainWhim" class="footer-logo">
            <p class="footer-brand-text"><span class="brand-brain">Brain</span><span class="brand-whim">Whim</span><span class="footer-year">© 2026</span></p>
        </div>
        <div class="footer-legal-links">
            <a href="terms.html">Terms of Service</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="disclaimers.html">Legal Disclaimers</a>
        </div>
    </footer>
</body>
</html>
