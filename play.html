<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play · BrainWhim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0D1630;
            color: #CBD5E1;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        .aurora-glow {
            position: absolute;
            width: 85vw;
            height: 85vw;
            max-width: 850px;
            max-height: 850px;
            border-radius: 50%;
            filter: blur(160px);
            pointer-events: none;
            z-index: 1;
        }
        .gold-light {
            background: radial-gradient(circle, #FF7A2A 0%, transparent 70%);
            top: 5%;
            left: 5%;
            opacity: 0.45;
        }
        .warm-light {
            background: radial-gradient(circle, #3B82F6 0%, transparent 70%);
            bottom: 5%;
            right: 5%;
            opacity: 0.45;
        }
        .page-wrap {
            position: relative;
            z-index: 5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            gap: 18px;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-bottom: 10px;
            text-decoration: none;
        }
        .page-logo {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }
        .brand-text {
            display: flex;
            align-items: center;
            font-size: 22px;
            transform: translateX(-2px);
        }
        .brand-brain { font-weight: 700; color: #fff; }
        .brand-whim { font-family: 'Pacifico', cursive; color: #7EB6D9; }
        .orbit {
            position: relative;
            width: min(460px, 94vw);
            height: min(460px, 94vw);
            margin: 0;
        }    
        .orbit::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 420px;
            height: 420px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(107, 163, 201, 0.15);
            box-shadow:
                0 0 18px rgba(107, 163, 201, 0.10),
                inset 0 0 18px rgba(107, 163, 201, 0.05);
            pointer-events: none;
            z-index: 0;
        }                
        
        .center-orb, .sat-orb {
            position: absolute;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            text-decoration: none;
            position: relative;
                        z-index: 2;
        }
        .center-orb {
            width: 170px;
            height: 170px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 35% 30%, #2a3554 0%, #0e162b 75%, #050a17 100%);
            box-shadow:
                0 20px 45px rgba(0,0,0,0.8),
                0 0 40px rgba(255,122,42,0.35),
                inset -12px -12px 28px rgba(0,0,0,0.85),
                inset 8px 8px 18px rgba(255,255,255,0.07);
            font-size: 22px;
            font-weight: 700;
        }
        .sat-orb {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle at 35% 30%, #243049 0%, #10182c 80%);
            box-shadow:
                0 20px 45px rgba(0,0,0,0.8),
                0 0 28px rgba(255,122,42,0.28),
                inset -8px -8px 18px rgba(0,0,0,0.75),
                inset 6px 6px 12px rgba(255,255,255,0.06);
            font-size: 11px;
            font-weight: 600;
            line-height: 1.25;
            padding: 8px;
        }
        .sat-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 108px;
            height: 108px;
            margin: 0;
            z-index: 2;
        }
        .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-168px) rotate(0deg); }
        .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-168px) rotate(-120deg); }
        .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-168px) rotate(-240deg); }                
        .back-link, .page-nav a {
            color: #7EB6D9;
            text-decoration: none;
            font-weight: 600;
        }
        .orbit-ring {
            position: absolute;
            inset: 0;
            animation: orbitSpin 28s linear infinite;
            pointer-events: none;
        }
        .orbit-ring:hover {
            animation-play-state: paused;
        }
        .sat-orb {
            animation: orbitCounter 28s linear infinite;
            pointer-events: auto;
        }
        .orbit-ring:hover .sat-orb {
            animation-play-state: paused;
        }
        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes orbitCounter {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }            
        .page-nav {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .page-nav a { font-size: 13px; }
        @media (max-width: 992px) {
            .aurora-glow { width: 70vw; height: 70vw; filter: none; opacity: 0.28; }
            body {
                background:
                    radial-gradient(circle at 30% 20%, rgba(255, 122, 42, 0.36), transparent 46%),
                    radial-gradient(circle at 80% 80%, rgba(255, 77, 0, 0.22), transparent 42%),
                    #152048;
            .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-132px) rotate(0deg); }
            .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-132px) rotate(-120deg); }
            .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-132px) rotate(-240deg); }                    
            }
        }
        .orbit,
        .orbit-ring,
        .sat-wrap {
            pointer-events: none;
        }
        .center-orb,
        .sat-orb,
        .back-link,
        .page-nav,
        .page-nav a,
        .brand {
            pointer-events: auto;
        }        
    </style>
</head>
<body>
    <div class="aurora-glow gold-light"></div>
    <div class="aurora-glow warm-light"></div>

    <div class="page-wrap">
        <a class="brand" href="index.html">
            <img src="logo-image.png" alt="BrainWhim" class="page-logo">
            <div class="brand-text">
                <span class="brand-brain">Brain</span><span class="brand-whim">Whim</span>
            </div>
        </a>

        <div class="orbit">
            <div class="center-orb">Play</div>
            <div class="orbit-ring">
                <div class="sat-wrap sat-1">
                    <a class="sat-orb" href="#">Casual<br>Games</a>
                </div>
                <div class="sat-wrap sat-2">
                    <a class="sat-orb" href="#">Family<br>Games</a>
                </div>
                <div class="sat-wrap sat-3">
                    <a class="sat-orb" href="#">Creative<br>Play</a>
                </div>
            </div>
        </div>               

        <a class="back-link" href="index.html">Back to BrainWhim</a>
        <div class="page-nav">
            <a href="learn.html">Learn</a>
            <a href="live.html">Live</a>
            <a href="play.html">Play</a>
            <a href="create.html">Create</a>
        </div>
    </div>
</body>
</html>
