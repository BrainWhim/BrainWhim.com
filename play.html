<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play · BrainWhim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0D1630;
            color: #CBD5E1;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        .aurora-glow {
            position: absolute;
            width: 85vw;
            height: 85vw;
            max-width: 850px;
            max-height: 850px;
            border-radius: 50%;
            filter: blur(160px);
            pointer-events: none;
            z-index: 1;
        }
        .gold-light {
            background: radial-gradient(circle, #FF7A2A 0%, transparent 70%);
            top: 5%;
            left: 5%;
            opacity: 0.45;
        }
        .warm-light {
            background: radial-gradient(circle, #3B82F6 0%, transparent 70%);
            bottom: 5%;
            right: 5%;
            opacity: 0.45;
        }
        .page-wrap {
            position: relative;
            z-index: 5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            gap: 36px;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-bottom: 10px;
            text-decoration: none;
            transform: translateY(-10px);            
        }
        .page-logo {
            width: 52px;
            height: 52px;
            object-fit: contain;
        }
        .brand-text {
            display: flex;
            align-items: center;
            font-size: 26px;
            transform: translateX(-2px);
        }
        .brand-brain { font-weight: 700; color: #fff; }
        .brand-whim { font-family: 'Pacifico', cursive; color: #7EB6D9; }
        .orbit {
            position: relative;
            width: min(380px, 86vw);
            height: min(380px, 86vw);
            margin: 12px 0 0;
        }    
        .orbit::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 336px;
            height: 336px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(107, 163, 201, 0.15);
            box-shadow:
                0 0 18px rgba(107, 163, 201, 0.10),
                inset 0 0 18px rgba(107, 163, 201, 0.05);
            pointer-events: none;
            z-index: 0;
        }                
        
        .center-orb, .sat-orb {
            position: absolute;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            text-decoration: none;
            position: relative;
                        z-index: 2;
        }
        .center-orb {
            width: 170px;
            height: 170px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background:
                radial-gradient(circle at 30% 24%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 22%),
                radial-gradient(circle at 32% 28%, #4a5d86 0%, #1a2338 52%, #070b14 78%, #020308 100%);
            box-shadow:
                0 20px 45px rgba(0,0,0,0.8),
                0 0 34px rgba(255,122,42,0.32),
                inset -16px -18px 28px rgba(0,0,0,0.72),
                inset 10px 8px 16px rgba(255,255,255,0.10);           
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            gap: 0;
            padding: 0;
            animation: coreBreathe 5.5s ease-in-out infinite;

        }    
        .center-orb-icon {
            width: 46px;
            height: 46px;
            object-fit: contain;
            margin: 0 0 8px;
            display: block;
        }.center-orb-label {
            display: block;
            margin-top: 0;
            line-height: 1;
        }                                    
        
        .sat-orb {
            width: 100px;
            height: 100px;
            background:
                radial-gradient(circle at 30% 24%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 22%),
                radial-gradient(circle at 32% 28%, #4a5d86 0%, #1a2338 52%, #070b14 78%, #020308 100%);
            box-shadow:
                0 20px 45px rgba(0,0,0,0.8),
                0 0 34px rgba(255,122,42,0.32),
                inset -16px -18px 28px rgba(0,0,0,0.72),
                inset 10px 8px 16px rgba(255,255,255,0.10);            
            font-size: 10px;
            font-weight: 600;
            line-height: 1.25;
            padding: 8px;
        }
        .sat-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            margin: 0;
            z-index: 2;
        }
        .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-134px) rotate(0deg); }
        .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-134px) rotate(-120deg); }
        .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-134px) rotate(-240deg); }                        
        .back-link, .page-nav a {
            color: #7EB6D9;
            text-decoration: none;
            font-weight: 600;
            margin-top: 18px;
        }
        .orbit-ring {
            position: absolute;
            inset: 0;
            animation: orbitSpin 28s linear infinite;
            pointer-events: none;
        }
        .orbit-ring:hover {
            animation-play-state: paused;
        }
        .sat-orb {
            animation: orbitCounter 28s linear infinite;
            pointer-events: auto;
        }
        .orbit-ring:hover .sat-orb {
            animation-play-state: paused;
        }
        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes orbitCounter {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }            
        .page-nav {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 22px;
            flex-wrap: wrap;
        }
        .page-nav a { font-size: 13px; }
        
        @media (max-width: 992px) {
            .aurora-glow { width: 70vw; height: 70vw; filter: none; opacity: 0.28; }
            body {
                background:
                    radial-gradient(circle at 30% 20%, rgba(255, 122, 42, 0.36), transparent 46%),
                    radial-gradient(circle at 80% 80%, rgba(255, 77, 0, 0.22), transparent 42%),
                    #152048;
            }
            .orbit {
                width: min(300px, 72vw);
                height: min(300px, 72vw);
            }
            .orbit::before {
                width: 250px;
                height: 250px;
            }
            .center-orb {
                width: 150px;
                height: 150px;
            }
            .sat-orb,
            .sat-wrap {
                width: 96px;
                height: 96px;
            }
            .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-100px) rotate(0deg); }
            .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-100px) rotate(-120deg); }
            .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-100px) rotate(-240deg); }
        }        
        .orbit,
        .orbit-ring,
        .sat-wrap {
            pointer-events: none;
        }
        .center-orb,
        .sat-orb,
        .back-link,
        .page-nav,
        .page-nav a,
        .brand {
            pointer-events: auto;
        }
            .page-wrap {
                min-height: 100dvh;
                justify-content: center;
                padding: 12px 16px 24px;
                gap: 14px;
            }
            .brand {
                margin-bottom: 0;
            }                 
        @keyframes coreBreathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.045); }
        }
        .orb-icon {
            font-size: 28px;
            line-height: 1;
            margin-bottom: 3px;
            display: block;
        }
        .sat-orb {
            font-size: 10px;
        }
        .center-orb,
        .sat-orb {
            overflow: hidden;
        }

        
    </style>
</head>
<body>
    <div class="aurora-glow gold-light"></div>
    <div class="aurora-glow warm-light"></div>

    <div class="page-wrap">
        <a class="brand" href="index.html">
            <img src="logo-image.png" alt="BrainWhim" class="page-logo">
            <div class="brand-text">
                <span class="brand-brain">Brain</span><span class="brand-whim">Whim</span>
            </div>
        </a>

        <div class="orbit">
            <div class="center-orb">
                <img src="orb-brain.png" alt="" class="center-orb-icon">
                <span class="center-orb-label">Play</span>
            </div>            
            <div class="orbit-ring">
                <div class="sat-wrap sat-1">
                    <a class="sat-orb" href="#">
                        <span class="orb-icon">🎮</span>
                        Casual<br>Games
                    </a>                   
                </div>
                <div class="sat-wrap sat-2">
                    <a class="sat-orb" href="#">
                        <span class="orb-icon">🎲</span>
                        Family<br>Games
                    </a>                   
                </div>
                <div class="sat-wrap sat-3">
                    <a class="sat-orb" href="#">
                        <span class="orb-icon">🧩</span>
                        Puzzle<br>Play
                    </a>                    
                    </a>                    
                </div>
            </div>
        </div>               

        <a class="back-link" href="index.html">Back to BrainWhim</a>
        <div class="page-nav">
            <a href="learn.html">Learn</a>
            <a href="live.html">Live</a>
            <a href="play.html">Play</a>
            <a href="create.html">Create</a>
        </div>
    </div>
</body>
</html>
