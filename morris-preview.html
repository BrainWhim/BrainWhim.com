<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Morris: Board Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(15,23,42,.72);--gold:#e7c77a;--ink:#f3ead8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:#141a12;overflow-x:hidden;min-height:100vh}
.bg{position:fixed;inset:-40px;background:url("morris-cloister.jpg") center/cover;filter:blur(18px) brightness(.55) saturate(.9);z-index:-2}
header{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 16px 4px}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.designs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:6px}
.designs button{font:600 13px Montserrat,sans-serif;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:9px 14px;cursor:pointer}
.designs button.on{background:rgba(255,255,255,.22);border-color:rgba(231,199,122,.6);color:#fff}
.stage{display:flex;justify-content:center;overflow:hidden}
.fit{position:relative;flex:none}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.scene{position:relative;width:860px;height:700px;perspective:3000px;perspective-origin:50% 35%}
.board{position:absolute;left:110px;top:40px;width:640px;height:640px;transform-style:preserve-3d;transform:rotateX(34deg)}
.board *{transform-style:preserve-3d}
.p{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tsh{left:-40px;top:-20px;width:720px;height:720px;transform:translateZ(-60px);background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.6),rgba(0,0,0,0) 68%);filter:blur(14px)}
/* the slab: top split in quarters (Chrome drops large tilted planes otherwise), walls hang below */
.top{width:320px;height:320px;background-image:var(--top);background-size:640px 640px;background-color:var(--topc)}
.top.q1{left:0;top:0;background-position:0 0}.top.q2{left:320px;top:0;background-position:-320px 0}
.top.q3{left:0;top:320px;background-position:0 -320px}.top.q4{left:320px;top:320px;background-position:-320px -320px}
.sheen{left:0;top:0;width:640px;height:640px;transform:translateZ(.4px);pointer-events:none;border-radius:2px;
  background:radial-gradient(ellipse 80% 70% at 30% 20%,rgba(255,245,220,.16),rgba(0,0,0,0) 60%),linear-gradient(to bottom,rgba(0,0,0,0) 60%,rgba(0,0,0,.12));
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 0 0 18px var(--rim),inset 0 0 0 20px var(--rim2),inset 0 0 40px rgba(0,0,0,.35)}
.wall{background-image:var(--side);background-size:640px 640px;background-color:var(--topc)}
.wall::after{content:"";position:absolute;inset:0}
.wall.f{left:0;top:640px;width:320px;height:34px;transform-origin:top;transform:rotateX(-90deg)}
.wall.f2{left:320px}
.wall.f::after{background:linear-gradient(to bottom,rgba(255,240,210,.1),rgba(0,0,0,.45))}
.wall.l{left:-34px;top:0;width:34px;height:640px;transform-origin:right;transform:rotateY(-90deg)}
.wall.l::after{background:rgba(255,240,210,.05)}
.wall.r{left:640px;top:0;width:34px;height:640px;transform-origin:left;transform:rotateY(90deg)}
.wall.r::after{background:rgba(0,0,0,.5)}
/* lines and points sit a hair above the top */
.ln{transform:translateZ(.8px);background:var(--line);box-shadow:var(--lineSh)}
.pt{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;transform:translateZ(1.2px);background:var(--pt);box-shadow:var(--ptSh)}
.pt.ok::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.95) 0 22%,rgba(255,206,110,.35) 45%,rgba(255,206,110,0) 70%);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5;transform:scale(.85)}}
.hit{width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;transform:translateZ(3px);cursor:pointer;-webkit-tap-highlight-color:transparent}
.millglow{transform:translateZ(1px);border-radius:8px;background:rgba(255,214,120,.55);box-shadow:0 0 18px 6px rgba(255,206,110,.55);opacity:0;transition:opacity .4s}
.millglow.on{opacity:1}
/* pieces: a stack of discs makes the side, the top face carries the finish */
.pc{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;transition:transform .55s cubic-bezier(.3,.7,.3,1.15),opacity .3s}
.pc .s{position:absolute;inset:0;border-radius:50%;background:var(--side-c)}
.pc .t{position:absolute;inset:0;border-radius:50%;background:var(--face);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 -6px 10px rgba(0,0,0,.25),inset 0 5px 8px rgba(255,255,255,.35)}
.pc .t::after{content:"";position:absolute;inset:11px;border-radius:50%;box-shadow:inset 0 2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.35)}
.pc .sh{position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.55),rgba(0,0,0,0) 68%);filter:blur(2px)}
.pc.a{--face:var(--aFace);--side-c:var(--aSide)}
.pc.b{--face:var(--bFace);--side-c:var(--bSide)}
.pc.mill .t{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 3px #f1cf7a,0 0 18px 4px rgba(255,210,110,.6)}
.bar{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px auto 0;padding:10px 12px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:12px;width:min(640px,calc(100% - 32px))}
.status{flex:1 1 220px;font-size:14px;line-height:1.35}
.status b{color:var(--gold)}
.btn{font:600 14px Montserrat,sans-serif;border-radius:6px;padding:11px 18px;cursor:pointer;border:1px solid rgba(231,199,122,.45);background:rgba(30,41,59,.85);color:var(--gold)}
.note{max-width:640px;margin:12px auto 24px;padding:0 16px;text-align:center;font-size:12.5px;line-height:1.5;color:rgba(243,234,216,.75)}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <div class="label">Nine Men's Morris · Board Preview</div>
  <div class="designs" id="designs">
    <button data-d="walnut" class="on">Cloister Walnut</button>
    <button data-d="marble">Carved Marble</button>
    <button data-d="slate">Slate &amp; Gold</button>
  </div>
</header>
<div class="stage"><div class="fit" id="fit"><div class="scaler" id="scaler"><div class="scene"><div class="board" id="board"></div></div></div></div></div>
<div class="bar"><div class="status" id="status"></div><button class="btn" id="demo">Show a Game</button><button class="btn" id="clear" style="background:transparent;color:var(--ink);border-color:rgba(255,255,255,.2)">Clear</button></div>
<p class="note">Preview only. Tap points to place stones (they take turns); line up three in a row to see a mill glow. The glowing points show the open moves.</p>
<script>
/* ---------- painted materials ---------- */
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}
function noise2(seed){var r=rng(seed),P=new Uint16Array(512),G=new Float32Array(256),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=Math.floor(r()*(i+1));t=p[i];p[i]=p[j];p[j]=t;}for(i=0;i<512;i++)P[i]=p[i&255];for(i=0;i<256;i++)G[i]=r();function f(x){return x*x*(3-2*x);}return function(x,y){var xi=Math.floor(x),yi=Math.floor(y),u=f(x-xi),v=f(y-yi),X=xi&255,Y=yi&255;var a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(n,x,y,o){var s=0,a=.5,t=0;for(var i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function mix(a,b,t){return a+(b-a)*t;}
function paint(w,h,fn){var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d"),im=g.createImageData(w,h),D=im.data;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var col=fn(x,y),i=(y*w+x)*4;D[i]=col[0];D[i+1]=col[1];D[i+2]=col[2];D[i+3]=255;}g.putImageData(im,0,0);return 'url('+c.toDataURL("image/jpeg",.9)+')';}
function woodFn(o){var n=noise2(o.seed),n2=noise2(o.seed+77),r=rng(o.seed+5);return function(x,y){var warp=fbm(n,x/o.wx,y/o.wy,4),v=y*o.freq+warp*o.turb;v-=Math.floor(v);var ring=Math.pow(Math.abs(Math.sin(v*Math.PI)),o.sharp),st=fbm(n2,x/180,y/1.6,3);var t=Math.min(1,Math.max(0,(1-ring)*o.ringAmt+st*o.streakAmt));var k=r()<o.pores?.8:1,l=1+(fbm(n2,x/400,y/90,2)-.5)*o.blotch;return [mix(o.light[0],o.dark[0],t)*k*l,mix(o.light[1],o.dark[1],t)*k*l,mix(o.light[2],o.dark[2],t)*k*l];};}
function marbleFn(o){var n=noise2(o.seed),n2=noise2(o.seed+9);return function(x,y){var w=fbm(n,x/150,y/150,5);var v=Math.abs(Math.sin((x*.004+y*.007)*o.freq+w*o.turb));v=Math.pow(1-v,o.sharp);var fine=fbm(n2,x/14,y/14,3);var cloud=fbm(n2,x/260,y/260,3);var b=mix(o.base[0],o.cloud[0],cloud*.6),g=mix(o.base[1],o.cloud[1],cloud*.6),bb=mix(o.base[2],o.cloud[2],cloud*.6);return [mix(b,o.vein[0],v*o.amt)*(.97+fine*.06),mix(g,o.vein[1],v*o.amt)*(.97+fine*.06),mix(bb,o.vein[2],v*o.amt)*(.97+fine*.06)];};}
function slateFn(o){var n=noise2(o.seed),n2=noise2(o.seed+4),r=rng(o.seed);return function(x,y){var layer=fbm(n,x/300,y/22,4),fine=fbm(n2,x/6,y/6,2),k=.82+layer*.3+fine*.1+(r()<.02?.08:0);return [o.base[0]*k,o.base[1]*k,o.base[2]*k];};}

var DESIGNS={
  walnut:{name:"Cloister Walnut",
    top:function(){return paint(640,640,woodFn({light:[112,70,40],dark:[52,30,16],freq:.035,turb:9,wx:240,wy:24,sharp:.7,ringAmt:.66,streakAmt:.42,pores:.02,blotch:.3,seed:23}));},
    topc:"#5a3a22",rim:"rgba(30,16,8,.28)",rim2:"rgba(210,170,110,.35)",
    line:function(){return paint(640,64,woodFn({light:[232,204,156],dark:[196,160,108],freq:.05,turb:4,wx:300,wy:40,sharp:.6,ringAmt:.35,streakAmt:.45,pores:0,blotch:.12,seed:7}));},
    lineV:function(){var f=woodFn({light:[232,204,156],dark:[196,160,108],freq:.05,turb:4,wx:300,wy:40,sharp:.6,ringAmt:.35,streakAmt:.45,pores:0,blotch:.12,seed:8});return paint(64,640,function(x,y){return f(y,x);});},
    lineSh:"0 0 0 1px rgba(30,15,5,.6),inset 0 1px 0 rgba(255,255,255,.25)",
    pt:"radial-gradient(circle at 38% 32%,#fff1c2,#d9b25a 40%,#8a6522 75%,#5a3f12)",ptSh:"0 0 0 2px rgba(30,15,5,.55),0 1px 2px rgba(0,0,0,.5)",
    a:["radial-gradient(circle at 36% 30%,#7fa3ff,#2a4fd0 45%,#16297a)","#122063"],b:["radial-gradient(circle at 36% 30%,#fffdf4,#efe4c8 50%,#cbb88f)","#b7a47c"],names:["Cobalt","Ivory"]},
  marble:{name:"Carved Marble",
    top:function(){return paint(640,640,marbleFn({base:[240,238,234],cloud:[218,216,212],vein:[150,148,150],freq:3.2,turb:6,sharp:3.2,amt:.42,seed:31}));},
    topc:"#e8e6e2",rim:"rgba(120,120,125,.12)",rim2:"rgba(150,150,155,.35)",
    line:function(){return "linear-gradient(to bottom,#7d7a74,#a8a49c 40%,#d8d4cc)";},
    lineSh:"inset 0 2px 2px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.8)",
    pt:"radial-gradient(circle at 50% 50%,#8f8b84 0 35%,#c9c5bd 36% 52%,rgba(0,0,0,0) 54%)",ptSh:"inset 0 2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.7)",
    a:["radial-gradient(circle at 36% 30%,#7fa0e8,#25469e 45%,#0f2152)","#0d1c48"],b:["radial-gradient(circle at 36% 30%,#ffffff,#f1ede4 50%,#cfc8b8)","#bdb5a3"],names:["Lapis","Alabaster"]},
  slate:{name:"Slate & Gold",
    top:function(){return paint(640,640,slateFn({base:[58,62,68],seed:17}));},
    topc:"#3a3e44",rim:"rgba(0,0,0,.25)",rim2:"rgba(214,178,92,.55)",
    line:function(){return "linear-gradient(to bottom,#fff0b8,#e2bd62 35%,#9c7326 70%,#f3d68b)";},
    lineSh:"0 1px 2px rgba(0,0,0,.6)",
    pt:"radial-gradient(circle at 38% 32%,#fff3c8,#e2bd62 40%,#8f6a22 80%)",ptSh:"0 1px 3px rgba(0,0,0,.6)",
    a:["radial-gradient(circle at 36% 30%,#6a6a72,#24242a 45%,#09090b)","#050506"],b:["radial-gradient(circle at 36% 30%,#fffdf4,#efe4c8 50%,#cbb88f)","#b7a47c"],names:["Jet","Ivory"]}
};

/* ---------- board geometry ---------- */
var XY=[[0,0],[3,0],[6,0],[1,1],[3,1],[5,1],[2,2],[3,2],[4,2],[0,3],[1,3],[2,3],[4,3],[5,3],[6,3],[2,4],[3,4],[4,4],[1,5],[3,5],[5,5],[0,6],[3,6],[6,6]];
var NB=[[1,9],[0,2,4],[1,14],[4,10],[1,3,5,7],[4,13],[7,11],[4,6,8,16],[7,12],[0,10,21],[3,9,11,18],[6,10,15],[8,13,17],[5,12,14,20],[2,13,23],[11,16],[7,15,17,19],[12,16],[10,19],[16,18,20,22],[13,19],[9,22],[19,21,23],[14,22]];
var MILLS=[[0,1,2],[3,4,5],[6,7,8],[15,16,17],[18,19,20],[21,22,23],[0,9,21],[3,10,18],[6,11,15],[8,12,17],[5,13,20],[2,14,23],[9,10,11],[12,13,14],[1,4,7],[16,19,22]];
var M=86, S=(640-2*M)/6, LW=8;
function px(i){return [M+XY[i][0]*S, M+XY[i][1]*S];}
var B=document.getElementById("board"), h='<div class="p tsh"></div>';
h+='<div class="p wall f wh"></div><div class="p wall f f2 wh"></div><div class="p wall l wh"></div><div class="p wall r wh"></div>';
h+='<div class="p top q1"></div><div class="p top q2"></div><div class="p top q3"></div><div class="p top q4"></div><div class="p sheen"></div>';
/* lines: three squares and four connectors */
function seg(x1,y1,x2,y2){var x=Math.min(x1,x2)-LW/2,y=Math.min(y1,y2)-LW/2,w=Math.abs(x2-x1)+LW,hh=Math.abs(y2-y1)+LW;return '<div class="p ln" data-o="'+(w>hh?'h':'v')+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+hh+'px"></div>';}
[0,1,2].forEach(function(k){var a=M+k*S,b=M+(6-k)*S;h+=seg(a,a,b,a)+seg(a,b,b,b)+seg(a,a,a,b)+seg(b,a,b,b);});
h+=seg(M+3*S,M,M+3*S,M+2*S)+seg(M+3*S,M+4*S,M+3*S,M+6*S)+seg(M,M+3*S,M+2*S,M+3*S)+seg(M+4*S,M+3*S,M+6*S,M+3*S);
MILLS.forEach(function(m,k){var a=px(m[0]),c=px(m[2]);var x=Math.min(a[0],c[0])-18,y=Math.min(a[1],c[1])-18;h+='<div class="p millglow" id="mg'+k+'" style="left:'+x+'px;top:'+y+'px;width:'+(Math.abs(c[0]-a[0])+36)+'px;height:'+(Math.abs(c[1]-a[1])+36)+'px"></div>';});
for(var i=0;i<24;i++){var q=px(i);h+='<div class="p pt" id="pt'+i+'" style="left:'+q[0]+'px;top:'+q[1]+'px"></div>';}
h+='<div id="pcs" style="position:absolute;left:0;top:0"></div>';
for(i=0;i<24;i++){var q2=px(i);h+='<div class="p hit" data-i="'+i+'" style="left:'+q2[0]+'px;top:'+q2[1]+'px"></div>';}
B.innerHTML=h;


/* pieces */
var cells=Array(24).fill(0), els=Array(24).fill(null), turn=1;
function makePiece(side,i){
  var q=px(i),e=document.createElement("div");e.className="pc "+(side===1?"a":"b");
  var hh='<div class="sh" style="transform:translateZ(.6px)"></div>';
  for(var k=0;k<7;k++) hh+='<div class="s" style="transform:translateZ('+(2+k*1.6)+'px);filter:brightness('+(0.75+k*.04)+')"></div>';
  hh+='<div class="t" style="transform:translateZ(13.5px)"></div>';
  e.innerHTML=hh; e.style.left=q[0]+"px"; e.style.top=q[1]+"px";
  e.style.transform="translateZ(140px)"; e.style.opacity="0";
  document.getElementById("pcs").appendChild(e);
  requestAnimationFrame(function(){requestAnimationFrame(function(){e.style.transform="translateZ(0)";e.style.opacity="1";});});
  return e;
}
function refresh(){
  var lit=[];MILLS.forEach(function(m,k){var on=cells[m[0]]&&cells[m[0]]===cells[m[1]]&&cells[m[1]]===cells[m[2]];document.getElementById("mg"+k).classList.toggle("on",!!on);if(on)lit=lit.concat(m);});
  for(var i=0;i<24;i++){document.getElementById("pt"+i).classList.toggle("ok",!cells[i]);if(els[i])els[i].classList.toggle("mill",lit.indexOf(i)>=0);}
  var d=DESIGNS[cur];document.getElementById("status").innerHTML="<b>"+d.name+"</b> · "+d.names[0]+" and "+d.names[1]+" stones. Next: "+d.names[turn-1]+".";
}
function place(i,side){cells[i]=side;els[i]=makePiece(side,i);}
B.addEventListener("click",function(e){var t=e.target.closest(".hit");if(!t)return;var i=+t.dataset.i;
  if(cells[i]){els[i].remove();els[i]=null;cells[i]=0;}else{place(i,turn);turn=3-turn;}refresh();});
document.getElementById("clear").onclick=function(){for(var i=0;i<24;i++){if(els[i])els[i].remove();els[i]=null;cells[i]=0;}turn=1;refresh();};
document.getElementById("demo").onclick=function(){document.getElementById("clear").onclick();[[0,1],[4,2],[1,1],[9,2],[10,1],[13,2],[2,1],[19,2],[16,2],[22,2],[11,1],[7,1]].forEach(function(m,k){setTimeout(function(){place(m[0],m[1]);refresh();},k*140);});turn=2;};

/* designs */
var cache={},cur="walnut";
function apply(k){cur=k;var d=DESIGNS[k];if(!cache[k]){cache[k]={top:d.top(),line:d.line()};if(d.lineV)cache[k].lineV=d.lineV();}var s=B.style;
  s.setProperty("--top",cache[k].top);s.setProperty("--side",cache[k].top);s.setProperty("--topc",d.topc);s.setProperty("--rim",d.rim);s.setProperty("--rim2",d.rim2);
  var img=cache[k].line, grad=img.indexOf("gradient")>=0;
  B.querySelectorAll(".ln").forEach(function(l){var v=l.dataset.o==="v";
    if(grad){l.style.backgroundImage=v?img.replace("to bottom","to right"):img;l.style.backgroundSize="100% 100%";}
    else{l.style.backgroundImage=v?cache[k].lineV:img;l.style.backgroundSize=v?"64px 640px":"640px 64px";l.style.backgroundPosition=(-Math.round(parseFloat(l.style.left)))+"px "+(-Math.round(parseFloat(l.style.top))%64)+"px";}});s.setProperty("--lineSh",d.lineSh);s.setProperty("--pt",d.pt);s.setProperty("--ptSh",d.ptSh);
  s.setProperty("--aFace",d.a[0]);s.setProperty("--aSide",d.a[1]);s.setProperty("--bFace",d.b[0]);s.setProperty("--bSide",d.b[1]);
  document.querySelectorAll("#designs button").forEach(function(b){b.classList.toggle("on",b.dataset.d===k);});refresh();}
document.querySelectorAll("#designs button").forEach(function(b){b.onclick=function(){apply(b.dataset.d);};});
function fit(){var w=Math.min(innerWidth-8,1000),hh=Math.max(320,innerHeight-230),s=Math.min(w/860,hh/700,1.1);document.getElementById("scaler").style.transform="scale("+s+")";var f=document.getElementById("fit");f.style.width=860*s+"px";f.style.height=700*s+"px";}
addEventListener("resize",fit);fit();apply("walnut");document.getElementById("demo").onclick();
</script>
</body>
</html>
