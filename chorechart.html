/* ---------- sound of its own ---------- */
var AC=null, OUT=null;
function ac(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C();
    var comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=4;
    OUT=AC.createGain(); OUT.gain.value=.9; OUT.connect(comp); comp.connect(AC.destination); }
  if(AC.state!=="running"){ try{ AC.resume(); }catch(e){} } return AC; }
function unlock(){ try{ if(navigator.audioSession&&navigator.audioSession.type!=="playback") navigator.audioSession.type="playback"; }catch(e){} var a=ac(); if(!a) return;
  if(a.state!=="running"||!a._u){ try{ var b=a.createBuffer(1,1,22050), s=a.createBufferSource(); s.buffer=b; s.connect(a.destination); s.start(0); a._u=1; }catch(e){} } }
["pointerdown","pointerup","touchend","click","keydown"].forEach(function(ev){ document.addEventListener(ev,unlock,{capture:true,passive:true}); });
function on(){ return LS.get("sound",true)!==false && !!ac(); }
function tone(f,at,d,v,type,f2){ if(!on()) return; var t=AC.currentTime+(at||0), o=AC.createOscillator(), g=AC.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(OUT); o.start(t); o.stop(t+d+.05); }
var NB=null;
function nbuf(){ if(!NB){ NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); var c=NB.getChannelData(0); for(var i=0;i<c.length;i++) c[i]=Math.random()*2-1; } return NB; }
function noise(at,d,v,lo,hi){ if(!on()) return; var t=AC.currentTime+(at||0), s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=nbuf();
  f.type="bandpass"; f.frequency.value=Math.sqrt(lo*hi); f.Q.value=Math.max(.3,Math.sqrt(lo*hi)/(hi-lo)); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t); s.stop(t+d+.05); }


function sTap(){ tone(880,0,.05,.05,"triangle"); }
function sCoin(k){ var f=[2093,2349,2637,2794][k%4]; tone(f,0,.18,.07,"triangle"); tone(f*1.5,.05,.25,.05,"triangle"); noise(.05,.06,.06,5000,10000); }
function sStamp(){ noise(0,.05,.2,300,2000); tone(150,0,.08,.15,"sine",90); }
function sUndo(){ tone(600,0,.12,.05,"triangle",400); }
function sGoal(){ [523,659,784,1047,1319,1568].forEach(function(f,i){ tone(f,i*.08,.45,.08,"triangle"); }); }
function sRegister(){ tone(1568,0,.08,.08,"square"); tone(2093,.09,.4,.08,"square"); noise(.12,.3,.1,2000,8000); }

/* ---------- the week (Monday to Sunday) ---------- */
var DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dayN(){ var d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); }
function weekOf(n){ return Math.floor((n+3)/7); }          /* day 0 (Jan 1 1970) was a Thursday */
function todayI(){ return (new Date().getDay()+6)%7; }
function weekLabel(){ var n=dayN()-todayI(), d=new Date(n*864e5); return "Week of "+MO[d.getUTCMonth()]+" "+d.getUTCDate(); }
/* a new week: keep last week's total for the log, start a fresh chart (the jar keeps its coins) */
function rollWeek(){ var w=weekOf(dayN()); if(ST.wk===w) return; if(ST.wk!=null){ var t=weekTotal(); if(t) ST.hist.unshift({wk:ST.wk,c:t}); if(ST.hist.length>12) ST.hist.length=12; }
  ST.wk=w; ST.marks={}; save(); }
function weekTotal(){ var t=0; for(var id in ST.marks) if(CB[id]) ST.marks[id].forEach(function(on){ if(on) t+=pay(id); }); return t; }

    for(var i=0;i<7;i++) h+='<button class="bx'+(m[i]?" on":"")+(i===ti?" today":"")+'" data-c="'+id+'" data-d="'+i+'"'+(i>ti?' disabled':'')+' aria-label="'+esc(c.n)+', '+DN[i]+(m[i]?", done":"")+'">'+(m[i]?stampSVG():'')+'</button>'; });

$("#chart").addEventListener("click",function(e){ var b=e.target.closest(".bx"); if(!b||b.disabled) return; mark(b.dataset.c,+b.dataset.d,b); });
function mark(id,d,el){ var m=ST.marks[id]=ST.marks[id]||[0,0,0,0,0,0,0], was=!!m[d], hadGoal=ST.goal&&ST.bank>=ST.goal.c;
  m[d]=was?0:1; ST.bank=Math.max(0,ST.bank+(was?-1:1)*pay(id)); save();

  sStamp(); var nc=Math.round(pay(id)/25); for(var q=0;q<nc;q++) (function(q){ setTimeout(function(){ fly(el); setTimeout(function(){ sCoin(q); },400); },q*170); })(q);

function goalSheet(){ var g=ST.goal||{k:0,c:1000}, k=g.k, c=g.c;
  function draw(box){ box.querySelector(".gl").innerHTML=GOALS.map(function(x,i){ return '<button class="'+(i===k?"on":"")+'" data-k="'+i+'">'+gicon(i)+x[0]+'</button>'; }).join("");
    box.querySelector(".amts").innerHTML=AMTS.map(function(a){ return '<button class="'+(a===c?"on":"")+'" data-c="'+a+'">'+dollars(a).replace(".00","")+'</button>'; }).join(""); }
  var box=BWK.sheet('<h2>My Saving Goal</h2><p style="margin:0">What are you saving for?</p><div class="gl"></div><p style="margin:0">How much does it cost?</p><div class="amts"></div>'+
    '<div class="k-row"><button class="k-btn" data-a="set">Save for it!</button>'+'<button class="k-btn k-ghost" data-a="gu">Grown-ups</button></div>');
  draw(box);
  box.addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return;
    if(b.dataset.k!=null){ k=+b.dataset.k; sTap(); draw(box); }
    else if(b.dataset.c!=null){ c=+b.dataset.c; sTap(); draw(box); }
    else if(b.dataset.a==="set"){ ST.goal={k:k,c:c}; save(); BWK.closeSheet(true); sGoal(); if(document.body.classList.contains("m-play")) drawBank(); toMenu(); }
    else if(b.dataset.a==="gu"){ BWK.closeSheet(true); grown(); } }); }
function payday(){ gate(paydayNow); }
function paydayNow(){ (function(){ var amt=ST.bank; var box=BWK.sheet('<h2>Payday</h2><p>The jar has <b>'+dollars(amt)+'</b>. When you hand over the real money (or put it in a real bank), tap <b>Pay out</b> and the jar starts again at $0.00.</p>'+
  '<div class="k-row"><button class="k-btn" data-a="go">Pay out '+dollars(amt)+'</button><button class="k-btn k-ghost" data-a="no">Not yet</button></div>');
  box.querySelector('[data-a=go]').onclick=function(){ ST.hist.unshift({paid:amt,d:Date.now()}); ST.bank=0; save(); sRegister(); BWK.closeSheet(true); BWK.say(PAYDAY); if(document.body.classList.contains("m-play")) drawBank(); toMenuFoot(); };
  box.querySelector('[data-a=no]').onclick=function(){ BWK.closeSheet(true); }; })(); }

/* ---------- menu ---------- */
function toMenuFoot(){ rollWeek(); $("#mfoot").textContent="This week: "+dollars(weekTotal())+" · In my jar: "+dollars(ST.bank)+(ST.goal?" · Saving for "+GOALS[ST.goal.k][0].toLowerCase():""); }
function toMenu(){ document.body.className="m-menu"; toMenuFoot(); }
$("#bChart").onclick=function(){ BWK.sfx("open"); toChart(); };
$("#bPick").onclick=function(){ BWK.sfx("open"); toPick(); }; $("#tPick").onclick=function(){ sTap(); toPick(); };
$("#kDone").onclick=function(){ sTap(); toChart(); };
$("#bGoal").onclick=goalSheet;
$("#kMenu").onclick=function(){ BWK.sfx("tap"); toMenu(); }; $("#tMenu").onclick=function(){ BWK.sfx("tap"); toMenu(); };
$("#bHow").onclick=function(){ BWK.sheet('<div class="how"><h2>How It Works</h2><p>'+HOW+'</p>'+
  '<p><b>Pick your chores</b> (up to 6). Each one pays a little pretend money.</p><p><b>Tap today\'s box</b> when you finish a chore: you get a gold star and coins clink into your jar. Tapped by mistake? Tap it again to take it back.</p>'+
  '<p><b>Saving goal:</b> pick something to save for and watch your jar fill up.</p>'+
  '<p><b>Prices:</b> ask a grown-up to help you set the price for each chore. Every coin in the jar is a quarter, so a $1 chore drops in four coins.</p>'+
  '<p><b>Helping at home:</b> '+FAMILY+'</p>'+
  '<p><b>For grown-ups:</b> the money is pretend. Use the <b>Grown-ups</b> button (on every screen here) to set prices, do <b>Payday</b> when you hand over real money, start the week over, or <b>play without money</b> (the jar fills with helper coins instead). Each new week starts a fresh chart; the jar keeps its coins. Nothing leaves this device.</p></div>'); BWK.say(HOW+" "+PRICE); };
$("#bBack").onclick=BWG.toOutpost;
(function(){ $("#ccEmb").innerHTML='<g transform="translate(22 4)">'+jarSVG(400).replace(/^<svg[^>]*>|<\/svg>$/g,"")+'</g><g transform="translate(80 40) scale(1.1)"><path d="M20 6l4.2 8.6 9.5 1.4-6.9 6.7 1.6 9.5L20 27.7l-8.4 4.5 1.6-9.5-6.9-6.7 9.5-1.4z" fill="#f2be45" stroke="#a86d06" stroke-width="1.6"/></g>'; })();

/* photos (ch/): a glass jar and a coin, used as soon as they're here (declared near the top so the emblem can use them) */
(function(){ var j=new Image(); j.onload=function(){ PHJ=true; if(document.body.classList.contains("m-play")) drawBank(); }; j.src="ch/jar.webp?v="+AV;
  var c=new Image(); c.onload=function(){ PHC=true; if(document.body.classList.contains("m-play")) drawBank(); }; c.src="ch/coin.webp?v="+AV; })();

var INTRO="Chore Chart! Check off your chores each day and fill your jar with pretend coins. Save up for something special!";
var HOW="Pick your chores, then tap today's box each time you finish one. You'll get a gold star, and pretend coins go into your jar. Save up for a goal!";
var PRICE="Ask a grown-up to help you set the right price for each chore.";
var FAMILY="Some families don\'t pay for chores, and that\'s okay! Everyone in a family helps out. Your grown-ups give you a home, food and clothes, and helping is how you take care of your family too. You\'re welcome to play along and fill your jar just for fun.";
var NOTE_GU='<p>The coins are pretend. Set a price for each chore together (each coin is a quarter), or turn on <b>Play without money</b> if your family doesn\'t pay for chores: the jar then fills with helper coins and no prices show.</p>';
var FIRST="Tap a box when you finish a chore!", ALLDONE="Every chore is done today! Great work!", GOALSAY="Goal reached! Show a grown-up your jar!";
var PAYDAY="Payday! Your jar starts again.", WINP="Great job! You earned a new patch for your badge wall!";
var L={"cc-price":PRICE,"cc-family":FAMILY.replace(/\\'/g,"'"),"cc-intro":INTRO,"cc-how":HOW,"cc-first":FIRST,"cc-alldone":ALLDONE,"cc-goal":GOALSAY,"cc-payday":PAYDAY,"cc-winp":WINP};
CH.forEach(function(c){ L["cc-j-"+c[0]]=c[1]; });
BWK.lines(L);
toMenu();
BWK.init({here:"chores", voice:"outpost", intro:INTRO, noHello:true});
window.CCO={chart:toChart,pick:toPick,mark:function(id,d){ mark(id,d==null?todayI():d,document.querySelector('.bx[data-c="'+id+'"][data-d="'+(d==null?todayI():d)+'"]')||document.body); },
  goal:function(k,c){ ST.goal={k:k,c:c}; save(); },state:function(){ return {on:ST.on,marks:ST.marks,bank:ST.bank,week:weekTotal(),goal:ST.goal,wk:ST.wk}; },lines:L};
})();
</script>
