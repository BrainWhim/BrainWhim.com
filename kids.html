<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Kids' Corner · BrainWhim</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="kids.css?v=1108c">
<style>
/* ==========================================================================
   BrainWhim · Kids' Corner landing (Nov 6, 2026)
   The photo kids-landing.jpg is the room: the golden crescent-moon door = Moonlets,
   the treehouse = The Outpost. Wide screens: the photo fills the screen and the doors are in it.
   Tall screens (phones, iPads upright): the photo on top, two big door cards below.
   Living details: twinkling stars, lantern flicker, fireflies, drifting bubbles, glowing moons.
   ========================================================================== */
.world{position:fixed;inset:0;overflow:hidden;background:#050b1c}
.stage{position:absolute;left:50%;top:50%;width:max(100vw,150svh);aspect-ratio:3/2;transform:translate(-50%,-50%);
  background:url("kids-landing.jpg") center/cover no-repeat;transform-origin:50% 50%;transition:transform 1s cubic-bezier(.6,0,.3,1)}
@media (max-width:1100px){.stage{background-image:url("kids-landing-sm.jpg")}}
.stage.zoomOut{transform:translate(-50%,-50%) scale(1.9)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 108%,rgba(3,8,22,.7),transparent 46%),linear-gradient(180deg,rgba(3,8,22,.42),transparent 16%)}

/* living details (transform + opacity only) */
.fx{position:absolute;pointer-events:none}
.star{width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(200,230,255,.9);animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.lamp{width:9%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,206,120,.55),rgba(255,170,60,.18) 38%,transparent 66%);mix-blend-mode:screen;animation:fl 2.7s steps(1) infinite}
@keyframes fl{0%{opacity:.85}13%{opacity:.62}21%{opacity:.95}38%{opacity:.74}52%{opacity:1}67%{opacity:.7}81%{opacity:.9}}
.fly{width:5px;height:5px;border-radius:50%;background:#fff3a0;box-shadow:0 0 10px 3px rgba(255,236,120,.75);animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}50%{transform:translate(40px,-30px);opacity:.3}70%{opacity:1}100%{transform:translate(-20px,-60px);opacity:0}}
.bub{width:3.2%;aspect-ratio:1;border-radius:50%;animation:bub 16s linear infinite;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 6%,transparent 14%),radial-gradient(circle at 50% 50%,transparent 58%,rgba(160,220,255,.32) 66%,rgba(255,170,230,.38) 74%,rgba(255,255,255,.55) 78%,transparent 80%)}
@keyframes bub{0%{transform:translate(0,0);opacity:0}8%{opacity:.95}50%{transform:translate(2vw,-14vh)}92%{opacity:.85}100%{transform:translate(-1vw,-30vh);opacity:0}}
.moonglow{width:8.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;animation:mg 5s ease-in-out infinite}
@keyframes mg{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.95)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.06)}}

/* the doors in the photo */
.door{position:absolute;appearance:none;border:0;padding:0;background:transparent;cursor:pointer;border-radius:40% 40% 24% 24%}
.door::before{content:"";position:absolute;inset:-4%;border-radius:inherit;pointer-events:none;opacity:.55;
  background:radial-gradient(ellipse at 50% 55%,rgba(255,214,120,.32),transparent 64%);animation:mg 3.8s ease-in-out infinite}
.door:hover::before,.door:focus-visible::before{opacity:1}
.door:focus-visible{outline:3px solid rgba(255,217,138,.8);outline-offset:4px}
#dMoon{left:7%;top:40%;width:27%;height:43%}
#dOut{left:54%;top:16%;width:45%;height:50%;border-radius:30%}
.plaque{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;pointer-events:none;
  padding:10px 20px 11px;border-radius:18px;background:linear-gradient(180deg,rgba(20,34,68,.9),rgba(9,18,40,.9));
  border:1px solid rgba(233,196,106,.45);box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.plaque b{display:block;font-size:clamp(20px,1.9vw,30px);font-weight:700;color:#ffe2a0;letter-spacing:.01em}
.plaque i{display:block;font-style:normal;font-size:clamp(13px,1vw,16px);color:#c9d7e8;margin-top:2px}
#dMoon .plaque{bottom:104%}
#dOut .plaque{top:104%;left:46%}
.zz{position:absolute;right:6%;top:-2%;font-weight:700;color:#d9e8ff;font-size:clamp(16px,1.6vw,26px);pointer-events:none;text-shadow:0 0 10px rgba(150,200,255,.7)}
.zz span{display:inline-block;animation:zz 3s ease-in-out infinite;opacity:0}
.zz span:nth-child(2){animation-delay:.6s;font-size:.8em}.zz span:nth-child(3){animation-delay:1.2s;font-size:.62em}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
.last{display:inline-block;margin-left:6px;font-size:.6em;vertical-align:middle;color:#ffd166}

.title{position:absolute;left:50%;top:calc(max(12vh,150px) - 30px);transform:translateX(-50%);text-align:center;pointer-events:none;width:min(560px,90vw)}
.title h1{margin:0;font-size:clamp(28px,3.4vw,50px);font-weight:700;color:#fff;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.35),0 8px 30px rgba(0,0,0,.6)}
.title p{margin:4px 0 0;font-size:clamp(15px,1.3vw,20px);color:#d5e3f3;text-shadow:0 2px 10px rgba(0,0,0,.8)}

/* door cards (tall screens only) */
.cards{display:none}
@media (max-aspect-ratio:5/4){
  .world{position:relative;inset:auto;min-height:100svh;display:flex;flex-direction:column}
  .stage{position:relative;left:auto;top:auto;transform:none;width:100%;flex:none;aspect-ratio:auto;height:min(66.67vw,40svh);background-position:center 62%}
  .door{display:none}
  .stage.zoomOut{transform:scale(1.9)}
  .plaque,.title{display:none}
  .zz{font-size:16px}
  .cards{display:flex;flex-direction:column;gap:14px;padding:16px 16px calc(18px + var(--k-safe-b));flex:1}
  .hint{margin:0;text-align:center;font-size:17px;font-weight:700;color:#e4eefa}
  .hint small{display:block;font-weight:400;font-size:14px;color:#a9bad0;margin-top:2px}
  .card{position:relative;flex:1;min-height:118px;display:flex;align-items:flex-end;border:0;padding:0;cursor:pointer;overflow:hidden;
    border-radius:24px;text-align:left;background-color:#0e1a36;background-image:url("kids-landing-sm.jpg");background-repeat:no-repeat;
    border:1px solid rgba(233,196,106,.38);box-shadow:0 12px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .15s}
  .card:active{transform:scale(.98)}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(5,12,30,.88) 92%)}
  .card .t{position:relative;z-index:1;padding:16px 18px}
  .card b{display:block;font-size:26px;font-weight:700;color:#ffe2a0}
  .card i{display:block;font-style:normal;font-size:15px;color:#d2dfee;margin-top:2px}
  .card .go{position:absolute;z-index:1;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
    background:linear-gradient(180deg,#ffe3a1,#e9b949);color:#3a2500;font-size:24px;font-weight:700;box-shadow:0 3px 0 #a97a1c}
  #cMoon{background-size:290% auto;background-position:5% 74%}
  #cOut{background-size:200% auto;background-position:100% 30%}
}
@media (min-aspect-ratio:5/4) and (max-height:520px){.title{display:none}.plaque{padding:6px 12px}#dMoon .plaque{bottom:auto;top:58%}}
@media (max-aspect-ratio:5/4) and (min-width:700px){
  .stage{height:min(66.67vw,46svh)}
  .cards{flex-direction:row;padding:24px}
  .hint{display:none}
  .card{min-height:300px}
  .card b{font-size:34px}.card i{font-size:18px}
  #cMoon{background-size:300% auto;background-position:4% 76%}
  #cOut{background-size:230% auto;background-position:100% 28%}
}

/* the sleeping moon (Moonlets is still waking up) */
.sleepMoon{display:block;width:120px;height:120px;margin:0 auto 6px}
.sleepMoon .zz2{animation:zz 3s ease-in-out infinite}
</style>
</head>
<body>
<main class="world">
  <div class="stage" id="stage">
    <!-- living details -->
    <i class="fx moonglow" style="left:13%;top:17.7%;background:radial-gradient(circle,rgba(120,170,255,.45),transparent 62%)"></i>
    <i class="fx moonglow" style="left:27.7%;top:14.5%;background:radial-gradient(circle,rgba(120,240,150,.42),transparent 62%);animation-delay:-1.2s"></i>
    <i class="fx moonglow" style="left:20.8%;top:27.4%;background:radial-gradient(circle,rgba(255,130,120,.4),transparent 62%);animation-delay:-2.4s"></i>
    <i class="fx moonglow" style="left:34.8%;top:27%;background:radial-gradient(circle,rgba(200,130,255,.42),transparent 62%);animation-delay:-3.6s"></i>
    <i class="fx star" style="left:44%;top:9%"></i><i class="fx star" style="left:52%;top:20%;animation-delay:-1s"></i>
    <i class="fx star" style="left:6%;top:6%;animation-delay:-2s"></i><i class="fx star" style="left:39%;top:36%;animation-delay:-.5s"></i>
    <i class="fx star" style="left:62%;top:4%;animation-delay:-2.6s"></i><i class="fx star" style="left:31%;top:5%;animation-delay:-1.7s"></i>
    <i class="fx lamp" style="left:10%;top:57.5%"></i><i class="fx lamp" style="left:34%;top:80.5%;animation-delay:-.9s"></i>
    <i class="fx lamp" style="left:15.7%;top:93%;animation-delay:-1.7s"></i><i class="fx lamp" style="left:95.7%;top:32%;animation-delay:-.4s;width:7%"></i>
    <i class="fx lamp" style="left:79.7%;top:56%;animation-delay:-2.1s;width:6%"></i>
    <i class="fx fly" style="left:40%;top:70%"></i><i class="fx fly" style="left:46%;top:58%;animation-delay:-3s"></i>
    <i class="fx fly" style="left:24%;top:76%;animation-delay:-6s"></i><i class="fx fly" style="left:70%;top:72%;animation-delay:-4.5s"></i>
    <i class="fx bub" style="left:36%;top:52%"></i><i class="fx bub" style="left:41%;top:64%;animation-delay:-6s;width:2.2%"></i>
    <i class="fx bub" style="left:30%;top:60%;animation-delay:-11s;width:2.6%"></i>

    <button class="door" id="dMoon" aria-label="Moonlets, the moon door">
      <span class="zz" aria-hidden="true"><span>z</span><span>z</span><span>z</span></span>
      <span class="plaque"><b>Moonlets<span class="last" data-last="moon"></span></b><i>Bubbles, colors and gentle games</i></span>
    </button>
    <button class="door" id="dOut" aria-label="The Outpost, the treehouse">
      <span class="plaque"><b>The Outpost<span class="last" data-last="out"></span></b><i>Puzzles, jokes, maps and experiments</i></span>
    </button>
    <div class="title"><h1>Kids' Corner</h1><p>Pick a door to explore!</p></div>
  </div>

  <div class="cards">
    <p class="hint">Welcome to the Kids' Corner!<small>Pick a door to explore.</small></p>
    <button class="card" id="cMoon">
      <span class="t"><b>Moonlets<span class="last" data-last="moon"></span></b><i>Bubbles, colors and gentle games</i></span><span class="go" aria-hidden="true">&rarr;</span>
    </button>
    <button class="card" id="cOut">
      <span class="t"><b>The Outpost<span class="last" data-last="out"></span></b><i>Puzzles, jokes, maps and experiments</i></span><span class="go" aria-hidden="true">&rarr;</span>
    </button>
  </div>
</main>

<script src="kids.js?v=1108e"></script>
<script>
(function(){
  var OUTPOST_OPEN = true;    // outpost.html is built (Nov 6)
  BWK.lines({"intro-home":"Welcome to the Kids' Corner! Tap the moon door for Moonlets, or climb up to The Outpost treehouse."});
  BWK.init({here:"home", voice:"jo", intro:"Welcome to the Kids' Corner! Tap the moon door for Moonlets, or climb up to The Outpost treehouse."});

  var last = BWK.store.get("door","");
  if(last) [].forEach.call(document.querySelectorAll('[data-last="'+last+'"]'),function(s){ s.textContent="★"; s.title="Last time"; });

  function moon(){
    BWK.store.set("door","moon");
    var box=BWK.sheet('<h2 style="text-align:center">Moonlets is still waking up</h2><div id="kFinnHere"></div>'+
      '<div class="k-row" style="justify-content:center"><button class="k-btn" id="kOkM">Okay!</button></div>');
    document.getElementById("kOkM").onclick=function(){BWK.closeSheet();};
    BWK.finn("Hi, {name}! I'm Finn, the guide moon. I'm getting the meadow ready for you. Come back soon!", {into:document.getElementById("kFinnHere"), clip:"door-waking"});
  }
  function outpost(){
    BWK.store.set("door","out");
    if(!OUTPOST_OPEN){
      BWK.sfx("chime");
      BWK.sheet('<h2>The Outpost</h2><p>The crew is still building the treehouse: a lab, a telescope, a joke shack, a workshop and mission control.</p><p>Its door opens very soon!</p>'+
        '<div class="k-row"><button class="k-btn" id="kOkO">Can\'t wait!</button></div>');
      document.getElementById("kOkO").onclick=function(){BWK.closeSheet();};
      BWK.say("The crew is still building the treehouse. Its door opens very soon!");
      return;
    }
    BWK.sfx("whoosh");
    var st=document.getElementById("stage"); st.style.transformOrigin="80% 38%"; st.classList.add("zoomOut");
    setTimeout(function(){ location.href="outpost.html"; },850);
  }
  document.getElementById("dMoon").onclick=moon; document.getElementById("cMoon").onclick=moon;
  document.getElementById("dOut").onclick=outpost; document.getElementById("cOut").onclick=outpost;
  window.addEventListener("pageshow",function(){ document.getElementById("stage").classList.remove("zoomOut"); });
})();
</script>
</body>
</html>
