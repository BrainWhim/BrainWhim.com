<style>
:root{--navy:#1A2744;--whim:#7EB6D9}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:Montserrat,sans-serif;color:#1A2744;background:#c9b48a url("morris-cloister.jpg") center/cover no-repeat fixed}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 4% 8px;background:var(--navy);min-height:72px}
.brand{display:flex;align-items:center;color:#fff;text-decoration:none;font-size:26px}
.brand img{width:72px;height:72px;object-fit:contain;margin-right:-8px}
.whim{font-family:Pacifico,cursive;color:var(--whim);font-size:1em;line-height:1;font-weight:400}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:16px}
.hdr a{color:#fff;font-weight:700;font-size:15px;text-decoration:none;margin-left:0}
.games{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:8px auto 6px;max-width:640px;padding:6px 8px;background:rgba(255,252,247,.78);border-radius:16px;backdrop-filter:blur(8px)}
.games a{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:5px 9px;font-weight:700;font-size:11px;text-decoration:none;color:#1A2744}
.games a.on{background:#1A2744;color:#fff;border-color:#1A2744}
.wrap{max-width:520px;margin:0 auto;padding:4px 10px 80px}
.hud{max-width:360px;margin:8px auto;background:rgba(255,252,247,.92);border-radius:999px;padding:6px 12px}
.meta,.msg{text-align:center;font-size:12px;margin:0 0 2px;color:#1A2744}
.stage{perspective:1100px;padding:6px 4px}
.frame{transform:rotateX(12deg);transform-origin:50% 90%;padding:12px;border-radius:8px;background:linear-gradient(160deg,#ece6dc,#cfc6b8 40%,#9a9084);box-shadow:0 22px 34px rgba(0,0,0,.3),0 6px 0 #7a7368}
.board{position:relative;background:linear-gradient(160deg,#4a5564,#2c3542);border-radius:4px;aspect-ratio:1;box-shadow:inset 0 0 0 3px #d7d2c8}
.board svg{position:absolute;inset:8%;width:84%;height:84%}
.pt{position:absolute;width:11%;height:11%;border:0;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;background:#c8c2b6;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.pt.p1{background:radial-gradient(circle at 32% 28%,#7eb6d9,#1A2744)}
.pt.p2{background:radial-gradient(circle at 32% 28%,#fff6d8,#e8c15a 40%,#8a6a20)}
.pt.ok{box-shadow:0 0 0 3px #fff3b0}
.pt.sel{box-shadow:0 0 0 3px #7EB6D9}
.row{display:flex;gap:8px;justify-content:center;position:fixed;left:0;right:0;bottom:10px;z-index:6}
.btn{border:0;border-radius:999px;padding:8px 14px;background:#fff;color:#1A2744;font-weight:700;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.16)}
@media(max-width:700px){header{padding:6px 10px}.brand{font-size:18px}}
</style>
</head>
<body>
<header>
<a class="brand" href="tables.html"><img src="logo-image.png" alt=""><span>Brain</span><span class="whim">Whim</span></a>
<nav class="hdr"><a href="tables.html">Tables</a><a href="morris.html">House</a><a href="play.html">Play</a><a href="cards.html">Cards</a><a href="index.html">Home</a></nav>
</header>

<div class="wrap">
  <div class="hud">
    <p class="meta"><span id="codeLab">Online table</span> · <span id="seatLab">…</span></p>
    <p class="msg" id="msg">Connecting…</p>
  </div>
  <div class="stage"><div class="frame"><div class="board" id="board"></div></div></div>
  <div class="row"><a class="btn" href="tables.html">Return to tables</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="play-config.js"></script>
<script src="play-rooms.js"></script>
<script>
var sb, room, me, mySide=null;
var XY=[[0,0],[3,0],[6,0],[1,1],[3,1],[5,1],[2,2],[3,2],[4,2],[0,3],[1,3],[2,3],[4,3],[5,3],[6,3],[2,4],[3,4],[4,4],[1,5],[3,5],[5,5],[0,6],[3,6],[6,6]];
var NB=[[1,9],[0,2,4],[1,14],[4,10],[1,3,5,7],[4,13],[7,11],[4,6,8,16],[7,12],[0,10,21],[3,9,11,18],[6,10,15],[8,13,17],[5,12,14,20],[2,13,23],[11,16],[7,15,17,19],[12,16],[10,19],[16,18,20,22],[13,19],[9,22],[19,21,23],[14,22]];
var MILLS=[[0,1,2],[3,4,5],[6,7,8],[15,16,17],[18,19,20],[21,22,23],[0,9,21],[3,10,18],[6,11,15],[8,12,17],[5,13,20],[2,14,23],[9,10,11],[12,13,14],[1,4,7],[16,19,22]];
var board, placed, turn, phase, sel, removeMode, over;
var CODE=(location.search.match(/code=([A-Za-z0-9]+)/)||[])[1];
function setMsg(t){ document.getElementById("msg").textContent=t; }
function startMo(){ return {board:Array(24).fill(0), placed:{1:0,2:0}, turn:1, phase:"place", remove:false, over:false, last:null}; }
function snapshot(){ return {board:board.slice(), placed:{1:placed[1],2:placed[2]}, turn:turn, phase:phase, remove:removeMode, over:over, last:sel}; }
function applySnap(s){
  if(!s||!s.board) s=startMo();
  board=s.board.slice(); placed={1:(s.placed&&s.placed[1])||0,2:(s.placed&&s.placed[2])||0};
  turn=s.turn||1; phase=s.phase||"place"; removeMode=!!s.remove; over=!!s.over; sel=-1;
}
function count(p){ var n=0,i; for(i=0;i<24;i++) if(board[i]===p) n++; return n; }
function inMill(i,p){ return MILLS.some(function(m){ return m.indexOf(i)>=0 && m.every(function(x){return board[x]===p;}); }); }
function canTake(p){
  var anyFree=false,i,out=[];
  for(i=0;i<24;i++) if(board[i]===p && !inMill(i,p)) anyFree=true;
  for(i=0;i<24;i++) if(board[i]===p && (!anyFree || !inMill(i,p))) out.push(i);
  return out;
}
function moves(p){
  var fly=count(p)===3 && placed[1]>=9 && placed[2]>=9, m=[],i;
  for(i=0;i<24;i++) if(board[i]===p){
    var dests=fly?board.map(function(v,idx){return v===0?idx:-1;}).filter(function(x){return x>=0;}):NB[i].filter(function(j){return board[j]===0;});
    dests.forEach(function(j){ m.push([i,j]); });
  }
  return m;
}
function turnMsg(){
  if(!room||!room.guest) return "Waiting for someone to sit…";
  if(over) return turn===mySide?"You win.":"Opponent wins.";
  if(turn!==mySide) return "Opponent to play.";
  if(removeMode) return "Mill. Take an opposing stone.";
  if(phase==="place") return "Place a stone on an empty point.";
  return sel>=0?"Slide to a lit point.":"Select one of your stones.";
}
function paint(){
  var svg='<svg viewBox="0 0 6 6" fill="none" stroke="#d7d2c8" stroke-width=".08"><rect x="0" y="0" width="6" height="6"/><rect x="1" y="1" width="4" height="4"/><rect x="2" y="2" width="2" height="2"/><line x1="3" y1="0" x2="3" y2="2"/><line x1="3" y1="4" x2="3" y2="6"/><line x1="0" y1="3" x2="2" y2="3"/><line x1="4" y1="3" x2="6" y2="3"/></svg>';
  var html=svg, ok=[], i;
  if(mySide && turn===mySide && !over){
    if(removeMode) ok=canTake(3-mySide);
    else if(phase==="place"){ for(i=0;i<24;i++) if(board[i]===0) ok.push(i); }
    else if(sel>=0){
      var fly=count(mySide)===3 && placed[1]>=9 && placed[2]>=9;
      ok=fly?board.map(function(v,idx){return v===0?idx:-1;}).filter(function(x){return x>=0;}):NB[sel].filter(function(j){return board[j]===0;});
    }
  }
  for(i=0;i<24;i++){
    var left=(XY[i][0]/6*100)+"%", top=(XY[i][1]/6*100)+"%";
    var cls="pt"+(board[i]===1?" p1":board[i]===2?" p2":"")+(ok.indexOf(i)>=0?" ok":"")+(sel===i?" sel":"");
    html+='<button class="'+cls+'" style="left:'+left+';top:'+top+'" type="button" onclick="tap('+i+')"></button>';
  }
  document.getElementById("board").innerHTML=html;
}
async function pushState(){
  if(!room) return;
  await sb.from("rooms").update({state:snapshot(), status:over?"done":"live", updated_at:new Date().toISOString()}).eq("id", room.id);
}
function after(i){
  if(inMill(i,mySide)){ removeMode=true; setMsg(turnMsg()); paint(); pushState(); return; }
  endTurn();
}
function endTurn(){
  if(placed[1]>=9 && placed[2]>=9){
    phase="move";
    if(count(3-mySide)<3 || !moves(3-mySide).length){ over=true; turn=mySide; setMsg("You win."); paint(); pushState(); return; }
    if(count(mySide)<3 || !moves(mySide).length){ over=true; turn=3-mySide; setMsg("Opponent wins."); paint(); pushState(); return; }
  }
  turn=3-mySide; sel=-1; removeMode=false;
  setMsg(turnMsg()); paint(); pushState();
}
function tap(i){
  if(over||!mySide||turn!==mySide) return;
  if(removeMode){
    if(canTake(3-mySide).indexOf(i)<0) return;
    board[i]=0; removeMode=false; endTurn(); return;
  }
  if(phase==="place"){
    if(board[i]!==0||placed[mySide]>=9) return;
    board[i]=mySide; placed[mySide]++; after(i); return;
  }
  if(sel<0){ if(board[i]!==mySide) return; sel=i; paint(); return; }
  if(i===sel){ sel=-1; paint(); return; }
  var fly=count(mySide)===3 && placed[1]>=9 && placed[2]>=9;
  if(!(board[i]===0 && (fly || NB[sel].indexOf(i)>=0))){ sel=-1; paint(); return; }
  board[sel]=0; board[i]=mySide; sel=-1; after(i);
}
async function boot(){
  var online=/(?:^|[?&])online=1/.test(location.search);
  document.getElementById("codeLab").textContent=online?"Online table":("Table "+(CODE||"—"));
  var cfg=window.BW_PLAY||{};
  if(!CODE||!cfg.url){ setMsg("Missing table code or play-config.js"); return; }
  sb=supabase.createClient(cfg.url, cfg.anonKey);
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ setMsg("Sign in on Tables first."); return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code", CODE).single();
  if(q.error){ setMsg(q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==='function' && bwSendToGame(bwGuessGame(room), CODE)) return;
  if(room.host===me) mySide=1;
  else if(room.guest===me) mySide=2;
  else if(!room.guest){
    var u=await sb.from("rooms").update({guest:me, status:"live"}).eq("id", room.id).select().single();
    if(!u.error){ room=u.data; mySide=2; }
  }
  document.getElementById("seatLab").textContent=mySide===1?"You are cobalt": mySide===2?"You are ivory":"Watching";
  applySnap(room.state && room.state.board ? room.state : startMo());
  setMsg(turnMsg()); paint();
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE", schema:"public", table:"rooms", filter:"code=eq."+CODE}, function(payload){
    room=payload.new;
    applySnap(room.state);
    if(room.guest) document.getElementById("seatLab").textContent=mySide===1?"You are cobalt": mySide===2?"You are ivory":"Watching";
    setMsg(turnMsg()); paint();
  }).subscribe();
}
boot();
</script>
</body>
