<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shut the Box table · BrainWhim</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A2744;--whim:#7EB6D9}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:Montserrat,sans-serif;color:#1A2744;
background:#c4a878 url("shutbox-tavern.jpg") center/cover no-repeat fixed}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 4% 8px;background:var(--navy);min-height:72px;position:relative;z-index:2}
.brand{display:flex;align-items:center;color:#fff;text-decoration:none;font-size:26px}
.brand img{width:72px;height:72px;object-fit:contain;margin-right:-8px}
.whim{font-family:Pacifico,cursive;color:var(--whim);font-size:1em;line-height:1;font-weight:400}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:16px}
.hdr a{color:#fff;font-weight:700;font-size:15px;text-decoration:none;margin-left:0}
.games{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:8px auto 6px;max-width:640px;padding:6px 8px;background:rgba(255,252,247,.78);border-radius:16px}
.games a{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:5px 9px;font-weight:700;font-size:11px;text-decoration:none;color:#1A2744}
.games a.on{background:#1A2744;color:#fff}
.wrap{max-width:640px;margin:0 auto;padding:4px 10px 88px}
.hud{max-width:420px;margin:8px auto;background:rgba(255,252,247,.92);border-radius:999px;padding:6px 12px}
.meta,.msg{text-align:center;font-size:12px;margin:0 0 2px}
.frame{padding:12px;border-radius:14px;background:linear-gradient(160deg,#f3e2c4,#d7b07a 40%,#a07840)}
.boxin{background:linear-gradient(180deg,#eef6ea,#d5e4d0);padding:14px;border-radius:10px}
.tiles{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:12px}
.tile{border:0;border-radius:8px;min-height:64px;cursor:pointer;font-family:inherit;font-weight:800;font-size:18px;background:linear-gradient(#fff8e6,#e8d2a0);color:#3a2410;box-shadow:0 4px 0 #8a6a2e}
.tile.on{outline:3px solid #e8c15a;transform:translateY(-3px)}
.tile.shut{background:linear-gradient(#3a2410,#1a1008);color:#6a5030;cursor:default}
.dice{display:flex;justify-content:center;gap:10px;margin:8px 0}
.die{width:48px;height:48px;border-radius:10px;background:#fffef8;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;box-shadow:0 4px 0 #8a6e3e}
.score{display:flex;gap:8px}
.score div{flex:1;background:#1A2744;border-radius:8px;padding:8px;text-align:center;color:#fff;font-size:12px}
.score b{display:block;font-size:18px;color:#e8c15a}
.acts{display:flex;justify-content:center;gap:8px;margin-top:10px}
.acts button{border:0;border-radius:999px;padding:8px 14px;background:#1A2744;color:#fff;font-weight:700}
.foot{display:flex;justify-content:center;position:fixed;left:0;right:0;bottom:10px}
.foot a{border-radius:999px;padding:8px 14px;background:#fff;color:#1A2744;font-weight:700;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.16)}
@media(max-width:700px){
header{display:grid;grid-template-columns:1fr auto;height:auto;min-height:0;padding:6px 10px 8px}
.brand{font-size:18px;grid-column:1;grid-row:1}
.brand img{width:48px;height:48px}
.hdr{grid-column:1 / -1;grid-row:2;justify-content:center;width:100%;padding-top:4px;gap:12px}
.hdr a{font-size:13px;margin-left:0}
.tile{min-height:48px;font-size:16px}
}
</style>
</head>
<body>
<header>
<a class="brand" href="tables.html"><img src="logo-image.png" alt=""><span>Brain</span><span class="whim">Whim</span></a>
<nav class="hdr"><a href="tables.html">Tables</a><a href="shutbox.html">House</a><a href="play.html">Play</a><a href="cards.html">Cards</a><a href="index.html">Home</a></nav>
</header>
<div class="games">
<a href="checkers.html">Checkers</a><a href="chess.html">Chess</a><a href="backgammon.html">Backgammon</a>
<a href="yahtzee.html">Yahtzee</a><a href="dominoes.html">Dominoes</a><a href="othello.html">Othello</a>
<a href="mancala.html">Mancala</a><a href="cribbage.html">Cribbage</a><a class="on" href="shutbox.html">Shut the Box</a><a href="morris.html">Morris</a>
</div>
<div class="wrap">
  <div class="hud">
    <p class="meta"><span id="codeLab">Online table</span> · <span id="seatLab">…</span></p>
    <p class="msg" id="msg">Connecting…</p>
  </div>
  <div class="frame"><div class="boxin">
    <div class="tiles" id="tiles"></div>
    <div class="dice"><div class="die" id="d1">·</div><div class="die" id="d2">·</div></div>
    <div class="score">
      <div>You<b id="ys">—</b></div>
      <div>Opp<b id="os">—</b></div>
      <div>Need<b id="need">—</b></div>
    </div>
    <div class="acts">
      <button type="button" onclick="roll()">Roll</button>
      <button type="button" onclick="shut()">Shut tiles</button>
    </div>
  </div></div>
  <div class="foot"><a href="tables.html">Return to tables</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="play-config.js"></script>
<script src="play-rooms.js"></script>
<script>
var sb, room, me, mySide=null;
var open=[1,2,3,4,5,6,7,8,9], pick=[], dice=[0,0], need=0, turn=1, score1=null, score2=null, rolled=false, over=false;
var CODE=(location.search.match(/code=([A-Za-z0-9]+)/)||[])[1];
function setMsg(t){ document.getElementById("msg").textContent=t; }
function startSb(){ return {game:"shutbox", open:[1,2,3,4,5,6,7,8,9], pick:[], dice:[0,0], need:0, turn:1, score1:null, score2:null, rolled:false, over:false}; }
function snapshot(){ return {game:"shutbox", open:open.slice(), pick:pick.slice(), dice:dice.slice(), need:need, turn:turn, score1:score1, score2:score2, rolled:rolled, over:over}; }
function applySnap(s){
  if(!s||s.game!=="shutbox"&&!s.open) s=startSb();
  open=(s.open||[1,2,3,4,5,6,7,8,9]).slice(); pick=(s.pick||[]).slice(); dice=(s.dice||[0,0]).slice();
  need=s.need||0; turn=s.turn||1; score1=s.score1; score2=s.score2; rolled=!!s.rolled; over=!!s.over;
}
function sumOpen(){ return open.reduce(function(a,b){return a+b;},0); }
function oneDieOk(){ return [7,8,9].every(function(n){return open.indexOf(n)<0;}); }
function canMake(target, tiles){
  function rec(i,left){
    if(left===0) return true;
    if(i>=tiles.length||left<0) return false;
    return rec(i+1,left-tiles[i])||rec(i+1,left);
  }
  return rec(0,target);
}
function myScore(){ return mySide===1?score1:score2; }
function oppScore(){ return mySide===1?score2:score1; }
function turnMsg(){
  if(!room||!room.guest) return "Waiting for someone to sit…";
  if(over){
    var a=score1,b=score2;
    if(a===b) return "Draw "+a+"–"+b+".";
    if((mySide===1&&a<b)||(mySide===2&&b<a)) return "You win "+Math.min(a,b)+"–"+Math.max(a,b)+".";
    return "Opponent wins "+Math.min(a,b)+"–"+Math.max(a,b)+".";
  }
  if(turn!==mySide) return "Opponent’s box.";
  if(!rolled) return "Roll. Shut tiles that add to the dice.";
  return "Shut tiles that add to "+need+".";
}
function paint(){
  var h="",n;
  for(n=1;n<=9;n++){
    var down=open.indexOf(n)<0, on=pick.indexOf(n)>=0;
    h+='<button class="tile'+(down?" shut":"")+(on?" on":"")+'" type="button" onclick="toggle('+n+')">'+n+"</button>";
  }
  document.getElementById("tiles").innerHTML=h;
  document.getElementById("d1").textContent=dice[0]||"·";
  document.getElementById("d2").textContent=dice[1]||"·";
  document.getElementById("ys").textContent=myScore()==null?"—":myScore();
  document.getElementById("os").textContent=oppScore()==null?"—":oppScore();
  document.getElementById("need").textContent=need||"—";
}
async function pushState(){ if(!room) return; await sb.from("rooms").update({state:snapshot(), status:over?"done":"live", updated_at:new Date().toISOString()}).eq("id", room.id); }
function endTurnScore(){
  var sc=sumOpen();
  if(turn===1) score1=sc; else score2=sc;
  if(score1!=null && score2!=null){ over=true; return; }
  turn=3-turn; open=[1,2,3,4,5,6,7,8,9]; pick=[]; dice=[0,0]; need=0; rolled=false;
}
function roll(){
  if(over||!mySide||turn!==mySide||rolled) return;
  var n=oneDieOk()?1:2;
  dice[0]=1+Math.floor(Math.random()*6);
  dice[1]=n===2?1+Math.floor(Math.random()*6):0;
  need=dice[0]+dice[1]; pick=[]; rolled=true;
  if(!canMake(need,open)) endTurnScore();
  setMsg(turnMsg()); paint(); pushState();
}
function toggle(n){
  if(over||!mySide||turn!==mySide||!rolled||open.indexOf(n)<0) return;
  var i=pick.indexOf(n); if(i>=0) pick.splice(i,1); else pick.push(n);
  paint(); pushState();
}
function shut(){
  if(over||!mySide||turn!==mySide||!rolled) return;
  var s=pick.reduce(function(a,b){return a+b;},0);
  if(s!==need||!pick.length){ setMsg("Those tiles must add to "+need+"."); return; }
  pick.forEach(function(n){ open=open.filter(function(x){return x!==n;}); });
  pick=[]; rolled=false; need=0; dice=[0,0];
  if(!open.length){ if(turn===1) score1=0; else score2=0; if(score1!=null&&score2!=null) over=true; else { turn=3-turn; open=[1,2,3,4,5,6,7,8,9]; } }
  setMsg(turnMsg()); paint(); pushState();
}
async function boot(){
  var online=/(?:^|[?&])online=1/.test(location.search);
  document.getElementById("codeLab").textContent=online?"Online table":("Table "+(CODE||"—"));
  var cfg=window.BW_PLAY||{};
  if(!CODE||!cfg.url){ setMsg("Missing table code or play-config.js"); return; }
  sb=supabase.createClient(cfg.url, cfg.anonKey);
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ setMsg("Sign in on Tables first."); return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code", CODE).single();
  if(q.error){ setMsg(q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==="function" && bwSendToGame(bwGuessGame(room), CODE)) return;
  if(room.host===me) mySide=1;
  else if(room.guest===me) mySide=2;
  else if(!room.guest){
    var u=await sb.from("rooms").update({guest:me, status:"live"}).eq("id", room.id).select().single();
    if(!u.error){ room=u.data; mySide=2; }
  }
  document.getElementById("seatLab").textContent=mySide===1?"You roll first": mySide===2?"Opponent rolls first":"Watching";
  applySnap(room.state && room.state.open ? room.state : startSb());
  setMsg(turnMsg()); paint();
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE", schema:"public", table:"rooms", filter:"code=eq."+CODE}, function(payload){
    room=payload.new; applySnap(room.state); setMsg(turnMsg()); paint();
  }).subscribe();
}
boot();
</script>
</body>
</html>
