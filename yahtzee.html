<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yahtzee · BrainWhim Play</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A2744;--whim:#7EB6D9}
*{box-sizing:border-box}
html,body{min-height:100%;min-height:100dvh}
body{
  margin:0;font-family:Montserrat,sans-serif;color:var(--navy);
  background-color:#8a6a48;
  background-image:url("yahtzee-parlor.jpg");
  background-size:cover;background-position:center 36%;background-repeat:no-repeat;background-attachment:scroll
}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 4% 8px;background:var(--navy);min-height:72px;position:relative;z-index:2}
.brand{display:flex;align-items:center;color:#fff;text-decoration:none;font-size:26px}
.brand img{width:72px;height:72px;object-fit:contain;margin-right:-8px}
.whim{font-family:Pacifico,cursive;color:var(--whim);font-size:1.1em}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
.hdr a{color:#fff;font-weight:700;font-size:15px;text-decoration:none;margin-left:8px}

.games{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px auto 10px;max-width:520px;padding:0 12px;position:relative;z-index:2}
.games a{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:12px;text-decoration:none;color:var(--navy)}
.games a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sitbar{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;position:relative;z-index:2}
.sitbar button,.sitbar a.stand{
  border:0;border-radius:999px;padding:10px 18px;background:#fff;color:var(--navy);
  font-weight:700;font-size:14px;line-height:1.2;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 20px rgba(0,0,0,.18);text-decoration:none;display:inline-flex;align-items:center
}
body.seated .sitbar .sit{display:none}
body:not(.seated) .sitbar .stand{display:none}
body:not(.seated) .live{display:none}
body.seated .live{display:block}
body.seated 
.games{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px auto 10px;max-width:520px;padding:0 12px;position:relative;z-index:2}
.games a{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:12px;text-decoration:none;color:var(--navy)}
.games a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sitbar{position:fixed;left:0;right:0;bottom:10px;z-index:6;margin:0}
.live{max-width:1180px;margin:8px auto 88px;padding:8px 10px 16px;background:transparent}
h1{text-align:center;margin:4px 0 2px;font-size:22px;color:#1A2744;background:rgba(255,252,247,.82);display:inline-block;padding:4px 14px;border-radius:999px}
.sub{text-align:center;color:#3a2a12;font-size:13px;margin:0 0 10px}
.titlewrap{text-align:center}
.stage{display:grid;grid-template-columns:210px minmax(280px,420px) 210px;gap:12px;align-items:start;justify-content:center}
@media(max-width:900px){
  .stage{grid-template-columns:1fr}
  header{display:grid;grid-template-columns:1fr auto;height:auto;padding:6px 10px 8px}
  .brand{font-size:18px}
  .brand img{width:48px;height:48px}
  .hdr{grid-column:1/-1;justify-content:center;padding-top:4px}
  .hdr a{font-size:13px;margin-left:8px}
}
.boardwrap{perspective:900px;padding:8px 8px 0}
.board{
  transform:rotateX(16deg) scale(1.02);transform-origin:50% 60%;
  background:
    linear-gradient(180deg,#6b4220,#3b2412);
  padding:16px 16px 20px;border-radius:8px;
  box-shadow:0 0 0 3px #c9a45a,0 0 0 6px #8a6a2e,0 22px 36px rgba(0,0,0,.35)
}
.felt{
  position:relative;height:320px;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.08),transparent 50%),
    linear-gradient(180deg,#2f6a3e,#1b3f26);
  border:3px solid #d7b56a;border-radius:4px;
  box-shadow:inset 0 0 28px rgba(0,0,0,.28)
}
.dicebox{position:absolute;inset:8px}
.die{
  position:absolute;width:52px;height:52px;border-radius:10px;padding:6px;border:0;cursor:pointer;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;
  background:linear-gradient(145deg,#fffdf6,#e8d7b0);box-shadow:3px 5px 0 #8a6e3e,0 8px 14px rgba(0,0,0,.25);
  transition:left .55s cubic-bezier(.2,.7,.2,1), top .55s cubic-bezier(.2,.7,.2,1), transform .55s ease;
  z-index:2
}
.die.held{outline:3px solid #C9A227;z-index:3}
.die.tumble{animation:tumble .7s ease}
@keyframes tumble{
  0%{transform:rotate(0) scale(1)}
  25%{transform:rotate(80deg) scale(1.12)}
  50%{transform:rotate(-50deg) scale(.92)}
  75%{transform:rotate(30deg) scale(1.06)}
  100%{transform:rotate(0) scale(1)}
}
.die i{width:7px;height:7px;border-radius:50%;margin:auto;background:#1a1008;opacity:0}
.die[data-n="1"] i:nth-child(5){opacity:1}
.die[data-n="2"] i:nth-child(1),.die[data-n="2"] i:nth-child(9){opacity:1}
.die[data-n="3"] i:nth-child(1),.die[data-n="3"] i:nth-child(5),.die[data-n="3"] i:nth-child(9){opacity:1}
.die[data-n="4"] i:nth-child(1),.die[data-n="4"] i:nth-child(3),.die[data-n="4"] i:nth-child(7),.die[data-n="4"] i:nth-child(9){opacity:1}
.die[data-n="5"] i:nth-child(1),.die[data-n="5"] i:nth-child(3),.die[data-n="5"] i:nth-child(5),.die[data-n="5"] i:nth-child(7),.die[data-n="5"] i:nth-child(9){opacity:1}
.die[data-n="6"] i:nth-child(1),.die[data-n="6"] i:nth-child(3),.die[data-n="6"] i:nth-child(4),.die[data-n="6"] i:nth-child(6),.die[data-n="6"] i:nth-child(7),.die[data-n="6"] i:nth-child(9){opacity:1}

.bgcup{position:relative;right:auto;top:auto;width:58px;height:70px;border:0;background:transparent;cursor:pointer;flex:0 0 58px}
.bgcup-body{position:absolute;left:8px;right:8px;top:18px;bottom:4px;border-radius:8px 8px 18px 18px;
  background:radial-gradient(ellipse at 30% 18%,rgba(255,248,220,.55),transparent 46%),linear-gradient(90deg,#c9a45a,#efe0b0 20%,#d4b56e 48%,#f3e6c0 78%,#b8893a);
  box-shadow:0 10px 16px rgba(0,0,0,.28)}
.bgcup-rim{position:absolute;left:4px;right:4px;top:8px;height:22px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,#f7edd0 28%,#d4b56e 70%);
  box-shadow:0 0 0 3px #f3e6c0,0 0 0 5px #b8893a}
.bgcup-label{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:11px;font-weight:800;color:#3a2a12}
.bgcup.shake .bgcup-body,.bgcup.shake .bgcup-rim{animation:cupShake .55s ease}
@keyframes cupShake{0%{transform:rotate(-8deg)}25%{transform:rotate(14deg)}50%{transform:rotate(-12deg)}100%{transform:none}}
.feltbar{position:absolute;left:0;right:0;top:10px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:5;pointer-events:none}
.feltbar .hint,.feltbar .bgcup{pointer-events:auto}
.hint{position:static;margin:0;max-width:none;text-align:center;color:#1A2744;font-size:12px;line-height:1.25;background:rgba(255,252,247,.92);display:inline-block;padding:8px 16px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.padwrap{position:relative}
.pad{
  background:#f7f1e2;border:8px solid #1A2744;border-radius:4px;
  box-shadow:0 10px 22px rgba(0,0,0,.22), inset 0 0 0 2px #c9a45a;
  padding:10px 10px 14px;min-height:280px
}
.pad.house{border-color:#3a2412}
.pad h2{margin:0 0 8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 36px 42px;align-items:center;column-gap:6px;padding:3px 0;border-bottom:1px dashed #d2c4a6;font-size:12px}
.pad.house .row{grid-template-columns:1fr 36px}
.row button{border:0;background:#1A2744;color:#fff;border-radius:999px;padding:2px 8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:11px}
.row button[disabled]{opacity:.35;cursor:default}
.row .val{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.total{font-weight:800;padding-top:6px;border-bottom:0}
.pencil{
  position:absolute;right:-18px;top:40px;width:14px;height:110px;border-radius:3px 3px 2px 2px;
  background:linear-gradient(90deg,#e8c15a,#f3e0a0 40%,#c9a227);
  box-shadow:2px 4px 6px rgba(0,0,0,.25);transform:rotate(12deg);pointer-events:none
}
.pencil::before{content:"";position:absolute;top:-10px;left:0;right:0;height:12px;background:#f4d7c4;clip-path:polygon(50% 0,100% 100%,0 100%)}
.pencil::after{content:"";position:absolute;bottom:-8px;left:2px;right:2px;height:10px;background:#c9c4bc;border-radius:0 0 2px 2px}

#winveil{position:fixed;inset:0;background:rgba(12,18,32,.46);display:none;align-items:center;justify-content:center;z-index:90;backdrop-filter:blur(4px)}
#winveil.on{display:flex}
.wincard{position:relative;overflow:hidden;width:min(420px,90vw);text-align:center;padding:28px 22px 22px;border-radius:22px;
  background:linear-gradient(180deg,#fffdf8,#f3ead6);color:#1A2744;
  box-shadow:0 0 0 3px #c9a45a,0 0 0 7px #1A2744,0 28px 50px rgba(0,0,0,.35);
  animation:winPop .45s ease}
#winveil.win .wincard{animation:winBurst .7s cubic-bezier(.15,1.4,.3,1);box-shadow:0 0 0 3px #e8c15a,0 0 0 8px #1A2744,0 0 40px rgba(201,162,39,.55),0 28px 50px rgba(0,0,0,.35)}
.wincard h2{margin:0 0 16px;font-size:28px;letter-spacing:.02em;line-height:1.25}
#winveil.win .wincard h2{color:#8a6a18}
.wincard p{display:none}
.wincard .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.wincard button,.wincard a{border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.wincard .go{background:#1A2744;color:#fff}
.wincard .ghost{background:#fff;color:#1A2744;box-shadow:inset 0 0 0 1px #d7c9b0}
#winveil.win .spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#e8c15a;opacity:0;animation:spark 1.1s ease-out forwards}
@keyframes winPop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes winBurst{0%{transform:scale(.4) rotate(-6deg);opacity:0}55%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes spark{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}

</style>
</head>

</header>

<button class="sit" type="button" onclick="sitDown()">Sit down to play</button>
<button class="stand" type="button" onclick="standUp()">Back to the parlor</button>
<a class="stand" href="tables.html">Return to tables</a>

</div>
<div class="live">
  <div class="titlewrap"><h1>Club Yahtzee</h1></div>
  <p class="sub">You shake first. The house keeps its own pad.</p>
  <div class="stage">
    <div class="padwrap">
      <div class="pad house" id="housePad"></div>
      <div class="pencil"></div>
    </div>
    <div>
      <div class="boardwrap">
        <div class="board">
          <div class="felt">
            <div class="feltbar">
            <p class="hint" id="msg">Shake to start your turn</p>
            <button class="bgcup" id="cup" type="button" onclick="roll()">
              <span class="bgcup-rim"></span><span class="bgcup-body"></span>
              <span class="bgcup-label">Shake</span>
            </button>
            </div>
            <div class="dicebox" id="dice"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="padwrap">
      <div class="pad" id="youPad"></div>
      <div class="pencil"></div>
    </div>
  </div>
</div>

<div id="winveil" onclick="if(event.target.id==='winveil')hideBanner()">
  <div class="wincard">
    <h2 id="winTitle">Congratulations! You win!</h2>
    <p id="winSub"></p>
    <div class="row">
      <button class="go" type="button" id="winAgain">Play again?</button>
      <a class="ghost" href="tables.html">Return to Tables</a>
    </div>
  </div>
</div>
</div>

<script>

function hideBanner(){ var v=document.getElementById("winveil"); if(v) v.className=""; }
function showBanner(title, sub, again, kind){
  var v=document.getElementById("winveil");
  if(!v) return;
  var raw=((title||"")+" "+(sub||"")).toLowerCase();
  if(!kind){
    kind = /house wins|closed the net|ivory wins|library|better luck|black checkmate|ivory connects/.test(raw) ? "lose" : /draw|tie/.test(raw) ? "draw" : "win";
  }
  var headline;
  if(kind==="lose") headline="Better luck next time!";
  else if(kind==="draw") headline="It's a Draw!";
  else if(/checkmate/.test(raw)) headline="Congratulations! Checkmate!";
  else headline="Congratulations! You win!";
  document.getElementById("winTitle").textContent=headline;
  document.getElementById("winSub").textContent="";
  var b=document.getElementById("winAgain");
  b.onclick=function(){ hideBanner(); if(again) again(); };
  v.className="on "+kind;
  v.querySelectorAll(".spark").forEach(function(n){ n.remove(); });
  if(kind==="win"){
    for(var i=0;i<16;i++){
      var s=document.createElement("span"); s.className="spark";
      s.style.left="50%"; s.style.top="38%";
      var ang=Math.random()*Math.PI*2, dist=40+Math.random()*120;
      s.style.setProperty("--x",(Math.cos(ang)*dist)+"px");
      s.style.setProperty("--y",(Math.sin(ang)*dist)+"px");
      s.style.animationDelay=(Math.random()*0.2)+"s";
      v.querySelector(".wincard").appendChild(s);
    }
  }
}
function sitDown(){ document.body.classList.add("seated"); }
function standUp(){ document.body.classList.remove("seated"); }
var dice=[0,0,0,0,0], held=[0,0,0,0,0], rolls=0, whose="you", busy=false;
var you={}, house={};
var CATS=[
  ["ones","Aces",function(d){return sumFace(d,1)}],
  ["twos","Twos",function(d){return sumFace(d,2)}],
  ["threes","Threes",function(d){return sumFace(d,3)}],
  ["fours","Fours",function(d){return sumFace(d,4)}],
  ["fives","Fives",function(d){return sumFace(d,5)}],
  ["sixes","Sixes",function(d){return sumFace(d,6)}],
  ["3k","3 of a kind",function(d){return ofKind(d,3)?sum(d):0}],
  ["4k","4 of a kind",function(d){return ofKind(d,4)?sum(d):0}],
  ["fh","Full house",function(d){return fullHouse(d)?25:0}],
  ["ss","Small straight",function(d){return straight(d,4)?30:0}],
  ["ls","Large straight",function(d){return straight(d,5)?40:0}],
  ["yz","Yahtzee",function(d){return ofKind(d,5)?50:0}],
  ["ch","Chance",function(d){return sum(d)}]
];
function sum(d){return d.reduce(function(a,b){return a+b},0)}
function sumFace(d,n){return d.filter(function(x){return x===n}).length*n}
function counts(d){var c=[0,0,0,0,0,0,0];d.forEach(function(n){c[n]++});return c}
function ofKind(d,n){return counts(d).some(function(x){return x>=n})}
function fullHouse(d){var c=counts(d).filter(function(x){return x}); return c.indexOf(3)>=0 && c.indexOf(2)>=0}
function straight(d,len){
  var u=[].concat(d).filter(function(v,i,a){return a.indexOf(v)===i}).sort();
  var run=1,best=1;
  for(var i=1;i<u.length;i++){ run = u[i]===u[i-1]+1 ? run+1 : 1; if(run>best) best=run; }
  return best>=len;
}
function pips(){return "<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>"}
function linePos(i){ return {left:(6+i*18)+"%", top:"62%"}; }
function paintDice(scatter){
  var box=document.getElementById("dice");
  box.innerHTML=dice.map(function(n,i){
    var pos = (!n) ? linePos(i) : (scatter && !held[i] ? {left:(8+Math.random()*70)+"%", top:(8+Math.random()*55)+"%"} : linePos(i));
    return '<button class="die'+(held[i]?" held":"")+(scatter&&!held[i]?" tumble":"")+'" data-n="'+(n||1)+'" style="left:'+pos.left+';top:'+pos.top+'" onclick="hold('+i+')">'+pips()+'</button>';
  }).join("");
  if(scatter){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var els=box.querySelectorAll(".die");
        els.forEach(function(el,i){
          if(held[i]) return;
          var p=linePos(i);
          el.style.left=p.left; el.style.top=p.top;
        });
      });
    });
    setTimeout(function(){
      box.querySelectorAll(".tumble").forEach(function(el){ el.classList.remove("tumble"); });
    },720);
  }
}
function totalOf(book){
  var u=0,t=0;
  CATS.forEach(function(c,i){ if(book[c[0]]!=null){ t+=book[c[0]]; if(i<6) u+=book[c[0]]; }});
  if(u>=63) t+=35;
  return {upper:u, total:t};
}
function paintPad(id, book, canUse){
  var tot=totalOf(book), html="<h2>"+(id==="youPad"?"You":"House")+"</h2>";
  CATS.forEach(function(c,i){
    if(i===6) html+='<div class="row total"><span>Upper</span><span class="val">'+tot.upper+'</span></div><div class="row"><span>Bonus</span><span class="val">'+(tot.upper>=63?35:0)+'</span></div>';
    var used=book[c[0]]!=null;
    var preview=(canUse && dice[0])?c[2](dice):"";
    html+='<div class="row"><span>'+c[1]+'</span><span class="val">'+(used?book[c[0]]:(preview===""?"":preview))+'</span>';
    if(canUse) html+='<button '+(used||!dice[0]||!rolls||whose!=="you"?"disabled":"")+' onclick="score(\''+c[0]+'\')">Use</button>';
    html+='</div>';
  });
  html+='<div class="row total"><span>Total</span><span class="val">'+tot.total+'</span></div>';
  document.getElementById(id).innerHTML=html;
}
function paintAll(scatter){ paintDice(scatter); paintPad("youPad",you,true); paintPad("housePad",house,false); }
function hold(i){ if(busy||whose!=="you"||!rolls||!dice[0]) return; held[i]=held[i]?0:1; paintDice(false); }
function roll(){
  if(busy||whose!=="you"||rolls>=3) return;
  busy=true;
  document.getElementById("cup").classList.add("shake");
  setTimeout(function(){
    document.getElementById("cup").classList.remove("shake");
    for(var i=0;i<5;i++) if(!held[i]) dice[i]=1+Math.floor(Math.random()*6);
    rolls++;
    document.getElementById("msg").textContent="Roll "+rolls+" of 3 — tap to hold, then Use a line.";
    paintAll(true);
    setTimeout(function(){ busy=false; },750);
  },480);
}
function openLeft(book){ return CATS.filter(function(c){return book[c[0]]==null}); }
function score(key){
  if(busy||whose!=="you") return;
  var cat=CATS.filter(function(c){return c[0]===key})[0];
  if(!cat||you[key]!=null||!dice[0]) return;
  you[key]=cat[2](dice);
  paintAll(false);
  if(!openLeft(you).length && !openLeft(house).length){ endGame(); return; }
  whose="house"; rolls=0; held=[0,0,0,0,0]; dice=[0,0,0,0,0];
  document.getElementById("msg").textContent="House is shaking…";
  paintAll(false);
  setTimeout(housePlay,600);
}
function housePlay(){
  busy=true; rolls=0; held=[0,0,0,0,0];
  function toss(done){
    document.getElementById("cup").classList.add("shake");
    setTimeout(function(){
      document.getElementById("cup").classList.remove("shake");
      for(var i=0;i<5;i++) if(!held[i]) dice[i]=1+Math.floor(Math.random()*6);
      rolls++;
      var c=counts(dice), face=1, best=0;
      for(var f=1;f<=6;f++) if(c[f]>=best){best=c[f];face=f;}
      held=dice.map(function(n){return n===face?1:0});
      paintAll(true);
      setTimeout(done,800);
    },420);
  }
  toss(function(){
    toss(function(){
      toss(function(){
        var left=openLeft(house), best=left[0], bestV=-1;
        left.forEach(function(c){ var v=c[2](dice); if(v>bestV){bestV=v;best=c;} });
        house[best[0]]=best[2](dice);
        dice=[0,0,0,0,0]; held=[0,0,0,0,0]; rolls=0; whose="you"; busy=false;
        var over=!openLeft(you).length && !openLeft(house).length;
        document.getElementById("msg").textContent=over?"":"Your shake. House took "+best[1]+".";
        paintAll(false);
        if(over) endGame();
      });
    });
  });
}
function endGame(){
  var y=totalOf(you).total, h=totalOf(house).total;
  var title = y>h ? "You win" : h>y ? "House wins" : "Tie";
  var sub = y+" to "+h+".";
  document.getElementById("msg").textContent = title+" "+sub;
  showBanner(title, sub, newGame);
}
function newGame(){
  dice=[0,0,0,0,0]; held=[0,0,0,0,0]; rolls=0; whose="you"; busy=false; you={}; house={};
  document.getElementById("msg").textContent="Shake to start your turn";
  paintAll(false);
}
newGame();
</script>
