<style>
/* ===== Yahtzee: a dice tray, a leather dice cup and a score card on a polished table, seen from straight above =====
   Everything is painted in code (no picture files). The dice cup (tap it to roll) and the score card carry the gold BW monogram.
   Boards (the Boards card): Carved Marble is free; Sunroom Mahogany and Midnight Ebony are for Club members. */
.yz-pad{width:100%;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.yz-fit{position:relative;flex:none;overflow:hidden}
.yz-scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.yz-scene{position:relative}
/* only the dice live in 3D, in their own layer above the flat table (flat things never share depth with 3D ones) */
.yz-scene .dlayer{position:absolute;left:0;top:0;perspective:6000px;pointer-events:none;z-index:3}
.yz-scene .die,.yz-scene .die *{transform-style:preserve-3d}
.yz-scene .hit{position:absolute;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:16px;z-index:4;cursor:pointer;-webkit-tap-highlight-color:transparent;display:none}
.yz-scene .hit.on{display:block}
.yz-scene .abs{position:absolute}
/* the table top */
.yz-scene .table{left:0;top:0;border-radius:22px;background-image:var(--y-table);background-size:cover;background-color:var(--y-tablec);
  box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,235,200,.18)}
.yz-scene .table::before{content:"";position:absolute;inset:12px;border-radius:14px;border:2px solid var(--y-band1);box-shadow:0 0 0 3px var(--y-band2),inset 0 0 0 3px var(--y-band2)}
.yz-scene .table::after{content:"";position:absolute;inset:0;border-radius:22px;background:radial-gradient(ellipse 60% 55% at 38% 40%,rgba(255,230,180,.16),rgba(0,0,0,0) 60%),linear-gradient(115deg,rgba(255,255,255,.06),rgba(0,0,0,0) 40%,rgba(0,0,0,.25))}
/* the dice tray */
.yz-scene .tray .sh{position:absolute;inset:-6px -14px -22px -6px;border-radius:12px;background:rgba(0,0,0,.55);filter:blur(14px)}
.yz-scene .tray .frame{position:absolute;inset:0;border-radius:8px;background-image:var(--y-frame);background-size:cover;background-color:var(--y-framec);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,235,200,.25),inset 0 -3px 4px rgba(0,0,0,.35)}
.yz-scene .tray .band{position:absolute;inset:22px;border-radius:3px;background:var(--y-inlay);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.yz-scene .tray .lip{position:absolute;inset:36px;border-radius:2px;background-image:var(--y-frame);background-size:600px 600px;background-position:-60px -40px;background-color:var(--y-framec);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.yz-scene .tray .felt{position:absolute;inset:44px;background-image:var(--y-felt);background-size:256px 256px;background-color:var(--y-feltc);
  box-shadow:inset 0 10px 18px rgba(0,0,0,.6),inset 8px 0 14px rgba(0,0,0,.45),inset -6px 0 12px rgba(0,0,0,.4),inset 0 -6px 10px rgba(0,0,0,.35)}
.yz-scene .tray .felt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 45% 40%,rgba(255,225,170,.12),rgba(0,0,0,0) 65%)}
.yz-scene .tray .keep{position:absolute;left:44px;right:44px;bottom:44px;height:100px;background-image:var(--y-felt);background-size:256px 256px;background-color:var(--y-feltc);
  box-shadow:inset 0 8px 14px rgba(0,0,0,.65),inset 0 -2px 4px rgba(0,0,0,.3);filter:brightness(.78)}
.yz-scene .tray .rail{position:absolute;left:44px;right:44px;bottom:142px;height:5px;background:linear-gradient(180deg,#f6e2a4,#b88a36 55%,#6e4f1d);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.yz-scene .tray .klab{position:absolute;left:0;right:0;bottom:152px;text-align:center;font:600 10px Montserrat,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:rgba(240,220,170,.38)}
/* the dice cup, lying on its side */
/* the dice cup, standing upright (tap it to roll) */
.yz-scene .cup{width:124px;height:150px;cursor:pointer;-webkit-tap-highlight-color:transparent;transform-origin:50% 90%;z-index:2;isolation:isolate}
.yz-scene .cup .csh{position:absolute;left:4px;top:122px;width:128px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(7px)}
.yz-scene .cup .body{position:absolute;left:6px;top:22px;width:112px;height:120px;clip-path:polygon(0 0,100% 0,94% 100%,6% 100%);border-radius:0 0 50% 50% / 0 0 14px 14px;background:var(--y-cup);overflow:hidden}
.yz-scene .cup .body::before{content:"";position:absolute;inset:0;background-image:var(--y-cuptex);background-size:128px 128px;mix-blend-mode:multiply;opacity:.55}
.yz-scene .cup .body::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.1) 18%,rgba(255,255,255,.22) 34%,rgba(255,255,255,.05) 50%,rgba(0,0,0,.15) 72%,rgba(0,0,0,.6))}
.yz-scene .cup .band{position:absolute;left:6px;width:112px;height:8px;background:var(--y-cuprim);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.yz-scene .cup .band::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 25%,rgba(255,255,255,.35) 38%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5))}
.yz-scene .cup .band.lo{top:122px;left:12px;width:100px;height:7px;border-radius:0 0 50% 50% / 0 0 5px 5px}
.yz-scene .cup .rim{position:absolute;left:0;top:4px;width:124px;height:38px;border-radius:50%;background:var(--y-cuprim);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.yz-scene .cup .rim::before{content:"";position:absolute;inset:5px 7px 6px;border-radius:50%;background:radial-gradient(ellipse 80% 90% at 50% 70%,var(--y-cupin),#000 92%);box-shadow:inset 0 3px 6px rgba(0,0,0,.8)}
.yz-scene .cup .mono{position:absolute;left:0;right:0;top:66px;justify-content:center;font-size:30px}
.yz-scene .cup .tap{position:absolute;left:-20px;right:-20px;top:158px;text-align:center;font:600 10px Montserrat,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--y-label);opacity:0;transition:opacity .3s}
.yz-scene .cup.ready .tap{opacity:1}
.yz-scene .cup:hover .body{filter:brightness(1.1)}
.yz-scene .cup.ready::after{content:"";position:absolute;left:4px;right:4px;top:6px;bottom:10px;border-radius:50% 50% 46% 46% / 18% 18% 12% 12%;box-shadow:0 0 28px 10px rgba(214,158,40,.6);animation:yzpulse 1.8s ease-in-out infinite;pointer-events:none;z-index:-1}
.yz-scene .cup.shake{animation:yzshake .5s ease-in-out}
@keyframes yzpulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes yzshake{0%,100%{transform:none}15%{transform:rotate(-9deg) translateX(-4px)}35%{transform:rotate(8deg) translateX(4px)}55%{transform:rotate(-7deg)}75%{transform:rotate(5deg)}}
.yz-scene .mono{display:flex;align-items:baseline;line-height:1.25}
.yz-scene .mono b,.yz-scene .mono i{display:inline-block;background:linear-gradient(170deg,#fff1bf 0%,#d9b25a 45%,#8f6a22 75%,#f3d68b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.45))}
.yz-scene .mono b{font:500 1em Montserrat,sans-serif;letter-spacing:-.02em}.yz-scene .mono i{font:400 .76em Pacifico,cursive;font-style:normal;margin-left:.06em;padding:0 .18em 0 .02em}
/* the three roll lamps */
.yz-scene .lamps.col{flex-direction:column;gap:14px;width:60px}
.yz-scene .lamps.col span{order:4;margin-top:2px}
.yz-scene .lamps{display:flex;gap:10px;align-items:center;font:600 11px Montserrat,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--y-label)}
.yz-scene .lamps i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d0,#d9b25a 45%,#6e4f1d);box-shadow:0 0 8px rgba(240,190,90,.6),0 1px 2px rgba(0,0,0,.6)}
.yz-scene .lamps i.off{background:radial-gradient(circle at 35% 30%,#555,#222);box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
/* dice */
.yz-scene .die{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;-webkit-tap-highlight-color:transparent}
.yz-scene .die.tap{cursor:pointer}
.yz-scene .die.go,.yz-scene .dsh.go{transition:transform 1.25s cubic-bezier(.12,.62,.22,1)}
.yz-scene .die.slide,.yz-scene .dsh.slide{transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.yz-scene .die .d{position:absolute;inset:0;border-radius:12px;background:var(--y-die);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset -4px -6px 10px rgba(0,0,0,.18),inset 4px 5px 8px rgba(255,255,255,.35)}
.yz-scene .die .core{position:absolute;inset:2px;background:var(--y-diecore);border-radius:7px}
.yz-scene .die .core.c2{transform:rotateY(90deg)}.yz-scene .die .core.c3{transform:rotateX(90deg)}
.yz-scene .die .d i{width:11px;height:11px;border-radius:50%;margin:auto;background:radial-gradient(circle at 60% 65%,var(--y-pip) 40%,var(--y-pip2) 100%);box-shadow:inset 0 2px 2px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.35);visibility:hidden}
.yz-scene .die .d i.p{visibility:visible}
/* at rest only the top face is drawn (Chrome draws edge-on side faces as thin lines) */
.yz-scene .die.rest .d,.yz-scene .die.rest .core{visibility:hidden}
.yz-scene .die.rest .d.up,.yz-scene .die.rest .d.up i.p{visibility:visible}
.yz-scene .die.rest .d.up{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset -4px -6px 10px rgba(0,0,0,.2),inset 4px 5px 8px rgba(255,255,255,.35)}
.yz-scene .die.tap.rest .d.up{box-shadow:inset 0 0 0 2px rgba(214,164,62,.7),inset -4px -6px 10px rgba(0,0,0,.2),inset 4px 5px 8px rgba(255,255,255,.35)}
.yz-scene .dsh{position:absolute;left:0;top:0;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.6),rgba(0,0,0,0) 68%);filter:blur(3px);pointer-events:none}
.yz-scene .dsh.held{background:radial-gradient(circle,rgba(255,205,110,.75),rgba(255,190,80,.25) 45%,rgba(0,0,0,0) 70%)}
body.yz-quick .yz-scene .die.go,body.yz-quick .yz-scene .dsh.go,body.yz-quick .yz-scene .die.slide,body.yz-quick .yz-scene .dsh.slide{transition-duration:.01s}
/* the score card */
.yz-scene .card{border-radius:10px;padding:14px;background-image:var(--y-cardtex);background-size:128px 128px;background-color:var(--y-cardc);
  box-shadow:0 14px 26px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.yz-scene .card .orn{position:absolute;inset:6px;border-radius:6px;border:1.5px solid var(--y-cardline);box-shadow:inset 0 0 0 4px var(--y-cardline2);pointer-events:none}
.yz-scene .card .cn{position:absolute;width:16px;height:16px;border:1.5px solid var(--y-cardline);transform:rotate(45deg);background:var(--y-cardc)}
.yz-scene .card .cn::after{content:"";position:absolute;inset:3px;background:var(--y-cardline)}
.yz-scene .card .cn.a{left:-2px;top:-2px}.yz-scene .card .cn.b{right:-2px;top:-2px}.yz-scene .card .cn.c{left:-2px;bottom:-2px}.yz-scene .card .cn.d{right:-2px;bottom:-2px}
.yz-scene .card .paper{position:relative;height:100%;border-radius:3px;background:linear-gradient(170deg,#fffaf0,#f4ead4 70%,#ecdfc2);box-shadow:inset 0 0 0 1px rgba(120,90,40,.35),inset 0 0 14px rgba(150,110,50,.18);
  color:#2a2118;padding:8px 10px;display:flex;flex-direction:column}
.yz-scene .card .hd{display:flex;align-items:center;justify-content:center;gap:10px;height:42px;flex:none;border-bottom:1.5px solid var(--y-ink2);margin-bottom:4px}
.yz-scene .card .hd .mono{font-size:22px}
.yz-scene .card .hd .mono b,.yz-scene .card .hd .mono i{background:linear-gradient(170deg,#c9a24f,#8f6a22 60%,#b8913f);-webkit-background-clip:text;background-clip:text;filter:none}
.yz-scene .card .hd span{font:700 13px Montserrat,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--y-ink)}
.yz-scene .card .cols{display:flex;flex-direction:column;flex:1;gap:8px}
.yz-scene .card table{width:100%;border-collapse:collapse;font-family:"Cormorant Garamond",Georgia,serif}
.yz-scene .card th{font:700 10px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(60,45,25,.6);height:22px;text-align:center}
.yz-scene .card th.on{color:var(--y-ink);text-decoration:underline;text-decoration-color:#c9a24f;text-decoration-thickness:2px;text-underline-offset:4px}
.yz-scene .card td{height:38px;border-bottom:1px solid rgba(90,70,40,.22);font-size:18px;font-weight:700;padding:0 4px}
.yz-scene .card td.nm{font-size:17px;color:#2a2118;white-space:nowrap}
.yz-scene .card td.nm small{font:600 9px Montserrat,sans-serif;letter-spacing:.06em;color:rgba(60,45,25,.55);margin-left:5px}
.yz-scene .card td.v{width:62px;text-align:center;border-left:1px solid rgba(90,70,40,.22);color:var(--y-ink)}
.yz-scene .card td.v.opp{color:#5a4a36}
.yz-scene .card td.v.pot{color:#b07d1a;font-style:italic;cursor:pointer;background:rgba(240,200,100,.13);box-shadow:inset 0 0 0 1px rgba(200,150,50,.45)}
.yz-scene .card td.v.pot.pz{color:rgba(176,125,26,.45);background:rgba(240,200,100,.06);box-shadow:inset 0 0 0 1px rgba(200,150,50,.2)}
.yz-scene .card td.v.pot:hover{background:rgba(240,200,100,.32)}
.yz-scene .card td.v.zero{color:rgba(150,110,60,.65)}
.yz-scene .card td.v.new{animation:yzink 1.2s ease-out}
@keyframes yzink{0%{background:rgba(240,200,100,.55)}100%{background:rgba(240,200,100,0)}}
.yz-scene .card tr.sub td{font:600 11px Montserrat,sans-serif;letter-spacing:.05em;color:rgba(60,45,25,.75);height:30px;background:rgba(150,110,50,.07)}
.yz-scene .card tr.sub td.v{font:700 13px Montserrat,sans-serif;color:var(--y-ink)}
.yz-scene .card .tot{display:flex;align-items:center;height:42px;flex:none;margin-top:4px;border-top:1.5px solid var(--y-ink2);font:700 12px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--y-ink)}
.yz-scene .card .tot b{flex:1;padding-left:4px}.yz-scene .card .tot em{width:62px;text-align:center;font:700 22px "Cormorant Garamond",Georgia,serif;font-style:normal;letter-spacing:0}
.yz-scene .card .lowhd{display:none}
/* phones: the card spreads into two halves side by side, with larger print */
.yz-scene .card.tall .cols{flex-direction:row;gap:12px}
.yz-scene .card.tall .cols>div{flex:1}
.yz-scene .card.tall .lowhd{display:table-row}
.yz-scene .card.tall table{font-family:Montserrat,sans-serif}
.yz-scene .card.tall td{height:42px;font:700 25px Montserrat,sans-serif;padding:0 3px}
.yz-scene .card.tall td.nm{font:600 19px Montserrat,sans-serif;letter-spacing:-.01em}
.yz-scene .card.tall td.nm small{display:none}
.yz-scene .card.tall td.v{width:62px}
.yz-scene .card.tall td.v.pot{font-style:normal}
.yz-scene .card td.v.pot.hint{background:rgba(242,199,90,.55);box-shadow:inset 0 0 0 3px #d9a52e;animation:yz-hintc 1.3s ease-in-out infinite;color:#4a2f00;font-weight:800}
@keyframes yz-hintc{50%{background:rgba(242,199,90,.25)}}
.yz-scene .die.hint .d{box-shadow:0 0 0 4px #f2c75a,0 0 22px 6px rgba(250,205,95,.75)!important}
.yz-scene .card.tall th{font-size:14px;height:30px}
.yz-scene .card.tall tr.sub td{font-size:15px;height:36px}
.yz-scene .card.tall tr.sub td span{display:none}
.yz-scene .card.tall tr.sub td.v{font-size:17px}
.yz-scene .card.tall .tot{font-size:17px;height:50px}.yz-scene .card.tall .tot em{width:62px;font:700 28px Montserrat,sans-serif}
.yz-scene .card.tall .hd{height:46px}
.yz-scene .card.tall .hd span{font-size:17px}
/* a short call-out for big scores */
.yz-toast{position:absolute;z-index:6;left:50%;transform:translate(-50%,0);padding:7px 13px;font-size:13px!important;border-radius:999px;background:rgba(15,23,42,.84);border:1px solid rgba(231,199,122,.6);color:#f3d68b;font:700 15px Montserrat,sans-serif;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.yz-toast.on{opacity:1;transform:translate(-50%,-6px)}
/* phones: the card shows both scores, so the two score strips and the Whim card step aside */
body.yz-phone.pk .pk-mini{display:none}
body.pk .pk-whim-m,body.pk.pk-has-whim .pk-whim-m{display:none!important}
body.pk.pk-has-whim .pk-stage{justify-content:center}
body.pk.pk-has-whim .pk-mini-top,body.pk.pk-has-whim .pk-mini-bot{margin-top:0;margin-bottom:0}
@media (min-width:1000px){ body.pk .pk-stage{justify-content:center} }
</style>

<script>
/* =====================================================================
   Painted materials
   ===================================================================== */
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}
function noise2(seed){var r=rng(seed),P=new Uint16Array(512),G=new Float32Array(256),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=Math.floor(r()*(i+1));t=p[i];p[i]=p[j];p[j]=t;}for(i=0;i<512;i++)P[i]=p[i&255];for(i=0;i<256;i++)G[i]=r();function f(x){return x*x*(3-2*x);}return function(x,y){var xi=Math.floor(x),yi=Math.floor(y),u=f(x-xi),v=f(y-yi),X=xi&255,Y=yi&255;var a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(n,x,y,o){var s=0,a=.5,t=0;for(var i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function mix(a,b,t){return a+(b-a)*t;}
function canvasOf(w,h,fn){var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d"),im=g.createImageData(w,h),D=im.data;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var col=fn(x,y),i=(y*w+x)*4;D[i]=col[0];D[i+1]=col[1];D[i+2]=col[2];D[i+3]=255;}g.putImageData(im,0,0);return c;}
function cssUrl(c){return 'url('+c.toDataURL("image/jpeg",.88)+')';}

  var h='<span>Rolls</span>'; for(var i=0;i<3;i++) h+='<i class="'+(i<3-rolls?'':'off')+'"></i>'; $("yzLamps").innerHTML=h;
  DIE.forEach(function(o,i){ var t=mine&&rolls>0&&rolls<3; o.el.classList.toggle("tap",t); o.hit.classList.toggle("on",t); o.el.classList.toggle("hint",hintDice.indexOf(i)>=0); });
  renderCard();
  Parlor.score([total(S.p1,S.yb1),total(S.p2,S.yb2)]);
  Parlor.turn(S.over?-1:S.turn===1?0:1);
  var round=Math.min(13,Math.min(filled(S.p1),filled(S.p2))+1);
  if(Parlor.info) Parlor.info(S.over?"Game over":"Round "+round+" of 13");
}
function say(a,b){ Parlor.status(a,b||""); }
function msg(){
  if(S.over) return;
  if(online&&room&&!room.guest){ say("Waiting for a player","Share your table code: "+(CODE||"")); return; }
  if(S.turn===mySide){
    if(S.rolls===0) say("Your turn","Tap the dice cup to roll");
    else if(S.rolls<3) say("Roll "+S.rolls+" of 3","Tap dice to keep them, tap the cup to roll again, or score a box");
    else say("Choose a box","Tap a gold number on the score card");
  } else say(online?"Your opponent's turn":"The House is rolling…","");
}

/* ---------- your moves ---------- */
async function humanRoll(){
  if(!myTurn()||S.rolls>=3) return;
  var idx=[]; for(var i=0;i<5;i++) if(!S.held[i]) idx.push(i); if(!idx.length) return;
  if(Parlor.lessonOn&&lessonNeedHeld&&!lessonNeedHeld.every(function(i){ return S.held[i]; })){ say("Keep the 3s first","Tap both 3s, then the cup"); return; }
  busy=true; var vals=idx.map(function(){ return 1+Math.floor(Math.random()*6); });
  if(forceRolls.length){ var fv=forceRolls.shift(); vals=idx.map(function(i,j){ return fv[i]!=null?fv[i]:vals[j]; }); }   /* Learn to Play: the lesson's dice */
  hintDice=[]; hintBox=null;
  idx.forEach(function(i,j){ S.dice[i]=vals[j]; }); S.rolls++;
  seq++; lastMv={k:"roll",s:mySide,idx:idx}; push(); render();
  await tumble(idx,vals); busy=false; afterRoll(mySide); render(); msg();
  if(Parlor.lessonOn){ lessonNeedHeld=null; Parlor.lessonDone(); return; }
  if(practice) Parlor.practiceSay(S.rolls<3?"Roll "+S.rolls+" of 3":"Last Roll",S.rolls<3?"<p>Tap dice to <b>keep</b> them, then tap the cup to roll the rest. Or score a box now: tap a gold number on the card.</p>":"<p>Choose a box: tap a <b>gold number</b> on your score card.</p>");
}
function humanHold(i){
  if(!myTurn()||S.rolls===0||S.rolls>=3) return;
  if(Parlor.lessonOn&&!lessonNeedHeld) return;
  hintDice=[];
  S.held[i]=S.held[i]?0:1; DIE[i].held=!!S.held[i]; Parlor.sfx("click",{pitch:1.4}); placeDice(true);
  seq++; lastMv={k:"hold",s:mySide,i:i}; push(); render(); msg();
}
function humanScore(k){ if(!myTurn()||S.rolls===0) return; scoreBox(mySide,k); }
function afterRoll(s){ if(isYz(S.dice)){ toast(s===mySide?"Yahtzee!":nameOf(s)+" rolled a Yahtzee!"); Parlor.sfx("mill"); } }
/* write a score, then pass the dice */
function scoreBox(s,k){
  var sheet=book(s), v=S.dice.slice();
  if(allowed(v,sheet).indexOf(k)<0) return;
  hintBox=null; hintDice=[];
  if(Parlor.lessonOn){ sheet[k]=scoreFor(k,v,sheet); fresh=[s+k]; Parlor.sfx("place",{pitch:1.2}); lessonBox=null; render(); Parlor.lessonDone(); return; }
  if(isYz(v)&&sheet.yz===50){ if(s===1) S.yb1=(S.yb1||0)+100; else S.yb2=(S.yb2||0)+100; toast("Yahtzee Bonus: +100"); }
  var pts=scoreFor(k,v,sheet); sheet[k]=pts; fresh=[s+k];
  Parlor.sfx("place",{pitch:1.2});
  if(s!==mySide) toast(nameOf(s)+": "+NAME[k]+" for "+pts);
  S.held=[0,0,0,0,0]; S.rolls=0;
  if(filled(S.p1)===13&&filled(S.p2)===13){ S.over=true; var a=total(S.p1,S.yb1), b=total(S.p2,S.yb2); S.winner=a===b?0:a>b?1:2; }
  else S.turn=other(s);
  seq++; lastMv={k:"score",s:s,cat:k}; push();
  syncDiceFromState(true); render();
  if(S.over){ end(); return; }
  msg(); maybeHouse();
  if(practice){ if(S.turn===2) Parlor.practiceSay("The House's Turn","<p>You scored <b>"+pts+"</b> in "+NAME[k]+". The House rolls next.</p>"); else Parlor.practiceSay("Your Turn","<p>"+TIPS[tipN++%TIPS.length]+"</p><p>Tap the cup to roll.</p>"); }
}
function end(){
  if(practice) Parlor.coach(null);
  render();
  var meS=mySide||1, a=total(book(meS),yb(meS)), b=total(book(other(meS)),yb(other(meS)));
  var kind=S.winner===0?"draw":S.winner===meS?"win":"lose";
  var why="Final score: you "+a+", "+Parlor.oppName(true)+" "+b+".";
  say(kind==="win"?"You win!":kind==="draw"?"A tie!":"Game over",why);
  if(online) report();
  Parlor.finish(kind,why);
}

/* ---------- The House ----------
   For every way of keeping dice it works out the average of the best box it could fill after the re-roll
   (counting every possible roll), and keeps the set with the best average. Boxes are weighed against what
   they usually score, with the upper-section bonus in mind. Looser at low levels. */
var PAR={ones:2,twos:5,threes:8.5,fours:12,fives:15,sixes:19,"3k":15,"4k":8,fh:15,ss:18,ls:12,yz:9,ch:22};
function boxValue(k,v,sheet){
  var sc=scoreFor(k,v,sheet), val=sc-PAR[k], up=UPK.indexOf(k);
  if(up>=0){ var need=3*(up+1); val+=(sc-need)*.7; if(upperSum(sheet)+sc>=63&&upperSum(sheet)<63) val+=12; }
  if(k==="yz"&&sc===0) val-=8; if(k==="ch") val-=3; if(k==="ls"&&sc===0) val-=3;
  if(isYz(v)&&sheet.yz===50) val+=100;
  return val;
}
function bestBox(v,sheet){ var best=null,bv=-1e9; allowed(v,sheet).forEach(function(k){ var x=boxValue(k,v,sheet); if(x>bv){ bv=x; best=k; } }); return {k:best,v:bv}; }
function holdValue(v,mask,sheet){
  var free=[]; for(var i=0;i<5;i++) if(!(mask&(1<<i))) free.push(i);
  if(!free.length) return bestBox(v,sheet).v;
  var n=free.length, tot=0, cnt=Math.pow(6,n), w=v.slice();
  for(var c=0;c<cnt;c++){ var x=c; for(var j=0;j<n;j++){ w[free[j]]=1+x%6; x=Math.floor(x/6); } tot+=bestBox(w,sheet).v; }
  return tot/cnt;
}
function houseHold(v,sheet){
  var sk=Parlor.skill();
  if(Math.random()<sk.loose*.7){ var m=0; for(var i=0;i<5;i++) if(Math.random()<.5) m|=1<<i; return m; }
  var best=31, bv=-1e9, seen={};
  for(var mask=0;mask<32;mask++){
    var key=[]; for(var i2=0;i2<5;i2++) if(mask&(1<<i2)) key.push(v[i2]); key=key.sort().join("");   /* same kept faces = same value */
    if(seen[key]!=null){ continue; } var x=holdValue(v,mask,sheet); seen[key]=x;
    if(x>bv+1e-9){ bv=x; best=mask; }
  }
  return best;
}
function maybeHouse(){ if(!online&&!S.over&&S.turn===2&&!busy&&seatedNow()) houseTurn(); }
async function houseTurn(){
  if(online||S.over||S.turn!==2) return;
  busy=true; render(); msg(); await Parlor.wait(900);
  var sheet=S.p2, sk=Parlor.skill();
  for(var r=0;r<3;r++){
    var idx=[]; for(var i=0;i<5;i++) if(!S.held[i]) idx.push(i);
    var vals=idx.map(function(){ return 1+Math.floor(Math.random()*6); }); idx.forEach(function(i3,j){ S.dice[i3]=vals[j]; }); S.rolls++;
    render(); await tumble(idx,vals); afterRoll(2); render(); await Parlor.wait(700);
    if(S.rolls>=3) break;
    var mask=houseHold(S.dice.slice(),sheet);
    if(mask===31) break;
    var changed=false; for(var k=0;k<5;k++){ var h=(mask&(1<<k))?1:0; if(S.held[k]!==h){ S.held[k]=h; DIE[k].held=!!h; changed=true; } }
    if(changed){ Parlor.sfx("click",{pitch:1.3}); placeDice(true); render(); await Parlor.wait(750); }
  }
  var pick=bestBox(S.dice,sheet).k;
  if(Math.random()<sk.loose*.4){ var opts=allowed(S.dice,sheet).map(function(k2){ return [k2,boxValue(k2,S.dice,sheet)]; }).sort(function(a,b){ return b[1]-a[1]; }); if(opts[1]) pick=opts[1][0]; }
  await Parlor.wait(400); busy=false; scoreBox(2,pick);
}

/* ---------- Learn to Play (Oct 24): six steps (the lesson sets the dice), then a coached practice game ---------- */
var practice=false, forceRolls=[], lessonNeedHeld=null, lessonBox=null, hintDice=[], hintBox=null, tipN=0;
var TIPS=["Aim for three of each number in the top section: 63 points there earns a 35-point bonus.","Save Chance for a roll that fits nowhere else.","A small straight needs four in a row (like 2-3-4-5); a large straight needs all five.","Late in the game, a zero in Aces or Yahtzee can be the least costly choice.","Three of a Kind and Four of a Kind score the total of all five dice."];
function LESSON(){ return [
  {title:"The Game", text:"<p>Each turn you get up to <b>three rolls</b> of five dice. Then you must score <b>one box</b> on your card.</p><p>After 13 rounds every box is filled, and the higher total wins.</p>"},
  {title:"Rolling", text:"<p>Tap the <b>dice cup</b> to roll all five dice.</p>", done:"<p>Two 3s. Not bad: let's build on them.</p>", sub:"Tap the dice cup"},
  {title:"Keeping Dice", text:"<p>Tap a die to <b>keep</b> it: it moves to the velvet strip and won't be rolled.</p><p>Keep both <b>3s</b>, then tap the cup to roll the other three.</p>", done:"<p>A third 3! You can roll up to three times in a turn, keeping whatever you like each time.</p>", sub:"Keep both 3s, then tap the cup"},
  {title:"Scoring a Box", text:"<p>Three 3s and two 2s make a <b>Full House</b>: 25 points.</p><p>Tap the gold <b>25</b> beside Full House on your score card.</p>", done:"<p>Scored! Each box can be filled only once, so choosing well matters.</p>", sub:"Tap the gold 25"},
  {title:"The Top Section", text:"<p><b>Aces to Sixes</b> score the total of that number only: three 5s in Fives is 15.</p><p>Reach <b>63</b> in the top section (about three of each) for a <b>35-point bonus</b>.</p>"},
  {title:"Yahtzee and Chance", text:"<p>Five of a kind is a <b>Yahtzee</b>: 50 points, and every extra Yahtzee adds 100. <b>Chance</b> takes any roll and scores the total.</p><p>If nothing fits, you must still fill a box, sometimes with a zero. Ready for a practice game?</p>"}
]; }
function lessonSetup(k){
  practice=false; forceRolls=[]; lessonNeedHeld=null; lessonBox=null; hintDice=[]; hintBox=null; busy=false; mySide=1; fresh=[];
  S=newState(); DIE.forEach(function(o){ o.held=false; });
  if(k===1){ forceRolls=[[3,3,5,1,6]]; }
  else if(k===2){ S.dice=[3,3,5,1,6]; S.rolls=1; lessonNeedHeld=[0,1]; forceRolls=[[null,null,3,2,4]]; }
  else if(k===3){ S.dice=[3,3,3,2,2]; S.rolls=2; lessonBox="fh"; }
  if(S.dice[0]){ DIE.forEach(function(o,i){ faceUp(o,S.dice[i]); }); spreadAll(); }
  syncDiceFromState(false); render();
}
function startPractice(){ practice=true; tipN=0; forceRolls=[]; lessonNeedHeld=null; lessonBox=null; hintDice=[]; hintBox=null; mySide=1; newGame();
  Parlor.practiceSay("Your Turn","<p>Tap the <b>dice cup</b> to roll.</p><p>Stuck? Tap <b>Hint</b>.</p>"); }
function showHint(){
  if(!practice||S.over||busy||S.turn!==1) return;
  if(S.rolls===0){ Parlor.hintSay("<p>Tap the <b>dice cup</b> to roll.</p>"); return; }
  var v=S.dice.slice(), sheet=S.p1, mask=S.rolls<3?houseHold(v,sheet):31;
  if(mask===31){ var b=bestBox(v,sheet).k; hintBox=b; hintDice=[]; render(); var sc=scoreFor(b,v,sheet), weak=sc<PAR[b];
    Parlor.hintSay("<p>Score this roll in <b>"+NAME[b]+"</b> for "+sc+": tap the gold-ringed number on your card.</p>"+(weak?"<p>This roll is weak, so it goes where it costs you least, saving Chance and the bigger boxes for better rolls.</p>":"")); return; }
  hintDice=[]; for(var i=0;i<5;i++) if(mask&(1<<i)) hintDice.push(i);
  hintBox=null; render();
  var change=hintDice.some(function(i){ return !S.held[i]; })||S.held.some(function(h,i){ return h&&hintDice.indexOf(i)<0; });
  Parlor.hintSay("<p>"+(hintDice.length?"Keep the <b>gold-ringed dice</b>"+(change?" (tap to keep or release)":"")+", then roll the rest.":"Roll all five again.")+"</p>");
}

/* ---------- online table (same page: ?code=XXXX) ---------- */
function snapshot(){ var o=JSON.parse(JSON.stringify(S)); o.game="yahtzee"; o.v=2; o.seq_no=seq; o.mv=lastMv; return o; }
async function push(){
  if(!online||!room) return;
  await sb.from("rooms").update({state:snapshot(), status:S.over?"done":"live", updated_at:new Date().toISOString()}).eq("id",room.id);
  if(S.over) report();
}
function report(){ if(reported||!S.over||!room||!window.bwRateGame) return; reported=true; room.state=snapshot(); bwRateGame(sb,room,me,S.winner); }
function fromSnap(s){
  if(!s||(s.game&&s.game!=="yahtzee")||s.dice===undefined){ S=newState(); seq=0; return; }
  S={game:"yahtzee",v:2,p1:s.p1||{},p2:s.p2||{},yb1:s.yb1||0,yb2:s.yb2||0,dice:(s.dice||[0,0,0,0,0]).slice(),held:(s.held||[0,0,0,0,0]).map(function(x){ return x?1:0; }),
     rolls:s.rolls||0,turn:s.turn||1,over:!!s.over,winner:s.winner!=null?s.winner:0};
  if(S.over&&s.winner==null){ var a=total(S.p1,S.yb1),b=total(S.p2,S.yb2); S.winner=a===b?0:a>b?1:2; }
  seq=s.seq_no||0;
}
var queue=Promise.resolve();
function remote(s){
  queue=queue.then(async function(){
    if(!s||s.seq_no==null||s.seq_no<=seq) return;
    var mv=s.mv, wasOver=S.over;
    if(mv&&mv.s&&mv.s!==mySide&&mv.k==="roll"&&s.dice){
      busy=true; DIE.forEach(function(o,i){ o.held=!!(s.held||[])[i]; }); placeDice(true);
      try{ await tumble(mv.idx,mv.idx.map(function(i){ return s.dice[i]; })); }catch(e){}
      busy=false; fromSnap(s); afterRoll(mv.s);
    } else if(mv&&mv.s&&mv.s!==mySide&&mv.k==="score"){
      fromSnap(s); fresh=[mv.s+mv.cat]; Parlor.sfx("place",{pitch:1.2});
    } else { fromSnap(s); if(mv&&mv.k==="hold"&&mv.s!==mySide) Parlor.sfx("click",{pitch:1.3}); }
    syncDiceFromState(true); render();
    if(S.over&&!wasOver) end(); else msg();
  });
}
async function bootOnline(){
  online=true; Parlor.seatOnline({label:"Online table "+CODE});
  var cfg=window.BW_PLAY||{};
  if(!cfg.url){ say("Can't connect","Missing play-config.js"); return; }
  sb=(window.BW&&BW.client&&BW.client())||supabase.createClient(cfg.url,cfg.anonKey);
  if(window.BW) await BW.settled();
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ say("Sign in to join","Use the Lobby to sign in"); if(window.BW){ var a=await BW.openAuth({reason:"Sign in to join this table."}); if(!a.ok) return; sess=(await sb.auth.getSession()).data.session; } if(!sess) return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code",CODE).single();
  if(q.error){ say("Table not found",q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==="function" && bwSendToGame(bwGuessGame(room),CODE)) return;
  if(room.host===me) mySide=1; else if(room.guest===me) mySide=2;
  else if(!room.guest){ var u=await sb.from("rooms").update({guest:me,status:"live"}).eq("id",room.id).select().single(); if(!u.error){ room=u.data; mySide=2; } }
  else mySide=0;
  Parlor.names(mySide===2?["Opponent","You"]:["You","Opponent"]);
  Parlor.mySeat(mySide===2?1:0); Parlor.table&&Parlor.table({sb:sb,room:room,me:me,side:mySide});
  fromSnap(room.state); syncDiceFromState(false);
  render(); if(S.over) end(); else msg();
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"code=eq."+CODE},function(p){
    var hadGuest=room&&room.guest; room=p.new; var s=p.new.state||{};
    if(!hadGuest&&room.guest){ render(); msg(); }
    if(s.seq_no!=null&&s.seq_no!==seq) remote(s);
  }).subscribe();
}

/* ---------- fit to the space ---------- */
function fit(){
  var wide=window.innerWidth>=1000, phone=window.innerWidth<700, availW, availH;
  if(wide){ var st=document.querySelector(".pk-stage"), top=st&&seatedNow()?st.getBoundingClientRect().top+window.scrollY:185; availW=(st&&st.clientWidth)||(window.innerWidth-560); availH=window.innerHeight-top-22; }
  else { var shortL=window.innerHeight<=520&&window.innerWidth>window.innerHeight; availW=window.innerWidth-12;
    availH=shortL?window.innerHeight-56-64-10:phone?window.innerHeight-56-(64+30)-26:window.innerHeight-56-64-34-120; }
  /* phones: the Learn to Play card floats over the top of the screen, so the table moves down below it and shrinks to fit (Oct 25) */
  var cOff=(!wide&&!(window.innerHeight<=520&&window.innerWidth>window.innerHeight)&&Parlor.coachHeight)?Math.max(0,Parlor.coachHeight()-56):0;
  availH-=cOff; fitEl.style.marginTop=cOff+"px";
  var base=phone?LAYOUTS.tall:LAYOUTS.wide, s;
  if(!phone){ L=base; s=Math.max(.2,Math.min(availW/base.W,availH/base.H,1.2)); }
  else {
    /* phones: the tray runs across the top; under it the score card on the left, and to its right the roll lamps
       (level with the top of the card) with the dice cup at the bottom. The tray grows to use the screen. */
    var CW=604, CH=488, M=18, minW=784, rest=M+M+CH+M;
    s=availW/minW; var trayH=Math.min(600,Math.floor(availH/s-rest));
    if(trayH<380){ trayH=380; s=availH/(rest+trayH); }
    var W=Math.max(minW,Math.round(availW/s)), cardY=M+trayH+M, colX=M+CW+(W-M-CW-M)/2;
    L=Object.assign({},base,{W:W,H:rest+trayH,tray:[M,M,W-2*M,trayH],card:[M,cardY,CW,CH],lamps:[Math.round(colX-30),cardY+115],cup:[Math.round(colX-62),cardY+CH-176]});
    s=Math.max(.2,Math.min(s,1.2));
  }
  arrange(); fitEl._s=s;
  document.body.classList.toggle("yz-phone",phone);
  $("yzScaler").style.transform="scale("+s+")"; fitEl.style.width=Math.round(L.W*s)+"px"; fitEl.style.height=Math.round(L.H*s)+"px";
  document.body.style.setProperty("--pk-size",Math.round(L.W*s)+"px");
  var key=L.W+"x"+L.H;
  if(fit._k!==key){ fit._k=key; spreadAll(); placeDice(false); } else if(!busy) placeDice(false);
}
window.addEventListener("resize",fit);

/* ---------- hook up the kit ---------- */
cupEl.onclick=humanRoll;
function newGame(){ S=newState(); seq=0; busy=false; reported=false; fresh=[]; DIE.forEach(function(o){ o.held=false; }); placeDice(true); render(); msg(); }
Parlor.init({

var wasSeated=null;
new MutationObserver(function(){ var k=document.body.getAttribute("data-set")||"marble"; if(k!==curDesign) applyDesign(k);
  var st=seatedNow(); if(st!==wasSeated){ wasSeated=st; fit(); render(); if(!S.over&&S.turn===2) maybeHouse(); } }).observe(document.body,{attributes:true,attributeFilter:["data-set","class"]});
S=newState();
