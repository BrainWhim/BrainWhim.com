/* ===== The Observatory (Puzzles & Brain Games, Oct 31): a daily star-chart puzzle =====
   The stars of a real constellation, each showing how many lines it needs, and dotted sight lines between some of them.
   Draw lines so every star has exactly its number, no two lines cross, and all the stars join into one figure.
   The one answer is the constellation's real figure: solving it reveals the constellation, its bright stars and its story.
   One chart a day (the same for everyone, by the player's own date); Monday is a small, gentle one, Sunday the biggest.
   Scoring: ★★★ with no hints, ★★ with one or two, ★ otherwise. */
.ob-pad{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.ob-fit{position:relative;flex:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.ob-tools{display:flex;flex-direction:column;align-items:center;gap:7px;padding:7px 10px;border-radius:12px;background:rgba(10,18,40,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.ob-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:center}
.ob-tools .pk-btn{width:auto;margin:0;padding:8px 14px;min-height:0;white-space:nowrap}
.ob-tools .pk-btn.gold{border-color:rgba(231,199,122,.75);color:#f0d27a;background:rgba(212,175,55,.16)}
.ob-count{font:600 13px Montserrat,sans-serif;color:#fff;padding:0 6px;white-space:nowrap}
.ob-count b{color:#f0d27a;font-weight:700}
.ob-help{font:600 11.5px/1.45 Montserrat,sans-serif;color:rgba(255,255,255,.72);text-align:center;max-width:560px}

@keyframes ob-tw{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){ .ob-tw{animation:none} }
/* the result window */
.ob-stars{font-size:30px;letter-spacing:6px;color:#f0d27a;text-shadow:0 2px 10px rgba(240,210,122,.45);margin:2px 0 6px;text-align:center}
.ob-stars i{font-style:normal;color:rgba(255,255,255,.22);text-shadow:none}
.ob-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
.ob-facts div{border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 4px;text-align:center;background:rgba(255,255,255,.04)}
.ob-facts b{display:block;font:700 17px Montserrat,sans-serif;color:#fff}
.ob-facts small{font:600 10px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.ob-story{font:500 14.5px/1.6 Montserrat,sans-serif;color:rgba(255,255,255,.88);margin:8px 0 2px;text-align:left}
.ob-note{font:500 12.5px/1.5 Montserrat,sans-serif;color:rgba(255,255,255,.7);text-align:center;margin:8px 0 0}

  {title:"Tonight's Chart",text:"<p>Each bright star shows a <b>number</b>: how many lines it needs. The faint <b>dotted lines</b> are sight lines, where lines may be drawn.</p><p>Draw the right lines and a real <b>constellation</b> appears, with its story.</p><p>This first page is just for looking. Tap <b>Next</b> to draw your first line.</p>",
    puz:function(){ var C=OB_SKY.filter(function(c){ return c.id==="Cas"; })[0]||OB_SKY[0]; var p=OB.make("lesson",1,C); return p; }},
  {title:"Draw a Line",text:"<p><b>Tap a dotted line</b> to draw it. Tap it again to rub it out. You can also drag from one star to another.</p><p>The middle star needs 2 lines; each end star needs 1. Draw both lines.</p>",done:"<p>Lovely. Every number is matched, so the stars glow gold.</p>",
    puz:function(){ return L([[300,520],[500,420],[700,540]],[[0,1],[1,2]],[[0,1],[1,2]]); }},
  {title:"Count the Lines",text:"<p>A star's number is <b>exactly</b> how many lines it needs: not more, not less.</p><p>The middle star needs <b>3</b> and has exactly 3 sight lines, so draw all three. Then finish the rest.</p>",done:"<p>That's the first trick: when a star's number equals its sight lines, draw them all. And when a star is full, its other sight lines are out.</p>",
    puz:function(){ return L([[230,300],[500,480],[770,300],[500,800],[200,720]],[[1,0],[1,2],[1,3],[3,4]],[[1,0],[1,2],[1,3],[3,4],[0,4],[0,2]]); }},
  {title:"No Crossing",text:"<p><b>Lines can't cross.</b> The two long sight lines here cross in the middle, so at most one of them can be drawn.</p><p>Give every star its number without crossing lines.</p>",done:"<p>Exactly. A drawn line rules out every sight line that crosses it.</p>",
    puz:function(){ return L([[220,500],[780,500],[500,180],[500,820]],[[2,0],[2,1],[1,3]],[[2,0],[2,1],[1,3],[0,1],[2,3]]); }},
  {title:"One Figure",text:"<p>All the stars must join into <b>one figure</b>. The two top stars need 1 line each and could join each other, but then they'd be an <b>island</b>, cut off from the rest.</p><p>Join every star into one figure.</p>",done:"<p>That's the whole of it. Every chart has exactly one answer, and it's always a real constellation.</p>",
    puz:function(){ return L([[200,250],[800,250],[300,600],[700,600],[500,850]],[[0,2],[2,4],[4,3],[3,1]],[[0,2],[2,4],[4,3],[3,1],[0,1],[2,3]]); }},
  {title:"Ruling Out, Hints and Stars",text:"<p>Sure a sight line is wrong? <b>Hold it</b> (or right-click it) to rule it out with a small ✕.</p><p><b>Hint</b> lights up a line you can be sure of. Solve the chart with no hints for <b>★★★</b>, with one or two for ★★.</p><p>A new sky every day: a small constellation on Monday, a big one by Sunday. Keep your streak going!</p>",
    puz:function(){ var C=OB_SKY.filter(function(c){ return c.id==="Lyr"; })[0]||OB_SKY[0]; return OB.make("lesson6",1,C); }}
];
var lessonK=0;
function lessonSetup(k){ lessonK=k; load(LESSONS[k].puz(),"lesson"); if(!LESSONS[k].done) done=true; }

/* ---------- fit to the space ---------- */
var TOOLS=$("#obTools",stage);
function seatedNow(){ return document.body.classList.contains("seated"); }
function fit(){
  var wide=window.innerWidth>=1000, toolsH=(TOOLS.offsetHeight||90)+10, availW, availH;
  var st2=document.querySelector(".pk-stage"), top=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185;
  if(wide){ availW=(st2&&st2.clientWidth)||(window.innerWidth-560); availH=window.innerHeight-top-22-toolsH; }
  else { availW=window.innerWidth-14; availH=window.innerHeight-(seatedNow()?top:56)-(64+24)-toolsH-6; }
  var s=Math.max(260,Math.min(availW,availH,wide?760:640));
  FIT.style.width=FIT.style.height=Math.round(s)+"px";
  TOOLS.style.maxWidth=wide?Math.max(s,520)+"px":"";
  document.body.style.setProperty("--pk-size",Math.round(s)+"px");
}
window.addEventListener("resize",function(){ fit(); if(P&&Math.abs(zoomFor()-Z)>.08){ drawChart(); if(done&&mode!=="lesson") reveal(); } });

/* ---------- hook up the kit ---------- */
Parlor.init({
  game:"observatory", cat:"puzzles", solo:true, free:true, title:"The Observatory", bg:"puzzles-observatory.jpg", home:"puzzles.html", stage:stage,
  soloLabel:"Tonight's chart", dealLabel:"Tonight's Chart",
  tagline:"Join the stars. Find the constellation.", invite:"The dome is open and the first stars are out. Join them with the right lines and tonight's constellation will appear, with its story.",
  players:[{name:"You",color:"#9fb8ff"}],
  rules:{
    play:"<ol><li><b>The goal:</b> draw lines between the stars so that every star has <b>exactly</b> the number of lines it shows.</li><li><b>Sight lines:</b> lines can only be drawn along the faint dotted sight lines. Tap one to draw it, tap again to rub it out. You can also drag from star to star, or tap one star and then another.</li><li><b>No crossing:</b> two drawn lines may never cross.</li><li><b>One figure:</b> all the stars must join into a single figure, with no islands left on their own.</li><li><b>Ruling out:</b> hold a sight line (or right-click it) to mark it with a ✕ when you're sure it's wrong.</li><li>Every chart has exactly one answer: the real figure of a constellation. Solve it and the constellation is revealed, with its brightest stars and its story.</li><li><b>Undo</b> takes back a line, <b>Hint</b> lights up a line you can be sure of (or one that doesn't belong), <b>Restart</b> clears the chart.</li></ol>",
    score:"<ul><li><b>One chart a day</b>, the same for everyone. It changes at midnight on your device. Monday is a small, gentle constellation; through the week they grow bigger and trickier, with the biggest on Sunday.</li><li><b>★★★</b> with no hints · <b>★★</b> with one or two · <b>★</b> otherwise. Your time is shown too.</li><li>Your first finish of the day is the one kept, with your <b>streak</b> of days in a row. Play again as often as you like.</li><li>Practice charts (in Learn to Play) are free and don't count.</li></ul>"
  },
  onNew:function(){ var nb=document.querySelectorAll(".pk-menu .pk-btn, .pk-bar .pk-btn.primary"); [].forEach.call(nb,function(b){ if(b.textContent==="New Game") b.textContent="Tonight's Chart"; }); startDaily(true); },
  lesson:{steps:LESSONS,setup:lessonSetup,practice:startPractice,hint:hint}
});
/* until the room photo arrives, a night-sky gradient stands in behind it */
function skyBg(){ document.body.style.setProperty("--pk-bg",'url("puzzles-observatory.jpg"), radial-gradient(ellipse at 50% 28%, #2a4683 0%, #12214a 45%, #070d22 100%)'); }
skyBg();
var wasSeated=false;
new MutationObserver(function(){ var now=seatedNow(); if(now===wasSeated) return; wasSeated=now; setTimeout(fit,30); setTimeout(fit,400); }).observe(document.body,{attributes:true,attributeFilter:["class"]});
document.addEventListener("DOMContentLoaded",function(){ tools(); skyBg(); startDaily(true); fit(); setTimeout(skyBg,50); });
window.OBS={get:function(){ return {P:P,ink:ink,hints:hints,done:done,mode:mode,sel:sel}; },toggle:toggle,hint:hint,   /* for testing */
  pt:function(x,y){ var r=FIT.getBoundingClientRect(), z=r.width/VB[2]; return [r.left+(x-VB[0])*z,r.top+(y-VB[1])*z]; }};
})();
