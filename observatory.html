/* ===== The Observatory (Puzzles & Brain Games, Oct 31; the chart in perspective, raised stars and wire, Oct 31 later): a daily star-chart puzzle =====
   The stars of a real constellation, each showing how many lines it needs, and dotted sight lines between some of them.
   Draw lines so every star has exactly its number, no two lines cross, and all the stars join into one figure.
   The one answer is the constellation's real figure: solving it reveals the constellation, its bright stars and its story.
   One chart a day (the same for everyone, by the player's own date); Monday is a small, gentle one, Sunday the biggest.
   Scoring: ★★★ with no hints, ★★ with one or two, ★ otherwise. */
.ob-pad{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.ob-fit{position:relative;flex:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ob-fit svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;transform-origin:0 0}
/* zoomed in (Oct 31): the chart is seen through a brass-rimmed eyepiece window */
.ob-fit.zoomed{overflow:hidden;border-radius:14px}
.ob-rim{position:absolute;z-index:4;display:none;border-radius:14px;pointer-events:none;border:2px solid rgba(231,199,122,.8);box-shadow:inset 0 0 0 1px rgba(60,40,10,.6),inset 0 0 22px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.35)}
.ob-fit.zoomed .ob-rim{display:block}
.ob-zbtn{position:absolute;z-index:5;right:10px;bottom:10px;pointer-events:auto;display:none;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:1px solid rgba(231,199,122,.75);background:rgba(8,14,32,.82);color:#f0d27a;font:700 13px Montserrat,sans-serif;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.4);touch-action:manipulation}
.ob-zbtn.on{display:inline-flex}
.ob-toast{position:absolute;z-index:6;left:50%;top:4px;transform:translateX(-50%);width:max-content;max-width:88%;padding:8px 14px;border-radius:12px;background:rgba(8,14,32,.9);border:1px solid rgba(231,199,122,.6);color:#fff;font:600 14px/1.4 Montserrat,sans-serif;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ob-toast.on{opacity:1}
.ob-tools{display:flex;flex-direction:column;align-items:center;gap:7px;padding:7px 10px;border-radius:12px;background:rgba(10,18,40,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.ob-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:center}
.ob-tools .pk-btn{width:auto;margin:0;padding:8px 14px;min-height:0;white-space:nowrap}
.ob-tools .pk-btn.gold{border-color:rgba(231,199,122,.75);color:#f0d27a;background:rgba(212,175,55,.16)}
.ob-count{font:600 13px Montserrat,sans-serif;color:#fff;padding:0 6px;white-space:nowrap}
.ob-count b{color:#f0d27a;font-weight:700}
.ob-help{font:600 11.5px/1.45 Montserrat,sans-serif;color:rgba(255,255,255,.72);text-align:center;max-width:560px}
.ob-pulse{animation:ob-pulse .8s ease 3}
@keyframes ob-pulse{50%{box-shadow:0 0 0 6px rgba(240,210,122,.55);transform:scale(1.06)}}
.ob-tw{animation:ob-tw 4s ease-in-out infinite}
@keyframes ob-tw{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){ .ob-tw{animation:none} }

.ob-stars{font-size:30px;letter-spacing:6px;color:#f0d27a;text-shadow:0 2px 10px rgba(240,210,122,.45);margin:2px 0 6px;text-align:center}
.ob-stars i{font-style:normal;color:rgba(255,255,255,.22);text-shadow:none}

<script>
/* ===== Observatory core (rules, solver, daily maker) — shared by the page and the tests =====
   A puzzle: the stars of a real constellation, each showing how many lines it needs, and dotted "sight lines"
   between some pairs of stars. Ink some sight lines so that: every star has exactly its number of lines,
   no two lines cross, and all the stars join into one figure. The answer is the constellation's real figure,
   and the maker only keeps a day's puzzle if that figure is its one and only answer. */
var OB = (function () {
  "use strict";
  function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function hash(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function orient(a, b, c) { return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]); }
  function crosses(p1, p2, p3, p4) { return orient(p1, p2, p3) * orient(p1, p2, p4) < 0 && orient(p3, p4, p1) * orient(p3, p4, p2) < 0; }

  function build(nodes, figure, cand) {
    var N = nodes.length, need = new Array(N).fill(0), inc = [], X = [], key = {};
    figure.forEach(function (e) { need[e[0]]++; need[e[1]]++; });
    for (var i = 0; i < N; i++) inc.push([]);
    cand.forEach(function (e, k) { inc[e[0]].push(k); inc[e[1]].push(k); key[Math.min(e[0], e[1]) + "," + Math.max(e[0], e[1])] = k; X.push([]); });
    for (var a = 0; a < cand.length; a++) for (var b = a + 1; b < cand.length; b++) {
      var A = cand[a], B = cand[b]; if (A[0] === B[0] || A[0] === B[1] || A[1] === B[0] || A[1] === B[1]) continue;
      if (crosses(nodes[A[0]], nodes[A[1]], nodes[B[0]], nodes[B[1]])) { X[a].push(b); X[b].push(a); }
    }
    var sol = new Int8Array(cand.length); figure.forEach(function (e) { sol[key[Math.min(e[0], e[1]) + "," + Math.max(e[0], e[1])]] = 1; });
    return { nodes: nodes, N: N, cand: cand, need: need, inc: inc, X: X, sol: sol, key: key };
  }
  function comps(P, s) {   /* union-find over inked lines */
    var p = []; for (var i = 0; i < P.N; i++) p.push(i);
    function f(x) { while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; }
    for (var k = 0; k < P.cand.length; k++) if (s[k] === 1) { var a = f(P.cand[k][0]), b = f(P.cand[k][1]); if (a !== b) p[a] = b; }
    return f;

  function counts(P, s, v) { var n = 0, u = 0; P.inc[v].forEach(function (k) { if (s[k] === 1) n++; else if (s[k] < 0) u++; }); return [n, u]; }
  function setIn(P, s, k) { if (s[k] === 0) return false; s[k] = 1; for (var j = 0; j < P.X[k].length; j++) { var x = P.X[k][j]; if (s[x] === 1) return false; s[x] = 0; } return true; }

  /* the basic rules a person uses (returns false if the lines so far can't be right):
     a star whose number is reached loses its other sight lines; a star that needs all its remaining sight lines gets them;
     an inked line rules out every line crossing it; a line that would close off a finished island (not everything) is ruled out */
  function propagate(P, s) {
    for (var guard = 0; guard < 400; guard++) {
      var changed = false, v, k, c;
      for (v = 0; v < P.N; v++) {
        c = counts(P, s, v);
        if (c[0] > P.need[v] || c[0] + c[1] < P.need[v]) return false;
        if (!c[1]) continue;
        if (c[0] === P.need[v]) { P.inc[v].forEach(function (k) { if (s[k] < 0) s[k] = 0; }); changed = true; }
        else if (c[0] + c[1] === P.need[v]) { for (var q = 0; q < P.inc[v].length; q++) { k = P.inc[v][q]; if (s[k] < 0 && !setIn(P, s, k)) return false; } changed = true; }
      }
      for (k = 0; k < P.cand.length; k++) if (s[k] === 1) for (var j = 0; j < P.X[k].length; j++) { var x = P.X[k][j]; if (s[x] === 1) return false; if (s[x] < 0) { s[x] = 0; changed = true; } }
      /* islands */
      var f = comps(P, s), size = {}, open = {}, deg = new Array(P.N).fill(0);
      for (k = 0; k < P.cand.length; k++) if (s[k] === 1) { deg[P.cand[k][0]]++; deg[P.cand[k][1]]++; }

      for (k = 0; k < P.cand.length; k++) if (s[k] < 0) {
        var a = P.cand[k][0], b = P.cand[k][1], ra = f(a), rb = f(b);
        var left = ra === rb ? (open[ra] || 0) - 2 : (open[ra] || 0) + (open[rb] || 0) - 2, sz = ra === rb ? size[ra] : size[ra] + size[rb];

      function gf(x) { while (g[x] !== x) { g[x] = g[g[x]]; x = g[x]; } return x; }
      var parts = P.N;
      for (k = 0; k < P.cand.length; k++) if (s[k] !== 0) { var ga = gf(P.cand[k][0]), gb = gf(P.cand[k][1]); if (ga !== gb) { g[ga] = gb; parts--; } }

  function done(P, s) { for (var k = 0; k < s.length; k++) if (s[k] < 0) return false; return true; }

    for (var v = 0; v < P.N; v++) if (counts(P, s, v)[0] !== P.need[v]) return false;
    for (var k = 0; k < s.length; k++) if (s[k] === 1) for (var j = 0; j < P.X[k].length; j++) if (s[P.X[k][j]] === 1) return false;

  function countSol(P, s0, limit) {
    var found = 0, nodesSeen = 0;
    (function dfs(s) {
      if (found >= limit || ++nodesSeen > 200000) return;
      if (!propagate(P, s)) return;
      var best = -1, bu = 1e9;
      for (var v = 0; v < P.N; v++) { var c = counts(P, s, v); if (c[1] && c[1] < bu) { bu = c[1]; best = v; } }
      if (best < 0) { if (valid(P, s)) found++; return; }
      var k = -1; for (var q = 0; q < P.inc[best].length; q++) if (s[P.inc[best][q]] < 0) { k = P.inc[best][q]; break; }
      var a = Int8Array.from(s); if (setIn(P, a, k)) dfs(a);

  }
  function blank(P) { return new Int8Array(P.cand.length).fill(-1); }
  /* solve the way a person would: the basic rules, and (level 2) "if I drew this line, would something break?" */
  function logic(P, level, s0) {
    var s = s0 ? Int8Array.from(s0) : blank(P), deep = 0;
    if (!propagate(P, s)) return { ok: false, s: s, deep: 0 };
    for (var guard = 0; guard < 200 && !done(P, s); guard++) {
      if (level < 2) break;
      var moved = false;
      for (var k = 0; k < s.length && !moved; k++) if (s[k] < 0) {
        var a = Int8Array.from(s); if (!setIn(P, a, k) || !propagate(P, a)) { s[k] = 0; moved = true; }
        else { var b = Int8Array.from(s); b[k] = 0; if (!propagate(P, b)) { setIn(P, s, k); moved = true; } }

      if (!moved) break; deep++;

  /* the next thing to tell a stuck player: a line that must be drawn or must go, given the right lines they already have */
  function hint(P, ink) {
    for (var k = 0; k < ink.length; k++) if (ink[k] === 1 && !P.sol[k]) return { k: k, wrong: true };

     Stars = the size of constellation; decoy = extra sight lines per figure line; level 1 = the basic rules alone solve it,
     level 2 = sometimes you have to think "if I drew that, something would break".
     Each constellation belongs to one weekday (by its number of stars), so the same one never comes round within a week. */
  var DAYS = {
    1: { name: "Monday",    lo: 5,  hi: 5,  decoy: .45, level: 1 },
    2: { name: "Tuesday",   lo: 6,  hi: 7,  decoy: .6,  level: 1 },
    3: { name: "Wednesday", lo: 8,  hi: 9, decoy: .75, level: 1 },
    4: { name: "Thursday",  lo: 10, hi: 12, decoy: .85, level: 1 },
    5: { name: "Friday",    lo: 13, hi: 15, decoy: 1,   level: 2 },
    6: { name: "Saturday",  lo: 16, hi: 18, decoy: 1.1, level: 2 },
    0: { name: "Sunday",    lo: 19, hi: 27, decoy: 1.25, level: 2 }

  function pick(SKY, wd, dayNo) {
    var D = DAYS[wd], list = bucket(SKY, D).slice(), r = rng(hash("observatory-order:" + wd));
    for (var i = list.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), t = list[i]; list[i] = list[j]; list[j] = t; }

  function make(seedStr, wd, C, opts) {
    var D = DAYS[wd], rand = rng(hash("observatory:" + seedStr)), nodes = C.n.map(function (s) { return [s[0], s[1]]; }), fig = C.e.map(function (e) { return [e[0], e[1]]; });
    var figKey = {}; fig.forEach(function (e) { figKey[Math.min(e[0], e[1]) + "," + Math.max(e[0], e[1])] = 1; });

      for (var q = 0; q < list.length; q++) { var e = list[q], o = e[0] === a ? e[1] : e[1] === a ? e[0] : -1; if (o < 0) continue;

    for (var a = 0; a < nodes.length; a++) for (var b = a + 1; b < nodes.length; b++) {
