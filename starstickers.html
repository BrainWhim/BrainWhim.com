<style>
/* Star Stickers (The Outpost · The Telescope), Nov 17. Connect the stars of a real constellation, just like its star card, to win its sticker
   for the Sticker Book (29 to collect). Three a day. Nov 17 (Judy): played like the Observatory, a little easier: numbers on the stars, dotted sight lines with decoys, tap a line to draw or erase it.
   Star data: stickers-sky.js (from the Observatory's d3-celestial data; keep its license notice). Pictures in sk/ (html.ph once loaded). */
.bg{filter:blur(1.2px) brightness(.66) saturate(1.05)}
#play{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:6px}
.cbar{width:min(720px,100%);margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:16px;color:#2b2116;flex:none;
  background:linear-gradient(180deg,#f4ead3,#e6d6b2);box-shadow:0 4px 0 #b89f6e,0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 #fff}
.cday{flex:1;text-align:center;line-height:1.15}
.cday b{display:block;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#2f6fb8}
.cday span{font-size:14px;font-weight:700;color:#5a4220}
.ib{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;min-height:40px;padding:0 13px;border-radius:12px;color:#3a2306;
  background:linear-gradient(180deg,#ffe7a6,#e9c46a);box-shadow:0 3px 0 #a97a1c}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #a97a1c}
.ib.gh{background:rgba(120,80,20,.1);box-shadow:none;color:#6b4a1a}
.top{flex:none;min-height:96px;width:min(720px,100%);margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 4px}
.cmsg{flex:1;text-align:center;font-weight:700;font-size:16px;line-height:1.3;color:#fff4dc;text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 2px #000;padding:0 4px}
/* the star card: the pattern to copy, inked on a parchment card */
#card{flex:none;width:92px;height:92px;border-radius:10px;position:relative;margin-bottom:16px;background:linear-gradient(160deg,#f6ecd2,#e3cfa3);
  box-shadow:0 3px 0 #a8875a,0 8px 16px rgba(0,0,0,.45),inset 0 1px 0 #fffaf0}
html.phcard #card{background:url("sk/card.webp?v=1117a") center/100% 100%;box-shadow:0 6px 14px rgba(0,0,0,.45)}
#card svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);overflow:visible}
html.phcard #card svg{inset:12px;width:calc(100% - 24px);height:calc(100% - 24px)}
#card b{position:absolute;left:0;right:0;bottom:-17px;text-align:center;font-size:11.5px;font-weight:800;color:#fff4dc;text-shadow:0 1px 4px #000;white-space:nowrap}
#stage{position:relative;flex:1 1 auto;min-height:0;width:100%;user-select:none;-webkit-user-select:none}
/* the sky */
#sky{position:absolute;border-radius:18px;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 80% at 70% 20%,rgba(120,80,170,.28),transparent 60%),radial-gradient(90% 70% at 20% 90%,rgba(40,90,160,.3),transparent 60%),linear-gradient(170deg,#0d1838,#060b1f 70%,#03060f);
  box-shadow:0 0 0 3px #7a5a2a,0 0 0 6px #c9a052,0 0 0 8px #6b4a1c,0 14px 30px rgba(0,0,0,.6)}
html.phsky #sky{background:url("sk/sky.jpg?v=1117a") center/cover}
#sky svg{position:absolute;inset:0;width:100%;height:100%}
#sky .bwp{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font:800 10px/1 Outfit,system-ui,sans-serif;letter-spacing:.06em;color:#4a300c;z-index:6;
  padding:3px 6px 2px;border-radius:4px;background:linear-gradient(180deg,#f6dc8e,#c99a3c);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 1px 3px rgba(0,0,0,.5)}
.tw{animation:twk 3s ease-in-out infinite}
.tw2{animation:twk2 2.6s ease-in-out infinite}
@keyframes twk2{50%{opacity:.7;transform:scale(.85)}}
.sl .hl{animation:hpul .8s ease-in-out infinite;opacity:.8}
#sky .st{pointer-events:none}
@keyframes twk{50%{opacity:.35}}
.st{cursor:pointer}
.st .ring{opacity:0;transition:opacity .15s}
.st.sel .ring{opacity:1}
.st.hint .ring{opacity:1;animation:hpul .8s ease-in-out infinite}
@keyframes hpul{50%{opacity:.3}}
.ln{stroke-linecap:round}
.ln.bad{animation:lbad .6s forwards}
@keyframes lbad{0%{opacity:1}100%{opacity:0}}
#stk{position:absolute;pointer-events:none;opacity:0;transform:scale(.4);transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .35s}
#stk.on{opacity:1;transform:none}
#stk img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.stars{font-size:34px;letter-spacing:4px;color:#f2be45;text-shadow:0 2px 0 #8a5f12;margin:2px 0 4px}
.stars i{font-style:normal;color:rgba(255,255,255,.18);text-shadow:none}
.how svg{display:block;width:min(260px,100%);margin:4px auto 10px}
/* the found sheet and the Sticker Book */
.fnd{display:flex;flex-direction:column;align-items:center;text-align:center}
.fnd .pic{width:150px;height:150px;margin:2px auto 6px}
.fnd .pic img,.fnd .pic svg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.fnd .new{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#3a2306;background:linear-gradient(180deg,#ffe7a6,#e9c46a);border-radius:20px;padding:3px 10px;margin-bottom:4px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;max-height:min(58vh,460px);overflow:auto;margin:8px 0 12px;padding:10px;border-radius:14px;
  background:linear-gradient(180deg,#f6ecd2,#e8d6ae);box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
html.phpage .book{background:url("sk/page.jpg?v=1117a") 0 0/215px 215px repeat;box-shadow:inset 0 2px 6px rgba(0,0,0,.25)}
.slot{appearance:none;border:0;font:inherit;cursor:pointer;background:rgba(120,90,40,.1);border-radius:12px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5a3c14}
.slot .p{width:64px;height:64px;display:grid;place-items:center}
.slot .p img,.slot .p svg{width:100%;height:100%;object-fit:contain}
.slot i{font-style:normal;font-size:11.5px;font-weight:800;line-height:1.15;text-align:center}
.slot.no{cursor:default}
.slot.no .p{border:2px dashed rgba(120,90,40,.35);border-radius:50%;width:54px;height:54px;font-size:22px;font-weight:800;color:rgba(120,90,40,.45)}
.slot .x{font-size:10.5px;color:#8a6a3a}
@media (max-width:400px){#card{width:80px;height:80px}.cmsg{font-size:15px}}

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);}, LS=BWK.store, AV="1117a";

var SKY=SK_SKY, BYID={}; SKY.forEach(function(c){ BYID[c.id]=c; });

/* ---------- photos: the sky, the star card, the book page, and one sticker per constellation (each used as soon as it arrives) ---------- */
var PH=false, STK={};
function pic(f){ return "sk/"+f+"?v="+AV; }

  SKY.forEach(function(c){ var i=new Image(); i.onload=function(){ STK[c.st]=true; }; i.src=pic(c.st+".webp"); }); })();
var UID=0;

  c.e.forEach(function(e){ var p=c.n[e[0]], q=c.n[e[1]]; g+='<line x1="'+(p[0]*sc+ox).toFixed(1)+'" y1="'+(p[1]*sc+oy).toFixed(1)+'" x2="'+(q[0]*sc+ox).toFixed(1)+'" y2="'+(q[1]*sc+oy).toFixed(1)+'"/>'; });
  var d=""; c.n.forEach(function(p){ d+='<circle cx="'+(p[0]*sc+ox).toFixed(1)+'" cy="'+(p[1]*sc+oy).toFixed(1)+'" r="'+Math.max(1.6,3.6-p[2]*.4).toFixed(1)+'"/>'; });
  return '<svg viewBox="0 0 100 100"><defs><radialGradient id="'+id+'" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#2b4a8e"/><stop offset="1" stop-color="#0c1736"/></radialGradient></defs>'+
    '<circle cx="51" cy="53" r="47" fill="rgba(0,0,0,.25)"/><circle cx="50" cy="50" r="47" fill="#fff"/><circle cx="50" cy="50" r="41" fill="url(#'+id+')"/>'+
    '<g stroke="#f2c860" stroke-width="2.2" stroke-linecap="round">'+g+'</g><g fill="#fff8e0">'+d+'</g><path d="M20 30A38 38 0 0 1 60 12" stroke="#fff" stroke-opacity=".35" stroke-width="4" fill="none" stroke-linecap="round"/></svg>'; }
function sticker(c){ return STK[c.st]?'<img alt="" src="'+pic(c.st+".webp")+'">':badge(c); }
function bbox(c){ var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; c.n.forEach(function(p){ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); }); return {x:x0,y:y0,w:x1-x0,h:y1-y0}; }
function short(c){ return c.nm.split(",")[0]; }
function what(c){ return c.nm.split(", ")[1]||c.nm; }

/* ---------- sound ---------- */
/* ---------- sound of its own ---------- */
var AC=null, OUT=null;
function ac(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C();
    var comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=4;
    OUT=AC.createGain(); OUT.gain.value=.9; OUT.connect(comp); comp.connect(AC.destination); }
  if(AC.state!=="running"){ try{ AC.resume(); }catch(e){} } return AC; }
function unlock(){ try{ if(navigator.audioSession&&navigator.audioSession.type!=="playback") navigator.audioSession.type="playback"; }catch(e){} var a=ac(); if(!a) return;
  if(a.state!=="running"||!a._u){ try{ var b=a.createBuffer(1,1,22050), s=a.createBufferSource(); s.buffer=b; s.connect(a.destination); s.start(0); a._u=1; }catch(e){} } }
["pointerdown","pointerup","touchend","click","keydown"].forEach(function(ev){ document.addEventListener(ev,unlock,{capture:true,passive:true}); });
function on(){ return LS.get("sound",true)!==false && !!ac(); }
function tone(f,at,d,v,type,f2){ if(!on()) return; var t=AC.currentTime+(at||0), o=AC.createOscillator(), g=AC.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(OUT); o.start(t); o.stop(t+d+.05); }
var NB=null;
function nbuf(){ if(!NB){ NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); var c=NB.getChannelData(0); for(var i=0;i<c.length;i++) c[i]=Math.random()*2-1; } return NB; }

  f.type="bandpass"; f.frequency.value=Math.sqrt(lo*hi); f.Q.value=Math.max(.3,Math.sqrt(lo*hi)/(hi-lo)); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t); s.stop(t+d+.05); }

function sStar(k){ var f=[1047,1175,1319,1568,1760,2093][k%6]; tone(f,0,.25,.05,"sine"); tone(f*2,.01,.18,.02,"sine"); }
function sLine(k){ var f=[784,880,988,1047,1175,1319,1397,1568][k%8]; tone(f,0,.3,.07,"triangle"); tone(f*1.5,.06,.35,.05,"triangle"); noise(0,.12,.04,4000,10000); }
function sErase(){ tone(660,0,.12,.05,"triangle",440); }
function sNope(){ tone(260,0,.18,.1,"sine",190); }
function sStick(){ noise(0,.07,.22,800,3000); tone(140,.02,.12,.18,"sine",90); }
function sFound(){ [1047,1319,1568,2093,2637].forEach(function(f,i){ tone(f,i*.07,.5,.06,"triangle"); }); noise(0,.6,.03,5000,12000); }
function sWin(){ [523,659,784,1047,1319,1568].forEach(function(f,i){ tone(f,i*.08,.45,.08,"triangle"); }); }

/* ---------- the week: three constellations a day ---------- */
var DAYN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var LVD=[{c:[1,1,1],g:1},{c:[1,1,2],g:1},{c:[1,2,2],g:0},{c:[2,2,3],g:0},{c:[2,3,3],g:0},{c:[3,3,4],g:0},{c:[3,4,5],g:0}];
var FOOT=["Small constellations with only a few trick lines. A gentle start!","A bigger one, and a few more trick lines.","More trick lines to watch out for.","Bigger constellations.","Bigger still, with lots of trick lines!","Big ones with lots of lines.","The biggest: the Great Bear or Orion. The trickiest of the week!"];
function today(){ var d=new Date(); return {n:Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5), wd:d.getDay()}; }
function lvOf(wd){ return (wd+6)%7; }
function rng(s){ s=(s>>>0)||1; return function(){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
function dayPicks(lv,seed){ var R=rng(seed*2654435761+17), out=[];
  LVD[lv].c.forEach(function(l){ var pool=SKY.filter(function(c){ return c.lv===l&&out.indexOf(c.id)<0; }); out.push(pool[Math.floor(R()*pool.length)].id); }); return out; }
function bonusPick(lv){ var mx=Math.max.apply(null,LVD[lv].c), pool=SKY.filter(function(c){ return c.lv<=mx&&!ST.book[c.id]; }); if(!pool.length) pool=SKY.filter(function(c){ return c.lv<=mx; });
  return [pool[Math.floor(Math.random()*pool.length)].id]; }

var P=null, C=null, gen=0, busy=false, GEO=null, said={}, SEL=-1, DR={}, HR=[];

function say(t){ BWK.say(t); }
function sayOnce(k,t){ if(said[k]) return; said[k]=1; say(t); }
function ek(a,b){ return a<b?a+"-"+b:b+"-"+a; }

  document.body.className="m-play"; $("#cday").textContent=bonus?"Bonus Stars":(DAYN[t.wd]+"'s Stars");
  if(!bonus&&ST.day===t.n&&ST.cur){ var c=ST.cur; P={lv:c.lv,i:c.i||0,hints:c.hints||0,done:!!c.done,bonus:false,ids:dayPicks(c.lv,t.n),dr:c.dr||[]}; }
  else P={lv:lv,i:0,hints:0,done:false,bonus:!!bonus,ids:bonus?bonusPick(lv):dayPicks(lv,t.n),dr:[],bseed:(Math.random()*1e9)|0};
  if(P.done) P.i=P.ids.length-1;

  if(P.done){ C.e.forEach(function(e){ DR[ek(e[0],e[1])]=1; }); drawSky(); drawCard(true); msg("All of tonight's stars are found! Tap Menu for Bonus Stars."); return; }

function saveCur(){ if(!P||P.bonus) return; ST.day=today().n; ST.cur={lv:P.lv,i:P.i,hints:P.hints,done:P.done,dr:Object.keys(DR)}; save(); }

  puzzle(); $("#cnum").textContent=(P.bonus?"":"Constellation "+(P.i+1)+" of "+P.ids.length+" · ")+C.n.length+" stars";
  $("#stk").classList.remove("on"); HK=-1; layout(); drawCard(false); }

/* ---------- the puzzle (Nov 17, Judy: "more like the Observatory"): numbers on the stars, dotted sight lines with decoys ---------- */
/* Star Stickers puzzle maker (inlined in the page): sight lines = the real figure + decoys, kept only while the answer stays unique. */
var SKPZ=(function(){
function cross(a,b,c,d){ function o(p,q,r){ var v=(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]); return v>1e-9?1:v<-1e-9?-1:0; }
  return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0; }
function segDist(p,a,b){ var dx=b[0]-a[0], dy=b[1]-a[1], t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy); t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy); }
function rng(s){ s=(s>>>0)||1; return function(){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
/* count solutions (up to 2): degrees exact, no crossings, one connected figure */
function count(n,E,deg,X,limit){ var m=E.length, on=new Array(m).fill(0), d=new Array(n).fill(0), left=new Array(n).fill(0), ban=new Array(m).fill(0), found=0;
  E.forEach(function(e){ left[e[0]]++; left[e[1]]++; });
  function conn(){ var adj=[]; for(var i=0;i<n;i++) adj.push([]); E.forEach(function(e,k){ if(on[k]){ adj[e[0]].push(e[1]); adj[e[1]].push(e[0]); } });
    var seen=[0], s=[0], vis={0:1}; while(s.length){ var x=s.pop(); adj[x].forEach(function(y){ if(!vis[y]){ vis[y]=1; s.push(y); } }); } return Object.keys(vis).length===n; }
  function go(k){ if(found>=limit) return;
    if(k===m){ for(var i=0;i<n;i++) if(d[i]!==deg[i]) return; if(conn()) found++; return; }
    var a=E[k][0], b=E[k][1];
    left[a]--; left[b]--;
    /* try on */
    if(!ban[k]&&d[a]<deg[a]&&d[b]<deg[b]){ on[k]=1; d[a]++; d[b]++; X[k].forEach(function(j){ ban[j]++; });
      if(d[a]+left[a]>=deg[a]&&d[b]+left[b]>=deg[b]) go(k+1);
      X[k].forEach(function(j){ ban[j]--; }); on[k]=0; d[a]--; d[b]--; }
    /* try off */
    if(d[a]+left[a]>=deg[a]&&d[b]+left[b]>=deg[b]) go(k+1);
    left[a]++; left[b]++; }
