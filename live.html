<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live · BrainWhim</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root { --studio-bg: #1A244D; --track-glow: #10B981; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--studio-bg); color: #CBD5E1; font-family: 'Montserrat', sans-serif; padding-top: 110px; }
        
        header {
            background: linear-gradient(to top, rgba(26,36,77,0.8), #233266); backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--track-glow); padding: 0 4%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; height: 110px; z-index: 9999;
        }
        .header-left-group { display: flex; align-items: center; gap: 8px; }
        .header-brand-container { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .header-logo-asset { width: 100px; height: 100px; object-fit: contain; }
        .header-brand-text { font-size: 30px; display: flex; align-items: baseline; }
        .brand-brain { font-weight: 600; color: #fff; }
        .brand-whim { font-family: 'Pacifico', cursive; color: #7EB6D9; }

        .page-wrap {
            min-height: calc(100vh - 110px); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
            background-image: radial-gradient(1px 1px at 120px 90px, #fff, rgba(0,0,0,0)), radial-gradient(1.5px 1.5px at 280px 160px, rgba(255,255,255,0.4), rgba(0,0,0,0));
            background-size: 380px 380px;
        }
        .aurora-glow { position: absolute; width: 75vw; height: 75vw; border-radius: 50%; filter: blur(130px); background: radial-gradient(circle, var(--track-glow) 0%, transparent 70%); top: 10%; opacity: 0.45; pointer-events: none; }

        .orbit { position: relative; width: 420px; height: 420px; display: flex; justify-content: center; align-items: center; }
        .orbit::before { content: ""; position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.15); }
        
        .center-orb {
            width: 160px; height: 160px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-weight: 700; font-size: 22px; z-index: 5;
            background: #243266; box-shadow: 0 0 50px var(--track-glow), inset 0 0 35px var(--track-glow);
        }
        .center-orb-icon { width: 46px; height: 46px; object-fit: contain; margin-bottom: 6px; }

        .orbit-ring { position: absolute; inset: 0; animation: spin 28s linear infinite; }
        .sat-wrap { position: absolute; top: 50%; left: 50%; width: 110px; height: 110px; }
        
        .sat-orb {
            width: 100%; height: 100%; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-decoration: none; font-size: 11px; font-weight: 600; text-align: center;
            background: #1C264E; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 0 35px var(--track-glow), inset 0 0 20px var(--track-glow);
            animation: counter-spin 28s linear infinite;
        }
        .orb-icon { font-size: 24px; margin-bottom: 4px; }

        .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-168px) rotate(0deg); }
        .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-168px) rotate(120deg); }
        .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-168px) rotate(240deg); }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counter-spin { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        .back-link { margin-top: 40px; color: #7EB6D9; text-decoration: none; font-weight: 600; }
        
        @media (max-width: 992px) {
            header { height: 96px; padding: 0 14px; }
            .header-logo-asset { width: 58px; height: 58px; }
            .header-brand-text { font-size: 22px; }
            body { padding-top: 96px; }
            .orbit { width: 320px; height: 320px; }
            .center-orb { width: 130px; height: 130px; font-size: 18px; }
            .sat-wrap { width: 90px; height: 90px; }
            .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-125px) rotate(0deg); }
            .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-125px) rotate(120deg); }
            .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-125px) rotate(-240deg); }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left-group">
            <a href="index.html" class="header-brand-container">
                <img src="logo-image.png" alt="BrainWhim" class="header-logo-asset">
                <div class="header-brand-text"><span class="brand-brain">Brain</span><span class="brand-whim">Whim</span></div>
            </a>
        </div>
    </header>
    <div class="page-wrap">
        <div class="aurora-glow"></div>
        <div class="orbit">
            <div class="center-orb">
                <img src="orb-brain.png" alt="" class="center-orb-icon">
                <span>Live</span>
            </div>
            <div class="orbit-ring">
                <div class="sat-wrap sat-1"><a class="sat-orb" href="#"><span class="orb-icon">🌱</span>Recovery<br>Mindful</a></div>
                <div class="sat-wrap sat-2"><a class="sat-orb" href="#"><span class="orb-icon">🍳</span>Recipes<br>Routines</a></div>
                <div class="sat-wrap sat-3"><a class="sat-orb" href="#"><span class="orb-icon">💵</span>Personal<br>Finance</a></div>
            </div>
        </div>
        <a class="back-link" href="index.html">← Back to Studio</a>
    </div>
</body>
</html>
