/* ===== Study Spades: the study's square card table seen from straight above, drawn in the browser =====
   Same table machinery as Rose Garden Hearts (four seats, your hand along your side, the trick in the middle), on a
   square table with canted corners. Tables (the Tables card): one free, two for Club members. */
.ce-pad{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.ce-fit{position:relative;flex:none}
.ce-table{position:absolute;left:0;top:0;transform-origin:0 0}
.ce-round{position:absolute;left:0;top:0;width:1000px;height:1000px;border-radius:50%;background:var(--ce-rimc);background-image:var(--ce-rim);background-size:cover;

.ce-round::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 26%,rgba(255,236,200,.3),rgba(255,236,200,0) 46%),radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.4) 100%)}
.ce-bead{position:absolute;inset:34px;border-radius:50%;border:2px solid var(--ce-bead);box-shadow:0 1px 0 rgba(255,240,210,.25),inset 0 1px 0 rgba(0,0,0,.4)}
.ce-felt{position:absolute;inset:44px;border-radius:50%;background-color:var(--ce-feltc);
  background-image:radial-gradient(ellipse 18% 11% at 62% 28%,rgba(255,250,215,.17),rgba(255,250,215,0)),radial-gradient(ellipse 14% 9% at 74% 44%,rgba(255,250,215,.14),rgba(255,250,215,0)),radial-gradient(ellipse 20% 12% at 40% 70%,rgba(255,250,215,.1),rgba(255,250,215,0)),radial-gradient(ellipse 12% 8% at 26% 40%,rgba(255,250,215,.09),rgba(255,250,215,0)),
    radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.36)),var(--ce-felt);background-size:auto,auto,auto,auto,auto,512px 512px;
  box-shadow:inset 0 6px 14px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.45)}
.ce-round.nocups .ce-cup{display:none}
.ce-cup{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#1a1208 0 34%,rgba(0,0,0,0) 36%),radial-gradient(circle at 35% 30%,#fff1c2,#d9b25a 45%,#7a5518 85%);
  box-shadow:0 2px 3px rgba(0,0,0,.5),inset 0 -1px 2px rgba(0,0,0,.4)}
.ce-mono{position:absolute;left:50%;top:922px;transform:translate(-50%,-50%);display:flex;align-items:baseline;font-size:24px;line-height:1;pointer-events:none}
.ce-mono b,.ce-mono i{display:inline-block;color:transparent;background:linear-gradient(170deg,#fff1bf,#d9b25a 45%,#8f6a22 75%,#f3d68b);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.ce-mono b{font:500 1em Montserrat,sans-serif}.ce-mono i{font:400 .76em Pacifico,cursive;font-style:normal;margin-left:.05em;padding-right:.15em}
.ce-shelf{position:absolute;left:10px;right:10px;border-radius:26px;background:rgba(15,23,42,.42);border:1.5px solid rgba(255,255,255,.14);display:none}
.ce-table.narrow .ce-shelf{display:block}
#ceCards{position:absolute;left:0;top:0}

  background:rgba(15,23,42,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(231,199,122,.45);max-width:94vw}

/* ---- Study Spades ---- */
/* the four seats: a name chip with the score and this hand's points */
.ht-chip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:12px;background:rgba(15,23,42,.66);border:1.5px solid rgba(255,255,255,.18);
  color:#fff;font:700 16px Montserrat,sans-serif;white-space:nowrap;pointer-events:none;z-index:640;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:border-color .25s,box-shadow .25s}

.ce-table.narrow .ht-chip .av{width:40px;height:40px}
.ce-table.narrow .ht-chip .hp{font-size:23px}

.ht-mid{position:absolute;left:500px;top:480px;transform:translate(-50%,-50%);padding:10px 18px;border-radius:14px;background:rgba(15,23,42,.6);border:1.5px solid rgba(231,199,122,.45);
  color:#f3e3b6;font:700 18px Montserrat,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-align:center;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;z-index:120}

.ce-table.narrow .ht-mid{font-size:26px}.ce-table.narrow .ht-mid b{font-size:62px}
/* cards: playable ones stand up a little and glow; cards you've chosen to pass stand up; cards passed to you glow blue */
.ce-table .bwc.can .fc{box-shadow:inset 0 0 0 3px rgba(214,164,62,.95),inset 0 0 16px 2px rgba(240,190,90,.45)}

.ce-table .bwc.recv .fc{box-shadow:inset 0 0 0 3px rgba(120,190,255,.95),inset 0 0 14px 3px rgba(140,200,255,.45)}
.ce-table .bwc.pick .fc{box-shadow:inset 0 0 0 4px #e9b949,inset 0 0 20px 5px rgba(250,205,110,.6)}
.ce-table .bwc.won .fc{box-shadow:inset 0 0 0 3px rgba(242,199,90,.9)}
/* the hand-over window lists the four players */
.ht-tally{width:100%;border-collapse:collapse;margin:0 0 16px;font:600 20px Montserrat,sans-serif;color:#fff}

.ce-round.sq .ce-mono{top:918px}

.sp-bids{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:0 0 12px}
.sp-bids button{padding:12px 0;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,250,240,.94);cursor:pointer;font:700 22px Montserrat,sans-serif;color:#17171c}

<script>
var K=BWCards, PT=K.paint;
/* ===== Study Spades =====
   The study's square card table seen from straight above (canted corners, a wooden frame round the playing
   surface), drawn in the browser. Four seats in two partnerships: you (South) and your partner across (North)
   against the players on your left (West) and right (East). Seats are numbered 0-3 clockwise: 0 South, 1 West,
   2 North, 3 East; partners are 0 & 2 and 1 & 3. Each window turns the table so its own seat is at the bottom
   (view 0 = me, 1 = left, 2 = across = partner, 3 = right).
   Against The House: Oliver is your partner, Clara and Henry your opponents. Online (Oct 28), two people play as partners:
   the host sits South and the guest North, across from each other, against two House players (played from the host's window). */

/* ---------- the three tables ---------- */
function frameFn(o,H){ H=H||1000; var wood=PT.woodFn(o); return function(x,y){ var c=wood(x,y), dx=Math.min(x,1000-x), dy=Math.min(y,H-y), d=Math.min(dx,dy);
  var k=1+(d<10?-.28:d<16?.18:0)+(d>34&&d<38?.22:0)+(d>38&&d<42?-.18:0); return [Math.min(255,c[0]*k),Math.min(255,c[1]*k),Math.min(255,c[2]*k)]; }; }
var DESIGNS={
  /* Fireside Mahogany: the photo's mahogany card table with green baize; claret card backs */
  mahogany:{name:"Fireside Mahogany",rim:function(H){ return frameFn({light:[132,58,36],dark:[70,26,16],freq:.025,turb:6,wx:380,wy:28,sharp:.75,ringAmt:.5,streakAmt:.5,pores:.012,blotch:.25,seed:31},H); },rimc:"#5a2618",
    top:function(){ return PT.feltFn([34,84,56],9); },feltc:[34,84,56],bead:"rgba(214,180,110,.55)",back:"linear-gradient(150deg,#9e2f3c,#5c1420)",dots:["#5a2618","#22543a","#8e2a36"]},
  /* Rosewood & Oxblood: a dark rosewood frame round oxblood leather with a gold tooled line; navy backs */
  oxblood:{name:"Rosewood & Oxblood",rim:function(H){ return frameFn({light:[104,46,36],dark:[44,18,14],freq:.03,turb:7,wx:300,wy:24,sharp:.6,ringAmt:.55,streakAmt:.55,pores:.01,blotch:.3,seed:57},H); },rimc:"#4a1e16",
    top:function(){ return PT.leatherFn([112,30,32],21); },feltc:[112,30,32],bead:"rgba(226,190,112,.8)",back:"linear-gradient(150deg,#26407a,#0d1834)",dots:["#4a1e16","#701e20","#26407a"]},
  /* Ebony & Midnight: an ebonised frame round navy baize with a silver line; bottle-green backs */
  ebony:{name:"Ebony & Midnight",rim:function(H){ return frameFn({light:[46,40,40],dark:[14,12,12],freq:.03,turb:5,wx:320,wy:26,sharp:.7,ringAmt:.4,streakAmt:.45,pores:.008,blotch:.2,seed:73},H); },rimc:"#1c1818",
    top:function(){ return PT.feltFn([30,44,82],13); },feltc:[30,44,82],bead:"rgba(210,216,228,.6)",back:"linear-gradient(150deg,#2f6a4a,#123824)",dots:["#1c1818","#1e2c52","#2f6a4a"]}
};
var texCache={}, curDesign=null;
function applyDesign(k){
  if(!DESIGNS[k]) k="mahogany"; var TH=G.tableH||1000, key=k+":"+TH; if(key===curDesign) return; curDesign=key; var d=DESIGNS[k];
  if(!texCache[key]) texCache[key]={r:PT.cssUrl(PT.canvasOf(1000,TH,d.rim(TH))),f:PT.cssUrl(PT.seamless(PT.canvasOf(512,512,d.top())))};
  var t=texCache[key], s=stage.style;
  s.setProperty("--ce-rim",t.r); s.setProperty("--ce-rimc",d.rimc); s.setProperty("--ce-felt",t.f); s.setProperty("--ce-feltc","rgb("+d.feltc+")"); s.setProperty("--ce-bead",d.bead); s.setProperty("--bwc-back",d.back);
  T.classList.toggle("light",!!d.light);
}
var PREVIEW=/[?&]preview=1/.test(location.search), previewPick=null;
function previewBar(){
  if(!PREVIEW) return;
  var bar=document.createElement("div"); bar.className="ce-pick";
  Object.keys(DESIGNS).forEach(function(k){ var b=document.createElement("button"); b.type="button"; b.textContent=DESIGNS[k].name; b.dataset.k=k;
    b.onclick=function(){ previewPick=k; document.body.setAttribute("data-set",k); mark(); }; bar.appendChild(b); });
  function mark(){ [].forEach.call(bar.children,function(b){ b.classList.toggle("on",b.dataset.k===(previewPick||String(curDesign).split(":")[0])); }); }
  document.body.appendChild(bar); previewPick="mahogany"; document.body.setAttribute("data-set","mahogany"); mark();
}

/* ---------- the table ---------- */

/* scoring: a team's contract is the sum of its non-Nil bids; made = 10 a trick bid plus 1 a trick over (a "bag");

   bags). Every 10 bags costs 100. */

    var a=t, b=t+2, r={bid:0,took:0,pts:0,bags:0,nil:[],made:null};

      else { r.bid+=S.bids[p]; r.took+=n; } });

/* ---------- where every card sits ---------- */

}

var TROT=[-3,6,-4,5];

/* ---------- bidding: a glass window with Nil and 1-13 ---------- */
function bidPanel(){

async function bidNow(n){

  if(inLesson&&lessonOnly&&lessonOnly.bid!=null&&n!==lessonOnly.bid){ toast("Bid "+lessonOnly.bid+" for this lesson"); return; }

/* ---------- your turn ---------- */
function seatedNow(){ return document.body.classList.contains("seated"); }
function myTurnNow(){ return !!S&&S.phase==="play"&&S.turn===mySeat()&&mySide!==0&&seatedNow()&&(!online||(room&&room.guest))&&!(inLesson&&!Parlor.lessonWaiting); }
async function tapCard(id){
  if(busy||!S) return;
  if(!myTurnNow()||S.h[mySeat()].indexOf(id)<0) return;
  if(legal(mySeat()).indexOf(id)<0){ toast(whyNot(id)); return; }
  if(!allowLesson({play:id})) return;
  await act(function(){ playCard(mySeat(),id); });
}
function whyNot(id){
  /* the reneging guard (Oct 28): a card off the led suit while you still hold that suit is refused, with the reason */
  if(S.trick.length){ var ls=C(S.trick[0].id).s; if(C(id).s!==ls) return "You must follow suit. You still have a "+["club","diamond","heart","spade"][ls]+" in your hand."; }
  if(!S.trick.length&&C(id).s===3) return "Spades aren't broken yet: lead another suit";
  return "You can't play that card now";
}
async function act(fn){
  busy=true; clearHint(); var g=GID;
  fn(); seq++; S.seq=seq;
  push();
  await animate(S.mv);
  if(g!==GID) return;
  busy=false; after();
}
async function animate(mv){
  var g=GID;
  if(mv&&mv.kind==="play"){
    Parlor.sfx("card",{pitch:1.1+view(mv.p)*.08});
    if(mv.broke) toast("Spades are broken");
    if(mv.done){
      await render(true,{showLast:true}); if(g!==GID) return;
      await Parlor.wait(Parlor.smooth()?850:200); if(g!==GID) return;
      Parlor.sfx("flip",{pitch:1.3}); await render(true,{dur:380}); return;
    }
    await render(true); return;
  }
  if(mv&&mv.kind==="bid"){ Parlor.sfx("click",{pitch:1.4}); toast(nameOf(mv.p)+(mv.p===mySeat()&&mySide!==0?" bid ":" bids ")+(mv.bid===0?"Nil":mv.bid)); }
  await render(true,{dur:160});
}

/* ---------- after every move ---------- */

  if(S.phase==="handover"||S.phase==="over"){ handOver(); return; }
  msg();

/* ---------- The House ----------
   Bidding: counts likely tricks (top spades, long spades, side aces and guarded kings, ruffs from short suits),
   bids Nil with a very weak hand (level 3+), and keeps the team's total sensible. Playing: knows the team's
   contract. While tricks are still needed it wins as cheaply as it can (lowest card that wins, trumping when void),
   leads its sure winners, and stays low when its partner is already winning. Once the contract is made it ducks to
   avoid bags. A Nil bidder ducks every trick it can; its partner covers it by playing high. Low levels play looser. */
function sk(full){ return full?{loose:0,level:10}:Parlor.skill(); }
function estimate(h){
  var by=[[],[],[],[]]; h.forEach(function(id){ by[C(id).s].push(hr(id)); });
  by.forEach(function(a){ a.sort(function(x,y){ return y-x; }); });
  var sp=by[3], e=0;
  if(sp.indexOf(13)>=0) e+=1; if(sp.indexOf(12)>=0) e+=sp.length>=2?.95:.4; if(sp.indexOf(11)>=0) e+=sp.length>=3?.75:.25; if(sp.indexOf(10)>=0&&sp.length>=4) e+=.4;
  if(sp.length>3) e+=(sp.length-3)*.85;
  for(var s=0;s<3;s++){ var a=by[s], n=a.length;
    if(a.indexOf(13)>=0) e+=n<=5?.95:.7;
    if(a.indexOf(12)>=0) e+=n>=2&&n<=5?.7:n===1?.15:.4;
    if(a.indexOf(11)>=0&&n>=3&&n<=4) e+=.3;
    if(sp.length>=2){ if(n===0) e+=Math.min(sp.length-1,2)*.6; else if(n===1) e+=.45; else if(n===2) e+=.15; } }
  return e;
}
function nilOk(h){ var sp=h.filter(function(id){ return C(id).s===3; }); if(sp.length>3||sp.some(function(id){ return hr(id)>=10; })) return false;
  return !h.some(function(id){ return hr(id)>=12; })&&estimate(h)<1.1; }
function houseBid(p,full){
  var h=S.h[p], s=sk(full), e=estimate(h), mate=(p+2)%4, mb=S.bids[mate];
  if(s.level>=3&&mb!==0&&nilOk(h)) return 0;
  var n=Math.round(e+(full?0:(Math.random()-.5)*s.loose*2));
  if(mb===0) n=Math.max(n,Math.round(e+.4));                  /* partner is Nil: bid our full strength */
  return Math.max(1,Math.min(13,n));
}
function seen(){ var d={}; S.took.forEach(function(t){ t.forEach(function(id){ d[id]=1; }); }); S.trick.forEach(function(t){ d[t.id]=1; }); return d; }
function isBoss(id,p){ var c=C(id), played=seen(), h=S.h[p]; for(var r=0;r<13;r++){ var x=c.s+"-"+r; if(x!==id&&!played[x]&&h.indexOf(x)<0&&(r===0?13:r)>hr(id)) return false; } return true; }
function bestPlay(p,full){

  if(!full&&Math.random()<s.loose) return L[Math.floor(Math.random()*L.length)];
  var h=S.h[p], t=team(p), mate=(p+2)%4, mates=[t,t+2];
  var myNil=S.bids[p]===0, mateNil=S.bids[mate]===0&&tricksOf(mate)===0;
  var contract=mates.reduce(function(a,q){ return a+(S.bids[q]===0?0:(S.bids[q]||0)); },0);
  var got=mates.reduce(function(a,q){ return a+(S.bids[q]===0?0:tricksOf(q)); },0), need=contract-got;
  function lo(a){ return a.slice().sort(function(x,y){ return (C(x).s===3)-(C(y).s===3)||hr(x)-hr(y); })[0]; }
  function hi(a){ return a.slice().sort(function(x,y){ return hr(y)-hr(x); })[0]; }
  function side(a){ var n=a.filter(function(id){ return C(id).s!==3; }); return n.length?n:a; }
  if(!S.trick.length){   /* leading */
    if(myNil) return lo(L);
    if(need>0||mateNil){ var boss=L.filter(function(id){ return C(id).s!==3&&isBoss(id,p); }); if(boss.length) return hi(boss);
      var bs=L.filter(function(id){ return C(id).s===3&&isBoss(id,p); }); if(bs.length&&s.level>=4) return bs[0]; }
    /* a low card from the longest side suit */
    var by={}; side(L).forEach(function(id){ (by[C(id).s]=by[C(id).s]||[]).push(id); });
    var best=null; Object.keys(by).forEach(function(k){ if(!best||by[k].length>best.length) best=by[k]; });

  }
  var ls=C(S.trick[0].id).s, w=winningPlay(S.trick), last=S.trick.length===3, follow=C(L[0]).s===ls||L.every(function(id){ return C(id).s===ls; });
  var winners=L.filter(function(id){ return beats(id,w.id,ls); }), losers=L.filter(function(id){ return !beats(id,w.id,ls); });
  var mateWinning=w.p===mate;

    if(losers.length) return follow?hi(losers):hi(side(losers));

  }
  if(mateNil&&(mateWinning||S.trick.length<=1)){ /* cover the Nil partner: win the trick if we can */
    if(winners.length) return hi(winners); return lo(L); }
  if(need>0){
    if(mateWinning&&(last||isBoss(w.id,mate))) return lo(losers.length?losers:L);
    if(winners.length){ var cheap=winners.slice().sort(function(x,y){ return (C(x).s===3)-(C(y).s===3)||hr(x)-hr(y); })[0];
      if(last||isBoss(cheap,p)||C(cheap).s===3) return cheap;
      var b2=winners.filter(function(id){ return isBoss(id,p); }); if(b2.length) return lo(b2); return cheap; }

  }

  if(losers.length) return follow?hi(losers):hi(side(losers));

function validState(st){
  if(!(st&&st.v===1&&st.game==="spades"&&Array.isArray(st.h)&&st.h.length===4&&Array.isArray(st.trick)&&Array.isArray(st.took)&&st.took.length===4&&Array.isArray(st.score)&&Array.isArray(st.bids))) return false;
  var all=[]; st.h.forEach(function(x){ all=all.concat(x||[]); }); st.took.forEach(function(x){ all=all.concat(x||[]); }); st.trick.forEach(function(t){ all.push(t&&t.id); });
  var seenIds={}; return all.length===52&&all.every(function(id){ if(!BYID[id]||seenIds[id]) return false; seenIds[id]=1; return true; });
}
/* catching up (Oct 29): a phone that goes to sleep, a dropped connection or a slow start can miss a live update,
   and the table would then wait forever for a move it never heard about. So each window also re-reads its table when
   the live connection starts (or restarts), when it comes back to the screen, and every few seconds while it waits,
   and plays any newer move it finds. */
var ROWFN=null, catching=false, catchT=null;
async function catchUp(){
  if(!online||!sb||!room||!ROWFN||catching) return; catching=true;
  try{
    var q=await sb.from("rooms").select("*").eq("id",room.id).single(), r=q&&q.data;
    if(r){ var st=r.state||{}, newer=(st.seq||0)>seq||(!S&&validState(st)), joined=!!r.guest&&!(room&&room.guest);
      if(newer||joined) ROWFN(r); }
  }catch(e){}
  catching=false;
}
function startCatchUp(){
  if(catchT) return;
  catchT=setInterval(function(){ if(document.visibilityState!=="hidden"&&!busy) catchUp(); },4000);
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") catchUp(); });
  ["focus","online","pageshow"].forEach(function(ev){ window.addEventListener(ev,function(){ catchUp(); }); });
}
async function bootOnline(){
  online=true; Parlor.seatOnline({label:"Online table "+CODE});
  var cfg=window.BW_PLAY||{};
  if(!cfg.url){ Parlor.status("Can't connect","Missing play-config.js"); return; }
  sb=(window.BW&&BW.client&&BW.client())||supabase.createClient(cfg.url,cfg.anonKey);
  if(window.BW) await BW.settled();
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ Parlor.status("Sign in to join","Use the Lobby to sign in"); if(window.BW){ var a=await BW.openAuth({reason:"Sign in to join this table."}); if(!a.ok) return; sess=(await sb.auth.getSession()).data.session; } if(!sess) return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code",CODE).single();
  if(q.error){ Parlor.status("Table not found",q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==="function"&&bwSendToGame(bwGuessGame(room),CODE)) return;
  if(room.host===me) mySide=1; else if(room.guest===me) mySide=2;
  else if(!room.guest){ var u=await sb.from("rooms").update({guest:me,status:"live"}).eq("id",room.id).select().single(); if(!u.error){ room=u.data; mySide=2; } }
  else mySide=0;   /* watching */
  Parlor.mySeat(0); if(Parlor.table) Parlor.table({sb:sb,room:room,me:me,side:mySide});
  loadOppProfile();
  if(validState(room.state)){ S=room.state; seq=S.seq||0; fit(true); render(false); after(); }
  else if(mySide===1){ newMatch(); seq=1; S.seq=seq; fit(true); await push(); busy=true; await dealAnim(); busy=false; after(); }
  else { S=null; Parlor.status("Dealing…","The host is shuffling the cards"); }
  ROWFN=async function(row){ var p={new:row};
    var hadGuest=room&&room.guest; room=p.new; var st=p.new.state||{};
    if(room.guest&&!hadGuest) loadOppProfile();
    if(!validState(st)){
      if(mySide===1&&(!S||!hadGuest)){ GID++; newMatch(); seq=(seq||0)+1; S.seq=seq; await push(); busy=true; await dealAnim(); busy=false; after(); }
      return;
    }
    if(!hadGuest&&room.guest&&S) { after(); }
    if((st.seq||0)<=seq&&S) return;   /* our own move coming back */
    var dealt=st.mv&&st.mv.kind==="deal", was=S; seq=st.seq||0;
    S=st; GID++;
    busy=true; if(dealt||!was) await dealAnim(); else await animate(st.mv); busy=false;
    if(st.phase!=="handover"&&st.phase!=="over"&&!(st.phase==="bid"&&st.turn===mySeat())) PANEL.classList.remove("on");
    after();
  };
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"code=eq."+CODE},function(p){ ROWFN(p.new); }).subscribe(function(st){ if(st==="SUBSCRIBED") catchUp(); });
  startCatchUp();
}
function loadOppProfile(){
  if(!room||!sb||!window.BWAvatar) return; var id=mySide===2?room.host:room.guest; if(!id) return;
  BWAvatar.fetch(sb,[id]).then(function(rows){ oppProfile=rows&&rows[0]||null; chipEls.forEach(function(c){ c._av=null; }); if(S) paintTable(); },function(){});
}

/* ---------- fit to the space ---------- */
function fit(noRender){
  var wide=window.innerWidth>=1000, narrow=!wide&&window.innerWidth<700&&window.innerHeight>window.innerWidth;
  var L=layoutFor(narrow), toolsH=(TOOLS.offsetHeight||46)+10, availW, availH;
  var st2=document.querySelector(".pk-stage"), top=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185;
  var miniH=0; if(!wide){ [].forEach.call(document.querySelectorAll(".pk-mini"),function(m){ miniH+=(m.offsetHeight||0)+10; }); }
  if(wide){ availW=(st2&&st2.clientWidth)||(window.innerWidth-560); availH=window.innerHeight-top-22-toolsH; }
  else { availW=window.innerWidth-12; availH=window.innerHeight-(seatedNow()?top:56)-88-toolsH-6-miniH; }
  if(narrow){ L=layoutFor(true,availH/availW*1000-330); }   /* as tall as the screen allows, then sized to the width */
  var s=Math.max(.2,Math.min(availW/L.W,availH/L.H,1.2));
  var shape=G.tableH!==L.tableH; G=L; FIT._s=s; if(shape&&curDesign){ var dk=String(curDesign).split(":")[0]; curDesign=null; applyDesign(dk); }
  T.style.width=L.W+"px"; T.style.height=L.H+"px"; T.style.transform="scale("+s+")"; T.classList.toggle("narrow",narrow); T.classList.toggle("bwc-bigv",narrow);
  FIT.style.width=Math.round(L.W*s)+"px"; FIT.style.height=Math.round(L.H*s)+"px";
  document.body.style.setProperty("--pk-size",Math.round(L.W*s)+"px");
  chipEls.forEach(function(c){ c._av=null; });
  if(!noRender&&S&&!busy) render(false);
}
window.addEventListener("resize",function(){ fit(); });
window.addEventListener("bw-avatar",function(){ chipEls.forEach(function(c){ c._av=null; }); if(S) paintTable(); });

  ],
  rules:{
    play:"<ol><li><b>Partners:</b> four players in two teams. Your partner sits across from you. Against The House, Oliver is your partner and Clara and Henry play against you. Online, you and a friend (or a player you're matched with) are partners across the table against two House players.</li><li><b>Bidding:</b> after the deal, each player in turn bids how many tricks they expect to take (or <b>Nil</b>: none at all). Partners' bids add up to the team's contract.</li><li><b>Tricks:</b> the player left of the dealer leads. Everyone plays one card in turn and must <b>follow suit</b> if they can. The highest card of the suit led wins, unless someone plays a spade: <b>spades are trump</b> and the highest spade wins. Aces are high.</li><li><b>Breaking spades:</b> you can't lead a spade until one has been played on an earlier trick, unless you hold only spades.</li><li>Tap a glowing card to play it. Cards you can't play now are dimmed.</li><li>The deal passes to the left each hand.</li></ol>",

  },
  onNew:function(){ inLesson=false; practice=false; lessonOnly=null; TARGET=500; mySide=1; Parlor.coach(null); PANEL.classList.remove("on"); GID++; newMatch(); busy=true; fit(true); dealAnim().then(function(){ busy=false; after(); }); },

});
new MutationObserver(function(){ var k=document.body.getAttribute("data-set");
  if(PREVIEW&&previewPick&&k!==previewPick){ document.body.setAttribute("data-set",previewPick); return; }
  applyDesign(k||"mahogany"); }).observe(document.body,{attributes:true,attributeFilter:["data-set"]});
var wasSeated=false;
new MutationObserver(function(){ var now=seatedNow(); if(now===wasSeated) return; wasSeated=now; setTimeout(function(){ fit(); },30); }).observe(document.body,{attributes:true,attributeFilter:["class"]});
