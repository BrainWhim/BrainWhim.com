/* ==========================================================================

   Trace each stroke of a big letter with a finger, from the green dot along the arrow: the traced part lights up gold (and hums,
   higher as it goes). A finished letter glows, Finn says its name and sound ("B says buh, as in bunny") and its picture pops up;
   one of 26 little lights fills. Big Moonlet: lowercase letters, and the trace must stay closer to the line.
   Strokes: our own manuscript shapes in a 100×120 box (top 10, middle 46, base 90, tails to 112), as lines, arcs and curves,
   sampled to points. Saved: bwk.letters {up:{A:1…}, lo:{a:1…}, at, atLo}. Lines ll-*. Test hook LLO.

    '<circle cx="24.2" cy="56.6" r="1.1" fill="#fff"/><circle cx="39.2" cy="65.6" r="1.1" fill="#fff"/>'+
    '<ellipse cx="20" cy="68" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/><ellipse cx="44" cy="78" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/>'+
    '<path d="M27 72 q5 7 11 3" stroke="#3b2a12" stroke-width="2.6" fill="#a5523a" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<g><path d="M68 50l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#fff3c4"/><path d="M80 40l1.1 2.7 2.7 1.1-2.7 1.1-1.1 2.7-1.1-2.7-2.7-1.1 2.7-1.1z" fill="#ffe7a0"/>'+
    '<circle cx="75" cy="58" r="1.6" fill="#fff"/><circle cx="62" cy="44" r="1.2" fill="#ffeab0"/></g></svg>'; }
  var top=$("finnHere");
  (function(){ var mh=0; if(window.ResizeObserver) new ResizeObserver(function(){ var h=top.offsetHeight; if(h>mh){ mh=h; top.style.minHeight=h+"px"; } }).observe(top); })();
  top.innerHTML='<div class="k-finn k-finn-in">'+face("llS")+'<p class="k-fb">'+HI+'</p></div>';
  var talked=false;
  function say(t,clip,o){ talked=true; o=o||{}; o.into=top; o.clip=clip; BWK.finn(t,o); }
  top.addEventListener("click",function(e){ if(e.target.closest(".k-fm")) say(HI,"ll-hi"); });
  ["ll-hi","ll-start","ll-next","bg-on","bg-off"].forEach(BWK.preload);

  var S=BWK.store.get("letters",null)||{}; S.up=S.up||{}; S.lo=S.lo||{}; S.at=S.at||0; S.atLo=S.atLo||0;
  function save(){ BWK.store.set("letters",S); }

  /* ---------- sound: a soft hum while the light runs along (higher as it goes), a chime per line, a sparkle for the letter ---------- */
  var AC=null, OUT=null;
  function ac(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C();
      var comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=4;
      OUT=AC.createGain(); OUT.gain.value=.9; OUT.connect(comp); comp.connect(AC.destination); }
    if(AC.state!=="running"){ try{ AC.resume(); }catch(e){} } return AC; }
  function unlock(){ try{ if(navigator.audioSession&&navigator.audioSession.type!=="playback") navigator.audioSession.type="playback"; }catch(e){} var a=ac(); if(!a) return; if(a.state!=="running"||!a._u){ try{ var b=a.createBuffer(1,1,22050), s=a.createBufferSource(); s.buffer=b; s.connect(a.destination); s.start(0); a._u=1; }catch(e){} } }
  ["pointerdown","pointerup","touchend","click","keydown"].forEach(function(ev){ document.addEventListener(ev,unlock,{capture:true,passive:true}); });
  function on(){ return BWK.store.get("sound",true) && !!ac(); }
  function tone(f,t,d,v,type,f2){ var o=AC.createOscillator(), g=AC.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(OUT); o.start(t); o.stop(t+d+.05); }
  var hum=null;
  function humOn(){ if(!on()||hum) return; var t=AC.currentTime, o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain();
    o.type="triangle"; o2.type="sine"; o.frequency.value=330; o2.frequency.value=660; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.035,t+.08);
    o.connect(g); o2.connect(g); g.connect(OUT); o.start(t); o2.start(t); hum={o:o,o2:o2,g:g}; }
  function humAt(p,moving){ if(!hum) return; var t=AC.currentTime, f=330+p*330; hum.o.frequency.setTargetAtTime(f,t,.05); hum.o2.frequency.setTargetAtTime(f*2.01,t,.05);
    hum.g.gain.setTargetAtTime(moving?.04:.012,t,.08); }
  function humOff(){ if(!hum) return; var h=hum, t=AC.currentTime; hum=null; h.g.gain.setTargetAtTime(.0001,t,.06); h.o.stop(t+.4); h.o2.stop(t+.4); }
  var SND={
    chime:function(k){ if(!on()) return; var t=AC.currentTime+.01, f=[659,784,988,1175][k%4]; tone(f,t,.6,.07,"triangle"); tone(f*2,t+.01,.4,.02); },
    win:function(){ if(!on()) return; var t=AC.currentTime+.02; [523,659,784,1047,1319,1568].forEach(function(f,i){ tone(f,t+i*.09,.6,.06,"triangle"); tone(f*2,t+i*.09+.01,.3,.015); }); },
    nope:function(){ if(!on()) return; var t=AC.currentTime+.005; tone(260,t,.2,.04,"sine",210); },
    all:function(){ if(!on()) return; var t=AC.currentTime+.02; for(var i=0;i<14;i++) tone(784*Math.pow(2,(i%7)/7),t+i*.07,.5,.04,"triangle"); }
  };

  (function(){ var im=new Image(); im.onload=function(){ document.documentElement.classList.add("llbg"); }; im.src="ll/bg-sm.jpg?v="+AV; })();
  (function(){ var im=new Image(); im.onload=function(){ document.documentElement.classList.add("llsl"); }; im.src="ll/frame.webp?v="+AV; })();

  /* ---------- the game ---------- */
  var big=BWK.big(), cur=null, sv=$("sv"), drag=null, misses=0;
  function el(n,a,p){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }
  function key(){ return big?ABC[S.atLo].toLowerCase():ABC[S.at]; }
  function setup(){
    var k=key(), strokes=(big?LO:UP)[k];
    cur={k:k, L:k.toUpperCase(), st:strokes.map(function(s){ var pts=sample(s), cum=[0]; for(var i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); return {pts:pts, cum:cum, len:cum[cum.length-1], i:0}; }), s:0, done:false};
    sv.innerHTML=""; $("stage").classList.remove("won"); $("card").innerHTML="";
    sv.setAttribute("aria-label","Trace the letter "+k);
    /* writing-paper lines: top, middle (dashed), base */
    el("line",{x1:4,x2:96,y1:10,y2:10,"class":"guide"},sv); el("line",{x1:4,x2:96,y1:46,y2:46,"class":"guide"},sv); el("line",{x1:4,x2:96,y1:90,y2:90,"class":"guide base"},sv);
    var g=el("g",{"class":"letter"},sv);
    cur.st.forEach(function(s){ var d=dOf(s.pts); el("path",{d:d,"class":"track"},g); el("path",{d:d,"class":"dash"},g); });
    cur.st.forEach(function(s){ var d=dOf(s.pts);
      s.halo=el("path",{d:d,"class":"halo","stroke-dasharray":s.len+" "+(s.len+5),"stroke-dashoffset":s.len},g);
      s.lit=el("path",{d:d,"class":"lit","stroke-dasharray":s.len+" "+(s.len+5),"stroke-dashoffset":s.len},g);
      s.core=el("path",{d:d,"class":"core","stroke-dasharray":s.len+" "+(s.len+5),"stroke-dashoffset":s.len},g); });
    cur.mk=el("g",{},sv); cur.spark=el("path",{d:"M0 -3.4l.9 2.5 2.5.9-2.5.9-.9 2.5-.9-2.5-2.5-.9 2.5-.9z","class":"spark",opacity:0},sv);
    marker(); lights(); bar();
  }
  /* the green start dot (numbered when there's more than one line) and an arrow showing the way */
  function marker(){ var m=cur.mk; m.innerHTML=""; if(cur.done) return; var s=cur.st[cur.s], p=s.pts[s.i];
    var j=Math.min(s.pts.length-1, s.i+Math.max(4,Math.round(9/1.2))), q=s.pts[j], ang=Math.atan2(q[1]-p[1],q[0]-p[0])*180/Math.PI;
    if(s.i===0){ el("circle",{cx:p[0],cy:p[1],r:4.6,"class":"dotp"},m); el("circle",{cx:p[0],cy:p[1],r:4.6,"class":"dot"},m); if(cur.st.length>1) el("text",{x:p[0],y:p[1]+.2,"class":"num"},m).textContent=cur.s+1; }
    if(s.len>3){ var a=el("path",{d:"M-2.6 -3.2L2.8 0-2.6 3.2z","class":"arrow"},m); a.setAttribute("transform","translate("+q[0].toFixed(1)+" "+q[1].toFixed(1)+") rotate("+ang.toFixed(0)+")"); }
  }
  function show(s){ var off=Math.max(0,s.len-s.cum[s.i]); [s.halo,s.lit,s.core].forEach(function(e){ e.setAttribute("stroke-dashoffset",off.toFixed(2)); }); }
  function svgPt(e){ var m=sv.getScreenCTM(); if(!m) return null; var p=sv.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; p=p.matrixTransform(m.inverse()); return [p.x,p.y]; }
  function tol(){ return big?8.5:11.5; }
  /* follow the finger: the light only moves forward, to the nearest point a little way ahead that's close to the finger */
  function follow(pt){ var s=cur.st[cur.s], best=-1, bd=1e9, look=Math.min(s.pts.length-1, s.i+16);
    for(var j=s.i;j<=look;j++){ var d=Math.hypot(pt[0]-s.pts[j][0],pt[1]-s.pts[j][1]); if(d<bd){ bd=d; best=j; } }
    if(bd>tol()) return false;
    if(best>s.i){ s.i=best; show(s); cur.spark.setAttribute("transform","translate("+s.pts[s.i][0].toFixed(1)+" "+s.pts[s.i][1].toFixed(1)+")"); cur.spark.setAttribute("opacity",1);
      humAt(s.len?s.cum[s.i]/s.len:1,true); drag.moved=true; marker(); }
    if(s.i>=s.pts.length-2||s.len<3){ s.i=s.pts.length-1; show(s); strokeDone(); }
    return true; }
  function strokeDone(){ cur.s++; misses=0; SND.chime(cur.s); cur.spark.setAttribute("opacity",0); humOff();
    if(cur.s>=cur.st.length){ letterDone(); return; } marker(); drag=null; }
  function letterDone(){ cur.done=true; drag=null; marker(); $("stage").classList.add("won"); SND.win();
    if(big) S.lo[cur.k]=1; else S.up[cur.k]=1; save(); BWK.played&&BWK.played("letters");
    var L=cur.L, w=W[L][0], first=w.charAt(0), shown=big?first:first.toUpperCase();
    $("card").innerHTML='<div class="pic">'+picHTML(L)+'</div><b><u>'+shown+'</u>'+w.slice(1)+'</b>';
    sizeCard();
    var n=Object.keys(big?S.lo:S.up).length;
    say(line(L),"ll-"+L.toLowerCase(),{onend:function(){ if(n===26&&!S[big?"allLo":"all"]){ S[big?"allLo":"all"]=1; save(); SND.all(); say(ALL,"ll-all"); } }});
    lights(); bar(); }
  function sizeCard(){ var st=$("stage"), r=st.getBoundingClientRect(), port=matchMedia("(orientation:portrait)").matches;
    var pc=Math.round(Math.max(70,Math.min(190, port? r.height*.24 : r.width*.22))); $("card").style.setProperty("--pc",pc+"px"); }
  sv.addEventListener("pointerdown",function(e){ if(!cur||cur.done) return; e.preventDefault(); try{ sv.setPointerCapture(e.pointerId); }catch(x){}
    drag={id:e.pointerId, moved:false}; var p=svgPt(e); if(!p) return; humOn(); if(!follow(p)) humAt(cur.st[cur.s].len?cur.st[cur.s].cum[cur.st[cur.s].i]/cur.st[cur.s].len:0,false); });
  sv.addEventListener("pointermove",function(e){ if(!drag||drag.id!==e.pointerId||!cur||cur.done) return; var p=svgPt(e); if(p&&!follow(p)) humAt(0,false); });
  function up(e){ if(!drag||drag.id!==e.pointerId) return; var moved=drag.moved; drag=null; humOff(); if(cur) cur.spark.setAttribute("opacity",0);
    if(cur&&!cur.done&&!moved){ misses++; if(misses===2){ SND.nope(); say(START,"ll-start"); } } }
  sv.addEventListener("pointerup",up); sv.addEventListener("pointercancel",up);
  $("card").addEventListener("click",function(){ if(cur&&cur.done) say(line(cur.L),"ll-"+cur.L.toLowerCase()); });

  /* ---------- the 26 little lights (tap one to pick that letter) ---------- */
  function lights(){ var h="", done=big?S.lo:S.up, at=big?S.atLo:S.at;
    ABC.forEach(function(L,i){ var k=big?L.toLowerCase():L; h+='<button class="'+(done[k]?'on':'')+(i===at?' cur':'')+'" data-i="'+i+'" data-say="'+NAME[L]+'" aria-label="Letter '+NAME[L]+(done[k]?', lit':'')+'">'+k+'</button>'; });
    $("lights").innerHTML=h; }
  $("lights").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; BWK.sfx("tap"); BWK.finnStop(); humOff();
    if(big) S.atLo=+b.dataset.i; else S.at=+b.dataset.i; save(); setup(); });
  function step(d){ if(big) S.atLo=(S.atLo+d+26)%26; else S.at=(S.at+d+26)%26; save(); BWK.finnStop(); setup(); }

  /* ---------- the bottom row ---------- */
  function bar(){ var done=cur&&cur.done;
    $("bar").innerHTML='<button class="chip" data-a="back" data-say="Back"><em>◀</em><span>Back</span></button>'+
      '<button class="chip go'+(done?' pulse':'')+'" data-a="next" data-say="Next letter"><em>▶</em><span>Next letter</span></button>'+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="games" data-say="More games"><em>☾</em><span>More games</span></button>'; }
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; BWK.sfx("tap");
    if(b.dataset.a==="next") step(1);
    else if(b.dataset.a==="back") step(-1);
    else if(b.dataset.a==="big"){ big=!big; talked=true; BWK.setBig(big,top); setup(); }
    else if(b.dataset.a==="games"){ BWK.finnStop(); BWK.sfx("whoosh"); setTimeout(function(){ location.href="moonlets-games.html"; },200); } });
  window.addEventListener("bwk-big",function(e){ if(!!e.detail!==big){ big=!!e.detail; setup(); } });
  window.addEventListener("resize",function(){ if(cur&&cur.done) sizeCard(); });
  document.addEventListener("click",function(e){ if(talked || e.target.closest("#stage,.chip,.lights,.k-head,.k-sheet,.k-veil")) return; say(HI,"ll-hi"); });

  setup();
  /* test hook: LLO.trace() runs the finger along every line of the letter */
  window.LLO={state:function(){ return cur&&{k:cur.k,s:cur.s,n:cur.st.length,done:cur.done,up:Object.keys(S.up).length,lo:Object.keys(S.lo).length,big:big}; },
    pick:function(i){ if(big) S.atLo=i; else S.at=i; setup(); }, big:function(on){ big=!!on; BWK.setBig(big); setup(); },
    pts:function(){ return cur.st.map(function(s){ return s.pts; }); }, follow:function(p){ drag=drag||{id:0,moved:false}; return follow(p); },
    trace:function(){ while(cur&&!cur.done){ var s=cur.st[cur.s]; drag={id:0,moved:false}; for(var i=s.i;i<s.pts.length&&cur&&!cur.done&&cur.st[cur.s]===s;i+=3) follow(s.pts[i]); if(cur.st[cur.s]===s&&!cur.done) follow(s.pts[s.pts.length-1]); } }};
})();
</script>
