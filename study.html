  background:radial-gradient(circle at 35% 30%,#ffffff 0 6%,transparent 18%),radial-gradient(circle at 50% 55%,#3a2c40,#16101c 70%);box-shadow:0 0 0 calc(var(--u) * 7) #b8902e,0 0 0 calc(var(--u) * 10) #5a4210,inset 0 calc(var(--u) * -6) calc(var(--u) * 10) rgba(0,0,0,.6),calc(var(--u) * 4) calc(var(--u) * 8) calc(var(--u) * 10) rgba(0,0,0,.5);transition:background .18s,box-shadow .18s,transform .08s}
.st-jw.on{background:radial-gradient(circle at 35% 30%,#ffffff 0 8%,transparent 22%),radial-gradient(circle at 50% 55%,#ffe59a,#f2a72c 55%,#a65a08);
  box-shadow:0 0 0 calc(var(--u) * 7) #e3c25c,0 0 0 calc(var(--u) * 10) #6b4c18,0 0 calc(var(--u) * 26) calc(var(--u) * 8) rgba(255,190,70,.7),calc(var(--u) * 4) calc(var(--u) * 8) calc(var(--u) * 10) rgba(0,0,0,.5)}
.st-jw:active{transform:scale(.94)}
.st-jw.ring::after{content:"";position:absolute;inset:calc(var(--u) * -20);border-radius:50%;border:calc(var(--u) * 7) solid #ffd36b;animation:st-pulse 1s ease-in-out infinite}
.st-mrow{display:flex;gap:calc(var(--u) * 14);align-items:center;justify-content:center}
.st-small{height:calc(var(--u) * 54);padding:0 calc(var(--u) * 22);border:1px solid rgba(246,227,168,.55);border-radius:calc(var(--u) * 27);background:rgba(15,10,4,.35);color:#f6e3a8;cursor:pointer;font:700 calc(var(--u) * 22)/1 Montserrat,sans-serif}
.st-board.tall .st-small{height:calc(var(--u) * 70);font-size:calc(var(--u) * 28);padding:0 calc(var(--u) * 28)}
.st-count{font:600 calc(var(--u) * 24)/1 Montserrat,sans-serif;color:#f6e3a8}
.st-board.tall .st-count{font-size:calc(var(--u) * 30)}
/* the bookcase: books standing on a shelf */
.st-shelf{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:calc(var(--u) * 8);padding:calc(var(--u) * 26) calc(var(--u) * 24) 0;min-width:calc(var(--u) * 360);
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.2));border-radius:calc(var(--u) * 6) calc(var(--u) * 6) 0 0;box-shadow:inset 0 calc(var(--u) * 10) calc(var(--u) * 20) rgba(0,0,0,.6)}
.st-shelf::after{content:"";position:absolute;left:calc(var(--u) * -14);right:calc(var(--u) * -14);bottom:calc(var(--u) * -30);height:calc(var(--u) * 30);border-radius:calc(var(--u) * 3);background:linear-gradient(180deg,var(--wood1),var(--wood2) 60%,var(--wood3));box-shadow:inset 0 calc(var(--u) * 2) 0 rgba(255,255,255,.3),0 calc(var(--u) * 10) calc(var(--u) * 16) rgba(0,0,0,.5)}
.st-book{position:relative;width:calc(var(--u) * var(--bkw,104));height:calc(var(--u) * var(--bkh,330));border:0;padding:0;cursor:pointer;border-radius:calc(var(--u) * 6) calc(var(--u) * 6) calc(var(--u) * 2) calc(var(--u) * 2);transition:transform .16s,box-shadow .16s;
  background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.22) 22%,rgba(255,255,255,.05) 45%,rgba(0,0,0,.25) 80%,rgba(0,0,0,.45)),linear-gradient(180deg,var(--bk1),var(--bk2));box-shadow:calc(var(--u) * 4) calc(var(--u) * 6) calc(var(--u) * 8) rgba(0,0,0,.45)}
.st-book::before,.st-book::after{content:"";position:absolute;left:0;right:0;height:calc(var(--u) * 10);background:linear-gradient(180deg,#f6dc8e,#a8802c);opacity:.9}
.st-book::before{top:12%}.st-book::after{bottom:12%}
.st-book span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;font:700 calc(var(--u) * 30)/1 Cormorant Garamond,serif;letter-spacing:.14em;text-transform:uppercase;color:#f6dc8e;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.st-book.up{transform:translateY(calc(var(--u) * -28)) scale(1.04);box-shadow:0 0 0 calc(var(--u) * 5) #ffd36b,calc(var(--u) * 8) calc(var(--u) * 18) calc(var(--u) * 18) rgba(0,0,0,.5)}
.st-book.fix{box-shadow:0 0 0 calc(var(--u) * 4) #6fbf7f,calc(var(--u) * 4) calc(var(--u) * 6) calc(var(--u) * 8) rgba(0,0,0,.45);cursor:default}
.st-shelfwrap.bad{animation:st-nope .4s ease}
/* the door: a brass plate with slots, and the tokens you found */
.st-plate{position:relative;display:flex;gap:calc(var(--u) * 14);padding:calc(var(--u) * 30) calc(var(--u) * 26);border-radius:calc(var(--u) * 20);
  background:radial-gradient(ellipse at 25% 15%,rgba(255,255,255,.55),transparent 45%),linear-gradient(160deg,#f6dc8e,#d1a648 45%,#9a7024 85%,#7a5418);box-shadow:inset 0 calc(var(--u) * 3) 0 rgba(255,255,255,.6),inset 0 calc(var(--u) * -6) calc(var(--u) * 10) rgba(60,40,0,.35),calc(var(--u) * 8) calc(var(--u) * 16) calc(var(--u) * 24) rgba(0,0,0,.55)}
.st-plate.bad{animation:st-nope .4s ease}
.st-slot{position:relative;width:calc(var(--u) * var(--cw,108));height:calc(var(--u) * var(--cw,108));border:0;padding:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 50% 40%,#2a1d08,#4a3410 70%,#6b4c18);box-shadow:inset calc(var(--u) * 4) calc(var(--u) * 6) calc(var(--u) * 10) rgba(0,0,0,.7),0 calc(var(--u) * 2) 0 rgba(255,255,255,.45)}
.st-slot em{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:calc(var(--u) * 4);font:700 calc(var(--u) * 20)/1 Montserrat,sans-serif;font-style:normal;color:#4a3410;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase}
.st-slot.sel{box-shadow:inset calc(var(--u) * 4) calc(var(--u) * 6) calc(var(--u) * 10) rgba(0,0,0,.7),0 0 0 calc(var(--u) * 6) #ffd36b}
.st-coin{position:relative;width:calc(var(--u) * var(--cw,108));height:calc(var(--u) * var(--cw,108));border:0;padding:0;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#3b2a0c;
  background:radial-gradient(circle at 34% 28%,#fff3c8,#e7c66a 40%,#b38a2e 75%,#7a5a1e);box-shadow:inset 0 0 0 calc(var(--u) * 5) rgba(122,90,30,.6),inset calc(var(--u) * -3) calc(var(--u) * -4) calc(var(--u) * 6) rgba(0,0,0,.25),calc(var(--u) * 3) calc(var(--u) * 6) calc(var(--u) * 8) rgba(0,0,0,.45);transition:transform .15s}
.st-coin b{font:700 calc(var(--u) * 46)/1 Cormorant Garamond,serif}
.st-coin small{font:700 calc(var(--u) * 14)/1 Montserrat,sans-serif;letter-spacing:0;text-transform:uppercase;margin-top:calc(var(--u) * 2)}
.st-coin.up{transform:translateY(calc(var(--u) * -12)) scale(1.08);box-shadow:0 0 0 calc(var(--u) * 5) #ffd36b,calc(var(--u) * 6) calc(var(--u) * 14) calc(var(--u) * 14) rgba(0,0,0,.5)}
.st-coin.fix{box-shadow:0 0 0 calc(var(--u) * 4) #6fbf7f,calc(var(--u) * 3) calc(var(--u) * 6) calc(var(--u) * 8) rgba(0,0,0,.45)}
.st-slot .st-coin{position:absolute;inset:0;width:auto;height:auto}
.st-board.tall .st-coin small{font-size:calc(var(--u) * 20);letter-spacing:0}
.st-board.tall .st-coin b{font-size:calc(var(--u) * 58)}
.st-board.tall .st-slot em{font-size:calc(var(--u) * 26)}
.st-tray{display:flex;gap:calc(var(--u) * 14);flex-wrap:wrap;justify-content:center;min-height:calc(var(--u) * var(--cw,108))}
/* what you find inside an opened lock */
.st-found{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:rgba(10,6,2,.55)}
.st-found.on{display:flex;animation:st-inkin .4s ease}
.st-fcard{max-width:86%;padding:calc(var(--u) * 30) calc(var(--u) * 36);border-radius:calc(var(--u) * 10);text-align:center;color:var(--ink);background:linear-gradient(172deg,var(--paper1),var(--paper2));box-shadow:calc(var(--u) * 8) calc(var(--u) * 18) calc(var(--u) * 30) rgba(0,0,0,.6)}
.st-fcard h3{margin:0 0 calc(var(--u) * 8);font:700 italic calc(var(--u) * 50)/1 Cormorant Garamond,serif;color:#2a2116}
.st-fcard p{margin:0 0 calc(var(--u) * 18);font:500 calc(var(--u) * 27)/1.4 Montserrat,sans-serif}
.st-fcard .st-coin{margin:0 auto calc(var(--u) * 16);animation:st-coin .7s cubic-bezier(.3,1.6,.6,1)}
@keyframes st-coin{0%{transform:scale(.2) rotateY(180deg)}100%{transform:none}}
.st-board.tall .st-fcard h3{font-size:calc(var(--u) * 62)}
.st-board.tall .st-fcard p{font-size:calc(var(--u) * 34)}
/* messages, the wait and the sign */
.st-toast{position:absolute;z-index:8;left:50%;top:calc(var(--u) * 10);transform:translateX(-50%);width:max-content;max-width:92%;padding:8px 14px;border-radius:12px;background:rgba(15,23,42,.93);border:1px solid rgba(231,199,122,.6);color:#fff;font:600 14px/1.4 Montserrat,sans-serif;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.st-toast.on{opacity:1}
.st-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;font:700 italic 20px Cormorant Garamond,serif;color:#f0d27a;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .3s}
.st-wait.on{opacity:1}
.st-sign{position:absolute;left:50%;top:44%;z-index:7;transform:translate(-50%,-50%) rotate(-5deg);padding:8px 18px 7px;border-radius:6px;font:700 italic 28px/1 Cormorant Garamond,serif;letter-spacing:.04em;color:#3b2a0c;white-space:nowrap;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.55),transparent 50%),linear-gradient(180deg,#fbe7a6,#d9b25a 45%,#a8802c);box-shadow:0 0 0 1px #7a5a1e,inset 0 1px 0 rgba(255,255,255,.7),2px 6px 12px rgba(0,0,0,.45);opacity:0;pointer-events:none}
.st-sign.on{animation:st-sign .5s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes st-sign{0%{opacity:0;transform:translate(-50%,-50%) rotate(-5deg) scale(1.8)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-5deg) scale(1)}}
/* ---------- the professor's letter (the side card) ---------- */
.st-letter{position:relative;border-radius:3px;color:var(--ink);padding:12px 14px 12px 16px;
  background:radial-gradient(ellipse at 25% 10%,rgba(255,255,255,.6),transparent 60%),linear-gradient(170deg,#f8f2e0,#ede1c0 60%,#e3d3ad);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -12px 16px -12px rgba(110,90,40,.25),0 1px 1px rgba(0,0,0,.25),2px 9px 16px rgba(20,10,0,.42)}
.st-letter::before{content:"";position:absolute;left:8px;right:8px;top:8px;bottom:8px;border:1px solid rgba(156,43,28,.3);border-radius:2px;pointer-events:none}
.st-letter .kick{display:block;margin:0 0 2px;font:700 10.5px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.st-letter h2{margin:0 0 4px;font:700 22px/1.1 Cormorant Garamond,serif}
.st-letter .intro{margin:0 0 8px;font:500 12.5px/1.45 Montserrat,sans-serif}
.st-chain{display:flex;flex-direction:column;gap:4px;margin:6px 0 0;padding-top:8px;border-top:1px dashed rgba(156,43,28,.35)}
.st-chip{display:flex;align-items:center;gap:8px;padding:3px 6px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;font:600 12.5px/1.2 Montserrat,sans-serif;color:#7a6a50}
.st-chip svg{width:20px;height:20px;flex:none}
.st-chip b{margin-left:auto;font:700 16px/1 Cormorant Garamond,serif;color:#3b2a0c;min-width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 34% 28%,#fff3c8,#e7c66a 45%,#b38a2e);box-shadow:inset 0 0 0 2px rgba(122,90,30,.55)}
.st-chip.done{color:#2a2116}
.st-chip.cur{color:#2a2116;background:rgba(201,160,58,.22);box-shadow:inset 0 0 0 2px rgba(201,160,58,.75)}
.st-chip.later b{visibility:hidden}
.st-chip.pulse{animation:st-ringbtn 1.1s ease 2}
.st-tools{display:grid;grid-template-columns:1fr;gap:8px;padding:7px;border-radius:12px;background:rgba(15,23,42,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.st-tools .pk-btn{width:auto;margin:0;padding:8px 10px;min-height:0;white-space:nowrap}
.st-tools .pk-btn.gold{border-color:rgba(231,199,122,.75);color:#f0d27a;background:rgba(212,175,55,.16)}
.st-tools .pk-btn:disabled{opacity:.45}
.st-ringbtn{animation:st-ringbtn2 1.1s ease 2}
@keyframes st-ringbtn2{50%{box-shadow:0 0 0 5px rgba(240,210,122,.6)}}
/* ---------- the result window ---------- */
.st-stars{font-size:30px;letter-spacing:6px;color:#f0d27a;text-shadow:0 2px 10px rgba(240,210,122,.45);margin:2px 0 6px;text-align:center}
.st-stars i{font-style:normal;color:rgba(255,255,255,.22);text-shadow:none}
.st-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
.st-facts div{border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 4px;text-align:center;background:rgba(255,255,255,.04)}
.st-facts b{display:block;font:700 17px Montserrat,sans-serif;color:#fff}
.st-facts small{font:600 10px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.st-card{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 2px;padding:8px 12px;border-radius:6px;background:linear-gradient(175deg,#fbf6e8,#efe5cb);color:#1d1a18;box-shadow:0 1px 1px rgba(0,0,0,.2),2px 6px 12px rgba(0,0,0,.35)}
#stEnd .st-card p{margin:0;font:700 italic 15px/1.2 Cormorant Garamond,serif;color:#4a3a22;text-align:center}
#stEnd .st-card .coins{display:flex;gap:4px}
#stEnd .st-card .coins span{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 17px/1 Cormorant Garamond,serif;color:#3b2a0c;background:radial-gradient(circle at 34% 28%,#fff3c8,#e7c66a 45%,#b38a2e);box-shadow:inset 0 0 0 2px rgba(122,90,30,.55);font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.st-story{display:flex;gap:12px;align-items:flex-start;margin:10px 0 4px;padding:11px 13px;border-radius:10px;background:linear-gradient(180deg,rgba(248,242,224,.97),rgba(237,225,192,.97));color:#2a2116;text-align:left}
.st-story .mug{flex:none;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff4dc,#e3c896 70%,#b8925a);overflow:hidden;box-shadow:0 0 0 2px #b38a3a,inset 1px 2px 4px rgba(0,0,0,.25)}
.st-story .mug svg{width:100%;height:100%}
#stEnd .st-story h3{margin:0 0 1px;text-align:left;font:700 18px/1.15 Cormorant Garamond,serif;color:#2a2116}
#stEnd .st-story .kind{margin:0 0 3px;font:600 10.5px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--red);text-align:left}
#stEnd .st-story p{margin:0;font:500 13px/1.45 Montserrat,sans-serif;color:#2a2116;text-align:left}

.st-story .rm{display:inline-block;margin-top:3px;padding:0;border:0;background:none;color:var(--red);font:700 12px Montserrat,sans-serif;text-decoration:underline;cursor:pointer}
.st-endnote{font:500 12.5px/1.5 Montserrat,sans-serif;color:rgba(255,255,255,.78);text-align:center;margin:6px 0 0}

/* ---------- phones ---------- */
@media (max-width:999px){
  .st-pad{grid-template-columns:1fr;gap:8px;justify-items:center}

<script id="stCore">
/* ===== The Locked Study core (the five kinds of lock, their makers and graders, the week, the day's chain): shared by the page and the tests =====
   Professor Hartwell has locked you in his study. Each lock you open holds a brass token and the clue to the next lock; the last lock is the door.
   The kinds of lock:
     seq   the mantel clock: a number pattern; the missing number opens it (dial lock)
     sum   the globe: picture sums of things on the desk; the asked-for total opens it (dial lock)
     code  the desk drawer (and the writing box): a combination padlock with "one number is correct…" clue lines (dial lock)
     light the wall safe behind the painting: jeweled buttons; a press flips it and the ones beside it; light them all
     shelf the bookcase: put the books in order from clue lines
     door  the door: set the tokens in the order the clues give (on Monday and Tuesday the plate shows the order)
   Every lock has exactly one answer (the safe has one fewest-press answer on its 3 x 3 panels), and each is graded by a step-by-step solver
   (see the grade notes on each maker). The day's chain is remade until its total grade lands in the day's band. */
(function(root){
"use strict";
function rng(seed){ var h=1779033703^seed.length; for(var i=0;i<seed.length;i++){ h=Math.imul(h^seed.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function ri(r,a,b){ return a+Math.floor(r()*(b-a+1)); }
function pick(r,a){ return a[Math.floor(r()*a.length)]; }
function shuffle(a,r){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var ORD=["first","second","third","fourth","fifth","sixth"];
var WORDN=["no","one","two","three","four"];

/* ---------- seq: the mantel clock's number pattern ----------
   Each family makes six numbers (t0..t5) and the next (t6); its rule is the hint. Grade: the family's own weight, +1.5 when the gap is in the middle. */
var SEQF=[
  {id:"add",lv:1,w:2,mk:function(r){ var a=ri(r,1,20), d=ri(r,2,9), t=[]; for(var i=0;i<7;i++) t.push(a+i*d); return {t:t,rule:"Each number is "+d+" more than the one before."}; }},
  {id:"sub",lv:1,w:2.6,mk:function(r){ var d=ri(r,3,9), a=ri(r,7*d+5,99), t=[]; for(var i=0;i<7;i++) t.push(a-i*d); return {t:t,rule:"Each number is "+d+" less than the one before."}; }},
  {id:"dbl",lv:1,w:3,mk:function(r){ var a=ri(r,1,6), t=[]; for(var i=0;i<7;i++) t.push(a*Math.pow(2,i)); return {t:t,rule:"Each number is double the one before."}; }},
  {id:"inc",lv:2,w:5,mk:function(r){ var a=ri(r,1,10), d=ri(r,1,3), s=ri(r,1,2), t=[a]; for(var i=1;i<7;i++) t.push(t[i-1]+d+(i-1)*s); return {t:t,rule:"The gaps between the numbers grow by "+s+" each time."}; }},
  {id:"sq",lv:2,w:5,mk:function(r){ var k=ri(r,1,4), t=[]; for(var i=0;i<7;i++) t.push((k+i)*(k+i)); return {t:t,rule:"They're square numbers: "+k+" × "+k+", "+(k+1)+" × "+(k+1)+", and so on."}; }},
  {id:"tri",lv:2,w:4.6,mk:function(r){ var a=ri(r,1,3), t=[]; for(var i=0;i<7;i++) t.push(a*Math.pow(3,i)); return {t:t,rule:"Each number is three times the one before."}; }},
  {id:"alt",lv:2,w:5.6,mk:function(r){ var p=ri(r,4,9), q=ri(r,1,p-1), a=ri(r,10,30), t=[a]; for(var i=1;i<7;i++) t.push(t[i-1]+(i%2?p:-q)); return {t:t,rule:"The numbers go up "+p+", then down "+q+", in turn."}; }},
  {id:"fib",lv:3,w:7,mk:function(r){ var a=ri(r,1,5), b=ri(r,a+1,a+6), t=[a,b]; for(var i=2;i<7;i++) t.push(t[i-1]+t[i-2]); return {t:t,rule:"Each number is the two before it added together."}; }},
  {id:"dp",lv:3,w:7.5,mk:function(r){ var a=ri(r,1,5), c=ri(r,1,3), t=[a]; for(var i=1;i<7;i++) t.push(t[i-1]*2+c); return {t:t,rule:"Double each number, then add "+c+"."}; }},
  {id:"two",lv:3,w:8,mk:function(r){ var a=ri(r,1,9), p=ri(r,2,6), b=ri(r,20,40), q=ri(r,2,5), t=[]; for(var i=0;i<7;i++) t.push(i%2?b-((i-1)/2)*q:a+(i/2)*p); return {t:t,rule:"Two patterns take turns: every other number goes up "+p+", and the ones between go down "+q+"."}; }},
  {id:"sqp",lv:3,w:8,mk:function(r){ var k=ri(r,1,4), c=pick(r,[1,2,3,-1]), t=[]; for(var i=0;i<7;i++) t.push((k+i)*(k+i)+c); return {t:t,rule:"Each is a square number "+(c>0?"plus "+c:"minus "+(-c))+": "+k+" × "+k+(c>0?" + ":" − ")+Math.abs(c)+", and so on."}; }},
  {id:"cube",lv:4,w:9.5,mk:function(r){ var k=ri(r,1,2), t=[]; for(var i=0;i<7;i++) t.push(Math.pow(k+i,3)); return {t:t,rule:"They're cube numbers: "+k+" × "+k+" × "+k+", and so on."}; }},
  {id:"dd",lv:4,w:9,mk:function(r){ var a=ri(r,1,9), d=ri(r,1,3), t=[a]; for(var i=1;i<7;i++) t.push(t[i-1]+d*Math.pow(2,i-1)); return {t:t,rule:"The gaps between the numbers double each time."}; }},
  {id:"fact",lv:4,w:10.5,mk:function(r){ var t=[1]; for(var i=1;i<7;i++) t.push(t[i-1]*(i+1)); return {t:t,rule:"Multiply by 2, then 3, then 4, and so on."}; }},
  {id:"trib",lv:4,w:10,mk:function(r){ var t=[ri(r,1,3),ri(r,1,4),ri(r,2,6)]; for(var i=3;i<7;i++) t.push(t[i-1]+t[i-2]+t[i-3]); return {t:t,rule:"Each number is the three before it added together."}; }},
  {id:"am",lv:4,w:10,mk:function(r){ var a=ri(r,1,4), k=ri(r,1,5), t=[a]; for(var i=1;i<7;i++) t.push(i%2?t[i-1]*2:t[i-1]+k); return {t:t,rule:"Double, then add "+k+", in turn."}; }}
];
function makeSeq(r,lv){
  for(var tries=0;tries<200;tries++){
    var fams=SEQF.filter(function(f){ return f.lv===lv||(lv>=3&&f.lv===lv-1&&r()<.25); }), f=pick(r,fams), s=f.mk(r);
    var mid=lv>=3&&r()<.4, gap=mid?ri(r,2,4):6, shown=s.t.slice(0,mid?6:6);
    var ans=mid?s.t[gap]:s.t[6];
    if(ans<=0||ans>9999||shown.some(function(x){ return x<0; })) continue;
    var terms=mid?s.t.slice(0,7):s.t.slice(0,6).concat([null]); if(mid){ terms[gap]=null; }
    return {kind:"seq",fam:f.id,terms:terms,ans:ans,digits:String(ans).length,rule:s.rule,grade:f.w+(mid?1.5:0)};
  }
  return null;
}

/* ---------- sum: the globe's picture sums ----------
   Things on the desk stand for whole numbers. Lines like "key + key + candle = 14" (later "globe − quill = 3" and "key × cup = 24").
   The step solver: solve any line with one unknown left; if none, take one + line away from another that holds all of its things
   (that's a harder step). Grade: each easy step 1 + .4 a term, each take-away step 4.5, plus 1.5 a thing. */
var SYMS=["key","candle","quill","cup","book","globe"];
function eqKnown(e,v){ var u=[]; e.t.forEach(function(s){ if(v[s]==null&&u.indexOf(s)<0) u.push(s); }); return u; }
function solveSums(eqs,k){
  var v={}, E=eqs.map(function(e){ return {t:e.t.slice(),op:e.op,val:e.val}; }), steps=[], grade=0, guard=0;
  while(Object.keys(v).length<k&&guard++<20){
    var did=false;
    for(var q=0;q<E.length&&!did;q++){ var e=E[q], u=eqKnown(e,v); if(u.length!==1) continue; var s=u[0], val=null;
      if(e.op==="+"){ var c=0, rest=0; e.t.forEach(function(x){ if(x===s) c++; else rest+=v[x]; }); if((e.val-rest)%c===0) val=(e.val-rest)/c; }
      else if(e.op==="-"){ val=e.t[0]===s?e.val+v[e.t[1]]:v[e.t[0]]-e.val; }
      else if(e.op==="x"){ var o=e.t[0]===s?v[e.t[1]]:v[e.t[0]]; if(o&&e.val%o===0) val=e.val/o; }
      if(val==null||val<=0) continue;
      v[s]=val; steps.push({s:s,v:val,from:q,how:"one"}); grade+=1+.4*e.t.length; did=true; }
    if(did) continue;
    /* a take-away step: line B holds everything line A holds (still unknown), plus more */
    for(var a=0;a<E.length&&!did;a++) for(var b=0;b<E.length&&!did;b++){ if(a===b||E[a].op!=="+"||E[b].op!=="+") continue;
      var A=E[a].t.filter(function(x){ return v[x]==null; }), B=E[b].t.filter(function(x){ return v[x]==null; }); if(!A.length||B.length<=A.length) continue;
      var Bl=B.slice(), ok=A.every(function(x){ var i=Bl.indexOf(x); if(i<0) return false; Bl.splice(i,1); return true; }); if(!ok) continue;
      var kA=E[a].t.reduce(function(sum,x){ return sum+(v[x]!=null?v[x]:0); },0), kB=E[b].t.reduce(function(sum,x){ return sum+(v[x]!=null?v[x]:0); },0);
      var ne={t:Bl,op:"+",val:(E[b].val-kB)-(E[a].val-kA)}; if(ne.val<=0) continue;
      if(E.some(function(x){ return x.op==="+"&&x.val===ne.val&&x.t.slice().sort().join()===ne.t.slice().sort().join(); })) continue;
      E.push(ne); steps.push({how:"take",a:a,b:b,eq:ne}); grade+=4.5; did=true; }
    if(!did) return null;
  }
  return Object.keys(v).length===k?{v:v,steps:steps,grade:grade}:null;
}
function makeSum(r,lv){
  var k=lv===1?2:lv<=3?3:4, ne=k, maxV=lv>=4?15:12;
  for(var tries=0;tries<600;tries++){
    var syms=shuffle(SYMS.slice(),r).slice(0,k), v={}, used={};
    syms.forEach(function(s){ var x; do{ x=ri(r,lv===1?1:2,maxV); }while(used[x]); used[x]=1; v[s]=x; });
    var eqs=[];
    for(var q=0;q<ne;q++){
      var op="+", roll=r();
      if(lv>=3&&roll<.28) op="-"; else if(lv>=4&&roll<.5) op="x";
      var t;
      if(op==="+"){ var n=lv===1?ri(r,2,3):ri(r,2,4); t=[]; for(var j=0;j<n;j++) t.push(pick(r,syms)); }
      else { var x1=pick(r,syms), x2; do{ x2=pick(r,syms); }while(x2===x1); t=[x1,x2]; if(op==="-"&&v[x1]<=v[x2]){ var tt=x1; x1=x2; x2=tt; t=[x1,x2]; } }
      var val=op==="+"?t.reduce(function(s,x){ return s+v[x]; },0):op==="-"?v[t[0]]-v[t[1]]:v[t[0]]*v[t[1]];
      if(op==="x"&&val>99) { q--; continue; }
      if(op!=="-") t.sort(function(a,b){ return syms.indexOf(a)-syms.indexOf(b); });
      eqs.push({t:t,op:op,val:val});
    }
    /* no line may be a copy of another, and no line may be one thing alone (too easy) except on Monday */
    var keys=eqs.map(function(e){ return e.op+e.t.join(); }); if(keys.some(function(x,i){ return keys.indexOf(x)!==i; })) continue;
    if(lv>1&&eqs.some(function(e){ return e.op==="+"&&e.t.every(function(x){ return x===e.t[0]; }); })) continue;
    var S=solveSums(eqs,k); if(!S) continue;
    var takes=S.steps.filter(function(s){ return s.how==="take"; }).length;
    if(lv===1&&takes) continue; if(lv>=3&&!takes) continue;
    if(lv>=3&&!eqs.some(function(e){ return e.op!=="+"; })&&r()<.6) continue;
    /* the question: a total of two or three of the things */
    var qn=lv===1?2:ri(r,2,3), qt=[]; for(var j2=0;j2<qn;j2++) qt.push(pick(r,syms)); qt.sort(function(a,b){ return syms.indexOf(a)-syms.indexOf(b); });
    if(qt.every(function(x){ return x===qt[0]; })) continue;
    var ans=qt.reduce(function(s,x){ return s+v[x]; },0);
    if(keys.indexOf("+"+qt.join())>=0) continue;
    return {kind:"sum",syms:syms,eqs:eqs,q:qt,ans:ans,digits:String(ans).length,v:v,steps:S.steps,grade:S.grade+1.5*k+.5*qn};
  }
  return null;
}

/* ---------- code: the padlock's clue lines ----------
   The code's numbers are all different. Each line is a guess and what's right about it. The solver keeps every code that fits the lines
   read so far, reading the most telling line first; the grade counts the lines and how little each tells on its own. */
function fb(g,c){ var well=0, wrong=0; for(var i=0;i<g.length;i++){ if(g[i]===c[i]) well++; else if(c.indexOf(g[i])>=0) wrong++; } return [well,wrong]; }
var ALLC={};
function allCodes(n){ if(ALLC[n]) return ALLC[n]; var out=[]; (function go(p){ if(p.length===n){ out.push(p.slice()); return; } for(var d=0;d<10;d++){ if(p.indexOf(d)>=0) continue; p.push(d); go(p); p.pop(); } })([]); return ALLC[n]=out; }
function fits(c,clues){ for(var i=0;i<clues.length;i++){ var f=fb(clues[i].g,c); if(f[0]!==clues[i].f[0]||f[1]!==clues[i].f[1]) return false; } return true; }
function clueText(f,n){
  if(!f[0]&&!f[1]) return "Nothing is correct.";
  var a=[], b=f[0], w=f[1];
  if(b) a.push((b===1?"One number is":cap(WORDN[b])+" numbers are")+" correct and well placed");
  if(w) a.push((b?(w===1?"one is":WORDN[w]+" are"):(w===1?"One number is":cap(WORDN[w])+" numbers are"))+" correct but wrongly placed");
  return a.join("; ")+".";
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function makeCode(r,lv){
  var n=lv>=4?4:3, all=allCodes(n), maxC=[0,4,5,6,7][lv], minC=[0,3,4,5,6][lv];
  for(var tries=0;tries<300;tries++){
    var code=pick(r,all).slice(), clues=[], left=all, guard=0;
    while(left.length>1&&guard++<60){
      var g=pick(r,all), f=fb(g,code);
      if(g.join()===code.join()) continue;
      if(f[0]+f[1]===0&&(lv>=3||clues.some(function(c){ return c.f[0]+c.f[1]===0; }))) continue;
      if(f[0]===n-1&&lv>=2) continue;
      var nl=left.filter(function(c){ var x=fb(g,c); return x[0]===f[0]&&x[1]===f[1]; });
      if(nl.length===left.length) continue;
      if(nl.length<1) continue;
      clues.push({g:g,f:f}); left=nl;
    }
    if(left.length!==1) continue;
    /* drop lines that aren't needed */
    var order=shuffle(clues.map(function(c,i){ return i; }),r);
    order.forEach(function(i){ var t=clues.filter(function(c,j){ return j!==i&&c; }); if(t.length&&all.filter(function(c){ return fits(c,t); }).length===1) clues[i]=null; });
    clues=clues.filter(Boolean);
    if(clues.length<minC||clues.length>maxC) continue;
    if(lv===1&&!clues.some(function(c){ return c.f[0]+c.f[1]===0; })) continue;
    var info=0; clues.forEach(function(c){ var k=all.filter(function(x){ return fits(x,[c]); }).length; info+=Math.log(k)/Math.log(all.length)*3; });
    clues.forEach(function(c){ c.text=clueText(c.f,n); });
    return {kind:"code",n:n,clues:clues,ans:code.join(""),code:code,digits:n,
      grade:3*n+2.2*clues.length+info-(clues.some(function(c){ return c.f[0]+c.f[1]===0; })?2:0)};
  }
  return null;
}

/* ---------- light: the safe's jeweled buttons ----------
   Pressing a button flips it and the buttons beside it (above, below, left and right). Light every jewel.
   The day's panel is made by pressing some buttons on a lit panel; on a 3 x 3 panel that set is the only fewest-press answer.
   Grade: 2.2 a press needed, +3 on the 4 x 4 panel. */
function flipMask(N,i){ var r=(i/N)|0, c=i%N, m=1<<i; if(r>0) m|=1<<(i-N); if(r<N-1) m|=1<<(i+N); if(c>0) m|=1<<(i-1); if(c<N-1) m|=1<<(i+1); return m; }
var BFS={};
function lightTable(N){
  if(BFS[N]) return BFS[N];
  var S=1<<(N*N), full=S-1, dist=new Int8Array(S).fill(-1), from=new Int8Array(S), q=new Int32Array(S), h=0, t=0, F=[];
  for(var i=0;i<N*N;i++) F.push(flipMask(N,i));
  dist[full]=0; q[t++]=full;
  while(h<t){ var s=q[h++]; for(var j=0;j<N*N;j++){ var x=s^F[j]; if(dist[x]<0){ dist[x]=dist[s]+1; from[x]=j; q[t++]=x; } } }
  return BFS[N]={dist:dist,from:from,F:F};
}
/* the next press on a fewest-press way to light everything from state s (bits set = lit) */
function lightNext(N,s){ var T=lightTable(N); return T.dist[s]>0?T.from[s]:-1; }
function makeLight(r,lv){
  var N=lv>=4?4:3, want=[0,[2,3],[3,4],[4,5],[5,7]][lv], T=lightTable(N), full=(1<<(N*N))-1;
  for(var tries=0;tries<300;tries++){
    var k=ri(r,want[0],want[1]), cells=shuffle(Array.from({length:N*N},function(_,i){ return i; }),r).slice(0,k), s=full;
    cells.forEach(function(i){ s^=T.F[i]; });
    var d=T.dist[s]; if(d<want[0]||d>want[1]) continue;
    if(s===full||s===0) continue;
    return {kind:"light",N:N,start:s,min:d,grade:2.2*d+(N===4?3:0)};
  }
  return null;
}

/* ---------- shelf and door: putting things in order from clue lines ----------
   The solver tries every order (at most 720), and the clue lines are added until only one order fits, then thinned.
   Grade: 1.6 an item, plus each line's weight (a fixed place 1, directly left 1.5, at an end, next to, left of or a place it isn't 2, not next to or between 3). */
var CT={
  pos:{w:1,t:function(L,a,p){ return cap(L[a])+" is "+ORD[p]+" from the left."; },ok:function(o,a,p){ return o.indexOf(a)===p; }},
  notpos:{w:2,t:function(L,a,p){ return cap(L[a])+" isn't "+ORD[p]+" from the left."; },ok:function(o,a,p){ return o.indexOf(a)!==p; }},
  end:{w:2,t:function(L,a){ return cap(L[a])+" is at one end."; },ok:function(o,a){ var i=o.indexOf(a); return i===0||i===o.length-1; }},
  notend:{w:2,t:function(L,a){ return cap(L[a])+" isn't at either end."; },ok:function(o,a){ var i=o.indexOf(a); return i>0&&i<o.length-1; }},

  else if(Lk.kind==="sum"){ if(k<=Lk.steps.length){ var s=Lk.steps[k-1]; msg=s.how==="take"?"Take one line away from another: what's left is a new, shorter line.":"He's pencilled in what the "+s.s+" is worth."; } else { setupDial(Lk); msg="He's set the answer on the wheels: "+Lk.ans+". Try the lock."; } }

  noteFill(); mechFill(); save(); status();

}
