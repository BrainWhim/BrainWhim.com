/* ===== The Locked Study (Puzzles & Brain Games, Nov 2): a daily escape room =====
   Professor Hartwell has locked you in his study. Each lock you open holds a brass token and the clue to the next; the last lock is the door.
   The board is a fixed-shape box measured in units (--u = the board's width / 1000): the room is a drawing, and each lock is a close-up.
   Wide boards (desktop, sideways phones) are 1000 x 760 units; tall ones (phones upright) 1000 x 1180, with the professor's letter under the room.
   Studies (the Studies card): Green Study (free); Oxblood Library, Blue Drawing Room (Club).
   Light comes from the top left everywhere: highlights on top and left edges, shade and shadows to the bottom right. */
body{--wall1:#3d5c47;--wall2:#22382b;--dam:#cfe3c8;--wood1:#a5603a;--wood2:#6e3519;--wood3:#3a1a0b;--rug1:#8e2b25;--rug2:#4e1210;--paper1:#fbf5e4;--paper2:#ecdfbd;--ink:#2a2116;--red:#9c2b1c}
body[data-set="oxblood"]{--wall1:#6e2a2a;--wall2:#3e1416;--dam:#f0cfc0;--wood1:#8d5a3a;--wood2:#55301b;--wood3:#2a150a;--rug1:#2f4a6e;--rug2:#152640}
body[data-set="blue"]{--wall1:#4b6480;--wall2:#27384d;--dam:#d6e4f2;--wood1:#b88a5a;--wood2:#7a522c;--wood3:#3e2810;--rug1:#7a5a22;--rug2:#3e2c0c}
.st-mono{font:500 1em Montserrat,sans-serif;white-space:nowrap}.st-mono i{font:400 .76em Pacifico,cursive;font-style:normal;margin-left:.05em;padding-right:.15em}
.st-pad{position:relative;flex:none;display:grid;grid-template-columns:auto auto;gap:18px;align-items:start;justify-content:center}
.st-left{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.st-right{display:flex;flex-direction:column;gap:10px;width:var(--st-nw,280px)}
.num,.st-dial b,.st-dial span,.st-plq,.st-tile,.st-coin b,.st-eq .v{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
/* ---------- the board ---------- */
.st-board{position:relative;width:var(--st-bw,600px);height:calc(var(--st-bw,600px) * .76);--u:calc(var(--st-bw,600px) / 1000);border-radius:calc(var(--u) * 16);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:#1a120c;box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 calc(var(--u) * 3) rgba(231,199,122,.28),0 14px 34px rgba(0,0,0,.55)}
.st-board.tall{height:calc(var(--st-bw,600px) * var(--tr,1.18))}
.st-notes{display:none;position:absolute;right:calc(var(--u) * 18);top:calc(var(--u) * 16);z-index:3;height:calc(var(--u) * 58);padding:0 calc(var(--u) * 22);border:calc(var(--u) * 2) solid #e7c77a;border-radius:calc(var(--u) * 29);cursor:pointer;font:700 calc(var(--u) * 27)/1 Montserrat,sans-serif;color:#f6e3a8;background:rgba(20,12,4,.55);box-shadow:0 calc(var(--u) * 3) calc(var(--u) * 6) rgba(0,0,0,.45)}
.st-pad.slim .st-notes{display:block}
.st-pad.slim .st-right{display:none}
.st-pad.slim .st-head{justify-content:flex-start;padding-left:calc(var(--u) * 210);font-size:calc(var(--u) * 36)}
.st-pad.slim .st-head small{display:none}
.st-view{position:absolute;inset:0;display:none}
.st-view.on{display:block}
.st-room svg{position:absolute;left:0;top:0;width:100%;height:calc(var(--u) * 760);display:block;cursor:pointer;touch-action:manipulation}
.st-room .st-mk{animation:st-pulse 1.3s ease-in-out infinite}
@keyframes st-pulse{0%,100%{opacity:.45}50%{opacity:1}}
.st-room .st-leaf{transform-box:fill-box;transform-origin:0 50%;transition:transform 1.6s cubic-bezier(.4,.1,.3,1)}
.st-room.free .st-leaf{transform:scaleX(.14) skewY(-9deg)}
.st-room .st-sun{opacity:0;transition:opacity 1.4s ease .3s}
.st-room.free .st-sun{opacity:1}
/* the room's 3-D pass (Nov 2): opened things drawn open, and small living things (none of it while pieces move: the room is hidden in a close-up) */
.st-room svg .op{display:none}
.st-room svg.o-desk .op-desk,.st-room svg.o-box .op-box,.st-room svg.o-safe .op-safe,.st-room svg.o-clock .op-clock,.st-room svg.o-globe .op-globe,.st-room svg.o-books .op-books{display:inline}
.st-room svg.o-desk .cl-desk,.st-room svg.o-box .cl-box,.st-room svg.o-safe .cl-safe,.st-room svg.o-clock .cl-clock{display:none}
.st-room .st-paint{transform-box:fill-box;transform-origin:0 50%;transition:transform 1.2s cubic-bezier(.4,.1,.3,1)}
.st-room svg.o-safe .st-paint{transform:scaleX(.16) skewY(-10deg)}
.st-room .st-fl{transform-box:fill-box;transform-origin:50% 100%;animation:st-flick 1.3s ease-in-out infinite alternate}
.st-room .st-fl.b{animation-duration:1.8s;animation-delay:-.4s}.st-room .st-fl.c{animation-duration:1.05s;animation-delay:-.7s}.st-room .st-fl.d{animation-duration:.8s}
@keyframes st-flick{0%{transform:scaleY(.88) skewX(-4deg)}50%{transform:scaleY(1.1) skewX(2deg)}100%{transform:scaleY(.94) skewX(5deg)}}
.st-room .st-cf{transform-box:fill-box;transform-origin:50% 100%;animation:st-flick 1.1s ease-in-out infinite alternate}.st-room .st-cf.b{animation-duration:1.5s;animation-delay:-.5s}
.st-room .st-glow{animation:st-glowp 2.4s ease-in-out infinite alternate}
@keyframes st-glowp{0%{opacity:.75}100%{opacity:1}}
.st-room .st-sec{transform-box:view-box;transform-origin:486px 258px;animation:st-sec 60s steps(60) infinite}
@keyframes st-sec{to{transform:rotate(360deg)}}
.st-room .st-pend{transform-box:view-box;transform-origin:486px 292px;animation:st-swing 1s ease-in-out infinite alternate}
@keyframes st-swing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.st-room .st-turn{animation:st-turn 46s linear infinite}
@keyframes st-turn{to{transform:translateX(-260px)}}
.st-room .st-mote{animation:st-mote 11s ease-in-out infinite}
.st-room .st-mote.m1{animation-delay:-2.2s;animation-duration:13s}.st-room .st-mote.m2{animation-delay:-4.4s}.st-room .st-mote.m3{animation-delay:-6.6s;animation-duration:9s}.st-room .st-mote.m4{animation-delay:-8.8s;animation-duration:12s}
@keyframes st-mote{0%{opacity:0;transform:translate(0,0)}35%{opacity:.75}100%{opacity:0;transform:translate(34px,46px)}}
body.st-still .st-room svg *{animation:none!important}
/* stepping in and out of a close-up: the room zooms toward the thing you tapped (the room is its own layer, so the zoom just scales it) */
.st-room{will-change:transform}
.st-room.zin{transition:transform .4s cubic-bezier(.3,0,.2,1),opacity .2s ease-in .2s;transform:scale(2.3);opacity:0}
.st-room.zout{transform:scale(2.3);opacity:0}
.st-room.zback{transition:transform .42s cubic-bezier(.2,.6,.3,1),opacity .3s ease-out}
.st-lock.zfade{animation:st-zfade .32s ease-out}

<script id="stCore">
/* ===== The Locked Study core (the five kinds of lock, their makers and graders, the week, the day's chain): shared by the page and the tests =====
   Professor Hartwell has locked you in his study. Each lock you open holds a brass token and the clue to the next lock; the last lock is the door.
   The kinds of lock:
     seq   the mantel clock: a number pattern; the missing number opens it (dial lock)
     sum   the globe: picture sums of things on the desk; the asked-for total opens it (dial lock)
     code  the desk drawer (and the writing box): a combination padlock with "one number is correct…" clue lines (dial lock)
     light the wall safe behind the painting: jeweled buttons; a press flips it and the ones beside it; light them all
     shelf the bookcase: put the books in order from clue lines
     door  the door: set the tokens in the order the clues give (on Monday and Tuesday the plate shows the order)
   Every lock has exactly one answer (the safe has one fewest-press answer on its 3 x 3 panels), and each is graded by a step-by-step solver

(function(root){

/* ---------- seq: the mantel clock's number pattern ----------

  {id:"sub",lv:1,w:2.6,mk:function(r){ var d=ri(r,3,9), a=ri(r,7*d+5,99), t=[]; for(var i=0;i<7;i++) t.push(a-i*d); return {t:t,rule:"Each number is "+d+" less than the one before."}; }},
  {id:"dbl",lv:1,w:3,mk:function(r){ var a=ri(r,1,6), t=[]; for(var i=0;i<7;i++) t.push(a*Math.pow(2,i)); return {t:t,rule:"Each number is double the one before."}; }},
  {id:"inc",lv:2,w:5,mk:function(r){ var a=ri(r,1,10), d=ri(r,1,3), s=ri(r,1,2), t=[a]; for(var i=1;i<7;i++) t.push(t[i-1]+d+(i-1)*s); return {t:t,rule:"The gaps between the numbers grow by "+s+" each time."}; }},

  {id:"alt",lv:2,w:5.6,mk:function(r){ var p=ri(r,4,9), q=ri(r,1,p-1), a=ri(r,10,30), t=[a]; for(var i=1;i<7;i++) t.push(t[i-1]+(i%2?p:-q)); return {t:t,rule:"The numbers go up "+p+", then down "+q+", in turn."}; }},

  {id:"sqp",lv:3,w:8,mk:function(r){ var k=ri(r,1,4), c=pick(r,[1,2,3,-1]), t=[]; for(var i=0;i<7;i++) t.push((k+i)*(k+i)+c); return {t:t,rule:"Each is a square number "+(c>0?"plus "+c:"minus "+(-c))+": "+k+" × "+k+(c>0?" + ":" − ")+Math.abs(c)+", and so on."}; }},

  {id:"dd",lv:4,w:9,mk:function(r){ var a=ri(r,1,9), d=ri(r,1,3), t=[a]; for(var i=1;i<7;i++) t.push(t[i-1]+d*Math.pow(2,i-1)); return {t:t,rule:"The gaps between the numbers double each time."}; }},

  {id:"am",lv:4,w:10,mk:function(r){ var a=ri(r,1,4), k=ri(r,1,5), t=[a]; for(var i=1;i<7;i++) t.push(i%2?t[i-1]*2:t[i-1]+k); return {t:t,rule:"Double, then add "+k+", in turn."}; }}

function makeSeq(r,lv){

    var fams=SEQF.filter(function(f){ return f.lv===lv||(lv>=3&&f.lv===lv-1&&r()<.25); }), f=pick(r,fams), s=f.mk(r);

    var ans=mid?s.t[gap]:s.t[6];

    var terms=mid?s.t.slice(0,7):s.t.slice(0,6).concat([null]); if(mid){ terms[gap]=null; }
    return {kind:"seq",fam:f.id,terms:terms,ans:ans,digits:String(ans).length,rule:s.rule,grade:f.w+(mid?1.5:0)};
  }
  return null;
}

/* ---------- sum: the globe's picture sums ----------
   Things on the desk stand for whole numbers. Lines like "key + key + candle = 14" (later "globe − quill = 3" and "key × cup = 24").
   The step solver: solve any line with one unknown left; if none, take one + line away from another that holds all of its things
   (that's a harder step). Grade: each easy step 1 + .4 a term, each take-away step 4.5, plus 1.5 a thing. */
var SYMS=["key","candle","quill","cup","book","globe"];

      if(e.op==="+"){ var c=0, rest=0; e.t.forEach(function(x){ if(x===s) c++; else rest+=v[x]; }); if((e.val-rest)%c===0) val=(e.val-rest)/c; }
      else if(e.op==="-"){ val=e.t[0]===s?e.val+v[e.t[1]]:v[e.t[0]]-e.val; }

/* ---------- code: the padlock's clue lines ----------

      if(f[0]===n-1&&lv>=2) continue;
      var nl=left.filter(function(c){ var x=fb(g,c); return x[0]===f[0]&&x[1]===f[1]; });
      if(nl.length===left.length) continue;

/* ---------- Read His Notes: help for the lock in front of you ----------
   seq: first his margin note (the rule), then the number set on the wheels · sum: one pencilled step at a time, then the answer
   code: one wheel set and fixed at a time · safe: one jewel to press, ringed · bookcase and door: the next place from the left set and fixed */

  /* the "It opens!" card is up: step on to the next lock first; no note is used */

  startClock();

  var Lk=L(); hints++; HS[cur]=(HS[cur]||0)+1; snd("st-hint");
  var k=HS[cur], msg="";
  if(Lk.kind==="seq"){ if(k===1) msg="His margin note says how the numbers go."; else { setupDial(Lk); msg="He's written the missing number: "+Lk.ans+". Try the lock."; } }
  else if(Lk.kind==="sum"){ if(k<=Lk.steps.length){ var s=Lk.steps[k-1]; msg=s.how==="take"?"Take one line away from another: what's left is a new, shorter line.":"He's pencilled in what the "+s.s+" is worth."; } else { setupDial(Lk); msg="He's set the answer on the wheels: "+Lk.ans+". Try the lock."; } }
  else if(Lk.kind==="code"){ var n=Lk.n; if(k>n){ HS[cur]=n; hints--; msg="Every wheel is set. Try the lock."; } else { dial[k-1]=+Lk.ans.charAt(k-1); msg=k===n?"He's set the last wheel. Try the lock.":"He's set the "+["first","second","third","fourth"][k-1]+" wheel for you."; } }

  else { if(k>Lk.n){ HS[cur]=Lk.n; hints--; msg="Everything is in place. "+(Lk.kind==="shelf"?"Try the bookcase.":"Turn the key."); } else { applyFixes(); pickI=-1; msg="He's set the "+ORD[k-1]+" place from the left for you."; } }
  noteFill(); mechFill(); save(); status();

  if(mode==="practice"&&window.Parlor) Parlor.hintSay("<p>"+esc(msg)+"</p>");

}

var STORIES=[
  {name:"The Bramah Challenge",kind:"London · 1790",t:"Joseph Bramah put one of his locks in his shop window with a notice offering 200 guineas to anyone who could pick it. It held for over sixty years, until the American locksmith Alfred C. Hobbs opened it in 1851, after 51 hours of work spread over 16 days."},

  var sum={kind:"sum",syms:["key","candle"],eqs:[{t:["key","key"],op:"+",val:6},{t:["key","candle"],op:"+",val:8}],q:["candle"],ans:5,digits:1,v:{key:3,candle:5}};

    clues:[{k:"pos",a:1,b:0,text:"The green book is at the far left."},{k:"imm",a:0,b:2,text:"The red book is directly left of the blue book."}]};
  var locks=[{kind:"seq",terms:[2,4,6,8,10,12,null],ans:14,digits:2,rule:"Each number is 2 more than the one before.",obj:"clock",token:3},
    Object.assign(sum,{obj:"globe",token:7}),Object.assign(shelf,{obj:"books",token:4})];
  locks.push({kind:"door",n:3,order:[2,0,1],clues:[],shown:true,obj:"door"});
  return {locks:locks};
}

function seatedNow(){ return document.body.classList.contains("seated"); }
function shrink(el,min){ if(!el) return; el.style.zoom=""; var inner=el.scrollHeight, h=el.clientHeight; if(h>0&&inner>h+2) el.style.zoom=Math.max(min,h/inner); }
function fitLock(){ /* shrink a note, a lock or the letter that doesn't fit (a long Sunday padlock on a small phone) */
  shrink($("#stNote",LOCK),.7);
  var m=$("#stMech",LOCK); if(m){ m.style.zoom=""; var kids=[].slice.call(m.children), need=kids.reduce(function(t,k){ var cs=getComputedStyle(k); return t+k.offsetHeight+Math.max(0,parseFloat(cs.marginTop))+Math.max(0,parseFloat(cs.marginBottom)); },0)+(kids.length-1)*parseFloat(getComputedStyle(m).rowGap||0)+10, h=m.clientHeight; if(h>0&&need>h+2) m.style.zoom=Math.max(.7,h/need); }
  var bl=$("#stBlot",stage), bi=bl&&bl.firstChild; if(bi&&bi.style){ bi.style.zoom=""; var cs=getComputedStyle(bl), room=bl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom); if(room>0&&bi.offsetHeight>room+1) bi.style.zoom=Math.max(.62,room/bi.offsetHeight); }
}
function fit(){
  if(!D) return;
  var VW=Math.min(window.innerWidth,document.documentElement.clientWidth||1e9), wide=VW>=1000;
  var land=!!(window.Parlor&&Parlor.land&&Parlor.land());
  stage.classList.toggle("land",land);
  if(land){ fitLand(VW); return; }
  document.body.style.removeProperty("--pk-landR"); document.body.style.removeProperty("--pk-landTools");
  var st2=document.querySelector(".pk-stage"), top=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185, bw, availH;
  if(wide){
    BOARD.classList.remove("tall"); stage.classList.remove("slim");
    var availW=Math.min((st2&&st2.clientWidth)||(VW-560),1060), nw=Math.round(Math.max(250,Math.min(290,availW*.3)));
    stage.style.setProperty("--st-nw",nw+"px");
    availH=window.innerHeight-top-22;
    var side=Math.min(availW-nw-18-8,(availH-6)/.76,860), under=Math.min(availW-8,(availH-6-112)/.76,860);
    stage.classList.toggle("stack",under>side+40);
    bw=Math.floor(under>side+40?under:side); bw=Math.max(420,bw);
    stage.classList.remove("coach"); stage.style.paddingTop="";
  } else {
    BOARD.classList.add("tall"); stage.classList.remove("stack");
    stage.style.removeProperty("--st-nw");
    availH=window.innerHeight-(seatedNow()?top:56)-(64+24)-6;
    var coach=seatedNow()&&document.body.classList.contains("pk-coaching")&&window.Parlor&&Parlor.coachHeight&&Parlor.coachHeight()>0;
    stage.classList.toggle("coach",!!coach); stage.style.paddingTop="";
    if(coach){ var ch=Parlor.coachHeight(), stTop=stage.getBoundingClientRect().top, bar=document.querySelector(".pk-bar");
      var barTop=bar&&getComputedStyle(bar).display!=="none"?bar.getBoundingClientRect().top:window.innerHeight;
      if(ch>stTop) stage.style.paddingTop=Math.round(ch-stTop)+"px";
      availH=barTop-8-Math.max(ch,stTop); }
    var slim=window.innerHeight<700; stage.classList.toggle("slim",slim);
    var rest=coach||slim?0:$(".st-right",stage).offsetHeight+8;
    /* as tall as fits, between 1 and 1.18 times the width; then the width that fits */
    var tr=Math.max(coach?.78:1,Math.min(1.18,(availH-rest)/(VW-12))); BOARD.style.setProperty("--tr",tr.toFixed(3)); BOARD.classList.toggle("noblot",tr<1);
    bw=Math.floor(Math.min(VW-12,(availH-rest)/tr)); bw=Math.max(240,bw);
  }
  stage.style.setProperty("--st-bw",bw+"px");
  document.body.style.setProperty("--pk-size",Math.round(stage.offsetWidth||VW)+"px");
  setTimeout(fitLock,0);
}
function fitLand(VW){

/* the keyboard on a computer: digits set the wheels left to right, arrows move and turn them, Enter tries the lock, Escape steps back */
document.addEventListener("keydown",function(e){
  if(!seatedNow()||!D||done) return;
  if(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(document.querySelector(".pk-veil.on")) return;
  if(view!=="lock"){ if(e.key==="Enter"){ e.preventDefault(); if(!(mode==="lesson"&&blocked())) openLock(); } return; }
  if(e.key==="Escape"){ e.preventDefault(); if(!(mode==="lesson"&&Parlor.lessonWaiting)) showRoom(); return; }
  var Lk=L(); if(!(Lk.kind==="seq"||Lk.kind==="sum"||Lk.kind==="code")) { if(e.key==="Enter"&&$("#stTry",LOCK)){ e.preventDefault(); $("#stTry",LOCK).click(); } return; }
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); if(blocked()) return; kbd=true; while(dialAt<dial.length&&fixedW(dialAt)) dialAt++; if(dialAt>=dial.length) dialAt=0; if(fixedW(dialAt)) return; startClock(); dial[dialAt]=+e.key; snd("st-tick"); dialAt=(dialAt+1)%dial.length; paintDial(); }
  else if(e.key==="ArrowLeft"||e.key==="ArrowRight"){ e.preventDefault(); kbd=true; dialAt=(dialAt+(e.key==="ArrowLeft"?dial.length-1:1))%dial.length; paintDial(); }
  else if(e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); kbd=true; spin(dialAt,e.key==="ArrowUp"?1:-1); }
  else if(e.key==="Enter"){ e.preventDefault(); tryDial(); }
});
