<style>
/* ==========================================================================
   BrainWhim · Moonlets: Story Blocks (Nov 10, 2026), the blue moon's Stories spot
   An open storybook on the meadow and three rows of wooden picture blocks:
   red = a friend (bunny, bear, robot, turtle), blue = a place (moon, sea, forest, castle),
   gold = a surprise (star, balloon, cake, rainbow). Finn names each block, then asks for the next row.
   The book's left page draws the picks as they're chosen; tap the book and Finn tells the story,
   three recorded lines in a row (st-1-*, st-2-*, st-3-*), each line lit on the right page. 64 stories.
   No wrong answers, no timer. Saved on the device: bwk.stories {told, made:{"w-p-s":1}, pick:[w,p,s]}. Test hook SBO.
   ========================================================================== */
.bg{position:fixed;inset:-12px;z-index:-1;background:url("kids-moonlets-sm.jpg") center/cover;filter:blur(2px) brightness(.5)}
.sb{height:100svh;min-height:500px;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:calc(84px + var(--k-safe-t)) 12px calc(14px + var(--k-safe-b))}
.top{width:min(100%,720px);display:flex;justify-content:center;padding-top:16px;flex:none}
.top .k-finn-in{margin:0}
.top .k-finn{display:block;position:relative;width:fit-content;max-width:100%}
.top .k-fm{position:absolute;left:-12px;top:-18px;z-index:2;width:62px;height:62px;cursor:pointer}
.top .k-finn .k-fb{margin:0;padding:12px 18px 12px 54px;border-radius:20px}
.defs{position:absolute;width:0;height:0;overflow:hidden}

.play{flex:1 1 0;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
/* the storybook */
.nook{position:relative;flex:1 1 0;min-height:130px;width:100%;container-type:size;display:flex;align-items:center;justify-content:center;perspective:1400px}
.book{position:relative;width:min(100cqw - 8px,(100cqh - 8px)*600/380,900px);aspect-ratio:600/380;container-type:inline-size;cursor:pointer;
  transform:rotateX(7deg);transform-origin:50% 100%;-webkit-tap-highlight-color:transparent}
.book>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.book::before{content:"";position:absolute;left:-5%;top:-7%;width:110%;height:114%;border-radius:40%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,rgba(150,200,255,.7),rgba(120,175,255,.25) 60%,rgba(120,175,255,0));transition:opacity .4s}
.book.ready::before{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.95}}
.book.ready{animation:nudge 3.2s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:rotateX(7deg)}86%{transform:rotateX(7deg) translateY(-2.5%)}92%{transform:rotateX(7deg) translateY(0)}}
.book.turn .scn{animation:turn .5s ease-out}
@keyframes turn{0%{opacity:.2}100%{opacity:1}}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.bounce{transform-box:fill-box;transform-origin:50% 100%;animation:bnc .7s ease-in-out 2}
@keyframes bnc{0%,100%{transform:translateY(0)}40%{transform:translateY(-9%) scale(1.04,.97)}60%{transform:translateY(0) scale(.98,1.02)}}
.twk{animation:twk 2.4s ease-in-out infinite}
@keyframes twk{50%{opacity:.35}}
/* the words page */
.words{position:absolute;left:53.5%;width:40%;top:11%;height:76%;display:flex;flex-direction:column;justify-content:center;gap:4.5%;pointer-events:none}
.ln{display:flex;gap:.45em;margin:0;font-size:clamp(9.5px,2.9cqw,21px);line-height:1.3;font-weight:700;color:#4a3d2a;transition:color .3s,background .3s;
  padding:.25em .4em;border-radius:.5em}
.ln i{flex:none;width:.7em;height:.7em;margin-top:.32em;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.ln span.blank{color:rgba(74,61,42,.32);letter-spacing:.3em}
.ln.on{background:rgba(120,175,255,.3);color:#16284a}
.end{font-family:var(--k-font);font-size:clamp(10px,3cqw,22px);font-weight:700;color:#1f5fb8;text-align:center;opacity:0;transition:opacity .4s;margin:0}
.end.on{opacity:1}
.made{position:absolute;right:1.5%;bottom:-1%;min-width:9%;padding:0 1.4%;height:9.5%;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:.2em;
  font-weight:800;font-size:clamp(11px,2.6cqw,20px);color:#3a2604;background:radial-gradient(circle at 35% 30%,#fff3c0,#f3c447 60%,#c8901c);
  box-shadow:0 3px 6px rgba(0,0,0,.4),0 0 10px rgba(255,210,90,.6);pointer-events:none}
.made:empty{display:none}
.spk{position:absolute;z-index:7;pointer-events:none;font-size:20px;line-height:1;color:var(--c,#ffe08a);text-shadow:0 0 8px var(--c,#ffe08a);animation:spk .9s ease-out forwards}
@keyframes spk{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% - 60px)) scale(1.2)}}

/* Finn sits on the top edge of the book */
.perch{position:absolute;z-index:3;right:3%;top:calc(var(--hw,58px)*-.78);width:var(--hw,58px);height:var(--hw,58px);pointer-events:none}
.perch svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(255,214,140,.55));transform-origin:50% 90%;animation:bob 2.6s ease-in-out infinite}
.perch.land svg{animation:land .3s ease-out}
@keyframes land{0%{transform:scale(1.14,.84)}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-6px)}}

/* the blocks */
.blocks{flex:none;display:grid;grid-template-columns:auto repeat(4,auto);gap:8px 10px;align-items:center;justify-content:center}
.blocks.telling .blk{pointer-events:none}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;color:#e8f0ff;text-shadow:0 1px 3px rgba(0,0,0,.7);text-align:right;padding-right:2px;line-height:1.1}
.tag b{display:block;width:12px;height:12px;border-radius:4px;background:var(--c);margin:0 0 4px auto;box-shadow:0 0 8px var(--c)}
.blk{--w:74px;appearance:none;border:0;padding:0;background:none;cursor:pointer;position:relative;width:var(--w);aspect-ratio:1;transition:transform .15s;
  -webkit-tap-highlight-color:transparent}
.blk svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
.blk.on{transform:translateY(-8px)}
.blk.on::after{content:"";position:absolute;left:12%;right:22%;bottom:-8px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 12px 3px var(--c)}
.blk:active{transform:translateY(-3px) scale(.95)}
.blk.hint svg{animation:bhint 1.6s ease-in-out infinite}
@keyframes bhint{0%,100%{filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}50%{filter:drop-shadow(0 0 9px rgba(255,255,255,.95)) drop-shadow(0 6px 5px rgba(0,0,0,.45))}}
.blk.dim{opacity:.72}
.blk.tok{animation:tok .3s ease-out}
@keyframes tok{0%{transform:translateY(-8px) scale(1)}35%{transform:translateY(-12px) scale(1.07,.94)}100%{transform:translateY(-8px) scale(1)}}

/* wide screens: book on the left, blocks on the right */
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .play{flex-direction:row;align-items:stretch;justify-content:center;gap:26px;max-width:1400px}
  .blocks{align-self:center;gap:12px 14px}.blk{--w:86px}.tag{font-size:14px}
}
@media (max-width:600px),(max-aspect-ratio:4/5){
  .play>.blocks{margin-bottom:2px}
}
@media (max-width:600px){
  .top .k-fm{width:56px;height:56px}.top .k-finn .k-fb{font-size:15.5px;padding:10px 14px 10px 48px;margin-top:0}
  .blk{--w:min(66px,17.5vw)}.blocks{gap:7px 8px}.tag{font-size:10.5px}
  .book{width:min(100cqw - 2px,(100cqh - 4px)*600/380)}
}
@media (max-width:380px){.tag{display:none}.blocks{grid-template-columns:repeat(4,auto)}.blk{--w:min(64px,19vw)}}
@media (min-width:601px) and (max-aspect-ratio:4/5){.blk{--w:104px}.blocks{gap:12px 18px}.tag{font-size:15px}}
@media (min-width:700px) and (min-height:700px) and (min-aspect-ratio:4/5) and (max-aspect-ratio:5/4){.blk{--w:92px}}
@media (max-height:600px){.sb{gap:6px;padding-top:calc(78px + var(--k-safe-t))}.blk{--w:56px}.blocks{gap:5px 8px}.play{gap:6px}
  .top .k-fm{width:52px;height:52px}.top .k-finn .k-fb{font-size:15px;padding:8px 12px 8px 46px;margin-top:0}}
@media (max-height:600px) and (min-aspect-ratio:5/4){.play{flex-direction:row;align-items:stretch;gap:14px}.blocks{align-self:center}}
@media (prefers-reduced-motion:reduce){.perch svg,.blk.hint svg,.book.ready,.twk{animation:none}}
</style>
</head>

<script>
(function(){
  var HI="This is the story corner! Pick a friend, a place, and a surprise. Then tap the book, and I'll tell your story!";
  var ASK=["Pick a friend for your story!","Now pick a place to go!","Now pick a surprise!"];
  var ASKC=["st-friend","st-place","st-surprise"];
  var READY="Your story is ready! Tap the book.";
  var WAIT="Pick a friend, a place, and a surprise first!";
  var AGAIN="What a story! Pick new blocks to make another one.";
  var ROWS=[
    {tag:"Who",c:"#e2574c",l:"#f39a8f",d:"#9e2c25",items:[
      {id:"bunny",name:"A bunny!",line:"Once upon a time, there was a little bunny."},
      {id:"bear",name:"A bear!",line:"Once upon a time, there was a big brown bear."},
      {id:"robot",name:"A robot!",line:"Once upon a time, there was a friendly robot."},
      {id:"turtle",name:"A turtle!",line:"Once upon a time, there was a tiny turtle."}]},
    {tag:"Where",c:"#3f86de",l:"#8cbcf4",d:"#21508f",items:[
      {id:"moon",name:"The moon!",line:"One night, our friend took a trip all the way up to the moon."},
      {id:"sea",name:"The sea!",line:"One day, our friend went sailing out on the big blue sea."},
      {id:"forest",name:"The forest!",line:"One day, our friend went for a walk in the deep green forest."},
      {id:"castle",name:"A castle!",line:"One day, our friend went to visit a tall, tall castle."}]},
    {tag:"What",c:"#efb128",l:"#ffd979",d:"#a8730c",items:[
      {id:"star",name:"A star!",line:"And there, our friend found a shining star to keep! The end!"},
      {id:"balloon",name:"A balloon!",line:"And there, our friend found a big red balloon and floated up high! The end!"},
      {id:"cake",name:"A cake!",line:"And there, everyone had a birthday party with cake! The end!"},
      {id:"rainbow",name:"A rainbow!",line:"And there, our friend saw a giant rainbow, and smiled and smiled! The end!"}]}];
  BWK.lines({"st-hi":HI});
  BWK.init({here:"moonlets", voice:"finn", intro:HI, noHello:true});
  var $=function(id){return document.getElementById(id);};

  /* ---------- Finn's face (the same drawing as the kit's speech bubble) ---------- */
  function face(id){ return '<svg class="k-fm" viewBox="0 0 100 100" aria-hidden="true"><defs>'+
    '<radialGradient id="'+id+'g" cx="30%" cy="35%" r="75%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#f6e6bd"/><stop offset="1" stop-color="#dcc188"/></radialGradient>'+
    '<mask id="'+id+'m"><rect width="100" height="100" fill="#fff"/><circle cx="71" cy="37" r="31" fill="#000"/></mask></defs>'+
    '<circle cx="48" cy="54" r="38" fill="url(#'+id+'g)" mask="url(#'+id+'m)"/>'+
    '<ellipse cx="25" cy="58" rx="3.2" ry="4.2" fill="#3b2a12"/><ellipse cx="40" cy="67" rx="3.2" ry="4.2" fill="#3b2a12"/>'+
    '<circle cx="24.2" cy="56.6" r="1.1" fill="#fff"/><circle cx="39.2" cy="65.6" r="1.1" fill="#fff"/>'+
    '<ellipse cx="20" cy="68" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/><ellipse cx="44" cy="78" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/>'+
    '<path d="M27 72 q5 7 11 3" stroke="#3b2a12" stroke-width="2.6" fill="#a5523a" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<g><path d="M68 50l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#fff3c4"/><path d="M80 40l1.1 2.7 2.7 1.1-2.7 1.1-1.1 2.7-1.1-2.7-2.7-1.1 2.7-1.1z" fill="#ffe7a0"/>'+
    '<circle cx="75" cy="58" r="1.6" fill="#fff"/><circle cx="62" cy="44" r="1.2" fill="#ffeab0"/></g></svg>'; }
  var top=$("finnHere");
  top.innerHTML='<div class="k-finn k-finn-in">'+face("sbS")+'<p class="k-fb">'+HI+'</p></div>';
  var talked=false;
  function say(t,clip,then){ talked=true; BWK.finn(t,{into:top, clip:clip, onend:then}); }
  top.addEventListener("click",function(e){ if(e.target.closest(".k-fm") && !talked) say(HI,"st-hi"); });
  document.addEventListener("click",function(e){
    if(talked || e.target.closest(".blk,.book,.k-head,.k-sheet,.k-veil")) return; say(HI,"st-hi"); });
  var perch=$("perch"); perch.innerHTML=face("sbP");
  function hopFinn(){ perch.classList.remove("land"); void perch.offsetWidth; perch.classList.add("land"); }

  /* ---------- sounds: wooden tok (block), page flip, line chime, story chord ---------- */
  var AC=null;
  function ac(){ if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
    if(AC.state==="suspended") AC.resume(); return AC; }
  function snd(){ return BWK.store.get("sound",true) ? ac() : null; }
  function tone(c,f,t,dur,vol,type,f2){ var o=c.createOscillator(), g=c.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); }
  function noise(c,t,dur,ftype,freq,q,vol,f2){ var n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1; var s=c.createBufferSource(); s.buffer=b; var fl=c.createBiquadFilter(); fl.type=ftype; fl.frequency.setValueAtTime(freq,t);
    if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur); fl.Q.value=q; var g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(t); s.stop(t+dur); }
  var TOK=[[523,392],[659,494],[784,587]];
  function tok(r,i){ var c=snd(); if(!c) return; var t=c.currentTime+.01, f=TOK[r][0]*(1+i*.06);
    noise(c,t,.05,"bandpass",1800,3,.18); tone(c,f,t,.16,.16,"triangle",f*.97); tone(c,f*2.01,t,.08,.04,"sine"); }
  function flip(){ var c=snd(); if(!c) return; var t=c.currentTime+.01; noise(c,t,.32,"bandpass",900,1.2,.14,3600); noise(c,t+.18,.12,"highpass",2600,.7,.05); }
  var CH=[523.25,659.25,783.99];
  function chime(k){ var c=snd(); if(!c) return; var t=c.currentTime+.02, f=CH[k]; tone(c,f,t,.9,.07,"sine"); tone(c,f*2,t+.03,.5,.025,"sine"); }
  function chord(){ var c=snd(); if(!c) return; var t=c.currentTime+.02;
    [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(c,f,t+i*.09,1.3,.06,"sine"); tone(c,f*2,t+i*.09,.6,.015,"triangle"); }); }

  /* ---------- pictures: each drawn in a 100×100 box ---------- */
  var ICON={
    bunny:function(){ return '<g stroke="#7d6a58" stroke-width="1.6" stroke-linejoin="round">'+
      '<ellipse cx="39" cy="20" rx="7.5" ry="19" fill="#f6f1ea" transform="rotate(-12 39 34)"/><ellipse cx="39" cy="22" rx="3.6" ry="13" fill="#f6b3bd" stroke="none" transform="rotate(-12 39 34)"/>'+
      '<ellipse cx="60" cy="20" rx="7.5" ry="19" fill="#f6f1ea" transform="rotate(14 60 34)"/><ellipse cx="60" cy="22" rx="3.6" ry="13" fill="#f6b3bd" stroke="none" transform="rotate(14 60 34)"/>'+
      '<circle cx="73" cy="80" r="7" fill="#fff"/>'+
      '<ellipse cx="50" cy="78" rx="21" ry="18" fill="#efe8df"/><ellipse cx="50" cy="82" rx="11" ry="11" fill="#fffaf4" stroke="none"/>'+
      '<ellipse cx="38" cy="95" rx="8" ry="4" fill="#efe8df"/><ellipse cx="62" cy="95" rx="8" ry="4" fill="#efe8df"/>'+
      '<circle cx="50" cy="50" r="19" fill="#f6f1ea"/></g>'+
      '<circle cx="43" cy="48" r="2.6" fill="#2b2118"/><circle cx="57" cy="48" r="2.6" fill="#2b2118"/><circle cx="42.2" cy="47.1" r=".9" fill="#fff"/><circle cx="56.2" cy="47.1" r=".9" fill="#fff"/>'+
      '<path d="M47.5 54.5h5l-2.5 3z" fill="#e8798b"/><path d="M50 57.5q-2 3-5 2M50 57.5q2 3 5 2" stroke="#7d6a58" stroke-width="1.3" fill="none" stroke-linecap="round"/>'+
      '<ellipse cx="39" cy="57" rx="3.4" ry="2" fill="#f6b3bd" opacity=".7"/><ellipse cx="61" cy="57" rx="3.4" ry="2" fill="#f6b3bd" opacity=".7"/>'+
      '<path d="M36 55l-9-1M36 58l-9 2M64 55l9-1M64 58l9 2" stroke="#a6978a" stroke-width=".9" stroke-linecap="round"/>'; },
    bear:function(){ return '<g stroke="#5a3519" stroke-width="1.6" stroke-linejoin="round">'+

    drawBook(["w","p","s"][r]); if(r===1){ book.classList.remove("turn"); void book.offsetWidth; book.classList.add("turn"); }
    drawWords(-1); marks(); hopFinn();
    var nxt=save.pick.indexOf(-1);
    say(it.name,"st-"+it.id,function(){ if(busy) return;
      if(nxt>=0) say(ASK[nxt],ASKC[nxt]); else say(READY,"st-ready"); }); });

  /* ---------- telling the story: three recorded lines in a row ---------- */
  function tell(){ if(busy) return;
    if(!full()){ BWK.sfx("tap"); say(WAIT,"st-wait"); return; }
    busy=true; told=true; blocksEl.classList.add("telling"); marks(); flip();
    var ids=save.pick.map(function(k,r){ return ROWS[r].items[k].id; });
    clearTimeout(failT); failT=setTimeout(finish,30000);
    function part(r){ if(!busy) return;
      drawWords(r); chime(r); hopFinn();
      if(r===0){ var h=$("sbHero"); if(h){ h.classList.remove("bounce"); void h.getBoundingClientRect(); h.classList.add("bounce"); } }
      if(r===2){ var it=$("sbItem"); if(it){ it.classList.remove("pop"); void it.getBoundingClientRect(); it.classList.add("pop"); } sparkle(30,28,"#ffe08a",3); }
      say(ROWS[r].items[save.pick[r]].line,"st-"+(r+1)+"-"+ids[r],function(){ if(r<2) setTimeout(function(){ part(r+1); },250); else finish(); }); }
    setTimeout(function(){ part(0); },450); }
  function finish(){ if(!busy) return; clearTimeout(failT); busy=false; blocksEl.classList.remove("telling");
    var key=save.pick.join("-"), isNew=!save.made[key]; save.made[key]=1; save.told++; persist();
    drawWords(3); marks(); chord();
    for(var k=0;k<8;k++) (function(k){ setTimeout(function(){ sparkle(8+k*11,14+(k%3)*20,k%2?"#ffe08a":"#9cc4ff",2); },k*90); })(k);
    setTimeout(function(){ if(!busy) say(AGAIN,"st-again"); },900); }
  book.addEventListener("click",tell);
  book.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); tell(); } });

  /* ---------- start ---------- */
  ["st-1-","st-2-","st-3-"].forEach(function(p,r){ ROWS[r].items.forEach(function(it){ BWK.preload&&BWK.preload(p+it.id); }); });
  drawBook(""); drawWords(-1); marks();
  function size(){ var w=book.getBoundingClientRect().width; perch.style.setProperty("--hw",Math.round(Math.max(44,Math.min(74,w*.09)))+"px"); }
  requestAnimationFrame(size); window.addEventListener("resize",size);
  window.SBO={pick:function(r,i){ btn[r][i].click(); }, tell:tell, finish:finish,
    reset:function(){ save={told:0,made:{},pick:[-1,-1,-1]}; persist(); told=false; drawBook(""); drawWords(-1); marks(); },
    state:function(){ return {pick:save.pick.join(","), told:save.told, made:nMade(), busy:busy}; }};
})();
</script>
