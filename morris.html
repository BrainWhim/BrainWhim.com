<style>
/* ===== Nine Men's Morris: a real board, drawn in the browser and seen from straight above (like chess) =====
   The board, inlaid lines, brass points, stone trays and stones are flat panels placed in 3D space; their
   materials (walnut, marble, slate) are painted in code when the page opens, so there are no picture files.
   Boards (the Boards card): Cloister Walnut is free; Carved Marble and Slate & Gold are for Club members.
   Your stones wait in the tray at your end of the board; The House's (or your opponent's) in the far tray.
   Stones you capture are set in your own tray. */
.mo-pad{width:100%;flex:none;display:flex;justify-content:center}
.mo-fit{position:relative;flex:none;overflow:hidden}
.mo-scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.mo-scene{position:relative;width:648px;height:828px;perspective:3000px;perspective-origin:50% 50%}
.mo-board{position:absolute;left:4px;top:4px;width:640px;height:820px;transform-style:preserve-3d;transform:none}   /* flat, seen from straight above, like the chess board */
.mo-board *{transform-style:preserve-3d}
.mo-p{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mo-tsh{left:-4px;top:-2px;width:648px;height:826px;transform:translateZ(-2px);border-radius:12px;background:rgba(0,0,0,.55);filter:blur(10px)}
/* the top is split in quarters and the front wall in halves: Chrome drops large tilted panels otherwise */
.mo-top{width:320px;height:410px;background-image:var(--mo-top);background-size:640px 820px;background-color:var(--mo-topc,#5a3a22)}
.mo-top.q1{left:0;top:0;background-position:0 0}.mo-top.q2{left:320px;top:0;background-position:-320px 0}
.mo-top.q3{left:0;top:410px;background-position:0 -410px}.mo-top.q4{left:320px;top:410px;background-position:-320px -410px}
.mo-sheen{left:0;top:0;width:640px;height:820px;transform:translateZ(.4px);pointer-events:none;border-radius:2px;
  background:radial-gradient(ellipse 80% 70% at 30% 20%,rgba(255,245,220,.16),rgba(0,0,0,0) 60%),linear-gradient(to bottom,rgba(0,0,0,0) 60%,rgba(0,0,0,.12));
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 0 0 14px var(--mo-rim),inset 0 0 0 16px var(--mo-rim2),inset 0 0 40px rgba(0,0,0,.35)}
.mo-field{left:0;top:90px;width:640px;height:640px;transform:translateZ(.6px);pointer-events:none;box-shadow:inset 0 0 0 30px rgba(0,0,0,0),inset 0 0 0 31px var(--mo-rim2);border-radius:2px}
.mo-tray{left:28px;width:584px;height:64px;border-radius:32px;transform:translateZ(.6px);pointer-events:none;background:var(--mo-tray);
  box-shadow:inset 0 6px 10px rgba(0,0,0,.55),inset 0 -2px 3px rgba(255,255,255,.12),0 1px 0 rgba(255,255,255,.18)}
.mo-tray.back{top:13px}.mo-tray.front{top:743px}
.mo-wall{background-image:var(--mo-top);background-size:640px 820px;background-color:var(--mo-topc,#5a3a22)}
.mo-wall::after{content:"";position:absolute;inset:0}
.mo-wall.f{top:820px;width:320px;height:34px;transform-origin:top;transform:rotateX(-90deg)}
.mo-wall.f1{left:0}.mo-wall.f2{left:320px;background-position:-320px 0}
.mo-wall.f::after{background:linear-gradient(to bottom,rgba(255,240,210,.1),rgba(0,0,0,.45))}
.mo-wall.l{left:-34px;top:0;width:34px;height:820px;transform-origin:right;transform:rotateY(-90deg)}
.mo-wall.l::after{background:rgba(255,240,210,.05)}
.mo-wall.r{left:640px;top:0;width:34px;height:820px;transform-origin:left;transform:rotateY(90deg)}
.mo-wall.r::after{background:rgba(0,0,0,.5)}
.mo-ln{transform:translateZ(.8px)}
.mo-pt{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;transform:translateZ(1.2px);background:var(--mo-pt);box-shadow:var(--mo-ptsh)}
.mo-pt.ok::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.95) 0 22%,rgba(255,206,110,.4) 45%,rgba(255,206,110,0) 70%);animation:mo-pulse 1.8s ease-in-out infinite}
@keyframes mo-pulse{50%{opacity:.5;transform:scale(.85)}}
.mo-pt.hint::before{content:"";position:absolute;inset:-14px;border-radius:50%;box-shadow:0 0 0 5px #f2c75a,0 0 22px 6px rgba(250,205,95,.75);animation:mo-hint 1.3s ease-in-out infinite}
@keyframes mo-hint{50%{box-shadow:0 0 0 5px rgba(242,199,90,.55),0 0 10px 2px rgba(250,205,95,.35)}}
.mo-hit{width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;transform:translateZ(30px);cursor:default;-webkit-tap-highlight-color:transparent}
.mo-hit.tap{cursor:pointer}
.mo-mg{transform:translateZ(1px);border-radius:8px;background:rgba(255,214,120,.5);box-shadow:0 0 18px 6px rgba(255,206,110,.5);opacity:0;transition:opacity .4s;pointer-events:none}
.mo-mg.on{opacity:1}
/* stones: a stack of discs makes the side; the top face carries the finish */
.mo-pc{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;pointer-events:none}
.mo-pc .s{position:absolute;inset:0;border-radius:50%;background:var(--sd)}
.mo-pc .t{position:absolute;inset:0;border-radius:50%;background:var(--fc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 -6px 10px rgba(0,0,0,.25),inset 0 5px 8px rgba(255,255,255,.35);transition:box-shadow .3s}
.mo-pc .t::after{content:"";position:absolute;inset:11px;border-radius:50%;box-shadow:inset 0 2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.35)}
.mo-pc .sh{position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.6),rgba(0,0,0,0) 68%);filter:blur(2px);margin:5px -3px -5px 3px}   /* seen from above, the shadow falls a little down and right */
.mo-pc.a{--fc:var(--mo-aface);--sd:var(--mo-aside)}
.mo-pc.b{--fc:var(--mo-bface);--sd:var(--mo-bside)}
.mo-pc.mill .t{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 3px #f1cf7a,0 0 18px 4px rgba(255,210,110,.55)}
.mo-pc.can .t{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 2px rgba(241,207,122,.85),0 0 10px 2px rgba(255,210,110,.35)}
.mo-pc.sel .t{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 4px #f6d88a,0 0 22px 6px rgba(255,210,110,.7)}
.mo-pc.take .t{animation:mo-take 1.1s ease-in-out infinite}
@keyframes mo-take{0%,100%{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 3px rgba(255,120,90,.95),0 0 18px 5px rgba(255,110,80,.55)}50%{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 3px rgba(255,170,120,.6),0 0 8px 2px rgba(255,110,80,.3)}}
body.mo-quick .mo-pt.ok::after,body.mo-quick .mo-pc.take .t{animation:none}
@media (min-width:1000px){ body.pk .pk-stage{justify-content:center} }
.mo-pad{flex-direction:column;align-items:center;gap:10px}
/* phones: one slim score line above the board instead of the two score strips, so the board can be bigger */
.mo-score{display:none;width:var(--pk-size,100%);max-width:100%;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;font-size:13px;color:#fff;
  background:rgba(255,250,242,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3)}
.mo-score b{font-weight:700;margin-right:4px}.mo-score .mid{font-size:11px;opacity:.8}
.mo-score i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
body.mo-slim .mo-score{display:flex}
body.mo-slim.pk .pk-mini{display:none}
</style>

<script>
/* =====================================================================
   Painted materials
   ===================================================================== */
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}
function noise2(seed){var r=rng(seed),P=new Uint16Array(512),G=new Float32Array(256),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=Math.floor(r()*(i+1));t=p[i];p[i]=p[j];p[j]=t;}for(i=0;i<512;i++)P[i]=p[i&255];for(i=0;i<256;i++)G[i]=r();function f(x){return x*x*(3-2*x);}return function(x,y){var xi=Math.floor(x),yi=Math.floor(y),u=f(x-xi),v=f(y-yi),X=xi&255,Y=yi&255;var a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(n,x,y,o){var s=0,a=.5,t=0;for(var i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function mix(a,b,t){return a+(b-a)*t;}
function paintTex(w,h,fn){var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d"),im=g.createImageData(w,h),D=im.data;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var col=fn(x,y),i=(y*w+x)*4;D[i]=col[0];D[i+1]=col[1];D[i+2]=col[2];D[i+3]=255;}g.putImageData(im,0,0);return 'url('+c.toDataURL("image/jpeg",.9)+')';}
function woodFn(o){var n=noise2(o.seed),n2=noise2(o.seed+77),r=rng(o.seed+5);return function(x,y){var warp=fbm(n,x/o.wx,y/o.wy,4),v=y*o.freq+warp*o.turb;v-=Math.floor(v);var ring=Math.pow(Math.abs(Math.sin(v*Math.PI)),o.sharp),st=fbm(n2,x/180,y/1.6,3);var t=Math.min(1,Math.max(0,(1-ring)*o.ringAmt+st*o.streakAmt));var k=r()<o.pores?.8:1,l=1+(fbm(n2,x/400,y/90,2)-.5)*o.blotch;return [mix(o.light[0],o.dark[0],t)*k*l,mix(o.light[1],o.dark[1],t)*k*l,mix(o.light[2],o.dark[2],t)*k*l];};}
function marbleFn(o){var n=noise2(o.seed),n2=noise2(o.seed+9);return function(x,y){var w=fbm(n,x/150,y/150,5);var v=Math.abs(Math.sin((x*.004+y*.007)*o.freq+w*o.turb));v=Math.pow(1-v,o.sharp);var fine=fbm(n2,x/14,y/14,3),cloud=fbm(n2,x/260,y/260,3);var b=mix(o.base[0],o.cloud[0],cloud*.6),g=mix(o.base[1],o.cloud[1],cloud*.6),bb=mix(o.base[2],o.cloud[2],cloud*.6);return [mix(b,o.vein[0],v*o.amt)*(.97+fine*.06),mix(g,o.vein[1],v*o.amt)*(.97+fine*.06),mix(bb,o.vein[2],v*o.amt)*(.97+fine*.06)];};}
function slateFn(o){var n=noise2(o.seed),n2=noise2(o.seed+4),r=rng(o.seed);return function(x,y){var layer=fbm(n,x/300,y/22,4),fine=fbm(n2,x/6,y/6,2),k=.82+layer*.3+fine*.1+(r()<.02?.08:0);return [o.base[0]*k,o.base[1]*k,o.base[2]*k];};}
var MAPLE={light:[232,204,156],dark:[196,160,108],freq:.05,turb:4,wx:300,wy:40,sharp:.6,ringAmt:.35,streakAmt:.45,pores:0,blotch:.12};
var DESIGNS={
  walnut:{top:function(){return paintTex(640,820,woodFn({light:[112,70,40],dark:[52,30,16],freq:.035,turb:9,wx:240,wy:24,sharp:.7,ringAmt:.66,streakAmt:.42,pores:.02,blotch:.3,seed:23}));},
    topc:"#5a3a22",rim:"rgba(30,16,8,.28)",rim2:"rgba(210,170,110,.35)",tray:"radial-gradient(ellipse at 50% 40%,#23402c,#11251a)",
    lineH:function(){return paintTex(640,64,woodFn(Object.assign({seed:7},MAPLE)));},lineV:function(){var f=woodFn(Object.assign({seed:8},MAPLE));return paintTex(64,640,function(x,y){return f(y,x);});},
    lineSh:"0 0 0 1px rgba(30,15,5,.6),inset 0 1px 0 rgba(255,255,255,.25)",
    pt:"radial-gradient(circle at 38% 32%,#fff1c2,#d9b25a 40%,#8a6522 75%,#5a3f12)",ptsh:"0 0 0 2px rgba(30,15,5,.55),0 1px 2px rgba(0,0,0,.5)",
    a:["radial-gradient(circle at 36% 30%,#7fa3ff,#2a4fd0 45%,#16297a)","#122063","#2a4fd0"],b:["radial-gradient(circle at 36% 30%,#fffdf4,#efe4c8 50%,#cbb88f)","#b7a47c","#efe4c8"],names:["Cobalt","Ivory"]},
  marble:{top:function(){return paintTex(640,820,marbleFn({base:[240,238,234],cloud:[218,216,212],vein:[150,148,150],freq:3.2,turb:6,sharp:3.2,amt:.42,seed:31}));},
    topc:"#e8e6e2",rim:"rgba(120,120,125,.12)",rim2:"rgba(150,150,155,.35)",tray:"radial-gradient(ellipse at 50% 40%,#cfccc6,#a9a59e)",
    lineH:function(){return "linear-gradient(to bottom,#7d7a74,#a8a49c 40%,#d8d4cc)";},lineV:function(){return "linear-gradient(to right,#7d7a74,#a8a49c 40%,#d8d4cc)";},
    lineSh:"inset 0 2px 2px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.8)",
    pt:"radial-gradient(circle at 50% 50%,#8f8b84 0 35%,#c9c5bd 36% 52%,rgba(0,0,0,0) 54%)",ptsh:"inset 0 2px 3px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.7)",
    a:["radial-gradient(circle at 36% 30%,#7fa0e8,#25469e 45%,#0f2152)","#0d1c48","#25469e"],b:["radial-gradient(circle at 36% 30%,#ffffff,#f1ede4 50%,#cfc8b8)","#bdb5a3","#f1ede4"],names:["Lapis","Alabaster"]},
  slate:{top:function(){return paintTex(640,820,slateFn({base:[58,62,68],seed:17}));},
    topc:"#3a3e44",rim:"rgba(0,0,0,.25)",rim2:"rgba(214,178,92,.55)",tray:"radial-gradient(ellipse at 50% 40%,#2a2d32,#15171a)",
    lineH:function(){return "linear-gradient(to bottom,#fff0b8,#e2bd62 35%,#9c7326 70%,#f3d68b)";},lineV:function(){return "linear-gradient(to right,#fff0b8,#e2bd62 35%,#9c7326 70%,#f3d68b)";},
    lineSh:"0 1px 2px rgba(0,0,0,.6)",
    pt:"radial-gradient(circle at 38% 32%,#fff3c8,#e2bd62 40%,#8f6a22 80%)",ptsh:"0 1px 3px rgba(0,0,0,.6)",
    a:["radial-gradient(circle at 36% 30%,#6a6a72,#24242a 45%,#09090b)","#050506","#24242a"],b:["radial-gradient(circle at 36% 30%,#fffdf4,#efe4c8 50%,#cbb88f)","#b7a47c","#efe4c8"],names:["Jet","Ivory"]}
};

/* =====================================================================
   Board geometry and drawing
   ===================================================================== */
var XY=[[0,0],[3,0],[6,0],[1,1],[3,1],[5,1],[2,2],[3,2],[4,2],[0,3],[1,3],[2,3],[4,3],[5,3],[6,3],[2,4],[3,4],[4,4],[1,5],[3,5],[5,5],[0,6],[3,6],[6,6]];
var NB=[[1,9],[0,2,4],[1,14],[4,10],[1,3,5,7],[4,13],[7,11],[4,6,8,16],[7,12],[0,10,21],[3,9,11,18],[6,10,15],[8,13,17],[5,12,14,20],[2,13,23],[11,16],[7,15,17,19],[12,16],[10,19],[16,18,20,22],[13,19],[9,22],[19,21,23],[14,22]];
var MILLS=[[0,1,2],[3,4,5],[6,7,8],[15,16,17],[18,19,20],[21,22,23],[0,9,21],[3,10,18],[6,11,15],[8,12,17],[5,13,20],[2,14,23],[9,10,11],[12,13,14],[1,4,7],[16,19,22]];
var MOF=[]; for(var _i=0;_i<24;_i++) MOF[_i]=MILLS.filter(function(m){ return m.indexOf(_i)>=0; });
var OY=90, M=86, S=(640-2*M)/6, LW=8;
function ptXY(i){ return [M+XY[i][0]*S, OY+M+XY[i][1]*S]; }

var stage=document.createElement("div"); stage.className="mo-pad";
var scoreEl=document.createElement("div"); scoreEl.className="mo-score";
(function(){
  var h='<div class="mo-fit" id="moFit"><div class="mo-scaler" id="moScaler"><div class="mo-scene"><div class="mo-board" id="moBoard">';
  h+='<div class="mo-p mo-tsh"></div><div class="mo-p mo-wall f f1"></div><div class="mo-p mo-wall f f2"></div><div class="mo-p mo-wall l"></div><div class="mo-p mo-wall r"></div>';
  h+='<div class="mo-p mo-top q1"></div><div class="mo-p mo-top q2"></div><div class="mo-p mo-top q3"></div><div class="mo-p mo-top q4"></div><div class="mo-p mo-sheen"></div>';
  h+='<div class="mo-p mo-tray back"></div><div class="mo-p mo-tray front"></div>';
  function seg(x1,y1,x2,y2){ var x=Math.min(x1,x2)-LW/2,y=Math.min(y1,y2)-LW/2,w=Math.abs(x2-x1)+LW,hh=Math.abs(y2-y1)+LW;
    return '<div class="mo-p mo-ln" data-o="'+(w>hh?"h":"v")+'" style="left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+hh+'px"></div>'; }
  for(var k=0;k<3;k++){ var a=M+k*S,b=M+(6-k)*S; h+=seg(a,OY+a,b,OY+a)+seg(a,OY+b,b,OY+b)+seg(a,OY+a,a,OY+b)+seg(b,OY+a,b,OY+b); }
  h+=seg(M+3*S,OY+M,M+3*S,OY+M+2*S)+seg(M+3*S,OY+M+4*S,M+3*S,OY+M+6*S)+seg(M,OY+M+3*S,M+2*S,OY+M+3*S)+seg(M+4*S,OY+M+3*S,M+6*S,OY+M+3*S);
  MILLS.forEach(function(m,k){ var a=ptXY(m[0]),c=ptXY(m[2]); h+='<div class="mo-p mo-mg" id="moMg'+k+'" style="left:'+(Math.min(a[0],c[0])-18)+'px;top:'+(Math.min(a[1],c[1])-18)+'px;width:'+(Math.abs(c[0]-a[0])+36)+'px;height:'+(Math.abs(c[1]-a[1])+36)+'px"></div>'; });
  for(var i=0;i<24;i++){ var q=ptXY(i); h+='<div class="mo-p mo-pt" id="moPt'+i+'" style="left:'+q[0]+'px;top:'+q[1]+'px"></div>'; }
  h+='<div id="moPcs" style="position:absolute;left:0;top:0"></div>';
  for(i=0;i<24;i++){ var q2=ptXY(i); h+='<div class="mo-p mo-hit" data-i="'+i+'" role="button" aria-label="Point '+(i+1)+'" style="left:'+q2[0]+'px;top:'+q2[1]+'px"></div>'; }
  h+='</div></div></div></div>';
  stage.innerHTML=h;
})();
stage.insertBefore(scoreEl,stage.firstChild);
var boardEl=stage.querySelector("#moBoard"), pcsEl=stage.querySelector("#moPcs");
stage.querySelector("#moBoard").addEventListener("click",function(e){ var t=e.target.closest(".mo-hit"); if(t) tapPoint(+t.dataset.i); });

var texCache={}, curDesign=null;
function applyDesign(k){
  if(!DESIGNS[k]) k="walnut"; if(k===curDesign) return; curDesign=k;
  var d=DESIGNS[k]; if(!texCache[k]) texCache[k]={top:d.top(),h:d.lineH(),v:d.lineV()};
  var t=texCache[k], s=boardEl.style, b=document.body.style;
  s.setProperty("--mo-top",t.top); s.setProperty("--mo-topc",d.topc); s.setProperty("--mo-rim",d.rim); s.setProperty("--mo-rim2",d.rim2); s.setProperty("--mo-tray",d.tray);
  s.setProperty("--mo-pt",d.pt); s.setProperty("--mo-ptsh",d.ptsh);
  b.setProperty("--mo-aface",d.a[0]); b.setProperty("--mo-aside",d.a[1]); b.setProperty("--mo-a",d.a[2]);
  b.setProperty("--mo-bface",d.b[0]); b.setProperty("--mo-bside",d.b[1]); b.setProperty("--mo-b",d.b[2]);
  var grad=t.h.indexOf("gradient")>=0;
  boardEl.querySelectorAll(".mo-ln").forEach(function(l){ var v=l.dataset.o==="v"; l.style.boxShadow=d.lineSh;
    l.style.backgroundImage=v?t.v:t.h;
    if(grad) l.style.backgroundSize="100% 100%";
    else { l.style.backgroundSize=v?"64px 640px":"640px 64px"; l.style.backgroundPosition=v?(-(parseFloat(l.style.left)%64))+"px "+(-(parseFloat(l.style.top)-OY))+"px":(-parseFloat(l.style.left))+"px "+(-(parseFloat(l.style.top)%64))+"px"; } });
}

/* =====================================================================
   Rules engine (also used by The House to think ahead)
   State: c = 24 points (0 empty, 1 or 2), h = stones still in hand [_, side1, side2], turn, quiet = moves since a capture
   ===================================================================== */
function cnt(c,s){ var n=0; for(var i=0;i<24;i++) if(c[i]===s) n++; return n; }
function millAt(c,i,s){ var L=MOF[i]; for(var k=0;k<L.length;k++){ var m=L[k]; if(c[m[0]]===s&&c[m[1]]===s&&c[m[2]]===s) return true; } return false; }
function takeable(c,o){ var free=[],all=[]; for(var i=0;i<24;i++) if(c[i]===o){ all.push(i); if(!millAt(c,i,o)) free.push(i); } return free.length?free:all; }
function canFly(st,s){ return st.h[s]===0 && cnt(st.c,s)===3; }
function steps(st,s){
  var out=[], c=st.c, i;
  if(st.h[s]>0){ for(i=0;i<24;i++) if(!c[i]) out.push({from:-1,to:i}); return out; }
  var fly=canFly(st,s);
  for(i=0;i<24;i++) if(c[i]===s){
    if(fly){ for(var j=0;j<24;j++) if(!c[j]) out.push({from:i,to:j}); }
    else NB[i].forEach(function(j){ if(!c[j]) out.push({from:i,to:j}); });
  }
  return out;
}
function fullMoves(st){
  var s=st.turn, o=3-s, out=[];
  steps(st,s).forEach(function(m){
    var c=st.c.slice(); if(m.from>=0) c[m.from]=0; c[m.to]=s;
    if(millAt(c,m.to,s)){ var tk=takeable(c,o); if(tk.length){ tk.forEach(function(t){ out.push({from:m.from,to:m.to,take:t}); }); return; } }
    out.push({from:m.from,to:m.to,take:-1});
  });
  return out;
}
function result(st){
  for(var s=1;s<=2;s++) if(cnt(st.c,s)+st.h[s]<3) return {over:true,winner:3-s};
  if(st.h[st.turn]===0 && !steps(st,st.turn).length) return {over:true,winner:3-st.turn};
  if(st.quiet>=100) return {over:true,winner:0};
  return {over:false,winner:0};
}
function applyMove(st,m){
  var s=st.turn, c=st.c.slice(), h=st.h.slice();
  if(m.from>=0) c[m.from]=0; else h[s]--;
  c[m.to]=s; if(m.take>=0) c[m.take]=0;
  var quiet=m.take>=0?0:(h[1]===0&&h[2]===0?st.quiet+1:0);
  return {c:c,h:h,turn:3-s,quiet:quiet};
}
/* how good a position looks for side p */
function evaluate(st,p){
  var o=3-p, c=st.c, v=((cnt(c,p)+st.h[p])-(cnt(c,o)+st.h[o]))*120;
  for(var k=0;k<MILLS.length;k++){ var m=MILLS[k], a=0, b=0, e=0;
    for(var q=0;q<3;q++){ var x=c[m[q]]; if(x===p) a++; else if(x===o) b++; else e++; }
    if(a===3) v+=16; else if(b===3) v-=16;
    if(a===2&&e===1) v+=11; else if(b===2&&e===1) v-=13; }
  if(st.h[1]===0&&st.h[2]===0){ v+=(steps({c:c,h:st.h,turn:p},p).length-steps({c:c,h:st.h,turn:o},o).length)*3; }
  return v;
}
var deadline=0, aborted=false;
function negamax(st,depth,alpha,beta){
  if(Date.now()>deadline){ aborted=true; return 0; }
  var r=result(st);
  if(r.over) return r.winner===0?0:(r.winner===st.turn?100000+depth:-100000-depth);
  if(depth===0) return evaluate(st,st.turn);
  var ms=fullMoves(st); ms.sort(function(x,y){ return (y.take>=0)-(x.take>=0); });
  var best=-1e9;
  for(var i=0;i<ms.length;i++){
    var v=-negamax(applyMove(st,ms[i]),depth-1,-beta,-alpha); if(aborted) return 0;
    if(v>best) best=v; if(v>alpha) alpha=v; if(alpha>=beta) break;
  }
  return best;
}
function think(st,maxDepth){
  var ms=fullMoves(st); if(!ms.length) return null;
  ms.sort(function(){ return Math.random()-.5; }); ms.sort(function(x,y){ return (y.take>=0)-(x.take>=0); });
  var best=ms[0]; deadline=Date.now()+700; aborted=false;
  for(var d=1;d<=maxDepth;d++){
    var bestD=null, bv=-1e9, alpha=-1e9;
    for(var i=0;i<ms.length;i++){ var v=-negamax(applyMove(st,ms[i]),d-1,-1e9,-alpha); if(aborted) break; if(v>bv){ bv=v; bestD=ms[i]; } if(v>alpha) alpha=v; }
    if(aborted) break; best=bestD;
    var k=ms.indexOf(bestD); ms.splice(k,1); ms.unshift(bestD);   /* search the best line first next time */
  }
  return best;
}

/* =====================================================================
   Stones on screen
   ===================================================================== */
var els=[], handEls={1:[],2:[]}, capEls={1:[],2:[]};
function nearSide(){ return mySide===2?2:1; }               /* whose tray is at the near (front) end */
function trayY(side){ return side===nearSide()?775:45; }
function handXY(side,k){ return [58+k*54, trayY(side)]; }
function capXY(side,j){ return [582-j*26, trayY(side)]; }
function mkStone(side,xy){
  var e=document.createElement("div"); e.className="mo-pc "+(side===1?"a":"b");
  var h='<div class="sh" style="transform:translateZ(.6px)"></div>';
  for(var k=0;k<7;k++) h+='<div class="s" style="transform:translateZ('+(2+k*1.6)+'px);filter:brightness('+(.75+k*.04)+')"></div>';
  e.innerHTML=h+'<div class="t" style="transform:translateZ(13.5px)"></div>';
  setAt(e,xy[0],xy[1],0); pcsEl.appendChild(e); return e;
}
function setAt(e,x,y,z){ e._x=x; e._y=y; e.style.transform="translate3d("+x+"px,"+y+"px,"+(z||0)+"px)"; }
function glide(e,to,lift,dur){
  return new Promise(function(res){
    if(!Parlor.smooth()){ setAt(e,to[0],to[1],0); res(); return; }
    var x0=e._x,y0=e._y,t0=performance.now(), d=Math.hypot(to[0]-x0,to[1]-y0); dur=dur||Math.min(820,380+d*.6); lift=lift!=null?lift:Math.min(120,40+d*.2);
    (function step(now){ var p=Math.min(1,(now-t0)/dur), e2=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      setAt(e,x0+(to[0]-x0)*e2,y0+(to[1]-y0)*e2,Math.sin(Math.PI*p)*lift);
      if(p<1) requestAnimationFrame(step); else res(); })(t0);
  });
}
/* rebuild every stone from the state, without animation */
function syncStones(){
  pcsEl.innerHTML=""; els=[]; handEls={1:[],2:[]}; capEls={1:[],2:[]};
  for(var i=0;i<24;i++) els[i]=st.c[i]?mkStone(st.c[i],ptXY(i)):null;
  [1,2].forEach(function(s){ for(var k=0;k<st.h[s];k++) handEls[s].push(mkStone(s,handXY(s,k)));
    var o=3-s, n=9-st.h[o]-cnt(st.c,o); for(var j=0;j<n;j++) capEls[s].push(mkStone(o,capXY(s,j))); });
}
async function showPlace(s,to){ var e=handEls[s].pop()||mkStone(s,handXY(s,0)); Parlor.sfx("whoosh"); await glide(e,ptXY(to)); els[to]=e; Parlor.sfx("place"); }
/* a slide along a line stays low; a flying stone (three left) arcs high */
async function showSlide(from,to){ var e=els[from]; if(!e) return; var hop=NB[from].indexOf(to)<0; els[from]=null; Parlor.sfx("whoosh"); await glide(e,ptXY(to),hop?null:26); els[to]=e; Parlor.sfx("place"); }
async function showTake(s,t){ var e=els[t]; if(!e) return; els[t]=null; await Parlor.wait(250); Parlor.sfx("whoosh"); await glide(e,capXY(s,capEls[s].length),110,760); capEls[s].push(e); Parlor.sfx("click",{pitch:.75}); }

/* =====================================================================
   The game
   ===================================================================== */
var st, sel=-1, removing=false, over=false, winner=0, busy=false;
var mySide=1, online=false, sb=null, room=null, me=null, reported=false, seq=0, CODE=(location.search.match(/[?&]code=([A-Za-z0-9]+)/)||[])[1];
function fresh(){ return {c:Array(24).fill(0),h:[0,9,9],turn:1,quiet:0}; }
function seatedNow(){ return document.body.classList.contains("seated"); }
function myTurn(){ return !over && !busy && seatedNow() && mySide && st.turn===mySide && (!online||(room&&room.guest)); }
function opp(){ return 3-mySide; }
function nameOf(s){ return s===mySide?"You":online?"Your opponent":"The House"; }
function designNames(){ return DESIGNS[curDesign||"walnut"].names; }

function paint(){
  document.body.classList.toggle("mo-quick",!Parlor.smooth());
  var mine=myTurn(), s=mySide, placing=mine&&!removing&&st.h[s]>0, moving=mine&&!removing&&st.h[s]===0;
  if(Parlor.lessonOn&&!Parlor.lessonWaiting){ placing=false; moving=false; }
  var dests=[]; if(moving&&sel>=0) dests=steps(st,s).filter(function(m){ return m.from===sel; }).map(function(m){ return m.to; });
  var movable=[]; if(moving) steps(st,s).forEach(function(m){ if(movable.indexOf(m.from)<0) movable.push(m.from); });
  if(Parlor.lessonOn&&lessonAllow){ movable=movable.filter(function(i){ return i===lessonAllow.from; }); dests=dests.filter(function(i){ return i===lessonAllow.to; }); }
  var tk=mine&&removing?takeable(st.c,opp()):[];
  var lit=[]; MILLS.forEach(function(m,k){ var on=st.c[m[0]]&&st.c[m[0]]===st.c[m[1]]&&st.c[m[1]]===st.c[m[2]]; document.getElementById("moMg"+k).classList.toggle("on",!!on); if(on) lit=lit.concat(m); });
  for(var i=0;i<24;i++){
    var ok=(placing&&!st.c[i]&&!(Parlor.lessonOn&&lessonAllow&&lessonAllow.to!==i))||dests.indexOf(i)>=0;
    document.getElementById("moPt"+i).classList.toggle("hint",i===hintAt);
    document.getElementById("moPt"+i).classList.toggle("ok",ok);
    var e=els[i]; if(e){ e.classList.toggle("mill",lit.indexOf(i)>=0&&tk.indexOf(i)<0); e.classList.toggle("can",moving&&movable.indexOf(i)>=0&&i!==sel); e.classList.toggle("sel",i===sel); e.classList.toggle("take",tk.indexOf(i)>=0); }
    boardEl.querySelector('.mo-hit[data-i="'+i+'"]').classList.toggle("tap",ok||tk.indexOf(i)>=0||(moving&&movable.indexOf(i)>=0));
  }
  Parlor.score([cnt(st.c,1)+st.h[1],cnt(st.c,2)+st.h[2]]);
  var me1=mySide===2?2:1, n1=cnt(st.c,me1)+st.h[me1], n2=cnt(st.c,3-me1)+st.h[3-me1];
  scoreEl.innerHTML='<span>'+Parlor.chip("me","var(--mo-"+(me1===1?"a":"b")+")")+'<b>You</b> '+n1+'</span><span class="mid">stones</span><span>'+Parlor.chip("opp","var(--mo-"+(me1===1?"b":"a")+")")+'<b>'+Parlor.oppName()+'</b> '+n2+'</span>'; Parlor.paintChips(); Parlor.turn(over?-1:st.turn===1?0:1);
}
function say(a,b){ Parlor.status(a,b||""); }
function msg(){
  if(over) return;
  if(online&&room&&!room.guest){ say("Waiting for a player","Share your table code: "+(CODE||"")); return; }
  if(!mySide){ say(nameOf(st.turn)+" to play",""); return; }
  if(st.turn!==mySide){ say(online?"Your opponent's turn":"The House is thinking…",""); return; }
  var s=mySide;
  if(removing) say("Mill!","Take one of "+(online?"your opponent's":"The House's")+" glowing stones");
  else if(st.h[s]>0) say("Your turn","Place a stone on a glowing point · "+st.h[s]+" left to place");
  else if(canFly(st,s)) say("Your turn","Three stones left: yours can fly to any open point");
  else say("Your turn",sel>=0?"Tap a glowing point to slide there":"Tap one of your stones, then where it goes");
}

/* ---------- your moves ---------- */
async function tapPoint(i){
  if(!myTurn()) return;
  if(Parlor.lessonOn&&!Parlor.lessonWaiting) return;
  var s=mySide;
  if(Parlor.lessonOn&&lessonAllow&&!removing){ if(st.h[s]>0&&i!==lessonAllow.to) return; if(st.h[s]===0&&st.c[i]===s&&i!==lessonAllow.from) return; }
  hintAt=-1;
  if(removing){
    if(takeable(st.c,opp()).indexOf(i)<0) return;
    busy=true; paint(); await showTake(s,i); st.c[i]=0; removing=false; busy=false;
    seq++; lastMv={s:s,take:i}; endTurn(true); return;
  }
  if(st.h[s]>0){
    if(st.c[i]) return;
    busy=true; paint(); await showPlace(s,i); st.c[i]=s; st.h[s]--; busy=false;
    afterLanding(s,-1,i); return;
  }
  if(st.c[i]===s){ sel=sel===i?-1:i; Parlor.sfx("click",{pitch:1.5}); paint(); msg(); return; }
  if(sel<0||st.c[i]) return;
  var ok=steps(st,s).some(function(m){ return m.from===sel&&m.to===i; }); if(!ok) return;
  var from=sel; sel=-1; busy=true; paint(); await showSlide(from,i); st.c[from]=0; st.c[i]=s; busy=false;
  afterLanding(s,from,i);
}
function afterLanding(s,from,to){
  seq++; lastMv={s:s,from:from,to:to};
  if(millAt(st.c,to,s)&&takeable(st.c,3-s).length){ Parlor.sfx("mill"); removing=true; push(); paint(); msg();
    if(practice) Parlor.practiceSay("Mill!","<p>Three in a row. Take one of The House's <b>glowing stones</b>. Stones already in a mill are safe unless every House stone is in one.</p>");
    if(Parlor.lessonOn) Parlor.status("Mill!","Take a glowing House stone");
    return; }
  endTurn(false);
}
function endTurn(took){
  if(Parlor.lessonOn){ sel=-1; removing=false; paint(); Parlor.lessonDone(); return; }   /* Learn to Play */
  var s=st.turn;
  st.quiet=took?0:(st.h[1]===0&&st.h[2]===0?st.quiet+1:0);
  st.turn=3-s; sel=-1; removing=false;
  var r=result(st); if(r.over){ over=true; winner=r.winner; paint(); push(); end(); return; }
  push(); paint(); msg();
  if(!online&&st.turn===2) houseTurn();
  if(practice&&st.turn===1) practiceTip(s,took);
}
function end(){
  if(practice) Parlor.coach(null);
  var kind=winner===0?"draw":(winner===mySide?"win":"lose");
  var mine=cnt(st.c,mySide||1)+st.h[mySide||1], theirs=cnt(st.c,3-(mySide||1))+st.h[3-(mySide||1)];
  say(kind==="win"?"You win!":kind==="draw"?"Draw":"Game over",Parlor.oppName()+": "+theirs+" stones, you: "+mine);
  paint(); if(online) report();
  var why=winner===0?"Fifty moves each without a capture.":(cnt(st.c,3-winner)+st.h[3-winner]<3?(winner===mySide?Parlor.oppName()+" is":"You're")+" down to two stones.":(winner===mySide?Parlor.oppName()+" has":"You have")+" no moves left.");
  Parlor.finish(kind,why);
}

/* ---------- The House: thinks a few moves ahead, more as its level climbs ---------- */
async function houseTurn(){
  if(over||online||st.turn!==2) return;
  busy=true; paint(); msg();
  await Parlor.wait(900);
  var sk=Parlor.skill(), m;
  if(Math.random()<sk.loose){ var all=fullMoves(st); m=all[Math.floor(Math.random()*all.length)]; }
  else m=think(st,sk.depth+1);
  if(!m){ busy=false; return; }
  if(m.from<0){ await showPlace(2,m.to); st.c[m.to]=2; st.h[2]--; }
  else { await showSlide(m.from,m.to); st.c[m.from]=0; st.c[m.to]=2; }
  if(m.take>=0){
    Parlor.sfx("mill"); say("The House made a mill","It takes one of your stones"); paint();
    await Parlor.wait(800); await showTake(2,m.take); st.c[m.take]=0;
  }
  busy=false; endTurn(m.take>=0);
}
function newGame(){ st=fresh(); sel=-1; removing=false; over=false; winner=0; busy=false; reported=false; syncStones(); paint(); msg(); }

/* ---------- Learn to Play (Oct 24): six steps, then a coached practice game with a Hint button ---------- */
var practice=false, lessonAllow=null, hintAt=-1, tipN=0;
function LESSON(){ return [
  {title:"The Board", text:"<p>The board has <b>24 points</b> on three squares joined by lines. You and The House each have <b>nine stones</b>, waiting in your trays.</p><p>Three of your stones in a row along one line is a <b>mill</b>.</p>"},
  {title:"Placing", text:"<p>The game starts with each side taking turns to <b>place</b> a stone on any empty point.</p><p>Place a stone on a glowing point.</p>", done:"<p>Placed. When all eighteen stones are on the board, you start sliding them.</p>", sub:"Tap a glowing point"},
  {title:"Making a Mill", text:"<p>Make a <b>mill</b>: put your third stone on the glowing point, in line with your other two.</p><p>Then take one of The House's stones.</p>", done:"<p>A mill! Each mill takes one House stone. Stones that are part of a mill are safe, unless every stone is in one.</p>", sub:"Tap the glowing point"},
  {title:"Sliding", text:"<p>Once every stone is placed, you <b>slide</b> one stone along a line to the next empty point.</p><p>Tap your glowing stone, then slide it up to close a mill.</p>", done:"<p>A mill by sliding. Sliding a stone out of a mill and back in makes a new mill each time.</p>", sub:"Tap your glowing stone, then the gold point"},
  {title:"Flying", text:"<p>When you're down to <b>three stones</b>, yours can <b>fly</b> to any empty point, not just the next one.</p><p>Fly your glowing stone to complete the mill.</p>", done:"<p>Three stones can still fight back by flying.</p>", sub:"Tap your glowing stone, then the gold point"},
  {title:"How to Win", text:"<p>Win by bringing The House down to <b>two stones</b>, or by leaving it with <b>no legal move</b>.</p><p>Ready for a practice game? The House plays gently, and you can ask for a hint any time.</p>"}
]; }
function lessonState(mine,theirs,h1,h2){ var c=Array(24).fill(0); mine.forEach(function(i){ c[i]=1; }); theirs.forEach(function(i){ c[i]=2; }); return {c:c,h:[0,h1,h2],turn:1,quiet:0}; }
function lessonSetup(k){
  practice=false; hintAt=-1; lessonAllow=null; sel=-1; removing=false; over=false; winner=0; busy=false; mySide=1;
  if(k===1) st=fresh();
  else if(k===2){ st=lessonState([0,1],[4,21,13],7,6); lessonAllow={to:2}; }
  else if(k===3){ st=lessonState([3,4,13,0],[21,22,16,18],0,0); lessonAllow={from:13,to:5}; }
  else if(k===4){ st=lessonState([0,1,20],[9,12,16,22],0,0); lessonAllow={from:20,to:2}; }
  else st=fresh();
  syncStones(); paint();
}
function startPractice(){ practice=true; tipN=0; hintAt=-1; lessonAllow=null; mySide=1; newGame();
  Parlor.practiceSay("Your Move","<p>You move first. Place a stone on any glowing point.</p><p>Stuck? Tap <b>Hint</b>.</p>"); }
function showHint(){
  if(!practice||over||busy||st.turn!==1) return;
  if(removing){ var tk=takeable(st.c,2), best=tk[0], bv=-1e9; tk.forEach(function(t){ var c=st.c.slice(); c[t]=0; var v=evaluate({c:c,h:st.h,turn:1},1); if(v>bv){ bv=v; best=t; } }); hintAt=best; paint(); Parlor.hintSay("<p>Take the House stone on the <b>gold-ringed point</b>.</p>"); return; }
  var m=think(st,3); if(!m) return;
  if(m.from>=0){ sel=m.from; } hintAt=m.to; paint();
  Parlor.hintSay("<p>"+(m.from>=0?"Slide your <b>selected stone</b> to the <b>gold-ringed point</b>":"Place a stone on the <b>gold-ringed point</b>")+(m.take>=0?": it makes a mill":"")+".</p>");
}
function threat(c,s){ for(var k=0;k<MILLS.length;k++){ var m=MILLS[k],a=0,e=-1; for(var q=0;q<3;q++){ if(c[m[q]]===s) a++; else if(!c[m[q]]) e=m[q]; } if(a===2&&e>=0) return e; } return -1; }
var TIPS=["Points where lines cross give a stone more ways to move.","Spread your stones out early so they don't get boxed in.","Set up two possible mills at once: The House can only block one.","A mill you can open and close again is very strong."];
function practiceTip(s,took){
  if(over||st.turn!==1) return;
  var mine=fullMoves(st).filter(function(m){ return m.take>=0; }).length, th=threat(st.c,2);
  if(s===2&&took) Parlor.practiceSay("The House Made a Mill","<p>It took one of your stones. Watch for two House stones in a line with an empty third point.</p>");
  else if(mine) Parlor.practiceSay("A Mill Is Open","<p>You can make a mill this turn. Tap <b>Hint</b> if you can't spot it.</p>");
  else if(th>=0) Parlor.practiceSay("Block The House","<p>The House has two in a row. Put a stone on the open third point before it gets there.</p>");
  else { Parlor.practiceSay("Your Move","<p>"+TIPS[tipN%TIPS.length]+"</p>"); tipN++; }
}

/* ---------- online table (same page: ?code=XXXX) ----------
   Saved as {game:"morris", board, placed:{1,2}, turn, phase, remove, over, winner, quiet, seq, mv}; same as the old room page. */
var lastMv=null;
function snapshot(){ return {game:"morris", board:st.c.slice(), placed:{1:9-st.h[1],2:9-st.h[2]}, turn:over&&winner?winner:st.turn, phase:(st.h[1]===0&&st.h[2]===0)?"move":"place", remove:removing, over:over, winner:winner, quiet:st.quiet, seq:seq, mv:lastMv, last:null}; }
async function push(){
  if(!online||!room) return;
  await sb.from("rooms").update({state:snapshot(), status:over?"done":"live", updated_at:new Date().toISOString()}).eq("id",room.id);
  if(over) report();
}
function report(){ if(reported||!over||!room||!window.bwRateGame) return; reported=true; room.state=snapshot(); bwRateGame(sb,room,me,winner); }
function fromSnap(s){
  if(!s||!s.board) s={board:Array(24).fill(0),placed:{1:0,2:0},turn:1,remove:false,over:false};
  var pl=s.placed||{1:0,2:0};
  st={c:s.board.slice(),h:[0,9-(pl[1]||0),9-(pl[2]||0)],turn:s.turn||1,quiet:s.quiet||0};
  removing=!!s.remove; over=!!s.over; winner=s.winner!=null?s.winner:(over?s.turn:0); seq=s.seq||0; sel=-1;
}
var queue=Promise.resolve();
function remote(s){
  queue=queue.then(async function(){
    if(!s||s.seq==null||s.seq===seq) return;
    var mv=s.mv, wasOver=over; busy=true;
    if(mv&&mv.to!=null&&st.c[mv.to]!==mv.s){ if(mv.from>=0) await showSlide(mv.from,mv.to); else await showPlace(mv.s,mv.to); if(s.remove) Parlor.sfx("mill"); }
    if(mv&&mv.take!=null&&st.c[mv.take]){ await showTake(mv.s,mv.take); }
    busy=false;
    fromSnap(s);
    /* if anything still differs (a missed update), redraw every stone */
    var drift=false; for(var i=0;i<24;i++) if((els[i]?1:0)!==(st.c[i]?1:0)) drift=true;
    if(drift||handEls[1].length!==st.h[1]||handEls[2].length!==st.h[2]) syncStones();
    paint(); if(over&&!wasOver) end(); else msg();
  });
}
async function bootOnline(){
  online=true; Parlor.seatOnline({label:"Online table "+CODE});
  var cfg=window.BW_PLAY||{};
  if(!cfg.url){ say("Can't connect","Missing play-config.js"); return; }
  sb=(window.BW&&BW.client&&BW.client())||supabase.createClient(cfg.url,cfg.anonKey);
  if(window.BW) await BW.settled();
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ say("Sign in to join","Use the Lobby to sign in"); if(window.BW){ var a=await BW.openAuth({reason:"Sign in to join this table."}); if(!a.ok) return; sess=(await sb.auth.getSession()).data.session; } if(!sess) return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code",CODE).single();
  if(q.error){ say("Table not found",q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==="function" && bwSendToGame(bwGuessGame(room),CODE)) return;
  if(room.host===me) mySide=1; else if(room.guest===me) mySide=2;
  else if(!room.guest){ var u=await sb.from("rooms").update({guest:me,status:"live"}).eq("id",room.id).select().single(); if(!u.error){ room=u.data; mySide=2; } }
  else mySide=0;   /* watching */
  Parlor.names(mySide===2?["Opponent","You"]:["You","Opponent"]);
  Parlor.mySeat(mySide===2?1:0); Parlor.table&&Parlor.table({sb:sb,room:room,me:me,side:mySide});
  fromSnap(room.state&&room.state.board?room.state:null); syncStones();
  paint(); if(over) end(); else msg();
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"code=eq."+CODE},function(p){
    var hadGuest=room&&room.guest; room=p.new; var s=p.new.state||{};
    if(!hadGuest&&room.guest){ paint(); msg(); }
    if(s.seq!=null&&s.seq!==seq) remote(s);
  }).subscribe();
}

/* ---------- fit the board to its space ---------- */
function fit(){
  var wide=window.innerWidth>=1000, availW, availH;
  /* desktop: the full height between the game switcher and the bottom of the window, like the chess board */
  if(wide){ var st2=document.querySelector(".pk-stage"), top=st2&&document.body.classList.contains("seated")?st2.getBoundingClientRect().top+window.scrollY:185; availW=(st2&&st2.clientWidth)||(window.innerWidth-560); availH=window.innerHeight-top-22; }
  else { var shortL=window.innerHeight<=520&&window.innerWidth>window.innerHeight;
    availW=window.innerWidth-12; var slim=!shortL&&window.innerWidth<700; document.body.classList.toggle("mo-slim",slim);
    availH=shortL?window.innerHeight-56-64-34-10:slim?window.innerHeight-56-(64+30)-(36+10)-14:window.innerHeight-56-(64+30)-2*(44+10)-14; }   /* header, floating bar, score line or strips */
  var s=Math.max(.2,Math.min(availW/648,availH/828,1.25));
  var f=document.getElementById("moFit"), sc=document.getElementById("moScaler"); if(!f) return;
  sc.style.transform="scale("+s+")"; f.style.width=Math.round(648*s)+"px"; f.style.height=Math.round(828*s)+"px";
  document.body.style.setProperty("--pk-size",Math.round(648*s)+"px");
}
window.addEventListener("resize",fit);
