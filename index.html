<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrainWhim Studio Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --studio-bg: #0A0F24; 
            --white: #ffffff;
            --silver-text: #CBD5E1;
            --brand-whim-sky: #6BA3C9;   
            --glow-violet: #8B5CF6;
            --glow-emerald: #10B981;
            --glow-berry: #B01E51;
            --glow-sapphire: #0066CC;
        }
        html, body {
            background-color: var(--studio-bg);
            color: var(--white);
            margin: 0; padding: 0;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
        }
        header {
            background: linear-gradient(to top, rgba(10, 15, 36, 0.8), #132038);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0 4%;
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; height: 110px; z-index: 9999;
        }
        .header-brand-container { display: flex; align-items: center; text-decoration: none; }
        .header-logo-asset { width: 100px; height: 100px; object-fit: contain; }
        .header-brand-text { font-size: 30px; display: flex; align-items: baseline; margin-left: -4px; }
        .brand-brain { font-weight: 600; color: #fff; letter-spacing: -0.6px; }
        .brand-whim { font-family: 'Pacifico', cursive; color: #7EB6D9; }
        .header-navigation-menu { display: flex; gap: 42px; }
        .nav-link { color: var(--white); text-decoration: none; font-size: 16px; font-weight: 700; opacity: 0.85; }
        .nav-link:hover { opacity: 1; color: var(--brand-whim-sky); }

        .space-canvas {
            min-height: 100vh; width: 100vw; position: relative; display: flex; justify-content: center; align-items: center; padding-top: 110px;
            background-image: radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(1.5px 1.5px at 150px 80px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 250px 210px, rgba(255,255,255,0.5), rgba(0,0,0,0));
            background-size: 400px 400px;
        }
        .universe-viewport { z-index: 5; }
        .celestial-system-matrix { position: relative; width: 85vw; height: 85vw; max-width: 500px; max-height: 500px; display: flex; justify-content: center; align-items: center; }
        
        .studio-spherical-core {
            position: absolute; width: 150px; height: 150px; border-radius: 50%; z-index: 100;
            background: radial-gradient(circle at 35% 35%, #2A3B5C, #090D1A);
            box-shadow: 0 0 50px rgba(255,255,255,0.1), inset -10px -10px 20px rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
        }
        .core-brain-graphic { width: 110px; height: 110px; object-fit: contain; }

        .master-equidistant-ring { position: absolute; width: 420px; height: 420px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.15); animation: spin 28s linear infinite; }
        .sphere-node-wrapper { position: absolute; top: 50%; left: 50%; width: 110px; height: 110px; }
        
        .position-0   { transform: translate(-50%, -50%) rotate(0deg) translateY(-168px) rotate(0deg); }
        .position-90  { transform: translate(-50%, -50%) rotate(90deg) translateY(-168px) rotate(-90deg); }
        .position-180 { transform: translate(-50%, -50%) rotate(180deg) translateY(-168px) rotate(-180deg); }
        .position-270 { transform: translate(-50%, -50%) rotate(270deg) translateY(-168px) rotate(-270deg); }

        .volumetric-sphere {
            width: 100%; height: 100%; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-decoration: none;
            background: #161F38; border: 1px solid rgba(255,255,255,0.1); animation: counter-spin 28s linear infinite;
        }
        .orb-learn { box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 25px var(--glow-violet); }
        .orb-live { box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 25px var(--glow-emerald); }
        .orb-play { box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 25px var(--glow-berry); }
        .orb-create { box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 25px var(--glow-sapphire); }

        .volumetric-sphere h3 { font-size: 14px; margin: 0; color: #fff; font-weight: 700; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counter-spin { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        .site-footer { width: 100%; padding: 40px 8%; display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); background: #0A0F24; }
        .site-footer a { color: #7EB6D9; text-decoration: none; font-size: 13px; margin-left: 15px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="header-brand-container">
            <img src="logo-image.png" alt="BrainWhim" class="header-logo-asset">
            <div class="header-brand-text"><span class="brand-brain">Brain</span><span class="brand-whim">Whim</span></div>
        </a>
        <nav class="header-navigation-menu">
            <a href="#apps" class="nav-link">Apps</a>
            <a href="#about" class="nav-link">About</a>
            <a href="#support" class="nav-link">Support</a>
        </nav>
    </header>

    <main class="space-canvas" id="apps">
        <div class="celestial-system-matrix">
            <div class="studio-spherical-core">
                <img src="brain-core.png" alt="Core" class="core-brain-graphic">
            </div>
            <div class="master-equidistant-ring">
                <div class="sphere-node-wrapper position-0">
                    <a href="learn.html" class="volumetric-sphere orb-learn"><h3>Learn</h3></a>
                </div>
                <div class="sphere-node-wrapper position-90">
                    <a href="live.html" class="volumetric-sphere orb-live"><h3>Live</h3></a>
                </div>
                <div class="sphere-node-wrapper position-180">
                    <a href="play.html" class="volumetric-sphere orb-play"><h3>Play</h3></a>
                </div>
                <div class="sphere-node-wrapper position-270">
                    <a href="create.html" class="volumetric-sphere orb-create"><h3>Create</h3></a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div>© 2026 BrainWhim</div>
        <div>
            <a href="terms.html">Terms</a>
            <a href="privacy.html">Privacy</a>
            <a href="disclaimers.html">Disclaimers</a>
        </div>
    </footer>
</body>
</html>
