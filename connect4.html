<style>
/* ===== Seaside Connect Four (Nov 12): an upright board seen face-on, painted in code (no picture files) =====
   Layers inside the board, back to front: the discs (they slide down behind the face), the face panel with its
   seven-by-six holes (one painted picture with the holes cut out, so the porch shows through empty holes), a slow
   sun glint on the paint, the frame (a border-image, in front so a disc slips in behind the top rail), and the marks
   (last disc, the winning four, hints). The column buttons sit over everything, the hover row included. */
.c4-wrap{--f:calc(var(--c4-size) * .05);--ft:calc(var(--c4-size) * .03);--cell:calc((var(--c4-size) - 2 * var(--f)) / 7);
  width:var(--c4-size);height:calc(var(--c4-size) + var(--ft));flex:none;margin:0 auto;position:relative;-webkit-user-select:none;user-select:none}
.c4-board{position:absolute;left:0;right:0;bottom:var(--ft);height:calc(6 * var(--cell) + 2 * var(--f));
  box-shadow:0 calc(var(--c4-size) * .02) calc(var(--c4-size) * .03) rgba(0,0,0,.42)}
.c4-inner{position:absolute;inset:var(--f)}
/* the shade behind the face: empty holes look hollow, and the room photo's own board never reads as a disc */
.c4-inner::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(120% 90% at 30% 20%,rgba(30,40,52,.5),rgba(12,16,24,.72))}
.c4-discs{position:absolute;inset:0;z-index:1;clip-path:inset(-200% -2% 0 -2%)}
.c4-panel{position:absolute;inset:0;z-index:2;background:var(--c4-panel) center/100% 100% no-repeat;pointer-events:none}
.c4-sheen{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none;
  -webkit-mask:var(--c4-panel) center/100% 100% no-repeat;mask:var(--c4-panel) center/100% 100% no-repeat}
.c4-sheen::before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:60%;
  background:linear-gradient(100deg,transparent 0,rgba(255,250,235,var(--c4-sheen)) 50%,transparent 100%);animation:c4-sheen 11s ease-in-out infinite}
@keyframes c4-sheen{0%,35%{transform:translateX(0)}75%,100%{transform:translateX(270%)}}
.c4-frame{position:absolute;inset:0;z-index:3;pointer-events:none;box-sizing:border-box;border-style:solid;border-width:var(--f);border-image:var(--c4-frame) 64 round}
.c4-feet{position:absolute;left:0;right:0;bottom:0;height:calc(var(--ft) + 2px);pointer-events:none}
.c4-feet i{position:absolute;bottom:0;width:calc(var(--f) * 1.7);height:100%;border-radius:0 0 calc(var(--f) * .3) calc(var(--f) * .3);background:var(--c4-foot);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.25),0 3px 5px rgba(0,0,0,.35)}
.c4-feet i:first-child{left:calc(var(--f) * -.35)}.c4-feet i:last-child{right:calc(var(--f) * -.35)}
.c4-plate{position:absolute;left:50%;bottom:calc(var(--f) * .2);transform:translateX(-50%);z-index:4;height:calc(var(--f) * .62);padding:0 calc(var(--c4-size) * .016);
  display:flex;align-items:center;justify-content:center;border-radius:calc(var(--c4-size) * .006);background:var(--c4-plate);pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 2px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.5)}
.c4-plate .mono{display:flex;align-items:baseline;line-height:1.2;font-size:calc(var(--c4-size) * .028)}
.c4-plate .mono b,.c4-plate .mono i{display:inline-block;color:var(--c4-plate-ink);text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.35)}
.c4-plate .mono b{font:700 .97em Fraunces,Georgia,serif;letter-spacing:-.02em}.c4-plate .mono i{font:400 .76em Pacifico,cursive;font-style:normal;margin-left:.06em;padding:0 .14em 0 .02em}
.c4-marks{position:absolute;inset:0;z-index:4;width:100%;height:100%;pointer-events:none;overflow:visible}
.c4-marks .last{fill:none;stroke:rgba(255,226,140,.95);stroke-width:.045}
.c4-marks .four{fill:none;stroke:#ffd76a;stroke-width:.07;filter:drop-shadow(0 0 .06px #fff3c0);animation:c4-four 1.1s ease-in-out infinite}
.c4-marks .line{stroke:rgba(255,236,170,.9);stroke-width:.09;stroke-linecap:round;stroke-dasharray:6;stroke-dashoffset:6;animation:c4-line .7s .15s ease-out forwards}
.c4-marks .hcol{fill:rgba(250,205,95,.12);stroke:#f2c75a;stroke-width:.05;animation:c4-hint 1.3s ease-in-out infinite}
@keyframes c4-four{50%{stroke:#fff6d0;stroke-width:.1}}
@keyframes c4-line{to{stroke-dashoffset:0}}
@keyframes c4-hint{50%{stroke:rgba(242,199,90,.45);fill:rgba(250,205,95,.04)}}
/* discs: a thick lacquered disc with a raised ring, the kind that rattles down a real board */
.c4-slot{position:absolute;width:calc(100% / 7);height:calc(100% / 6);will-change:transform}
.c4-disc{position:absolute;inset:6.5%;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,var(--hi) 0 5%,transparent 24%),radial-gradient(circle at 38% 34%,var(--c1) 0 12%,var(--c2) 55%,var(--c3) 100%);
  box-shadow:inset 0 calc(var(--c4-size) * -.007) calc(var(--c4-size) * .01) rgba(0,0,0,.3),inset 0 calc(var(--c4-size) * .004) calc(var(--c4-size) * .006) rgba(255,255,255,.35)}
.c4-disc::after{content:"";position:absolute;inset:21%;border-radius:50%;box-shadow:0 0 0 calc(var(--c4-size) * .0035) var(--ring),inset 0 0 0 calc(var(--c4-size) * .0035) var(--ring2)}
.c4-disc.p1{--hi:var(--s1h);--c1:var(--s1a);--c2:var(--s1b);--c3:var(--s1c);--ring:var(--s1g);--ring2:var(--s1k)}
.c4-disc.p2{--hi:var(--s2h);--c1:var(--s2a);--c2:var(--s2b);--c3:var(--s2c);--ring:var(--s2g);--ring2:var(--s2k)}
/* the hover row above the board: your next disc waits over the column you're pointing at */
.c4-ghost{position:absolute;top:0;left:var(--f);width:var(--cell);height:var(--cell);z-index:5;pointer-events:none;transition:transform .16s ease-out,opacity .2s}
.c4-ghost .c4-disc{box-shadow:0 calc(var(--c4-size) * .012) calc(var(--c4-size) * .016) rgba(0,0,0,.45),inset 0 calc(var(--c4-size) * -.007) calc(var(--c4-size) * .01) rgba(0,0,0,.3),inset 0 calc(var(--c4-size) * .004) calc(var(--c4-size) * .006) rgba(255,255,255,.35)}
.c4-ghost.idle .c4-disc{animation:c4-bob 2.4s ease-in-out infinite}
@keyframes c4-bob{50%{transform:translateY(-6%)}}
.c4-ghost.off{opacity:0}
.c4-cols{position:absolute;top:0;left:var(--f);right:var(--f);bottom:calc(var(--ft) + var(--f));z-index:6;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.c4-col{border:0;padding:0;margin:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;min-width:0}
.c4-col:focus-visible{outline:2px solid #f2c75a;outline-offset:-2px;border-radius:8px}
.c4-col.ok::before{content:"";position:absolute;left:50%;top:calc(var(--cell) * .5);width:calc(var(--cell) * .26);height:calc(var(--cell) * .26);margin:calc(var(--cell) * -.13) 0 0 calc(var(--cell) * -.13);
  border-right:calc(var(--cell) * .06) solid #f5cf6a;border-bottom:calc(var(--cell) * .06) solid #f5cf6a;transform:rotate(45deg);filter:drop-shadow(0 0 4px rgba(255,214,110,.9));animation:c4-arrow 1.2s ease-in-out infinite}
@keyframes c4-arrow{50%{transform:translateY(18%) rotate(45deg);opacity:.6}}
.c4-stagepad{width:100%;flex:none;display:flex;justify-content:center;align-items:flex-start;padding-top:0}

/* sizes: the same square budget as the Othello terrace (the board plus its hover row is about square) */
body.pk{--c4-size:min(calc(100vw - 2*var(--pk-side) - 110px),max(340px,calc(100dvh - var(--pk-hdr) - var(--pk-sw) - 64px)),860px)}
@media (min-width:1000px) and (max-width:1180px){body.pk{--c4-size:min(calc(100vw - 2*var(--pk-side) - 80px),max(340px,calc(100dvh - var(--pk-hdr) - var(--pk-sw) - 64px)))}}
@media (max-width:999px){body.pk{--c4-size:min(calc(100vw - 16px),calc(100dvh - var(--pk-hdr) - var(--pk-bar) - 180px));--pk-size:var(--c4-size)}}
@media (prefers-reduced-motion:reduce){.c4-sheen::before,.c4-ghost.idle .c4-disc,.c4-col.ok::before,.c4-marks .four,.c4-marks .hcol{animation:none}}

<script>
/* ---------- painted materials (drawn in the browser when the page opens; no picture files) ---------- */
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}
function noise2(seed){var r=rng(seed),P=new Uint16Array(512),G=new Float32Array(256),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=Math.floor(r()*(i+1));t=p[i];p[i]=p[j];p[j]=t;}for(i=0;i<512;i++)P[i]=p[i&255];for(i=0;i<256;i++)G[i]=r();function f(x){return x*x*(3-2*x);}return function(x,y){var xi=Math.floor(x),yi=Math.floor(y),u=f(x-xi),v=f(y-yi),X=xi&255,Y=yi&255;var a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(n,x,y,o){var s=0,a=.5,t=0;for(var i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function mix(a,b,t){return a+(b-a)*t;}
function canvasOf(w,h,fn){var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d"),im=g.createImageData(w,h),D=im.data;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var col=fn(x,y),i=(y*w+x)*4;D[i]=col[0];D[i+1]=col[1];D[i+2]=col[2];D[i+3]=255;}g.putImageData(im,0,0);return c;}
function cssUrl(c,png){return 'url('+c.toDataURL(png?"image/png":"image/jpeg",.9)+')';}
function woodFn(o){var n=noise2(o.seed),n2=noise2(o.seed+77),r=rng(o.seed+5);return function(x,y){var warp=fbm(n,x/o.wx,y/o.wy,4),v=y*o.freq+warp*o.turb;v-=Math.floor(v);var ring=Math.pow(Math.abs(Math.sin(v*Math.PI)),o.sharp),st=fbm(n2,x/180,y/1.6,3);var t=Math.min(1,Math.max(0,(1-ring)*o.ringAmt+st*o.streakAmt));var k=r()<o.pores?.8:1,l=1+(fbm(n2,x/400,y/90,2)-.5)*o.blotch;return [mix(o.light[0],o.dark[0],t)*k*l,mix(o.light[1],o.dark[1],t)*k*l,mix(o.light[2],o.dark[2],t)*k*l];};}
function feltFn(rgb,seed){var r=rng(seed),n=noise2(seed);return function(x,y){var k=.86+r()*.22+(fbm(n,x/22,y/22,3)-.5)*.14;return [rgb[0]*k,rgb[1]*k,rgb[2]*k];};}
function marbleFn(o){var n=noise2(o.seed),n2=noise2(o.seed+9);return function(x,y){var w=fbm(n,x/150,y/150,5);var v=Math.abs(Math.sin((x*.004+y*.007)*o.freq+w*o.turb));v=Math.pow(1-v,o.sharp);var fine=fbm(n2,x/14,y/14,3),cloud=fbm(n2,x/260,y/260,3);var b=mix(o.base[0],o.cloud[0],cloud*.6),g=mix(o.base[1],o.cloud[1],cloud*.6),bb=mix(o.base[2],o.cloud[2],cloud*.6);return [mix(b,o.vein[0],v*o.amt)*(.97+fine*.06),mix(g,o.vein[1],v*o.amt)*(.97+fine*.06),mix(bb,o.vein[2],v*o.amt)*(.97+fine*.06)];};}
function stoneFn(rgb,seed){var r=rng(seed),n=noise2(seed),n2=noise2(seed+5);return function(x,y){var k=.9+fbm(n,x/60,y/60,4)*.16+(fbm(n2,x/4,y/4,2)-.5)*.1+(r()<.015?-.12:0);return [rgb[0]*k,rgb[1]*k,rgb[2]*k];};}
/* ---------- the frame: one 512px painted square, sliced as a border-image (64px rails, sides repeat every 96px) ---------- */
function paintFrame(o){
  var S=512,F=64,c=document.createElement("canvas"); c.width=c.height=S; var g=c.getContext("2d");
  var tex=o.wood?canvasOf(S,F,woodFn(o.wood)):null;
  function emboss(draw,mid){ g.save(); g.translate(1.6,1.8); g.fillStyle=o.shade; draw(); g.fill(); g.restore();
    g.save(); g.translate(-1,-1.1); g.fillStyle=o.glint; draw(); g.fill(); g.restore(); g.fillStyle=mid; draw(); g.fill(); }
  for(var q=0;q<4;q++){
    g.save(); g.translate(S/2,S/2); g.rotate(q*Math.PI/2); g.translate(-S/2,-S/2);
    g.beginPath(); g.moveTo(0,0); g.lineTo(S,0); g.lineTo(S-F,F); g.lineTo(F,F); g.closePath(); g.save(); g.clip();
    var gr=g.createLinearGradient(0,0,0,F); o.bevel.forEach(function(s){ gr.addColorStop(s[0],s[1]); }); g.fillStyle=gr; g.fillRect(0,0,S,F);
    if(tex){ g.globalAlpha=o.woodAlpha||.85; g.globalCompositeOperation="multiply"; g.drawImage(tex,0,0); g.globalAlpha=1; g.globalCompositeOperation="source-over";
      var sh=g.createLinearGradient(0,0,0,F); sh.addColorStop(0,"rgba(255,235,200,.28)"); sh.addColorStop(.25,"rgba(255,235,200,0)"); sh.addColorStop(.7,"rgba(0,0,0,0)"); sh.addColorStop(1,"rgba(0,0,0,.45)"); g.fillStyle=sh; g.fillRect(0,0,S,F); }
    if(o.beads){ for(var x=4;x<S;x+=8){ var bg=g.createRadialGradient(x-1,6,0,x,7,3.6); bg.addColorStop(0,o.glint); bg.addColorStop(.5,o.mid); bg.addColorStop(1,o.shade); g.fillStyle=bg; g.beginPath(); g.arc(x,7.5,3.3,0,7); g.fill(); } }
    if(o.scroll){
      var mg=g.createLinearGradient(0,14,0,50); mg.addColorStop(0,o.glint); mg.addColorStop(.45,o.mid); mg.addColorStop(1,o.deep);
      for(var x0=-96;x0<S+96;x0+=48){
        (function(x){
          emboss(function(){ g.beginPath(); g.moveTo(x,47); g.bezierCurveTo(x+6,30,x+14,18,x+24,16); g.bezierCurveTo(x+34,18,x+42,30,x+48,47); g.bezierCurveTo(x+40,40,x+33,30,x+24,28); g.bezierCurveTo(x+15,30,x+8,40,x,47); g.closePath(); },mg);
          emboss(function(){ g.beginPath(); g.arc(x+24,36,6.5,0,7); },mg);
          g.fillStyle=o.deep; g.beginPath(); g.arc(x+24,36,2.4,0,7); g.fill();
          emboss(function(){ g.beginPath(); g.moveTo(x+24,16); g.lineTo(x+21,11); g.lineTo(x+24,13); g.lineTo(x+27,11); g.closePath(); },mg);
        })(x0);
      }
    }
    if(o.flutes){ g.strokeStyle=o.shade; g.lineWidth=1.4; for(var x=3;x<S;x+=6){ g.beginPath(); g.moveTo(x,20); g.lineTo(x,44); g.stroke(); } g.strokeStyle=o.glint; g.lineWidth=.8; for(x=4.6;x<S;x+=6){ g.beginPath(); g.moveTo(x,20); g.lineTo(x,44); g.stroke(); } }
    if(o.egg){ for(var x=0;x<S;x+=12){ emboss(function(){ g.beginPath(); g.ellipse(x+6,56,3.8,4.4,0,0,7); },o.mid); g.fillStyle=o.deep; g.fillRect(x-.5,52,1.2,8); } }
    if(o.inline){ g.fillStyle=o.inline; g.fillRect(0,F-9,S,2.2); g.fillStyle="rgba(255,255,255,.35)"; g.fillRect(0,F-9,S,.8); }
    g.restore();
    g.strokeStyle="rgba(0,0,0,.35)"; g.lineWidth=1; g.beginPath(); g.moveTo(0,0); g.lineTo(F,F); g.stroke();
    g.restore();
  }
  /* corner pieces */
  [[0,0],[S-F,0],[S-F,S-F],[0,S-F]].forEach(function(p){
    var x=p[0], y=p[1], cx=x+F/2, cy=y+F/2;
    if(o.cornerCap){ var cg=g.createLinearGradient(x,y,x+F,y+F); cg.addColorStop(0,o.capHi); cg.addColorStop(.5,o.capMid); cg.addColorStop(1,o.capLo); g.fillStyle=cg; g.fillRect(x+4,y+4,F-8,F-8);
      g.strokeStyle="rgba(0,0,0,.45)"; g.strokeRect(x+4.5,y+4.5,F-9,F-9); g.fillStyle="rgba(0,0,0,.35)"; g.beginPath(); g.arc(cx,cy,3,0,7); g.fill(); g.fillStyle=o.capHi; g.beginPath(); g.arc(cx-.6,cy-.6,1.8,0,7); g.fill(); return; }
    var bg=g.createLinearGradient(x,y,x+F,y+F); bg.addColorStop(0,o.glint); bg.addColorStop(.5,o.mid); bg.addColorStop(1,o.deep); g.fillStyle=bg; g.fillRect(x+3,y+3,F-6,F-6);
    g.strokeStyle=o.shade; g.lineWidth=1.2; g.strokeRect(x+3.5,y+3.5,F-7,F-7);
    for(var k=0;k<8;k++){ (function(a){ emboss(function(){ g.beginPath(); g.ellipse(cx+Math.cos(a)*13,cy+Math.sin(a)*13,9,4.6,a,0,7); },o.mid); })(k*Math.PI/4); }
    emboss(function(){ g.beginPath(); g.arc(cx,cy,7.5,0,7); },o.mid); g.fillStyle=o.deep; g.beginPath(); g.arc(cx,cy,2.8,0,7); g.fill();
  });
  return cssUrl(c,true);
}
/* ---------- the three boards (the Boards card) ---------- */
var DESIGNS={

/* a new game pulls the slide at the bottom: the discs rattle out, then the board is empty again */
async function clearBoard(){
  var slots=[].slice.call(discLayer.children);
  if(!slots.length||!Parlor.smooth()||!slots[0].animate){ discLayer.textContent=""; return; }
  busy=true; Parlor.sfx("c4-rattle");
  var px=cellPx();
  slots.forEach(function(s){ var rc=s.dataset.rc.split(","), r=+rc[0], c=+rc[1];
    s.animate([{transform:"translateY(0)"},{transform:"translateY("+((ROWS-r+1.2)*px)+"px)"}],{duration:520,delay:c*45+(ROWS-r)*12,easing:"cubic-bezier(.5,0,.9,.5)",fill:"forwards"}); });
  await Parlor.wait(900); discLayer.textContent=""; busy=false;
}
async function newGame(){
  hintCol=-1; winLine=null; last=null; over=false; marks.innerHTML="";
  await clearBoard();
  g=fresh(); turn=1; nDrops=0; aimCol=3; busy=false;
  redraw(); msg(); showGhost();
}

/* ---------- online table (same page: ?code=XXXX) ---------- */
function snapshot(){ return {game:"connect4", board:g, turn:turn, over:over, last:last, drops:nDrops}; }
function applySnap(s){ if(!s||!s.board) s={board:fresh(),turn:1,over:false,last:null,drops:0}; g=s.board; turn=s.turn||1; over=!!s.over; last=s.last||null; nDrops=s.drops||0;
  winLine=null; if(last&&g[last[0]][last[1]]) winLine=lineAt(g,last[0],last[1],g[last[0]][last[1]]); }
function winnerSide(){ if(!winLine) return 0; return g[winLine.cells[0][0]][winLine.cells[0][1]]; }
async function push(){
  if(!online||!room) return;
  await sb.from("rooms").update({state:snapshot(), status:over?"done":"live", updated_at:new Date().toISOString()}).eq("id",room.id);
  if(over) report();
}
function report(){
  if(reported||!over||!room||!window.bwRateGame) return;
  reported=true; room.state=snapshot(); bwRateGame(sb,room,me,winnerSide());   /* the server decides if points move */
}
async function bootOnline(){
  online=true; Parlor.seatOnline({label:"Online table "+CODE});
  var cfg=window.BW_PLAY||{};
  if(!cfg.url){ say("Can't connect","Missing play-config.js"); return; }
  sb=(window.BW&&BW.client&&BW.client())||supabase.createClient(cfg.url,cfg.anonKey);
  if(window.BW) await BW.settled();
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ say("Sign in to join","Use the Lobby to sign in"); if(window.BW){ var a=await BW.openAuth({reason:"Sign in to join this table."}); if(!a.ok) return; sess=(await sb.auth.getSession()).data.session; } if(!sess) return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code",CODE).single();
  if(q.error){ say("Table not found",q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==="function" && bwSendToGame(bwGuessGame(room),CODE)) return;
  if(room.host===me) mySide=1; else if(room.guest===me) mySide=2;
  else if(!room.guest){ var u=await sb.from("rooms").update({guest:me,status:"live"}).eq("id",room.id).select().single(); if(!u.error){ room=u.data; mySide=2; } }
  else mySide=0;   /* watching */
  nameSeats();
  Parlor.mySeat(mySide===2?1:0); Parlor.table&&Parlor.table({sb:sb,room:room,me:me,side:mySide});
  applySnap(room.state&&room.state.board?room.state:null);
  redraw(); if(over) end(); else { msg(); showGhost(); }
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"code=eq."+CODE},function(p){
    var st=p.new.state||{}; room=p.new;
    /* the other player's drop: let it fall into the board we already show */
    if(st.board && st.last && !busy && !(last && last[0]===st.last[0] && last[1]===st.last[1]) && st.board[st.last[0]][st.last[1]]!==mySide && !g[st.last[0]][st.last[1]] && dropRow(g,st.last[1])===st.last[0]){
      var side=st.board[st.last[0]][st.last[1]]; busy=true;
      houseSlide(st.last[1]).then(function(){ return dropAnim(side,st.last[0],st.last[1]); }).then(function(){ busy=false; var wasOver=over; applySnap(st); if(turn===mySide) aimCol=3; redraw(); if(over&&!wasOver) setTimeout(end,900); else { msg(); showGhost(); } });
      return;
    }
    var wasOver=over; applySnap(st); redraw();
    if(turn===mySide) aimCol=3;
    if(over&&!wasOver) end(); else { msg(); showGhost(); }
  }).subscribe();
}

/* ---------- Learn to Play: six steps, then a coached practice game with a Hint button ---------- */
var practice=false, lessonAllow=null, tipN=0;
function lessonBoard(mine,theirs){ var b=fresh(); mine.forEach(function(q){ b[q[0]][q[1]]=1; }); theirs.forEach(function(q){ b[q[0]][q[1]]=2; }); return b; }
function LESSON(){ var n=colorNames(), me="<b>"+n[0]+"</b>", them="<b>"+n[1]+"</b>"; return [
  {title:"The Board", text:"<p>Connect Four stands upright: <b>7 columns</b> and <b>6 rows</b>. You play "+me+" and go first; The House plays "+them+".</p><p>Each turn is one move: you drop <b>one disc</b> into a column.</p>"},
  {title:"Dropping a Disc", text:"<p>Tap any column. Your disc falls to the <b>lowest open spot</b> in it.</p>", done:"<p>It fell all the way down. Discs always stack from the bottom up, so you can only ever play on top of what's there.</p>", sub:"Tap any column"},
  {title:"Four in a Row", text:"<p>Get <b>four of your discs in a line</b> to win. You have three across the bottom.</p><p>Drop into the column with the gold arrow to finish the line.</p>", done:"<p>Four across. That's a win.</p>", sub:"Tap the gold arrow"},
  {title:"Blocking", text:"<p>The House has <b>three stacked</b> in one column. If it drops one more there, it wins.</p><p>Block it: drop your disc on top.</p>", done:"<p>Blocked. Before every drop, check whether The House is one disc away from four.</p>", sub:"Tap the gold arrow"},
  {title:"Diagonals", text:"<p>Fours count <b>up and down</b> and <b>diagonally</b> too. Your three discs climb like a staircase.</p><p>Drop the fourth step.</p>", done:"<p>A diagonal four. Diagonals are the easiest to miss, for both players.</p>", sub:"Tap the gold arrow"},
  {title:"How to Win", text:"<p>The first to make four in a row wins. If all 42 spots fill with no four, it's a <b>draw</b>.</p><p>Ready for a practice game? The House plays gently, and <b>Hint</b> shows a good column.</p>"}
]; }
function lessonSetup(k){
  practice=false; hintCol=-1; lessonAllow=null; over=false; busy=false; turn=1; last=null; winLine=null; mySide=1;
  if(k===1) { g=lessonBoard([[5,3]],[[5,4],[4,3]]); lessonAllow=[0,1,2,3,4,5,6]; }
  else if(k===2){ g=lessonBoard([[5,1],[5,2],[5,3]],[[4,1],[4,2],[5,5]]); lessonAllow=[4]; }
  else if(k===3){ g=lessonBoard([[5,2],[5,3],[4,3],[5,6]],[[5,5],[4,5],[3,5]]); lessonAllow=[5]; }
  else if(k===4){ g=lessonBoard([[5,0],[4,1],[3,2],[5,3],[4,2]],[[5,1],[5,2],[4,3],[3,3]]); lessonAllow=[3]; }
  else g=fresh();
  aimCol=lessonAllow&&lessonAllow.length===1?lessonAllow[0]:3;   /* the waiting disc sits over the arrow */
  ghost.classList.add("off"); redraw(); showGhost();
}
function startPractice(){
  practice=true; tipN=0; hintCol=-1; lessonAllow=null; mySide=1; newGame();
  Parlor.practiceSay("Your Move","<p>You go first. Tap a column to drop a disc.</p><p>Stuck? Tap <b>Hint</b>.</p>");
}
function bestCol(){
  var sc=scoreCols(g,1,6); if(!sc.length) return -1;
  sc.sort(function(a,b){ return b.v-a.v; }); return sc[0].c;
}
function showHint(){
  if(!practice||over||busy||turn!==1) return;
  var c=bestCol(); if(c<0) return; hintCol=c; paintMarks();
  var why=winsNow(g,1).indexOf(c)>=0?"It makes four in a row!":winsNow(g,2).indexOf(c)>=0?"It blocks The House's four.":"It's the strongest drop I can see from here.";
  Parlor.hintSay("<p>Try the <b>gold-ringed column</b> (column "+(c+1)+"). "+why+"</p>");
}
var TIPS=["The middle column is part of the most possible fours. Claim it early.","Before you drop, look one disc up: will your disc give The House a spot it wants?","Look for a drop that makes two threats at once. The House can only block one.","Diagonals are easy to miss, for both of you. Scan for them every turn."];
function practiceTip(side){
  if(side!==2||over) return;
  var mine=winsNow(g,1), theirs=winsNow(g,2);
  if(mine.length) Parlor.practiceSay("You Can Win","<p>You can make four in a row right now. Look closely!</p>");
  else if(theirs.length) Parlor.practiceSay("Block It","<p>The House is one disc away from four. Drop in <b>column "+(theirs[0]+1)+"</b> to block it.</p>");
  else { Parlor.practiceSay("Your Move","<p>"+TIPS[tipN%TIPS.length]+"</p>"); tipN++; }
}

  pip:true,
  players:[{name:"You (cobalt)",color:"var(--c4-dot1,#2a54b0)"},{name:"The House (sand)",color:"var(--c4-dot2,#e2c48c)"}],
  setsLabel:"Boards",
  sets:[
    {id:"porch",name:"Seashell White",need:0,dots:["#f1ece2","#2a54b0","#e2c48c"]},
    {id:"drift",name:"Driftwood",club:true,dots:["#9c8b6e","#3f9c94","#e8735a"]},
    {id:"navy",name:"Regatta Navy",club:true,dots:["#1e2e52","#c8352e","#f2c230"]}
  ],
  rules:{
    play:"<ol><li>You go first. Each turn, drop one disc into any column that isn't full.</li><li>The disc falls to the lowest open spot in that column.</li><li>Make four of your discs in a line: across, up and down, or diagonally.</li><li>Watch The House's lines too, and block a three before it becomes four.</li></ol>",

  },
  onNew:function(){ mySide=1; practice=false; hintCol=-1; newGame(); },

g=fresh(); /* a board to look at before anyone sits */
new MutationObserver(function(){ applyDesign(document.body.getAttribute("data-set")||"porch"); showGhost(); }).observe(document.body,{attributes:true,attributeFilter:["data-set","class"]});
document.addEventListener("DOMContentLoaded",function(){
  applyDesign(document.body.getAttribute("data-set")||"porch");
  redraw(); showGhost();
  if(CODE) bootOnline();
});

window.C4O={drop:play,state:function(){ return {g:g,turn:turn,over:over,busy:busy,win:winLine,last:last,drops:nDrops,design:curDesign}; },

  nodes:function(){ return nodes; }};
