<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dominoes: Board Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(15,23,42,.72);--gold:#e7c77a;--ink:#f3ead8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:#1d1a14;overflow-x:hidden;min-height:100vh}
.bg{position:fixed;inset:-40px;background:url("dominoes-parlor.jpg") center/cover;filter:blur(18px) brightness(.55);z-index:-2}
header{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 16px 4px}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.designs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:6px}
.designs button{font:600 13px Montserrat,sans-serif;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:9px 14px;cursor:pointer}
.designs button.on{background:rgba(255,255,255,.22);border-color:rgba(231,199,122,.6);color:#fff}
.stage{display:flex;justify-content:center;overflow:hidden}
.fit{position:relative;flex:none}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.scene{position:relative;width:1040px;height:640px;perspective:3200px;perspective-origin:50% 40%}
.tray{position:absolute;left:40px;top:-30px;width:960px;height:640px;transform-style:preserve-3d;transform:rotateX(46deg)}
.tray *{transform-style:preserve-3d}
.p{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tsh{left:-30px;top:-10px;width:1020px;height:690px;transform:translateZ(-50px);background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.55),rgba(0,0,0,0) 68%);filter:blur(14px)}
.wh{background-image:var(--wood);background-size:1200px 600px;background-repeat:no-repeat;background-color:var(--woodc)}
.wv{background-image:var(--woodv);background-size:600px 1200px;background-repeat:no-repeat;background-color:var(--woodc)}
.felt{width:440px;height:280px;transform:translateZ(-22px);background-image:var(--felt);background-size:256px 256px;background-color:var(--feltc)}
.felt.a{left:40px;top:40px}.felt.b{left:480px;top:40px}.felt.c{left:40px;top:320px}.felt.d{left:480px;top:320px}
.feltsh{left:40px;top:40px;width:880px;height:560px;transform:translateZ(-21.6px);pointer-events:none;
  background:radial-gradient(ellipse 70% 70% at 45% 55%,rgba(255,240,200,.08),rgba(0,0,0,0) 60%),linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,0) 9%),linear-gradient(to right,rgba(0,0,0,.4),rgba(0,0,0,0) 5%,rgba(0,0,0,0) 95%,rgba(0,0,0,.35)),linear-gradient(to top,rgba(0,0,0,.3),rgba(0,0,0,0) 7%)}
.rim{transform:translateZ(1px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.rim.b,.rim.t{box-shadow:inset 0 1px 0 rgba(0,0,0,.3),inset 0 -1px 0 rgba(0,0,0,.3)}
.rim::after,.wall::after{content:"";position:absolute;inset:0}
.rim.t{left:0;top:0;width:480px;height:40px}.rim.t2{left:480px;background-position:-480px 0}
.rim.b{left:0;top:600px;width:480px;height:40px;background-position:-100px -300px}.rim.b2{left:479px;width:481px;background-position:-579px -300px}
.rim.t::after{background:linear-gradient(to bottom,rgba(255,235,200,.22),rgba(0,0,0,0) 40%,rgba(0,0,0,.3))}
.rim.b::after{background:linear-gradient(to bottom,rgba(255,235,200,.3),rgba(0,0,0,0) 45%,rgba(0,0,0,.25))}
.rim.l{left:0;top:40px;width:40px;height:560px;background-position:-40px 0}.rim.r{left:920px;top:40px;width:40px;height:560px;background-position:-300px -100px}
.rim.l::after{background:linear-gradient(to right,rgba(255,235,200,.2),rgba(0,0,0,.3))}.rim.r::after{background:linear-gradient(to right,rgba(255,235,200,.12),rgba(0,0,0,.35))}
.wall{overflow:hidden}
.wall.of{top:640px;width:480px;height:44px;transform-origin:top;transform:rotateX(-90deg)}.wall.of1{left:0;background-position:-200px -100px}.wall.of2{left:479px;width:481px;background-position:-679px -100px}
.wall.of::after{background:linear-gradient(to bottom,rgba(255,230,190,.1),rgba(0,0,0,.45))}
.wall.ol{left:-44px;top:0;width:44px;height:640px;transform-origin:right;transform:rotateY(-90deg)}.wall.or{left:960px;top:0;width:44px;height:640px;transform-origin:left;transform:rotateY(90deg)}
.wall.or::after{background:rgba(0,0,0,.5)}
.wall.ib{left:40px;top:40px;width:880px;height:22px;transform-origin:top;transform:rotateX(-90deg);background-position:-60px -40px}.wall.ib::after{background:rgba(0,0,0,.35)}
.wall.il{left:40px;top:40px;width:22px;height:560px;transform-origin:left;transform:rotateY(90deg)}.wall.il::after{background:rgba(0,0,0,.45)}
.wall.ir{left:898px;top:40px;width:22px;height:560px;transform-origin:right;transform:rotateY(-90deg)}.wall.ir::after{background:rgba(0,0,0,.2)}
.gold{position:absolute;pointer-events:none;transform:translateZ(1.6px);background:linear-gradient(90deg,#8a6526,#f3d790 30%,#b8913f 60%,#f3d790 85%,#8a6526)}
/* ---- a domino: stacked slabs for the edge, a face on top ---- */
.dm{position:absolute;left:0;top:0}
.dm .s,.dm .f,.dm .bk{position:absolute;inset:0;border-radius:var(--rad,7px)}
.dm .s{background:var(--edge)}
.dm .f{background:var(--face);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset 0 -5px 9px rgba(0,0,0,.18),inset 0 4px 7px rgba(255,255,255,.5);display:flex}
.dm.v .f{flex-direction:column}
.dm .bk{background:var(--back);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 -5px 9px rgba(0,0,0,.25),inset 0 4px 7px rgba(255,255,255,.18)}
.dm .bk::after{content:"";position:absolute;left:50%;top:50%;width:28%;height:28%;transform:translate(-50%,-50%) rotate(45deg);border:2px solid var(--emb);border-radius:3px;opacity:.8}
.dm .half{flex:1;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%}
.dm.v .half{padding:14% 16%}
.dm .half i{width:66%;aspect-ratio:1;border-radius:50%;margin:auto;visibility:hidden;background:radial-gradient(circle at 60% 65%,var(--pip) 45%,var(--pip2) 100%);box-shadow:inset 0 2px 2px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.55)}
.dm .half i.on{visibility:visible}
.dm .bar{flex:none;background:var(--bar);box-shadow:0 1px 0 rgba(255,255,255,.5)}
.dm.h .bar{width:2px;margin:12% 0}.dm.v .bar{height:2px;margin:0 12%}
.dm .spin{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3cc,#b8913f 55%,#6e4f1d);box-shadow:0 1px 1px rgba(0,0,0,.45)}
.dm .sh{position:absolute;inset:-5px;border-radius:12px;background:rgba(0,0,0,.5);filter:blur(5px)}
.dm.play .f{box-shadow:inset 0 0 0 3px rgba(214,164,62,.95),inset 0 0 18px 2px rgba(240,190,90,.5)}
.dm.play{cursor:pointer}
/* colored pips for the pearl set */
.colorpips .half[data-n="1"] i{--pip:#1f5fbf;--pip2:#5d8de0}.colorpips .half[data-n="2"] i{--pip:#2f8f4e;--pip2:#62c07f}.colorpips .half[data-n="3"] i{--pip:#c0392b;--pip2:#e27063}
.colorpips .half[data-n="4"] i{--pip:#6b3fa0;--pip2:#9a74c9}.colorpips .half[data-n="5"] i{--pip:#c58a10;--pip2:#e7b54a}.colorpips .half[data-n="6"] i{--pip:#14141a;--pip2:#4a4a52}
.bar2{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px auto 0;padding:10px 12px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:12px;width:min(640px,calc(100% - 32px))}
.status{flex:1 1 220px;font-size:14px;line-height:1.35}
.status b{color:var(--gold)}
.btn{font:600 14px Montserrat,sans-serif;border-radius:6px;padding:11px 18px;cursor:pointer;border:1px solid rgba(231,199,122,.45);background:rgba(30,41,59,.85);color:var(--gold)}
.note{max-width:640px;margin:12px auto 24px;padding:0 16px;text-align:center;font-size:12.5px;line-height:1.5;color:rgba(243,234,216,.75)}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <div class="label">Dominoes · Board Preview</div>
  <div class="designs" id="designs">
    <button data-d="walnut" class="on">Sunroom Walnut</button>
    <button data-d="ebony">Midnight Ebony</button>
    <button data-d="pearl">Garden Pearl</button>
  </div>
</header>
<div class="stage"><div class="fit" id="fit"><div class="scaler" id="scaler"><div class="scene"><div class="tray" id="tray"></div></div></div></div></div>
<div class="bar2"><div class="status" id="status"></div><button class="btn" id="reset">Deal Again</button></div>
<p class="note">Preview only. Your tiles stand along the near side of the tray; tap a glowing tile to play it onto the train. The House's tiles stand at the far side with their backs to you, and the boneyard waits in face-down stacks.</p>
<script>
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}
function noise2(seed){var r=rng(seed),P=new Uint16Array(512),G=new Float32Array(256),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=Math.floor(r()*(i+1));t=p[i];p[i]=p[j];p[j]=t;}for(i=0;i<512;i++)P[i]=p[i&255];for(i=0;i<256;i++)G[i]=r();function f(x){return x*x*(3-2*x);}return function(x,y){var xi=Math.floor(x),yi=Math.floor(y),u=f(x-xi),v=f(y-yi),X=xi&255,Y=yi&255;var a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(n,x,y,o){var s=0,a=.5,t=0;for(var i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function mix(a,b,t){return a+(b-a)*t;}
function canvasOf(w,h,fn){var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d"),im=g.createImageData(w,h),D=im.data;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var col=fn(x,y),i=(y*w+x)*4;D[i]=col[0];D[i+1]=col[1];D[i+2]=col[2];D[i+3]=255;}g.putImageData(im,0,0);return c;}
function url(c){return 'url('+c.toDataURL("image/jpeg",.88)+')';}
function rot(c){var d=document.createElement("canvas");d.width=c.height;d.height=c.width;var g=d.getContext("2d");g.translate(d.width,0);g.rotate(Math.PI/2);g.drawImage(c,0,0);return d;}
function woodFn(o){var n=noise2(o.seed),n2=noise2(o.seed+77),r=rng(o.seed+5);return function(x,y){var warp=fbm(n,x/o.wx,y/o.wy,4),v=y*o.freq+warp*o.turb;v-=Math.floor(v);var ring=Math.pow(Math.abs(Math.sin(v*Math.PI)),o.sharp),st=fbm(n2,x/180,y/1.6,3);var t=Math.min(1,Math.max(0,(1-ring)*o.ringAmt+st*o.streakAmt));var k=r()<o.pores?.8:1,l=1+(fbm(n2,x/400,y/90,2)-.5)*o.blotch;return [mix(o.light[0],o.dark[0],t)*k*l,mix(o.light[1],o.dark[1],t)*k*l,mix(o.light[2],o.dark[2],t)*k*l];};}
function feltFn(rgb,seed){var r=rng(seed),n=noise2(seed);return function(x,y){var k=.86+r()*.22+(fbm(n,x/22,y/22,3)-.5)*.14;return [rgb[0]*k,rgb[1]*k,rgb[2]*k];};}
var DESIGNS={
  walnut:{name:"Sunroom Walnut",wood:{light:[120,78,46],dark:[58,34,18],freq:.04,turb:9,wx:220,wy:20,sharp:.7,ringAmt:.66,streakAmt:.42,pores:.02,blotch:.3,seed:23},woodc:"#5e3c22",
    felt:[26,62,44],face:"linear-gradient(150deg,#fffdf4,#f1e7cf 60%,#e2d3b0)",edge:"#d9c9a4",pip:"#16110c",pip2:"#4a3a2a",bar:"#b9a57c",back:"linear-gradient(150deg,#2f4d8a,#1b2f5e)",emb:"#d9b25a",color:false,names:"ivory tiles, black pips"},
  ebony:{name:"Midnight Ebony",wood:{light:[132,52,32],dark:[62,20,12],freq:.035,turb:5,wx:420,wy:30,sharp:.9,ringAmt:.32,streakAmt:.5,pores:.012,blotch:.3,seed:41},woodc:"#6a2a18",
    felt:[86,22,30],face:"linear-gradient(150deg,#3a3430,#1b1714 60%,#0e0b09)",edge:"#120e0c",pip:"#f6efdc",pip2:"#cdbf9c",bar:"#8f6a22",back:"linear-gradient(150deg,#3a3430,#141110)",emb:"#d9b25a",color:false,names:"ebony tiles, ivory pips"},
  pearl:{name:"Garden Pearl",wood:{light:[236,226,204],dark:[206,192,164],freq:.03,turb:5,wx:260,wy:30,sharp:.8,ringAmt:.3,streakAmt:.35,pores:0,blotch:.12,seed:12},woodc:"#e6dcc6",
    felt:[22,40,74],face:"linear-gradient(150deg,#ffffff,#f4f1ea 55%,#e4ddd0)",edge:"#e2dbcd",pip:"#14141a",pip2:"#4a4a52",bar:"#c9b98f",back:"linear-gradient(150deg,#f4f1ea,#d9d1c0)",emb:"#b8913f",color:true,names:"pearl tiles, coloured pips"}
};
var T=document.getElementById("tray");
var h='<div class="p tsh"></div><div class="p wall of of1 wh"></div><div class="p wall of of2 wh"></div><div class="p wall ol wv"></div><div class="p wall or wv"></div>';
h+='<div class="p felt a"></div><div class="p felt b"></div><div class="p felt c"></div><div class="p felt d"></div><div class="p feltsh"></div>';
h+='<div class="p wall ib wh"></div><div class="p wall il wv"></div><div class="p wall ir wv"></div>';
h+='<div id="tiles" style="position:absolute;left:0;top:0"></div>';
h+='<div class="p rim t wh"></div><div class="p rim t t2 wh"></div><div class="p rim b wh"></div><div class="p rim b b2 wh"></div><div class="p rim l wv"></div><div class="p rim r wv"></div>';
h+='<div class="gold" style="left:34px;top:34px;width:892px;height:2px"></div><div class="gold" style="left:34px;top:604px;width:446px;height:2px"></div><div class="gold" style="left:480px;top:604px;width:446px;height:2px"></div><div class="gold" style="left:34px;top:34px;width:2px;height:572px"></div><div class="gold" style="left:924px;top:34px;width:2px;height:572px"></div>';
T.innerHTML=h;
var TL=document.getElementById("tiles");
var PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function half(n){var s='<div class="half" data-n="'+n+'">';for(var k=0;k<9;k++)s+='<i class="'+(PIPS[n].indexOf(k)>=0?"on":"")+'"></i>';return s+'</div>';}
/* a domino w x l, horizontal (h) or vertical (v); face up or back up */
function tile(a,b,o){
  var w=o.w,l=o.l,hz=o.dir==="h",W=hz?l:w,H=hz?w:l,e=document.createElement("div");
  e.className="dm "+(hz?"h":"v"); e.style.width=W+"px"; e.style.height=H+"px"; e.style.margin=(-H/2)+"px 0 0 "+(-W/2)+"px"; e.style.setProperty("--rad",Math.round(w*.14)+"px");
  var th=o.th||14, s='<div class="sh" style="transform:translateZ(.5px)"></div>';
  for(var k=0;k<6;k++) s+='<div class="s" style="transform:translateZ('+(1+k*th/6)+'px);filter:brightness('+(.78+k*.04)+')"></div>';
  if(o.back) s+='<div class="bk" style="transform:translateZ('+(th+1)+'px)"></div>';
  else s+='<div class="f" style="transform:translateZ('+(th+1)+'px)">'+half(a)+'<div class="bar"></div>'+half(b)+'<div class="spin"></div></div>';
  e.innerHTML=s; e.dataset.a=a; e.dataset.b=b; TL.appendChild(e); return e;
}
function at(e,x,y,z,rx){ e._x=x;e._y=y; e.style.transform="translate3d("+x+"px,"+y+"px,"+(z||0)+"px)"+(rx?" rotateX("+rx+"deg)":""); }
/* standing tiles: rotated up around their bottom edge */
function stand(e,x,y,lean,back){ e.style.transformOrigin="50% 100%"; e.style.transform="translate3d("+x+"px,"+(y-parseFloat(e.style.height)/2)+"px,-22px) rotateX("+(back?(90-lean):(-90+lean))+"deg)"; }
var FZ=-22;   /* felt level */
var chain=[], hand=[], ends=[null,null], trainEls=[], leftX=0, rightX=0, cur="walnut";
function deal(){
  TL.innerHTML=""; trainEls=[];
  var pack=[];for(var a=0;a<=6;a++)for(var b=a;b<=6;b++)pack.push([a,b]);
  var r=rng(Date.now()%100000+7);for(var i=pack.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=pack[i];pack[i]=pack[j];pack[j]=t;}
  /* a train already on the table: start with a double, then match outward */
  var start=pack.findIndex(function(t){return t[0]===t[1];}); var first=pack.splice(start,1)[0];
  chain=[first]; ends=[first[0],first[1]];
  for(var n=0;n<6;n++){ var side=n%2, e=ends[side], k=pack.findIndex(function(t){return t[0]===e||t[1]===e;}); if(k<0) continue; var t2=pack.splice(k,1)[0]; var other=t2[0]===e?t2[1]:t2[0]; if(side) {chain.push([e,other]);} else {chain.unshift([other,e]);} ends[side]=other; }
  hand=pack.splice(0,7); var house=pack.splice(0,6), bone=pack;
  layoutTrain();
  /* your hand stands along the near side, faces to you */
  hand.forEach(function(t,k){ var e=tile(t[0],t[1],{w:46,l:92,dir:"v",th:12}); e.dataset.k=k; stand(e,228+k*84,556,30,false); e.onclick=function(){ playHand(e); }; });
  /* The House's tiles stand at the far side, backs to you */
  house.forEach(function(t,k){ var e=tile(0,0,{w:40,l:80,dir:"v",th:11,back:true}); e.style.transformOrigin="50% 100%"; e.style.transform="translate3d("+(258+k*74)+"px,"+(76-40)+"px,-22px) rotateX(-90deg)"; });
  /* the boneyard: two neat face-down stacks at the side */
  bone.forEach(function(t,k){ var e=tile(0,0,{w:40,l:80,dir:"h",th:9,back:true}); at(e,92+(k%2)*0,170+(k%2)*96,FZ+Math.floor(k/2)*10); });
  mark();
}
function layoutTrain(){
  trainEls.forEach(function(e){e.remove();}); trainEls=[];
  var W=48,L=96, x=0, items=[];
  chain.forEach(function(t){ var dbl=t[0]===t[1], len=dbl?W:L; items.push({t:t,dbl:dbl,x:x+len/2}); x+=len+3; });
  var total=x-3, x0=480-total/2-20, y=330;
  items.forEach(function(it){ var e=tile(it.t[0],it.t[1],{w:W,l:L,dir:it.dbl?"v":"h",th:12}); at(e,x0+it.x,y,FZ); trainEls.push(e); });
  leftX=x0; rightX=x0+total;
}
function mark(){
  var n=0; TL.querySelectorAll(".dm").forEach(function(e){ if(e.dataset.k==null) return; var a=+e.dataset.a,b=+e.dataset.b,ok=a===ends[0]||b===ends[0]||a===ends[1]||b===ends[1]; e.classList.toggle("play",ok); if(ok)n++; });
  document.getElementById("status").innerHTML="<b>"+DESIGNS[cur].name+"</b> · "+DESIGNS[cur].names+". Open ends: "+ends[0]+" and "+ends[1]+". "+(n?n+" of your tiles can play.":"No tile fits: you'd draw from the boneyard.");
}
function playHand(e){
  if(!e.classList.contains("play")) return;
  var a=+e.dataset.a,b=+e.dataset.b,side=(a===ends[1]||b===ends[1])?1:0,v=ends[side],other=a===v?b:a;
  if(side) chain.push([v,other]); else chain.unshift([other,v]); ends[side]=other;
  e.style.transition="transform .6s cubic-bezier(.3,.7,.3,1),opacity .4s"; e.style.transform+=" translateZ(60px)"; e.style.opacity="0";
  setTimeout(function(){ e.remove(); layoutTrain(); mark(); },420);
}
var cache={};
function apply(k){cur=k;var d=DESIGNS[k];if(!cache[k]){var w=canvasOf(1200,600,woodFn(d.wood));cache[k]={w:url(w),v:url(rot(w)),f:url(canvasOf(256,256,feltFn(d.felt,k.length*31)))};}
  var s=T.style;s.setProperty("--wood",cache[k].w);s.setProperty("--woodv",cache[k].v);s.setProperty("--woodc",d.woodc);s.setProperty("--felt",cache[k].f);s.setProperty("--feltc","rgb("+d.felt+")");
