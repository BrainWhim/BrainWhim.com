<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:#1d1a14;overflow-x:hidden;min-height:100vh}
.bg{position:fixed;inset:-40px;background:url("dominoes-parlor.jpg") center/cover;filter:blur(18px) brightness(.55);z-index:-2}
header{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 16px 4px}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}

.stage{display:flex;justify-content:center;overflow:hidden}
.fit{position:relative;flex:none}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.scene{position:relative;width:900px;height:900px;perspective:3000px;perspective-origin:50% 50%}
.tray{position:absolute;left:20px;top:20px;width:860px;height:860px;transform-style:preserve-3d;transform:none}
.tray *{transform-style:preserve-3d}
.p{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tsh{left:-8px;top:-2px;width:876px;height:876px;transform:translateZ(-30px);border-radius:14px;background:rgba(0,0,0,.6);filter:blur(12px)}
.wh{background-image:var(--wood);background-size:1200px 600px;background-repeat:no-repeat;background-color:var(--woodc)}
.wv{background-image:var(--woodv);background-size:600px 1200px;background-repeat:no-repeat;background-color:var(--woodc)}

  background:radial-gradient(ellipse 70% 70% at 45% 55%,rgba(255,240,200,.08),rgba(0,0,0,0) 60%),linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,0) 9%),linear-gradient(to right,rgba(0,0,0,.4),rgba(0,0,0,0) 5%,rgba(0,0,0,0) 95%,rgba(0,0,0,.35)),linear-gradient(to top,rgba(0,0,0,.3),rgba(0,0,0,0) 7%)}

.dm .bk{display:flex;align-items:center;justify-content:center}

.dm.h .mono{transform:rotate(-90deg)}
.dm .mono b,.dm .mono i{display:inline-block;background:linear-gradient(170deg,#fff1bf 0%,var(--emb) 45%,#8f6a22 75%,#f3d68b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.45))}

.status{flex:1 1 220px;font-size:14px;line-height:1.35}
.status b{color:var(--gold)}
.btn{font:600 14px Montserrat,sans-serif;border-radius:6px;padding:11px 18px;cursor:pointer;border:1px solid rgba(231,199,122,.45);background:rgba(30,41,59,.85);color:var(--gold)}
.note{max-width:640px;margin:12px auto 24px;padding:0 16px;text-align:center;font-size:12.5px;line-height:1.5;color:rgba(243,234,216,.75)}
</style>

<script>
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}

function fbm(n,x,y,o){var s=0,a=.5,t=0;for(var i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function mix(a,b,t){return a+(b-a)*t;}
function canvasOf(w,h,fn){var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d"),im=g.createImageData(w,h),D=im.data;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var col=fn(x,y),i=(y*w+x)*4;D[i]=col[0];D[i+1]=col[1];D[i+2]=col[2];D[i+3]=255;}g.putImageData(im,0,0);return c;}
function url(c){return 'url('+c.toDataURL("image/jpeg",.88)+')';}
function rot(c){var d=document.createElement("canvas");d.width=c.height;d.height=c.width;var g=d.getContext("2d");g.translate(d.width,0);g.rotate(Math.PI/2);g.drawImage(c,0,0);return d;}
function woodFn(o){var n=noise2(o.seed),n2=noise2(o.seed+77),r=rng(o.seed+5);return function(x,y){var warp=fbm(n,x/o.wx,y/o.wy,4),v=y*o.freq+warp*o.turb;v-=Math.floor(v);var ring=Math.pow(Math.abs(Math.sin(v*Math.PI)),o.sharp),st=fbm(n2,x/180,y/1.6,3);var t=Math.min(1,Math.max(0,(1-ring)*o.ringAmt+st*o.streakAmt));var k=r()<o.pores?.8:1,l=1+(fbm(n2,x/400,y/90,2)-.5)*o.blotch;return [mix(o.light[0],o.dark[0],t)*k*l,mix(o.light[1],o.dark[1],t)*k*l,mix(o.light[2],o.dark[2],t)*k*l];};}

var DESIGNS={
  walnut:{name:"Sunroom Walnut",wood:{light:[120,78,46],dark:[58,34,18],freq:.04,turb:9,wx:220,wy:20,sharp:.7,ringAmt:.66,streakAmt:.42,pores:.02,blotch:.3,seed:23},woodc:"#5e3c22",

    felt:[86,22,30],face:"linear-gradient(150deg,#3a3430,#1b1714 60%,#0e0b09)",edge:"#120e0c",pip:"#f6efdc",pip2:"#cdbf9c",bar:"#8f6a22",back:"linear-gradient(150deg,#3a3430,#141110)",emb:"#d9b25a",color:false,names:"ebony tiles, ivory pips"},
  pearl:{name:"Garden Pearl",wood:{light:[236,226,204],dark:[206,192,164],freq:.03,turb:5,wx:260,wy:30,sharp:.8,ringAmt:.3,streakAmt:.35,pores:0,blotch:.12,seed:12},woodc:"#e6dcc6",
    felt:[22,40,74],face:"linear-gradient(150deg,#ffffff,#f4f1ea 55%,#e4ddd0)",edge:"#e2dbcd",pip:"#14141a",pip2:"#4a4a52",bar:"#c9b98f",back:"linear-gradient(150deg,#f4f1ea,#d9d1c0)",emb:"#b8913f",color:true,names:"pearl tiles, coloured pips"}
};
var T=document.getElementById("tray");

h+='<div class="p felt a"></div><div class="p felt b"></div><div class="p felt c"></div><div class="p felt d"></div><div class="p feltsh"></div>';
h+='<div class="p rack me"></div><div class="p rack you" style="top:56px"></div>';

h+='<div class="p rim t wh"></div><div class="p rim t t2 wh"></div><div class="p rim b wh"></div><div class="p rim b b2 wh"></div><div class="p rim l wv"></div><div class="p rim r wv"></div>';

/* a domino w x l, horizontal (h) or vertical (v); face up or back up */

  else s+='<div class="f" style="transform:translateZ('+(th+1)+'px)">'+half(a)+'<div class="bar"></div>'+half(b)+'<div class="spin"></div></div>';

}
function at(e,x,y,z,rx){ e._x=x;e._y=y; e.style.transform="translate3d("+x+"px,"+y+"px,"+(z||0)+"px)"+(rx?" rotateX("+rx+"deg)":""); }
/* standing tiles: rotated up around their bottom edge */
function stand(e,x,y,lean,back){ e.style.transformOrigin="50% 100%"; e.style.transform="translate3d("+x+"px,"+(y-parseFloat(e.style.height)/2)+"px,-22px) rotateX("+(back?(90-lean):(-90+lean))+"deg)"; }
var FZ=-22;   /* felt level */
var startAt=0, chain=[], hand=[], ends=[null,null], trainEls=[], leftX=0, rightX=0, cur="walnut";
function deal(){
  TL.innerHTML=""; trainEls=[];
  var pack=[];for(var a=0;a<=6;a++)for(var b=a;b<=6;b++)pack.push([a,b]);
  var r=rng(Date.now()%100000+7);for(var i=pack.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=pack[i];pack[i]=pack[j];pack[j]=t;}
  /* a train already on the table: start with a double, then match outward */
  var start=pack.findIndex(function(t){return t[0]===t[1];}); var first=pack.splice(start,1)[0];

  for(var n=0;n<10;n++){ var side=n%2, e=ends[side], k=pack.findIndex(function(t){return t[0]===e||t[1]===e;}); if(k<0) continue; var t2=pack.splice(k,1)[0]; var other=t2[0]===e?t2[1]:t2[0]; if(side) {chain.push([e,other]);} else {chain.unshift([other,e]); startAt++;} ends[side]=other; }

/* the train winds: from the first tile, one end runs right, turns down and comes back along the bottom;

var LEGS={
  right:[[1,0,function(x,y){return x>796;}],[0,1,function(x,y){return y>706;}],[-1,0,function(x,y){return x<64;}]],
  left:[[-1,0,function(x,y){return x<64;}],[0,-1,function(x,y){return y<178;}],[1,0,function(x,y){return x>796;}]]
};

  var W=48*sc,L=96*sc,G=3*sc,spots=[],ok=true;
  function put(t,cx,cy,dx){ var dbl=t[0]===t[1],horiz=dx!==0; spots.push({t:t,x:cx,y:cy,dir:dbl?(horiz?"v":"h"):(horiz?"h":"v"),w:W,l:L}); }
  function run(list,legs,px,py,perp){
    var leg=0,dx=legs[0][0],dy=legs[0][1];
    list.forEach(function(t){
      var dbl=t[0]===t[1],len=dbl?W:L;
      if(legs[leg][2](px+dx*(len+G),py+dy*(len+G))){
        if(leg===legs.length-1){ ok=false; }
        else { leg++; var ndx=legs[leg][0],ndy=legs[leg][1]; px=px-dx*(W/2+G)+ndx*(perp+G); py=py-dy*(W/2+G)+ndy*(perp+G); dx=ndx; dy=ndy; }
      }
      put(t,px+dx*len/2,py+dy*len/2,dx); px+=dx*(len+G); py+=dy*(len+G); perp=dbl?L/2:W/2;
    });
  }
  var first=chain[startAt],fd=first[0]===first[1],flen=fd?W:L,cx=430,cy=440;
  put(first,cx,cy,1);
  run(chain.slice(startAt+1),LEGS.right,cx+flen/2+G,cy,fd?L/2:W/2);
  run(chain.slice(0,startAt).reverse(),LEGS.left,cx-flen/2-G,cy,fd?L/2:W/2);
  return ok?spots:null;
}
function layoutTrain(){
  trainEls.forEach(function(e){e.remove();}); trainEls=[];
  var sc=1,spots; while(!(spots=trainSpots(sc))&&sc>.5) sc*=.92;
  spots.forEach(function(p){ var e=tile(p.t[0],p.t[1],{w:p.w,l:p.l,dir:p.dir,th:12*Math.max(sc,.7)}); at(e,p.x,p.y,FZ); trainEls.push(e); });
}
function mark(){
  var n=0; TL.querySelectorAll(".dm").forEach(function(e){ if(e.dataset.k==null) return; var a=+e.dataset.a,b=+e.dataset.b,ok=a===ends[0]||b===ends[0]||a===ends[1]||b===ends[1]; e.classList.toggle("play",ok); if(ok)n++; });
  document.getElementById("status").innerHTML="<b>"+DESIGNS[cur].name+"</b> · "+DESIGNS[cur].names+". Open ends: "+ends[0]+" and "+ends[1]+". "+(n?n+" of your tiles can play.":"No tile fits: you'd draw from the boneyard.");
}
function playHand(e){
  if(!e.classList.contains("play")) return;
  var a=+e.dataset.a,b=+e.dataset.b,side=(a===ends[1]||b===ends[1])?1:0,v=ends[side],other=a===v?b:a;
  if(side) chain.push([v,other]); else { chain.unshift([other,v]); startAt++; } ends[side]=other;
  e.style.transition="transform .5s cubic-bezier(.3,.7,.3,1),opacity .4s"; e.style.transform+=" translateZ(90px)"; e.style.opacity="0";
  setTimeout(function(){ e.remove(); layoutTrain(); mark(); },420);
}
var cache={};
function apply(k){cur=k;var d=DESIGNS[k];if(!cache[k]){var w=canvasOf(1200,600,woodFn(d.wood));cache[k]={w:url(w),v:url(rot(w)),f:url(canvasOf(256,256,feltFn(d.felt,k.length*31)))};}
  var s=T.style;s.setProperty("--wood",cache[k].w);s.setProperty("--woodv",cache[k].v);s.setProperty("--woodc",d.woodc);s.setProperty("--felt",cache[k].f);s.setProperty("--feltc","rgb("+d.felt+")");
  s.setProperty("--face",d.face);s.setProperty("--edge",d.edge);s.setProperty("--pip",d.pip);s.setProperty("--pip2",d.pip2);s.setProperty("--bar",d.bar);s.setProperty("--back",d.back);s.setProperty("--emb",d.emb);
  T.classList.toggle("colorpips",d.color);
  document.querySelectorAll("#designs button").forEach(function(b){b.classList.toggle("on",b.dataset.d===k);});mark();}
document.querySelectorAll("#designs button").forEach(function(b){b.onclick=function(){apply(b.dataset.d);};});
document.getElementById("reset").onclick=deal;
function fit(){var w=Math.min(innerWidth-8,1150),s=Math.min(w/900,Math.max(300,innerHeight-230)/900,1.1);document.getElementById("scaler").style.transform="scale("+s+")";var f=document.getElementById("fit");f.style.width=900*s+"px";f.style.height=900*s+"px";}
addEventListener("resize",fit);fit();deal();apply("walnut");
</script>
