<style>
/* Color Sort (The Outpost · The Lab), Nov 12. Zayden's idea: pour the space potions between corked bottles on a wooden shelf
   until every bottle holds one color. A pour goes onto the same color or into an empty bottle. Engine: colorsort-gen.js. */
:root{--bgx:18%;--bgy:50%}
#play{flex-direction:column;align-items:center;justify-content:flex-start;gap:8px}
.cbar{width:min(640px,100%);display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:16px;color:#2b2116;
  background:linear-gradient(180deg,#fffaf0,#f1e3c2);box-shadow:0 4px 0 #c9b384,0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 #fff}
.cday{flex:1;text-align:center;line-height:1.15}
.cday b{display:block;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#a0661c}
.cday span{font-size:14px;font-weight:700;color:#5a4220}
.ib{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;min-height:40px;padding:0 13px;border-radius:12px;color:#3a2306;
  background:linear-gradient(180deg,#ffe7a6,#e9c46a);box-shadow:0 3px 0 #a97a1c}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #a97a1c}
.ib.gh{background:rgba(120,80,20,.1);box-shadow:none;color:#6b4a1a}
.ib:disabled{opacity:.45;cursor:default}
.cmsg{min-height:22px;max-width:640px;text-align:center;font-weight:700;font-size:16px;line-height:1.3;color:#ffe9b8;text-shadow:0 2px 6px rgba(0,0,0,.7);padding:0 6px}
#shelf{position:relative;flex:1 1 auto;width:100%;max-width:820px;min-height:0;user-select:none;-webkit-user-select:none}
.plank{position:absolute;left:0;right:0;height:22px;border-radius:5px;
  background:repeating-linear-gradient(92deg,rgba(60,30,10,0) 0 37px,rgba(60,30,10,.16) 37px 39px,rgba(255,220,170,.05) 39px 61px,rgba(60,30,10,.1) 61px 62px),
    linear-gradient(180deg,#c48a52 0,#a46a37 9px,#7b4a22 10px,#6a3d1b 100%);
  box-shadow:0 10px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,225,180,.55)}
.plank::before,.plank::after{content:"";position:absolute;top:20px;width:16px;height:30px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#6a3d1b,#4a2a12);box-shadow:0 6px 10px rgba(0,0,0,.4)}
.plank::before{left:8%}.plank::after{right:8%}
.bwp{position:absolute;left:50%;top:11px;transform:translate(-50%,-50%);font:800 10px/1 Outfit,system-ui,sans-serif;letter-spacing:.06em;color:#4a300c;
  padding:3px 7px 2px;border-radius:4px;background:linear-gradient(180deg,#f6dc8e,#c99a3c);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 1px 2px rgba(0,0,0,.5)}
.bt{position:absolute;left:0;top:0;cursor:pointer;transition:transform .32s cubic-bezier(.3,.8,.3,1);transform-origin:50% 7%;z-index:2;-webkit-tap-highlight-color:transparent}
.bt svg{display:block;width:100%;height:100%;overflow:visible}
.bt::after{content:"";position:absolute;left:8%;right:8%;bottom:-3%;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);z-index:-1;transition:opacity .3s}
.bt.up::after,.bt.fly::after{opacity:0}
.bt.up{z-index:5}
.bt.fly{z-index:9;transition:transform .34s cubic-bezier(.4,.1,.3,1)}
.bt .ring{position:absolute;inset:-6% -14%;border-radius:40% 40% 18% 18%;pointer-events:none;opacity:0;transition:opacity .2s}
.bt.up .ring{opacity:1;box-shadow:0 0 0 3px rgba(255,236,170,.9),0 0 18px 4px rgba(242,190,69,.7)}
.bt.ha .ring,.bt.hb .ring{opacity:1;animation:hring .8s ease-in-out infinite}
.bt.hb .ring{box-shadow:0 0 0 3px #7fe3d4,0 0 18px 5px rgba(95,209,193,.8)}
.bt.ha .ring{box-shadow:0 0 0 3px #ffd98a,0 0 18px 5px rgba(242,190,69,.85)}
@keyframes hring{50%{opacity:.35}}
.bt.bad{animation:shk .35s}
@keyframes shk{20%,60%{margin-left:-5px}40%,80%{margin-left:5px}}
.bt.hop{animation:hop .5s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{40%{margin-top:-12%}}
.bt .cork{transform-box:fill-box;transform-origin:50% 100%}
.bt.pop .cork{animation:cork .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes cork{0%{transform:translateY(-60%) scale(1.25)}100%{transform:none}}
.strm{position:absolute;width:7px;margin-left:-3.5px;border-radius:4px;z-index:8;transform-origin:50% 0;transform:scaleY(0);pointer-events:none;
  box-shadow:inset 2px 0 0 rgba(255,255,255,.35)}
.spk{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;z-index:10;pointer-events:none;
  background:radial-gradient(circle,#fff 0 20%,rgba(255,240,180,.9) 30%,transparent 70%);animation:spk .8s ease-out forwards}
@keyframes spk{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.ctools{display:flex;gap:10px;justify-content:center;flex:none;padding-bottom:2px}
.ctools .k-btn{min-height:46px;padding:0 20px;font-size:17px}
.stars{font-size:34px;letter-spacing:4px;color:#f2be45;text-shadow:0 2px 0 #8a5f12;margin:2px 0 4px}
.stars i{font-style:normal;color:rgba(255,255,255,.18);text-shadow:none}
.mix{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#ffe9b8;text-shadow:0 2px 6px #000}
@media (max-height:620px){.cmsg{font-size:14px;min-height:18px}.ib{min-height:34px;font-size:14px}.ctools .k-btn{min-height:40px;font-size:15px}.cday span{font-size:13px}}
@media (prefers-reduced-motion:reduce){.bt,.bt.fly{transition-duration:.01s}.bt.ha .ring,.bt.hb .ring{animation:none}}
</style>

<body class="m-menu">
<div class="bg"></div><div class="bg2"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="csDefs"></defs></svg>
<main id="app">
  <section class="scr" id="menu">
    <div class="mcard">
      <svg class="emb" viewBox="0 0 132 92" aria-hidden="true" id="csEmb"></svg>
      <h1>Color Sort</h1>
      <p class="lead">Zayden's potion puzzle! Pour the space potions from bottle to bottle until every bottle holds just one color.</p>
      <div class="mbtns">
        <button class="k-btn" id="bPlay">Today's Potions</button>
        <button class="k-btn k-ghost" id="bHow">How to Play</button>
        <button class="k-btn k-ghost" id="bBack">Back to The Outpost</button>

      <button class="ib" id="tHint">Hint</button>
    </div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);}, LS=BWK.store, G=CSG, CAP=G.CAP;
var ST=LS.get("csort",{}); if(!ST||typeof ST!=="object") ST={}; ST.n=ST.n||0;
function save(){ LS.set("csort",ST); }

/* ---------- the six potions, each with its own pattern (for kids who see colors differently) ---------- */
var POT=[
  {n:"Nebula Pink",   c:"#ec5fa3", d:"#b8326f"},
  {n:"Moonwater Blue",c:"#3f95e6", d:"#1d5fae"},
  {n:"Starlight Gold",c:"#f5c935", d:"#c08d0c"},
  {n:"Comet Green",   c:"#43c46e", d:"#1f8a45"},
  {n:"Galaxy Purple", c:"#9461dc", d:"#5e33a3"},
  {n:"Sunfire Orange",c:"#f3812f", d:"#bd4f0f"}];
/* pattern shapes, white on the potion: stars, waves, dots, stripes, rings, zigzags */
var PAT=[
  '<path d="M7 2.2l1.3 2.9 3.1.3-2.4 2 .8 3.1L7 8.9 4.2 10.5l.8-3.1-2.4-2 3.1-.3z"/>',
  '<path d="M0 8q3.5-4 7 0t7 0" fill="none" stroke="#fff" stroke-width="1.8"/>',
  '<circle cx="4" cy="4" r="1.9"/><circle cx="10.5" cy="10.5" r="1.9"/>',
  '<path d="M-2 4L4 -2M3 15L15 3M10 16L16 10" stroke="#fff" stroke-width="2.4"/>',
  '<circle cx="7" cy="7" r="3.4" fill="none" stroke="#fff" stroke-width="1.7"/>',
  '<path d="M0 10l3.5-5 3.5 5 3.5-5 3.5 5" fill="none" stroke="#fff" stroke-width="1.8"/>'];
(function(){ var h='<linearGradient id="csGlassG" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".16" stop-color="#fff" stop-opacity=".08"/>'+
    '<stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset=".9" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>'+
    '<linearGradient id="csCorkG" x1="0" x2="1"><stop offset="0" stop-color="#a8743f"/><stop offset=".45" stop-color="#d9a868"/><stop offset="1" stop-color="#8a5a2b"/></linearGradient>'+
    '<linearGradient id="csLiqG" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".75" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>'+
    '<clipPath id="csBodyC"><path d="'+BODY()+'"/></clipPath>';
  PAT.forEach(function(p,i){ h+='<pattern id="csPat'+i+'" width="14" height="14" patternUnits="userSpaceOnUse"><g fill="#fff" opacity=".5">'+p+'</g></pattern>'; });
  $("#csDefs").innerHTML=h; })();
function BODY(){ return "M21 16L21 38C21 47 5 49 5 62L5 158Q5 170 17 170L43 170Q55 170 55 158L55 62C55 49 39 47 39 38L39 16Z"; }
var VB_H=176, LH=26, FLOOR=167; /* each layer is 26 tall; the liquid sits on y=167 */

/* draw one bottle. lay: [{c, h}] bottom first, h = 1 for a full layer (fractions while pouring) */
function bottleSvg(lay,corked){
  var s='<svg viewBox="0 0 60 '+VB_H+'" aria-hidden="true"><g clip-path="url(#csBodyC)"><rect x="0" y="0" width="60" height="176" fill="rgba(170,215,255,.07)"/>', y=FLOOR;
  lay.forEach(function(l,i){ if(l.h<=0.001) return; var hh=LH*l.h; y-=hh; var p=POT[l.c];
    s+='<rect x="0" y="'+y.toFixed(2)+'" width="60" height="'+(hh+.6).toFixed(2)+'" fill="'+p.c+'"/><rect x="0" y="'+y.toFixed(2)+'" width="60" height="'+(hh+.6).toFixed(2)+'" fill="url(#csPat'+l.c+')"/>';
    if(i===lay.length-1||lay[i+1].h<=0.001) s+='<rect x="0" y="'+y.toFixed(2)+'" width="60" height="3" fill="#fff" opacity=".35"/>'; });
  s+='<rect x="0" y="0" width="60" height="176" fill="url(#csLiqG)"/></g>';
  s+='<path d="'+BODY()+'" fill="url(#csGlassG)" stroke="rgba(225,242,255,.85)" stroke-width="1.6"/>';
  s+='<path d="M10 70L10 150" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/><path d="M15 66L15 76" stroke="#fff" stroke-opacity=".4" stroke-width="2" stroke-linecap="round"/>';
  s+='<rect x="17.5" y="10" width="25" height="8" rx="3" fill="rgba(210,235,255,.25)" stroke="rgba(225,242,255,.9)" stroke-width="1.5"/>';
  if(corked) s+='<g class="cork"><rect x="19" y="1" width="22" height="15" rx="3.5" fill="url(#csCorkG)" stroke="#6b4420" stroke-width=".8"/><path d="M23 5h3M31 9h4M25 12h2M34 4h2" stroke="#7a4e24" stroke-width="1" stroke-linecap="round" opacity=".7"/></g>';
  return s+'</svg>';
}
function layOf(b){ return b.map(function(c){ return {c:c,h:1}; }); }

/* ---------- menu emblem: three corked bottles ---------- */
$("#csEmb").innerHTML=[[0,2],[1,3],[4,5]].map(function(cc,i){ var x=22+i*30, sc=.42;
  return '<g transform="translate('+(23+i*30)+',10) scale('+sc+')">'+bottleSvg([{c:cc[0],h:1},{c:cc[1],h:1},{c:cc[0],h:1},{c:cc[1],h:1}],true).replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"")+'</g>'; }).join("");

/* ---------- sounds of its own ---------- */
function sLift(){ BWG.tone(1568,0,.12,.035,"triangle"); BWG.tone(2350,.03,.1,.02,"sine"); }
function sDown(){ BWG.tone(1046,0,.08,.03,"triangle"); }
function sPour(n){ BWG.noise(0,.32+n*.1,.06,250,900); for(var i=0;i<4+n*2;i++) BWG.tone(300+Math.random()*260,.04+i*.06,.07,.035,"sine",520+Math.random()*300); }
function sCork(){ BWG.noise(0,.05,.18,500,2500); BWG.tone(380,0,.09,.07,"sine",900); BWG.tone(1760,.1,.25,.03,"triangle"); BWG.tone(2637,.17,.3,.025,"triangle"); }
function sWrong(){ BWG.tone(220,0,.18,.05,"sine",180); }
function sWin(){ [523,659,784,1047,1319].forEach(function(f,i){ BWG.tone(f,i*.09,.4,.045,"triangle"); }); }

/* ---------- the week ---------- */
var DAYN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var FOOT=["3 potions. A gentle start!","3 potions, more mixed up.","4 potions.","4 potions, more mixed up.","5 potions!","5 potions. A tricky one!","5 potions. The trickiest of the week!"];
function today(){ var d=new Date(); return {n:Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5), wd:d.getDay()}; }

var P=null, gen=0, busy=false, EL=[], GEO=null, saidNope=0, saidPick=false;
function msg(t){ $("#cmsg").textContent=t||""; }
function start(bonus){
  gen++; var g=gen, t=today(), lv=G.lvOf(t.wd);
  document.body.className="m-play"+(document.body.classList.contains("wide")?" wide":"");
  $("#cday").textContent=bonus?"Bonus Potions":(DAYN[t.wd]+"'s Potions");
  $("#shelf").innerHTML='<div class="mix">Mixing the potions…</div>'; msg(""); saidNope=0; saidPick=false;
  setTimeout(function(){ if(g!==gen) return;
    if(!bonus&&ST.day===t.n&&ST.cur&&ST.cur.B0){ var c=ST.cur; P={B:c.B,B0:c.B0,hist:c.hist||[],hints:c.hints||0,pours:c.pours||0,done:!!c.done,lv:c.lv,bonus:false,min:c.min}; }
    else { var M=G.make(lv,bonus?(Math.random()*1e9)|0:G.daySeed(t.n)); P={B:M.B,B0:G.clone(M.B),hist:[],hints:0,pours:0,done:false,lv:lv,bonus:!!bonus,min:M.min}; }
    P.sel=-1; P.shut=P.B.map(function(b){ return G.full(b); });
    build(); saveCur();
    if(P.done){ msg("All sorted! Come back tomorrow for new potions."); return; }
    if(bonus) BWK.say(BONUS);
    msg(ST.n<3?"Tap a bottle to pick it up.":"Sort the potions: one color in each bottle.");
    if(ST.n<3&&!bonus) BWK.say(TAP1);
  },60);
}
function saveCur(){ if(!P||P.bonus) return; ST.day=today().n; ST.cur={B:P.B,B0:P.B0,hist:P.hist.slice(-60),hints:P.hints,pours:P.pours,done:P.done,lv:P.lv,min:P.min}; save(); }

/* ---------- layout: one row, or two rows on narrow screens, whichever gives bigger bottles ---------- */
function geo(){ var sh=$("#shelf"), W=sh.clientWidth, H=sh.clientHeight, N=P.B.length, best=null, AR=VB_H/60;
  [1,2].forEach(function(r){ var k=Math.ceil(N/r), gap=Math.max(8,W*.03), bw=Math.min((W-gap*(k+1))/k, (H/r-26-H*.06/r)/AR/1.16, 96);
    if(!best||bw>best.bw+2) best={r:r,k:k,bw:bw,gap:gap}; });
  var bh=best.bw*AR, rowH=Math.min(H/best.r,bh*1.2+44), off=Math.max(0,(H-rowH*best.r)*.55), pos=[];
  for(var i=0;i<N;i++){ var row=Math.floor(i/best.k), inRow=row<best.r-1?best.k:N-best.k*(best.r-1), j=i-row*best.k,
      tot=inRow*best.bw+(inRow-1)*best.gap*1.4, x0=(W-tot)/2, plankY=off+rowH*(row+1)-22-4;
    pos.push({x:x0+j*(best.bw+best.gap*1.4), y:plankY-bh+bh*.012}); }
  return {r:best.r,bw:best.bw,bh:bh,rowH:rowH,off:off,pos:pos,W:W}; }
function build(){ var sh=$("#shelf"); sh.innerHTML=""; GEO=geo(); EL=[];
  for(var r=0;r<GEO.r;r++){ var pl=document.createElement("div"); pl.className="plank"; pl.style.top=(GEO.off+GEO.rowH*(r+1)-26)+"px";
    var span=Math.min(GEO.W, (r<GEO.r-1||GEO.r===1? Math.ceil(P.B.length/GEO.r):P.B.length-Math.ceil(P.B.length/GEO.r))*(GEO.bw*1.5)+40);
    pl.style.left=((GEO.W-span)/2)+"px"; pl.style.right=((GEO.W-span)/2)+"px";
    if(r===GEO.r-1) pl.innerHTML='<span class="bwp">BW</span>'; sh.appendChild(pl); }
  P.B.forEach(function(b,i){ var d=document.createElement("div"); d.className="bt"; d.dataset.i=i;
    d.setAttribute("role","button"); d.setAttribute("aria-label","Bottle "+(i+1));
    d.style.width=GEO.bw+"px"; d.style.height=GEO.bh+"px"; d.style.left=GEO.pos[i].x+"px"; d.style.top=GEO.pos[i].y+"px";
    d.innerHTML=bottleSvg(layOf(b),P.shut[i])+'<div class="ring"></div>';
    d.addEventListener("click",function(){ tap(i); }); sh.appendChild(d); EL.push(d); });
  tools(); }
function draw(i,lay){ EL[i].innerHTML=bottleSvg(lay||layOf(P.B[i]),P.shut[i])+'<div class="ring"></div>'; }
function tools(){ $("#cpours").textContent="Pours: "+P.pours+(P.hints?"  ·  Hints: "+P.hints:""); $("#tUndo").disabled=!P.hist.length||P.done; $("#tReset").disabled=P.done||!P.hist.length; $("#tHint").disabled=P.done; }
function clearHint(){ EL.forEach(function(e){ e.classList.remove("ha","hb"); }); }

/* ---------- play ---------- */
function lift(i,on){ var e=EL[i]; e.classList.toggle("up",on); e.style.transform=on?"translateY(-"+(GEO.bh*.13)+"px)":""; }
function tap(i){
  if(!P||P.done||busy) return; clearHint();
  if(P.sel<0){
    if(!P.B[i].length||P.shut[i]){ sWrong(); EL[i].classList.remove("bad"); void EL[i].offsetWidth; EL[i].classList.add("bad");
      msg(P.shut[i]?"That bottle is done. Pick a bottle with potion to pour.":"That bottle is empty. Pick one with potion in it."); return; }
    P.sel=i; lift(i,true); sLift();
    msg("Now tap the bottle to pour it into."); if(!saidPick&&ST.n<3){ saidPick=true; BWK.say(PICK); } return; }
  var a=P.sel; if(a===i){ P.sel=-1; lift(i,false); sDown(); msg(""); return; }
  if(!G.canPour(P.B,a,i)){ sWrong(); EL[i].classList.remove("bad"); void EL[i].offsetWidth; EL[i].classList.add("bad");
    var full=P.B[i].length>=CAP; msg(full?"That bottle is full!":"A potion can only go onto the same color, or into an empty bottle.");
    if(saidNope<2){ saidNope++; BWK.say(full?FULL:NOPE); }
    P.sel=-1; lift(a,false); return; }
  P.sel=-1; doPour(a,i);
}
function doPour(a,b,cb){
  busy=true; var g=gen, n=G.canPour(P.B,a,b), col=G.top(P.B[a]);
  P.hist.push({B:G.clone(P.B),pours:P.pours});
  var A=EL[a], pa=GEO.pos[a], pb=GEO.pos[b], side=pa.x<pb.x?-1:1;
  /* fly: put A's mouth just above and beside B's mouth, tipped toward B */
  var lip=side*GEO.bw*.06, dx=pb.x-pa.x+lip, dy=pb.y-pa.y-GEO.bh*.24;
  A.classList.remove("up"); A.classList.add("fly"); A.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(side<0?72:-72)+"deg)";
  var before=P.B.map(function(x){ return x.slice(); });
  setTimeout(function(){ if(g!==gen) return;
    var st=document.createElement("div"); st.className="strm"; st.style.background=POT[col].c;
    var mx=pb.x+GEO.bw/2+lip-side*2, top=pb.y+GEO.bh*.07-GEO.bh*.24, liq=pb.y+GEO.bh*((FLOOR-LH*(before[b].length+n))/VB_H);
    st.style.left=mx+"px"; st.style.top=top+"px"; st.style.height=Math.max(8,liq-top)+"px"; $("#shelf").appendChild(st);
    st.style.transition="transform .14s ease-in"; requestAnimationFrame(function(){ st.style.transform="scaleY(1)"; });
    sPour(n); G.pour(P.B,a,b); P.pours++;
    var t0=performance.now(), D=420+n*110;
    (function f(now){ if(g!==gen) return; var u=Math.min(1,(now-t0)/D), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      var la=layOf(before[a]); for(var k=0;k<n;k++) la[la.length-1-k].h=1-e;
      var lb=layOf(before[b]); for(var k2=0;k2<n;k2++) lb.push({c:col,h:e});
      draw(a,la); draw(b,lb); if(u<1) requestAnimationFrame(f); else after(); })(t0);
    function after(){ st.style.transformOrigin="50% 100%"; st.style.transition="transform .16s ease-out"; st.style.transform="scaleY(0)";
      setTimeout(function(){ st.remove(); },200);
      A.style.transform=""; draw(a); draw(b);
      setTimeout(function(){ if(g!==gen) return; A.classList.remove("fly"); busy=false;
        var sh=G.full(P.B[b])&&!P.shut[b]; if(sh){ P.shut[b]=true; draw(b); EL[b].classList.add("pop"); sCork(); sparkle(b); setTimeout(function(){ if(EL[b]) EL[b].classList.remove("pop"); },500); }
        tools(); saveCur();
        if(G.solved(P.B)) win(); else { if(sh) { msg(POT[col].n+"! That bottle is done."); BWK.say(POT[col].n+"!"); } else msg(""); }
        if(cb) cb(); },360); }
  },340);
}
function sparkle(i){ var p=GEO.pos[i], cx=p.x+GEO.bw/2, cy=p.y+GEO.bh*.06;
  for(var k=0;k<9;k++){ var s=document.createElement("div"), a=k/9*Math.PI*2; s.className="spk"; s.style.left=cx+"px"; s.style.top=cy+"px";
    s.style.setProperty("--dx",(Math.cos(a)*GEO.bw*.9)+"px"); s.style.setProperty("--dy",(Math.sin(a)*GEO.bw*.7-10)+"px");
    $("#shelf").appendChild(s); setTimeout(function(x){ return function(){ x.remove(); }; }(s),850); } }
function undo(){ if(!P||busy||!P.hist.length||P.done) return; clearHint(); if(P.sel>=0){ lift(P.sel,false); P.sel=-1; }
  var h=P.hist.pop(); P.B=h.B; P.pours=h.pours; P.shut=P.B.map(function(b,i){ return G.full(b); }); BWK.sfx("tap");
  P.B.forEach(function(b,i){ draw(i); }); tools(); saveCur(); msg("Undone."); }
function reset(){ if(!P||busy||P.done||!P.hist.length) return; clearHint(); if(P.sel>=0){ lift(P.sel,false); P.sel=-1; }
  P.hist.push({B:G.clone(P.B),pours:P.pours}); P.B=G.clone(P.B0); P.pours=0; P.shut=P.B.map(function(b){ return G.full(b); });
  BWK.sfx("whoosh"); P.B.forEach(function(b,i){ draw(i); }); tools(); saveCur(); msg("Fresh start! (Undo brings your pours back.)"); }
function hint(auto){
  if(!P||busy||P.done) return; BWK.sfx("tap"); clearHint(); if(P.sel>=0){ lift(P.sel,false); P.sel=-1; }
  var s=G.solve(P.B);
  if(!s){ msg("Those potions are stuck. Let's undo a pour and try another way."); BWK.say(STUCK); setTimeout(undo,900); return; }
  var mv=s.path[0]; P.hints++; tools(); saveCur();
  EL[mv[0]].classList.add("ha"); EL[mv[1]].classList.add("hb");
  msg("Pour the gold-ringed bottle into the teal-ringed one."); var g=gen;
  setTimeout(function(){ if(g!==gen||busy||P.done) return; clearHint(); doPour(mv[0],mv[1]); },1400);
}
function starsOf(h){ return h===0?3:h<=2?2:1; }
function win(){
  P.done=true; saveCur(); var g=gen; tools();
  var fresh=BWG.patch("colorsort"); ST.n++; save();
  msg("All sorted!"); sWin();
  EL.forEach(function(e,i){ setTimeout(function(){ if(g===gen) e.classList.add("hop"); },150+i*110); });
  setTimeout(function(){ if(g!==gen) return; var s=starsOf(P.hints);
    var box=BWK.sheet('<h2>All sorted!</h2>'+BWG.patchLine(fresh)+'<div class="stars">'+"★★★".slice(0,s)+'<i>'+"★★★".slice(0,3-s)+'</i></div>'+
      '<p>You sorted the potions in <b>'+P.pours+'</b> pours'+(P.hints?' with '+P.hints+' hint'+(P.hints>1?'s':''):' with no hints')+'.'+
      (P.pours<=P.min?' That\'s the fewest pours possible!':' The fewest possible was '+P.min+'.')+'</p>'+
      '<p>'+(P.bonus?'Want to mix another batch?':'Come back tomorrow for new potions.')+'</p>'+
      '<div class="k-row"><button class="k-btn" data-a="more">Bonus Potions</button><button class="k-btn k-ghost" data-a="out">The Outpost</button></div>');
    box.querySelector('[data-a=more]').onclick=function(){ BWK.closeSheet(true); start(true); };
    box.querySelector('[data-a=out]').onclick=BWG.toOutpost;
    BWK.say(fresh?WINP:WIN);
  },1500);
}

/* ---------- keys on a computer: 1-7 pick a bottle, U undo, H hint ---------- */
document.addEventListener("keydown",function(e){ if(!document.body.classList.contains("m-play")||document.querySelector(".k-veil.on")) return;
  if(e.key>="1"&&e.key<="9"){ var i=+e.key-1; if(P&&i<P.B.length) tap(i); }
  else if(e.key==="u"||e.key==="U"||(e.key==="z"&&(e.metaKey||e.ctrlKey))) undo();
  else if(e.key==="h"||e.key==="H") hint(); });
function relayout(){ if(!P||!document.body.classList.contains("m-play")||!EL.length) return; if(busy){ setTimeout(relayout,500); return; }
  var sel=P.sel; build(); if(sel>=0) lift(sel,true); }
window.addEventListener("resize",function(){ requestAnimationFrame(relayout); });
if(window.ResizeObserver) new ResizeObserver(function(){ requestAnimationFrame(relayout); }).observe($("#shelf"));

/* ---------- menu ---------- */
function toMenu(){ gen++; busy=false; document.body.className="m-menu"; var t=today();
  var doneToday=ST.day===t.n&&ST.cur&&ST.cur.done;
  $("#bPlay").textContent=doneToday?"Today's Potions ✓":"Today's Potions";
  $("#mfoot").textContent=(ST.n?("Potions sorted: "+ST.n+". "):"")+DAYN[t.wd]+": "+FOOT[G.lvOf(t.wd)]; }
$("#bPlay").onclick=function(){ BWK.sfx("open"); start(false); };
$("#bHow").onclick=function(){ BWK.sheet('<div class="how"><h2>How to Play</h2><p>'+INTRO+'</p><p>'+HOW+'</p><p>Every potion has its own pattern: stars, waves, dots, stripes, rings and zigzags. When a bottle is full of one potion, it gets a cork.</p><p>On a computer, press 1-7 to pick a bottle, U to undo, H for a hint.</p></div>'); BWK.say(HOW); };
$("#bBack").onclick=BWG.toOutpost;
$("#tMenu").onclick=function(){ BWK.sfx("tap"); toMenu(); };
$("#tHint").onclick=function(){ hint(); };
$("#tUndo").onclick=undo; $("#tReset").onclick=reset;

var INTRO="Color Sort! Pour the space potions from bottle to bottle until every bottle holds just one color.";
var HOW="Tap a bottle to pick it up, then tap another bottle to pour. A potion can only go onto the same color, or into an empty bottle. Each pour counts as one move. Stuck? Tap Hint. Made a mistake? Tap Undo.";
var TAP1="Tap a bottle to pick it up.", PICK="Now tap the bottle to pour it into.";
var NOPE="Oops! A potion can only go onto the same color, or into an empty bottle.", FULL="That bottle is full!";
var STUCK="Uh oh, those potions are stuck. Let's undo a pour and try another way.";
var WIN="All sorted! Every bottle holds just one color. Come back tomorrow for new potions.", WINP="All sorted! You earned a new patch for your badge wall!";
var BONUS="Here are some bonus potions!";
var L={"cs-intro":INTRO,"cs-how":HOW,"cs-tap":TAP1,"cs-pick":PICK,"cs-nope":NOPE,"cs-full":FULL,"cs-stuck":STUCK,"cs-win":WIN,"cs-win-patch":WINP,"cs-bonus":BONUS};
POT.forEach(function(p,i){ L["cs-p"+i]=p.n+"!"; });
BWK.lines(L);
toMenu();
BWK.init({here:"colorsort", voice:"outpost", intro:INTRO, noHello:true});
window.CSO={start:start,tap:tap,hint:hint,undo:undo,reset:reset,
  solve:function(cb){ if(!P||P.done) return; var s=G.solve(P.B); if(!s) return; var k=0; (function nx(){ if(!P||P.done||k>=s.path.length){ if(cb) cb(); return; } var m=s.path[k++]; doPour(m[0],m[1],nx); })(); },
  state:function(){ return P&&{B:P.B,pours:P.pours,hints:P.hints,done:P.done,lv:P.lv,min:P.min,sel:P.sel,busy:busy,geo:GEO&&{r:GEO.r,bw:Math.round(GEO.bw),bh:Math.round(GEO.bh)}}; },lines:L,G:G};
})();
</script>
