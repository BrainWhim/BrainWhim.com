<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* ==========================================================================
   BrainWhim · Moonlets, the meadow (Nov 10, 2026)
   The photo kids-moonlets.jpg is the room. Finn rests on her cloud; four little moons each keep a spot:
   pink (bubbles + toy drum) = Music → the Moon Piano (open); blue (books + blocks) = Stories;
   green (garden bed) = Garden; purple (easel) = Colors. Soon spots: Finn says they're still waking up.
   Name stones: glowing moonstones like the meadow's stepping stones (Moonlets' own label look).
   Wide screens: the photo fills the screen. Tall screens: photo on top, four moon cards below.
   Living details: twinkling stars, fireflies, rising bubbles, lantern flicker, moon glows (transform/opacity only).
   ========================================================================== */
.world{position:fixed;inset:0;overflow:hidden;background:#050b1c}
.world::before{content:"";position:absolute;inset:-40px;background:url("kids-moonlets-sm.jpg") center/cover;filter:blur(24px) brightness(.35)}
.stage{--sw:min(max(100vw,150svh),168svh);position:absolute;left:50%;top:50%;width:var(--sw);aspect-ratio:3/2;
  transform:translate(-50%,-50%);background:url("kids-moonlets.jpg") center/cover no-repeat;
  animation:arrive 1s cubic-bezier(.2,.7,.3,1) both}
@media (max-width:1100px){.stage{background-image:url("kids-moonlets-sm.jpg")}}
@keyframes arrive{from{opacity:0;transform:translate(-50%,-50%) scale(1.12)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.stage.zoomIn{transition:transform .85s cubic-bezier(.5,0,.8,.4),opacity .85s;opacity:0;transform:translate(-50%,-50%) scale(2.4)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,8,22,.4),transparent 14%),radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(3,8,22,.4))}

/* living details */
.fx{position:absolute;pointer-events:none;border-radius:50%}
.lamp{transform:translate(-50%,-50%);aspect-ratio:1;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,206,120,.55),rgba(255,170,60,.16) 40%,transparent 68%);animation:fl 2.9s steps(1) infinite}
@keyframes fl{0%{opacity:.85}13%{opacity:.64}22%{opacity:.95}39%{opacity:.75}53%{opacity:1}68%{opacity:.7}82%{opacity:.92}}
.mglow{transform:translate(-50%,-50%);aspect-ratio:1;mix-blend-mode:screen;animation:mg 4.6s ease-in-out infinite}
@keyframes mg{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.94)}50%{opacity:.85;transform:translate(-50%,-50%) scale(1.06)}}
.star{width:.32%;aspect-ratio:1;background:#fff;box-shadow:0 0 6px 1px rgba(200,230,255,.9);animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.fly{width:.42%;aspect-ratio:1;background:radial-gradient(circle,#fff6b0,rgba(255,226,110,.6) 45%,transparent 70%);animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}35%{transform:translate(calc(var(--sw)*.012),calc(var(--sw)*-.01))}
  55%{opacity:.3}70%{transform:translate(calc(var(--sw)*-.008),calc(var(--sw)*-.022));opacity:1}100%{transform:translate(calc(var(--sw)*.004),calc(var(--sw)*-.03));opacity:0}}
.bub{width:1.4%;aspect-ratio:1;border:1px solid rgba(220,240,255,.75);
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.75) 0 12%,transparent 14%),radial-gradient(circle,rgba(150,200,255,.05) 55%,rgba(255,170,230,.28) 75%,rgba(160,240,255,.25));
  animation:bub 7s ease-in infinite}
@keyframes bub{0%{transform:translate(0,0) scale(.4);opacity:0}10%{opacity:.95}100%{transform:translate(calc(var(--sw)*.05),calc(var(--sw)*-.12)) scale(1.1);opacity:0}}

/* the title in the calm sky */
.title{position:absolute;left:18%;top:19%;width:26%;text-align:center;pointer-events:none}
.title b{display:block;font-size:calc(var(--sw)*.034);font-weight:700;letter-spacing:.02em;color:#fff7e2;line-height:1;
  text-shadow:0 0 calc(var(--sw)*.012) rgba(255,220,150,.55),0 2px 10px rgba(0,0,0,.5)}
.title i{display:block;font-style:normal;font-size:calc(var(--sw)*.012);margin-top:.5em;color:#dbe6ff;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* the spots in the photo */
.spot{position:absolute;appearance:none;border:0;padding:0;background:transparent;cursor:pointer;border-radius:40%}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.45;
  background:radial-gradient(ellipse at 50% 50%,var(--gl,rgba(255,226,150,.28)),transparent 66%);animation:pulse 3.8s ease-in-out infinite}
.spot:hover::before,.spot:focus-visible::before{opacity:1}
.spot:focus-visible{outline:3px solid rgba(255,230,160,.8);outline-offset:3px}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
#sFinn{left:48%;top:5%;width:28%;height:28%;--gl:rgba(255,236,180,.32)}
#sPink{left:12%;top:36%;width:27%;height:27%;--gl:rgba(255,150,210,.34)}
#sBlue{left:3%;top:64%;width:32%;height:29%;--gl:rgba(120,180,255,.3)}
#sGreen{left:67%;top:36%;width:31%;height:22%;--gl:rgba(140,240,150,.28)}
#sPurple{left:66%;top:60%;width:33%;height:37%;--gl:rgba(200,150,255,.3)}
#sPink::before{animation-duration:2.6s}

/* name stones: glowing moonstones, like the meadow's stepping stones */
.stone{position:absolute;white-space:nowrap;cursor:pointer;text-align:left;
  padding:.5em 1.2em .55em 2.3em;border-radius:1.4em 1.6em 1.3em 1.7em / 1.5em 1.3em 1.6em 1.4em;font-size:clamp(13px,calc(var(--sw)*.0112),22px);
  background:radial-gradient(120% 140% at 30% 20%,#fffaf0 0,#f4ead2 38%,#dccfae 72%,#c7b892 100%);
  border:1px solid rgba(255,244,214,.9);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -3px 6px rgba(140,118,70,.35),0 0 0 3px rgba(255,236,180,.16),
    0 0 calc(var(--sw)*.012) rgba(255,226,150,.55),0 6px 12px rgba(0,0,0,.45)}
.stone::before{content:"";position:absolute;left:.75em;top:50%;width:1.05em;height:1.05em;margin-top:-.52em;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--mc) 55%,var(--md));box-shadow:0 0 .6em var(--mc)}
.stone b{display:block;font-size:1.25em;font-weight:700;color:#2b2350;line-height:1.1}
.stone i{display:block;font-style:normal;color:#5b5076;font-size:.9em;margin-top:2px;font-weight:500}
.stone .soon{display:inline-block;margin-left:.45em;padding:0 .5em;border-radius:999px;background:rgba(43,35,80,.12);color:#5b5076;font-size:.7em;vertical-align:middle}
#sFinn .stone{--mc:#ffe9b0;--md:#d8b866;left:70%;top:62%}
#sPink .stone{--mc:#ff8fc8;--md:#c4447f;left:30%;top:88%}
#sBlue .stone{--mc:#8cc0ff;--md:#3b6fc4;left:100%;top:40%}
#sGreen .stone{--mc:#86e69a;--md:#2f9a4a;right:4%;top:-26%}
#sPurple .stone{--mc:#c9a2ff;--md:#7b4fc8;left:-30%;top:58%}
@media (min-aspect-ratio:5/4) and (max-height:520px){.stone{font-size:11px;padding:.35em .95em .4em 2.1em}.stone i{display:none}.title i{display:none}}

/* moon cards (tall screens only) */
.cards{display:none}
@media (max-aspect-ratio:5/4){
  .world{position:relative;inset:auto;min-height:100svh;display:flex;flex-direction:column;padding-top:calc(76px + var(--k-safe-t))}
  .world::before{display:none}
  .stage{--sw:min(100vw,56svh);position:relative;left:auto;top:auto;transform:none;margin:0 auto;flex:none;animation:none}
  .stage.zoomIn{transform:scale(2.2)}
  .stone{display:none}
  .title{top:16%}
  @media (max-width:699px){.title i{display:none}.title b{font-size:calc(var(--sw)*.05)}.title{top:17%;left:16%;width:34%}}
  .cards{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;padding:12px 14px calc(14px + var(--k-safe-b));flex:1}
  .card{position:relative;min-height:84px;display:flex;align-items:flex-end;border:0;padding:0;cursor:pointer;overflow:hidden;text-align:left;
    border-radius:22px;background-color:#0e1a36;background-image:url("kids-moonlets-sm.jpg");background-repeat:no-repeat;background-size:300% auto;
    border:1px solid rgba(255,236,190,.34);box-shadow:0 10px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .15s}
  .card:active{transform:scale(.97)}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,30,.05) 10%,rgba(5,12,30,.88) 88%)}
  .card .t{position:relative;z-index:1;padding:10px 12px 11px}
  .card b{display:block;font-size:19px;font-weight:700;color:#fff3d6;line-height:1.1}
  .card i{display:block;font-style:normal;font-size:13px;color:#d2dfee;margin-top:2px;line-height:1.25}
  .card .dot{position:absolute;z-index:1;top:10px;right:10px;width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--mc) 55%,var(--md));box-shadow:0 0 14px var(--mc)}
  .card .soon{position:absolute;z-index:1;top:14px;left:12px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:rgba(10,20,44,.7);color:#dbe6ff}
  #cPink{background-position:14% 50%;--mc:#ff8fc8;--md:#c4447f;border-color:rgba(255,160,210,.55)}
  #cBlue{background-position:10% 88%;--mc:#8cc0ff;--md:#3b6fc4}
  #cGreen{background-position:88% 50%;--mc:#86e69a;--md:#2f9a4a}
  #cPurple{background-position:86% 86%;--mc:#c9a2ff;--md:#7b4fc8}
}
@media (max-aspect-ratio:5/4) and (max-height:600px){.card i{display:none}.card b{font-size:17px}}
@media (max-aspect-ratio:5/4) and (min-width:700px){
  .cards{gap:16px;padding:20px 22px}
  .card b{font-size:26px}.card i{font-size:16px}.card .t{padding:16px 18px}.card .dot{width:42px;height:42px;top:14px;right:14px}
}
@media (prefers-reduced-motion:reduce){.fx,.spot::before{animation:none!important}}
</style>
</head>
<body>
<main class="world">
  <div class="stage" id="stage">
    <i class="fx lamp" style="left:11.5%;top:28%;width:7%"></i>
    <i class="fx lamp" style="left:85.5%;top:42%;width:5%;animation-delay:-1.3s"></i>
    <i class="fx mglow" style="left:62%;top:17%;width:22%;background:radial-gradient(circle,rgba(255,236,180,.42),transparent 62%)"></i>
    <i class="fx mglow" style="left:17.5%;top:49%;width:11%;background:radial-gradient(circle,rgba(255,140,200,.5),transparent 62%);animation-delay:-1s"></i>
    <i class="fx mglow" style="left:16%;top:74%;width:13%;background:radial-gradient(circle,rgba(110,170,255,.5),transparent 62%);animation-delay:-2.2s"></i>
    <i class="fx mglow" style="left:72.5%;top:49%;width:10%;background:radial-gradient(circle,rgba(130,240,140,.45),transparent 62%);animation-delay:-3s"></i>
    <i class="fx mglow" style="left:77%;top:71%;width:12%;background:radial-gradient(circle,rgba(200,150,255,.5),transparent 62%);animation-delay:-.4s"></i>
    <div id="fxs"></div>
    <div class="title" aria-hidden="true"><b>Moonlets</b><i>Tap a moon to play!</i></div>
    <button class="spot" id="sFinn" aria-label="Finn the guide moon"><span class="stone"><b>Finn</b><i>Tap to say hi</i></span></button>
    <button class="spot" id="sPink" aria-label="The pink moon: music"><span class="stone"><b>Music</b><i>The moon piano</i></span></button>
    <button class="spot" id="sBlue" aria-label="The blue moon: stories, still waking up"><span class="stone"><b>Stories<span class="soon">soon</span></b><i>Books and blocks</i></span></button>
    <button class="spot" id="sGreen" aria-label="The green moon: the garden, still growing"><span class="stone"><b>Garden<span class="soon">soon</span></b><i>Little sprouts</i></span></button>
    <button class="spot" id="sPurple" aria-label="The purple moon: colors, almost ready"><span class="stone"><b>Colors<span class="soon">soon</span></b><i>The paint easel</i></span></button>
  </div>
  <div class="cards">
    <button class="card" id="cPink"><i class="dot"></i><span class="t"><b>Music</b><i>The moon piano</i></span></button>
    <button class="card" id="cBlue"><i class="dot"></i><span class="soon">soon</span><span class="t"><b>Stories</b><i>Books and blocks</i></span></button>
    <button class="card" id="cGreen"><i class="dot"></i><span class="soon">soon</span><span class="t"><b>Garden</b><i>Little sprouts</i></span></button>
    <button class="card" id="cPurple"><i class="dot"></i><span class="soon">soon</span><span class="t"><b>Colors</b><i>The paint easel</i></span></button>
  </div>
</main>

<script src="kids.js?v=1109b"></script>
<script>
(function(){
  var HELLO="Welcome to Moonlets! I'm Finn. Tap the pink moon, and we can make music together!";
  var SOON={
    blue:["The story blocks are still waking up. Come back soon!","ml-soon-blue"],
    green:["The little garden is still growing. Come back soon!","ml-soon-green"],
    purple:["The paint easel is almost ready. Come back soon!","ml-soon-purple"]};
  BWK.lines({"ml-hello":HELLO});
  BWK.init({here:"moonlets", voice:"finn", intro:HELLO});
  BWK.store.set("door","moon");

  // living details: stars in the sky, fireflies over the grass, bubbles from the pink moon's wand
  var fx=document.getElementById("fxs"), h="";
  [[30,6],[44,9],[36,22],[80,8],[92,14],[86,26],[24,30],[55,36],[96,4],[70,30]].forEach(function(p,i){
    h+='<i class="fx star" style="left:'+p[0]+'%;top:'+p[1]+'%;animation-delay:-'+(i*0.7)+'s"></i>'; });
  [[30,70],[46,58],[52,82],[62,66],[40,90],[88,56],[8,58],[58,48]].forEach(function(p,i){
    h+='<i class="fx fly" style="left:'+p[0]+'%;top:'+p[1]+'%;animation-delay:-'+(i*1.1)+'s;animation-duration:'+(8+i%3*1.5)+'s"></i>'; });
  [0,1,2,3].forEach(function(i){ h+='<i class="fx bub" style="left:'+(25+i*1.6)+'%;top:'+(47-i*1.5)+'%;animation-delay:-'+(i*1.75)+'s"></i>'; });
  fx.innerHTML=h;

  var hi=false;
  function hello(){ hi=true; BWK.finn(HELLO,{clip:"ml-hello"}); }
  function piano(){
    BWK.sfx("whoosh"); BWK.finnStop();
    var st=document.getElementById("stage"); st.style.transformOrigin="24% 48%"; st.classList.add("zoomIn");
    setTimeout(function(){ location.href="moonlets-piano.html"; },850);
  }
  function soon(k){ hi=true; BWK.finn(SOON[k][0],{clip:SOON[k][1]}); }
  var on=function(id,f){ document.getElementById(id).onclick=f; };
  on("sFinn",hello); on("sPink",piano); on("cPink",piano);
  ["blue","green","purple"].forEach(function(k){ var K=k.charAt(0).toUpperCase()+k.slice(1);
    on("s"+K,function(){soon(k);}); on("c"+K,function(){soon(k);}); });
  // the first tap on the meadow itself (not a moon, not the header) wakes Finn for a hello
  document.addEventListener("click",function(e){
    if(hi || e.target.closest(".spot,.card,.k-head,.k-sheet,.k-veil,.k-finn")) return; hello(); });
  window.addEventListener("pageshow",function(){ document.getElementById("stage").classList.remove("zoomIn"); });
})();
</script>
</body>
</html>
