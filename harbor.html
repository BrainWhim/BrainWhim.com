/* ===== The Harbor (Puzzles & Brain Games, Nov 1): a daily sliding puzzle on a harbormaster's chart table =====
   A pale oak tray of blue water, six berths by six, with the harbor mouth in the right side of the third row.
   Carved model boats lie in it; each slides only along its own line. Slide them until your red sloop can sail out.
   Harbors (the Harbors card): Oak & Blue Water (free); Teak & Green Water, White & Navy (Club).
   Light comes from the top left everywhere: highlights on top and left edges, shade and shadows to the bottom right. */
body{--f1:#f1dfba;--f2:#d9bd8a;--f3:#b08d58;--f4:#7d5f34;--ff1:#a7834f;--ff2:#6f532c;--w1:#7fc4dc;--w2:#3d8fb4;--w3:#1f5f86;--w4:#123e5c;--b1:#fff3c8;--b2:#f0d48a;--b3:#d4ab52;--b4:#a07a2a;--b5:#5e430f;--bt:#4a3410}
body[data-set="teak"]{--f1:#d9a878;--f2:#b07a48;--f3:#8a5a30;--f4:#5a3518;--ff1:#7a5030;--ff2:#4a2c14;--w1:#8fd0c0;--w2:#3f9a8c;--w3:#226b62;--w4:#12443e}
body[data-set="white"]{--f1:#ffffff;--f2:#eef0f2;--f3:#c9ced6;--f4:#8d96a3;--ff1:#c3c9d2;--ff2:#8a929e;--w1:#6f9fd0;--w2:#2f5f9a;--w3:#1b3e70;--w4:#0f2648}
.hb-mono{font:500 1em Montserrat,sans-serif;white-space:nowrap}.hb-mono i{font:400 .76em Pacifico,cursive;font-style:normal}
.hb-pad{position:relative;flex:none;display:grid;grid-template-columns:auto auto;gap:18px;align-items:start;justify-content:center}
.hb-left{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.hb-right{display:flex;flex-direction:column;gap:10px;width:var(--hb-nw,270px)}
/* ---------- the tray: one SVG (frame, water, mouth), with the boats laid over it ---------- */
.hb-board{position:relative;overflow:clip;width:var(--hb-bw,600px);aspect-ratio:780/724;container-type:inline-size;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.hb-board>svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.hb-shimmer{position:absolute;left:6.154%;top:6.63%;width:76.92%;height:82.87%;pointer-events:none;opacity:.5;
  background:repeating-radial-gradient(ellipse 60% 22% at 30% 40%,transparent 0 14px,rgba(255,255,255,.07) 15px 16px,transparent 17px 30px);background-size:180px 120px;animation:hb-sh 14s linear infinite}
body.pk-still .hb-shimmer,.hb-board.calm .hb-shimmer{animation:none}
@keyframes hb-sh{to{background-position:180px 60px}}
/* berths a lifted boat can slide to */
.hb-path{position:absolute;z-index:1;border-radius:2cqw;background:rgba(255,236,170,.16);box-shadow:inset 0 0 0 .35cqw rgba(255,226,140,.55);pointer-events:none;opacity:0;transition:opacity .15s}
.hb-path.on{opacity:1;pointer-events:auto;cursor:pointer}
/* the boats: carved models; the shadow lies on the water to the bottom right, and grows when a boat is lifted */
.hb-boat{position:absolute;z-index:2;cursor:grab;transition:left .22s cubic-bezier(.3,1.2,.5,1),top .22s cubic-bezier(.3,1.2,.5,1)}
.hb-boat svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.hb-boat .sh{transition:transform .2s,opacity .2s}
.hb-boat .lift{position:absolute;inset:0;transition:transform .2s cubic-bezier(.3,1.5,.6,1)}
.hb-boat.up{z-index:4}
.hb-boat.up .lift{transform:translate(-1.5%,-5%) scale(1.05)}
.hb-boat.up .sh{transform:translate(4%,7%) scale(1.04);opacity:.6}
.hb-boat.drag{transition:none;z-index:5;cursor:grabbing}
.hb-boat.snap{transition:transform .2s cubic-bezier(.3,1.25,.5,1)}
.hb-boat .ring{position:absolute;inset:-1.4cqw;border-radius:3cqw;box-shadow:0 0 0 .6cqw rgba(255,214,110,0);pointer-events:none}
.hb-boat.glow .ring{animation:hb-glow 1.1s ease-in-out infinite}
@keyframes hb-glow{0%,100%{box-shadow:0 0 0 .4cqw rgba(255,211,107,.35)}50%{box-shadow:0 0 0 1.1cqw rgba(255,211,107,1)}}
.hb-boat.hint .ring{animation:hb-hint 1s ease 3}
@keyframes hb-hint{0%,100%{box-shadow:0 0 0 .3cqw rgba(255,211,107,0)}50%{box-shadow:0 0 0 1.4cqw rgba(255,211,107,1),0 0 3cqw rgba(255,211,107,.7)}}
.hb-boat.bump .lift{animation:hb-bump .28s ease}
@keyframes hb-bump{30%{transform:translate(var(--bx,0),var(--by,0))}}
.hb-boat .sail{transform-origin:var(--mx,60%) 50%;transform:scaleX(0);opacity:0;transition:transform .6s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.hb-boat.sailing .sail{transform:none;opacity:1}
.hb-boat.out{transition:left 1.6s cubic-bezier(.5,0,.6,1),opacity .6s 1.1s;opacity:0}
/* the reveal: gulls cross, the water sparkles, a brass sign drops in */
.hb-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.hb-fx .gull{position:absolute;width:7cqw;height:3cqw;animation:hb-gull 3.4s linear forwards}
@keyframes hb-gull{0%{transform:translate(0,0)}100%{transform:translate(var(--gx,110cqw),var(--gy,-20cqw))}}
.hb-fx .gull path{animation:hb-flap .5s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes hb-flap{to{transform:scaleY(.45)}}
.hb-fx .spark{position:absolute;width:1.6cqw;height:1.6cqw;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);opacity:0;animation:hb-spark 1.4s ease-in-out forwards}
@keyframes hb-spark{30%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.4)}}
.hb-sign{position:absolute;left:43%;top:44%;z-index:9;transform:translate(-50%,-50%) rotate(-5deg);padding:1.2cqw 3.2cqw 1cqw;border-radius:1cqw;font:700 italic 6cqw/1 Cormorant Garamond,serif;letter-spacing:.04em;color:#3b2a0c;white-space:nowrap;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.55),transparent 50%),linear-gradient(180deg,#fbe7a6,#d9b25a 45%,#a8802c);box-shadow:0 0 0 1px #7a5a1e,inset 0 1px 0 rgba(255,255,255,.7),2px 6px 12px rgba(0,0,0,.45);opacity:0;pointer-events:none}
.hb-sign.on{animation:hb-signin .5s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes hb-signin{0%{opacity:0;transform:translate(-50%,-50%) rotate(-5deg) scale(1.8)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-5deg) scale(1)}}
.hb-toast{position:absolute;z-index:10;left:50%;top:2px;transform:translateX(-50%);width:max-content;max-width:94%;padding:8px 14px;border-radius:12px;background:rgba(15,23,42,.92);border:1px solid rgba(231,199,122,.6);color:#fff;font:600 14px/1.4 Montserrat,sans-serif;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.hb-toast.on{opacity:1}
/* ---------- the Harbor Log: a ship's log page ---------- */
.hb-notes{position:relative;border-radius:3px;color:#1f2a3a;padding:12px 14px 12px 16px;
  background:repeating-linear-gradient(180deg,transparent 0 21px,rgba(40,80,140,.16) 21px 22px),radial-gradient(ellipse at 25% 10%,rgba(255,255,255,.6),transparent 60%),linear-gradient(170deg,#fbf8ee,#f0e9d4 60%,#e3dabd);
  background-position:0 6px,0 0,0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -12px 16px -12px rgba(80,90,110,.25),0 1px 1px rgba(0,0,0,.25),2px 9px 16px rgba(10,20,40,.42)}
.hb-notes::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#1c3554,#2d5280)}
.hb-notes h2{margin:0 0 1px;font:700 19.5px/1.12 Cormorant Garamond,serif;color:#1c3554}
.hb-notes .hb-no{display:block;margin:0 0 6px;font:600 10.5px Montserrat,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6a7a8e}
.hb-goal{margin:0 0 6px;font:600 13px/1.35 Montserrat,sans-serif;color:#1c3554}
.hb-rules{margin:0;padding:0 0 0 16px;font:500 13px/1.42 Montserrat,sans-serif}
.hb-rules li{padding:1px 0}
.hb-rule1{display:none;margin:0;font:500 12px/1.35 Montserrat,sans-serif}
.hb-tally{display:flex;gap:8px;margin:8px 0 0;padding:6px 0 0;border-top:1px dashed rgba(28,53,84,.35)}
.hb-tally div{flex:1;text-align:center}
.hb-tally b{display:block;font:700 26px/1 Cormorant Garamond,serif;color:#1c3554;font-variant-numeric:lining-nums}
.hb-tally small{font:600 10px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6a7a8e}
.hb-tally b.over{color:#9c2418}
.hb-day{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;margin:6px 0 0;font:600 12px Montserrat,sans-serif;color:#4a5a6e}
.hb-day b{color:#1c3554}
.hb-stampmark{position:absolute;right:12px;bottom:34px;padding:2px 8px;border:2.5px solid #1f5c9c;border-radius:4px;color:#1f5c9c;font:700 14px Montserrat,sans-serif;letter-spacing:.12em;transform:rotate(-12deg) scale(1.6);opacity:0;pointer-events:none;mix-blend-mode:multiply}
.hb-stampmark.on{animation:hb-stampm .35s cubic-bezier(.3,1.6,.6,1) forwards}
@keyframes hb-stampm{100%{opacity:.85;transform:rotate(-12deg) scale(1)}}
/* ---------- tools ---------- */
.hb-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:7px;border-radius:12px;background:rgba(15,23,42,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.hb-tools .pk-btn{width:auto;margin:0;padding:8px 10px;min-height:0;white-space:nowrap}
.hb-tools .pk-btn.gold{grid-column:1 / -1;border-color:rgba(231,199,122,.75);color:#f0d27a;background:rgba(212,175,55,.16)}
.hb-tools .pk-btn:disabled{opacity:.45}
.hb-ringbtn{animation:hb-ringbtn 1.1s ease 2}
@keyframes hb-ringbtn{50%{box-shadow:0 0 0 5px rgba(240,210,122,.6)}}
/* ---------- the result window ---------- */
.hb-stars{font-size:30px;letter-spacing:6px;color:#f0d27a;text-shadow:0 2px 10px rgba(240,210,122,.45);margin:2px 0 6px;text-align:center}
.hb-stars i{font-style:normal;color:rgba(255,255,255,.22);text-shadow:none}
.hb-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px}
.hb-facts div{border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:7px 4px;text-align:center;background:rgba(255,255,255,.04)}
.hb-facts b{display:block;font:700 17px Montserrat,sans-serif;color:#fff}
.hb-facts small{font:600 10px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.hb-neat{margin:6px 0 0;text-align:center;font:600 12.5px/1.4 Montserrat,sans-serif;color:#f0d27a}
.hb-neat.plain{color:rgba(255,255,255,.75)}
.hb-story{display:flex;gap:12px;align-items:flex-start;margin:10px 0 4px;padding:11px 13px;border-radius:10px;background:linear-gradient(180deg,rgba(251,248,238,.97),rgba(240,233,212,.97));color:#1f2a3a;text-align:left}
.hb-story .hb-med{flex:none;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 36% 30%,#fff3c8,#f0d48a 30%,#d4ab52 60%,#a07a2a 90%);box-shadow:0 0 0 2px #7a5a1e,inset 0 -3px 5px rgba(0,0,0,.3),inset 0 2px 2px rgba(255,255,255,.6);font:700 20px/1 Montserrat,sans-serif;color:#4a3410;text-shadow:0 1px 0 rgba(255,250,225,.6)}
#hbEnd .hb-story h3{margin:0 0 1px;text-align:left;font:700 19px/1.15 Cormorant Garamond,serif;color:#1c3554}
#hbEnd .hb-story .hb-kind{margin:0 0 3px;font:600 10.5px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6a7a8e;text-align:left}
#hbEnd .hb-story p{margin:0;font:500 13px/1.45 Montserrat,sans-serif;color:#1f2a3a;text-align:left}
#hbEnd .hb-story p.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hb-story .hb-rm{display:inline-block;margin-top:3px;padding:0;border:0;background:none;color:#1c3554;font:700 12px Montserrat,sans-serif;text-decoration:underline;cursor:pointer}
.hb-note{font:500 12.5px/1.5 Montserrat,sans-serif;color:rgba(255,255,255,.78);text-align:center;margin:6px 0 0}
#hbEnd .pk-row .pk-btn{flex:1 1 40%}

<script id="hbCore">
/* ===== The Harbor core (the marina, the harbormaster's search, the graded daily pool): shared by the page and the tests =====
   A 6 × 6 marina. Each boat lies along a row (sideways) or a column (up and down) and slides only along that line.
   Your sailboat (boat 0) lies in the third row; it sails out through the harbor mouth on the right once it reaches
   the last two berths. One move = one boat slid any distance.
   The pool: every puzzle was grown offline (tools/harbor/), and graded by the fewest moves that free the sailboat,
   checked with a full search. Each weekday has its own band of puzzles; the day picks one by week (see pickDay), and the
   boats' paint changes with the date. */
(function(root){
"use strict";
function rng(seed){ var h=1779033703^seed.length; for(var i=0;i<seed.length;i++){ h=Math.imul(h^seed.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); h^=h>>>16; return (h>>>0)/4294967296; }; }
function shuffle(a,r){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var N=6, EXIT=2;   /* EXIT: the sloop's row in the pool; a mirrored day puts it in row 3 */
/* the week: d = the band of fewest moves (set Nov 1 from the pool; tools/harbor/check-year.js checks a year) */

  onNew:function(){ var nb=document.querySelectorAll(".pk-menu .pk-btn, .pk-bar .pk-btn.primary"); [].forEach.call(nb,function(b){ if(b.textContent==="New Game") b.textContent="Today's Puzzle"; }); startDaily(true); },
  lesson:{steps:LESSONS,setup:lessonSetup,practice:startPractice,hint:lessonHint}
});
var wasSeated=false, wasCoach=false;
new MutationObserver(function(){ var now=seatedNow(), co=document.body.classList.contains("pk-coaching"); if(now===wasSeated&&co===wasCoach) return; wasSeated=now; wasCoach=co; setTimeout(fit,30); setTimeout(fit,400); }).observe(document.body,{attributes:true,attributeFilter:["class"]});
document.addEventListener("DOMContentLoaded",function(){ tools(); startDaily(false); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ fit(); });
/* for testing */
window.HBO={get:function(){ return {P:P.slice(),d:PZ.d,moves:moveCount(),hints:hints,done:done,mode:mode,sel:sel,boats:PZ.B.length,names:PZ.looks.map(function(l){ return l.name; })}; },slide:slide,hint:hint,undo:undo,restart:restart,tap:tapBoat,solve:function(){ return HB.solve(PZ.B,P); }};
})();
</script>
