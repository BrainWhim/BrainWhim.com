  if(online)Parlor.names(mySide==="b"?["Opponent ("+n[0]+")","You ("+n[1]+")"]:["You ("+n[0]+")","Opponent ("+n[1]+")"]);
  else Parlor.names(["You ("+n[0]+")","The House ("+n[1]+")"]);}
/* preview: chess-preview.html opens this page with ?preview=1, which shows a picker for the boards and the piece sets */

    b.onclick=function(){previewPick=k;document.body.setAttribute("data-set",k);mark();};r1.appendChild(b);});

    b.onclick=function(){setPieces(k);try{localStorage.setItem("bwChessPieces",k);}catch(e){}mark();};r2.appendChild(b);});
  bar.appendChild(r1);   /* each board brings its own pieces, so there is no separate pieces row */
  function mark(){[].forEach.call(r1.querySelectorAll("button"),function(b){b.classList.toggle("on",b.dataset.k===(previewPick||curDesign));});
    [].forEach.call(r2.querySelectorAll("button"),function(b){b.classList.toggle("on",b.dataset.p===curSet);});}

/* ---------- the stage ---------- */

  '<div class="cs-layer" id="csPcs"></div><div class="cs-promo" id="csPromo" hidden><p>Promote to</p></div></div>';

function vpos(i){var v=flipped()?63-i:i;return {r:v>>3,c:v&7};}
function layout(){for(var i=0;i<64;i++){var p=vpos(i);fx[i].style.left=(B0+p.c*SQ)+"%";fx[i].style.top=(B0+p.r*SQ)+"%";}}

/* captured pieces rest on the table between the board and the rim: yours near you, the opponent's on the far side */

/* ---------- game state ---------- */
var S=chStart(),hist=[posKey(S)],over=false,result=null,last=null,took={w:[],b:[]},seq=0;
var legalNow=[],sel=-1,busy=false,hidden=-1,crownAt=-1,thinking=false;
var mySide="w",online=false,sb=null,room=null,me=null,reported=false,CODE=(location.search.match(/[?&](?:code|match_id)=([A-Za-z0-9]+)/)||[])[1];
function seatedNow(){return document.body.classList.contains("seated");}
function nearSide(){return online?(mySide||"w"):"w";}
function pcHTML(p,cls,x,y,em){var u=p.toUpperCase();return '<div class="cs-pc'+(cls||"")+'" style="left:'+x+'%;top:'+y+'%"><img alt="" draggable="false" src="'+pieceSrc(p)+'" style="height:'+(PH[u]*(em||1)).toFixed(2)+'em"></div>';}

function destsOf(f){return legalNow.filter(function(m){return m.f===f;});}

  if(!curDesign)return;
  var mine=!online||S.turn===mySide,myTurn=mine&&S.turn===(online?mySide:"w")&&!over&&seatedNow(),mv=(busy||over||!seatedNow())?{}:movers(),ds=sel>=0&&!busy?destsOf(sel):[];
  var h="",order=[];for(var vi=0;vi<64;vi++)order.push(flipped()?63-vi:vi);
  order.forEach(function(i){var p=S.b[i];if(!p||i===hidden)return;var c=sqCenter(i),cls="";
    if(mv[i]){cls+=myTurn?" can":" them";if(myTurn&&sel>=0&&sel!==i)cls+=" dim";}
    if(i===sel&&!busy)cls+=" sel";if(i===crownAt)cls+=" crowned";if(drag&&drag.moved&&drag.f===i)cls+=" hide";
    h+=pcHTML(p,cls,c.x,c.y+SQ*.3);});
  pcL.innerHTML=h;
  var lf=last?last.f:-1,lt=last?last.t:-1,ck=(!over&&inCheck(S))?kingSq(S.b,S.turn==="w"):-1;
  for(var i=0;i<64;i++){var cl=fx[i].classList;cl.toggle("lastf",i===lf&&sel<0);cl.toggle("lastt",i===lt&&sel<0);cl.toggle("check",i===ck);cl.toggle("selsq",i===sel&&!busy);
    var d=ds.filter(function(m){return m.t===i;})[0];cl.toggle("dest",!!d);cl.toggle("cap",!!(d&&d.cap));}
  /* captured pieces */
  var t="",near=nearSide();
  ["w","b"].forEach(function(side){took[side].forEach(function(p,n){var q=traySpot(side===near,n);t+=pcHTML(p,"",q.x,q.y+2.4,.5);});});

function material(side){var v=0;took[side].forEach(function(p){v+=({P:1,N:3,B:3,R:5,Q:9}[p.toUpperCase()]||0);});return v;}

function say(a,b){Parlor.status(a,b||"");}
function msg(){
  if(over)return;
  if(online&&room&&!room.guest){say("Waiting for a player","Share your table code: "+(CODE||""));return;}
  var chk=inCheck(S);
  if(S.turn===(online?mySide:"w"))say(chk?"Check!":"Your move",chk?"Get your king out of check":"Tap or drag a glowing piece to a gold dot");
  else say(online?"Opponent's move":"The House is thinking…",chk?"The House is in check":"");
  Parlor.info(S.half>=60?("No capture or pawn move for "+Math.floor(S.half/2)+" moves · a draw at 50"):"Captured material beside each name");

/* ---------- moving: every move floats along an arc; captures float to the captor's side of the table ---------- */
function emPx(){return scene.getBoundingClientRect().width/150;}
function floatPiece(p,from,to,dur){return new Promise(function(res){
  if(!Parlor.smooth()){res();return;}
  var e=document.createElement("div");e.innerHTML=pcHTML(p,"",from.x,from.y);e=e.firstChild;e.style.zIndex=50;pcL.appendChild(e);
  var t0=performance.now(),dist=Math.hypot(to.x-from.x,to.y-from.y),D=dur||Math.min(760,380+dist*14),lift=Math.min(9,2.5+dist*.35);
  Parlor.sfx("whoosh");
  (function tick(now){var k=Math.min(1,(now-t0)/D),q=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,up=Math.sin(Math.PI*k)*lift;
    e.style.left=(from.x+(to.x-from.x)*q)+"%";e.style.top=(from.y+(to.y-from.y)*q-up)+"%";e.firstChild.style.transform="translate(-50%,-100%) scale("+(1+.08*Math.sin(Math.PI*k))+")";
    if(k<1)requestAnimationFrame(tick);else{e.remove();res();}})(t0);});}
function spot(i){var c=sqCenter(i);return {x:c.x,y:c.y+SQ*.3};}
async function animate(m,side,fromXY){
  var p=S.b[m.f],capSq=m.ep?m.t+(side==="w"?8:-8):m.t,cp=m.cap?S.b[capSq]:"";
  hidden=m.f;paint();
  await floatPiece(p,fromXY||spot(m.f),spot(m.t));
  /* commit to the board */
  var u=make(S,m);hidden=-1;last={f:m.f,t:m.t};
  if(cp){took[side].push(cp);}
  Parlor.sfx("place");paint();
  if(cp){/* the captured piece floats to the captor's side */
    var n=took[side].length-1,q=traySpot(side===nearSide(),n),fromC=spot(capSq);took[side].pop();paint();
    var tmp=document.createElement("div");tmp.innerHTML=pcHTML(cp,"",fromC.x,fromC.y);
    await Parlor.wait(120);await floatPiece(cp,fromC,{x:q.x,y:q.y+2.4},560);took[side].push(cp);Parlor.sfx("tile",{pitch:1.25});paint();}
  if(m.castle){var rf,rt;if(m.t===62){rf=63;rt=61;}else if(m.t===58){rf=56;rt=59;}else if(m.t===6){rf=7;rt=5;}else{rf=0;rt=3;}
    /* the rook was already moved by the rules; float it across for the eye */
    var rp=S.b[rt];hidden=rt;paint();await floatPiece(rp,spot(rf),spot(rt),480);hidden=-1;Parlor.sfx("place");paint();}
  if(m.promo){crownAt=m.t;Parlor.sfx("mill");paint();setTimeout(function(){crownAt=-1;paint();},700);}
  return u;
}
async function playMove(m,side,fromXY){
  busy=true;sel=-1;paint();
  await animate(m,side,fromXY);
  seq++;hist.push(posKey(S));busy=false;
  var st=status(S,hist);
  legalNow=st?[]:legal(S);
  if(st){over=true;result=st;}
  if(!over&&inCheck(S))Parlor.sfx("flip",{pitch:.8});
  paint();if(over)end();else msg();
  if(online&&side===mySide)push(m);
  if(!online&&!over&&S.turn==="b")setTimeout(houseMove,700);
}

/* ---------- your input: tap or drag (one layer over the table; a tap on a standing piece's head counts as that piece) ---------- */
var drag=null;
function localPct(e){var r=scene.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};}
function squareAt(q){var c=Math.floor((q.x-B0)/SQ),r=Math.floor((q.y-B0)/SQ);if(c<0||c>7||r<0||r>7)return -1;var v=r*8+c;return flipped()?63-v:v;}
function pieceAt(e){   /* the piece whose image is under the pointer (front pieces first) */
  var imgs=[].slice.call(pcL.querySelectorAll(".cs-pc img")).reverse();
  for(var k=0;k<imgs.length;k++){var b=imgs[k].getBoundingClientRect(),w=b.width*.2;if(e.clientX>b.left+w&&e.clientX<b.right-w&&e.clientY>b.top+b.height*.08&&e.clientY<b.bottom){
    var q=localPct({clientX:(b.left+b.right)/2,clientY:b.bottom-2});var sq=squareAt({x:q.x,y:q.y-SQ*.3});if(sq>=0&&S.b[sq])return sq;}}
  return -1;}
function canAct(){return !busy&&!over&&seatedNow()&&S.turn===(online?mySide:"w")&&!(online&&(!room||!room.guest))&&promoEl.hidden;}
scene.addEventListener("pointerdown",function(e){
  if(e.button>0||!canAct())return;if(e.target.closest&&e.target.closest(".cs-promo"))return;
  var q=localPct(e),sq=squareAt(q),pc=pieceAt(e),mv=movers();
  /* when a piece is chosen and you tap one of its gold dots, that's a move, even if another piece's head overlaps the spot */
  var from=(sel>=0&&destsOf(sel).some(function(m){return m.t===sq;}))?-1:(mv[pc]?pc:(mv[sq]?sq:-1));
  drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,sq:sq,pc:pc,f:from,moved:false,touch:e.pointerType==="touch"};
  try{scene.setPointerCapture(e.pointerId);}catch(x){}
});
scene.addEventListener("pointermove",function(e){
  if(!drag||drag.id!==e.pointerId||drag.f<0)return;var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved){if(dx*dx+dy*dy<64)return;drag.moved=true;if(sel!==drag.f){sel=drag.f;}paint();
    var d=document.createElement("div");d.innerHTML=pcHTML(S.b[drag.f],"",0,0);drag.el=d.firstChild;drag.el.classList.add("drag");pcL.appendChild(drag.el);}
  var q=localPct(e);drag.at={x:q.x,y:q.y+(drag.touch?-1:SQ*.3)};drag.el.style.left=drag.at.x+"%";drag.el.style.top=drag.at.y+"%";
});
function endDrag(e,cancel){
  if(!drag||drag.id!==e.pointerId)return;var d=drag;drag=null;
  if(d.el)d.el.remove();
  if(!d.moved){if(!cancel)tapAt(d.sq,d.pc);return;}
  var q=localPct(e),to=squareAt(q);
  if(!cancel&&to>=0&&destsOf(d.f).some(function(m){return m.t===to;})){sel=d.f;tryMove(d.f,to,d.at);}else paint();
}
scene.addEventListener("pointerup",function(e){endDrag(e,false);});
scene.addEventListener("pointercancel",function(e){endDrag(e,true);});
function tapAt(sq,pc){
  if(!canAct())return;
  if(sel>=0&&sq>=0&&destsOf(sel).some(function(m){return m.t===sq;})){tryMove(sel,sq);return;}
  var mv=movers(),pick=mv[pc]?pc:(mv[sq]?sq:-1);
  if(pick>=0){if(pick!==sel){sel=pick;Parlor.sfx("click",{pitch:.8});paint();}return;}
  if(sel>=0){sel=-1;paint();}
}
function tryMove(f,t,fromXY){
  var ms=legalNow.filter(function(m){return m.f===f&&m.t===t;});if(!ms.length)return;
  if(ms[0].promo){askPromo(function(pr){var m=ms.filter(function(x){return x.promo===pr;})[0]||ms[0];playMove(m,mySide,fromXY);});return;}
  playMove(ms[0],mySide,fromXY);
}
function askPromo(cb){
  [].slice.call(promoEl.querySelectorAll("button")).forEach(function(b){b.remove();});
  ["q","r","b","n"].forEach(function(pr){var b=document.createElement("button");b.type="button";var p=mySide==="w"?pr.toUpperCase():pr;
    b.innerHTML='<img alt="'+({q:"Queen",r:"Rook",b:"Bishop",n:"Knight"})[pr]+'" src="'+pieceSrc(p)+'">';
    b.onclick=function(e){e.stopPropagation();promoEl.hidden=true;cb(pr);};promoEl.appendChild(b);});
  promoEl.hidden=false;
}

/* ---------- The House, thinking in the background (a web worker) so the page never freezes ---------- */
var worker=null;
try{var src=document.getElementById("csEngine").textContent+"\nonmessage=function(e){var d=e.data;var m=think(d.s,d.sk,d.hist);postMessage(m?{f:m.f,t:m.t,promo:m.promo||null}:null);};";
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));}catch(e){worker=null;}
function askHouse(){return new Promise(function(res){var d={s:cloneS(S),sk:Parlor.skill(),hist:hist.slice()};
  if(!worker){setTimeout(function(){var m=think(d.s,d.sk,d.hist);res(m);},30);return;}
  worker.onmessage=function(e){res(e.data);};worker.onerror=function(){worker=null;res(think(d.s,d.sk,d.hist));};worker.postMessage(d);});}
async function houseMove(){
  if(over||online||S.turn!=="b"||busy||thinking)return;thinking=true;var my=seq,t0=Date.now();
  var r=await askHouse();thinking=false;if(my!==seq||over)return;
  var wait=Math.max(0,800-(Date.now()-t0));if(wait)await Parlor.wait(wait);
  if(!r)return;var m=legalNow.filter(function(x){return x.f===r.f&&x.t===r.t&&(x.promo||null)===(r.promo||null);})[0];if(m)playMove(m,"b");
}
function end(){
  var w=result.winner,kind=!w?"draw":(w===(online?mySide:"w")?"win":"lose"),n=colorNames();
  var why={checkmate:"Checkmate",stalemate:"Stalemate: no legal move, but not in check",fifty:"Fifty moves each without a capture or pawn move",material:"Neither side can checkmate with what's left",repetition:"The same position three times"}[result.why]||"";
  var detail=w?(cap(w==="w"?n[0]:n[1])+" wins by checkmate"):why;
  say(kind==="win"?"Checkmate: you win!":kind==="draw"?"Draw":"Checkmate",why);

}
function cap(w){return w.charAt(0).toUpperCase()+w.slice(1);}
function newGame(){
  S=chStart();hist=[posKey(S)];over=false;result=null;last=null;took={w:[],b:[]};seq++;sel=-1;busy=false;hidden=-1;thinking=false;
  legalNow=legal(S);promoEl.hidden=true;paint();msg();
}

/* ---------- online: coming in the room step (the old chess table format is kept). ---------- */
/* ---------- online table (same page: ?code= or ?match_id=). The saved format matches the old chess room:
   {board: 8x8 letters, turn, last:[r,c,r,c], over, rights:{wk,wq,bk,bq}, ep:[r,c]|null, you: white's captures, bot: black's captures}
   plus winner (1 white / 2 black / 0 draw), why, half, full, seq and mv ({f,t,promo,side}) so the other player's move floats in ---------- */
function rowsOf(b){var o=[];for(var r=0;r<8;r++)o.push(b.slice(r*8,r*8+8));return o;}
function snapshot(m){var cr=S.cr;
  return {board:rowsOf(S.b),turn:S.turn,last:last?[last.f>>3,last.f&7,last.t>>3,last.t&7]:null,over:over,
    rights:{wk:cr.indexOf("K")>=0?1:0,wq:cr.indexOf("Q")>=0?1:0,bk:cr.indexOf("k")>=0?1:0,bq:cr.indexOf("q")>=0?1:0},
    ep:S.ep>=0?[S.ep>>3,S.ep&7]:null,you:took.w.slice(),bot:took.b.slice(),
    winner:over&&result?(result.winner==="w"?1:result.winner==="b"?2:0):0,why:over&&result?result.why:null,half:S.half,full:S.full,seq:seq,
    mv:m?{f:m.f,t:m.t,promo:m.promo||null,side:m.side}:null};}
var PIECE=/^[pnbrqkPNBRQK]$/;
function okBoard(b){if(!Array.isArray(b)||b.length!==8)return false;for(var r=0;r<8;r++){if(!Array.isArray(b[r])||b[r].length!==8)return false;for(var c=0;c<8;c++){var v=b[r][c];if(v!=null&&v!==""&&!PIECE.test(String(v)))return false;}}return true;}
function okTray(a){if(a==null)return true;if(!Array.isArray(a)||a.length>32)return false;for(var i=0;i<a.length;i++)if(!PIECE.test(String(a[i])))return false;return true;}
function applySnap(s){
  if(!s||!s.board||!okBoard(s.board)||!okTray(s.you)||!okTray(s.bot)){S=chStart();took={w:[],b:[]};last=null;over=false;result=null;seq=0;}
  else{var b=[];for(var r=0;r<8;r++)for(var c=0;c<8;c++){var v=s.board[r][c];b.push(v&&PIECE.test(String(v))?String(v):"");}
    var rt=s.rights||{},cr=(rt.wk?"K":"")+(rt.wq?"Q":"")+(rt.bk?"k":"")+(rt.bq?"q":"");
    S={b:b,turn:s.turn==="b"?"b":"w",cr:cr,ep:(s.ep&&s.ep.length===2)?s.ep[0]*8+s.ep[1]:-1,half:+s.half||0,full:+s.full||1};
    took={w:(s.you||[]).slice(),b:(s.bot||[]).slice()};last=s.last&&s.last.length===4?{f:s.last[0]*8+s.last[1],t:s.last[2]*8+s.last[3]}:null;seq=+s.seq||0;
    over=!!s.over;result=over?{winner:s.winner===1?"w":s.winner===2?"b":"",why:s.why||(s.winner?"checkmate":"")}:null;
    if(!over){var st=status(S,null);if(st){over=true;result=st;}}}
  hist=[posKey(S)];sel=-1;legalNow=over?[]:legal(S);
}
async function push(m){
  if(!online||!room)return;
  m.side=mySide==="w"?1:2;var snap=snapshot(m);room.state=snap;
  await sb.from("rooms").update({state:snap,status:over?"done":"live",updated_at:new Date().toISOString()}).eq("id",room.id);
  if(over)report();
}
function report(){
  if(reported||!over||!room||!window.bwRateGame)return;
  reported=true;room.state=snapshot();bwRateGame(sb,room,me,result&&result.winner==="w"?1:result&&result.winner==="b"?2:0);   /* the server decides if points move */
}
async function bootOnline(){
  online=true;Parlor.seatOnline({label:"Online table "+CODE});
  var cfg=window.BW_PLAY||{};
  if(!cfg.url){say("Can't connect","Missing play-config.js");return;}
  sb=(window.BW&&BW.client&&BW.client())||supabase.createClient(cfg.url,cfg.anonKey);
  if(window.BW)await BW.settled();
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){say("Sign in to join","Use Tables to sign in");if(window.BW){var a=await BW.openAuth({reason:"Sign in to join this table."});if(!a.ok)return;sess=(await sb.auth.getSession()).data.session;}if(!sess)return;}
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code",CODE).single();
  if(q.error){say("Table not found",q.error.message);return;}
  room=q.data;
  if(typeof bwSendToGame==="function"&&bwSendToGame(bwGuessGame(room),CODE))return;
  if(room.host===me)mySide="w";else if(room.guest===me)mySide="b";
  else if(!room.guest){var u=await sb.from("rooms").update({guest:me,status:"live"}).eq("id",room.id).select().single();if(!u.error){room=u.data;mySide="b";}}
  else mySide="";   /* watching */
  nameSeats();Parlor.mySeat(mySide==="b"?1:0);layout();
  applySnap(room.state);paint();if(over)end();else msg();
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"code=eq."+CODE},function(p){
    var st=p.new.state||{};room=p.new;
    if(st.seq!=null&&(st.seq||0)<=seq){if(!over)msg();paint();return;}   /* our own echo, or an older update */
    var theirs=st.mv&&st.mv.side&&(st.mv.side===1?"w":"b")!==mySide;
    if(theirs&&!busy&&st.seq===seq+1){
      var m=legal(S).filter(function(x){return x.f===st.mv.f&&x.t===st.mv.t&&(x.promo||null)===(st.mv.promo||null);})[0];
      if(m){var mover=st.mv.side===1?"w":"b",was=over;busy=true;sel=-1;paint();
        animate(m,mover).then(function(){busy=false;applySnap(st);paint();if(over&&!was)end();else msg();});return;}
    }
    var w2=over;applySnap(st);paint();if(over&&!w2)end();else msg();
  }).subscribe();
}
