function sRamp(){ tone(330,0,.06,.14,"triangle",210); noise(0,.05,.1,1500,5000); }
function sGem(){ [1568,2093,2637].forEach(function(f,i){ tone(f,i*.06,.3,.07,"triangle"); }); }
function sCup(){ tone(1760,0,.5,.12,"sine"); tone(2637,.02,.45,.06,"sine"); tone(3520,.05,.3,.03,"sine"); noise(0,.08,.12,3000,9000); }
function sBonk(){ tone(140,0,.14,.22,"sine",90); noise(0,.06,.14,300,1400); }
function sFall(){ tone(700,0,.5,.08,"sine",160); }
function sThud(){ tone(110,0,.12,.18,"sine",80); noise(0,.05,.08,200,900); }
function sWin(){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,i*.09,.4,.09,"triangle"); }); }
var RUM=null;  /* the rolling rumble: a live sound that follows the marble's speed */
function rumbleOn(){ if(!on()||RUM) return; var s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(), f2=AC.createBiquadFilter();
  s.buffer=nbuf(); s.loop=true; f.type="lowpass"; f.frequency.value=380; f2.type="peaking"; f2.frequency.value=160; f2.gain.value=8; g.gain.value=.0001;
  s.connect(f); f.connect(f2); f2.connect(g); g.connect(OUT); s.start(); RUM={s:s,g:g,f:f}; }
function rumble(v){ if(!RUM) return; var t=AC.currentTime; RUM.g.gain.setTargetAtTime(Math.min(.5,.04+v*.07),t,.04); RUM.f.frequency.setTargetAtTime(260+v*90,t,.05); }
function rumbleOff(){ if(!RUM) return; var r=RUM; RUM=null; var t=AC.currentTime; r.g.gain.setTargetAtTime(.0001,t,.05); try{ r.s.stop(t+.3); }catch(e){} }

/* ---------- the day ---------- */
var DAYN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var FOOT=["Small boards with 2 ramps. A gentle start!","Bigger boards and 2 gems.","3 ramps to place.","3 ramps, plus an extra one you might not need.",
  "Bigger boards with 4 ramps.","Tall boards with 3 gems and extra ramps.","5 ramps and 3 gems. The trickiest of the week!"];
function today(){ var d=new Date(); return {n:Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5), wd:d.getDay()}; }
function lvOf(wd){ return (wd+6)%7; }

var P=null, B=null, gen=0, busy=false, SEL="R", GEO=null, said={};
function msg(t){ $("#cmsg").textContent=t||""; }
function say(t,key){ BWK.say(t); }
function sayOnce(key,t){ if(said[key]) return; said[key]=1; say(t); }
function start(bonus){ gen++; busy=false; said={}; clearHint(); var t=today(), lv=lvOf(t.wd);
  document.body.className="m-play"; $("#cday").textContent=bonus?"Bonus Run":(DAYN[t.wd]+"'s Runs");
  if(!bonus&&ST.day===t.n&&ST.cur){ var c=ST.cur; P={lv:c.lv,seed:t.n,i:c.i||0,hints:c.hints||0,done:!!c.done,bonus:false,pl:c.pl||{}}; }
  else P={lv:lv,seed:bonus?(Math.random()*1e9)|0:t.n,i:0,hints:0,done:false,bonus:!!bonus,pl:{}};
  P.boards=bonus?[MRG.make(P.lv,P.seed)]:MRG.day(P.lv,P.seed);
  if(P.done){ P.i=P.boards.length-1; }
  loadBoard(); saveCur();
  if(P.done){ msg("All of today's runs are done! Tap Menu for a Bonus Run."); $("#aRoll").disabled=true; return; }
  if(bonus) say(BONUS); else if(P.i===0&&!Object.keys(P.pl).length){ var ex=P.lv>=3; say(ST.n<1?FIRST:(ex?EXTRA:START)); msg(ST.n<1?"Tap a ramp in the tray, then tap a hole on the pegboard.":ex?"There are extra ramps today. You might not need them all!":"Get every gem, then land in the cup!"); } }
function saveCur(){ if(!P||P.bonus) return; ST.day=today().n; ST.cur={lv:P.lv,i:P.i,hints:P.hints,done:P.done,pl:P.pl}; save(); }
function loadBoard(){ B=P.boards[P.i]; $("#aRoll").disabled=false; P.got={};
  $("#cnum").textContent=(P.bonus?"":"Run "+(P.i+1)+" of "+P.boards.length+" · ")+B.ngems+" gem"+(B.ngems>1?"s":"");
  var used={R:0,L:0}; for(var k in P.pl) used[P.pl[k]]++;
  if(used.R>B.inv.R||used.L>B.inv.L) P.pl={};
  SEL=left("R")>0?"R":"L"; layout(); drawTray(); drawGems(); }
function left(k){ var n=B.inv[k]; for(var q in P.pl) if(P.pl[q]===k) n--; return n; }

/* ---------- layout: the pegboard holds a chute row on top and a cup row at the bottom ---------- */
function layout(){ if(!B) return; var st=$("#stage"), W=st.clientWidth, H=st.clientHeight; if(!W||!H) return;
  var cols=B.W+.9, rows=B.H+1.6+.9, u=Math.floor(Math.min(W/cols,H/rows,92)), sc=false;
  /* short phones on big boards: keep the holes big enough to tap and let the pegboard scroll (it follows the marble) */
  if(u<34){ u=Math.floor(Math.min(34,W/cols)); sc=true; } st.classList.toggle("scroll",sc);
  var pad=Math.round(u*.45), T=Math.round(u*.7), bw=B.W*u+pad*2, bh=B.H*u+T+Math.round(u*.9)+pad*2, x0=Math.round((W-bw)/2), y0=sc?4:Math.round((H-bh)/2);
  GEO={u:u,pad:pad,T:T,x0:x0,y0:y0,bw:bw,bh:bh};
  st.style.setProperty("--sh",(y0+bh)+"px"); var b=$("#board"); b.style.cssText="left:"+x0+"px;top:"+y0+"px;width:"+bw+"px;height:"+bh+"px;--u:"+u+"px;--pad:"+pad+"px;--hx:"+pad+"px;--hy:"+(pad+T)+"px";
  drawAll(); }
function cellXY(r,c){ return [GEO.pad+c*GEO.u, GEO.pad+GEO.T+r*GEO.u]; }  /* r=-1 is the chute row, r=B.H the cup row */
function piece(kind,r,c,cls,sc){ var e=document.createElement("div"), p=cellXY(r,c), s=sc||1, u=GEO.u;
  e.className="pc"+(cls?" "+cls:""); e.style.cssText="left:"+(p[0]+u*(1-s)/2)+"px;top:"+(p[1]+u*(1-s)/2)+"px;width:"+(u*s)+"px;height:"+(u*s)+"px";
  e.innerHTML=art(kind); e.dataset.r=r; e.dataset.c=c; $("#board").appendChild(e); return e; }
function drawAll(){ if(!B||!GEO) return; var b=$("#board"); [].slice.call(b.querySelectorAll(".pc,.hole")).forEach(function(e){ e.remove(); });
  piece("S",-1,B.s,"chute",1.04); piece("C",B.H,B.g,"cup",.98);
  for(var r=0;r<B.H;r++) for(var c=0;c<B.W;c++){ var k=r*B.W+c, v=B.cells[k], pv=P.pl[k];
    if(v==="X") piece("X",r,c,"",.92); else if(v==="G"){ if(!P.got[k]) piece("G",r,c,"gem",.62); }
    else if(v==="R"||v==="L") piece("F"+v,r,c,"fixed"); else if(pv) piece(pv,r,c,"mine"); }
  placeMarble(B.s+.5,-.5); }
function drawTray(){ if(!B) return; ["R","L"].forEach(function(k){ var e=$("#rp"+k), n=left(k);
  e.querySelector(".pic").innerHTML=art(k); e.querySelector(".n").textContent=n; e.classList.toggle("none",n<=0); e.classList.toggle("on",SEL===k&&n>0);
  e.style.display=B.inv[k]>0?"":"none"; }); $("#aClear").disabled=!Object.keys(P.pl).length; }
function drawGems(){ var h=""; for(var i=0;i<B.ngems;i++) h+='<i class="'+(i<Object.keys(P.got).length?"on":"")+'">'+(PH?'<img alt="" src="'+pic("gem.webp")+'">':gemSVG())+'</i>'; $("#gems").innerHTML=h; }

/* ---------- placing ramps ---------- */
function cellAt(x,y){ var r=Math.floor((y-GEO.pad-GEO.T)/GEO.u), c=Math.floor((x-GEO.pad)/GEO.u); if(r<0||r>=B.H||c<0||c>=B.W) return null; return [r,c]; }
function pcEl(r,c){ return $('#board .pc[data-r="'+r+'"][data-c="'+c+'"]'); }
function tapCell(r,c){ if(!P||busy||P.done) return; clearHint(); var k=r*B.W+c, v=B.cells[k];
  if(v==="X"){ shake(r,c); sNope(); msg("That's a wooden block."); return; }
  if(v==="G"){ shake(r,c); sNope(); msg("Leave that hole open. The marble has to roll through the gem."); sayOnce("gem",GEMHOLE); return; }
  if(v==="R"||v==="L"){ shake(r,c); sNope(); msg("That dark ramp is glued down. You can't move it."); sayOnce("glue",GLUED); return; }
  if(P.pl[k]){ var was=P.pl[k]; delete P.pl[k]; sTake(); SEL=was; afterChange(); msg(""); return; }
  if(left(SEL)<=0){ var o=SEL==="R"?"L":"R"; if(left(o)>0) SEL=o; else { sNope(); $("#aClear").classList.add("ring"); setTimeout(function(){ $("#aClear").classList.remove("ring"); },1600);
    msg("All your ramps are on the board. Tap a ramp to take it back."); sayOnce("none",NONE); return; } }
  P.pl[k]=SEL; sPlace(); afterChange(); var e=pcEl(r,c); if(e) e.classList.add("drop");
  if(left("R")+left("L")===0){ msg("All your ramps are on the board. Tap Roll!"); sayOnce("ready"+P.i,READY); } else msg(""); }
function afterChange(){ if(left(SEL)<=0){ var o=SEL==="R"?"L":"R"; if(left(o)>0) SEL=o; } drawAll(); drawTray(); saveCur(); }
function shake(r,c){ var e=pcEl(r,c); if(!e) return; e.classList.remove("bad"); void e.offsetWidth; e.classList.add("bad"); }
var DN=null;
$("#board").addEventListener("pointerdown",function(e){ DN=[e.clientX,e.clientY]; });
$("#board").addEventListener("pointerup",function(e){ if(!GEO||!DN) return; var mv=Math.hypot(e.clientX-DN[0],e.clientY-DN[1]); DN=null; if(mv>12) return;
  var rc=$("#board").getBoundingClientRect(), q=cellAt(e.clientX-rc.left,e.clientY-rc.top); if(q) tapCell(q[0],q[1]); });
$("#board").addEventListener("pointercancel",function(){ DN=null; });
["R","L"].forEach(function(k){ $("#rp"+k).onclick=function(){ if(!P||busy) return; clearHint(); if(left(k)<=0){ sNope(); msg("You're out of "+(k==="R"?"right":"left")+" ramps. Tap one on the board to take it back."); return; }
  SEL=k; sPick(); drawTray(); BWK.say(k==="R"?RNAME:LNAME); }; });
$("#aClear").onclick=function(){ if(!P||busy||!Object.keys(P.pl).length) return; clearHint(); P.pl={}; sTake(); afterChange(); msg("All the ramps are back in the tray."); };

/* ---------- rolling ---------- */
var mx=0,my=0;
function placeMarble(cx,cy){ mx=cx; my=cy; var m=$("#marble"), s=GEO.u*.56; m.style.width=m.style.height=s+"px";
  var py=GEO.y0+GEO.pad+GEO.T+cy*GEO.u-s/2; m.style.transform="translate("+(GEO.x0+GEO.pad+cx*GEO.u-s/2)+"px,"+py+"px)";
  var st=$("#stage"); if(busy&&st.classList.contains("scroll")){ var want=py-st.clientHeight*.45; st.scrollTop+=(want-st.scrollTop)*.18; }
  var im=m.querySelector("svg,img"); if(!im||(PH!==(im.tagName==="IMG"))){ if(im) im.remove(); m.insertAdjacentHTML("afterbegin",art("M")); } }
/* waypoints in cell units (x across, y down; the marble's center), with events at points */
function route(res){ var w=[[B.s+.5,-.62]], ev=[];
  res.path.forEach(function(q,i){ var r=q[0], c=q[1], k=r*B.W+c, v=P.pl[k]||B.cells[k];
    if(v==="R"||v==="L"){ var d=v==="R"?1:-1; w.push([c+.5,r+.16]); ev[w.length-1]="ramp"; w.push([c+.5+d*.42,r+.42]); w.push([c+.5+d*.82,r+.95]); }
    else if(v==="X"){ w.push([c+.5,r-.06]); ev[w.length-1]="stuck"; }
    else { w.push([c+.5,r+.5]); if(v==="G") ev[w.length-1]="gem:"+k; } });
  var last=res.path[res.path.length-1], lv=last?(P.pl[last[0]*B.W+last[1]]||B.cells[last[0]*B.W+last[1]]):"";
  if(res.end==="cup"){ w.push([B.g+.5,B.H+.42]); ev[w.length-1]="cup"; }
  else if(res.end==="miss"){ var c=w[w.length-1][0]; w.push([c,B.H+.62]); ev[w.length-1]="floor"; }
  else if(res.end==="off"){ var p=w[w.length-1], dx=p[0]<B.W/2?-1:1; w.push([p[0]+dx*.5,p[1]+.6]); w.push([p[0]+dx*.7,B.H+3]); ev[w.length-2]="off"; }
  return {w:w,ev:ev}; }
function roll(){ if(!P||busy||P.done) return; clearHint(); busy=true; var g=gen, res=MRG.run(B,P.pl), rt=route(res), w=rt.w;
  P.got={}; drawAll(); drawGems(); $("#aRoll").disabled=true; msg(""); noise(0,.06,.1,2000,6000); tone(500,0,.05,.06,"square",300);
  var seg=[], tot=0; for(var i=1;i<w.length;i++){ var d=Math.hypot(w[i][0]-w[i-1][0],w[i][1]-w[i-1][1]); seg.push(d); tot+=d; }
  var t0=null, dist=0, vel=1.4, idx=0, segPos=0; rumbleOn();
  function fire(e){ if(!e) return;
    if(e==="ramp") sRamp(); else if(e==="stuck"){ sBonk(); } else if(e==="cup"){ } else if(e==="floor") sThud(); else if(e==="off") sFall();
    else if(e.indexOf("gem:")===0){ var k=+e.slice(4); P.got[k]=1; sGem(); var r=Math.floor(k/B.W), c=k%B.W, el=pcEl(r,c); if(el) el.classList.add("got"); drawGems(); } }
  function step(ts){ if(g!==gen){ rumbleOff(); return; } if(t0===null) t0=ts; var dt=Math.min(.05,(ts-t0)/1000); t0=ts;
    var downish=idx<w.length-1?(w[idx+1][1]-w[idx][1])/(seg[idx]||1):1; vel=Math.min(5.2,Math.max(1.6,vel+dt*(3.2*downish-.6))); rumble(vel);
    segPos+=vel*dt;
    while(idx<seg.length&&segPos>=seg[idx]){ segPos-=seg[idx]; idx++; fire(rt.ev[idx]); if(rt.ev[idx]==="ramp") vel*=.8; if(rt.ev[idx]==="stuck"||rt.ev[idx]==="floor") { idx=seg.length; break; } }
    if(idx>=seg.length){ var e=w[Math.min(idx,w.length-1)]; placeMarble(e[0],e[1]); rumbleOff(); done(res); return; }
    var a=w[idx], b=w[idx+1], f=segPos/seg[idx]; placeMarble(a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f); requestAnimationFrame(step); }
  requestAnimationFrame(step); }
function done(res){ var g=gen, m=$("#marble");
  if(res.end==="cup"){ sCup(); m.animate([{opacity:1},{opacity:.0}],{duration:450,fill:"forwards"}); }
  if(res.win){ var cupE=$("#board .pc.cup"); if(cupE) cupE.animate([{transform:"none"},{transform:"translateY(-6%) scale(1.06)"},{transform:"none"}],{duration:500});
    msg("Into the cup! Great building!"); say(GOOD); ST.n++; save();
    setTimeout(function(){ if(g!==gen) return; m.getAnimations().forEach(function(a){ a.cancel(); });
      if(P.i+1<P.boards.length){ P.i++; P.pl={}; saveCur(); busy=false; loadBoard(); msg("Here's the next marble run."); say(NEXTB); }
      else { busy=false; win(); } },1500); return; }
  var t=res.end==="cup"?"Into the cup! But the marble missed a gem. Every gem has to be picked up.":res.end==="off"?"Whoops! The marble rolled off the side.":
    res.end==="stuck"?"Bonk! A wooden block stopped the marble.":"Whoops! The marble missed the cup.";
  msg(t+" Move your ramps and try again."); say(res.end==="cup"?GEMSMISS:res.end==="off"?OFF:res.end==="stuck"?STUCK:MISS);
  if(res.end==="stuck") m.animate([{transform:m.style.transform},{transform:m.style.transform+" translateY(-14%)"},{transform:m.style.transform}],{duration:300});
  setTimeout(function(){ if(g!==gen) return; m.getAnimations().forEach(function(a){ a.cancel(); }); busy=false; P.got={}; drawAll(); drawGems(); $("#aRoll").disabled=false;
    m.animate([{opacity:0},{opacity:1}],{duration:300}); },res.end==="off"?1300:1700); }
$("#aRoll").onclick=roll;
function starsOf(h){ return h===0?3:h<=2?2:1; }
function win(){ P.done=true; saveCur(); var g=gen; var fresh=P.bonus?"":BWG.patch("marble"); sWin(); $("#aRoll").disabled=true;
  setTimeout(function(){ if(g!==gen) return; var s=starsOf(P.hints);
    var box=BWK.sheet('<h2>'+(P.bonus?'Bonus run done!':'All of today\'s runs are done!')+'</h2>'+BWG.patchLine(fresh)+'<div class="stars">'+"★★★".slice(0,s)+'<i>'+"★★★".slice(0,3-s)+'</i></div>'+
      '<p>'+(P.bonus?'Another marble in the cup!':'You built '+P.boards.length+' marble runs'+(P.hints?' with '+P.hints+' hint'+(P.hints>1?'s':''):' with no hints')+'.')+'</p>'+
      '<p>'+(P.bonus?'Want to build another one?':'Come back tomorrow for new runs.')+'</p>'+
      '<div class="k-row"><button class="k-btn" data-a="more">Bonus Run</button><button class="k-btn k-ghost" data-a="out">The Outpost</button></div>');
    box.querySelector('[data-a=more]').onclick=function(){ BWK.closeSheet(true); start(true); };
    box.querySelector('[data-a=out]').onclick=BWG.toOutpost;
    say(fresh?WINP:(P.bonus?WINB:WIN)); },900); }

/* ---------- hints: Zayden's tip fixes one ramp at a time, toward the closest solution ---------- */
var HR=[];
function ringOn(el){ if(!el) return; el.classList.add("ring"); HR.push(el); }
function clearHint(){ HR.forEach(function(e){ if(e.classList.contains("hole")) e.remove(); else e.classList.remove("ring"); }); HR=[]; }
function hint(){ if(!P||busy||P.done) return; clearHint(); sPick(); P.hints++; saveCur(); say(HINT);
  var all=MRG.solve(B,B.inv,24).sols, best=null, bs=1e9;
  all.forEach(function(sl){ var path=MRG.run(B,sl).path, onp={}, wrong=0, miss=0; path.forEach(function(q){ onp[q[0]*B.W+q[1]]=1; });
    for(var k in P.pl) if(onp[k]&&P.pl[k]!==sl[k]) wrong++; for(var k2 in sl) if(P.pl[k2]!==sl[k2]) miss++; if(wrong+miss<bs){ bs=wrong+miss; best={sl:sl,onp:onp}; } });
  if(!best) return; var sl=best.sl;
  for(var k in P.pl) if(best.onp[k]&&P.pl[k]!==sl[k]){ var r=Math.floor(k/B.W), c=k%B.W; ringOn(pcEl(r,c)); msg("Zayden's tip: this ramp is in the marble's way. Tap it to take it back."); return; }
  for(var k2 in sl) if(P.pl[k2]!==sl[k2]){ var need=sl[k2];
    if(left(need)<=0){ for(var k3 in P.pl) if(P.pl[k3]===need&&!(k3 in sl)){ ringOn(pcEl(Math.floor(k3/B.W),k3%B.W)); msg("Zayden's tip: take this ramp back. You need it somewhere else."); return; } }
    var r2=Math.floor(k2/B.W), c2=k2%B.W, p=cellXY(r2,c2), h=document.createElement("div"); h.className="hole ring";
    h.style.cssText="left:"+(p[0]+GEO.u*.1)+"px;top:"+(p[1]+GEO.u*.1)+"px;width:"+(GEO.u*.8)+"px;height:"+(GEO.u*.8)+"px"; $("#board").appendChild(h); HR.push(h);
    SEL=need; drawTray(); ringOn($("#rp"+need)); msg("Zayden's tip: put a "+(need==="R"?"right":"left")+" ramp in this hole."); return; }
  ringOn($("#aRoll")); msg("Zayden's tip: it's all set. Tap Roll!"); }
$("#tHint").onclick=hint;

/* ---------- keys on a computer: R/L pick a ramp, Space or Enter rolls, C takes back, H hint ---------- */
document.addEventListener("keydown",function(e){ if(!document.body.classList.contains("m-play")||document.querySelector(".k-veil.on")) return; var k=e.key.toLowerCase();
  if(k==="r"&&left("R")>0){ SEL="R"; drawTray(); } else if(k==="l"&&left("L")>0){ SEL="L"; drawTray(); }
  else if(k===" "||k==="enter"){ e.preventDefault(); roll(); } else if(k==="c") $("#aClear").onclick(); else if(k==="h") hint(); });

/* ---------- menu ---------- */

  var doneToday=ST.day===t.n&&ST.cur&&ST.cur.done;
  $("#bPlay").textContent=doneToday?"Today's Runs ✓":"Today's Runs"; $("#bPlay").classList.toggle("k-ghost",!!doneToday);
  $("#bBonus").style.display=doneToday?"":"none";
  $("#mfoot").textContent=(ST.n?("Marbles in the cup: "+ST.n+". "):"")+DAYN[t.wd]+": "+FOOT[lv]; }
$("#bPlay").onclick=function(){ BWK.sfx("open"); start(false); };
$("#bBonus").onclick=function(){ BWK.sfx("open"); start(true); };
