<style>
/* Crazy Eights, Goofy Edition (The Outpost · The Joke Shack), Nov 12. Four goofy suits (bananas, socks, frogs, balloons), numbers 1-10,
   eights are wild. You plus 1-3 of Brody-Bot, Lulu the Llama and Grandpa Wobble. First with no cards wins. */
:root{--bgx:40%;--bgy:62%}
.who{display:flex;justify-content:center;gap:8px;margin:0 auto 12px;max-width:380px}
.who button{flex:1;appearance:none;cursor:pointer;font:inherit;font-weight:700;font-size:13.5px;line-height:1.15;padding:8px 4px 7px;border-radius:16px;color:#dbe6f3;
  background:rgba(255,255,255,.07);border:1.5px solid var(--k-line);display:flex;flex-direction:column;align-items:center;gap:4px}
.who button svg{width:52px;height:52px}
.who button.on{color:#3a2306;background:linear-gradient(180deg,#ffe7a6,#e9c46a);border-color:#fff0c4;box-shadow:0 3px 0 #a97a1c}
.table{position:relative;width:min(760px,100%);flex:1;min-height:320px;max-height:820px;border-radius:26px;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 45%,rgba(255,255,255,.08),transparent 60%),
   repeating-linear-gradient(90deg,rgba(80,44,14,0) 0 22%,rgba(60,30,8,.5) 22% calc(22% + 3px),rgba(255,220,170,.12) calc(22% + 3px) calc(22% + 5px)),
   repeating-linear-gradient(178deg,rgba(255,220,170,.05) 0 7px,rgba(90,50,18,.10) 7px 9px),
   radial-gradient(130% 90% at 30% 10%,#c98c52,#a2672f 55%,#7b4a1f);
  box-shadow:0 10px 0 #5e3614,0 22px 40px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,230,190,.45),inset 0 -6px 14px rgba(60,30,8,.45)}
.plate{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.08em;color:#f6dca0;opacity:.7;text-shadow:0 1px 0 rgba(0,0,0,.5);z-index:1}
.opp{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);z-index:3;width:110px}
.opp .av{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#fff7e6,#f0dcb4);box-shadow:0 3px 0 #8a5a26,0 6px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:box-shadow .2s}
.opp .av svg{width:48px;height:48px}
.opp.turn .av{box-shadow:0 3px 0 #8a5a26,0 0 0 4px #ffe27a,0 0 18px #ffe27a}
.opp.wob .av svg{animation:wob .9s ease-in-out}
@keyframes wob{20%{transform:rotate(-14deg)}45%{transform:rotate(11deg)}70%{transform:rotate(-6deg)}}
.opp .nm{margin-top:4px;font-weight:700;font-size:13px;color:#fff3da;text-shadow:0 2px 4px rgba(0,0,0,.7);white-space:nowrap}
.opp .nm b{display:inline-block;min-width:24px;margin-left:4px;padding:0 6px;border-radius:12px;background:#13233f;color:#fff;border:2px solid var(--k-gold);font-size:13px}
.bub{position:absolute;left:62%;top:-6px;white-space:nowrap;background:#fff;color:#2b2116;font-weight:800;font-size:14px;padding:5px 10px;border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.35);opacity:0;transform:scale(.4);transform-origin:0 100%;transition:opacity .2s,transform .25s cubic-bezier(.2,1.5,.4,1);pointer-events:none}
.bub.on{opacity:1;transform:scale(1)}
.opp.r .bub{left:auto;right:62%;transform-origin:100% 100%}
.cd{position:absolute;left:0;top:0;border-radius:10%/7%;transition:transform .45s cubic-bezier(.3,.8,.3,1),filter .2s;will-change:transform;z-index:4}
.cd svg{display:block;width:100%;height:100%;border-radius:inherit;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.cd.mine{cursor:pointer}
.cd.can svg{box-shadow:0 0 0 3px #ffe27a,0 0 14px #ffe27a,0 6px 10px rgba(0,0,0,.35)}
.cd.dim{filter:brightness(.82) saturate(.85)}
.cd.bad{animation:shk .35s}
@keyframes shk{20%,60%{margin-left:-5px}40%,80%{margin-left:5px}}
.deck{position:absolute;border-radius:10%/7%;cursor:pointer;z-index:2}
.deck.go{animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{50%{filter:drop-shadow(0 0 14px rgba(255,217,138,1))}}
.deck .cnt{position:absolute;right:-8px;top:-10px;min-width:28px;height:28px;border-radius:14px;padding:0 6px;display:flex;align-items:center;justify-content:center;
  background:#13233f;color:#fff;font-weight:800;font-size:14px;border:2px solid var(--k-gold);z-index:3}
.suitnow{position:absolute;z-index:5;display:flex;align-items:center;gap:4px;padding:4px 10px 4px 5px;border-radius:20px;background:#fff8e6;color:#3a2306;font-weight:800;font-size:14px;
  box-shadow:0 3px 0 #a97a1c,0 6px 12px rgba(0,0,0,.35);transform:translateX(-50%) scale(0);transition:transform .3s cubic-bezier(.2,1.5,.4,1)}
.suitnow.on{transform:translateX(-50%) scale(1)}
.suitnow svg{width:26px;height:26px}
.msg{font-weight:700;font-size:18px;color:var(--k-warm);text-shadow:0 2px 6px rgba(0,0,0,.6);text-align:center;min-height:24px;max-width:620px}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.picks button{appearance:none;cursor:pointer;font:inherit;font-weight:800;font-size:18px;padding:10px 6px;border-radius:18px;background:#fff8e6;color:#3a2306;border:3px solid #e9c46a;
  display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 #a97a1c}
.picks button svg{width:58px;height:58px}
@media (max-height:620px){.msg{font-size:15.5px}.opp .av{width:44px;height:44px}.opp .av svg{width:40px;height:40px}.opp .nm{font-size:12px}}
</style>

}
function layoutAll(now){
  pile.forEach(function(c,i){ if(i<pile.length-6){ if(c.el){ c.el.remove(); c.el=null; } return; } put(c,G.pile[0]+(c.dx||0),G.pile[1]+(c.dy||0),c.rot||0,10+i,now); });
  layoutHand(now); stacks();
}
function layoutHand(now){
  var h=hands[0], n=h.length, avail=G.W-24, step=n>1?Math.min(G.cw*1.06,(avail-G.cw)/(n-1)):0, x0=(G.W-(G.cw+step*(n-1)))/2;
  var mine=turn===0&&!busy&&!over;
  h.forEach(function(c,i){ var can=mine&&legal(c)&&(!drewThis||c===drewThis);
    c.el.classList.add("mine"); c.el.classList.toggle("can",can); c.el.classList.toggle("dim",mine&&!can);
    put(c,x0+i*step,G.hy-(can?14:0),0,60+i,now); });
}
function stacks(){
  var d=$("#deck"); d.querySelector(".cnt").textContent=deck.length; d.style.display=deck.length?"":"none";
  d.innerHTML=deck.length?BACK+'<span class="cnt">'+deck.length+'</span>':'<span class="cnt">0</span>';
  var go=turn===0&&!busy&&!over&&!drewThis&&!hands[0].some(legal); d.classList.toggle("go",go);
  P.forEach(function(id,i){ if(!i) return; var o=$("#op"+i); o.querySelector(".nm b").textContent=hands[i].length; o.classList.toggle("turn",turn===i&&!over); });
  var sn=$("#suitnow"), t=top(); if(t&&t.r===8){ sn.innerHTML=suitSvg(suit)+"Now: "+SN[suit]+"!"; sn.classList.add("on"); } else sn.classList.remove("on");
}
function bubble(i,txt){ var b=$("#op"+i+" .bub"); b.textContent=txt; b.classList.add("on"); clearTimeout(b._t); b._t=setTimeout(function(){ b.classList.remove("on"); },1300); }

function deal(){
  clearTimeout(nagT); saidTurn=saidDraw=false;
  gen++; over=false; busy=false; drewThis=false;
  [].slice.call(tbl.querySelectorAll(".cd,.opp")).forEach(function(e){ e.remove(); });
  P=["me"].concat(ORDER.filter(function(id){ return ST.who.indexOf(id)>=0; })); if(P.length<2) P=["me","brody"];
  P.forEach(function(id,i){ if(!i) return; var o=document.createElement("div"); o.className="opp"; o.id="op"+i;
    if(i===P.length-1&&P.length>2) o.classList.add("r");
    o.innerHTML='<div class="av">'+CAST[id].av+'</div><div class="nm"><span>'+CAST[id].n+'</span><b>5</b></div><div class="bub"></div>'; tbl.appendChild(o); });
  deck=[]; for(var s=0;s<4;s++) for(var r=1;r<=10;r++) deck.push({s:s,r:r}); shuffle(deck);
  hands=P.map(function(){ return []; }); pile=[];
  geo();
  for(var k=0;k<8;k++) P.forEach(function(id,i){ var c=deck.pop(); hands[i].push(c); if(!i) cardEl(c,true); });
  var first; do{ first=deck.pop(); if(first.r===8){ deck.unshift(first); first=null; } }while(!first);
  cardEl(first,true); first.rot=Math.random()*8-4; pile.push(first); suit=first.s;
  hands[0].sort(function(a,b){ return a.s-b.s||a.r-b.r; });
  hands[0].forEach(function(c){ put(c,G.deck[0],G.deck[1],0,50,true); }); put(first,G.deck[0],G.deck[1],0,10,true);
  turn=0; stacks(); sDraw();
  requestAnimationFrame(function(){ layoutAll(false); myTurn(true); });
}
function msg(t){ $("#msg").textContent=t; }
/* Spoken nudges: the first "Your turn!" (and the first draw tip) of a game is said right away;
   after that only if the player waits 5 s without playing or drawing (Judy, Nov 12). */
var nagT=0, saidTurn=false, saidDraw=false;
function nag(line,said){ clearTimeout(nagT); if(!said){ BWK.say(line); return; }
  var g=gen; nagT=setTimeout(function(){ if(g===gen&&turn===0&&!busy&&!over&&!drewThis) BWK.say(line); },5000); }
function myTurn(first){
  busy=false; drewThis=false; turn=0; layoutHand(); stacks();
  if(hands[0].some(legal)){ msg(first?"You go first! Tap a glowing card that matches.":"Your turn! Match the picture or the number."); if(!first){ nag("Your turn!",saidTurn); saidTurn=true; } }
  else { msg("No match? Tap the deck to draw a card."); nag(DRAW,saidDraw); saidDraw=true; }
}
function tapCard(c){
  if(turn!==0||busy||over) return;
  if(drewThis&&c!==drewThis){ sWrong(); msg("Play the card you just drew!"); return; }
  if(!legal(c)){ sWrong(); c.el.classList.remove("bad"); void c.el.offsetWidth; c.el.classList.add("bad");
    msg(top().r===8?("Look for "+SN[suit].toLowerCase()+", or an 8!"):("Look for "+SN[suit].toLowerCase()+", a "+top().r+", or an 8!")); return; }
  play(0,c);
}
function play(i,c){
  clearTimeout(nagT); busy=true; var h=hands[i]; h.splice(h.indexOf(c),1);
  if(!c.el){ cardEl(c,false); var o=$("#op"+i), r=o.getBoundingClientRect(), tr=tbl.getBoundingClientRect(); put(c,r.left-tr.left+r.width/2-G.cw/2,r.top-tr.top+20,0,90,true); }
  showFace(c); c.el.classList.remove("mine","can","dim"); c.rot=Math.random()*14-7; c.dx=Math.random()*6-3; c.dy=Math.random()*6-3;
  pile.push(c); c.el.onclick=null; sPlay(); layoutAll(false);
  if(c.r===8){ sEight(); }
  return wait(480).then(function(){
    if(!h.length){ if(c.r!==8) suit=c.s; stacks(); return wait(400).then(function(){ end(i); }); }
    if(c.r!==8){ suit=c.s; stacks(); return wait(i?250:150).then(next); }
    if(i===0) return pickSuit();
    var id=P[i], s=chooseSuit(i, id==="lulu"); suit=s; stacks(); bubble(i,SCLIP[s]); BWK.say(SCLIP[s]);
    return wait(1100).then(next);
  }).catch(function(){});
}
function pickSuit(){
  msg("Crazy Eight! Pick a picture."); BWK.say(PICK); var chosen=false;
  var box=BWK.sheet('<h2>Pick a picture!</h2><div class="picks">'+[0,1,2,3].map(function(s){ return '<button data-s="'+s+'">'+suitSvg(s)+SN[s]+'</button>'; }).join("")+'</div>',
    function(){ if(chosen) return; chosen=true; var s=chooseSuit(0,false); suit=s; stacks(); msg("Now it's "+SN[s].toLowerCase()+"!"); wait(500).then(next).catch(function(){}); });
  [].forEach.call(box.querySelectorAll(".picks button"),function(b){ b.onclick=function(){ if(chosen) return; chosen=true; var s=+b.dataset.s; BWK.closeSheet(true);
    suit=s; stacks(); sEight(); BWK.say(SCLIP[s],true); msg("Now it's "+SN[s].toLowerCase()+"!"); wait(900).then(next).catch(function(){}); }; });
}
function chooseSuit(i,random){ if(random) return Math.floor(Math.random()*4);
  var n=[0,0,0,0]; hands[i].forEach(function(c){ if(c.r!==8) n[c.s]++; }); var best=0; for(var s=1;s<4;s++) if(n[s]>n[best]) best=s; return best; }
function refill(){ if(deck.length||pile.length<2) return; var t=pile.pop(); deck=shuffle(pile.map(function(c){ if(c.el){ c.el.remove(); c.el=null; } c.up=false; return {s:c.s,r:c.r}; })); pile=[t]; }
function drawMe(){
  if(turn!==0||busy||over||drewThis) return;
  clearTimeout(nagT);
  if(hands[0].some(legal)){ sWrong(); msg("You have a match! Look for the glowing cards."); return; }
  refill(); if(!deck.length){ msg("No cards left to draw. Next player!"); busy=true; wait(900).then(next).catch(function(){}); return; }
  var c=deck.pop(); cardEl(c,true); put(c,G.deck[0],G.deck[1],0,80,true); hands[0].push(c); sDraw();
  if(legal(c)){ drewThis=c; layoutHand(); stacks(); msg("You drew a match! Tap it to play."); }
  else { busy=true; layoutHand(); stacks(); msg("No match this time. Next player!"); wait(1000).then(next).catch(function(){}); }
}
function next(){ if(over) return; turn=(turn+1)%P.length; drewThis=false; if(turn===0){ myTurn(); return; } busy=true; layoutHand(); stacks();
  msg(CAST[P[turn]].n+" is thinking..."); wait(800).then(botMove).catch(function(){}); }
function botMove(){
  var i=turn, id=P[i], h=hands[i], L=h.filter(legal), pick=null;
  if(id==="grandpa"&&L.length&&Math.random()<.3){ L=[]; $("#op"+i).classList.remove("wob"); void $("#op"+i).offsetWidth; $("#op"+i).classList.add("wob"); bubble(i,"Oops, wobbly!"); sVoice(id); }
  if(L.length){
    if(id==="lulu") pick=L[Math.floor(Math.random()*L.length)];
    else { var non=L.filter(function(c){ return c.r!==8; });
      if(non.length){ if(id==="brody"){ var n=[0,0,0,0]; h.forEach(function(c){ n[c.s]++; }); non.sort(function(a,b){ return n[b.s]-n[a.s]||b.r-a.r; }); }
        else non.sort(function(a,b){ return b.r-a.r; }); pick=non[0]; }
      else pick=L[0]; }
    var cs=CAST[id].say; bubble(i,cs[Math.floor(Math.random()*cs.length)]); sVoice(id);
    msg(CAST[id].n+" played a "+pick.r+(pick.r===8?"!":" of "+SN[pick.s].toLowerCase()+"."));
    return play(i,pick);
  }
  refill();
  if(!deck.length){ msg(CAST[id].n+" can't play. Next!"); return wait(800).then(next); }
  var c=deck.pop(); h.push(c); sDraw(); cardEl(c,false); put(c,G.deck[0],G.deck[1],0,80,true);
  var o=$("#op"+i), r=o.getBoundingClientRect(), tr=tbl.getBoundingClientRect();
  requestAnimationFrame(function(){ put(c,r.left-tr.left+r.width/2-G.cw/2,r.top-tr.top+10,0,80); });
  stacks(); msg(CAST[id].n+" drew a card.");
  return wait(560).then(function(){ c.el.remove(); c.el=null; c.up=false;
    if(legal(c)&&!(id==="grandpa"&&Math.random()<.3)){ bubble(i,"Ooh, a match!"); return wait(500).then(function(){ msg(CAST[id].n+" played a "+c.r+(c.r===8?"!":" of "+SN[c.s].toLowerCase()+".")); return play(i,c); }); }
    return wait(300).then(next); });
}
function end(i){
  over=true; busy=true; stacks(); layoutHand();
  var fresh=BWG.patch("eights"); ST.g++; if(!i) ST.w++; save(); sEnd(!i);
  var t, h, body;
  if(!i){ t="You win!"; h=fresh?WINP:WIN; body="You got rid of all your cards!"; }
  else { var id=P[i]; t=CAST[id].n+" wins!"; h=CAST[id].lose; body=CAST[id].n+" got rid of all their cards. You had "+hands[0].length+" left."; bubble(i,"Hooray!"); }
  msg(t);
  wait(700).then(function(){
    var box=BWK.sheet('<h2>'+t+'</h2>'+BWG.patchLine(fresh)+'<p>'+body+'</p>'+
      '<div class="k-row"><button class="k-btn" data-a="again">Play Again</button><button class="k-btn k-ghost" data-a="menu">Menu</button></div>');
    box.querySelector('[data-a=again]').onclick=function(){ BWK.closeSheet(true); deal(); };
    box.querySelector('[data-a=menu]').onclick=function(){ BWK.closeSheet(true); toMenu(); };
    BWK.say(h);
  }).catch(function(){});
}

/* ---------- controls ---------- */
tbl.addEventListener("click",function(e){ var el=e.target.closest(".cd.mine"); if(!el) return; var c=hands[0].filter(function(x){ return x.el===el; })[0]; if(c) tapCard(c); });
$("#deck").onclick=drawMe;
document.addEventListener("keydown",function(e){ if(!document.body.classList.contains("m-play")||document.querySelector(".k-veil.on")) return;
  if(e.key==="d"||e.key==="D"||e.key===" "){ e.preventDefault(); drawMe(); }
  else if(/^[1-9]$/.test(e.key)){ var c=hands[0][+e.key-1]; if(c) tapCard(c); } });
window.addEventListener("resize",function(){ requestAnimationFrame(geo); });
if(window.ResizeObserver) new ResizeObserver(function(){ if(document.body.classList.contains("m-play")) geo(); }).observe(tbl);
function whoChips(){ $("#who").innerHTML=ORDER.map(function(id){ return '<button data-id="'+id+'" class="'+(ST.who.indexOf(id)>=0?"on":"")+'" aria-pressed="'+(ST.who.indexOf(id)>=0)+'">'+CAST[id].av+CAST[id].n+'</button>'; }).join("");
  [].forEach.call($("#who").querySelectorAll("button"),function(b){ b.onclick=function(){ var id=b.dataset.id, k=ST.who.indexOf(id);
    if(k>=0){ if(ST.who.length>1) ST.who.splice(k,1); } else ST.who.push(id); save(); BWK.sfx("tap"); BWK.say(CAST[id].n+"!",true); whoChips(); }; }); }
function toMenu(){ gen++; over=true; busy=false; document.body.className="m-menu"; whoChips();
  $("#mfoot").textContent=ST.g?("Games won: "+ST.w+" of "+ST.g):"On a computer, press 1-9 to play a card, or D to draw."; }
$("#bPlay").onclick=function(){ document.body.className="m-play"; BWK.sfx("open"); BWK.say("Let's play!",true); requestAnimationFrame(deal); };
$("#bHow").onclick=function(){ BWK.sheet('<div class="how"><h2>How to Play</h2><p>'+HOW+'</p><p>A glowing card is one you can play. When an 8 is played, the bubble by the pile shows the new picture.</p><p>On a computer, press 1-9 to play a card, or D to draw.</p></div>'); BWK.say(HOW); };
$("#bBack").onclick=BWG.toOutpost;
$("#tMenu").onclick=function(){ BWK.sfx("tap"); toMenu(); };

var INTRO="Crazy Eights, Goofy Edition! Match the picture or the number to get rid of all your cards. Pick who you want to play with!";
var HOW="Everyone gets eight cards. On your turn, play a card that matches the picture or the number on the top card. Eights are crazy! You can play an eight any time, then pick the new picture. If you can't play, tap the deck to draw a card. The first one with no cards left wins!";
var PICK="Pick a picture!", DRAW="No match? Tap the deck to draw a card.";
var WIN="You got rid of all your cards! You win!", WINP="You win! You earned a new patch for your badge wall!";
var L={"ce-intro":INTRO,"ce-how-2":HOW,"ce-pick":PICK,"ce-draw":DRAW,"ce-turn":"Your turn!","ce-win":WIN,"ce-win-patch":WINP,
  "ce-lose-brody":CAST.brody.lose,"ce-lose-lulu":CAST.lulu.lose,"ce-lose-grandpa":CAST.grandpa.lose,
  "ce-s-banana":"Bananas!","ce-s-sock":"Socks!","ce-s-frog":"Frogs!","ce-s-balloon":"Balloons!",
  "ce-n-brody":"Brody-Bot!","ce-n-lulu":"Lulu the Llama!","ce-n-grandpa":"Grandpa Wobble!","ce-go":"Let's play!"};
BWK.lines(L);
toMenu();
BWK.init({here:"eights", voice:"outpost", intro:INTRO, noHello:true});
window.CEO={deal:deal,draw:drawMe,pick:function(){ busy=true; pickSuit(); },tap:function(k){ var c=hands[0][k]; if(c) tapCard(c); },
  playAny:function(){ var c=hands[0].filter(function(x){ return legal(x)&&(!drewThis||x===drewThis); })[0]; if(c){ tapCard(c); return true; } drawMe(); return false; },
  win:function(){ hands[0].slice(1).forEach(function(c){ c.el.remove(); }); hands[0]=hands[0].slice(0,1); var c=hands[0][0]; c.r=8; c.el.innerHTML=faceSvg(c); layoutHand(true); stacks(); },
  state:function(){ return {P:P,turn:turn,busy:busy,over:over,hand:hands&&hands[0].map(function(c){ return SN[c.s][0]+c.r; }),opp:hands&&hands.slice(1).map(function(h){ return h.length; }),deck:deck&&deck.length,top:pile&&top()&&(SN[top().s][0]+top().r),suit:SN[suit]}; },lines:L};
})();
</script>
