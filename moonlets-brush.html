/* ==========================================================================
   BrainWhim · Moonlets: Brush-Brush Timer (Nov 17, 2026; v2 the same evening, Judy: "feeling pretty basic… what can we do?").
   A little Moonlets bathroom (sunny by day, moonlit at bedtime). A brushing buddy (one of the 13 Slime Lab animals, picked by the
   child) stands by the sink and bounces to the song. 1) Squeeze a pea-sized dab of toothpaste (tap the tube). 2) Brush for two
   minutes: four parts of 30 s; the brush scrubs that part in the mirror's big drawn smile, foam bubbles build up, the part's sugar
   bugs giggle and pop off (the last is a wobbly boss bug), a gold ring fills; pick the song (music box, ukulele, lullaby).
   3) Spit and rinse (tap the cup): the foam floats away, the teeth sparkle, the buddy dances, a sun or moon goes on the week chart.
   A full week (all 14) brings the Tooth Fairy and a sticker (nothing is ever taken away: no streaks in Moonlets).
   Big Moonlet: a tongue step, a countdown, a "little circles" tip. Wake Lock while brushing.
   Saved: bwk.brush {days:{date:{am,pm}}, n, buddy, song, fairy:{weekStart:1}}. Lines bb-*. Test hook BBO.
   Judy's photos (bb/): bg-day, bg-night, mirror, brush, tube, cup; drawn stand-ins until then. Foam = Bubble Pop's bubble photo.
   ========================================================================== */
.bg{position:fixed;inset:-12px;z-index:-1;background:#cfe8ef linear-gradient(180deg,#e4f4f7,#c4e2ea 55%,#a9cfd9) center/cover;filter:blur(1.2px) brightness(.95)}
html.night .bg{background:#1f2a4a linear-gradient(180deg,#2a3560,#1d2747 60%,#151d38) center/cover}
html.bbd .bg{background:#cfe8ef url("bb/bg-day-sm.jpg?v=1117a") center 60%/cover}
html.bbn.night .bg{background:#1f2a4a url("bb/bg-night-sm.jpg?v=1117a") center 60%/cover;filter:blur(1.2px) brightness(.9)}
@media (min-width:1100px){html.bbd .bg{background-image:url("bb/bg-day.jpg?v=1117a")}html.bbn.night .bg{background-image:url("bb/bg-night.jpg?v=1117a")}}
.md{height:100svh;min-height:480px;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:calc(84px + var(--k-safe-t)) 12px calc(12px + var(--k-safe-b))}
.top{width:min(100%,720px);display:flex;justify-content:center;padding-top:16px;flex:none;min-height:96px}

.top .k-finn-in{margin:0}
.top .k-finn{display:block;position:relative;width:fit-content;max-width:100%}
.top .k-fm{position:absolute;left:-12px;top:-18px;z-index:2;width:62px;height:62px;cursor:pointer}
.top .k-finn .k-fb{margin:0;padding:12px 18px 12px 54px;border-radius:20px}
/* the counter scene: mirror in the middle, buddy on the left, tube and cup on the right */
#stage{flex:1;min-height:0;width:min(100%,820px);position:relative}
#mir{position:absolute;left:50%;top:0;height:calc(100% - var(--cb,0px));max-height:540px;aspect-ratio:1;max-width:100%;transform:translateX(-50%);display:block;filter:drop-shadow(0 12px 18px rgba(30,60,80,.35))}
.ledge{position:absolute;left:0;right:0;bottom:0;height:var(--lh,40px);border-radius:14px;background:linear-gradient(180deg,#e8c48c,#c99a5c 40%,#a87a44);box-shadow:0 8px 16px rgba(60,30,8,.35),inset 0 2px 0 rgba(255,240,210,.6)}
/* the little wooden shelf stays (on phones the photo's counter is cropped away, and the buddy, tube and cup need something to stand on) */
.count{position:absolute;right:2%;top:2%;font:700 40px Outfit,system-ui,sans-serif;color:#fff;text-shadow:0 2px 6px rgba(20,60,90,.6);display:none;z-index:3}

.tick{stroke:#fff;stroke-width:2;opacity:.8}
.tooth{fill:url(#bbTooth);stroke:rgba(150,120,90,.35);stroke-width:.45;transition:fill .5s}
.tooth.clean{fill:url(#bbClean);stroke:rgba(150,170,200,.35)}
.zone-glow{mix-blend-mode:screen}
.zone-glow{fill:rgba(255,236,150,0);transition:fill .4s}
.zone-glow.on{fill:rgba(255,236,150,.16)}
.bug{transform-box:fill-box;transform-origin:center;animation:wig 1.2s ease-in-out infinite}
.bug.boss.next{animation:boss .35s ease-in-out infinite}

#fairy.on{display:block}

@keyframes fly{0%{transform:translate(0,0)}30%{transform:translate(45vw,-12vh)}55%{transform:translate(calc(50vw + 10px),6vh)}100%{transform:translate(calc(100vw + 160px),-20vh)}}

.stk{display:flex;flex-direction:column;align-items:center;gap:6px}

.chip span{font-size:12.5px;font-weight:700;white-space:nowrap}

  function stop(){ cancelAnimationFrame(raf); raf=0; if(T){ T.run=false; T.mus=false; } wake(false); var b=$("brush"); if(b) b.classList.add("rest"); if(T&&T.ph==="brush") $("buddy").className=""; }
  function loop(now){ if(!T||!T.run) return; var dt=Math.min(.25,(now-T.last)/1000); T.last=now; T.el+=dt; music(); paint(false);
    if(T.el>=total()){ toRinse(); return; } raf=requestAnimationFrame(loop); }
  function paint(quiet){ var tt=total(), pa=partAt(T.el), r=$("ring"); if(!r) return;
    r.setAttribute("stroke-dashoffset",(RING_LEN*(1-Math.min(1,T.el/tt))).toFixed(1));
    $("count").textContent=fmt(Math.max(0,tt-T.el));
    if(T.ph!=="brush"&&T.ph!=="rinse"&&T.ph!=="done") return;
    if(pa.i!==T.part && T.run){ T.part=pa.i; if(pa.i<parts().length){ brushTo(pa.i); if(pa.i>0) $("dab").classList.remove("on"); SND.swish(); if(pa.i>0){ SND.chime(); var bd=$("buddy"); bd.className=""; void bd.offsetWidth; bd.className="cheer"; setTimeout(function(){ if(T.run) bd.className="bob"; },700); }
        sayQ(Z[pa.i],pa.i<4?"bb-z"+(pa.i+1):"bb-tongue");
        
        for(var z=0;z<4;z++) $("zg"+z).classList.toggle("on",z===pa.i);
        $("tongue").classList.toggle("tongue-on",pa.i===4); } }
    if(T.run&&pa.i<parts().length){ T.foamT-=1/60; if(T.foamT<=0&&FOAM.length<26){ addFoam(pa.i); T.foamT=.9+Math.random()*.8; } }
    if(T.run&&pa.i<4){ var mine=BUGS.filter(function(b){ return b.p===pa.i; }), want=Math.floor(pa.t/pa.len*(mine.length+.6));
      mine.forEach(function(b,k){ if(k<want&&!b.gone) popBug(b,quiet); if(k===want&&b.boss&&!b.gone) b.el.classList.add("next"); });
      BUGS.forEach(function(b){ if(b.p<pa.i&&!b.gone) popBug(b,true); });
      TEETH.forEach(function(th){ if(th.p<pa.i&&!th.clean){ th.clean=true; th.el.classList.add("clean"); th.el.classList.remove("dim"); } }); }
    if(T.run&&big&&!T.tip&&pa.i===1&&pa.t>8){ T.tip=true; sayQ(TIP,"bb-tip"); } }
  function toRinse(){ stop(); T.ph="rinse"; T.el=total(); paint(true); BUGS.forEach(function(b){ if(!b.gone) popBug(b,true); });
    TEETH.forEach(function(th){ th.clean=true; th.el.classList.add("clean"); th.el.classList.remove("dim"); }); for(var z=0;z<4;z++) $("zg"+z).classList.remove("on"); $("tongue").classList.remove("tongue-on");
    brushTo(-1); $("cup").classList.add("pulse"); $("buddy").className=""; sayQ(RINSE,"bb-rinse"); bar();
    rinseT=setTimeout(function(){ if(T.ph==="rinse") sayQ(RINSE,"bb-rinse"); },15000); }
  function rinse(){ if(T.ph!=="rinse") return; clearTimeout(rinseT); var c=$("cup"); c.classList.remove("pulse","tip"); void c.offsetWidth; c.classList.add("tip"); SND.rinse();
    FOAM.forEach(function(f,i){ var b=f.firstChild; setTimeout(function(){ b.classList.add("away"); },i*25); }); setTimeout(function(){ var g=$("foam"); if(g) g.innerHTML=""; FOAM=[]; },1500);
    setTimeout(finish,900); }
  function finish(){ T.ph="done"; SND.win(); $("buddy").className="dance"; setTimeout(function(){ if(T.ph==="done") $("buddy").className=""; },4200);
    var k=dayKey(), h=new Date().getHours(), slot=h<14?"am":"pm"; S.days[k]=S.days[k]||{}; S.days[k][slot]=1; S.n++; save(); BWK.played&&BWK.played("brush");
    var fx=$("fx"); for(var i=0;i<14;i++){ var a=i/14*Math.PI*2, w=el("g",{transform:"translate("+(100+Math.cos(a)*70).toFixed(0)+" "+(118+Math.sin(a)*40).toFixed(0)+")"},fx), s=el("path",{d:"M0 -4l1 2.8 2.8 1-2.8 1-1 2.8-1-2.8-2.8-1 2.8-1z","class":"spk"},w); s.style.animationDelay=(i*.05)+"s"; setTimeout(w.remove.bind(w),1800); }
    week(); bar();
    var fairy=weekCount()===14&&!S.fairy[dayKey(weekStart())];
    say(night?NIGHT:DONE,night?"bb-night":"bb-done",{onend:function(){ if(fairy) toothFairy(); }});
    if(fairy) setTimeout(function(){ if(!S.fairy[dayKey(weekStart())]) toothFairy(); },6000); }
  async function wake(onoff){ try{ if(onoff&&navigator.wakeLock&&!lock){ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",function(){ lock=null; }); } else if(!onoff&&lock){ lock.release(); lock=null; } }catch(e){} }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden&&T&&T.run){ wake(true); T.last=performance.now(); } });
  $("tube").addEventListener("click",function(){ if(T.ph==="paste") squeeze(); else if(T.ph==="ready"){ BWK.sfx("tap"); begin(); } else SND.squeeze(); });
  $("cup").addEventListener("click",function(){ if(T.ph==="rinse") rinse(); else BWK.sfx("tap"); });
  $("buddy").addEventListener("click",function(){ if(T.run) return; pickBuddy(false); });

  /* ---------- the Tooth Fairy: a full week of suns and moons (never taken away) ---------- */
  function toothFairy(){ if(S.fairy[dayKey(weekStart())]) return; S.fairy[dayKey(weekStart())]=1; S.stickers=(S.stickers||0)+1; save(); SND.fairy();
    var f=$("fairy"); f.innerHTML=PH.fairy?'<img class="f" src="'+PH.fairy+'" alt="">':'<svg class="f" viewBox="0 0 100 100"><defs><radialGradient id="tfG"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#fff2b0"/><stop offset="1" stop-color="rgba(255,226,122,0)"/></radialGradient></defs>'+
      '<ellipse cx="34" cy="40" rx="22" ry="14" fill="rgba(220,240,255,.75)" stroke="#fff" transform="rotate(-25 34 40)"/><ellipse cx="66" cy="40" rx="22" ry="14" fill="rgba(220,240,255,.75)" stroke="#fff" transform="rotate(25 66 40)"/>'+
      '<circle cx="50" cy="52" r="30" fill="url(#tfG)"/><circle cx="50" cy="52" r="11" fill="#fff8dc"/><path d="M50 22l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff"/></svg>';
    f.classList.add("on"); var fe=f.querySelector(".f"), n=0, iv=setInterval(function(){ var r=fe.getBoundingClientRect(), d=document.createElement("i"); d.className="tr"; d.style.left=(r.left+r.width/2)+"px"; d.style.top=(r.top+r.height/2)+"px"; f.appendChild(d); setTimeout(d.remove.bind(d),1500); if(++n>40) clearInterval(iv); },80);
    setTimeout(function(){ f.classList.remove("on"); f.innerHTML="";
      BWK.sheet('<div class="stk"><h2>The Tooth Fairy came!</h2>'+(PH.sticker?'<img class="st" src="'+PH.sticker+'" alt="Tooth Fairy sticker">':'<svg viewBox="0 0 100 100"><defs><radialGradient id="tsG" cx="35%" cy="30%"><stop offset="0" stop-color="#fffbe6"/><stop offset=".6" stop-color="#ffd95a"/><stop offset="1" stop-color="#e5a52a"/></radialGradient></defs>'+
        '<path d="M50 6l12 30 32 2-25 20 9 31-28-18-28 18 9-31-25-20 32-2z" fill="url(#tsG)" stroke="#fff" stroke-width="2"/><path d="M42 44q8-8 16 0v14q-4 6-8 0-4 6-8 0z" fill="#fff" stroke="#e0d6c0"/></svg>')+
        '<p>A sparkly Tooth Fairy sticker for brushing every morning and every night this week!</p><p><b>Tooth Fairy stickers: '+S.stickers+'</b></p></div>');
      say(FAIRY,"bb-fairy"); },3400); }

  /* ---------- buddy picker ---------- */
  function pickBuddy(thenBegin){ var h='<h2>Pick a brushing buddy</h2><div class="pick">';
    AN.forEach(function(a,i){ h+='<button data-i="'+i+'" data-say="'+a[1]+'" class="'+(S.buddy===i?'on':'')+'"><img src="sl/c-'+a[0]+'.webp?v=1115a" alt="">'+a[1]+'</button>'; });
    var box=BWK.sheet(h+'</div>'); say(PICK,"bb-pick");
    box.querySelector(".pick").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b) return; S.buddy=+b.dataset.i; save(); buddyPic(); BWK.sfx("yay"); BWK.closeSheet(true);
      var bd=$("buddy"); bd.className=""; void bd.offsetWidth; bd.className="cheer"; setTimeout(function(){ bd.className=""; },800); if(thenBegin) setTimeout(begin,500); }); }

  /* ---------- the week chart: this week, Sunday to Saturday, and the Tooth Fairy count ---------- */
  function weekCount(){ var d0=weekStart(), c=0; for(var i=0;i<7;i++){ var r=S.days[dayKey(new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i))]||{}; c+=(r.am?1:0)+(r.pm?1:0); } return c; }
  function week(){ var now=new Date(), d0=weekStart(), h="", N=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    for(var i=0;i<7;i++){ var d=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i), k=dayKey(d), r=S.days[k]||{};
      h+='<div class="'+(i===now.getDay()?'today':'')+'"><b>'+N[i]+'</b><i class="'+(r.am?'on':'')+'" aria-label="'+N[i]+' morning'+(r.am?', brushed':'')+'">☀</i><i class="pm '+(r.pm?'on':'')+'" aria-label="'+N[i]+' night'+(r.pm?', brushed':'')+'">☾</i></div>'; }
    h+='<div class="fp" aria-label="Tooth Fairy: '+weekCount()+' of 14"><em>'+(PH.fairy?'<img src="'+PH.fairy+'" alt="" style="height:30px;display:block;margin:0 auto">':'🧚')+'</em>'+weekCount()+'/14</div>';
    $("week").innerHTML=h; }

  /* ---------- the bottom row ---------- */
  function bar(){ var run=T&&T.run, ph=T?T.ph:"ready", go;
    if(run) go='<em>❚❚</em><span>Pause</span>'; else if(ph==="done") go='<em>↺</em><span>Brush again</span>'; else if(ph==="brush"&&T.el>0) go='<em>▶</em><span>Go</span>'; else if(ph==="paste"||ph==="rinse") go='<em>'+(ph==="paste"?'🪥':'🥤')+'</em><span>'+(ph==="paste"?'Toothpaste':'Rinse')+'</span>'; else go='<em>▶</em><span>Start</span>';
    $("bar").innerHTML='<button class="chip go'+(run?'':' pulse')+'" data-a="go" aria-label="'+(run?'Pause':'Start')+'">'+go+'</button>'+
      (T&&T.el>0&&ph==="brush"&&!run?'<button class="chip" data-a="over" data-say="Start over"><em>↺</em><span>Start over</span></button>':'')+
      '<button class="chip" data-a="song" aria-label="Song: '+SONGS[S.song][0]+'"><em>♪</em><span>'+SONGS[S.song][0]+'</span></button>'+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="games" data-say="My Moon Day"><em>☾</em><span>My Moon Day</span></button>'; }
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; BWK.sfx("tap");
    var a=b.dataset.a;
    if(a==="go"){ if(T.run){ stop(); say(PAUSE,"bb-pause"); bar(); }
      else if(T.ph==="ready") { BWK.finnStop(); begin(); }
      else if(T.ph==="paste") squeeze();
      else if(T.ph==="rinse") rinse();
      else if(T.ph==="done") { reset(); begin(); }
      else { BWK.finnStop(); start(); } }
    else if(a==="over"){ reset(); }
    else if(a==="song"){ S.song=(S.song+1)%3; save(); document.documentElement.style.setProperty("--beat",(TUNES[S.song].beat*2)+"s"); if(!T.run) preview(); say(SONGS[S.song][0]+"!",SONGS[S.song][1]); bar(); }
    else if(a==="big"){ if(T.run) return; big=!big; talked=true; BWK.setBig(big,top); reset(); }
    else if(a==="games"){ stop(); BWK.finnStop(); BWK.sfx("whoosh"); setTimeout(function(){ location.href="moonlets-day.html"; },200); } });
  window.addEventListener("bwk-big",function(e){ if(!!e.detail!==big&&!(T&&T.run)){ big=!!e.detail; reset(); } });
  document.addEventListener("click",function(e){ if(talked || !e.target.isConnected || e.target.closest("#stage,.chip,.week,.k-head,.k-sheet,.k-veil")) return; say(HI,"bb-hi"); });

  /* ---------- sizes: buddy, tube and cup scale with the scene ---------- */
  function layout(){ var st=$("stage"), W=st.clientWidth, H=st.clientHeight, s=Math.min(W,H*1.15);
    st.style.setProperty("--lh",Math.round(Math.max(26,Math.min(48,H*.12)))+"px"); st.style.setProperty("--bw",Math.round(s*.3)+"px"); st.style.setProperty("--tw",Math.round(s*.13)+"px");
    st.style.setProperty("--cb",Math.round(Math.max(26,Math.min(48,H*.12))*.25)+"px"); }
  if(window.ResizeObserver) new ResizeObserver(layout).observe($("stage")); else window.addEventListener("resize",layout);
  layout(); buddyPic(); reset();
  window.BBO={state:function(){ return T&&{ph:T.ph,run:T.run,el:T.el,part:T.part,bugs:BUGS.filter(function(b){return !b.gone;}).length,foam:FOAM.length,total:total(),n:S.n,buddy:S.buddy,song:S.song,week:weekCount(),fairy:S.stickers||0}; },
    begin:begin, squeeze:squeeze, start:start, rinse:rinse, skip:function(s){ T.el+=s; }, finish:function(){ T.el=total()-.01; }, big:function(on){ big=!!on; BWK.setBig(big); reset(); },
    buddy:function(i){ S.buddy=i; save(); buddyPic(); }, fillWeek:function(){ var d0=weekStart(); for(var i=0;i<7;i++){ var k=dayKey(new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i)); S.days[k]={am:1,pm:1}; } var t=dayKey(), h=new Date().getHours(); delete S.days[t][h<14?"am":"pm"]; save(); week(); }};
})();
</script>
