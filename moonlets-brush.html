/* ==========================================================================
   BrainWhim · Moonlets: Brush-Brush Timer (Nov 17, 2026), a two-minute toothbrushing timer. A sunny little bathroom in the Moonlets world.
   A big friendly smile in a round mirror: four parts (top/bottom, this side/that side), 30 seconds each. The brush scrubs the part
   to do; little sugar bugs pop off its teeth one by one; a ring fills for the two minutes; a music box plays. No tapping needed
   while brushing (hands are busy). Each brushing puts a sun (morning) or a moon (night) on the week chart.
   Big Moonlet: a fifth step (brush your tongue, 15 s), a big countdown, and "little circles" tips.
   Keeps the screen awake while brushing (Wake Lock). Saved: bwk.brush {days:{"YYYY-MM-DD":{am,pm}}, n}. Lines bb-*. Test hook BBO.
   Judy's photos (bb/): bg, mirror frame, toothbrush; drawn stand-ins until then.
   ========================================================================== */
.bg{position:fixed;inset:-12px;z-index:-1;background:#cfe8ef linear-gradient(180deg,#dff2f6,#bfe0ea 55%,#9fcbd8) center/cover;filter:blur(1.2px) brightness(.95)}
html.bbbg .bg{background:#cfe8ef url("bb/bg-sm.jpg?v=1117a") center 55%/cover}
@media (min-width:1100px){html.bbbg .bg{background-image:url("bb/bg.jpg?v=1117a")}}
.md{height:100svh;min-height:480px;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:calc(84px + var(--k-safe-t)) 12px calc(12px + var(--k-safe-b))}
.top{width:min(100%,720px);display:flex;justify-content:center;padding-top:16px;flex:none;min-height:96px}
@media (max-height:600px){.top{min-height:84px}}
.top .k-finn-in{margin:0}
.top .k-finn{display:block;position:relative;width:fit-content;max-width:100%}
.top .k-fm{position:absolute;left:-12px;top:-18px;z-index:2;width:62px;height:62px;cursor:pointer}
.top .k-finn .k-fb{margin:0;padding:12px 18px 12px 54px;border-radius:20px}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#mir{height:100%;max-height:560px;aspect-ratio:1;max-width:100%;display:block;filter:drop-shadow(0 12px 18px rgba(30,60,80,.35))}
.count{position:absolute;right:max(4%,calc(50% - 300px));top:4%;font:700 44px Outfit,system-ui,sans-serif;color:#fff;text-shadow:0 2px 6px rgba(20,60,90,.6);display:none}
body.big .count{display:block}
/* the mirror and the smile (drawn) */
.ring-bg{fill:none;stroke:rgba(255,255,255,.55);stroke-width:7}
.ring{fill:none;stroke:#ffcf4a;stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:100px 100px}
.tick{stroke:#fff;stroke-width:2;opacity:.8}
.tooth{fill:url(#bbTooth);stroke:#d9d2c4;stroke-width:.8}
.tooth.dim{opacity:.55}
.tooth.clean{fill:url(#bbClean)}
.zone-glow{fill:rgba(255,236,150,.0);transition:fill .4s}
.zone-glow.on{fill:rgba(255,236,150,.28)}
.bug{transform-box:fill-box;transform-origin:center;animation:wig 1.2s ease-in-out infinite}
.bug.gone{animation:bye .5s ease-in forwards}
@keyframes wig{50%{transform:rotate(12deg) translateY(-1px)}}
@keyframes bye{to{transform:translateY(-14px) scale(.2);opacity:0}}
.spk{fill:#fff;transform-box:fill-box;transform-origin:center;animation:tw 1s ease-out both}
@keyframes tw{from{transform:scale(.2);opacity:1}to{transform:scale(1.5);opacity:0}}
.brush{transition:transform .5s cubic-bezier(.3,1.2,.4,1)}
.brush .scrub{animation:scrub .32s ease-in-out infinite alternate}
.brush.rest .scrub{animation:none}
@keyframes scrub{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.tongue-on{animation:tg 1s ease-in-out infinite alternate}
@keyframes tg{to{fill:#ff9fae}}
/* the week chart */
.week{flex:none;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:min(100%,520px);padding:8px 10px;border-radius:18px;background:linear-gradient(180deg,#f4ead3,#e6d6b2);box-shadow:0 6px 14px rgba(30,60,80,.25)}
.week div{display:flex;flex-direction:column;align-items:center;gap:3px}
.week b{font-size:12px;color:#7a5a30}
.week div.today b{color:#c26a12}
.week i{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;background:rgba(120,90,50,.15);box-shadow:inset 0 1px 2px rgba(0,0,0,.2);color:transparent}
.week i.on{color:inherit;background:radial-gradient(circle at 35% 30%,#fffbe0,#ffd95a 60%,#e5a52a);box-shadow:0 0 8px rgba(255,200,80,.7)}
.week i.on.pm{background:radial-gradient(circle at 35% 30%,#efe8ff,#b9a6f0 60%,#7a64c8);box-shadow:0 0 8px rgba(160,140,240,.7)}
.bar{flex:none;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:100%}
.chip{appearance:none;cursor:pointer;height:58px;min-width:84px;padding:4px 14px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:linear-gradient(180deg,rgba(32,44,90,.9),rgba(16,24,54,.9));border:1px solid rgba(255,236,190,.28);color:#e9f0fb;font:inherit;
  box-shadow:0 6px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip span{font-size:12.5px;font-weight:700;white-space:nowrap}
.chip em{font-style:normal;font-size:22px;line-height:1}
.chip.go{background:linear-gradient(180deg,#ffe7a6,#e9c46a);color:#3a2306;border-color:#fff0c4;box-shadow:0 4px 0 #a97a1c,0 8px 16px rgba(0,0,0,.35)}
.chip.go.pulse{animation:pls 1.3s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.06)}}
.chip.bigc{background:linear-gradient(180deg,rgba(60,40,110,.9),rgba(30,20,70,.9));border-color:rgba(214,190,255,.45)}
.chip.bigc i.sw{position:relative;display:block;width:34px;height:18px;border-radius:9px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25)}
.chip.bigc i.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#cfc6e6;transition:left .2s,background .2s}
.chip.bigc[aria-pressed="true"]{background:linear-gradient(180deg,#e6d6ff,#b89cf2);border-color:#efe4ff;box-shadow:0 0 0 3px rgba(190,160,255,.4),0 0 18px rgba(190,160,255,.55),0 6px 14px rgba(0,0,0,.4)}
.chip.bigc[aria-pressed="true"] span{color:#2a1650}
.chip.bigc[aria-pressed="true"] i.sw{background:#6a48c8}
.chip.bigc[aria-pressed="true"] i.sw::after{left:18px;background:#fff6d0}
@media (max-width:600px){.top .k-fm{width:56px;height:56px}.top .k-finn .k-fb{font-size:15.5px;padding:10px 14px 10px 48px}
  .chip{height:54px;min-width:0;flex:1;padding:4px 8px}.bar{width:100%;flex-wrap:nowrap}.week{gap:3px;padding:6px}.week i{width:20px;height:20px;font-size:13px}.count{font-size:34px}}
@media (max-height:600px){.md{gap:6px;padding-top:calc(78px + var(--k-safe-t))}.chip{height:48px}.chip em{font-size:18px}
  .top .k-fm{width:52px;height:52px}.top .k-finn .k-fb{font-size:15px;padding:8px 12px 8px 46px}.week i{width:18px;height:18px;font-size:11px}.week b{font-size:11px}}
@media (min-width:700px) and (min-height:760px){.chip{height:70px;min-width:120px;border-radius:24px}.chip span{font-size:15px}.chip em{font-size:28px}}
@media (prefers-reduced-motion:reduce){.chip.go.pulse,.bug,.brush .scrub{animation:none}}

      el("circle",{cx:-1.3,cy:-.4,r:.45,fill:"#222"},b); el("circle",{cx:1.5,cy:-.4,r:.45,fill:"#222"},b); el("path",{d:"M-1.2 1.6 q1.2 1 2.4 0",stroke:"#3a1f4a","stroke-width":.5,fill:"none"},b);
      b.style.animationDelay=(-Math.random()*1.2).toFixed(2)+"s"; BUGS.push({p:p,el:b,x:s[0],y:s[1],gone:false}); }); }
  function popBug(b){ b.gone=true; b.el.classList.add("gone"); SND.pop(); var fx=$("fx");
    for(var k=0;k<3;k++){ var w=el("g",{transform:"translate("+(b.x+(k-1)*5)+" "+(b.y-4-k*2)+")"},fx); el("path",{d:"M0 -3l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z","class":"spk"},w); setTimeout(w.remove.bind(w),1100); } }

  /* ---------- the timer ---------- */
  var big=BWK.big(), T=null, raf=0, lock=null;
  function parts(){ return big?[30,30,30,30,15]:[30,30,30,30]; }
  function total(){ return parts().reduce(function(a,b){return a+b;},0); }
  function reset(){ stop(); T={el:0, run:false, done:false, part:-1, half:false, tip:false}; drawMirror(); addBugs(); paint(); bar(); week(); $("count").textContent=fmt(total()); document.body.classList.toggle("big",big); }
  function fmt(s){ s=Math.ceil(s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
  function partAt(t){ var P=parts(), a=0; for(var i=0;i<P.length;i++){ if(t<a+P[i]) return {i:i, t:t-a, len:P[i]}; a+=P[i]; } return {i:P.length, t:0, len:0}; }
  function start(){ if(T.done) reset(); T.run=true; T.last=performance.now(); beat=0; nextT=0; wake(true); bar(); $("brush").classList.remove("rest"); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }
  function stop(){ cancelAnimationFrame(raf); raf=0; if(T) T.run=false; wake(false); var b=$("brush"); if(b) b.classList.add("rest"); }
  function loop(now){ if(!T||!T.run) return; var dt=Math.min(.25,(now-T.last)/1000); T.last=now; T.el+=dt; music(); paint();
    if(T.el>=total()){ finish(); return; } raf=requestAnimationFrame(loop); }
  function paint(){ var tt=total(), pa=partAt(T.el);
    $("ring").setAttribute("stroke-dashoffset",(RING_LEN*(1-Math.min(1,T.el/tt))).toFixed(1));
    $("count").textContent=fmt(Math.max(0,tt-T.el));
    if(pa.i!==T.part && T.run){ T.part=pa.i; if(pa.i<parts().length){ brushTo(pa.i); SND.swish(); if(pa.i>0) SND.chime();
        say(Z[pa.i],pa.i<4?"bb-z"+(pa.i+1):"bb-tongue");
        TEETH.forEach(function(th){ th.el.classList.toggle("dim",pa.i<4&&th.p!==pa.i&&!th.clean); });
        for(var z=0;z<4;z++) $("zg"+z).classList.toggle("on",z===pa.i);
        $("tongue").classList.toggle("tongue-on",pa.i===4); } }
    /* the bugs of this part pop one by one across its 30 seconds; earlier parts are all clean */
    if(T.run&&pa.i<4){ var mine=BUGS.filter(function(b){ return b.p===pa.i; }), want=Math.floor(pa.t/pa.len*(mine.length+.6));
      mine.forEach(function(b,k){ if(k<want&&!b.gone) popBug(b); });
      BUGS.forEach(function(b){ if(b.p<pa.i&&!b.gone) popBug(b); });
      TEETH.forEach(function(th){ if(th.p<pa.i&&!th.clean){ th.clean=true; th.el.classList.add("clean"); th.el.classList.remove("dim"); } }); }
    if(T.run&&!T.half&&T.el>=tt/2&&T.el<tt/2+1.5&&!big){ T.half=true; }
    if(T.run&&big&&!T.tip&&pa.i===1&&pa.t>8){ T.tip=true; say(TIP,"bb-tip"); } }
  function finish(){ stop(); T.done=true; T.el=total(); paint(); BUGS.forEach(function(b){ if(!b.gone) popBug(b); });
    TEETH.forEach(function(th){ th.clean=true; th.el.classList.add("clean"); th.el.classList.remove("dim"); }); for(var z=0;z<4;z++) $("zg"+z).classList.remove("on"); $("tongue").classList.remove("tongue-on");
    brushTo(-1); SND.win();
    var k=dayKey(), h=new Date().getHours(), slot=h<14?"am":"pm"; S.days[k]=S.days[k]||{}; S.days[k][slot]=1; S.n++; save(); BWK.played&&BWK.played("brush");
    var fx=$("fx"); for(var i=0;i<14;i++){ var a=i/14*Math.PI*2, w=el("g",{transform:"translate("+(100+Math.cos(a)*70).toFixed(0)+" "+(118+Math.sin(a)*40).toFixed(0)+")"},fx), s=el("path",{d:"M0 -4l1 2.8 2.8 1-2.8 1-1 2.8-1-2.8-2.8-1 2.8-1z","class":"spk"},w); s.style.animationDelay=(i*.05)+"s"; setTimeout(w.remove.bind(w),1800); }
    say(DONE,"bb-done"); week(); bar(); }
  async function wake(onoff){ try{ if(onoff&&navigator.wakeLock&&!lock){ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",function(){ lock=null; }); } else if(!onoff&&lock){ lock.release(); lock=null; } }catch(e){} }
  document.addEventListener("visibilitychange",function(){ if(!document.hidden&&T&&T.run){ wake(true); T.last=performance.now(); } });

  /* ---------- the week chart: this week, Sunday to Saturday ---------- */
  function week(){ var now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()), h="", N=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    for(var i=0;i<7;i++){ var d=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i), k=dayKey(d), r=S.days[k]||{};
      h+='<div class="'+(i===now.getDay()?'today':'')+'"><b>'+N[i]+'</b><i class="'+(r.am?'on':'')+'" aria-label="'+N[i]+' morning'+(r.am?', brushed':'')+'">☀</i><i class="pm '+(r.pm?'on':'')+'" aria-label="'+N[i]+' night'+(r.pm?', brushed':'')+'">☾</i></div>'; }
    $("week").innerHTML=h; }

  /* ---------- the bottom row ---------- */
  function bar(){ var run=T&&T.run;
    $("bar").innerHTML='<button class="chip go'+(run?'':' pulse')+'" data-a="go" data-say="'+(run?'Pause':'Start')+'"><em>'+(run?'❚❚':(T&&T.done?'↺':'▶'))+'</em><span>'+(run?'Pause':(T&&T.done?'Brush again':(T&&T.el>0?'Go':'Start')))+'</span></button>'+
      (T&&T.el>0&&!T.done&&!run?'<button class="chip" data-a="over" data-say="Start over"><em>↺</em><span>Start over</span></button>':'')+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="games" data-say="More games"><em>☾</em><span>More games</span></button>'; }
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; BWK.sfx("tap");
    if(b.dataset.a==="go"){ if(T.run){ stop(); say(PAUSE,"bb-pause"); bar(); } else { BWK.finnStop(); start(); } }
    else if(b.dataset.a==="over"){ reset(); }
    else if(b.dataset.a==="big"){ big=!big; talked=true; BWK.setBig(big,top); reset(); }
    else if(b.dataset.a==="games"){ stop(); BWK.finnStop(); BWK.sfx("whoosh"); setTimeout(function(){ location.href="moonlets-games.html"; },200); } });
  window.addEventListener("bwk-big",function(e){ if(!!e.detail!==big){ big=!!e.detail; reset(); } });
  document.addEventListener("click",function(e){ if(talked || e.target.closest("#stage,.chip,.week,.k-head,.k-sheet,.k-veil")) return; say(HI,"bb-hi"); });

  reset();
  window.BBO={state:function(){ return T&&{run:T.run,done:T.done,el:T.el,part:T.part,bugs:BUGS.filter(function(b){return !b.gone;}).length,total:total(),n:S.n}; },
    start:start, skip:function(s){ T.el+=s; }, finish:function(){ T.el=total()-.01; }, big:function(on){ big=!!on; BWK.setBig(big); reset(); }};
})();
</script>
</body>
