/* ===== The Night Train (Puzzles & Brain Games, Nov 1): a daily seating mystery aboard a 1920s sleeping car =====
   A model sleeping car stands on its rails on a walnut plinth. Its compartments are numbered from the engine end.
   The passengers (and, from Friday, their luggage) wait on the platform; seat each one so every one of the steward's
   clues holds. Only one seating works, and it tells you who took the necklace.
   Carriages (the Carriages card): Claret & Gold (free); Midnight & Silver, Racing Green & Brass (Club). */
body{--car1:#7a1f2b;--car2:#4e1119;--car3:#2f0a10;--line:#e2bd62;--metal1:#fff0bf;--metal2:#d9b25a;--metal3:#8f6a22;--roof:#2d2a2a;--glow:#ffcf7a}
body[data-set="midnight"]{--car1:#21345a;--car2:#152340;--car3:#0b1428;--line:#d9dde6;--metal1:#ffffff;--metal2:#c3c9d4;--metal3:#6d7584;--roof:#23252b;--glow:#ffd99a}
body[data-set="green"]{--car1:#1f4a33;--car2:#143323;--car3:#0b1f15;--line:#e2bd62;--metal1:#fff0bf;--metal2:#d9b25a;--metal3:#8f6a22;--roof:#2a2b28;--glow:#ffcf7a}
.nt-mono{font:500 1em Montserrat,sans-serif;white-space:nowrap}.nt-mono i{font:400 .76em Pacifico,cursive;font-style:normal;margin-left:.05em;padding-right:.15em}
.nt-pad{position:relative;flex:none;display:grid;grid-template-columns:auto auto;gap:16px;align-items:start;justify-content:center}
.nt-left{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.nt-right{display:flex;flex-direction:column;gap:10px;width:var(--nt-nw,300px)}
/* ---------- the model: the sleeping car on its rails, on a walnut plinth (Nov 1: the 3-D pass) ----------
   Light comes from the top left everywhere: highlights on top and left edges, shade and shadows to the bottom right.
   Seen from a little above: the roof's top and the track bed recede, and everything casts a soft shadow. */
.nt-model{position:relative;padding:0 var(--nt-px,14px);-webkit-user-select:none;user-select:none;touch-action:none}
.nt-car{position:relative;z-index:2;border-radius:calc(var(--ww) * .1) calc(var(--ww) * .1) 5px 5px;padding:calc(var(--ww) * .24) calc(var(--ww) * .36) calc(var(--ww) * .16);
  background:linear-gradient(180deg,rgba(255,255,255,.2) 0,rgba(255,255,255,.07) 9%,transparent 26%,transparent 76%,rgba(0,0,0,.18) 88%,rgba(0,0,0,.42) 100%),
    linear-gradient(90deg,rgba(255,255,255,.1),transparent 22%,transparent 72%,rgba(0,0,0,.24)),
    repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),var(--car1);
  box-shadow:inset 0 calc(var(--ww) * .07) calc(var(--ww) * .06) calc(var(--ww) * -.03) rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.55),inset 1px 0 0 rgba(255,255,255,.12),3px 7px 10px rgba(0,0,0,.4)}
/* the roof: its curved top seen from a little above, with ventilators catching the light */
.nt-car::before{content:"";position:absolute;left:calc(var(--ww) * -.06);right:calc(var(--ww) * -.06);top:calc(var(--ww) * -.3);height:calc(var(--ww) * .38);border-radius:calc(var(--ww) * .3) calc(var(--ww) * .3) 4px 4px / calc(var(--ww) * .22) calc(var(--ww) * .22) 4px 4px;
  background:radial-gradient(ellipse calc(var(--ww) * .1) calc(var(--ww) * .045) at 14% 30%,#cfc9c1 25%,#57524e 60%,transparent 66%),radial-gradient(ellipse calc(var(--ww) * .1) calc(var(--ww) * .045) at 38% 30%,#cfc9c1 25%,#57524e 60%,transparent 66%),
    radial-gradient(ellipse calc(var(--ww) * .1) calc(var(--ww) * .045) at 62% 30%,#cfc9c1 25%,#57524e 60%,transparent 66%),radial-gradient(ellipse calc(var(--ww) * .1) calc(var(--ww) * .045) at 86% 30%,#cfc9c1 25%,#57524e 60%,transparent 66%),
    linear-gradient(90deg,rgba(255,255,255,.1),transparent 30%,transparent 75%,rgba(0,0,0,.25)),
    linear-gradient(180deg,#a29c95 0%,#857f79 14%,#625d58 34%,var(--roof) 58%,#1b1919 76%,#0b0a0a 87%,#3a3633 91%,#0e0d0d 100%);
  box-shadow:0 3px 4px rgba(0,0,0,.55)}
/* the gold coach lines */
.nt-car::after{content:"";position:absolute;inset:calc(var(--ww) * .12) calc(var(--ww) * .3) calc(var(--ww) * .1);border:1.5px solid var(--line);border-radius:calc(var(--ww) * .06);opacity:.7;pointer-events:none;box-shadow:inset 0 0 0 3px transparent,inset 0 0 0 4px rgba(226,189,98,.22),0 1px 0 rgba(0,0,0,.4)}

  background:linear-gradient(90deg,rgba(255,255,255,.08),transparent 40%,rgba(0,0,0,.25)),var(--car2);
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.14),inset -1px -1px 0 rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.35)}
.nt-end.l{left:calc(var(--ww) * .05)}.nt-end.r{right:calc(var(--ww) * .05)}
.nt-end::before{content:"";position:absolute;left:16%;right:16%;top:7%;height:24%;border-radius:3px;
  background:linear-gradient(115deg,rgba(255,255,255,.3) 0 14%,transparent 15%),linear-gradient(180deg,#f2b66a,#b5662f);box-shadow:0 0 0 1.5px var(--metal3),inset 2px 2px 4px rgba(0,0,0,.5)}
.nt-end::after{content:"";position:absolute;top:40%;height:42%;width:calc(var(--ww) * .025);border-radius:2px;background:linear-gradient(90deg,var(--metal1),var(--metal2) 45%,var(--metal3));box-shadow:1px 1px 1px rgba(0,0,0,.5)}
.nt-end.l::after{right:14%}.nt-end.r::after{left:14%}
/* the solebar along the bottom, with its rivets */
.nt-sole{position:absolute;left:0;right:0;bottom:0;height:calc(var(--ww) * .09);border-radius:0 0 5px 5px;z-index:1;
  background:radial-gradient(circle at 50% 50%,var(--metal1) 0 .6px,var(--metal3) 1.2px,transparent 1.6px) 0 50%/calc(var(--ww) * .14) 100% repeat-x,linear-gradient(180deg,rgba(255,255,255,.12),transparent 35%,rgba(0,0,0,.4)),var(--car3)}
.nt-name{position:relative;z-index:2;text-align:center;font:700 calc(var(--ww) * .14)/1 Cormorant Garamond,serif;letter-spacing:.42em;padding-left:.42em;color:var(--line);text-shadow:0 1px 0 rgba(0,0,0,.7),0 -1px 0 rgba(255,240,200,.25);margin:0 0 calc(var(--ww) * .08);white-space:nowrap}
.nt-row{position:relative;z-index:2;display:flex;gap:var(--wg,8px);justify-content:center}
.nt-comp{position:relative;width:var(--ww);display:flex;flex-direction:column;align-items:center;gap:calc(var(--ww) * .05)}
/* each compartment sits in a raised, beveled panel */
.nt-comp::before{content:"";position:absolute;inset:calc(var(--ww) * -.05) calc(var(--ww) * -.045) calc(var(--ww) * -.05);border-radius:5px;z-index:-1;
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(0,0,0,.1));box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.16),inset -1.5px -1.5px 0 rgba(0,0,0,.45),1px 2px 3px rgba(0,0,0,.3)}
.nt-no{min-width:calc(var(--ww) * .3);height:calc(var(--ww) * .22);padding:0 4px;border-radius:99px;display:flex;align-items:center;justify-content:center;font:700 calc(var(--ww) * .16)/1 Montserrat,sans-serif;color:#3b2a0c;text-shadow:0 1px 0 rgba(255,245,210,.6);
  background:radial-gradient(ellipse at 35% 25%,rgba(255,255,255,.7),transparent 45%),linear-gradient(180deg,var(--metal1),var(--metal2) 50%,var(--metal3));box-shadow:0 0 0 1px rgba(0,0,0,.45),inset 0 -1px 1px rgba(0,0,0,.3),1px 2px 2px rgba(0,0,0,.5)}
/* a window: brass frame, set into the body; inside, the far wall, the far window full of sunset, the velvet seat */
.nt-win{position:relative;width:var(--ww);height:calc(var(--ww) * 1.06);border-radius:calc(var(--ww) * .12);overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse 34% 20% at 50% 30%,rgba(255,236,170,.85),transparent 72%),
    linear-gradient(180deg,#ffd590 0%,#f6a24f 46%,#a85f34 60%,#567141 63%,#344f2c 100%) 50% 26%/62% 42% no-repeat,
    linear-gradient(#2b150b,#2b150b) 50% 23%/72% 50% no-repeat,
    linear-gradient(180deg,transparent 60%,#4c7a53 60%,#3a6443 66%,#24442c 84%,#152b1b 100%),
    linear-gradient(90deg,#3a1c0f,#6e3c21 50%,#3a1c0f);
  box-shadow:0 0 0 2px var(--metal2),-1px -1px 0 2.5px var(--metal1),1.5px 1.5px 0 2.5px var(--metal3),2px 4px 6px 2px rgba(0,0,0,.45);transition:box-shadow .15s}
/* the curtains, tied back */
.nt-win::before{content:"";position:absolute;left:0;right:0;top:0;height:30%;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 30% 100% at 0 0,#b0412f 60%,#7e2a1e 72%,transparent 74%),radial-gradient(ellipse 30% 100% at 100% 0,#b0412f 60%,#7e2a1e 72%,transparent 74%),linear-gradient(180deg,#9a3324,#7a2619 22%,transparent 24%)}
/* the glass: reflections, and the shadow of the frame on the recessed compartment */
.nt-win::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,rgba(255,255,255,.32) 0 10%,transparent 11% 27%,rgba(255,255,255,.12) 28% 32%,transparent 33%),linear-gradient(180deg,rgba(255,255,255,.12),transparent 25%);
  box-shadow:inset 4px 5px 8px rgba(0,0,0,.6),inset -1px -1px 0 rgba(255,255,255,.22)}
.nt-win.over{box-shadow:0 0 0 2px var(--metal2),0 0 0 4px #ffd36b,0 0 16px 4px rgba(255,211,107,.85)}
.nt-win.lesson,.nt-rack.lesson{animation:nt-beckon 1.1s ease-in-out infinite}
@keyframes nt-beckon{50%{box-shadow:0 0 0 2px var(--metal2),0 0 0 5px #ffd36b,0 0 20px 6px rgba(255,211,107,.9)}}
.nt-win .nt-who{position:absolute;left:4%;right:4%;bottom:0;height:86%;z-index:1;display:flex;justify-content:center;align-items:flex-end}
.nt-win .nt-who svg{width:100%;height:100%;filter:drop-shadow(-2px 3px 3px rgba(0,0,0,.45))}
/* the name plate: ivory enamel in a beveled brass frame */
.nt-plate{width:calc(var(--ww) * 1.04);height:calc(var(--ww) * .34);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
  background:linear-gradient(170deg,#fffaf0,#f1e6cc 55%,#e0d0aa);color:#2a2116;box-shadow:0 0 0 1px var(--metal3),0 0 0 2.5px var(--metal2),-1px -1px 0 2.5px var(--metal1),inset 0 1px 0 #fff,inset 0 -2px 3px rgba(120,90,40,.25),1px 3px 3px rgba(0,0,0,.45);font:600 calc(var(--ww) * .118)/1.08 Montserrat,sans-serif}
.nt-plate b{display:block;font:700 calc(var(--ww) * .15)/1.05 Cormorant Garamond,serif;white-space:nowrap}
.nt-plate.empty{background:rgba(0,0,0,.3);box-shadow:inset 2px 2px 4px rgba(0,0,0,.55),inset -1px -1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(226,189,98,.35);color:rgba(255,240,200,.5);font-style:italic}
/* the luggage rack under each window (Friday to Sunday): a brass rail and rods, set back in the panel */
.nt-rack{position:relative;width:calc(var(--ww) * .74);height:calc(var(--ww) * .62);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,var(--metal1),var(--metal2) 40%,var(--metal3)) 0 0/100% 3px no-repeat,linear-gradient(180deg,var(--metal1),var(--metal2) 40%,var(--metal3)) 0 100%/100% 3px no-repeat,
    repeating-linear-gradient(90deg,rgba(226,189,98,.45) 0 1px,rgba(120,90,30,.4) 1px 2px,transparent 2px 7px),rgba(0,0,0,.32);
  box-shadow:inset 2px 3px 6px rgba(0,0,0,.6),inset -1px -1px 0 rgba(255,255,255,.08);transition:box-shadow .15s}
.nt-rack.over{box-shadow:inset 2px 3px 6px rgba(0,0,0,.6),0 0 0 3px #ffd36b,0 0 14px 3px rgba(255,211,107,.8)}
/* the underframe and bogies: sideframes, leaf springs, axle boxes and spoked wheels */
.nt-under{position:relative;z-index:3;height:calc(var(--ww) * .3);margin:0 calc(var(--ww) * .14) calc(var(--ww) * -.11)}
.nt-under::before{content:"";position:absolute;left:3%;right:3%;top:0;height:24%;background:linear-gradient(180deg,#2a2626,#0c0b0b);border-radius:0 0 3px 3px;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.nt-bogie{position:absolute;top:6%;width:calc(var(--ww) * .8);height:94%;display:flex;justify-content:space-between;align-items:flex-end}
.nt-bogie::before{content:"";position:absolute;left:10%;right:10%;top:28%;height:22%;border-radius:3px;background:linear-gradient(180deg,#4a4444,#1a1717 60%,#0b0a0a);box-shadow:0 1px 2px rgba(0,0,0,.6);z-index:1}
.nt-bogie::after{content:"";position:absolute;left:36%;right:36%;top:14%;height:18%;border-radius:0 0 50% 50%/0 0 100% 100%;border-bottom:2px solid #6b6464;z-index:1}
.nt-bogie i{position:relative;width:calc(var(--ww) * .3);height:calc(var(--ww) * .3);border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.3),transparent 38%),
    radial-gradient(circle,#ece6d6 0 9%,#5b5555 10% 13%,#2b2727 14% 17%,transparent 18% 66%,#7b7474 67% 74%,#2c2828 75% 86%,#0d0c0c 87%),
    repeating-conic-gradient(#827b7b 0 7deg,#211e1e 7deg 36deg);box-shadow:1px 2px 2px rgba(0,0,0,.6)}
/* the track: ballast, sleepers and two rails, seen from a little above */
.nt-track{position:relative;z-index:1;height:calc(var(--ww) * .24);margin:0 calc(var(--nt-px,14px) * -.5);clip-path:polygon(2.5% 0,97.5% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,transparent 54%,#f3f0ea 54%,#b5b0a7 60%,#5d5953 68%,rgba(0,0,0,.35) 68%,transparent 76%),
    linear-gradient(180deg,transparent 12%,#c9c5be 12%,#77736c 18%,rgba(0,0,0,.3) 18%,transparent 22%),
    repeating-linear-gradient(90deg,#5b3b25 0 calc(var(--ww) * .09),#3e2716 calc(var(--ww) * .09) calc(var(--ww) * .1),transparent calc(var(--ww) * .1) calc(var(--ww) * .23)) 0 8%/100% 76% repeat-x,
    radial-gradient(circle at 30% 40%,#a29a8d 0 .8px,transparent 1.3px) 0 0/5px 4px,radial-gradient(circle at 70% 70%,#4c463e 0 .9px,transparent 1.4px) 0 0/6px 5px,
    linear-gradient(180deg,#5a544b,#7a7266 50%,#625a4f)}
/* the plinth: walnut, its top edge catching the light; its shadow on the table */
.nt-plinth{position:relative;z-index:1;height:calc(var(--ww) * .32);margin:0 calc(var(--nt-px,14px) * -1);border-radius:2px 2px 6px 6px;
  background:linear-gradient(180deg,rgba(255,235,200,.55) 0,rgba(255,225,180,.18) 9%,transparent 22%,transparent 80%,rgba(0,0,0,.3)),linear-gradient(90deg,rgba(255,255,255,.07),transparent 30%,transparent 70%,rgba(0,0,0,.2)),
    repeating-linear-gradient(91deg,rgba(60,25,8,.14) 0 2px,transparent 2px 9px,rgba(255,220,180,.04) 9px 10px,transparent 10px 17px),linear-gradient(180deg,#80492a,#5e3119 60%,#40200f)}
.nt-plinth::after{content:"";position:absolute;left:2%;right:-1%;bottom:calc(var(--ww) * -.2);height:calc(var(--ww) * .26);z-index:-1;pointer-events:none;background:radial-gradient(ellipse 52% 50% at 52% 40%,rgba(0,0,0,.55),rgba(0,0,0,.25) 55%,transparent 72%)}
.nt-bw{position:absolute;left:50%;top:calc(50% + 1px);transform:translate(-50%,-50%);padding:2px 11px 1px;border-radius:3px;font-size:calc(var(--ww) * .17);line-height:1.1;color:#4a3410;

.nt-engine{position:absolute;left:6px;top:50%;transform:translateY(-50%);font:700 calc(var(--ww) * .12)/1 Montserrat,sans-serif;letter-spacing:.1em;color:#f3dca4;opacity:.85;white-space:nowrap;text-shadow:0 -1px 0 rgba(0,0,0,.5)}
/* ---------- the platform: passengers (and luggage) waiting to board ---------- */
.nt-plat{position:relative;align-self:stretch;padding:8px 10px 10px;border-radius:12px;background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.nt-slots{display:flex;gap:var(--wg,8px);justify-content:center}
.nt-slots+.nt-slots{margin-top:8px}

/* ===== The Night Train core (rules, solver, daily maker): shared by the page and the tests =====
   Passengers (and, later in the week, their luggage) go into the sleeping car's compartments, one each.
   Compartments are numbered from the engine end: 1 is nearest the engine. The clues fix exactly one seating,
   and every daily puzzle can be worked out step by step from the clues alone (no guessing): the maker checks
   both with a brute-force count and a step-by-step solver, which also drives the hints. */
(function(root){
"use strict";

/* the cast: id, full name, two-line plate (title / surname), color, portrait */
var CAST=[
  {id:"pryce",   name:"Colonel Pryce",   t:"Colonel",  s:"Pryce",     col:"#5b6b3a", look:{skin:"#e2b48e",hat:"mil",coat:"#56633a",hair:"#8a8a86",mus:1}},
  {id:"ashworth",name:"Lady Ashworth",   t:"Lady",     s:"Ashworth",  col:"#7a3b6e", look:{skin:"#f0cfb0",hat:"feather",coat:"#6e3561",hair:"#5a3a24",ear:1}},
  {id:"mabry",   name:"Dr. Mabry",       t:"Dr.",      s:"Mabry",     col:"#2d3f5e", look:{skin:"#8d5a3b",hat:"bowler",coat:"#2b3a55",hair:"#1b1714",gls:1}},
  {id:"delacroix",name:"Miss Delacroix", t:"Miss",     s:"Delacroix", col:"#a2463c", look:{skin:"#ecc6a4",hat:"cloche",coat:"#9b4239",hair:"#2a1d16",bob:1}},
  {id:"bellini", name:"Signor Bellini",  t:"Signor",   s:"Bellini",   col:"#6b5640", look:{skin:"#d39e78",hat:"fedora",coat:"#5f4b37",hair:"#2b2119",beard:1}},
  {id:"orlova",  name:"Madame Orlova",   t:"Madame",   s:"Orlova",    col:"#3d5c63", look:{skin:"#f3d6bd",hat:"toque",coat:"#355259",hair:"#c9a26a"}},
  {id:"hale",    name:"Professor Hale",  t:"Professor",s:"Hale",      col:"#6e4a2b", look:{skin:"#e7bc98",hat:"bald",coat:"#7a5634",hair:"#cfcac0",gls:1,beard:2}},
  {id:"whitcombe",name:"Mrs. Whitcombe", t:"Mrs.",     s:"Whitcombe", col:"#4c6b4f", look:{skin:"#b97f57",hat:"bun",coat:"#46624a",hair:"#3b2a20",cameo:1}},
  {id:"reyes",   name:"Captain Reyes",   t:"Captain",  s:"Reyes",     col:"#24426b", look:{skin:"#c48d64",hat:"captain",coat:"#203a5f",hair:"#1d1713",mus:1}},
  {id:"finch",   name:"Mr. Finch",       t:"Mr.",      s:"Finch",     col:"#8a6a2a", look:{skin:"#f1cdaa",hat:"flat",coat:"#7c6a4c",hair:"#a0522d"}}
];
/* the luggage: id, name ("the hatbox"), where the necklace hid in it */
var BAGS=[
  {id:"hatbox", name:"hatbox",        hid:"under the tissue paper in the hatbox"},
  {id:"violin", name:"violin case",   hid:"in the velvet lining of the violin case"},
  {id:"trunk",  name:"steamer trunk", hid:"beneath the folded shirts in the steamer trunk"},
  {id:"carpet", name:"gramophone",    hid:"down inside the gramophone's horn"},   /* was the carpetbag (Nov 1: Judy wasn't sure what one was; the id stays) */
  {id:"cage",   name:"birdcage",      hid:"under the paper lining the birdcage (the canary saw everything)"},
  {id:"typer",  name:"typewriter case",hid:"behind the typewriter in its case"},
  {id:"hamper", name:"picnic basket", hid:"between the napkins in the picnic basket"},
  {id:"golf",   name:"golf bag",      hid:"in the zipped pocket of the golf bag"}
];
var OWNERS=["Mrs. Vandermeer","the Duchess of Ellery","Baroness von Ritter","Lady Penhallow","Mrs. Astley-Cole","the Contessa di Marino"];
var JEWELS=["pearl necklace","emerald necklace","diamond necklace","sapphire necklace","ruby necklace"];
var SPOTS=["under the seat cushion","inside a folded newspaper","in the toe of a spare shoe","behind the washstand mirror","inside a box of chocolates","in the pocket of a dressing gown"];
var ENDS=["{owner} has her necklace back, and the guard will be waiting at the next station.","The clues put {who} in Compartment {k}, and the steward did the rest.","By the time the train reached the coast, {who} had a great deal of explaining to do.","{owner} wept with relief, and the dining car sent round champagne."];

/* the week (Nov 1 rework, after Judy found Sunday too easy): six compartments from Wednesday, luggage from Friday,
   and each day must reach a difficulty score (see grade below) with the reasoning it's allowed.
   n: compartments · cats: 2 = luggage too · types: the clue kinds · maxAt/maxEnd/maxWith: caps on the giveaway kinds ·
   (at most 2 "between", 2 "or" and 3 "not in" clues a day, for variety) ·
   lvl: the hardest reasoning the day may need (3 = link two clues' people; 4 = a pair narrowed to the same two places;
   5 = two clues put together) · need: how many steps of level 3+ / 4+ it must use · score: the band its total must land in */
var WEEK={
  1:{n:5,cats:1,types:["at","notat","end","notend","next","ahead","just"],maxAt:1,maxEnd:2,maxWith:0,lvl:3,need:[1,0],score:[12,22],label:"Monday"},
  2:{n:5,cats:1,types:["at","notat","end","notend","next","notnext","ahead","just","gap","or"],maxAt:1,maxEnd:1,maxWith:0,lvl:4,need:[2,0],score:[16,30],label:"Tuesday"},
  3:{n:6,cats:1,types:["at","notat","end","notend","next","notnext","ahead","just","gap","or"],maxAt:1,maxEnd:1,maxWith:0,lvl:4,need:[4,0],score:[22,38],label:"Wednesday"},
  4:{n:6,cats:1,types:["notat","end","notend","next","notnext","ahead","just","gap","or","between"],maxAt:0,maxEnd:1,maxWith:0,lvl:5,need:[5,1],score:[30,50],label:"Thursday"},
  5:{n:5,cats:2,types:["at","notat","end","notend","next","notnext","ahead","just","gap","or","with","notwith"],maxAt:1,maxEnd:1,maxWith:2,lvl:4,need:[5,0],score:[36,56],label:"Friday"},
  6:{n:6,cats:2,types:["notat","end","notend","next","notnext","ahead","just","gap","or","between","with","notwith"],maxAt:0,maxEnd:1,maxWith:1,lvl:5,need:[8,1],score:[52,74],label:"Saturday"},
  0:{n:6,cats:2,types:["notat","notend","next","notnext","ahead","just","gap","or","between","with","notwith"],maxAt:0,maxEnd:1,maxWith:1,lvl:5,need:[10,2],score:[66,999],label:"Sunday"}
};

/* ---------- the rules ----------
   a clue: {t, a, b, d, k, k2}; a, b, d are refs {c:0|1, i} (0 = a passenger, 1 = a bag). Positions are 0..n-1 (shown as 1..n).
   "or": a is in compartment k or k2 · "between": a is somewhere between b and d (in either order) */
function rel(t,pa,pb,n,k,pd,k2){
  switch(t){
    case "at": return pa===k; case "notat": return pa!==k;
    case "end": return pa===0||pa===n-1; case "notend": return pa!==0&&pa!==n-1;
    case "or": return pa===k||pa===k2;
    case "with": return pa===pb; case "notwith": return pa!==pb;
    case "next": return Math.abs(pa-pb)===1; case "notnext": return Math.abs(pa-pb)!==1;
    case "ahead": return pa<pb; case "just": return pa===pb-1; case "gap": return Math.abs(pa-pb)===2;
    case "between": return pa>Math.min(pb,pd)&&pa<Math.max(pb,pd);
  }
  return false;
}
var UNARY={at:1,notat:1,end:1,notend:1,or:1};
function refs(cl){ return UNARY[cl.t]?[cl.a]:cl.d?[cl.a,cl.b,cl.d]:[cl.a,cl.b]; }
function test(cl,v,n){ return rel(cl.t,v[0],v[1],n,cl.k,v[2],cl.k2); }
function holds(cl,pos,n){ var R=refs(cl), v=[];
  for(var j=0;j<R.length;j++){ var p=pos[R[j].c]&&pos[R[j].c][R[j].i]; if(p==null||p<0) return null; v.push(p); }
  return test(cl,v,n); }

/* how many seatings fit all the clues (stops counting at `cap`): a backtracking search that checks each clue
   as soon as everyone it names is placed */
function count(P,clues,cap){
  var n=P.n, cats=P.cats, left=[], items=[], c, i, got=0, sol=null, dom={};
  for(c=0;c<cats;c++) for(i=0;i<n;i++){ left.push({c:c,i:i}); dom[c+":"+i]=(1<<n)-1; }
  /* clues about one item alone just narrow its places up front */
  clues.forEach(function(cl){ if(!UNARY[cl.t]) return; var key=cl.a.c+":"+cl.a.i, m=0; for(var v=0;v<n;v++) if((dom[key]&(1<<v))&&rel(cl.t,v,0,n,cl.k,0,cl.k2)) m|=1<<v; dom[key]=m; });
  /* place the most tied-down items first: fewest places, then most clues linking them to items already placed */
  var multi=clues.filter(function(cl){ return !UNARY[cl.t]; }).map(refs), placedK={};
  function pcnt(m){ var k=0; while(m){ m&=m-1; k++; } return k; }
  while(left.length){ var bi=0, bs=-1e9;
    left.forEach(function(it,q){ var key=it.c+":"+it.i, links=0; multi.forEach(function(R){ if(R.some(function(r){ return r.c===it.c&&r.i===it.i; })) R.forEach(function(r){ if(placedK[r.c+":"+r.i]) links++; }); });
      var sc=links*3+multi.filter(function(R){ return R.some(function(r){ return r.c===it.c&&r.i===it.i; }); }).length-pcnt(dom[key])*2; if(sc>bs){ bs=sc; bi=q; } });
    var it=left.splice(bi,1)[0]; items.push(it); placedK[it.c+":"+it.i]=1; }
  var idx={}; items.forEach(function(it,j){ idx[it.c+":"+it.i]=j; });
  var doms=items.map(function(it){ return dom[it.c+":"+it.i]; });
  var at=items.map(function(){ return []; });       /* clues to check once item j is placed (their last-placed ref) */
  clues.forEach(function(cl){ if(UNARY[cl.t]) return; var last=Math.max.apply(null,refs(cl).map(function(r){ return idx[r.c+":"+r.i]; })); at[last].push(cl); });
  var pos=[]; for(c=0;c<cats;c++){ pos.push([]); for(i=0;i<n;i++) pos[c].push(-1); }
  var used=[]; for(c=0;c<cats;c++) used.push(0);
  (function go(j){
    if(got>=cap) return;
    if(j===items.length){ got++; sol=pos.map(function(a){ return a.slice(); }); return; }
    var it=items[j];
    for(var v=0;v<n;v++){ if((used[it.c]&(1<<v))||!(doms[j]&(1<<v))) continue;
      pos[it.c][it.i]=v; used[it.c]|=1<<v;
      var ok=true; for(var q=0;q<at[j].length;q++) if(!holds(at[j][q],pos,n)){ ok=false; break; }
      if(ok) go(j+1);
      used[it.c]&=~(1<<v); pos[it.c][it.i]=-1; if(got>=cap) return; }
  })(0);
  return {n:got,sol:sol};
}

/* ---------- the step-by-step solver and grader (what a careful reader can work out, with no guessing) ----------
   Each item keeps the set of compartments it could still be in. The solver always uses the simplest step that
   makes progress, and each kind of step has a cost; the total is the day's difficulty score.
     0  one each: a settled item's place is no one else's; a place only one item can take is theirs (cost .5)
     1  a clue about one item alone ("is not in 3", "an end", "2 or 5") (cost 1)
     2  a clue linking an item to someone already settled (cost 1.5)
     3  a clue linking items that aren't settled yet, narrowing both (cost 3)
     4  two (or three) items that can only be in the same two (or three) places: no one else can be there (cost 4)
     5  two clues put together, about people they share (cost 6)
   Returns {ok, order:[{c,i,k,why,why2,each}], rounds, D, score, lv:[steps at each level], max}. why is the last clue (or two) that narrowed the item, -1 if none;
   each: it was finished off by "one each" (the clue left it only one free place). */
var COST=[.5,1,1.5,3,4,6];
function solve(P,clues,start,maxLvl){
  var n=P.n, cats=P.cats, D=[], why=[], why2=[], c, i, j, order=[], rounds=0, score=0, lv=[0,0,0,0,0,0], top=0, FULL=(1<<n)-1;
  if(maxLvl==null) maxLvl=5;
  for(c=0;c<cats;c++){ D.push([]); why.push([]); why2.push([]); for(i=0;i<n;i++){ D[c].push(FULL); why[c].push(-1); why2[c].push(-1); } }
  if(start) start.forEach(function(s){ D[s.c][s.i]=1<<s.k; });
  function one(m){ return m&&!(m&(m-1)); }
  function lone(m){ for(var v=0;v<n;v++) if(m===1<<v) return v; return -1; }
  function pc(m){ var k=0; while(m){ m&=m-1; k++; } return k; }
  var settled=[], each=[]; for(c=0;c<cats;c++){ settled.push([]); each.push([]); for(i=0;i<n;i++){ settled[c].push(false); each[c].push(false); } }
  function note(){ for(var c2=0;c2<cats;c2++) for(var i2=0;i2<n;i2++) if(!settled[c2][i2]&&one(D[c2][i2])){ settled[c2][i2]=true; order.push({c:c2,i:i2,k:lone(D[c2][i2]),why:why[c2][i2],why2:why2[c2][i2],each:each[c2][i2]}); } }
  function set(r,m,w,w2){ if(m===D[r.c][r.i]) return false; D[r.c][r.i]=m; each[r.c][r.i]=false; why[r.c][r.i]=w; why2[r.c][r.i]=w2==null?-1:w2; return true; }
  /* which places each ref can keep, given the others' current places (same-kind items can't share a place) */
  function support(R,tst){
    var keep=R.map(function(){ return 0; }), v=[];
    (function go(j){
      if(j===R.length){ if(tst(v)) for(var q=0;q<R.length;q++) keep[q]|=1<<v[q]; return; }
      var m=D[R[j].c][R[j].i];
      for(var x=0;x<n;x++) if(m&(1<<x)){
        var clash=false; for(var q=0;q<j;q++) if(R[q].c===R[j].c&&(R[q].i===R[j].i?v[q]!==x:v[q]===x)){ clash=true; break; }
        if(clash) continue; v[j]=x; go(j+1); }
    })(0);
    return keep;
  }
  function stepOneEach(){
    var did=false;
    for(var c2=0;c2<cats;c2++){
      for(var i2=0;i2<n;i2++) if(one(D[c2][i2])) for(var j2=0;j2<n;j2++) if(j2!==i2&&(D[c2][j2]&D[c2][i2])){ D[c2][j2]&=~D[c2][i2]; if(one(D[c2][j2])) each[c2][j2]=true; did=true; }
      for(var v=0;v<n;v++){ var who=[]; for(i2=0;i2<n;i2++) if(D[c2][i2]&(1<<v)) who.push(i2); if(who.length===1&&D[c2][who[0]]!==1<<v){ D[c2][who[0]]=1<<v; each[c2][who[0]]=true; did=true; } }
    }
    return did;
  }
  function stepClue(level){
    var did=false;
    clues.forEach(function(cl,ci){
      if(did) return;
      var R=refs(cl), unset=R.filter(function(r){ return !one(D[r.c][r.i]); }).length;
      var L=R.length===1?1:unset<=1?2:3; if(L!==level) return;
      var keep=support(R,function(v){ return test(cl,v,n); });
      R.forEach(function(r,q){ if(set(r,keep[q],ci)) did=true; });
    });
    return did;
  }
  function stepSubsets(){
    for(var c2=0;c2<cats;c2++) for(var size=2;size<=3;size++){
      var open=[]; for(var i2=0;i2<n;i2++) if(!one(D[c2][i2])&&pc(D[c2][i2])<=size) open.push(i2);
      var did=false;
      (function pick(s,set2,m){
        if(did) return;
        if(set2.length===size){ if(pc(m)!==size) return;
          for(var j2=0;j2<n;j2++) if(set2.indexOf(j2)<0&&(D[c2][j2]&m)){ D[c2][j2]&=~m; each[c2][j2]=true; did=true; } return; }
        for(var q=s;q<open.length;q++) pick(q+1,set2.concat([open[q]]),m|D[c2][open[q]]);
      })(0,[],0);
      if(did) return true;
    }
    return false;
  }
  function stepPairs(){
    for(var x=0;x<clues.length;x++) for(var y=x+1;y<clues.length;y++){
      var A=refs(clues[x]), B=refs(clues[y]), R=A.slice(), shared=false;
      B.forEach(function(r){ var f=R.some(function(s){ return s.c===r.c&&s.i===r.i; }); if(f) shared=true; else R.push(r); });
      if(!shared||R.length>4) continue;
      var ia=A.map(function(r){ return R.findIndex(function(s){ return s.c===r.c&&s.i===r.i; }); }), ib=B.map(function(r){ return R.findIndex(function(s){ return s.c===r.c&&s.i===r.i; }); });
      var cx=clues[x], cy=clues[y];
      var keep=support(R,function(v){ return test(cx,ia.map(function(q){ return v[q]; }),n)&&test(cy,ib.map(function(q){ return v[q]; }),n); });
      var did=false; R.forEach(function(r,q){ if(set(r,keep[q],x,y)) did=true; });
      if(did) return true;
    }
    return false;
  }
  var steps=[function(){ return stepOneEach(); },function(){ return stepClue(1); },function(){ return stepClue(2); },function(){ return stepClue(3); },stepSubsets,stepPairs];
  note();
  while(rounds++<400){
    var did=false;
    for(var L=0;L<=maxLvl;L++){ if(steps[L]()){ did=true; score+=COST[L]; lv[L]++; if(L>top) top=L; break; } }
    note();
    if(!did) break;
    var bad=false; for(c=0;c<cats;c++) for(i=0;i<n;i++) if(!D[c][i]) bad=true; if(bad) break;
    var all=true; for(c=0;c<cats;c++) for(i=0;i<n;i++) if(!one(D[c][i])) all=false; if(all) break;
  }
  var ok=true; for(c=0;c<cats;c++) for(i=0;i<n;i++) if(!one(D[c][i])) ok=false;
  return {ok:ok,order:order,rounds:rounds,D:D,score:score,lv:lv,max:top};
}

/* every true clue of the allowed kinds */
function pool(P,sol,types,r){
  var n=P.n, out=[], R=[], c, i;
  function has(t){ return types.indexOf(t)>=0; }
  for(c=0;c<P.cats;c++) for(i=0;i<n;i++) R.push({c:c,i:i});
  function pa(x){ return sol[x.c][x.i]; }
  R.forEach(function(a){
    var p=pa(a);
    if(has("at")) out.push({t:"at",a:a,k:p});
    if(has("notat")) for(var k=0;k<n;k++) if(k!==p) out.push({t:"notat",a:a,k:k});
    if(has("end")&&(p===0||p===n-1)) out.push({t:"end",a:a});
    if(has("notend")&&p!==0&&p!==n-1) out.push({t:"notend",a:a});
    if(has("or")) for(var t2=0;t2<2;t2++){ var o=Math.floor(r()*(n-1)); if(o>=p) o++; out.push({t:"or",a:a,k:Math.min(p,o),k2:Math.max(p,o)}); }
  });
  R.forEach(function(a){ R.forEach(function(b){
    if(a===b) return; var x=pa(a), y=pa(b), same=a.c===b.c, once=a.c<b.c||(same&&a.i<b.i);   /* once: for clues that read the same both ways */
    /* luggage clues name the bag first: "The hatbox travels with Lady Ashworth" */
    if(a.c===1&&b.c===0){ if(has("with")&&x===y) out.push({t:"with",a:a,b:b});
      if(has("notwith")&&x!==y) out.push({t:"notwith",a:a,b:b}); }
    if(x===y) return;            /* a bag and its own owner: only "travels with" */
    if(has("next")&&Math.abs(x-y)===1&&once) out.push({t:"next",a:a,b:b});
    if(has("notnext")&&same&&Math.abs(x-y)>1&&once) out.push({t:"notnext",a:a,b:b});
    if(has("ahead")&&x<y) out.push({t:"ahead",a:a,b:b});
    if(has("just")&&x===y-1) out.push({t:"just",a:a,b:b});
    if(has("gap")&&Math.abs(x-y)===2&&once) out.push({t:"gap",a:a,b:b});
  }); });
  if(has("between")) R.forEach(function(a){ R.forEach(function(b){ R.forEach(function(d){
    if(a===b||a===d||b===d||!(b.c<d.c||(b.c===d.c&&b.i<d.i))) return;
    var x=pa(a), y=pa(b), z=pa(d); if(y===z) return;
    if(x>Math.min(y,z)&&x<Math.max(y,z)&&r()<.35) out.push({t:"between",a:a,b:b,d:d});
  }); }); });
  return out;
}

/* ---------- the daily maker ----------
   Shuffle every true clue (the gentle kinds weighted up early in the week, the roundabout ones later), add them until
   only one seating fits, take out every clue that isn't needed, then keep the puzzle only if the solver can finish it
   with the reasoning the day allows and its score lands in the day's band. */

/* ---------- Ask the Conductor ----------
   If someone is in the wrong place, the conductor sends them back to the platform. If not, he seats the next one that
   the clues settle (in the order a careful reader would find them), and points at the clue that does it. */
function hint(){
  hideToast();
  if(mode==="lesson"&&blocked()) return;
  if(done||!P) return;
  var wrong=[]; for(var c=0;c<P.cats;c++) for(var i=0;i<P.n;i++) if(seat[c][i]>=0&&seat[c][i]!==P.sol[c][i]&&!lock[c][i]) wrong.push({c:c,i:i});
  var msg, ring=null, cl=-1, cl2=-1;
  if(wrong.length){
    var w=sel&&wrong.filter(function(x){ return x.c===sel.c&&x.i===sel.i; })[0]||wrong[0], k=seat[w.c][w.i];
    var el=w.c?RACK[k]:WIN[k]; el.classList.add("badw"); setTimeout(function(){ el.classList.remove("badw"); },900);
    msg="The conductor checks his list: "+(w.c?cap(itemName(1,w.i))+" isn't":itemName(0,w.i)+" isn't")+" in Compartment "+(k+1)+".";
    seat[w.c][w.i]=-1; sel=null; snd("nt-hint"); paint();
  } else {
    /* what the clues settle, given who's already correctly in place */
    var start=[]; for(c=0;c<P.cats;c++) for(i=0;i<P.n;i++) if(seat[c][i]>=0) start.push({c:c,i:i,k:seat[c][i]});
    var S=NT.solve(P,P.clues,start), next=S.order.filter(function(o){ return seat[o.c][o.i]<0; })[0];
    if(!next){ for(c=0;c<P.cats&&!next;c++) for(i=0;i<P.n;i++) if(seat[c][i]<0){ next={c:c,i:i,k:P.sol[c][i],why:-1}; break; } }
    if(!next) return;
    var occ=who(next.c,next.k); if(occ>=0) seat[next.c][occ]=-1;
    seat[next.c][next.i]=next.k; cl=next.why; sel=null;
    cl2=next.why2!=null?next.why2:-1;
    var ev=!!next.each, cn=cl>=0&&cl2>=0?"Clues "+(cl+1)+" and "+(cl2+1):cl>=0?"Clue "+(cl+1):"";
    msg=(cn&&ev?cn+(cl2>=0?" leave":" leaves")+" only one place free: ":cn?cn+(cl2>=0?" together settle it: ":" settles it: "):"It's the only place left: ")+(next.c?cap(itemName(1,next.i))+" goes in":itemName(0,next.i)+" has")+" Compartment "+(next.k+1)+".";
    snd("nt-hint"); paint({c:next.c,k:next.k});
    ring=next.c?RACK[next.k]:WIN[next.k];
  }
  hints++; counts();
  if(ring){ ring.classList.remove("ring"); void ring.offsetWidth; ring.classList.add("ring"); setTimeout(function(){ ring.classList.remove("ring"); },6800); }
  [cl,cl2].forEach(function(q,z){ if(q==null||q<0) return; var li=CLUES.querySelectorAll("li")[q]; if(li){ li.classList.remove("ring"); void li.offsetWidth; li.classList.add("ring"); setTimeout(function(){ li.classList.remove("ring"); },6800); if(!z) scrollClue(li); } });
  toast(msg,7500);
  if(mode==="practice"&&window.Parlor) Parlor.hintSay("<p>"+esc(msg)+"</p>");
  if(full()){ if(right()) solved(); else wrongFull(); return; }
  lessonCheck();
}

/* the keyboard on a computer: choose a passenger by clicking, then press 1-6 to seat them; 0 or Backspace sends them back */
document.addEventListener("keydown",function(e){

  if(document.querySelector(".pk-veil.on")) return;

  else if(e.key==="Escape"){ sel=null; paint(); }

/* ---------- fit to the space ---------- */
function seatedNow(){ return document.body.classList.contains("seated"); }
function fit(){
  if(!P) return;
  var VW=Math.min(window.innerWidth,document.documentElement.clientWidth||1e9), wide=VW>=1000;
  var land=!!(window.Parlor&&Parlor.land&&Parlor.land());
  stage.classList.toggle("land",land);
  if(land){ fitLand(VW); return; }
  document.body.style.removeProperty("--pk-landR"); document.body.style.removeProperty("--pk-landTools");
  var st2=document.querySelector(".pk-stage"), top=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185;
  var n=P.n, cats=P.cats, ww, gap, nw, availH;
  if(wide){
    var availW=Math.min((st2&&st2.clientWidth)||(VW-560),980);
    availH=window.innerHeight-top-22;
    nw=Math.round(Math.max(250,Math.min(300,availW*.3)));
    var leftW=availW-nw-16-28;
    gap=10; ww=Math.floor(Math.min(108,(leftW-gap*(n-1))/(n+.8)));
    /* not too tall: car + platform must fit the height */
    var hPer=cats>1?3.8:3; ww=Math.max(62,Math.min(ww,Math.floor((availH-40)/hPer)));
  } else {
    availH=window.innerHeight-(seatedNow()?top:56)-(64+24)-6;
    gap=n>4?5:7; var px=6; ww=Math.floor(Math.min(84,(VW-12-2*px-gap*(n-1))/(n+.72)));
    nw=0;
  }
  var cw=wide?Math.min(ww,96):Math.round(ww*(cats>1?.74:.86));
  stage.classList.toggle("cmp",!wide); stage.classList.toggle("tight",!wide&&availH<600);
  stage.style.setProperty("--ww",ww+"px"); stage.style.setProperty("--wg",gap+"px"); stage.style.setProperty("--cw",cw+"px");
  stage.style.setProperty("--nt-px",(wide?14:6)+"px");
  if(nw) stage.style.setProperty("--nt-nw",nw+"px"); else stage.style.removeProperty("--nt-nw");
  /* short phones: the two buttons move onto the platform, beside the cards or bags, to save a row */
  var TL=$(".nt-tools",stage), tight=!wide&&availH<600;
  if(tight&&TL.parentNode!==PLAT){ PLAT.appendChild(TL); } else if(!tight&&TL.parentNode===PLAT){ $(".nt-right",stage).appendChild(TL); }
  PLAT.classList.toggle("withtools",tight); PLAT.classList.toggle("w6",n>=6||tight); PLAT.classList.toggle("solo",cats<2);
  stage.style.removeProperty("--tw");
  /* phones (Nov 1): the cards and the bags take the platform's full width (bigger, easier to see); then the carriage shrinks
     until everything (with at least ~4 lines of clues) fits above the kit's bar, and only then the cards */
  if(!wide){ var minC=tight?78:96; CLUES.style.maxHeight=minC+"px";
    var pw=PLAT.clientWidth-12, toolsW=tight&&cats>1?TL.offsetWidth+6:0;
    var tw=0; cw=Math.max(44,Math.min(66,Math.floor((pw-gap*(n-1))/n)));
    function setPh(){ stage.style.setProperty("--ww",ww+"px"); stage.style.setProperty("--cw",cw+"px");
      if(cats>1){ tw=Math.max(34,Math.min(Math.round(cw*.86),Math.floor((pw-toolsW-gap*(n-1))/n))); stage.style.setProperty("--tw",tw+"px"); } }
    setPh();
    for(var g=0;g<24&&stage.offsetHeight>availH&&ww>44;g++){ ww-=2; setPh(); }
    for(g=0;g<12&&stage.offsetHeight>availH&&cw>44;g++){ cw=Math.max(44,cw-2); setPh(); } }
  /* the clue list scrolls inside the notes when there's no room for all of it */
  CLUES.style.maxHeight="none";
  var right2=$(".nt-right",stage), left=$(".nt-left",stage);
  var notesFixed=NOTES.offsetHeight-CLUES.offsetHeight, toolsH=TL.parentNode===PLAT?0:TL.offsetHeight+10;
  var room=wide?availH-notesFixed-toolsH-8:availH-left.offsetHeight-8-notesFixed-toolsH;
  if(CLUES.scrollHeight>room) CLUES.style.maxHeight=Math.max(wide?160:availH<600?78:92,Math.floor(room))+"px";
  document.body.style.setProperty("--pk-size",Math.round(stage.offsetWidth||VW)+"px");
  moreCue();
}
/* a phone held sideways (Nov 1): the carriage and the platform as big as the height allows, the notes in a column at the right */
function fitLand(VW){
  var n=P.n, cats=P.cats, ins=Parlor.insets(), coaching=document.body.classList.contains("pk-coaching");
  var R=Math.round(Math.max(200,Math.min(280,VW*.31)));

  set(); for(var g=0;g<30&&(left.offsetHeight>lh||left.scrollWidth>lw)&&ww>40;g++){ ww-=2; set(); }

  CLUES.style.maxHeight="none";
  var notesFixed=NOTES.offsetHeight-CLUES.offsetHeight, toolsH=TL.offsetHeight+6;
  var colH=coaching?Math.round(lh*.4):lh;
  var room=colH-notesFixed-toolsH;
  if(CLUES.scrollHeight>room) CLUES.style.maxHeight=Math.max(coaching?44:60,Math.floor(room))+"px";
  document.body.style.setProperty("--pk-landTools",coaching?($(".nt-right",stage).offsetHeight+8)+"px":"0px");
  document.body.style.setProperty("--pk-size",Math.round(left.offsetWidth||lw)+"px");
  moreCue();
}

var wasSeated=false, wasCoach=false;
new MutationObserver(function(){ var now=seatedNow(), co=document.body.classList.contains("pk-coaching"); if(now===wasSeated&&co===wasCoach) return; wasSeated=now; wasCoach=co; setTimeout(fit,30); setTimeout(fit,400); }).observe(document.body,{attributes:true,attributeFilter:["class"]});
document.addEventListener("DOMContentLoaded",function(){ tools(); startDaily(false); fit(); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ fit(); });
/* for testing */
window.NTO={get:function(){ return {P:P,seat:seat,lock:lock,hints:hints,done:done,mode:mode,sel:sel}; },put:put,hint:hint,restart:restart,
  solve:function(){ for(var c=0;c<P.cats;c++) for(var i=0;i<P.n;i++) seat[c][i]=P.sol[c][i]; paint(); after(); },
  load:function(p){ load(p,"daily"); }};
})();
