/* ===== The Orrery (Puzzles & Brain Games, Oct 30; 3-D look and smooth dragging Oct 31): a daily puzzle on a tilted brass orrery =====
   A turned walnut base with engraved spokes, brass rings round a gold sun, enamel planets on brass arms.
   Turn the rings (drag one, or tap it and use the turn buttons) until every planet sits on its engraved mark.
   Gears: turning some rings turns another too. Rings without a handle turn only through their gear.
   Planets on neighboring rings can never share a spoke (their arms would clash).
   One puzzle a day (the same for everyone, by the player's own date); Monday is gentle, Sunday the hardest.
   Par = the fewest turns possible (found by the solver). Finishes (the Finishes card): one free, two for Club members. */

.or-fit.drag .or-live{cursor:grabbing}

.or-toast.on{opacity:1}
.or-pulse{animation:or-pulse .8s ease 3}

/* ===== Orrery core (rules, solver, daily maker) — shared by the page and the tests ===== */
var OR = (function () {
  "use strict";
  /* a small seeded random (mulberry32) */
  function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function hash(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  /* a puzzle: { S: stops round a ring, rings:[{p:[offsets of its planet (0) and moons], crank:true|false}],
     links:[{a: driver ring, b: follower ring, dir: +1 same way | -1 opposite}], start:[turn of each ring], goal:[…] }
     A planet's stop = (ring turn + its offset) mod S. Planets on neighbouring rings may never share a stop. */
  function prep(P) {
    var R = P.rings.length, S = P.S;
    /* what each crank does: a list of [ring, step] for +1 on that crank (followers follow, and their followers too) */
    var eff = [];
    for (var i = 0; i < R; i++) {
      var d = new Array(R).fill(0); d[i] = 1;
      var changed = true, guard = 0;
      while (changed && guard++ < 10) { changed = false; P.links.forEach(function (L) { var want = d[L.a] * L.dir; if (d[L.a] && d[L.b] !== want) { d[L.b] = want; changed = true; } }); }
      eff.push(d);
    }
    var pow = []; for (var k = 0, m = 1; k < R; k++, m *= S) pow.push(m);
    P._eff = eff; P._pow = pow; P._N = pow[R - 1] * S; P._R = R;
    return P;
  }
  function enc(P, t) { var s = 0; for (var i = 0; i < P._R; i++) s += t[i] * P._pow[i]; return s; }
  function dec(P, s) { var t = []; for (var i = 0; i < P._R; i++) { t.push(s % P.S); s = Math.floor(s / P.S); } return t; }
  function mod(a, n) { return ((a % n) + n) % n; }
  /* is this arrangement free of clashes? */
  function okState(P, t) {
    for (var i = 0; i + 1 < P._R; i++)
      for (var x = 0; x < P.rings[i].p.length; x++) for (var y = 0; y < P.rings[i + 1].p.length; y++)
        if (mod(t[i] + P.rings[i].p[x] - t[i + 1] - P.rings[i + 1].p[y], P.S) === 0) return false;
    return true;
  }
  /* turn crank `ring` one stop (d = +1 or -1). Returns the new turns, or null if two arms would clash on the way.
     (Two planets turning towards each other would pass through each other mid-step: that's a clash too.) */
  function step(P, t, ring, d, noClash) {
    if (!P.rings[ring].crank) return null;
    var e = P._eff[ring], n = t.slice();
    for (var i = 0; i < P._R; i++) n[i] = mod(t[i] + e[i] * d, P.S);
    if (noClash) return n;
    for (var j = 0; j + 1 < P._R; j++) {
      var ch = (e[j] - e[j + 1]) * d; if (!ch) continue;
      for (var x = 0; x < P.rings[j].p.length; x++) for (var y = 0; y < P.rings[j + 1].p.length; y++) {
        var rel = mod(t[j] + P.rings[j].p[x] - t[j + 1] - P.rings[j + 1].p[y], P.S), sg = ch > 0 ? 1 : -1;
        for (var k = 1; k <= Math.abs(ch); k++) if (mod(rel + sg * k, P.S) === 0) return null;
      }
    }
    return n;
  }
  /* breadth-first search back from the goal: dist[state] = fewest turns to finish (-1 = can't be reached) */
  function solve(P, noClash) {
    var N = P._N, dist = new Int16Array(N).fill(-1), q = new Int32Array(N), h = 0, tl = 0, g = enc(P, P.goal);
    dist[g] = 0; q[tl++] = g;
    while (h < tl) {
      var s = q[h++], t = dec(P, s), dd = dist[s];
      for (var r = 0; r < P._R; r++) { if (!P.rings[r].crank) continue;
        for (var d = -1; d <= 1; d += 2) { var n = step(P, t, r, d, noClash); if (!n) continue; var e = enc(P, n); if (dist[e] < 0) { dist[e] = dd + 1; q[tl++] = e; } } }
    }

  }
  /* the best moves from here (each one brings the planets a turn closer) */
  function bestMoves(P, dist, t) {
    var cur = dist[enc(P, t)], out = [];
    for (var r = 0; r < P._R; r++) { if (!P.rings[r].crank) continue;
      for (var d = -1; d <= 1; d += 2) { var n = step(P, t, r, d); if (n && dist[enc(P, n)] === cur - 1) out.push({ ring: r, d: d }); } }
    return out;
  }

  /* ---------- the daily puzzle ----------
     Monday is gentle and the week climbs to Sunday. band = the par range; detour = how many extra turns the
     clashing arms must cost compared with the same gears and no clashes (the "go the long way round" part). */
  var DAYS = {
    1: { name: "Monday",    R: 3, S: 8,  links: 1, still: 0, moons: 0, band: [5, 8],   detour: 1 },
    2: { name: "Tuesday",   R: 3, S: 8,  links: 2, still: 0, moons: 0, band: [7, 10],  detour: 2 },
    3: { name: "Wednesday", R: 4, S: 8,  links: 2, still: 0, moons: 0, band: [9, 12],  detour: 2 },
    4: { name: "Thursday",  R: 4, S: 10, links: 2, still: 1, moons: 0, band: [10, 14], detour: 3 },
    5: { name: "Friday",    R: 4, S: 10, links: 3, still: 1, moons: 1, band: [12, 16], detour: 3 },
    6: { name: "Saturday",  R: 5, S: 10, links: 3, still: 1, moons: 1, band: [13, 18], detour: 4 },
    0: { name: "Sunday",    R: 5, S: 12, links: 3, still: 1, moons: 2, band: [15, 22], detour: 4 }
  };
  function make(seedStr, wd) {
    var D = DAYS[wd], rand = rng(hash("orrery:" + seedStr));
    function ri(n) { return Math.floor(rand() * n); }
    for (var tries = 0; tries < 400; tries++) {
      var R = D.R, S = D.S, rings = [], links = [], i;
      for (i = 0; i < R; i++) rings.push({ p: [0], crank: true });
      /* moons ride the outer rings, a little way round from their planet */
      var moonRings = [];
      for (i = 0; i < D.moons; i++) { var mr = R - 1 - i; if (mr < 1) break; moonRings.push(mr); rings[mr].p.push(2 + ri(S - 3)); }
      /* gears: each ring is driven by at most one other, no loops */
      var drivenBy = new Array(R).fill(-1), ok = true;
      for (i = 0; i < D.links; i++) {
        var guard = 0, a, b;
        do { a = ri(R); b = ri(R); guard++; } while (guard < 60 && (a === b || drivenBy[b] >= 0 || loops(a, b)));
        if (guard >= 60) { ok = false; break; }
        drivenBy[b] = a; links.push({ a: a, b: b, dir: rand() < 0.5 ? 1 : -1 });
      }
      if (!ok) continue;
      function loops(a, b) { var x = a, g = 0; while (x >= 0 && g++ < 10) { if (x === b) return true; x = drivenBy[x]; } return false; }
      /* rings without a crank (they turn only through their gear) */
      var followers = []; for (i = 0; i < R; i++) if (drivenBy[i] >= 0) followers.push(i);
      if (followers.length < D.still) continue;
      for (i = 0; i < D.still; i++) { var k = ri(followers.length); rings[followers[k]].crank = false; followers.splice(k, 1); }
      var P = prep({ S: S, rings: rings, links: links, start: [], goal: [] });
      /* every ring must actually be movable independently enough: no two cranks doing the same thing */
      var sig = {}, dup = false;
      for (i = 0; i < R; i++) if (rings[i].crank) { var key = P._eff[i].join(","), neg = P._eff[i].map(function (v) { return -v; }).join(","); if (sig[key] || sig[neg]) dup = true; sig[key] = 1; }
      if (dup) continue;
      var goal = []; for (i = 0; i < R; i++) goal.push(ri(S));
      if (!okState(P, goal)) continue;
      P.goal = goal;
      var dist = solve(P), free = solve(P, true), pick = [];
      for (var s = 0; s < P._N; s++) {
        var dd = dist[s]; if (dd < D.band[0] || dd > D.band[1]) continue;
        if (dd - free[s] < D.detour) continue;
        var t = dec(P, s), allMoved = true;
        for (i = 0; i < R; i++) if (t[i] === goal[i]) allMoved = false;
        if (allMoved) pick.push(s);
      }
      if (!pick.length) continue;
      P.start = dec(P, pick[ri(pick.length)]);
      P.par = dist[enc(P, P.start)]; P.tries = tries + 1; P.day = D.name; P._dist = dist;
      return P;
    }
    return null;
  }
  return { rng: rng, hash: hash, prep: prep, enc: enc, dec: dec, okState: okState, step: step, solve: solve, bestMoves: bestMoves, make: make, DAYS: DAYS };
})();
if (typeof module !== "undefined") module.exports = OR;

/* place everything for ring turns `tt` (whole or part turns) */
function render(tt){
  var step=360/P.S;
  RG.forEach(function(R,i){ R.g.setAttribute("transform","rotate("+(tt[i]*step).toFixed(3)+" 500 500)");
    R.bodies.forEach(function(B){ var p=pt(GEO.r[i],ang(tt[i]+B.off)), q=scr(p), s=depth(p); B.x=q[0]; B.y=q[1]; B.s=s;
      B.el.setAttribute("transform","translate("+q[0].toFixed(2)+" "+q[1].toFixed(2)+") scale("+s.toFixed(4)+")"); }); });
  /* back to front: only re-stack when the order has changed */
  var order=BODIES.slice().sort(function(a,b){ return a.y-b.y; }), kids=STAND.childNodes, same=true;
  for(var n=0;n<order.length;n++) if(kids[n]!==order[n].el){ same=false; break; }
  if(!same) order.forEach(function(B){ STAND.appendChild(B.el); });
}
/* place every ring at its current turn (animated when `anim`) */
var animT=0;
function paint(anim,from){
  function setAll(f){ var tt=t.map(function(v,i){ if(!from) return v; var dd=v-from[i]; if(dd>P.S/2) dd-=P.S; if(dd<-P.S/2) dd+=P.S; return from[i]+dd*f; }); render(tt); }
  cancelAnimationFrame(animT);
  if(!anim||!window.Parlor||!Parlor.smooth()){ setAll(1); marks(); return; }
  var s0=performance.now(), dur=240;
  (function tick(now){ var p=Math.min(1,(now-s0)/dur), e=1-Math.pow(1-p,3); setAll(e); if(p<1) animT=requestAnimationFrame(tick); else marks(); })(s0);
}

    play:"<ol><li><b>The goal:</b> turn the brass rings until every planet (and moon) sits on its <b>dashed mark</b>.</li><li><b>Turning:</b> drag a ring around, or tap it and press <b>↺</b> or <b>↻</b>. Each turn moves a ring one stop. On a keyboard: ↑ ↓ choose a ring, ← → turn it.</li><li><b>Gears:</b> turning some rings turns another ring too, the same way or the opposite way (it's written under the orrery, and arrows show it when you choose a ring). A gear works one way only: turning the driven ring doesn't turn the one that drives it.</li><li><b>No crank:</b> a ring without a brass handle can't be turned by hand; it turns only through its gear.</li><li><b>Arms can't clash:</b> planets on neighboring rings can never share a spoke. A turn that would make them clash, or pass through each other, won't go. Sometimes the best way is the long way around.</li><li><b>Undo</b> takes back a turn, <b>Hint</b> shows a best next turn, <b>Restart</b> lays the puzzle out again.</li></ol>",
    score:"<ul><li><b>One puzzle a day</b>, the same for everyone. It changes at midnight on your device. Monday is gentle; it gets harder through the week, with more rings, more gears and moons by the weekend.</li><li><b>Par</b> is the fewest turns the puzzle can be done in (worked out by a solver).</li><li><b>★★★</b> at par · <b>★★</b> within three turns of par · <b>★</b> otherwise. Using a hint caps the day at two stars.</li><li>Your first finish of the day is the one kept, with your <b>streak</b> of days in a row. Play again as often as you like.</li><li>Practice puzzles (in Learn to Play) are free and don't count.</li></ul>"
