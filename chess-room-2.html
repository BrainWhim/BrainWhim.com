<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess table · BrainWhim</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A2744;--whim:#7EB6D9}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:Montserrat,sans-serif;color:#f6f1e8;
background-color:#1a1410;
background-image:linear-gradient(180deg,rgba(20,16,12,.12),rgba(20,16,12,.32)), url("garden-parlor.jpg");
background-position:center, center 22%;
background-size:cover, 150% auto;
background-repeat:no-repeat;
background-attachment:scroll}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:6px 4% 8px;background:var(--navy);min-height:72px}
.brand{display:flex;align-items:center;color:#fff;text-decoration:none;font-size:22px}
.brand img{width:56px;height:56px;object-fit:contain}
.whim{font-family:Pacifico,cursive;color:var(--whim)}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
header a,.hdr a{color:#fff;font-weight:700;text-decoration:none;margin-left:8px;font-size:14px}
.games{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:8px auto 6px;max-width:640px;padding:6px 8px;background:rgba(255,252,247,.78);border-radius:16px;backdrop-filter:blur(8px)}
.games a{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:5px 9px;font-weight:700;font-size:11px;text-decoration:none;color:#1A2744}
.games a.on{background:#1A2744;color:#fff;border-color:#1A2744}
.wrap{max-width:780px;margin:0 auto;padding:4px 8px 72px}
.hud{max-width:320px;margin:8px auto;background:rgba(255,252,247,.9);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;border:1px solid rgba(255,255,255,.6)}
h1{display:none}
.meta,.msg{text-align:center;font-size:12px;margin:0 0 2px;color:#1A2744}
.code{letter-spacing:.08em;font-weight:800}
.stage{
  perspective:920px;
  perspective-origin:50% 70%;
  padding:0;
}
.table{
  width:min(560px,92vw);
  margin:0 auto;
  transform:rotateX(24deg) scale(1.08);
  transform-origin:50% 55%;
  transform-style:preserve-3d;
}
.table-top{
  background:
    radial-gradient(120% 80% at 50% 30%, #fffdf8 0%, #f3ead6 58%, #e4d4b8 100%);
  padding:22px 22px 26px;
  border-radius:0;
  border:14px solid #c4bfb4;
  outline:6px solid #cfe4d8;
  outline-offset:-20px;
  box-shadow:
    0 28px 40px rgba(30,22,12,.38),
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 0 0 3px #d7c49a,
    inset 0 0 18px rgba(90,80,60,.12);
}
.sqgrid{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  border:8px solid #e8d7a8;
  box-shadow:0 8px 16px rgba(40,30,16,.18), inset 0 0 0 2px #c4bfb4;
  overflow:visible;
}
.sq{
  aspect-ratio:1;
  border:0;padding:0;cursor:pointer;
  position:relative;
  overflow:visible;
}
.lt{background:#F3EBDA}
.dk{background:#A8CDB8}
.sel{outline:3px solid #C9A227;outline-offset:-3px;z-index:3}
.mv{box-shadow:inset 0 0 0 3px rgba(30,75,154,.45)}
.to{box-shadow:inset 0 0 0 4px #C9A227}
.pcimg{
  width:92%;
  height:138%;
  object-fit:contain;
  object-position:bottom center;
  pointer-events:none;
  position:absolute;
  left:4%;
  bottom:2%;
  filter:drop-shadow(0 6px 4px rgba(0,0,0,.38));
  z-index:2;
}
.row{display:flex;gap:8px;justify-content:center;margin:0;position:fixed;left:0;right:0;bottom:10px;z-index:6}
.btn{border:0;border-radius:999px;padding:8px 14px;background:rgba(26,39,68,.88);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none}
.tray{min-height:28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;margin:0 auto 6px;font-size:12px;font-weight:700;color:#1A2744;background:rgba(255,252,247,.96);border-radius:12px;padding:4px 12px;max-width:420px;position:relative;z-index:6}
.table-top + .tray{margin:6px auto 0}
.tray:not(:has(img)){height:0;min-height:0;padding:0;margin:0;opacity:0;overflow:hidden}
.tray .lab{margin-right:6px}
.tray .pcimg{width:20px;height:20px;position:static;filter:none}
.flyer{
  position:fixed;z-index:80;pointer-events:none;
  object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 18px 10px rgba(0,0,0,.35));
  transition:transform .55s cubic-bezier(.2,.7,.2,1), filter .55s ease;
  will-change:transform;
}
@media(max-width:700px){
  header{display:grid;grid-template-columns:1fr;height:auto;padding:6px 10px 8px}
  .hdr{justify-content:center;width:100%;padding-top:4px}
  .table{width:94vw;transform:rotateX(18deg) scale(1.06)}
}
</style>
</head>
<body>
<header>
<a class="brand" href="tables.html"><img src="logo-image.png" alt=""><span>Brain</span><span class="whim">Whim</span></a>
<nav class="hdr"><a href="tables.html">Tables</a><a href="board.html">House</a><a href="play.html">Play</a><a href="cards.html">Cards</a><a href="index.html">Home</a></nav>
</header>
<div class="games">
<a href="board.html?scene=ck">Checkers</a>
<a class="on" href="board.html?scene=ch">Chess</a>
<a href="backgammon.html">Backgammon</a>
<a href="yahtzee.html">Yahtzee</a>
<a href="dominoes.html">Dominoes</a>
<a href="othello.html">Othello</a>
<a href="mancala.html">Mancala</a>
<a href="cribbage.html">Cribbage</a>
<a href="shutbox.html">Shut the Box</a>
<a href="morris.html">Morris</a>
</div>
<div class="wrap">
  <div class="hud">
    <h1>Garden chess</h1>
    <p class="meta"><span id="codeLab">Online table</span> · <span id="seatLab">…</span></p>
    <p class="msg" id="chmsg">Connecting…</p>
  </div>
  <div class="stage">
    <div class="table">
      <div class="tray" id="trayOpp"></div>
      <div class="table-top">
        <div class="sqgrid" id="chboard"></div>
      </div>
      <div class="tray" id="trayYou"></div>
    </div>
  </div>
  <div class="row"><a class="btn" href="tables.html">Return to tables</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="play-config.js"></script>
<script>
var sb, room, me, myColor=null;
var ch, chSel, chOver, chTurn, chLast=null, chEp=null, chRights={wk:1,wq:1,bk:1,bq:1};
var tookW=[], tookB=[];
var flying=null, busy=false;
var CODE=(location.search.match(/code=([A-Za-z0-9]+)/)||[])[1];
if(CODE) CODE=CODE.toUpperCase();

function pieceHTML(p){
  return '<img class="pcimg" alt="" src="piece-'+(chWhite(p)?"w":"b")+'-'+p.toUpperCase()+'.png?v=14">';
}
function chWhite(p){ return p && p===p.toUpperCase(); }
function chOn(r,c){ return r>=0&&c>=0&&r<8&&c<8; }
function chFind(chPiece){
  for(var r=0;r<8;r++) for(var c=0;c<8;c++) if(ch[r][c]===chPiece) return [r,c];
  return null;
}
function chAttacks(white){
  var hits={};
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){
    var p=ch[r][c]; if(!p) continue;
    if(chWhite(p)!==white) continue;
    var raw=chRaw(r,c,true);
    for(var i=0;i<raw.length;i++) hits[raw[i][0]+","+raw[i][1]]=1;
  }
  return hits;
}
function chInCheck(white){
  var k=chFind(white?"K":"k"); if(!k) return true;
  return !!chAttacks(!white)[k[0]+","+k[1]];
}
function chRaw(r,c,forAttack){
  var p=ch[r][c], out=[], i, nr, nc;
  if(!p) return out;
  var w=chWhite(p), t=p.toUpperCase();
  function slide(dr,dc){
    nr=r+dr; nc=c+dc;
    while(chOn(nr,nc)){
      if(!ch[nr][nc]) out.push([nr,nc]);
      else { if(chWhite(ch[nr][nc])!==w) out.push([nr,nc]); break; }
      nr+=dr; nc+=dc;
    }
  }
  if(t==="P"){
    var dir=w?-1:1, start=w?6:1;
    if(!forAttack){
      if(chOn(r+dir,c)&&!ch[r+dir][c]){
        out.push([r+dir,c]);
        if(r===start && !ch[r+dir*2][c]) out.push([r+dir*2,c]);
      }
    }
    for(i=-1;i<=1;i+=2){
      nr=r+dir; nc=c+i;
      if(chOn(nr,nc) && (forAttack || (ch[nr][nc] && chWhite(ch[nr][nc])!==w))) out.push([nr,nc]);
      if(!forAttack && chEp && nr===chEp[0] && nc===chEp[1]) out.push([nr,nc]);
    }
  }
  if(t==="N"){
    var kn=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for(i=0;i<8;i++){ nr=r+kn[i][0]; nc=c+kn[i][1]; if(chOn(nr,nc)&&(!ch[nr][nc]||chWhite(ch[nr][nc])!==w)) out.push([nr,nc]); }
  }
  if(t==="B"||t==="Q"){ slide(-1,-1);slide(-1,1);slide(1,-1);slide(1,1); }
  if(t==="R"||t==="Q"){ slide(-1,0);slide(1,0);slide(0,-1);slide(0,1); }
  if(t==="K"){
    for(nr=r-1;nr<=r+1;nr++) for(nc=c-1;nc<=c+1;nc++){
      if((nr!==r||nc!==c)&&chOn(nr,nc)&&(!ch[nr][nc]||chWhite(ch[nr][nc])!==w)) out.push([nr,nc]);
    }
  }
  return out;
}
function chMoves(r,c){
  var p=ch[r][c], raw=chRaw(r,c,false), legal=[];
  for(var i=0;i<raw.length;i++){
    var nr=raw[i][0], nc=raw[i][1], cap=ch[nr][nc];
    ch[nr][nc]=p; ch[r][c]="";
    if(!chInCheck(chWhite(p))) legal.push([nr,nc]);
    ch[r][c]=p; ch[nr][nc]=cap;
  }
  return legal;
}
function chAll(white){
  var a=[];
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){
    if(!ch[r][c] || chWhite(ch[r][c])!==white) continue;
    var m=chMoves(r,c);
    for(var i=0;i<m.length;i++) a.push([r,c,m[i][0],m[i][1]]);
  }
  return a;
}
function chDo(sr,sc,r,c){
  var p=ch[sr][sc], cap=ch[r][c];
  if((p==="P"||p==="p") && !cap && sc!==c && chEp && r===chEp[0] && c===chEp[1]){
    cap=ch[sr][c]; ch[sr][c]="";
  }
  if(cap){
    if(chWhite(p)) tookW.push(cap);
    else tookB.push(cap);
  }
  ch[r][c]=p; ch[sr][sc]="";
  if((p==="P"||p==="p") && Math.abs(r-sr)===2) chEp=[(r+sr)/2,c]; else chEp=null;
  if(p==="P" && r===0) ch[r][c]="Q";
  if(p==="p" && r===7) ch[r][c]="q";
}
function snapshot(){
  return {board:ch, turn:chTurn, last:chLast, over:chOver, rights:chRights, ep:chEp, tookW:tookW, tookB:tookB};
}
function applySnap(s){
  if(!s||!s.board) return;
  ch=s.board; chTurn=s.turn||"w"; chLast=s.last||null; chOver=!!s.over; chRights=s.rights||chRights; chEp=s.ep||null;
  tookW=s.tookW||[]; tookB=s.tookB||[];
}
function flipBoard(){ return myColor==="b"; }
function viewR(r){ return flipBoard()?7-r:r; }
function viewC(c){ return flipBoard()?7-c:c; }
function nameSide(t){ return t==="w"?"Cobalt":"Ivory"; }
function turnMsg(){
  if(chOver) return "Game over";
  if(myColor && chTurn===myColor) return "Your move — "+nameSide(chTurn);
  return nameSide(chTurn)+" to move";
}
function chPaint(){
  var html="", moves=chSel?chMoves(chSel[0],chSel[1]):[];
  for(var vr=0;vr<8;vr++) for(var vc=0;vc<8;vc++){
    var r=viewR(vr), c=viewC(vc);
    var dark=(r+c)%2===1;
    var cls="sq "+(dark?"dk":"lt");
    if(chSel && chSel[0]===r && chSel[1]===c) cls+=" sel";
    if(moves.some(function(m){return m[0]===r&&m[1]===c})) cls+=" mv";
    if(chLast && chLast[2]===r && chLast[3]===c) cls+=" to";
    var p=ch[r][c];
    if(flying && flying[0]===r && flying[1]===c) p="";
    html+='<button type="button" class="'+cls+'" data-r="'+r+'" data-c="'+c+'" onclick="chClick('+r+','+c+')">'+(p?pieceHTML(p):"")+'</button>';
  }
  document.getElementById("chboard").innerHTML=html;
  function tray(id, arr, label){
    var el=document.getElementById(id); if(!el) return;
    var h='<span class="lab">'+label+'</span>';
    for(var i=0;i<arr.length;i++) h+=pieceHTML(arr[i]);
    el.innerHTML=h;
  }
  tray("trayOpp", myColor==="b"?tookW:tookB, "Opponent took");
  tray("trayYou", myColor==="b"?tookB:tookW, "You took");
}
function setMsg(t){ document.getElementById("chmsg").textContent=t; }
function squareEl(r,c){
  return document.querySelector('#chboard .sq[data-r="'+r+'"][data-c="'+c+'"]');
}
function flyPiece(sr,sc,r,c, piece, done){
  var a=squareEl(sr,sc), b=squareEl(r,c);
  if(!a||!b||!piece){ if(done) done(); return; }
  var ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
  var img=document.createElement("img");
  img.className="flyer";
  img.src="piece-"+(chWhite(piece)?"w":"b")+"-"+piece.toUpperCase()+".png?v=14";
  var w=Math.max(ra.width, rb.width)*0.95;
  var h=w*1.35;
  img.style.width=w+"px";
  img.style.height=h+"px";
  img.style.left=ra.left+(ra.width-w)/2+"px";
  img.style.top=ra.bottom-h+"px";
  document.body.appendChild(img);
  flying=[r,c];
  chPaint();
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      var lift=Math.min(70, Math.hypot(rb.left-ra.left, rb.top-ra.top)*0.22);
      img.style.filter="drop-shadow(0 28px 16px rgba(0,0,0,.28))";
      img.style.transform="translate("+(rb.left-ra.left)+"px,"+(rb.bottom-ra.bottom-lift)+"px) scale(1.12)";
      setTimeout(function(){
        img.style.transform="translate("+(rb.left-ra.left)+"px,"+(rb.bottom-ra.bottom)+"px) scale(1)";
        img.style.filter="drop-shadow(0 8px 5px rgba(0,0,0,.35))";
      }, 280);
    });
  });
  setTimeout(function(){
    if(img.parentNode) img.parentNode.removeChild(img);
    flying=null;
    chPaint();
    if(done) done();
  }, 580);
}
async function pushState(){
  if(!room) return;
  await sb.from("rooms").update({state:snapshot(), status:chOver?"done":"live", updated_at:new Date().toISOString()}).eq("id", room.id);
}
function chClick(r,c){
  if(chOver || !myColor || busy) return;
  if(chTurn!==myColor) return;
  var mine=myColor==="w";
  if(chSel){
    var ok=chMoves(chSel[0],chSel[1]).some(function(m){return m[0]===r&&m[1]===c});
    if(ok){
      var sr=chSel[0], sc=chSel[1], mover=ch[sr][sc];
      busy=true;
      chDo(sr,sc,r,c);
      chLast=[sr,sc,r,c];
      chSel=null;
      var opp=myColor==="w"?false:true;
      if(!chAll(opp).length){
        chOver=true;
        setMsg(chInCheck(opp)?"Checkmate.":"Draw.");
      } else {
        chTurn=myColor==="w"?"b":"w";
        setMsg(turnMsg());
      }
      flyPiece(sr,sc,r,c, mover, function(){
        busy=false;
        pushState();
      });
      return;
    }
  }
  if(ch[r][c] && chWhite(ch[r][c])===mine){ chSel=[r,c]; chPaint(); }
  else { chSel=null; chPaint(); }
}
async function boot(){
  var online=/(?:^|[?&])online=1/.test(location.search);
  document.getElementById("codeLab").textContent=online?"Online table":("Table "+(CODE||"—"));
  var cfg=window.BW_PLAY||{};
  if(!CODE||!cfg.url){ setMsg("Missing table code or play-config.js"); return; }
  sb=supabase.createClient(cfg.url, cfg.anonKey);
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ setMsg("Sign in on Tables first."); return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code", CODE).single();
  if(q.error){ setMsg(q.error.message); return; }
  room=q.data;
  if(room.host===me) myColor="w";
  else if(room.guest===me) myColor="b";
  else if(!room.guest){
    var u=await sb.from("rooms").update({guest:me, status:"live"}).eq("id", room.id).select().single();
    if(!u.error){ room=u.data; myColor="b"; }
  }
  document.getElementById("seatLab").textContent=myColor==="w"?"You are cobalt": myColor==="b"?"You are ivory":"Watching";
  document.body.style.backgroundImage='linear-gradient(180deg,rgba(20,16,12,.18),rgba(20,16,12,.42)), url("garden-parlor.jpg")';
  document.body.style.backgroundPosition="center, center 28%";
  document.body.style.backgroundSize="cover, cover";
  document.body.style.backgroundRepeat="no-repeat";

  applySnap(room.state);
  if(!ch) applySnap({board:[["r","n","b","q","k","b","n","r"],["p","p","p","p","p","p","p","p"],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["","","","","","","",""],["P","P","P","P","P","P","P","P"],["R","N","B","Q","K","B","N","R"]],turn:"w"});
  setMsg(!room.guest && myColor==="w" ? "Waiting for someone online to sit…" : turnMsg());
  chPaint();
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE", schema:"public", table:"rooms", filter:"code=eq."+CODE}, function(payload){
    var prev=chLast?chLast.join(","):"";
    room=payload.new;
    applySnap(room.state);
    chSel=null;
    setMsg(!room.guest && myColor==="w" ? "Waiting for someone online to sit…" : turnMsg());
    if(room.guest) document.getElementById("seatLab").textContent=myColor==="w"?"You are cobalt": myColor==="b"?"You are ivory":"Watching";
    var now=chLast?chLast.join(","):"";
    if(now && now!==prev && chLast){
      var mover=ch[chLast[2]][chLast[3]];
      flyPiece(chLast[0],chLast[1],chLast[2],chLast[3], mover);
    } else chPaint();
  }).subscribe();
}
boot();
</script>
</body>
