<style>
/* Sophie's Slime Lab (The Outpost · The Workshop), Nov 13. Sophie's game: animal customers order slime; mix red, yellow, blue and white
   drops until the color matches (ratios count: 2 blue + 1 yellow = 4 blue + 2 yellow), add the glitter and fun bits on the card,
   squeeze in activator, stir, stretch, serve. 3 orders a day, harder colors through the week; Bonus Order once today's are done. */
:root{--bgx:83%;--bgy:83%}
#play{flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
.cbar{width:min(640px,100%);display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:16px;color:#2b2116;flex:none;
  background:linear-gradient(180deg,#f4ead3,#e6d6b2);box-shadow:0 4px 0 #b39c70,0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.cday{flex:1;text-align:center;line-height:1.15}
.cday b{display:block;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#8a4fb8}
.cday span{font-size:14px;font-weight:700;color:#5a4220}
.ib{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;min-height:38px;padding:0 13px;border-radius:12px;color:#3a2306;
  background:linear-gradient(180deg,#ffe7a6,#e9c46a);box-shadow:0 3px 0 #a97a1c}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #a97a1c}
.ib.gh{background:rgba(120,80,20,.1);box-shadow:none;color:#6b4a1a}
.ib:disabled{opacity:.4;cursor:default}
/* the order ticket */
.ticket{position:relative;width:min(560px,100%);flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:6px 6px 14px 14px;color:#4a3518;
  background:linear-gradient(180deg,#f4ead3,#e6d6b2);box-shadow:0 2px 0 #c7b088,0 10px 20px rgba(0,0,0,.4);transform:rotate(-.6deg)}
.ticket::before{content:"";position:absolute;left:50%;top:-8px;width:64px;height:18px;margin-left:-32px;transform:rotate(2deg);
  background:linear-gradient(180deg,rgba(255,250,235,.75),rgba(235,225,200,.6));box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ticket.new{animation:tin .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes tin{0%{transform:translateY(-30px) rotate(-4deg);opacity:0}100%{transform:rotate(-.6deg);opacity:1}}
.cust{flex:none;width:68px;text-align:center}
.cust .face{display:block;width:56px;height:56px;margin:0 auto;border-radius:50%;font-size:36px;line-height:56px;
  background:radial-gradient(circle at 35% 30%,#fff,#efe1c2 70%);box-shadow:inset 0 -3px 6px rgba(120,90,40,.25),0 2px 4px rgba(0,0,0,.2)}
.cust b{display:block;font-size:12.5px;line-height:1.1;margin-top:3px}
.items{flex:1;min-width:0}
.items .wants{font-size:13px;font-weight:700;color:#7a5a2a;margin:0 0 4px}
.irow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-start}
.it{position:relative;display:flex;flex-direction:column;align-items:center;min-width:52px;max-width:84px;font-size:12.5px;font-weight:700;line-height:1.1;text-align:center}
.it svg{width:40px;height:34px;display:block}
.it .ok{position:absolute;right:2px;top:-4px;width:18px;height:18px;border-radius:50%;background:#2fae7a;color:#fff;font-size:12px;line-height:18px;
  box-shadow:0 1px 2px rgba(0,0,0,.35);transform:scale(0);transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
.it.done .ok{transform:scale(1)}
.tip{display:flex;gap:3px;align-items:center;justify-content:center;margin-top:3px;font-size:12px;font-weight:800;color:#5a4220;animation:kRise .4s}
.tip i{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 -2px 2px rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.25)}
.cmsg{min-height:22px;max-width:640px;text-align:center;font-weight:700;font-size:16px;line-height:1.3;color:#ffe9b8;text-shadow:0 2px 6px rgba(0,0,0,.7);padding:0 6px;flex:none}
#bench{position:relative;flex:1 1 auto;width:100%;max-width:680px;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
#bench svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.cface{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(2deg)}}
.jwob{transform-box:fill-box;transform-origin:50% 100%;animation:jw 3.4s ease-in-out infinite}
.bulb{animation:bulb 3.1s ease-in-out infinite}
@keyframes bulb{50%{opacity:.4}}
.cbub{animation:cbub 3s ease-in-out infinite}
@keyframes cbub{50%{transform:translateY(-2px)}}
@keyframes jw{0%,86%,100%{transform:none}90%{transform:scale(1.06,.94)}95%{transform:scale(.97,1.03)}}
/* the tray: a wooden shelf of ingredients */
.tray{width:min(640px,100%);flex:none;border-radius:16px;padding:6px 8px 9px;
  background:repeating-linear-gradient(92deg,rgba(60,30,10,0) 0 37px,rgba(60,30,10,.14) 37px 39px,rgba(255,220,170,.05) 39px 61px,rgba(60,30,10,.08) 61px 62px),
    linear-gradient(180deg,#c48a52 0,#a46a37 50%,#7b4a22 100%);
  box-shadow:0 10px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,225,180,.55),inset 0 -3px 0 rgba(60,30,10,.4)}
.steps{display:flex;justify-content:center;gap:4px;margin:0 0 6px;flex-wrap:wrap}
.steps span{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;color:rgba(255,240,215,.7);background:rgba(50,25,8,.3)}
.steps span.on{color:#3a2306;background:linear-gradient(180deg,#ffe7a6,#e9c46a)}
.steps span.done{color:#d8fff0;background:rgba(30,120,90,.55)}
.tbox{display:flex;justify-content:center;gap:7px}
.ing{appearance:none;border:0;cursor:pointer;font:inherit;flex:1 1 0;min-width:0;max-width:86px;height:82px;padding:4px 2px 5px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#4a3518;font-size:12.5px;font-weight:800;line-height:1.05;
  background:linear-gradient(180deg,#f4ead3,#e6d6b2);box-shadow:0 3px 0 #8a6236,0 6px 10px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent;position:relative}
.ing svg{width:100%;height:52px;display:block;pointer-events:none}
.ing.wide{max-width:150px}
.ing:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6236}
.ing:disabled{opacity:.45;cursor:default;transform:none}
.ing.on{box-shadow:0 3px 0 #8a6236,0 0 0 3px #5fd1c1 inset}
.ing.glow{animation:ingg .9s ease-in-out infinite}
@keyframes ingg{50%{box-shadow:0 3px 0 #8a6236,0 0 0 3px #ffd98a,0 0 18px 5px rgba(242,190,69,.85)}}
.ing.bad{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.ing .n{position:absolute;right:4px;top:3px;min-width:18px;height:18px;border-radius:9px;background:#7c52e0;color:#fff;font-size:11.5px;line-height:18px;padding:0 4px}
.stars{font-size:34px;letter-spacing:4px;color:#f2be45;text-shadow:0 2px 0 #8a5f12;margin:2px 0 4px}
.stars i{font-style:normal;color:rgba(255,255,255,.18);text-shadow:none}
.mix{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#ffe9b8;text-shadow:0 2px 6px #000}
.how .sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
@media (max-height:640px){.items .wants{display:none}.irow{gap:4px 6px}.it{min-width:44px;font-size:11.5px}.cust b{font-size:11.5px}.cust{width:58px}.cust .face{width:46px;height:46px;font-size:29px;line-height:46px}.ticket{padding:6px 10px 6px 6px}
  .it svg{width:30px;height:25px}.ing{height:70px}.ing svg{height:42px}.cmsg{font-size:14px;min-height:19px}.ib{min-height:34px;font-size:14px}.steps{margin-bottom:4px}}
@media (min-height:900px) and (min-width:700px){.tray,.cbar{width:min(760px,100%)}.ticket{width:min(680px,100%)}.ing{height:100px;font-size:15px;max-width:120px}.steps span{font-size:13px}.ing svg{height:62px}.cday span{font-size:15px}.ticket{padding:10px 16px 10px 10px}
  .cust{width:84px}.cust .face{width:68px;height:68px;font-size:44px;line-height:68px}.it svg{width:50px;height:42px}.it{font-size:14px}.items .wants{font-size:15px}.cmsg{font-size:18px}}
@media (prefers-reduced-motion:reduce){.cface,.jwob,.ing.glow,.bulb,.cbub{animation:none}}
</style>

  ["hazel","Hazel","Fox","🦊"],["poppy","Poppy","Panda","🐼"],["pearl","Pearl","Unicorn","🦄"],["pickle","Pickle","Frog","🐸"],["coco","Coco","Koala","🐨"],

  for(var i=0;i<4;i++){ if(S.c[i]&&!d[i]){ glow("pour"); return; } if(d[i]) k=Math.max(k,Math.ceil(S.c[i]/d[i])); }
  if(k*total(d)>12){ glow("pour"); return; }
  for(var j=0;j<4;j++) if(k*d[j]>S.c[j]){ glow("d"+j); return; } }
function sparkles(x,y,n){ for(var k=0;k<n;k++){ (function(k){ var a=k/n*6.28, s=el("path",{d:starPath(0,0,4),fill:"#fff4c2"});
  tw(700,function(u){ var e=1-Math.pow(1-u,3); s.setAttribute("transform","translate("+(x+Math.cos(a)*60*e).toFixed(1)+" "+(y+Math.sin(a)*24*e-20*e).toFixed(1)+") scale("+(1.2-u*.8).toFixed(2)+")"); s.setAttribute("opacity",(1-u).toFixed(2)); },function(){ s.remove(); }); })(k); } }

/* ---------- sparkle and fun bits ---------- */
function addGlit(g){ var o=O(), e=document.querySelector('.ing[data-k="'+g.id+'"]');
  if(g.id!==o.glit){ bad(e); var want=GLIT.filter(function(x){ return x.id===o.glit; })[0]; msg("That's "+g.n.toLowerCase()+". The card says "+want.n.toLowerCase()+"."); sayOnce("ng",SAY.nope); return; }
  unglow(); busy=true; sGlit(); S.glit=g.id; var gg=gen; talk(g.n);
  tw(700,function(u){ S.glitA=u; render(); },function(){ busy=false; if(gg!==gen) return; ticket(false); next(); }); }
function addBit(b){ var o=O(), e=document.querySelector('.ing[data-k="'+b.id+'"]');
  if(o.bits.indexOf(b.id)<0){ bad(e); msg(b.n+" aren't on the card for this one."); sayOnce("nb",SAY.nope); return; }
  if(S.bitA[b.id]){ msg("Already in! Look at the card for what's next."); return; }
  unglow(); e.classList.add("on"); busy=true; sBit(); S.bits.push(b.id); S.bitA[b.id]=.01; var g=gen; talk(b.n);
  tw(450,function(u){ S.bitA[b.id]=Math.max(.01,1-Math.pow(1-u,3)); render(); },function(){ S.bitA[b.id]=1; render(); busy=false; if(g!==gen) return; ticket(false);
    if(o.bits.every(function(x){ return S.bitA[x]; })) setTimeout(function(){ if(g===gen) next(); },500); else idle(function(){ o.bits.forEach(function(x){ if(!S.bitA[x]) glow(x); }); }); }); }

/* ---------- mix: activator, then stir ---------- */
function activate(e){ if(S.act) return; unglow(); busy=true; sAct(); S.act=true; e.classList.add("on");
  var g=gen, bt=el("g",{}); bt.innerHTML='<g transform="translate(250 30) rotate(140)"><rect x="-9" y="-30" width="18" height="38" rx="6" fill="#5fd1c1" stroke="#2c8f82"/><path d="M-3 8h6l-1 8h-4z" fill="#eee"/></g>';
  var st=el("path",{d:"M243 47Q232 100 214 "+(SURF-2),stroke:"#bff3ea","stroke-width":5,fill:"none","stroke-linecap":"round","stroke-dasharray":"0 200"});
  tw(650,function(u){ st.setAttribute("stroke-dasharray",(u*200).toFixed(0)+" 200"); },function(){
    tw(300,function(u){ st.setAttribute("opacity",(1-u).toFixed(2)); bt.setAttribute("opacity",(1-u).toFixed(2)); },function(){ st.remove(); bt.remove(); busy=false; if(g!==gen) return;
      document.querySelector('[data-k="stir"]').disabled=false; glow("stir"); msg("Now stir! Drag around the bowl, or tap Stir."); if(teach()) talk(SAY.stir); }); }); }
function addStir(a){ if(!S.act||S.set>=1||S.step!=="mix") return; var before=S.stir; S.stir=Math.min(1,S.stir+a/(Math.PI*2*2.5)); S.swirl+=a; S.set=Math.max(0,(S.stir-.15)/.85);
  if(Math.floor(before*14)!==Math.floor(S.stir*14)) sStir(); render(); if(S.stir>=1) slimeDone(); }
function stirTap(){ if(!S.act||S.set>=1) return; unglow(); var last=0; busy=true; var g=gen;
  tw(380,function(u){ var e=ease(u)*Math.PI*.75; addStir(e-last); last=e; },function(){ if(g===gen&&S.step==="mix") busy=false; }); }
function slimeDone(){ S.step="done-mix"; busy=true; sSlime(); sparkles(CX,BASE-70,10); var g=gen; S.swirl=0;
  setTimeout(function(){ if(g!==gen) return; busy=false; next(); },700); }

/* ---------- stretch, then serve ---------- */
function topY(){ return BASE-(18+58)+6; }
function pullTo(x,y){ var top=topY(), dx=x-CX, dy=Math.min(y,top-4)-top, d=Math.sqrt(dx*dx+dy*dy), M=150;
  if(d>M){ dx*=M/d; dy*=M/d; d=M; } S.pull=[CX+dx,top+dy]; render(); return d; }
function release(d){ var p0=S.pull.slice(), top=topY(), g=gen; if(d>70){ S.stretch++; } sBoing(); busy=true;
  tw(560,function(u){ var k=Math.exp(-5*u)*Math.cos(u*13); S.pull=[CX+(p0[0]-CX)*k,top+(p0[1]-top)*k]; if(u>=1) S.pull=null; render(); },function(){ S.pull=null; render(); busy=false; if(g!==gen) return; afterStretch(d>70); }); }
function afterStretch(counted){ if(!counted){ msg("Pull it higher!"); return; }
  if(S.stretch>=3){ var b=document.querySelector('[data-k="serve"]'); if(b&&b.disabled){ b.disabled=false; unglow(); glow("serve"); msg("So stretchy! Tap Serve."); talk(SAY.ready); } else msg("Wheee! Tap Serve when you're ready."); }
  else msg(["","Stretch! One more time…","Stretchy! Once more!"][S.stretch]||""); }
function stretchTap(){ if(S.step!=="stretch"||busy) return; unglow(); busy=true; var g=gen, x=CX+(Math.random()*60-30);
  tw(420,function(u){ var e=ease(u), d=pullTo(x,topY()-e*130); if(Math.random()<.3) sSqueak(e); },function(){ if(g!==gen) return; busy=false; release(130); }); }
function serve(){ if(S.step!=="stretch"||S.stretch<3||busy) return; unglow(); busy=true; sServe(); S.step="served"; steps();
  var c=mixRGB(S.c), o=O(), g=gen, j=el("g",{});
  j.innerHTML='<rect x="-17" y="-48" width="34" height="9" rx="3" fill="#b98b5a" stroke="#7a5530"/><rect x="-21" y="-40" width="42" height="40" rx="9" fill="rgba(210,235,255,.35)" stroke="rgba(235,248,255,.85)" stroke-width="1.5"/>'+
    '<path d="M-19 -20Q0 -28 19 -20V-6Q19 -2 15 -2H-15Q-19 -2 -19 -6Z" fill="'+hex(c)+'"/>'+(o.glit?speck(-8,-12,1.2,glitCol(o.glit,1))+speck(6,-9,1,glitCol(o.glit,2))+speck(10,-16,1,glitCol(o.glit,3)):"")+
    (o.bits.length?bitArt(o.bits[0],-2,-10,1,1,1):"")+'<path d="M-15 -34v24" stroke="#fff" stroke-opacity=".6" stroke-width="3" stroke-linecap="round"/><rect x="-13" y="-36" width="26" height="9" rx="2" fill="#fff8ec"/><text x="0" y="-29.5" font-size="6.5" text-anchor="middle" font-weight="800" fill="#8a4fb8" font-family="Outfit,system-ui,sans-serif">Sophie\'s</text>';
  tw(500,function(u){ var e=ease(u); S.set=1; gC.setAttribute("opacity",(1-e).toFixed(2)); j.setAttribute("transform","translate(200 "+(205-e*10).toFixed(1)+") scale("+(.4+e*.6).toFixed(2)+")"); },function(){
    tw(650,function(u){ var e=ease(u); j.setAttribute("transform","translate("+(200+e*118).toFixed(1)+" "+(195+e*24).toFixed(1)+") scale("+(1-e*.25).toFixed(2)+")"); },function(){
      if(g!==gen) return; hearts(); msg(o.cust.short+" loves it! Thank you, Sophie's Slime Lab!"); talk(SAY.thanks);
      setTimeout(function(){ if(g!==gen) return; j.remove(); gC.setAttribute("opacity","1"); gCust.innerHTML=""; busy=false; done(); },1900); }); }); }
function hearts(){ for(var k=0;k<6;k++){ (function(k){ var h=el("path",{d:heartPath(0,0,6),fill:k%2?"#ff5f9e":"#ff8fc4"}), x=340+(k-2.5)*9;
  setTimeout(function(){ tw(1300,function(u){ h.setAttribute("transform","translate("+(x+Math.sin(u*6+k)*6).toFixed(1)+" "+(185-u*110).toFixed(1)+") scale("+(.6+u*.5).toFixed(2)+")"); h.setAttribute("opacity",(1-u*u).toFixed(2)); },function(){ h.remove(); }); },k*120); })(k); } }

function next(){ var o=O(), i=o.steps.indexOf(S.step==="done-mix"?"mix":S.step); go(o.steps[i+1]); }
function done(){
  if(P.bonus){ var fresh=BWG.patch("slime"); ST.n++; save(); finish(fresh,true); return; }
  if(P.i<2){ P.i++; saveCur(); var g=gen; ST.n++; save(); render(); order(); return; }
  P.done=true; ST.n++; saveCur(); var fresh2=BWG.patch("slime"); save(); finish(fresh2,false); }
function starsOf(h){ return h===0?3:h<=2?2:1; }
function finish(fresh,bonus){ sWin(); var g=gen, s=starsOf(P.hints), names=P.orders.map(function(o){ return o.cust.short; });
  setTimeout(function(){ if(g!==gen) return;
    var box=BWK.sheet('<h2>'+(bonus?'Order done!':'All orders done!')+'</h2>'+BWG.patchLine(fresh)+'<div class="stars">'+"★★★".slice(0,s)+'<i>'+"★★★".slice(0,3-s)+'</i></div>'+
      '<p>'+(bonus?'You made '+P.orders[0].col.n+' slime for '+names[0]:'You made slime for '+names[0]+', '+names[1]+' and '+names[2])+(P.hints?', with '+P.hints+' hint'+(P.hints>1?'s':''):', with no hints')+'.</p>'+
      '<p>'+(bonus?'Another customer is waiting!':'Come back tomorrow for new orders.')+'</p>'+
      '<div class="k-row"><button class="k-btn" data-a="more">Bonus Order</button><button class="k-btn k-ghost" data-a="out">The Outpost</button></div>');
    box.querySelector('[data-a=more]').onclick=function(){ BWK.closeSheet(true); start(true); };
    box.querySelector('[data-a=out]').onclick=BWG.toOutpost;
    talk(fresh?SAY.winp:bonus?SAY.bdone:SAY.win);
  },700); }

/* ---------- dragging on the bench: stir, stretch ---------- */
var drag=null;
function pt(ev){ var p=svg.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY; var m=svg.getScreenCTM(); return m?p.matrixTransform(m.inverse()):{x:0,y:0}; }
$("#bench").addEventListener("pointerdown",function(ev){ if(!S||busy||!svg) return; var q=pt(ev);
  if(S.step==="mix"&&S.act&&S.set<1){ drag={m:"stir",a:Math.atan2((q.y-SURF)*3.5,q.x-CX)}; }
  else if(S.step==="stretch"){ drag={m:"pull",d:0,sq:0}; unglow(); drag.d=pullTo(q.x,q.y); }
  else if(S.step==="mix"&&!S.act){ msg("Squeeze in the activator first!"); glow("act"); return; }
  else return;
  try{ $("#bench").setPointerCapture(ev.pointerId); }catch(e){} ev.preventDefault(); });
$("#bench").addEventListener("pointermove",function(ev){ if(!drag) return; var q=pt(ev);
  if(drag.m==="stir"){ var a=Math.atan2((q.y-SURF)*3.5,q.x-CX), da=a-drag.a; if(da>Math.PI) da-=Math.PI*2; if(da<-Math.PI) da+=Math.PI*2; drag.a=a; unglow(); addStir(Math.min(Math.abs(da),1)); if(S.set>=1) drag=null; }
  else { drag.d=pullTo(q.x,q.y); if(++drag.sq%4===0) sSqueak(Math.min(1,drag.d/150)); } });
function endDrag(){ if(!drag) return; var d=drag; drag=null; if(d.m==="pull"&&S&&S.pull) release(d.d); }
$("#bench").addEventListener("pointerup",endDrag); $("#bench").addEventListener("pointercancel",endDrag);

/* ---------- keys on a computer: 1-5 tap the tray, H hint ---------- */
document.addEventListener("keydown",function(e){ if(!document.body.classList.contains("m-play")||document.querySelector(".k-veil.on")) return;
  if(e.key>="1"&&e.key<="5"){ var b=document.querySelectorAll("#tbox .ing")[+e.key-1]; if(b&&!b.disabled) b.click(); }
  else if(e.key==="h"||e.key==="H") hint(); });

/* ---------- menu ---------- */
(function(){ var c1=mixRGB([1,0,1,1]), c2=mixRGB([0,1,2,1]), s='<defs>'+'<radialGradient id="emA" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="'+shade(c1,.45)+'"/><stop offset="1" stop-color="'+shade(c1,-.25)+'"/></radialGradient>'+
  '<radialGradient id="emB" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="'+shade(c2,.45)+'"/><stop offset="1" stop-color="'+shade(c2,-.25)+'"/></radialGradient></defs>'+
  '<rect x="30" y="10" width="34" height="9" rx="3" fill="#b98b5a" stroke="#7a5530"/><rect x="25" y="19" width="44" height="64" rx="11" fill="rgba(210,235,255,.25)" stroke="rgba(235,248,255,.85)" stroke-width="1.6"/>'+
  '<path d="M27 46Q47 38 67 46V72Q67 81 58 81H36Q27 81 27 72Z" fill="url(#emA)"/>';
  for(var k=0;k<12;k++) s+=speck(33+((k*29)%28),50+((k*17)%26),1.1,glitCol("gold",k));
  s+='<path d="M32 26v48" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>'+
   '<path d="M78 84C72 84 72 76 78 73C77 62 88 52 98 55C109 53 119 62 116 73C122 76 121 84 115 84Z" fill="url(#emB)"/><ellipse cx="91" cy="63" rx="7" ry="3.5" fill="#fff" opacity=".5" transform="rotate(-25 91 63)"/>'+
   bitArt("hearts",104,72,1.3,0,0)+bitArt("stars",88,76,1.1,0,0)+bitArt("beads",99,80,1,0,1);
  $("#slEmb").innerHTML=s; })();
function toMenu(){ gen++; busy=false; drag=null; document.body.className="m-menu"; var t=today();
  var doneToday=ST.day===t.n&&ST.cur&&ST.cur.done;
  $("#bPlay").textContent=doneToday?"Today's Orders ✓":"Today's Orders";
  $("#bBonus").style.display=doneToday?"":"none"; $("#bPlay").classList.toggle("k-ghost",!!doneToday);
  $("#mfoot").textContent=(ST.n?("Slimes made: "+ST.n+". "):"")+DAYN[t.wd]+": "+FOOT[lvOf(t.wd)]; }
$("#bPlay").onclick=function(){ BWK.sfx("open"); start(false); };
$("#bBonus").onclick=function(){ BWK.sfx("open"); start(true); };
$("#bHow").onclick=function(){ var sw=function(k){ return '<span class="sw" style="background:'+DROP[k].c+'"></span>'; };
  BWK.sheet('<div class="how"><h2>How to Play</h2><p>'+INTRO+'</p><p>'+HOW+'</p>'+
   '<p><b>Mixing tips:</b> '+sw(0)+' red + '+sw(1)+' yellow = orange. '+sw(1)+' yellow + '+sw(2)+' blue = green. '+sw(0)+' red + '+sw(2)+' blue = purple. '+sw(3)+' White makes any color lighter. Two drops of one color and one of another leans toward the first.</p>'+
   '<p>Making real slime at home? Ask a grown-up to help.</p><p>On a computer, press 1-5 to use the shelf, H for a hint.</p></div>'); talk(HOW); };
$("#bBack").onclick=BWG.toOutpost;
$("#tMenu").onclick=function(){ BWK.sfx("tap"); toMenu(); };
$("#tHint").onclick=hint;

var INTRO="Sophie's Slime Lab! Sophie makes slime for her animal friends. Mix the colors, add sparkle and fun bits, then stir, stretch and serve.";
var HOW="Each order card shows the slime to make. Tap the color drops until your slime matches the order color. Then add the glitter and fun bits on the card. Squeeze in the activator, stir by dragging around the bowl, then pull the slime up to stretch it, and serve! Stuck on a color? Tap Hint for Sophie's tip.";
var SAY={color:"Tap the color drops until your slime matches the order card.",sparkle:"Now add the sparkle!",bits:"Time for the fun bits!",
  act:"Squeeze in the activator. It turns glue into slime!",stir:"Now stir, stir, stir!",stretch:"It's slime! Pull it up to stretch it.",ready:"So stretchy! Tap Serve.",
  thanks:"Thank you! I love it!",hint:"Here's Sophie's tip!",full:"The bowl is full! Tap Pour out to start the color again.",nope:"Oops! That's not on the card.",
  more0:"Close! It needs more red.",more1:"Close! It needs more yellow.",more2:"Close! It needs more blue.",more3:"Close! It needs more white.",
  win:"All orders done! Come back tomorrow for new orders.",winp:"All done! You earned a new patch for your badge wall!",bdone:"Order done! Another customer is waiting!"};
var L={"sl-intro":INTRO,"sl-how":HOW};
for(var k in SAY) L["sl-"+k]=SAY[k];
CUST.forEach(function(c){ L["sl-c-"+c.id]=c.n+" has an order!"; });
var seen={}; COLS.forEach(function(t){ t.forEach(function(c){ if(!seen[c.id]){ seen[c.id]=1; L["sl-col-"+c.id]=c.n+"! Perfect match!"; } }); });
DROP.forEach(function(d){ L["sl-d-"+d.n.toLowerCase()]=d.n; });
GLIT.forEach(function(g){ L["sl-g-"+g.id]=g.n; }); BITS.forEach(function(b){ L["sl-b-"+b.id]=b.n; });
BWK.lines(L);
toMenu();
BWK.init({here:"slime", voice:"outpost", intro:INTRO, noHello:true});
window.SLO={start:start,hint:hint,drop:function(k){ addDrop(k); },pour:function(){ pourOut(document.querySelector('.ing[data-k="pour"]')); },
  tap:function(k){ var b=document.querySelector('.ing[data-k="'+k+'"]'); if(b&&!b.disabled) b.click(); },
  stir:function(){ addStir(Math.PI*2*2.6); }, stretch:function(){ S.stretch=2; stretchTap(); },
  solveColor:function(){ var d=O().col.d; S.c=d.slice(); render(); checkColor(); },
  orders:makeOrders, mix:mixRGB, cols:COLS, lines:L,
  state:function(){ return P&&{i:P.i,hints:P.hints,done:P.done,lv:P.lv,bonus:P.bonus,order:S&&{col:O().col.id,d:O().col.d,glit:O().glit,bits:O().bits,steps:O().steps},s:S&&{c:S.c,step:S.step,stir:S.stir,set:S.set,stretch:S.stretch,glit:S.glit,bits:S.bits},busy:busy}; }};
})();
</script>
