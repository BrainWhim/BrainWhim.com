<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shut the Box: Board Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(15,23,42,.72);
  --gold:#e7c77a;
  --ink:#f3ead8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:#120c07;overflow-x:hidden}
.bg{position:fixed;inset:-40px;background:url("shutbox-tavern.jpg") center/cover;filter:blur(18px) brightness(.55) saturate(1.1);z-index:-2}
.bg::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 100%);z-index:-1}

header{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 16px 4px}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.designs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(15,23,42,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px}
.designs button{font:600 13px Montserrat,sans-serif;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:9px 14px;cursor:pointer}
.designs button:hover{background:rgba(255,255,255,.08)}
.designs button.on{background:rgba(255,255,255,.18);border-color:rgba(231,199,122,.55);color:#fff}

.stage{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.scaler{transform-origin:top center}
.scene{width:1000px;height:660px;perspective:2100px;perspective-origin:50% 20%;position:relative}
/* ---------- the box ---------- */
.box{position:absolute;left:50px;top:40px;width:900px;height:560px;transform-style:preserve-3d;transform:rotateX(46deg)}
.box *{transform-style:preserve-3d}
.plane{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tableshadow{position:absolute;left:-30px;top:-10px;width:960px;height:610px;transform:translateZ(-79px);background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.65),rgba(0,0,0,0) 70%);filter:blur(14px)}
.wood-h{background-image:var(--wood-h);background-size:1200px 600px;background-repeat:no-repeat}
.wood-v{background-image:var(--wood-v);background-size:600px 1200px;background-repeat:no-repeat}
.felt{left:36px;top:36px;width:828px;height:488px;transform:translateZ(-44px);background-image:var(--felt-tex);background-size:256px 256px;background-color:var(--felt)}
.felt::after{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 80% at 42% 60%,rgba(255,220,160,.10),rgba(0,0,0,0) 60%),
  linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0) 12%),
  linear-gradient(to right,rgba(0,0,0,.45),rgba(0,0,0,0) 6%,rgba(0,0,0,0) 94%,rgba(0,0,0,.35)),
  linear-gradient(to top,rgba(0,0,0,.35),rgba(0,0,0,0) 8%)}
/* rim tops */
.rim{box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);transform:translateZ(1px)}
.rim::after{content:"";position:absolute;inset:0}
.rim.t{left:0;top:0;width:900px;height:36px;background-position:0 0}
.rim.t::after{background:linear-gradient(to bottom,rgba(255,235,200,.22),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 75%,rgba(0,0,0,.35))}
.rim.b{top:524px;width:450px;height:36px;box-shadow:inset 0 1px 0 rgba(0,0,0,.25),inset 0 -1px 0 rgba(0,0,0,.25)!important}.rim.b1{left:0;background-position:-150px -300px}.rim.b2{left:450px;background-position:-600px -300px}
.rim.b::after{background:linear-gradient(to bottom,rgba(255,235,200,.28),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 80%,rgba(0,0,0,.25))}
.rim.l{left:0;top:36px;width:36px;height:488px;background-position:-60px 0}
.rim.l::after{background:linear-gradient(to right,rgba(255,235,200,.22),rgba(0,0,0,0) 35%,rgba(0,0,0,.3))}
.rim.r{left:864px;top:36px;width:36px;height:488px;background-position:-300px -200px}
.rim.r::after{background:linear-gradient(to right,rgba(255,235,200,.15),rgba(0,0,0,0) 50%,rgba(0,0,0,.35))}
/* inner walls */
.wall{overflow:hidden}
.wall::after{content:"";position:absolute;inset:0}
.wall.ib{left:36px;top:36px;width:828px;height:14px;transform-origin:top;transform:rotateX(-90deg);background-position:-100px -40px}
.wall.ib::after{background:rgba(0,0,0,.35)}
.wall.il{left:36px;top:36px;width:44px;height:488px;transform-origin:left;transform:rotateY(90deg);background-position:-20px -100px}
.wall.il::after{background:linear-gradient(to right,rgba(0,0,0,.25),rgba(0,0,0,.6))}
.wall.ir{left:820px;top:36px;width:44px;height:488px;transform-origin:right;transform:rotateY(-90deg);background-position:-140px -300px}
.wall.ir::after{background:linear-gradient(to left,rgba(255,220,170,.08),rgba(0,0,0,.35))}
/* outer walls */
.wall.of{top:560px;width:450px;height:78px;transform-origin:top;transform:rotateX(-90deg)}.wall.of1{left:0;background-position:-200px -120px}.wall.of2{left:450px;background-position:-650px -120px}
.wall.of::after{background:linear-gradient(to bottom,rgba(255,230,190,.12),rgba(0,0,0,.25) 70%,rgba(0,0,0,.5))}
.wall.ol{left:-78px;top:0;width:78px;height:560px;transform-origin:right;transform:rotateY(-90deg);background-position:-10px -320px}
.wall.ol::after{background:rgba(255,230,190,.06)}
.wall.or{left:900px;top:0;width:78px;height:560px;transform-origin:left;transform:rotateY(90deg);background-position:-200px -10px}
.wall.or::after{background:rgba(0,0,0,.55)}
/* shelf */
.shelf{left:36px;top:36px;width:828px;height:150px;transform:translateZ(-14px);background-position:-250px -60px}
.shelf::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,.05) 30%,rgba(255,230,190,.06) 85%,rgba(0,0,0,.2))}
.shelf .eng{position:absolute;z-index:1;top:58px;font:700 30px "Cormorant Garamond",serif;color:rgba(0,0,0,.42);text-shadow:0 1px 0 rgba(255,235,200,.18);width:84px;text-align:center}
.wall.sf{left:36px;top:186px;width:828px;height:30px;transform-origin:top;transform:translateZ(-14px) rotateX(-90deg);background-position:-300px -20px}
.wall.sf::after{background:linear-gradient(to bottom,rgba(255,230,190,.12),rgba(0,0,0,.35))}
.rod{left:40px;top:50px;width:820px;height:7px;transform:translateZ(-9px);border-radius:4px;background:linear-gradient(to bottom,#7a5a26,#f5dc9a 35%,#b88d3e 60%,#5a3f17);box-shadow:0 3px 4px rgba(0,0,0,.5)}
/* brass */
.brass{background:linear-gradient(135deg,#6e4f1d 0%,#e9cf86 28%,#fff2c4 40%,#c49a45 58%,#7b5a22 100%)}
.cap{width:44px;height:44px;transform:translateZ(2.2px);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,240,200,.35)}
.cap::before,.cap::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3cc,#8a6526 70%);box-shadow:0 1px 1px rgba(0,0,0,.5)}
.cap::before{left:9px;top:9px}.cap::after{right:9px;bottom:9px}
.cap.c1{left:-4px;top:-4px}.cap.c2{left:860px;top:-4px}.cap.c3{left:-4px;top:520px}.cap.c4{left:860px;top:520px}
.plaque{left:350px;top:574px;width:200px;height:40px;transform-origin:top;border-radius:3px;display:flex;align-items:center;justify-content:center;font:700 13px Montserrat,sans-serif;letter-spacing:.42em;padding-left:.42em;color:rgba(70,45,10,.85);text-shadow:0 1px 0 rgba(255,240,200,.6);box-shadow:0 2px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,240,200,.4)}
/* tiles */
.tile{position:absolute;top:-61px;width:84px;height:118px;transform-origin:50% 100%;transform:translateZ(-14px) rotateX(-90deg);transition:transform .55s cubic-bezier(.5,.05,.55,1.08);cursor:pointer}
.tile.sel{transform:translateZ(-14px) rotateX(-68deg)}
.tile.shut{transform:translateZ(-14px) rotateX(-180deg);cursor:default}
.tile .f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.tile .front,.tile .back{inset:0;border-radius:4px}
.tile .front{background:var(--tile-bg);background-size:256px 256px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 -14px 18px -10px rgba(0,0,0,.35),inset 0 10px 14px -10px rgba(255,255,255,.35)}
.tile .front::after{content:"";position:absolute;inset:0;border-radius:4px;transition:box-shadow .3s,background .3s}
.tile.play .front::after{box-shadow:inset 0 0 0 3px rgba(214,164,62,.95),inset 0 0 20px 2px rgba(240,190,90,.55);animation:pulse 1.8s ease-in-out infinite}
.tile.sel .front::after{box-shadow:inset 0 0 0 4px #e9b949,inset 0 0 26px 6px rgba(250,205,110,.75);animation:none;background:rgba(255,215,130,.16)}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px rgba(214,164,62,.55),inset 0 0 10px 1px rgba(240,190,90,.25)}}
.pool{position:absolute;top:18px;width:120px;height:110px;margin-left:-18px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,rgba(255,214,120,.75),rgba(255,190,90,.25) 45%,rgba(255,190,90,0) 70%);z-index:1;opacity:0;transition:opacity .35s;pointer-events:none}
.pool.on{opacity:1;animation:poolp 1.8s ease-in-out infinite}
.pool.sel{opacity:1;animation:none;filter:brightness(1.3)}
@keyframes poolp{50%{opacity:.55}}
.inlay{position:absolute;pointer-events:none;transform:translateZ(1.6px);background:linear-gradient(90deg,#8a6526,#f3d790 30%,#b8913f 60%,#f3d790 85%,#8a6526);box-shadow:0 0 1px rgba(0,0,0,.6)}
.tile .back{transform:translateZ(-12px) rotateY(180deg);background:var(--tile-bg);background-size:256px 256px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 18px rgba(0,0,0,.25)}
.tile .back::after{content:"";position:absolute;left:14px;right:14px;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.18);box-shadow:0 1px 0 rgba(255,255,255,.15)}
.tile .top{left:0;top:0;width:84px;height:12px;transform-origin:top;transform:translateZ(-12px) rotateX(90deg);background:var(--tile-bg);filter:brightness(1.12)}
.tile .sl{left:0;top:0;width:12px;height:118px;transform-origin:left;transform:translateZ(-12px) rotateY(-90deg);background:var(--tile-bg);filter:brightness(.7)}
.tile .sr{left:72px;top:0;width:12px;height:118px;transform-origin:right;transform:translateZ(-12px) rotateY(90deg);background:var(--tile-bg);filter:brightness(.55)}
.num{font:700 64px/1 "Cormorant Garamond",serif;position:relative;top:-2px}
.num.carved{color:var(--num);text-shadow:0 1px 0 rgba(255,255,255,.55),0 -1px 0 rgba(0,0,0,.35)}
.num.gilt{background:linear-gradient(170deg,#fff1bf 0%,#e2bd62 35%,#9c7326 60%,#f3d68b 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.8))}
/* dice */
.die{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px}
.die.roll{transition:transform 1.25s cubic-bezier(.12,.62,.22,1)}
.die .d{position:absolute;inset:0;border-radius:11px;background:var(--die);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset -4px -6px 10px rgba(0,0,0,.18),inset 4px 5px 8px rgba(255,255,255,.35)}
.die .core{position:absolute;inset:2px;background:var(--die-core);border-radius:6px}
.die .core.c2{transform:rotateY(90deg)}.die .core.c3{transform:rotateX(90deg)}
.d i{width:10px;height:10px;border-radius:50%;margin:auto;background:radial-gradient(circle at 60% 65%,var(--pip) 40%,var(--pip2) 100%);box-shadow:inset 0 2px 2px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.4);visibility:hidden}
.d i.p{visibility:visible}
.dshadow{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.6),rgba(0,0,0,0) 68%);filter:blur(3px)}
.dshadow.roll{transition:transform 1.25s cubic-bezier(.12,.62,.22,1)}

/* controls */
.bar{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 auto;padding:10px 12px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:12px;width:min(640px,calc(100% - 32px))}
.status{flex:1 1 220px;font-size:14px;line-height:1.35;min-height:2.7em;display:flex;flex-direction:column;justify-content:center}
.status b{color:var(--gold);font-weight:600}
.btn{font:600 14px Montserrat,sans-serif;border-radius:6px;padding:11px 18px;cursor:pointer;border:1px solid rgba(231,199,122,.45);background:rgba(30,41,59,.85);color:var(--gold)}
.btn:hover{background:rgba(51,65,85,.9)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(255,255,255,.2)}
.note{max-width:640px;margin:12px auto 24px;padding:0 16px;text-align:center;font-size:12.5px;line-height:1.5;color:rgba(243,234,216,.75)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);background:rgba(10,6,3,.6);z-index:10;transition:opacity .4s}
.loading.gone{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.tile,.die.roll,.dshadow.roll{transition-duration:.01s}.tile.play .front::after{animation:none}}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <div class="label">Shut the Box · Board Preview</div>
  <div class="designs" id="designs">
    <button data-d="oak" class="on">Tavern Oak</button>
    <button data-d="walnut">Walnut &amp; Navy</button>
    <button data-d="mahogany">Mahogany &amp; Claret</button>
  </div>
</header>

<div class="stage" id="stage">
  <div class="scaler" id="scaler">
    <div class="scene">
      <div class="box" id="box">
        <div class="plane tableshadow"></div>
        <div class="plane wall of of1 wood-h"></div><div class="plane wall of of2 wood-h"></div>
        <div class="plane wall ol wood-v"></div>
        <div class="plane wall or wood-v"></div>
        <div class="plane plaque brass" style="transform:rotateX(-90deg) translateZ(1px) translateY(-14px)">BRAINWHIM</div>
        <div class="plane felt"></div>
        <div class="plane wall il wood-v"></div>
        <div class="plane wall ir wood-v"></div>
        <div class="plane wall sf wood-h"></div>
        <div class="plane shelf wood-h" id="shelf"></div>
        <div class="plane wall ib wood-h"></div>
        <div class="plane rod"></div>
        <div id="tiles" style="position:absolute;left:0;top:0"></div>
        <div id="dice" style="position:absolute;left:0;top:0"></div>
        <div class="plane rim t wood-h"></div>
        <div class="plane rim b b1 wood-h"></div><div class="plane rim b b2 wood-h"></div>
        <div class="plane rim l wood-v"></div>
        <div class="plane rim r wood-v"></div>
        <div class="plane inlay" style="left:30px;top:30px;width:840px;height:2px"></div><div class="plane inlay" style="left:30px;top:528px;width:420px;height:2px"></div><div class="plane inlay" style="left:450px;top:528px;width:420px;height:2px"></div><div class="plane inlay" style="left:30px;top:30px;width:2px;height:500px"></div><div class="plane inlay" style="left:868px;top:30px;width:2px;height:500px"></div>
        <div class="plane cap c1 brass"></div><div class="plane cap c2 brass"></div>
        <div class="plane cap c3 brass"></div><div class="plane cap c4 brass"></div>
      </div>

  </div>
</div>

<div class="bar">
  <div class="status" id="status"></div>
  <button class="btn" id="roll">Roll Dice</button>
  <button class="btn ghost" id="roll1" hidden>Roll One</button>
  <button class="btn ghost" id="newgame">New Game</button>
</div>
<p class="note">Preview only. Roll, then tap tiles that add up to the dice; the glowing tiles are your open moves. Pick a design, or mix parts (for example, the walnut box with the green felt).</p>
<div class="loading" id="loading">Setting the table…</div>

<script>
/* ===== procedural materials (no image files) ===== */
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function noise2(seed){
  const r=rng(seed),P=new Uint16Array(512),G=new Float32Array(256);
  const p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
  for(let i=0;i<512;i++)P[i]=p[i&255];for(let i=0;i<256;i++)G[i]=r();
  const f=t=>t*t*(3-2*t);
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=f(xf),v=f(yf),X=xi&255,Y=yi&255;
    const a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
}
function fbm(n,x,y,o){let s=0,a=.5,t=0;for(let i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5}return s/t}
const mix=(a,b,t)=>a+(b-a)*t;
/* wood: grain runs along x */
function wood(w,h,o){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),im=g.createImageData(w,h),D=im.data;
  const n=noise2(o.seed),n2=noise2(o.seed+77),r=rng(o.seed+5);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const warp=fbm(n,x/o.wx,y/o.wy,4);
    let v=(y*o.freq+warp*o.turb);v=v-Math.floor(v);
    let ring=Math.pow(Math.abs(Math.sin(v*Math.PI)),o.sharp); // 0 at ring line
    const streak=fbm(n2,x/180,y/1.6,3);
    let t=(1-ring)*o.ringAmt+streak*o.streakAmt+(o.fig?Math.max(0,Math.sin(x/o.fig+warp*6))*.18:0);
    t=Math.min(1,Math.max(0,t));
    const i=(y*w+x)*4;let k=1;
    if(r()<o.pores)k=.78;
    const lum=1+(fbm(n2,x/400,y/90,2)-.5)*o.blotch;
    D[i]=mix(o.light[0],o.dark[0],t)*k*lum;D[i+1]=mix(o.light[1],o.dark[1],t)*k*lum;D[i+2]=mix(o.light[2],o.dark[2],t)*k*lum;D[i+3]=255}
  g.putImageData(im,0,0);return c}
function rot(c){const d=document.createElement('canvas');d.width=c.height;d.height=c.width;const g=d.getContext('2d');g.translate(d.width,0);g.rotate(Math.PI/2);g.drawImage(c,0,0);return d}
function felt(rgb,seed){
  const w=256,c=document.createElement('canvas');c.width=c.height=w;const g=c.getContext('2d'),im=g.createImageData(w,w),D=im.data,r=rng(seed),n=noise2(seed);
  for(let y=0;y<w;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;
    const k=.86+r()*.22+(fbm(n,x/22,y/22,3)-.5)*.14;D[i]=rgb[0]*k;D[i+1]=rgb[1]*k;D[i+2]=rgb[2]*k;D[i+3]=255}
  g.putImageData(im,0,0);return c.toDataURL('image/jpeg',.9)}
const url=c=>`url(${c.toDataURL('image/jpeg',.88)})`;

const DESIGNS={
  oak:{
    wood:{light:[178,128,78],dark:[96,58,28],freq:.055,turb:7,wx:260,wy:26,sharp:.55,ringAmt:.62,streakAmt:.45,pores:.035,blotch:.35,seed:11},
    felt:[30,74,46],tile:{light:[244,233,208],dark:[214,196,160],freq:.02,turb:3,wx:300,wy:60,sharp:.9,ringAmt:.25,streakAmt:.35,pores:0,blotch:.12,seed:5},
    num:'carved',numColor:'#2a1c12',die:'linear-gradient(145deg,#fbf3e0,#e6d6b2)',dieCore:'#eadcbc',pip:'#1d140d',pip2:'#4a3626'},
  walnut:{
    wood:{light:[120,80,50],dark:[52,31,18],freq:.04,turb:9,wx:220,wy:20,sharp:.7,ringAmt:.7,streakAmt:.4,pores:.02,blotch:.3,seed:23,fig:40},
    felt:[24,38,70],tile:{light:[226,192,140],dark:[180,138,88],freq:.05,turb:6,wx:200,wy:30,sharp:.6,ringAmt:.45,streakAmt:.4,pores:.01,blotch:.15,seed:9},
    num:'carved',numColor:'#3a2416',die:'linear-gradient(145deg,#fbf6ea,#e4dccb)',dieCore:'#e8e0cf',pip:'#18264a',pip2:'#33476f'},
  mahogany:{
    wood:{light:[150,62,38],dark:[70,22,12],freq:.035,turb:5,wx:420,wy:30,sharp:.9,ringAmt:.32,streakAmt:.5,pores:.012,blotch:.3,seed:41,fig:26},
    felt:[92,20,34],tile:{light:[54,42,34],dark:[18,13,10],freq:.07,turb:4,wx:300,wy:30,sharp:.7,ringAmt:.5,streakAmt:.5,pores:0,blotch:.2,seed:3},
    num:'gilt',numColor:'',die:'linear-gradient(145deg,#2c2420,#0f0b09)',dieCore:'#16110e',pip:'#f0d28a',pip2:'#9b7430'},
};
const cache={};
function buildDesign(k){
  if(cache[k])return cache[k];
  const d=DESIGNS[k],h=wood(1200,600,d.wood),t=wood(256,256,d.tile);
  return cache[k]={h:url(h),v:url(rot(h)),felt:felt(d.felt,k.length*31),tile:url(t)}
}
function applyDesign(k){
  const d=DESIGNS[k],m=buildDesign(k),b=document.getElementById('box').style;
  b.setProperty('--wood-h',m.h);b.setProperty('--wood-v',m.v);
  b.setProperty('--felt-tex',`url(${m.felt})`);b.setProperty('--felt',`rgb(${d.felt})`);
  b.setProperty('--tile-bg',m.tile);b.setProperty('--num',d.numColor);
  b.setProperty('--die',d.die);b.setProperty('--die-core',d.dieCore);b.setProperty('--pip',d.pip);b.setProperty('--pip2',d.pip2);
  document.querySelectorAll('.num').forEach(n=>n.className='num '+d.num);
  document.querySelectorAll('#designs button').forEach(x=>x.classList.toggle('on',x.dataset.d===k));
  try{localStorage.setItem('stb-preview',k)}catch(e){}
}

/* ===== build tiles, shelf numbers, dice ===== */
const R=36,GAP=7,TW=84,HINGE=54;
const tilesEl=document.getElementById('tiles'),shelf=document.getElementById('shelf');
const tiles=[],pools=[];
for(let n=1;n<=9;n++){
  const x=R+GAP+(n-1)*(TW+GAP+.2);
  const pl=document.createElement('div');pl.className='pool';pl.style.left=(x-R)+'px';shelf.appendChild(pl);pools[n]=pl;
  const e=document.createElement('div');e.className='eng';e.style.left=(x-R)+'px';e.textContent=n;shelf.appendChild(e);
  const t=document.createElement('div');t.className='tile';t.style.left=x+'px';t.style.top=(HINGE-118)+'px';
  t.innerHTML=`<div class="f front"><span class="num carved">${n}</span></div><div class="f back"></div><div class="f top"></div><div class="f sl"></div><div class="f sr"></div>`;
  t.onclick=()=>tap(n);tilesEl.appendChild(t);tiles[n]=t;
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FACE={1:'translateZ(29px)',6:'rotateY(180deg) translateZ(29px)',2:'rotateY(90deg) translateZ(29px)',5:'rotateY(-90deg) translateZ(29px)',3:'rotateX(90deg) translateZ(29px)',4:'rotateX(-90deg) translateZ(29px)'};
const UP={1:[0,0],6:[0,180],2:[0,-90],5:[0,90],3:[-90,0],4:[90,0]};
const diceEl=document.getElementById('dice'),dice=[];
for(let i=0;i<2;i++){
  const s=document.createElement('div');s.className='plane dshadow';diceEl.appendChild(s);
  const d=document.createElement('div');d.className='die';
  let h='<div class="core"></div><div class="core c2"></div><div class="core c3"></div>';
  for(const v of [1,2,3,4,5,6])h+=`<div class="d" style="transform:${FACE[v]}">${[...Array(9)].map((_,j)=>`<i class="${PIPS[v].includes(j)?'p':''}"></i>`).join('')}</div>`;
  d.innerHTML=h;diceEl.appendChild(d);dice.push({el:d,sh:s,rx:0,ry:0,rz:0,x:0,y:0});
}
function place(o,x,y,ax,ay,az,anim){
  o.el.classList.toggle('roll',anim);o.sh.classList.toggle('roll',anim);
  o.el.style.transform=`translate3d(${x}px,${y}px,${-44+29}px) rotateZ(${az}deg) rotateX(${ax}deg) rotateY(${ay}deg)`;
  o.sh.style.transform=`translate3d(${x+6}px,${y+8}px,-43px)`;
}
function hideDie(o){o.el.style.visibility=o.sh.style.visibility='hidden'}
function showDie(o){o.el.style.visibility=o.sh.style.visibility='visible'}

/* ===== game ===== */
let open,total,selected,rolling,over;
const $=id=>document.getElementById(id);
function sumOpen(){return [...open].reduce((a,b)=>a+b,0)}
function combos(target,arr){const out=[];(function go(i,s,acc){if(s===target){out.push(acc.slice());return}if(s>target)return;for(let j=i;j<arr.length;j++){acc.push(arr[j]);go(j+1,s+arr[j],acc);acc.pop()}})(0,0,[]);return out}
function playable(){
  if(!total)return new Set();
  const sel=[...selected],arr=[...open].sort((a,b)=>a-b);
  const ok=combos(total,arr).filter(c=>sel.every(s=>c.includes(s)));
  const set=new Set();ok.forEach(c=>c.forEach(n=>{if(!selected.has(n))set.add(n)}));return set;
}
function render(msg){
  const p=playable();
  for(let n=1;n<=9;n++){const t=tiles[n];
    t.classList.toggle('shut',!open.has(n));t.classList.toggle('sel',selected.has(n));
    t.classList.toggle('play',open.has(n)&&p.has(n)&&!rolling);pools[n].classList.toggle('on',open.has(n)&&p.has(n)&&!rolling);pools[n].classList.toggle('sel',selected.has(n));t.style.cursor=p.has(n)||selected.has(n)?'pointer':'default'}
  const canOne=!open.has(7)&&!open.has(8)&&!open.has(9);
  $('roll').disabled=rolling||over||total>0;$('roll1').hidden=!canOne||over;$('roll1').disabled=rolling||total>0;
  $('roll').textContent=canOne?'Roll Two':'Roll Dice';
  $('status').innerHTML=msg||'';
}
function newGame(){open=new Set([1,2,3,4,5,6,7,8,9]);selected=new Set();total=0;rolling=false;over=false;
  place(dice[0],610,400,0,0,-12,false);place(dice[1],690,430,-90,0,20,false);showDie(dice[0]);showDie(dice[1]);
  render('<span>Roll the dice to begin.</span><span>Open tiles add up to <b>45</b>.</span>')}
function roll(count){
  if(rolling||over||total)return;rolling=true;selected.clear();
  const vals=[];let sum=0;
  dice.forEach((o,i)=>{
    if(i>=count){hideDie(o);return}showDie(o);
    const v=1+Math.floor(Math.random()*6);vals.push(v);sum+=v;
    const sx=760+i*30,sy=470-i*10;place(o,sx,sy,o.rx,o.ry,o.rz,false);
    void o.el.offsetWidth;
    const [ax,ay]=UP[v];o.rx=ax+360*(2+Math.floor(Math.random()*2))*(Math.random()<.5?-1:1);o.ry=ay+360*(1+Math.floor(Math.random()*2));o.rz=(Math.random()<.5?-1:1)*(18+Math.random()*50);
    const tx=count===1?440:(330+i*170+Math.random()*60),ty=300+Math.random()*140;
    requestAnimationFrame(()=>place(o,tx,ty,o.rx,o.ry,o.rz,true));
  });
  render('<span>Rolling…</span>');
  setTimeout(()=>{rolling=false;total=sum;
    if(!playable().size){over=true;total=0;const s=sumOpen();
      render(`<span>You rolled <b>${sum}</b>. No tiles make ${sum}.</span><span>Round over. Your score: <b>${s}</b> (lower is better).</span>`);return}
    render(`<span>You rolled <b>${vals.join(' + ')}${vals.length>1?' = '+sum:''}</b>.</span><span>Tap tiles that add up to ${sum}.</span>`)},1300);
}
function tap(n){
  if(rolling||!total||!open.has(n))return;
  if(selected.has(n)){selected.delete(n);render(statusTxt());return}
  if(!playable().has(n))return;
  selected.add(n);
  const s=[...selected].reduce((a,b)=>a+b,0);
  if(s===total){
    render(statusTxt());
    setTimeout(()=>{selected.forEach(x=>open.delete(x));selected.clear();total=0;
      if(!open.size){over=true;render('<span><b>You shut the box!</b></span><span>A perfect round: score 0.</span>');return}
      render(`<span>Tiles shut. Open tiles add up to <b>${sumOpen()}</b>.</span><span>Roll again.</span>`)},420);
  }else render(statusTxt());
}
function statusTxt(){const s=[...selected].reduce((a,b)=>a+b,0);return `<span>You rolled <b>${total}</b>.</span><span>Chosen so far: ${s||'none'}${s?' of '+total:''}.</span>`}
$('roll').onclick=()=>roll((!open.has(7)&&!open.has(8)&&!open.has(9))?2:2);
$('roll1').onclick=()=>roll(1);
$('newgame').onclick=newGame;
document.querySelectorAll('#designs button').forEach(b=>b.onclick=()=>{$('loading').classList.remove('gone');setTimeout(()=>{applyDesign(b.dataset.d);$('loading').classList.add('gone')},30)});

/* ===== fit to screen ===== */
function fit(){
  const w=Math.min(window.innerWidth+20,1100);const s=Math.min(w/1000,1.1);
  const sc=$('scaler');sc.style.transform=`scale(${s})`;$('stage').style.height=(660*s)+'px';
}
window.addEventListener('resize',fit);fit();
let start='oak';try{start=localStorage.getItem('stb-preview')||'oak'}catch(e){}
if(!DESIGNS[start])start='oak';
setTimeout(()=>{applyDesign(start);newGame();$('loading').classList.add('gone')},30);
</script>
</body>
</html>
