<style>
/* ===== Mancala board: a carved board seen from straight above, painted in code (no picture files) =====
   The board turns on its side on portrait phones (your store at the bottom, The House's at the top),
   so the cups stay big enough to tap. Boards (the Boards card) each come with their own stones.
   The BW monogram is stamped small on the far rail. */
.mk-pad{width:100%;flex:none;display:flex;justify-content:center}
.mk-board{position:relative;width:var(--mk-w);height:calc(var(--mk-w) * .48);flex:none;box-sizing:border-box;padding:calc(var(--mk-w) * .058) calc(var(--mk-w) * .062);
  border-radius:calc(var(--mk-w) * .07);background:var(--mk-tex) center/cover,var(--mk-texc);
  box-shadow:0 2.4vmin 3.6vmin rgba(0,0,0,.5),0 calc(var(--mk-w) * .008) 0 var(--mk-edge),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 6px rgba(0,0,0,.3)}
.mk-board::before{content:"";position:absolute;inset:calc(var(--mk-w) * .008);border-radius:calc(var(--mk-w) * .062);border:calc(var(--mk-w) * .0022) solid var(--mk-inlay);pointer-events:none;opacity:.9}
.mk-mono{position:absolute;left:50%;top:calc(var(--mk-w) * .004);transform:translateX(-50%);display:flex;align-items:baseline;line-height:1.2;font-size:calc(var(--mk-w) * .017);pointer-events:none;z-index:1}
.mk-mono b,.mk-mono i{display:inline-block;color:var(--mk-monoc);text-shadow:0 1px 0 rgba(255,255,255,.3),0 -1px 0 rgba(0,0,0,.35)}
.mk-mono b{font:500 1em Montserrat,sans-serif;letter-spacing:-.02em}.mk-mono i{font:400 .76em Pacifico,cursive;font-style:normal;margin-left:.06em;padding:0 .14em 0 .02em}
.mk-wood{width:100%;height:100%;display:grid;grid-template-columns:1.35fr repeat(6,1fr) 1.35fr;grid-template-rows:1fr 1fr;gap:calc(var(--mk-w) * .014);
  padding:calc(var(--mk-w) * .02);border-radius:calc(var(--mk-w) * .056);box-sizing:border-box;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 30%),var(--mk-tex) center/cover,var(--mk-texc);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 1vmin 2vmin rgba(40,20,5,.3)}
/* cups: carved into the board, with a soft rim of light on the near lip */
.mk-cell{position:relative;border:0;margin:0;padding:8%;min-width:0;min-height:0;font:inherit;color:inherit;cursor:default;-webkit-tap-highlight-color:transparent;
  grid-column:var(--hc);grid-row:var(--hr);border-radius:50%;
  background:radial-gradient(ellipse 75% 75% at 50% 58%,rgba(0,0,0,0) 30%,rgba(0,0,0,var(--mk-cupdk)) 100%),var(--mk-cuptex) center/cover,var(--mk-texc);
  box-shadow:inset 0 calc(var(--mk-w) * .009) calc(var(--mk-w) * .014) rgba(30,14,4,.6),inset 0 -1px 2px rgba(255,255,255,.18),0 1px 0 rgba(255,255,255,.35),0 0 0 var(--mk-rimw) var(--mk-rim);
  display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;transition:box-shadow .2s,filter .2s}
.mk-store{border-radius:999px;padding:12% 10%}
.mk-cell.live:not(.mk-store)::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,240,190,.5),rgba(255,236,180,.14) 34%,rgba(255,236,180,0) 58%)}
.mk-cell.ok{cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,236,170,.95),0 0 1.6vmin rgba(255,214,110,.6),inset 0 calc(var(--mk-w) * .009) calc(var(--mk-w) * .014) rgba(30,14,4,.6)}
.mk-cell.ok:hover{filter:brightness(1.1)}
.mk-cell.flash{filter:brightness(1.22)}
.mk-cell.last{box-shadow:inset 0 0 0 2px rgba(255,255,255,.75),inset 0 calc(var(--mk-w) * .009) calc(var(--mk-w) * .014) rgba(30,14,4,.6),0 0 0 var(--mk-rimw) var(--mk-rim)}
.mk-n{position:absolute;font-size:calc(var(--mk-w) * .024);font-weight:700;color:var(--mk-numc);text-shadow:var(--mk-nums);line-height:1;z-index:1;pointer-events:none;white-space:nowrap}
/* the counts sit on the board just outside each cup: above the far row, below your row, beside each store */
.mk-cell[data-pos=far] .mk-n{left:50%;bottom:100%;transform:translate(-50%,calc(var(--mk-w) * -.027))}
.mk-cell[data-pos=near] .mk-n{left:50%;top:100%;transform:translate(-50%,calc(var(--mk-w) * .027))}
.mk-cell[data-pos=storeL] .mk-n{right:100%;top:50%;transform:translate(calc(var(--mk-w) * -.03),-50%);font-size:calc(var(--mk-w) * .03)}
.mk-cell[data-pos=storeR] .mk-n{left:100%;top:50%;transform:translate(calc(var(--mk-w) * .03),-50%);font-size:calc(var(--mk-w) * .03)}
.mk-gem{position:relative;width:var(--mk-gem);height:var(--mk-gem);border-radius:50%;flex:none;
  box-shadow:0 1px 2px rgba(0,0,0,.45),inset 1px 1px 2px rgba(255,255,255,.75),inset -1px -1px 2px rgba(0,0,0,.25)}
.mk-gem::after{content:"";position:absolute;left:22%;top:16%;width:30%;height:24%;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(.4px)}
.mk-gem.g0{background:radial-gradient(circle at 32% 28%,var(--a0) 0 18%,var(--b0) 45%,var(--c0))}
.mk-gem.g1{background:radial-gradient(circle at 32% 28%,var(--a1) 0 18%,var(--b1) 45%,var(--c1))}
.mk-gem.g2{background:radial-gradient(circle at 32% 28%,var(--a2) 0 18%,var(--b2) 45%,var(--c2))}
.mk-gem.g3{background:radial-gradient(circle at 32% 28%,var(--a3) 0 18%,var(--b3) 45%,var(--c3))}
.mk-more{font-size:calc(var(--mk-gem) * .95);font-weight:700;color:#fff3d6;text-shadow:0 1px 2px rgba(0,0,0,.6)}
/* board preview (mancala-preview.html opens this page with ?preview=1): a picker for all three boards */
.mk-pick{position:fixed;z-index:60;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px;border-radius:12px;
  background:rgba(15,23,42,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(231,199,122,.45);max-width:94vw}
.mk-pick button{font:600 13px Montserrat,sans-serif;color:#f3ead8;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px 12px;cursor:pointer}
@media (max-width:999px){.mk-pick{top:8px;flex-wrap:nowrap;gap:2px;padding:4px}.mk-pick button{font-size:11.5px;padding:7px 8px;white-space:nowrap}}
.mk-pick button.on{background:rgba(255,255,255,.18);border-color:rgba(231,199,122,.6);color:#fff}

/* sizes: desktop gets a wide hero board; portrait phones turn it on its side */
body.pk{--mk-w:min(calc(100vw - 2*var(--pk-side) - 90px),calc((100dvh - var(--pk-hdr) - var(--pk-sw) - 60px) * 2.08),1000px);--mk-gem:calc(var(--mk-w) * .02)}
body.pk .pk-stage{justify-content:center}
@media (max-width:999px){
  body.pk{--mk-w:min(calc(100vw - 16px),calc((100dvh - var(--pk-hdr) - var(--pk-bar) - 170px) * 2.08));--pk-size:var(--mk-w);--mk-gem:calc(var(--mk-w) * .022)}
}
@media (max-width:999px) and (orientation:portrait){
  body.pk{--mk-h:min(calc((100vw - 16px) * 1.66),calc(100dvh - var(--pk-hdr) - var(--pk-bar) - 170px));--mk-w:calc(var(--mk-h) / 1.66);--pk-size:var(--mk-w);--mk-gem:calc(var(--mk-w) * .05)}
  .mk-board{height:var(--mk-h);padding:calc(var(--mk-w) * .08) calc(var(--mk-w) * .13) calc(var(--mk-w) * .05);border-radius:calc(var(--mk-w) * .14)}
  .mk-n{font-size:calc(var(--mk-w) * .05)}
  .mk-cell[data-pos=near] .mk-n{left:auto;top:50%;right:100%;transform:translate(calc(var(--mk-w) * -.055),-50%)}
  .mk-cell[data-pos=far] .mk-n{left:100%;bottom:auto;top:50%;transform:translate(calc(var(--mk-w) * .055),-50%)}
  .mk-cell[data-pos=storeL] .mk-n,.mk-cell[data-pos=storeR] .mk-n{right:auto;left:100%;top:50%;transform:translate(calc(var(--mk-w) * .055),-50%);font-size:calc(var(--mk-w) * .056)}
  .mk-board::before{inset:calc(var(--mk-w) * .016);border-radius:calc(var(--mk-w) * .125)}
  .mk-mono{font-size:calc(var(--mk-w) * .032);top:calc(var(--mk-w) * .02)}
  .mk-wood{grid-template-columns:1fr 1fr;grid-template-rows:1.3fr repeat(6,1fr) 1.3fr;gap:calc(var(--mk-w) * .03);padding:calc(var(--mk-w) * .04);border-radius:calc(var(--mk-w) * .11)}
  .mk-cell{grid-column:var(--vc);grid-row:var(--vr)}
  body.pk .pk-mini{width:min(var(--mk-w) * 1.25,calc(100vw - 16px))}
}
@media (prefers-reduced-motion:reduce){.mk-cell{transition:none}}

<script>
/* ---------- painted materials (drawn in the browser when the page opens; no picture files) ---------- */
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}
function noise2(seed){var r=rng(seed),P=new Uint16Array(512),G=new Float32Array(256),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=Math.floor(r()*(i+1));t=p[i];p[i]=p[j];p[j]=t;}for(i=0;i<512;i++)P[i]=p[i&255];for(i=0;i<256;i++)G[i]=r();function f(x){return x*x*(3-2*x);}return function(x,y){var xi=Math.floor(x),yi=Math.floor(y),u=f(x-xi),v=f(y-yi),X=xi&255,Y=yi&255;var a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(n,x,y,o){var s=0,a=.5,t=0;for(var i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function mix(a,b,t){return a+(b-a)*t;}
function canvasOf(w,h,fn){var c=document.createElement("canvas");c.width=w;c.height=h;var g=c.getContext("2d"),im=g.createImageData(w,h),D=im.data;for(var y=0;y<h;y++)for(var x=0;x<w;x++){var col=fn(x,y),i=(y*w+x)*4;D[i]=col[0];D[i+1]=col[1];D[i+2]=col[2];D[i+3]=255;}g.putImageData(im,0,0);return c;}
function cssUrl(c,png){return 'url('+c.toDataURL(png?"image/png":"image/jpeg",.9)+')';}
function woodFn(o){var n=noise2(o.seed),n2=noise2(o.seed+77),r=rng(o.seed+5);return function(x,y){var warp=fbm(n,x/o.wx,y/o.wy,4),v=y*o.freq+warp*o.turb;v-=Math.floor(v);var ring=Math.pow(Math.abs(Math.sin(v*Math.PI)),o.sharp),st=fbm(n2,x/180,y/1.6,3);var t=Math.min(1,Math.max(0,(1-ring)*o.ringAmt+st*o.streakAmt));var k=r()<o.pores?.8:1,l=1+(fbm(n2,x/400,y/90,2)-.5)*o.blotch;return [mix(o.light[0],o.dark[0],t)*k*l,mix(o.light[1],o.dark[1],t)*k*l,mix(o.light[2],o.dark[2],t)*k*l];};}
function feltFn(rgb,seed){var r=rng(seed),n=noise2(seed);return function(x,y){var k=.86+r()*.22+(fbm(n,x/22,y/22,3)-.5)*.14;return [rgb[0]*k,rgb[1]*k,rgb[2]*k];};}
function marbleFn(o){var n=noise2(o.seed),n2=noise2(o.seed+9);return function(x,y){var w=fbm(n,x/150,y/150,5);var v=Math.abs(Math.sin((x*.004+y*.007)*o.freq+w*o.turb));v=Math.pow(1-v,o.sharp);var fine=fbm(n2,x/14,y/14,3),cloud=fbm(n2,x/260,y/260,3);var b=mix(o.base[0],o.cloud[0],cloud*.6),g=mix(o.base[1],o.cloud[1],cloud*.6),bb=mix(o.base[2],o.cloud[2],cloud*.6);return [mix(b,o.vein[0],v*o.amt)*(.97+fine*.06),mix(g,o.vein[1],v*o.amt)*(.97+fine*.06),mix(bb,o.vein[2],v*o.amt)*(.97+fine*.06)];};}
function stoneFn(rgb,seed){var r=rng(seed),n=noise2(seed),n2=noise2(seed+5);return function(x,y){var k=.9+fbm(n,x/60,y/60,4)*.16+(fbm(n2,x/4,y/4,2)-.5)*.1+(r()<.015?-.12:0);return [rgb[0]*k,rgb[1]*k,rgb[2]*k];};}

var DESIGNS={
  /* Pavilion Maple: matches the room photo; pale maple board and sea-glass marbles */
  maple:{name:"Pavilion Maple",tex:function(){ return cssUrl(canvasOf(1000,400,woodFn({light:[238,210,164],dark:[200,156,104],freq:.016,turb:4,wx:400,wy:40,sharp:.6,ringAmt:.42,streakAmt:.45,pores:.008,blotch:.14,seed:19}))); },
    texc:"#e0be88",edge:"#9a6e3a",inlay:"rgba(120,80,36,.45)",rim:"rgba(0,0,0,0)",rimw:"0px",cupdk:".42",monoc:"#7a5226",numc:"#5a3814",nums:"0 1px 0 rgba(255,240,210,.6)",
    stones:{a0:"#d7f3ff",b0:"#4eb3f0",c0:"#1468a8",a1:"#fff6c2",b1:"#f0b429",c1:"#c06a00",a2:"#e4ffd8",b2:"#5ad16e",c2:"#1a7a38",a3:"#ffd3e0",b3:"#ef5a86",c3:"#9b1b3a"}},
  /* Carved Sandstone: the pavilion's pale carved stone, a gold inlaid line, polished agate stones */
  stone:{name:"Carved Sandstone",tex:function(){ return cssUrl(canvasOf(1000,400,stoneFn([228,208,172],23))); },
    texc:"#e2cfa8",edge:"#8a7450",inlay:"rgba(184,145,63,.85)",rim:"rgba(184,145,63,.55)",rimw:"1.5px",cupdk:".38",monoc:"#8a6526",numc:"#5e4a2a",nums:"0 1px 0 rgba(255,250,235,.6)",
    stones:{a0:"#ffe7c8",b0:"#d9772e",c0:"#7a2e08",a1:"#e8fff2",b1:"#3f9a72",c1:"#0e4a32",a2:"#fff0f6",b2:"#c7889c",c2:"#6a2e44",a3:"#f8f4ec",b3:"#cbbfa8",c3:"#6e6250"}},
  /* Ebony & Gold: ebony board with gold-leaf rims on every cup, onyx, gold, garnet and pearl stones */
  ebony:{name:"Ebony & Gold",tex:function(){ return cssUrl(canvasOf(1000,400,woodFn({light:[56,44,36],dark:[16,12,10],freq:.03,turb:4,wx:300,wy:30,sharp:.7,ringAmt:.5,streakAmt:.5,pores:0,blotch:.2,seed:3}))); },
    texc:"#1e1814",edge:"#000",inlay:"rgba(217,178,90,.9)",rim:"#c9a24f",rimw:"2px",cupdk:".55",monoc:"#d9b25a",numc:"#e6c56e",nums:"0 1px 2px rgba(0,0,0,.7)",
    stones:{a0:"#9a9aa2",b0:"#2c2c32",c0:"#050507",a1:"#fff0b8",b1:"#d9a83a",c1:"#6a4a10",a2:"#ffc2c8",b2:"#a3182e",c2:"#4a0610",a3:"#ffffff",b3:"#f2ece2",c3:"#b8ab94"}}
};
var texCache={}, curDesign=null;
function applyDesign(k){
  if(!DESIGNS[k]) k="maple"; if(k===curDesign) return; curDesign=k; var d=DESIGNS[k];
  if(!texCache[k]) texCache[k]=d.tex();
  var s=document.body.style;
  s.setProperty("--mk-tex",texCache[k]); s.setProperty("--mk-cuptex",texCache[k]); s.setProperty("--mk-texc",d.texc); s.setProperty("--mk-edge",d.edge); s.setProperty("--mk-inlay",d.inlay);
  s.setProperty("--mk-rim",d.rim); s.setProperty("--mk-rimw",d.rimw); s.setProperty("--mk-cupdk",d.cupdk); s.setProperty("--mk-monoc",d.monoc); s.setProperty("--mk-numc",d.numc); s.setProperty("--mk-nums",d.nums);
  Object.keys(d.stones).forEach(function(v){ s.setProperty("--"+v,d.stones[v]); });
}
var PREVIEW=/[?&]preview=1/.test(location.search), previewPick=null;
function previewBar(){
  if(!PREVIEW) return;
  var bar=document.createElement("div"); bar.className="mk-pick";
  Object.keys(DESIGNS).forEach(function(k){ var b=document.createElement("button"); b.type="button"; b.textContent=DESIGNS[k].name; b.dataset.k=k;
    b.onclick=function(){ previewPick=k; document.body.setAttribute("data-set",k); mark(); }; bar.appendChild(b); });
  function mark(){ [].forEach.call(bar.children,function(b){ b.classList.toggle("on",b.dataset.k===(previewPick||curDesign)); }); }
  document.body.appendChild(bar); previewPick="maple"; document.body.setAttribute("data-set","maple"); mark();
}

/* ---------- the board ----------
   Internally the board is one ring of 14 slots, sown counter-clockwise:
   0-5 = side 1's cups (the host, or you against The House), 6 = side 1's store,
   7-12 = side 2's cups, 13 = side 2's store. Saved online as {y, h, ys, hs, turn, over}. */
var stage=document.createElement("div"); stage.className="mk-pad";
stage.innerHTML='<div class="mk-board"><span class="mk-mono"><b>B</b><i>W</i></span><div class="mk-wood" id="mkWood"></div></div>';
var slots=[];

var ring=[], turn=1, over=false, last=-1, busy=false;
var mySide=1, online=false, sb=null, room=null, me=null, reported=false, CODE=(location.search.match(/[?&]code=([A-Za-z0-9]+)/)||[])[1];

function fresh(){ return [4,4,4,4,4,4,0,4,4,4,4,4,4,0]; }
function storeOf(s){ return s===1?6:13; }
function cupsOf(s){ return s===1?[0,1,2,3,4,5]:[7,8,9,10,11,12]; }
function ownerOfCup(i){ return i<6?1:(i>6&&i<13)?2:0; }
function sideEmpty(b,s){ return cupsOf(s).every(function(i){ return b[i]===0; }); }

/* one move: returns {b, steps, extra, capture} without touching the live board */
function move(b,s,i){
  b=b.slice(); var n=b[i], steps=[], skip=storeOf(3-s), pos=i; b[i]=0;
  while(n>0){ pos=(pos+1)%14; if(pos===skip) continue; b[pos]++; n--; steps.push(pos); }
  var extra=pos===storeOf(s), capture=null;
  if(!extra && ownerOfCup(pos)===s && b[pos]===1 && b[12-pos]>0){
    capture=b[pos]+b[12-pos]; b[storeOf(s)]+=capture; b[pos]=0; b[12-pos]=0;
  }
  var done=false;
  if(sideEmpty(b,1)||sideEmpty(b,2)){
    cupsOf(1).forEach(function(k){ b[6]+=b[k]; b[k]=0; }); cupsOf(2).forEach(function(k){ b[13]+=b[k]; b[k]=0; }); done=true;
  }
  return {b:b, steps:steps, extra:extra&&!done, capture:capture, done:done, lastPos:pos};
}
function winnerSide(){ return ring[6]===ring[13]?0:ring[6]>ring[13]?1:2; }

/* ---------- drawing ---------- */
function build(){
  var w=document.getElementById("mkWood"); w.innerHTML=""; slots=[];
  for(var i=0;i<14;i++){
    var c=document.createElement("button"); c.type="button"; c.className="mk-cell"+(i===6||i===13?" mk-store":"");
    (function(i){ c.onclick=function(){ play(i); }; })(i);
    w.appendChild(c); slots.push(c);
  }
  place();
}
/* where each slot sits, from the viewer's side: their cups along the near row, their store on the right
   (bottom on portrait phones); the other side's cups across the far row, their store on the left (top) */
function place(){
  var meS=mySide===2?2:1, mine=cupsOf(meS), theirs=cupsOf(3-meS);
  function set(i,hc,hr,vc,vr,label,pos){ var s=slots[i].style; s.setProperty("--hc",hc); s.setProperty("--hr",hr); s.setProperty("--vc",vc); s.setProperty("--vr",vr); slots[i].dataset.label=label; slots[i].dataset.pos=pos; }
  mine.forEach(function(idx,k){ set(idx,String(2+k),"2",1,String(2+k),"Your cup "+(k+1),"near"); });
  theirs.forEach(function(idx,k){ var j=5-k; set(idx,String(2+j),"1",2,String(2+j),"Opponent cup "+(k+1),"far"); });
  set(storeOf(3-meS),"1","1 / span 2","1 / span 2","1","Opponent store","storeL");
  set(storeOf(meS),"8","1 / span 2","1 / span 2","8","Your store","storeR");
}
function gems(n,isStore){
  var max=isStore?24:12, h="";
  for(var i=0;i<Math.min(n,max);i++) h+='<i class="mk-gem g'+(i%4)+'"></i>';
  if(n>max) h+='<span class="mk-more">+'+(n-max)+'</span>';
  return h+'<span class="mk-n">'+n+'</span>';
}
function legal(){ return (!over && !busy && turn===mySide && seatedNow() && (!online||(room&&room.guest))) ? cupsOf(mySide).filter(function(i){ return ring[i]>0; }) : []; }
function paint(){
  var ok=legal();
  for(var i=0;i<14;i++){
    var c=slots[i]; c.innerHTML=gems(ring[i],i===6||i===13);
    c.classList.toggle("ok",ok.indexOf(i)>=0); c.classList.toggle("last",i===last);
    c.classList.toggle("live",!over&&i!==6&&i!==13&&ring[i]>0);   /* every cup that can still be played glows softly, on both sides */
    c.setAttribute("aria-label",c.dataset.label+": "+ring[i]+" stones"); c.disabled=ok.indexOf(i)<0;
  }
  Parlor.score([ring[6],ring[13]]); Parlor.turn(over?-1:turn===1?0:1);
}
function seatedNow(){ return document.body.classList.contains("seated"); }
function say(a,b){ Parlor.status(a,b||""); }
function msg(){
  if(over) return;
  if(online && room && !room.guest){ say("Waiting for a player","Share your table code: "+(CODE||"")); return; }
  if(turn===mySide) say("Your turn","Tap a glowing cup on your side to sow");
  else say(online?"Opponent's turn":"The House is thinking…","");
}

/* sow with a little rhythm: each stone lands one after another */
/* sow by hand: stones float from the cup one at a time and click into each cup (deeper "clunk" in a store) */
async function animate(s,i,res,done){
  busy=true; last=-1;
  var from=slots[i], held=ring[i], n=res.steps.length;
  ring=ring.slice(); ring[i]=0; paint(); P_sfx("whoosh");
  var flights=[];
  for(var k=0;k<n;k++){
    (function(k){
      var p=res.steps[k];
      flights.push(Parlor.wait(k*260).then(function(){
        return Parlor.fly(from,slots[p],'<i class="mk-gem g'+(k%4)+'"></i>',{size:gemPx()*1.15,lift:Math.min(70,30+k*6),dur:420,sound:false});
      }).then(function(){
        ring[p]++; paint(); slots[p].classList.add("flash");
        setTimeout(function(){ slots[p].classList.remove("flash"); },220);
        Parlor.sfx(p===6||p===13?"store":"click",{pitch:0.9+Math.random()*0.25});
      }));
    })(k);
  }
  await Promise.all(flights);
  await Parlor.wait(220);
  if(res.capture){
    var st=storeOf(s), pos=res.lastPos;
    await Promise.all([Parlor.fly(slots[pos],slots[st],'<i class="mk-gem g0"></i>',{size:gemPx()*1.4,dur:560}),Parlor.fly(slots[12-pos],slots[st],'<i class="mk-gem g2"></i>',{size:gemPx()*1.4,dur:600,sound:false})]);
    Parlor.sfx("store",{pitch:0.8});
  }
  ring=res.b; last=res.lastPos; busy=false; paint(); done();
}
function P_sfx(n){ Parlor.sfx(n); }
function gemPx(){ var g=getComputedStyle(document.body).getPropertyValue("--mk-gem"); var t=document.createElement("i"); t.style.width=g; t.style.position="absolute"; document.body.appendChild(t); var w=t.getBoundingClientRect().width; t.remove(); return w||14; }

function after(s,res){
  if(res.done){ over=true; paint(); end(); push(); return; }
  if(res.extra){ turn=s; paint(); say(s===mySide?"Extra turn":"Another turn for "+(online?"your opponent":"The House"),s===mySide?"Your last stone landed in your store":""); push(); if(!online&&turn===2) setTimeout(houseMove,1100); return; }
  turn=3-s; paint();
  msg();
  if(res.capture) say(s===mySide?"Captured "+res.capture+" stones!":(online?"Opponent":"The House")+" captured "+res.capture+" stones",turn===mySide?"Your turn":"");
  push();
  if(!online&&turn===2) setTimeout(houseMove,1000);
}
function play(i){
  if(legal().indexOf(i)<0) return;
  var res=move(ring,mySide,i); lastMv={s:mySide,i:i}; seq++;
  animate(mySide,i,res,function(){ after(mySide,res); });
}
function end(){
  var w=winnerSide(), a=ring[6], b=ring[13];
  var mine=mySide===2?b:a, theirs=mySide===2?a:b;
  var kind=w===0?"draw":(w===mySide?"win":"lose");
  say(kind==="win"?"You win!":kind==="draw"?"Draw":"Game over", mine+" – "+theirs);
  if(online) report();
  Parlor.finish(kind, "Your store "+mine+", "+(online?"opponent":"The House")+" "+theirs);
}

/* ---------- The House: looks a few moves ahead (extra turns included) ---------- */
function search(b,s,depth,alpha,beta){
  var moves=cupsOf(s).filter(function(i){ return b[i]>0; });
  if(depth===0||!moves.length) return {v:(b[13]-b[6])*10+(cupsOf(2).reduce(function(t,i){return t+b[i];},0)-cupsOf(1).reduce(function(t,i){return t+b[i];},0))};
  var best=null;
  for(var m=0;m<moves.length;m++){
    var r=move(b,s,moves[m]), v;
    if(r.done) v=(r.b[13]-r.b[6])*100;
    else v=search(r.b,r.extra?s:3-s,r.extra?depth:depth-1,alpha,beta).v;
    if(s===2){ if(!best||v>best.v) best={v:v,i:moves[m]}; alpha=Math.max(alpha,v); }
    else { if(!best||v<best.v) best={v:v,i:moves[m]}; beta=Math.min(beta,v); }
    if(beta<=alpha) break;
  }
  return best;
}
function houseMove(){
  if(over||online||turn!==2||busy) return;
  /* The House plays to its level: sometimes a looser move, and it looks further ahead as the level climbs */
  var sk=Parlor.skill(), opts=cupsOf(2).filter(function(i){ return ring[i]>0; }), pick;
  if(!opts.length) return;
  if(Math.random()<sk.loose) pick={i:opts[Math.floor(Math.random()*opts.length)]};
  else pick=search(ring,2,sk.depth,-1e9,1e9);
  if(!pick||pick.i==null) return;
  var res=move(ring,2,pick.i);
  animate(2,pick.i,res,function(){ after(2,res); });
}
function newGame(){ ring=fresh(); turn=1; over=false; last=-1; busy=false; reported=false; paint(); msg(); }

/* ---------- online table (same page: ?code=XXXX) ---------- */
var lastMv=null, seq=0;
function snapshot(){ return {game:"mancala", y:ring.slice(0,6), ys:ring[6], h:ring.slice(7,13), hs:ring[13], turn:turn, over:over, mv:lastMv, seq:seq}; }
function applySnap(s){
  if(!s||!s.y) s={y:[4,4,4,4,4,4],h:[4,4,4,4,4,4],ys:0,hs:0,turn:1,over:false};
  ring=s.y.concat([s.ys||0],s.h,[s.hs||0]); turn=s.turn||1; over=!!s.over; if(s.seq!=null) seq=s.seq;
}
async function push(){
  if(!online||!room) return;
  await sb.from("rooms").update({state:snapshot(), status:over?"done":"live", updated_at:new Date().toISOString()}).eq("id",room.id);
  if(over) report();
}
function report(){ if(reported||!over||!room||!window.bwRateGame) return; reported=true; room.state=snapshot(); bwRateGame(sb,room,me,winnerSide()); }
async function bootOnline(){
  online=true; Parlor.seatOnline({label:"Online table "+CODE});
  var cfg=window.BW_PLAY||{};
  if(!cfg.url){ say("Can't connect","Missing play-config.js"); return; }
  sb=(window.BW&&BW.client&&BW.client())||supabase.createClient(cfg.url,cfg.anonKey);
  if(window.BW) await BW.settled();
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ say("Sign in to join","Use Tables to sign in"); if(window.BW){ var a=await BW.openAuth({reason:"Sign in to join this table."}); if(!a.ok) return; sess=(await sb.auth.getSession()).data.session; } if(!sess) return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code",CODE).single();
  if(q.error){ say("Table not found",q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==="function" && bwSendToGame(bwGuessGame(room),CODE)) return;
  if(room.host===me) mySide=1; else if(room.guest===me) mySide=2;
  else if(!room.guest){ var u=await sb.from("rooms").update({guest:me,status:"live"}).eq("id",room.id).select().single(); if(!u.error){ room=u.data; mySide=2; } }
  else mySide=0;   /* watching */
  Parlor.names(mySide===2?["Opponent","You"]:["You","Opponent"]);
  Parlor.mySeat(mySide===2?1:0);
  place();
  applySnap(room.state&&room.state.y?room.state:null);
  paint(); if(over) end(); else msg();
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"code=eq."+CODE},function(p){
    var st=p.new.state||{}; room=p.new;
    /* the other player's move: replay it stone by stone from the board we already show */
    if(st.mv && st.seq!==seq && st.mv.s!==mySide && !busy){
      seq=st.seq; var res=move(ring,st.mv.s,st.mv.i);
      animate(st.mv.s,st.mv.i,res,function(){ var wasOver=over; applySnap(st); paint(); if(over&&!wasOver) end(); else msg(); });
      return;
    }
    if(st.seq!=null) seq=st.seq;
    var wasOver=over; applySnap(st); paint();
    if(over&&!wasOver) end(); else msg();
  }).subscribe();
}

Parlor.init({
  game:"mancala", title:"Pavilion Mancala", bg:"mancala-pavilion.jpg", home:"tables.html", stage:stage,
  tagline:"Sow the stones. Fill your store.", invite:"The pavilion is open to the breeze. Sit down and sow the first stones.",
  players:[{name:"You",color:"#c98a3c"},{name:"The House",color:"#7a5420"}],
  setsLabel:"Boards",
  sets:[
    {id:"maple",name:"Pavilion Maple",need:0,dots:["#e0be88","#4eb3f0","#f0b429"]},
    {id:"stone",name:"Carved Sandstone",club:true,dots:["#e2cfa8","#d9772e","#3f9a72"]},
    {id:"ebony",name:"Ebony & Gold",club:true,dots:["#1e1814","#d9a83a","#a3182e"]}
  ],
  rules:{
    play:"<ol><li>Your six cups are the row nearest you, and your store is on your right (at the bottom on a phone). Each cup starts with four stones.</li><li>Tap one of your cups. Its stones are sown one at a time, counter-clockwise, into the next cups and your own store. The other player's store is skipped.</li><li>If your last stone lands in your store, you take another turn.</li><li>If your last stone lands in an empty cup on your side, you capture it and every stone in the cup across from it.</li><li>When either side runs out of stones, each player moves the stones left on their side into their own store.</li></ol>",
    score:"<ul><li>The player with more stones in their store wins.</li><li>Equal stores are a draw.</li></ul>"
  },
  onNew:function(){ mySide=1; place(); newGame(); }
});
ring=fresh();   /* a board to look at before anyone sits */
new MutationObserver(function(){ var k=document.body.getAttribute("data-set");
  if(PREVIEW&&previewPick&&k!==previewPick){ document.body.setAttribute("data-set",previewPick); return; }
  applyDesign(k||"maple"); }).observe(document.body,{attributes:true,attributeFilter:["data-set"]});
document.addEventListener("DOMContentLoaded",function(){
  applyDesign(document.body.getAttribute("data-set")||"maple"); previewBar();
  build(); paint();
  if(CODE) bootOnline();
});
</script>
