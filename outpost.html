<style>
/* ==========================================================================
   BrainWhim · The Outpost main room (Nov 6, 2026)
   The photo kids-outpost.jpg is the room. Five corners are tappable places in it:
   The Lab (glassware), The Telescope (window), The Joke Shack (hanging basket),
   The Workshop (blanket and fabric corner), Mission Control (radio and sphere).
   The patch board is the badge wall. The title is chalked on the chalkboard.
   Wide screens: the photo fills the screen. Tall screens: photo on top, corner cards below.
   Living details: lamp and lantern flicker, string lights, window stars, radio dial glow,
   bubbling flask, dust in the lamplight (transform/opacity only).
   ========================================================================== */
.world{position:fixed;inset:0;overflow:hidden;background:#050b1c}
.world::before{content:"";position:absolute;inset:-40px;background:url("kids-outpost-sm.jpg") center/cover;filter:blur(24px) brightness(.35)}
.stage{--sw:min(max(100vw,150svh),168svh);position:absolute;left:50%;top:50%;width:var(--sw);aspect-ratio:3/2;
  transform:translate(-50%,-50%);background:url("kids-outpost.jpg") center/cover no-repeat;
  animation:arrive 1s cubic-bezier(.2,.7,.3,1) both}
@media (max-width:1100px){.stage{background-image:url("kids-outpost-sm.jpg")}}
@keyframes arrive{from{opacity:0;transform:translate(-50%,-50%) scale(1.12)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(3,8,22,.45),transparent 14%),radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(3,8,22,.45))}

/* living details */
.fx{position:absolute;pointer-events:none;border-radius:50%}
.glow{transform:translate(-50%,-50%);aspect-ratio:1;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,206,120,.5),rgba(255,170,60,.16) 40%,transparent 68%);animation:fl 2.9s steps(1) infinite}
@keyframes fl{0%{opacity:.85}13%{opacity:.64}22%{opacity:.95}39%{opacity:.75}53%{opacity:1}68%{opacity:.7}82%{opacity:.92}}
.bulb{width:1.6%;aspect-ratio:1;transform:translate(-50%,-50%);mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,226,150,.95),rgba(255,190,90,.3) 45%,transparent 70%);animation:bulb 3.4s ease-in-out infinite}
@keyframes bulb{0%,100%{opacity:.45}50%{opacity:1}}
.star{width:.35%;aspect-ratio:1;background:#fff;box-shadow:0 0 6px 1px rgba(200,230,255,.9);animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.dial{width:7%;aspect-ratio:1;transform:translate(-50%,-50%);mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,200,110,.55),transparent 62%);animation:dial 4.5s ease-in-out infinite}
@keyframes dial{0%,100%{opacity:.4}40%{opacity:.9}45%{opacity:.55}50%{opacity:.95}}
.bub{width:.45%;aspect-ratio:1;border:1px solid rgba(190,240,255,.8);background:rgba(160,230,255,.18);animation:bub 2.6s ease-in infinite}
@keyframes bub{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(.15vw,calc(var(--sw)*-.045));opacity:0}}
.mote{width:.3%;aspect-ratio:1;background:rgba(255,235,190,.85);animation:mote 11s ease-in-out infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}20%{opacity:.8}50%{transform:translate(calc(var(--sw)*.012),calc(var(--sw)*.02))}80%{opacity:.6}100%{transform:translate(calc(var(--sw)*-.006),calc(var(--sw)*.04));opacity:0}}

/* the chalkboard title */
.chalk{position:absolute;left:6.5%;top:25%;width:18%;text-align:center;pointer-events:none;transform:rotate(-2deg);
  color:rgba(245,248,240,.86);text-shadow:0 0 1px rgba(255,255,255,.6),0 0 calc(var(--sw)*.004) rgba(255,255,255,.25)}
.chalk b{display:block;font-size:calc(var(--sw)*.027);font-weight:700;letter-spacing:.02em;line-height:1.05}
.chalk i{display:block;font-style:normal;font-size:calc(var(--sw)*.0125);margin-top:.5em;opacity:.85}
.chalk svg{display:block;width:62%;margin:.4em auto 0;opacity:.7}

/* the corners in the photo */
.spot{position:absolute;appearance:none;border:0;padding:0;background:transparent;cursor:pointer;border-radius:22%}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,214,120,.26),transparent 66%);animation:pulse 3.8s ease-in-out infinite}
.spot:hover::before,.spot:focus-visible::before{opacity:1}
.spot:focus-visible{outline:3px solid rgba(255,217,138,.8);outline-offset:3px}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.75}}
#sLab{left:1%;top:33%;width:28%;height:29%}
#sBadge{left:32%;top:13%;width:29.5%;height:29%;border-radius:8%}
#sMission{left:37%;top:43%;width:25%;height:14%}
#sTele{left:62%;top:20%;width:30%;height:42%}
#sWork{left:66%;top:66%;width:34%;height:34%}
#sJoke{left:47.5%;top:65%;width:18%;height:32%;border-radius:30%}
.plaque{position:absolute;white-space:nowrap;cursor:pointer;/* tappable too: it sits inside its .spot button, so a tap opens the corner even where the plate hangs outside the spot */text-align:left;
  padding:.45em 1.15em .5em;border-radius:5px;font-size:clamp(13px,calc(var(--sw)*.0112),22px);
  /* Judy's pick (Nov 9): A, wooden signs: light pine, grain, two nail heads, burned-in letters */
  background:
    radial-gradient(circle at .5em 50%,#3b2a1a 0 .16em,#8a6a44 .17em .2em,transparent .22em),
    radial-gradient(circle at calc(100% - .5em) 50%,#3b2a1a 0 .16em,#8a6a44 .17em .2em,transparent .22em),
    repeating-linear-gradient(178deg,rgba(120,72,30,0) 0 5px,rgba(120,72,30,.16) 5px 6px,rgba(120,72,30,0) 6px 11px,rgba(120,72,30,.09) 11px 13px),
    radial-gradient(40% 60% at 70% 40%,rgba(150,95,40,.18),transparent 70%),
    linear-gradient(180deg,#e9c88e,#d9ae6c 55%,#c99a58);
  border:1px solid #7a4f24;
  box-shadow:inset 0 1px 0 rgba(255,240,205,.6),inset 0 -2px 0 rgba(110,62,22,.45),inset 0 0 0 1px rgba(255,230,180,.15),
    0 2px 0 #8d5d2c,0 8px 14px rgba(0,0,0,.5),2px 3px 3px rgba(0,0,0,.25)}
.plaque b{display:block;font-size:1.3em;font-weight:700;color:#4a2a12;line-height:1.1;letter-spacing:.01em;
  text-shadow:0 1px 0 rgba(255,236,196,.55),0 0 1px rgba(60,30,10,.6)}
.plaque i{display:block;font-style:normal;color:#5e3a1c;font-size:.92em;margin-top:2px;font-weight:500;text-shadow:0 1px 0 rgba(255,236,196,.45)}
#sTele .plaque i,#sTele .plaque b{text-align:right}
.plaque .n{display:inline-block;margin-left:.4em;padding:0 .45em;border-radius:999px;background:rgba(74,42,18,.82);color:#ffe2a0;font-size:.72em;vertical-align:middle;text-shadow:none}
#sLab .plaque{left:6%;top:100%;margin-top:4px}
#sBadge .plaque{left:100%;top:6%;margin-left:8px}
#sMission .plaque{left:10%;top:100%;margin-top:4px}
#sTele .plaque{right:0;top:70%;text-align:right}
#sWork .plaque{left:22%;top:30%}
#sJoke .plaque{left:4%;top:60%}
@media (min-aspect-ratio:5/4) and (max-height:520px){
  .plaque{font-size:11px;padding:.35em .95em .4em}.plaque i{display:none}
  #sBadge .plaque{left:4%;top:auto;bottom:4%;margin:0}#sJoke .plaque{top:34%}}

/* corner cards (tall screens only) */
.cards{display:none}
@media (max-aspect-ratio:5/4){
  .world{position:relative;inset:auto;min-height:100svh;display:flex;flex-direction:column}
  .world::before{display:none}
  .stage{--sw:min(100vw,63svh);position:relative;left:auto;top:auto;transform:none;margin:0 auto;flex:none;animation:none}
  .plaque{display:none}
  .chalk i{display:none}
  @media (max-width:699px){.chalk{display:none}}
  .cards{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;padding:12px 14px calc(14px + var(--k-safe-b));flex:1}
  .card{position:relative;min-height:84px;display:flex;align-items:flex-end;border:0;padding:0;cursor:pointer;overflow:hidden;text-align:left;
    border-radius:20px;background-color:#0e1a36;background-image:url("kids-outpost-sm.jpg");background-repeat:no-repeat;background-size:320% auto;
    border:1px solid rgba(233,196,106,.34);box-shadow:0 10px 22px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .15s}
  .card:active{transform:scale(.97)}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,30,.1) 10%,rgba(5,12,30,.9) 88%)}
  .card .t{position:relative;z-index:1;padding:10px 12px 11px}
  .card b{display:block;font-size:19px;font-weight:700;color:#ffe2a0;line-height:1.1}
  .card i{display:block;font-style:normal;font-size:13px;color:#d2dfee;margin-top:2px;line-height:1.25}
  .card .ic{position:absolute;z-index:1;top:9px;right:9px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    background:rgba(10,20,44,.7);border:1px solid rgba(233,196,106,.4);color:#ffe2a0}
  .card .ic svg{width:22px;height:22px}
}
@media (max-aspect-ratio:5/4) and (max-height:600px){.card i{display:none}.card b{font-size:17px}}
@media (max-aspect-ratio:5/4) and (min-width:700px){
  .cards{grid-template-columns:1fr 1fr 1fr;gap:16px;padding:20px 22px}
  .card b{font-size:26px}.card i{font-size:16px}.card .t{padding:16px 18px}
  .card .ic{width:50px;height:50px;top:14px;right:14px}.card .ic svg{width:28px;height:28px}
}

/* corner panels */
.cHead{display:flex;align-items:center;gap:14px;margin:0 0 10px;padding-right:40px}
.cHead .ic{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 14px rgba(0,0,0,.35)}
.cHead .ic svg{width:32px;height:32px}
.cHead h2{margin:0}
.cHead p{margin:2px 0 0!important;font-size:15px!important;color:#a9bad0!important}
.acts{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.act{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  min-height:68px;padding:10px 14px;border-radius:18px;border:1px solid var(--k-line);background:rgba(255,255,255,.06);transition:transform .12s,background .2s}
.act:active{transform:scale(.98)}
.act:hover{background:rgba(255,255,255,.1)}
.act .tx{flex:1;min-width:0}
.act b{display:block;font-size:18px;color:#fff}
.act i{display:block;font-style:normal;font-size:14px;color:#b9c8da;margin-top:2px;line-height:1.3}
.act .st{flex:none;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(233,196,106,.2);color:#ffe2a0;white-space:nowrap}
.act .st.later{background:rgba(126,182,217,.16);color:#bfe0f5}
.act .st.go{background:linear-gradient(180deg,#ffe3a1,#e9b949);color:#2a1a00}
.note{margin:12px 0 0!important;font-size:15px!important;color:#cfe0f2!important;min-height:1.4em}
.note.pop{animation:kRise .35s ease}

/* badge wall */
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;margin:8px 0 6px;padding:16px 10px;border-radius:20px;
  background:linear-gradient(180deg,#6b4a2b,#4d331c);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 8px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.4)}
.patch{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.patch svg{width:76px;height:76px;filter:none}
.patch span{font-size:13px;font-weight:700;color:#f6e4c6;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.patch.off span{color:#cbb393;opacity:.8}
.patch small{font-size:12px;font-weight:700;color:#e9c46a;line-height:1}
.act .pd{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;font-style:normal;font-size:12px;font-weight:700;color:#14402e;background:#8fe3b4;vertical-align:2px}
.patch svg{transition:transform .25s}
.patch:not(.off) svg{animation:lift 3s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
</style>

<script>
(function(){
  /* ---- the five corners (Blueprint v1). An activity opens when it gets an href. ---- */

  var C = {

  };

  /* ---- badges: one patch per corner, plus Commander for all five (saved on this device) ---- */
  function badges(){ var b=BWK.store.get("badges",{}); return (b&&typeof b==="object")?b:{}; }
  function earnedCount(){ var b=badges(); return ORDER.filter(function(k){return b[k];}).length; }
  function patch(k, on){
    var col = k==="cmd" ? "#d4a52c" : C[k].col, id="opP"+k;

      '<stop offset="0" stop-color="'+(on?col:"#8b7a63")+'" stop-opacity="1"/><stop offset="1" stop-color="'+(on?col:"#5b4b38")+'" stop-opacity="'+(on?".72":"1")+'"/></radialGradient></defs>'+
      '<g transform="translate(0 2)" opacity=".35">'+shape+' fill="#000"/></g>'+
      shape+' fill="url(#'+id+')" stroke="'+(on?"#ffe8b0":"#a8936f")+'" stroke-width="3"/>'+
      shape.replace(/r="35"/,'r="30"').replace('M40 4 74 22v36L40 76 6 58V22z','M40 9 69 24.5v31L40 71 11 55.5v-31z')+' fill="none" stroke="'+(on?"rgba(255,255,255,.7)":"rgba(255,240,210,.35)")+'" stroke-width="1.6" stroke-dasharray="3 3"/>'+
      '<g opacity="'+(on?"1":".3")+'">'+ic+'</g>'+
      '</svg>';
  }
  function showCount(){ var n=earnedCount(); var el=document.getElementById("bCount"); if(el) el.textContent=n+" / 5"; }

  function openWall(){
    var b=badges(), n=earnedCount(), cells="";
    ORDER.forEach(function(k){ var g=BWK.cornerProgress(k); cells+='<div class="patch'+(b[k]?"":" off")+'">'+patch(k,!!b[k])+'<span>'+C[k].name.replace("The ","")+'</span>'+(b[k]?'':'<small>'+g.n+' of '+g.of+' played</small>')+'</div>'; });
    cells+='<div class="patch'+(n===5?"":" off")+'">'+patch("cmd",n===5)+'<span>Commander</span></div>';
    BWK.sheet('<div class="cHead"><span class="ic" style="background:linear-gradient(180deg,#e9c46a,#b8862b)">'+IC.badges+'</span>'+
      '<div><h2>Badge Wall</h2><p>'+n+' of 5 patches earned</p></div></div>'+
      '<div class="wall">'+cells+'</div>'+
      '<p class="note">Play every game in a corner to earn its patch. Collect all five to become <b>Commander</b>!</p>');
    BWK.say("This is your badge wall. Play every game in a corner to earn its patch. Collect all five to become Commander!");
  }

  function openCorner(k){
    if(k==="badges"){ openWall(); return; }
    var c=C[k], rows="", pl=BWK.store.get("played",{})||{}, g=BWK.cornerProgress(k), pn=c.name.replace("The ",""), got=!!badges()[k];
    BWK.store.set("corner",k);
    c.acts.forEach(function(a,i){
      var st = a.href ? '<span class="st go">Play</span>' : '<span class="st'+(a.s==="later"?" later":"")+'">'+STATUS[a.s]+'</span>';
      rows+='<button class="act" data-i="'+i+'"><span class="tx"><b>'+a.n+(pl[a.id]?'<em class="pd">✓ Played</em>':'')+'</b><i>'+a.d+'</i></span>'+st+'</button>';
    });
    var box=BWK.sheet('<div class="cHead"><span class="ic" style="background:linear-gradient(180deg,'+c.col+','+c.col+'bb)">'+IC[k]+'</span>'+
      '<div><h2>'+c.name+'</h2><p>'+c.line+'</p></div></div>'+
      '<div class="acts">'+rows+'</div>'+
      '<p class="note" id="opNote">'+(c.note||(got?"You earned the "+pn+" patch! Great exploring.":"Play every game here to earn the "+pn+" patch! You've played "+g.n+" of "+g.of+"."))+'</p>');
    BWK.say(c.say);
    [].forEach.call(box.querySelectorAll(".act"),function(btn){
      btn.onclick=function(){
        var a=c.acts[+btn.getAttribute("data-i")];
        if(a.href){ BWK.sfx("whoosh"); setTimeout(function(){location.href=a.href;},220); return; }
        BWK.sfx("chime");
        var msg = a.s==="later" ? a.n+" is still on the drawing board. It's coming later!" : "Almost ready! The crew is still building "+a.n+".";
        var nt=box.querySelector("#opNote"); nt.textContent=msg; nt.classList.remove("pop"); void nt.offsetWidth; nt.classList.add("pop");
        BWK.say(msg);
      };
    });
  }

  /* ---- corner cards for tall screens ---- */
  var cards=document.getElementById("cards"), list=ORDER.concat(["badges"]);
  var CID={lab:"cLab",tele:"cTele",joke:"cJoke",work:"cWork",mission:"cMission",badges:"cBadge"};
  list.forEach(function(k){
    var b=document.createElement("button"); b.className="card"; b.id=CID[k]; b.setAttribute("data-c",k);
    var nm = k==="badges" ? "Badge Wall" : C[k].name, ln = k==="badges" ? (earnedCount()+" of 5 patches") : C[k].line;
    b.innerHTML='<span class="ic" aria-hidden="true">'+IC[k]+'</span><span class="t"><b>'+nm+'</b><i>'+ln+'</i></span>';
    cards.appendChild(b);
  });

  var CTR={lab:[.15,.47],tele:[.77,.41],joke:[.56,.81],work:[.83,.83],mission:[.495,.56],badges:[.465,.275]};
  function crops(){
    [].forEach.call(cards.children,function(b){
      var w=b.offsetWidth, h=b.offsetHeight; if(!w) return;
      var W=Math.max(w/.34, h*1.5/.42), H=W/1.5, c=CTR[b.getAttribute("data-c")];
      var x=Math.min(Math.max(c[0]*W-w/2,0),W-w), y=Math.min(Math.max(c[1]*H-h/2,0),H-h);
      b.style.backgroundSize=Math.round(W)+"px "+Math.round(H)+"px"; b.style.backgroundPosition=(-Math.round(x))+"px "+(-Math.round(y))+"px";
    });
  }
  crops(); window.addEventListener("resize",crops);

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-c]"); if(!t || e.target.closest(".k-veil")) return;
    BWK.sfx("tap"); openCorner(t.getAttribute("data-c"));
  });

  showCount();
  BWK.lines({"intro-outpost":"Welcome to The Outpost treehouse! Tap The Lab, The Telescope, The Joke Shack, The Workshop or Mission Control. Your patches go on the badge wall.",
    "badge-wall-2":"This is your badge wall. Play every game in a corner to earn its patch. Collect all five to become Commander!",
    "corner-lab":"Welcome to The Lab! This is where brainy experiments happen.",
    "corner-telescope":"Welcome to The Telescope! Look out the window and explore.",
    "corner-jokeshack":"Welcome to The Joke Shack! Get ready to giggle.",
    "corner-workshop":"Welcome to The Workshop! Grab your tools and make something.",
    "corner-mission":"Welcome to Mission Control! Brody's three big screens and the captain's chair are warming up."});
  BWK.init({here:"outpost", voice:"outpost", helloWord:"Welcome to The Outpost, ", helloClip:"welcome",
    intro:"Welcome to The Outpost treehouse! Tap The Lab, The Telescope, The Joke Shack, The Workshop or Mission Control. Your patches go on the badge wall."});
})();
</script>
</body>
</html>
