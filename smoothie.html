  background:linear-gradient(180deg,#e9d3b0 0,#d8bc93 10px,#c7a67a 11px,#b48f62 13px,#a07b51 100%);box-shadow:0 -6px 18px rgba(0,0,0,.35)}
#counter::before{content:"";position:absolute;inset:0;opacity:.35;
  background:repeating-linear-gradient(90deg,rgba(90,60,30,0) 0 118px,rgba(90,60,30,.35) 118px 120px),repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 5px,rgba(120,85,45,.12) 5px 6px)}

  padding:3px 7px 2px;border-radius:4px;background:linear-gradient(180deg,#f6dc8e,#c99a3c);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 1px 3px rgba(0,0,0,.5)}

#cust img{display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45));animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-2.5%) scaleY(1.015)}}

  transform:rotate(-.6deg)}

#cup::after{content:"";position:absolute;left:4%;right:4%;bottom:-2.5%;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);z-index:-1}

@keyframes spin{to{transform:rotate(360deg)}}
#blender::after{content:"";position:absolute;left:10%;right:10%;bottom:-2.5%;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent);z-index:-1}
.strm{position:absolute;z-index:5;width:12px;margin-left:-6px;border-radius:6px;transform-origin:50% 0;transform:scaleY(0);pointer-events:none;

.ings{display:flex;gap:4px;justify-content:center}

.ing span{font-size:11.5px;font-weight:700;line-height:1.05;text-align:center;min-height:2.1em;display:flex;align-items:center}
.ing:active{transform:translateY(2px);box-shadow:none}
.ing.used{opacity:.45}
.ing.bad{animation:shk2 .35s}

.acts{display:flex;gap:6px;justify-content:center}
.acts .k-btn{flex:1;min-height:46px;padding:0 6px;font-size:17px;max-width:200px}

.stars{font-size:34px;letter-spacing:4px;color:#f2be45;text-shadow:0 2px 0 #8a5f12;margin:2px 0 4px}

.mix{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff4dc;text-shadow:0 2px 6px #000}
@media (max-height:700px){.cmsg{font-size:14.5px;min-height:19px}.ib{min-height:36px;font-size:14px}.cday span{font-size:13px}.acts .k-btn{min-height:42px;font-size:16px}
  .ing svg{max-height:50px}.ing span{font-size:10.5px}.tabs button{padding:4px 2px;font-size:12.5px}}
@media (max-height:600px){.ing span{display:none}.ing svg{max-height:44px}}
@media (prefers-reduced-motion:reduce){#cust img{animation:none}#blender.shake .chunks{animation:none}}
</style>

<script>
(function(){

  ["pickle","Pickle"],["coco","Coco"],["rosie","Rosie"],["sunny","Sunny"],["lulu","Lulu"],["ziggy","Ziggy"]].map(function(a){ return {id:a[0],n:a[1]}; });

/* ---------- photos: whatever has arrived is used; drawn art otherwise ---------- */
var PH={}, PHN=0;

ING.concat(TOP).forEach(function(x){ photo(x.id,x.file||x.id); });
photo("cupglass","cup"); photo("jar","jar"); photo("base","base");
(function(){ var im=new Image(); im.onload=function(){ PH.sign={src:im.src,w:im.naturalWidth,h:im.naturalHeight}; $("#mSignI").src=$("#pSignI").src=im.src; $("#mSign").style.display=""; $("#smEmb").style.display=$("#mH1").style.cssText=""; $("#smEmb").style.display="none"; $("#mH1").style.cssText="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"; signFont(); if(P) layout(); }; im.src="sm/sign.webp?v="+AV; })();
function signFont(){ ["#mSign","#pSign"].forEach(function(q){ var e=$(q); if(e&&e.offsetWidth) e.querySelector("span").style.fontSize=(e.offsetWidth*.068)+"px"; }); }
(function(){ var im=new Image(); im.onload=function(){ $("#counter").classList.add("ph"); }; im.src="sm/counter.webp?v="+AV; })();

/* ---------- colors ---------- */
function mixc(a,b,t){ return [0,1,2].map(function(i){ return Math.round(a[i]+(b[i]-a[i])*t); }); }
function hex(c){ return "#"+c.map(function(v){ v=Math.max(0,Math.min(255,Math.round(v))); return (v<16?"0":"")+v.toString(16); }).join(""); }
function shade(c,t){ return hex(t>0?mixc(c,[255,255,255],t):mixc(c,[0,0,0],-t)); }
function layerColor(L){ var c=[0,0,0]; L.f.forEach(function(id){ var k=IG[id].c; c=[c[0]+k[0],c[1]+k[1],c[2]+k[2]]; }); c=c.map(function(v){ return v/L.f.length; });
  if(L.a){ var a=IG[L.a]; c=mixc(c,a.c,a.p); } return c; }
function layerName(L){ return L.f.map(function(id){ return IG[id].n; }).join("-")+(L.a?" + "+IG[L.a].n:""); }
function same(L,items){ var f=items.filter(function(id){ return IG[id].g===0; }).sort(), a=items.filter(function(id){ return IG[id].g===1; });
  return f.join()===L.f.slice().sort().join() && a.join()===(L.a||""); }

/* ---------- drawn art (40×40), the fallback while photos load ---------- */
function bowlArt(c,bits){ var s='<path d="M4 21h32q-1 14-16 15Q5 35 4 21z" fill="#f7f2e8" stroke="#c9bfae" stroke-width="1"/><ellipse cx="20" cy="21" rx="16" ry="3.6" fill="#e9e1d2"/>'+
  '<path d="M7 21q2-10 13-11 11 1 13 11z" fill="'+hex(c)+'"/>';
  for(var i=0;i<(bits||6);i++){ var x=10+(i*37%21), y=13+(i*13%7); s+='<circle cx="'+x+'" cy="'+y+'" r="3.2" fill="'+shade(c,.18)+'" stroke="'+shade(c,-.3)+'" stroke-width=".7"/>'; }
  return s; }
function art(id){ var x=IG[id];
  if(x.k==="bowl") return bowlArt(x.c,x.g?0:6);
  if(x.k==="bottle") return '<rect x="17" y="4" width="6" height="7" rx="1.5" fill="#c69a63"/><path d="M14 13q0-3 3-3h6q3 0 3 3v21q0 3-3 3h-6q-3 0-3-3z" fill="'+hex(x.c)+'" stroke="rgba(255,255,255,.7)" stroke-width="1.2"/><rect x="16" y="14" width="2.2" height="18" rx="1" fill="#fff" opacity=".5"/>';
  if(x.k==="coco") return '<path d="M4 18h32q-1 17-16 17Q5 35 4 18z" fill="#7a4b26" stroke="#4e2c12"/><ellipse cx="20" cy="18" rx="16" ry="5" fill="#fbf8ee" stroke="#e7dccb"/>';
  switch(id){
    case "cream": return '<path d="M6 34q-2-7 5-8-3-6 4-8-1-6 5-9 1 4 4 5 6 2 5 7 6 2 4 7 6 2 4 6z" fill="#fffaf0" stroke="#e6dccb" stroke-width="1"/>';
    case "cherry": return '<path d="M20 22q1-12 9-18" fill="none" stroke="#5c7a2a" stroke-width="2"/><circle cx="18" cy="28" r="8" fill="#c8102e"/><circle cx="15" cy="25" r="2.2" fill="#fff" opacity=".6"/>';
    case "straw": return '<defs><pattern id="smStp" width="5" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="5" height="3" fill="#f06a9a"/><rect y="3" width="5" height="3" fill="#fff"/></pattern></defs><path d="M18 38V10q0-5 5-6h7v4h-6q-2 0-2 2v28z" fill="url(#smStp)" stroke="#d2507e" stroke-width=".6"/>';
    case "umbrella": return '<path d="M20 12L26 38" stroke="#b5874c" stroke-width="2"/><path d="M3 15q17-16 34 0q-4-3-8.5 0-4-3-8.5 0-4-3-8.5 0-4-3-8.5 0z" fill="#22b8c4" stroke="#14808a" stroke-width=".8"/>';
    case "mangoslice": return '<path d="M5 30q15-24 31-8q-14 14-31 8z" fill="#f7a21b" stroke="#c4740c"/><path d="M5 30q14 6 31-8" fill="none" stroke="#7aa232" stroke-width="2.5"/>';
    case "mint": return '<path d="M20 36V18" stroke="#3f7a2e" stroke-width="1.6"/><path d="M20 22q-14-2-12-14 12 2 12 14zM20 20q12-6 13-16-12 3-13 16zM20 28q-10 2-13-6 10-2 13 6z" fill="#4fae3a" stroke="#2f7a22" stroke-width=".7"/>';
    case "sprinkles": { var s="", C=["#f06a9a","#ffd23a","#4fb3f0","#7ad04f","#b07af0","#ff8a3a"]; for(var i=0;i<14;i++){ s+='<rect x="'+(7+(i*11%26))+'" y="'+(10+(i*7%20))+'" width="6" height="2" rx="1" fill="'+C[i%6]+'" transform="rotate('+(i*47%180)+' '+(10+(i*11%26))+' '+(11+(i*7%20))+')"/>'; } return s; }
  } return ""; }

/* ---------- the week: a gentle climb (Mon → Sun) ---------- */

$("#ings").onclick=function(e){ var b=e.target.closest(".ing"); if(!b||!P||busy||P.done) return; tapIng(b.dataset.id,b); };

/* ---------- sounds of its own ---------- */
function sPlop(){ BWG.tone(520,0,.09,.05,"sine",240); BWG.noise(0,.07,.05,400,1800); }
function sWhir(){ BWG.noise(0,1.3,.07,250,2600); BWG.tone(95,0,1.3,.025,"sawtooth",130); BWG.tone(190,.05,1.2,.012,"square",230); }
function sPour(){ BWG.noise(0,.9,.05,200,900); for(var i=0;i<7;i++) BWG.tone(260+Math.random()*200,.05+i*.11,.08,.03,"sine",480+Math.random()*200); }
function sTop(){ BWG.tone(880,0,.08,.04,"triangle",1320); BWG.tone(1320,.06,.12,.025,"triangle"); }
function sWrong(){ BWG.tone(220,0,.18,.05,"sine",180); }
function sServe(){ [523,659,784,1047].forEach(function(f,i){ BWG.tone(f,i*.08,.35,.04,"triangle"); }); BWG.noise(.4,.35,.04,1200,4000); }
function sWin(){ [523,659,784,1047,1319].forEach(function(f,i){ BWG.tone(f,i*.09,.4,.045,"triangle"); }); }

/* ---------- playing ---------- */
function startedCover(){ if(LV[P.lv].m==="mem"&&!P.cover&&P.pl===0){ P.cover=true; drawTicket(); } }
function tapIng(id,el){ var x=IG[id], o=O(), top=P.pl>=o.L.length; clearHint();
  if(x.top){
    if(!top){ bad(el); msg("Toppings go on last! First make all the layers."); if(!said.last){ said.last=1; BWK.say(LAST); } return; }
    if(P.tp.indexOf(id)>=0) return;
    if(o.T.indexOf(id)<0){ bad(el); msg("Oops! "+x.n+" isn't on the order card."); if(!said.ntop){ said.ntop=1; BWK.say(NTOP); } return; }
    P.tp.push(id); sTop(); putTop(id,true); saveCur(); drawTray(); drawTicket();
    if(P.tp.length===o.T.length){ msg("Ready! Tap Serve."); BWK.say(SERVE); ringOn($("#aPour")); } return; }
  if(top){ bad(el); msg("All the layers are in! Now the toppings."); TAB=2; drawTray(); return; }
  if(P.blended){ bad(el); msg("Pour that layer first, or tap Empty."); return; }
  if(P.bl.indexOf(id)>=0){ msg(x.n+" is already in the blender."); return; }
  if(P.bl.length>=3){ bad(el); msg("The blender is full! Tap Blend, or Empty to start the layer again."); return; }
  startedCover(); P.bl.push(id); sPlop(); if(!said["i"+id]){ said["i"+id]=1; BWK.say(x.s+"!"); }
  drawBlender(); drawTray(); var b=$("#blender"); b.animate([{transform:"translateY(-3%)"},{transform:"none"}],{duration:220,easing:"ease-out"});
  if(ST.n<2&&P.oi===0&&P.pl===0&&!said.blend){ said.blend=1; setTimeout(function(){ msg("Anything else for this layer? Then tap Blend!"); },300); }
}
function bad(el){ sWrong(); if(el){ el.classList.remove("bad"); void el.offsetWidth; el.classList.add("bad"); } }
function blend(){ if(!P||busy||!P.bl.length||P.blended) return; clearHint(); busy=true; var b=$("#blender"), g=gen; sWhir(); b.classList.add("shake");
  setTimeout(function(){ if(g!==gen) return; b.classList.remove("shake"); busy=false; P.blended=true; drawBlender(); drawTray();
    var L=blendLayer(); msg("Blended! That's "+layerName(L)+". Now tap Pour."); if(!said.pour){ said.pour=1; BWK.say(POUR); } },1300); }
function empty(){ if(!P||busy||!P.bl.length) return; clearHint(); BWK.sfx("whoosh"); P.bl=[]; P.blended=false; drawBlender(); drawTray(); msg("Empty! Try that layer again."); }
function pourOrServe(){ if(!P||busy) return; var o=O(); if(P.pl>=o.L.length){ serve(); return; } if(!P.blended) return; clearHint();
  var L=o.L[P.pl];
  if(!same(L,P.bl)){ sWrong(); var b=$("#blender"); b.animate([{marginLeft:"-6px"},{marginLeft:"6px"},{marginLeft:"-4px"},{marginLeft:"0"}],{duration:350});
    msg(nudge(L,P.bl)); if(!said.nope){ said.nope=1; BWK.say(P.lv<=3?CLOSE:NOPE); } return; }
  busy=true; var g=gen, N=o.L.length, k=P.pl, bl=$("#blender"), G=GEO, c=L.c;
  /* tip the blender over the cup and pour */
  var ang=-58*Math.PI/180, sx=G.bl.w*(.04-.5), sy=G.bl.h*(.08-.5), rx=sx*Math.cos(ang)-sy*Math.sin(ang), ry=sx*Math.sin(ang)+sy*Math.cos(ang);
  var S={x:G.cup.x+G.cup.w*.5, y:Math.max(-G.bl.h*.1,G.cup.y-G.cup.h*.22)}, cx=G.bl.x+G.bl.w/2, cy=G.bl.y+G.bl.h/2;
  bl.style.transform="translate("+(S.x-rx-cx)+"px,"+(S.y-ry-cy)+"px) rotate(-58deg)"; bl.style.zIndex=6;
  var yLiq=G.cup.y+G.cup.h*(layerTop(k,N)/CH);
  setTimeout(function(){ if(g!==gen) return; sPour();
    var st=document.createElement("div"); st.className="strm"; st.style.left=S.x+"px"; st.style.top=S.y+"px"; st.style.height=Math.max(10,(G.cup.y+G.cup.h*(LBOT/CH))-S.y)+"px"; st.style.background=hex(c);
    $("#stage").appendChild(st); st.animate([{transform:"scaleY(0)"},{transform:"scaleY(1)"}],{duration:260,fill:"forwards"});
    P.pl++; drawCup(); var ly=$('#cup .ly[data-k="'+k+'"]'); if(ly) ly.animate([{transform:"translateY("+((LBOT-layerTop(k,N))*1)+"px)"},{transform:"none"}],{duration:900,easing:"cubic-bezier(.3,.6,.4,1)"});
    setTimeout(function(){ if(g!==gen) return; st.style.transformOrigin="50% 100%"; st.animate([{transform:"scaleY(1)"},{transform:"scaleY(0)"}],{duration:220,fill:"forwards"});
      bl.style.transform=""; P.bl=[]; P.blended=false; drawBlender();
      setTimeout(function(){ if(g!==gen) return; st.remove(); bl.style.zIndex=""; busy=false; saveCur(); drawTray(); drawTicket(); afterPour(); },560); },820);
  },560);
}
function afterPour(){ var o=O(); if(P.pl<o.L.length){ msg("Yum! Now the next layer up."); if(!said.next){ said.next=1; BWK.say(NEXT); } }
  else { TAB=2; drawTray(); msg("All the layers are in! Now add the toppings."); BWK.say(TOPS); } }
function nudge(L,items){ if(P.lv>3) return "Not quite. Check the order card for this layer.";
  var f=items.filter(function(id){ return IG[id].g===0; }), need=L.f.concat(L.a?[L.a]:[]);
  for(var i=0;i<need.length;i++) if(items.indexOf(need[i])<0) return "Close! This layer needs "+IG[need[i]].n.toLowerCase()+". Tap Empty and try again.";
  for(var j=0;j<items.length;j++) if(need.indexOf(items[j])<0) return "Close! There's no "+IG[items[j]].n.toLowerCase()+" in this layer. Tap Empty and try again.";
  return "Not quite. Tap Empty and try again."; }
function serve(){ var o=O(); if(P.tp.length<o.T.length||busy) return; clearHint(); busy=true; var g=gen; sServe(); BWK.say(THANKS);
  msg("Yum! Thank you, Sophie!"); var c=$("#cust"); c.classList.add("hop"); $("#cup").animate([{transform:"none"},{transform:"translateX(-8%) scale(.96)"},{transform:"none"}],{duration:700});
  setTimeout(function(){ if(g!==gen) return; c.classList.remove("hop"); ST.n++; save();
    if(P.oi+1<P.orders.length){ c.classList.add("out");
      setTimeout(function(){ if(g!==gen) return; c.classList.remove("out"); P.oi++; P.pl=0; P.tp=[]; P.bl=[]; P.blended=false; saveCur(); newCustomer(); busy=false; layout(); orderHello(); },520); }
    else { busy=false; win(); } },1300); }
function starsOf(h){ return h===0?3:h<=2?2:1; }
function win(){ P.done=true; saveCur(); var g=gen; var fresh=P.bonus?"":BWG.patch("smoothie"); sWin();
  setTimeout(function(){ if(g!==gen) return; var s=starsOf(P.hints);
    var box=BWK.sheet('<h2>'+(P.bonus?'Smoothie served!':'All the orders are done!')+'</h2>'+BWG.patchLine(fresh)+'<div class="stars">'+"★★★".slice(0,s)+'<i>'+"★★★".slice(0,3-s)+'</i></div>'+
      '<p>'+(P.bonus?'Another happy customer!':'You made '+P.orders.length+' smoothies'+(P.hints?' with '+P.hints+' hint'+(P.hints>1?'s':''):' with no hints')+'.')+'</p>'+
      '<p>'+(P.bonus?'Want to make another one?':'Come back tomorrow for new orders.')+'</p>'+
      '<div class="k-row"><button class="k-btn" data-a="more">Bonus Smoothie</button><button class="k-btn k-ghost" data-a="out">The Outpost</button></div>');
    box.querySelector('[data-a=more]').onclick=function(){ BWK.closeSheet(true); start(true); };
    box.querySelector('[data-a=out]').onclick=BWG.toOutpost;
    BWK.say(fresh?WINP:(P.bonus?WINB:WIN)); },700); }

/* ---------- hints ---------- */
var HR=[];
function ringOn(el){ if(!el) return; el.classList.add("ring"); HR.push(el); }
function clearHint(){ HR.forEach(function(e){ e.classList.remove("ring"); }); HR=[]; }
function hint(){ if(!P||busy||P.done) return; clearHint(); BWK.sfx("tap"); var o=O(); P.hints++; saveCur(); BWK.say(HINT);
  if(LV[P.lv].m==="mem"&&P.cover){ P.peeks=Math.max(P.peeks,1); P.peek=true; drawTicket(); var g=gen; setTimeout(function(){ if(g!==gen) return; P.peek=false; drawTicket(); },3000); }
  if(P.pl>=o.L.length){ var t=o.T.filter(function(t){ return P.tp.indexOf(t)<0; })[0]; if(!t){ ringOn($("#aPour")); return; }
    TAB=2; drawTray(); ringOn($('.ing[data-id="'+t+'"]')); msg("Sophie's tip: add "+IG[t].n.toLowerCase()+"."); return; }
  var L=o.L[P.pl], need=L.f.concat(L.a?[L.a]:[]);
  if(P.blended){ if(same(L,P.bl)) { ringOn($("#aPour")); msg("Sophie's tip: that's right! Tap Pour."); } else { ringOn($("#aEmpty")); msg("Sophie's tip: that's not this layer. Tap Empty."); } return; }
  var wrong=P.bl.filter(function(id){ return need.indexOf(id)<0; }); if(wrong.length){ ringOn($("#aEmpty")); msg("Sophie's tip: there's something extra in the blender. Tap Empty."); return; }
  var miss=need.filter(function(id){ return P.bl.indexOf(id)<0; });
  if(!miss.length){ ringOn($("#aBlend")); msg("Sophie's tip: that's everything. Tap Blend!"); return; }
  TAB=IG[miss[0]].g; drawTray(); miss.forEach(function(id){ ringOn($('.ing[data-id="'+id+'"]')); });
  if(miss.some(function(id){ return IG[id].g!==TAB; })) ringOn($('#tabs [data-t="'+(TAB?0:1)+'"]'));
  msg("Sophie's tip: this layer is "+layerName(L)+"."); }

/* ---------- keys on a computer: 1-7 tray, B blend, P pour/serve, E empty, H hint ---------- */
document.addEventListener("keydown",function(e){ if(!document.body.classList.contains("m-play")||document.querySelector(".k-veil.on")) return;
  var k=e.key.toLowerCase(), bs=document.querySelectorAll(".ing");
  if(k>="1"&&k<="9"){ var b=bs[+k-1]; if(b) tapIng(b.dataset.id,b); }
  else if(k==="b") blend(); else if(k==="p"||k==="enter") pourOrServe(); else if(k==="e") empty(); else if(k==="h") hint();
  else if(k==="tab"){ e.preventDefault(); TAB=(TAB+1)%3; drawTray(); } });

/* ---------- menu ---------- */
function toMenu(){ gen++; busy=false; document.body.className="m-menu"; var t=today(), lv=lvOf(t.wd);
  var doneToday=ST.day===t.n&&ST.cur&&ST.cur.done;
  $("#bPlay").textContent=doneToday?"Today's Orders ✓":"Today's Orders"; $("#bPlay").classList.toggle("k-ghost",!!doneToday);
  $("#bBonus").style.display=doneToday?"":"none";
  $("#mfoot").textContent=(ST.n?("Smoothies served: "+ST.n+". "):"")+DAYN[t.wd]+": "+FOOT[lv];  setTimeout(signFont,30); }
$("#bPlay").onclick=function(){ BWK.sfx("open"); start(false); };
$("#bBonus").onclick=function(){ BWK.sfx("open"); start(true); };
$("#bHow").onclick=function(){ BWK.sheet('<div class="how"><h2>How to Play</h2><p>'+INTRO+'</p><p>'+HOW+'</p>'+
  '<p><b>Bottom first!</b> A smoothie is poured from the bottom of the cup up, so the bottom layer on the card is the first one you make.</p>'+
  '<p>A layer can blend two fruits, like Strawberry-Banana. Creamy things (ice cream, yogurt, coconut milk) make a layer paler, and juices make it brighter. The card always shows them.</p>'+
  '<p>Each day gets a little harder. On Friday the card shows names instead of pictures. On the weekend, the card turns over once you start: remember the order, or tap Peek (the first peek is free).</p>'+
  '<p>Making a real smoothie at home? Ask a grown-up to help with the blender.</p><p>On a computer, press 1-7 for the tray, Tab to switch shelves, B to blend, P to pour, E to empty, H for a hint.</p></div>'); BWK.say(HOW); };
$("#bBack").onclick=BWG.toOutpost;
$("#tMenu").onclick=function(){ BWK.sfx("tap"); toMenu(); };
$("#tHint").onclick=hint; $("#aBlend").onclick=blend; $("#aPour").onclick=pourOrServe; $("#aEmpty").onclick=empty;
$("#blender").onclick=function(){ if(P&&P.bl.length&&!P.blended) blend(); };

/* the menu emblem: a little layered smoothie */
(function(){ var c=[IG.strawberry.c,IG.banana.c,IG.kiwi.c,IG.blueberry.c], s='<defs><clipPath id="emC"><path d="M44 22H88L82 86H50Z"/></clipPath><linearGradient id="emG" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset=".3" stop-color="#fff" stop-opacity=".25"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient></defs><g clip-path="url(#emC)">';
  c.forEach(function(k,i){ s+='<rect x="40" y="'+(70-i*15)+'" width="52" height="17" fill="'+hex(k)+'"/>'; }); s+='<rect x="40" y="20" width="52" height="70" fill="url(#emG)"/></g>'+
  '<path d="M44 22H88L82 86H50Z" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2"/><path d="M50 22q16-16 32 0z" fill="#fffaf0"/><circle cx="66" cy="9" r="5" fill="#c8102e"/><path d="M78 30L90 2" stroke="#f06a9a" stroke-width="4" stroke-linecap="round"/>';
  $("#smEmb").innerHTML=s; })();

var INTRO="Sophie's Smoothie Stand! Sophie's animal friends are thirsty. Make each smoothie just like the order card, layer by layer, from the bottom up.";
var HOW="Look at the order card. Start with the bottom layer: tap its fruit to put it in the blender, then tap Blend, then Pour. Make the next layer the same way, all the way to the top. Then add the toppings and tap Serve. Stuck? Tap Hint.";
var FIRST="Start with the bottom layer! Put its fruit in the blender.", POUR="Now tap Pour!", NEXT="Yum! Now the next layer up.", TOPS="All the layers are in! Now add the toppings.";
var SERVE="Ready! Tap Serve.", THANKS="Yum! Thank you, Sophie!", LAST="Toppings go on last!", NTOP="Oops! That topping isn't on the order card.";
var CLOSE="Close! Check the order card for this layer.", NOPE="Not quite. Check the order card.", HINT="Here's Sophie's tip!";
var MEM="Remember the order! The card turns over when you start. Tap Peek to look again.";
var WIN="All the orders are done! Come back tomorrow for new orders.", WINP="All done! You earned a new patch for your badge wall!", WINB="Smoothie served! Another happy customer!";
var BONUS="Here's a bonus smoothie order!";
var L={"sm-intro":INTRO,"sm-how":HOW,"sm-first":FIRST,"sm-pour":POUR,"sm-next":NEXT,"sm-tops":TOPS,"sm-serve":SERVE,"sm-thanks":THANKS,"sm-last":LAST,"sm-ntop":NTOP,
  "sm-close":CLOSE,"sm-nope":NOPE,"sm-hint":HINT,"sm-mem":MEM,"sm-win":WIN,"sm-winp":WINP,"sm-winb":WINB,"sm-bonus":BONUS};
ING.forEach(function(x){ L["sm-i-"+x.id]=x.s+"!"; });
BWK.lines(L);
toMenu();
BWK.init({here:"smoothie", voice:"outpost", intro:INTRO, noHello:true});
window.SMO={start:start,tap:function(id){ tapIng(id,document.querySelector('.ing[data-id="'+id+'"]')); },blend:blend,pour:pourOrServe,empty:empty,hint:hint,peek:peek,
  tab:function(t){ TAB=t; drawTray(); }, setTops:function(a){ O().T=a; drawTicket(); drawTray(); },
  solveLayer:function(){ var o=O(); if(P.pl>=o.L.length) return; var L=o.L[P.pl]; P.bl=L.f.concat(L.a?[L.a]:[]); P.blended=true; drawBlender(); drawTray(); },
  orders:function(lv,seed){ return dayOrders(lv,seed).map(function(o){ return {L:o.L.map(layerName),T:o.T,cu:CUST[o.cu].n}; }); },
  state:function(){ return P&&{lv:P.lv,oi:P.oi,pl:P.pl,tp:P.tp,bl:P.bl,blended:P.blended,hints:P.hints,done:P.done,busy:busy,cover:P.cover,order:{L:O().L.map(layerName),T:O().T},geo:GEO}; },lines:L};
})();
