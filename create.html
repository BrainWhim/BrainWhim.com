<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create · BrainWhim</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --studio-bg: #0D1630; 
            --aurora-hombre-top: #1e3a60;  
            --aurora-hombre-mid: #134e5e;  
            --aurora-hombre-top-p: #1E3A60; 
            --track-glow: #0066CC;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--studio-bg) !important; color: #CBD5E1; font-family: 'Montserrat', sans-serif; padding-top: 110px; overflow-x: hidden;
        }
        
        header {
            background: linear-gradient(to top, rgba(13, 22, 48, 0.5) 0%, var(--aurora-hombre-mid) 60%, var(--aurora-hombre-top) 100%) !important;
            backdrop-filter: blur(25px) !important; -webkit-backdrop-filter: blur(25px) !important;
            border-bottom: 1px solid rgba(16, 185, 129, 0.25) !important; padding: 0 4% !important;
            display: flex !important; justify-content: space-between !important; align-items: center !important;
            position: fixed !important; top: 0; left: 0; width: 100%; height: 110px !important; z-index: 999999 !important; box-shadow: 0 12px 45px rgba(0,0,0,0.45) !important;
        }
        .header-brand-container { display: flex !important; align-items: center !important; text-decoration: none !important; color: inherit !important; }
        .header-logo-asset { width: 100px !important; height: 100px !important; object-fit: contain !important; margin-right: -8px !important; }
        .header-brand-text { font-size: 30px !important; display: flex !important; align-items: baseline !important; margin-left: -4px !important; }
        .brand-brain { font-family: 'Montserrat', sans-serif !important; font-weight: 600 !important; color: #ffffff !important; letter-spacing: -0.6px !important; }
        .brand-whim { font-family: 'Pacifico', cursive !important; font-weight: 400 !important; color: #7EB6D9 !important; }

        .page-wrap { min-height: calc(100vh - 110px); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; }
        .aurora-glow { position: absolute; width: 75vw; height: 75vw; max-width: 750px; max-height: 750px; border-radius: 50%; filter: blur(160px); background: radial-gradient(circle, var(--track-glow) 0%, transparent 70%); top: 10%; opacity: 0.45; pointer-events: none; z-index: 1; }

        .orbit { position: relative; width: 72vw; height: 72vw; max-width: 420px; max-height: 420px; display: flex; justify-content: center; align-items: center; z-index: 5; }
        .orbit::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(107, 163, 201, 0.15); box-shadow: 0 0 18px rgba(107, 163, 201, 0.1), inset 0 0 18px rgba(107, 163, 201, 0.05); }
        
        .center-orb {
            width: 31vw; height: 31vw; max-width: 170px; max-height: 170px; position: absolute; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-weight: 700; font-size: 18px; z-index: 10; animation: coreBreathe 5.5s ease-in-out infinite;
            background: radial-gradient(circle at 30% 24%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 30%), radial-gradient(circle at 32% 28%, #4a5d86 0%, #1a2338 52%, #070b14 78%, #020308 100%);
            box-shadow: 0 20px 45px rgba(0,0,0,0.8), 0 0 50px var(--track-glow), inset -16px -18px 28px rgba(0,0,0,0.72), inset 10px 8px 16px rgba(255,255,255,0.1);
        }
        .center-orb-icon { width: 46px; height: 46px; object-fit: contain; margin-bottom: 8px; }

        .orbit-ring { position: absolute; inset: 0; animation: coreSystemSpin 28s linear infinite; pointer-events: none; }
        .sat-wrap { position: absolute; top: 50%; left: 50%; width: 24vw; height: 24vw; max-width: 120px; max-height: 120px; margin: 0; pointer-events: none; }
        
        .sat-orb {
            width: 100%; height: 100%; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-decoration: none; font-size: 10px; font-weight: 600; text-align: center; padding: 8px; pointer-events: auto;
            background: radial-gradient(circle at 30% 24%, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 25%), radial-gradient(circle at 32% 28%, #4a5d86 0%, #1a2338 52%, #070b14 78%, #020308 100%);
            box-shadow: 0 20px 45px rgba(0,0,0,0.8), 0 0 35px var(--track-glow), inset -12px -12px 20px rgba(0,0,0,0.7), inset 6px 6px 12px rgba(255,255,255,0.1);
            animation: counterSystemSpin 28s linear infinite; transition: transform 0.2s ease;
        }
        .sat-orb:hover { transform: scale(1.08); }
        .orb-icon { font-size: 26px; margin-bottom: 3px; display: block; }

        .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-168px) rotate(0deg); }
        .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-168px) rotate(-120deg); };
        .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-168px) rotate(-240deg); }

        @keyframes coreSystemSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes counterSystemSpin { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        @keyframes coreBreathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.045); } }

        .back-link, .page-nav a { color: #7EB6D9; text-decoration: none; font-weight: 600; transition: color 0.2s; z-index: 10; }
        .back-link:hover, .page-nav a:hover { color: #fff; }
        .back-link { margin-top: 28px; margin-bottom: 6px; font-size: 14px; }
        .page-nav { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
        .page-nav a { font-size: 13px; }

        @media (max-width: 992px) {
            header { height: 88px !important; padding: 0 16px; }
            .header-logo-asset { width: 58px !important; height: 58px !important; }
            .header-brand-text { font-size: 20px !important; margin-left: -8px !important; }
            body { padding-top: 88px; }
            .orbit { width: 72vw; height: 72vw; max-width: 420px; max-height: 420px; }
            .center-orb { width: 38vw; height: 38vw; max-width: 150px; max-height: 150px; }
            .sat-orb, .sat-wrap { width: 26vw; height: 26vw; max-width: 96px; max-height: 96px; }
            .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-118px) rotate(0deg); }
            .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-118px) rotate(-120deg); }
            .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-118px) rotate(-240deg); }
        }
    </style>
</head>
<body>
    <header>
        <a class="header-brand-container" href="index.html">
            <img src="logo-image.png" alt="BrainWhim" class="header-logo-asset">
            <div class="header-brand-text"><span class="brand-brain">Brain</span><span class="brand-whim">Whim</span></div>
        </a>
    </header>

    <div class="page-wrap">
        <div class="aurora-glow"></div>
        <div class="orbit">
            <div class="center-orb">
                <img src="orb-brain.png" alt="" class="center-orb-icon">
                <span>Create</span>
            </div>            
            <div class="orbit-ring">
                <div class="sat-wrap sat-1">
                    <a class="sat-orb" href="#">
                        <span class="orb-icon">✨</span>
                        Creative<br>Tools
                    </a>                   
                </div>
                <div class="sat-wrap sat-2">
                    <a class="sat-orb" href="#">
                        <span class="orb-icon">🛠️</span>
                        Projects<br>Ideas
                    </a>                   
                </div>
                <div class="sat-wrap sat-3">
                    <a class="sat-orb" href="#">
                        <span class="orb-icon">📈</span>
                        Trending<br>Now
                    </a>                   
                </div>
            </div>
        </div>               

        <a class="back-link" href="index.html">Back to BrainWhim</a>
        <div class="page-nav">
            <a href="learn.html">Learn</a>
            <a href="live.html">Live</a>
            <a href="play.html">Play</a>
            <a href="create.html">Create</a>
        </div>
    </div>
</body>
</html>
