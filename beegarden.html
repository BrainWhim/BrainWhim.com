<style>
/* Jack's Bee Garden (The Outpost · The Workshop), Nov 14. Named by Jack (10, a young beekeeper). A sliding puzzle in a
   garden bed: slide the hive boxes, honey frames and flower boxes until the bee can fly out of the gate to the flowers.
   After each win, one of Jack's own bee facts. Engine: the jbCore script below (pool grown with the Harbor's tools). */
:root{--bgx:50%;--bgy:62%}
/* Nov 15: the realistic look (ChatGPT photos in jb/: the twilight bee-garden deck behind, the cedar bed, the pieces) */
.bg{background-image:url("jb/bg-sm.jpg");filter:blur(1.5px) brightness(.62) saturate(1.1)}
@media (min-width:1100px){.bg{background-image:url("jb/bg.jpg")}}
.frm.ph{background:url("jb/bed.webp") 0 0/100% 100% no-repeat;box-shadow:0 18px 34px rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.35)}
.frm.ph::after{display:none}
.bed.ph{background:linear-gradient(90deg,rgba(15,35,5,.3) 0 1px,transparent 1px) 0 0/var(--s) var(--s),linear-gradient(180deg,rgba(15,35,5,.3) 0 1px,transparent 1px) 0 0/var(--s) var(--s);
  box-shadow:inset 2px 3px 8px rgba(10,30,5,.35)}
.gate.ph{background:url("jb/bed.webp?v=1115a") 50% 50%/700% 700%;box-shadow:inset 0 4px 6px -3px rgba(10,30,5,.6),inset 0 -4px 6px -3px rgba(10,30,5,.6)}
#yard.ph .post{background:linear-gradient(135deg,#d3a066,#8d5a2c 70%,#6f4420);box-shadow:1px 2px 3px rgba(0,0,0,.5),inset 1px 1px 0 rgba(255,226,180,.6)}
#yard.ph .gdoor{background:linear-gradient(180deg,#d9ad75,#9a6634);background-image:none;box-shadow:1px 2px 3px rgba(0,0,0,.45)}
.pc.ph{border-radius:2.5%;box-shadow:2px 4px 0 rgba(15,25,5,.32),3px 8px 10px rgba(10,20,5,.42)}
.pc.ph.lift{box-shadow:3px 9px 0 rgba(15,25,5,.22),6px 16px 20px rgba(10,20,5,.42)}
.pc.bee .bwu,.pc.bee .bwl{transform-box:view-box;transform-origin:113px 50px;animation:bflapu .11s ease-in-out infinite alternate}
.pc.bee .bwl{animation-name:bflapl}
.pc.bee.rest .bwu,.pc.bee.rest .bwl{animation-duration:1.4s}
@keyframes bflapu{to{transform:rotate(-16deg)}}
@keyframes bflapl{to{transform:rotate(16deg)}}
#play{flex-direction:column;align-items:center;justify-content:flex-start;gap:8px}
.cbar{width:min(640px,100%);display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:16px;color:#2b2116;flex:none;
  background:linear-gradient(180deg,#fffaf0,#f1e3c2);box-shadow:0 4px 0 #c9b384,0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 #fff}
.cday{flex:1;text-align:center;line-height:1.15}
.cday b{display:block;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#a0661c}
.cday span{font-size:14px;font-weight:700;color:#5a4220}
.ib{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:15px;min-height:40px;padding:0 13px;border-radius:12px;color:#3a2306;
  background:linear-gradient(180deg,#ffe7a6,#e9c46a);box-shadow:0 3px 0 #a97a1c}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #a97a1c}
.ib.gh{background:rgba(120,80,20,.1);box-shadow:none;color:#6b4a1a}
.ib:disabled{opacity:.45;cursor:default}
.cmsg{min-height:22px;max-width:640px;text-align:center;font-weight:700;font-size:16px;line-height:1.3;color:#ffe9b8;text-shadow:0 2px 6px rgba(0,0,0,.7);padding:0 6px;flex:none}
#yard{position:relative;flex:1 1 auto;width:100%;max-width:900px;min-height:0;user-select:none;-webkit-user-select:none;touch-action:none}
/* the raised bed: a thick wooden frame, lit from the top left */
.frm{position:absolute;border-radius:14px;
  background:repeating-linear-gradient(90deg,rgba(60,30,10,0) 0 31px,rgba(60,30,10,.13) 31px 33px,rgba(255,220,170,.06) 33px 52px,rgba(60,30,10,.09) 52px 53px),
    linear-gradient(160deg,#d29b5f 0%,#b47a43 35%,#8d5a2c 75%,#6f4420 100%);
  box-shadow:0 18px 34px rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.35),inset 2px 2px 0 rgba(255,226,180,.55),inset -3px -3px 0 rgba(60,30,10,.45)}
.frm::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(60,30,10,.35)}
.bed{position:absolute;border-radius:6px;overflow:visible;
  background:
    linear-gradient(90deg,rgba(30,70,20,.22) 0 1px,transparent 1px) 0 0/var(--s) var(--s),
    linear-gradient(180deg,rgba(30,70,20,.22) 0 1px,transparent 1px) 0 0/var(--s) var(--s),
    radial-gradient(circle at 30% 30%,rgba(255,255,255,.07) 0 2px,transparent 3px) 0 0/calc(var(--s)*.37) calc(var(--s)*.31),
    radial-gradient(circle at 70% 60%,rgba(20,60,10,.12) 0 1.5px,transparent 2.5px) 0 0/calc(var(--s)*.29) calc(var(--s)*.41),
    linear-gradient(150deg,#8fcf6a,#6cb24c 55%,#5b9d3f);
  box-shadow:inset 3px 4px 10px rgba(20,50,10,.55),inset -1px -1px 0 rgba(255,255,255,.12)}
.gate{position:absolute;z-index:1;
  background:linear-gradient(150deg,#86c862,#66ab48);box-shadow:inset 0 4px 6px -3px rgba(20,50,10,.5),inset 0 -4px 6px -3px rgba(20,50,10,.5)}
.gdoor{position:absolute;z-index:1;height:5px;border-radius:3px;transform-origin:0 50%;background:linear-gradient(180deg,#fffaf0,#d9cfb8);box-shadow:1px 2px 2px rgba(0,0,0,.4);
  background-image:linear-gradient(90deg,#fffaf0 0 20%,#d9cfb8 20% 24%,#fffaf0 24% 46%,#d9cfb8 46% 50%,#fffaf0 50% 72%,#d9cfb8 72% 76%,#fffaf0 76%)}
.post{position:absolute;z-index:2;border-radius:4px;background:linear-gradient(90deg,#f6efe0,#d9cfb8);box-shadow:1px 2px 3px rgba(0,0,0,.45),inset 0 1px 0 #fff}
.flw{position:absolute;z-index:0;pointer-events:none;overflow:visible}
.flw .sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
.flw .sw:nth-child(2n){animation-duration:5.2s;animation-delay:-1.3s}
@keyframes sway{50%{transform:rotate(4deg)}}
.bwp{position:absolute;transform:translate(-50%,-50%);font:800 10px/1 Outfit,system-ui,sans-serif;letter-spacing:.06em;color:#4a300c;z-index:2;
  padding:3px 7px 2px;border-radius:4px;background:linear-gradient(180deg,#f6dc8e,#c99a3c);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 1px 2px rgba(0,0,0,.5)}
/* the pieces */
.pc{position:absolute;left:0;top:0;z-index:3;cursor:grab;-webkit-tap-highlight-color:transparent;touch-action:none;
  border-radius:12%;filter:none;box-shadow:2px 4px 0 rgba(30,40,10,.28),3px 7px 10px rgba(20,40,10,.35)}
.pc.v{border-radius:12%/6%}
.pc.h3{border-radius:6%/12%}.pc.h2{border-radius:9%/12%}.pc.v2{border-radius:12%/9%}
.pc svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.pc.snap{transition:transform .2s cubic-bezier(.3,.8,.35,1.15)}
.pc.lift{z-index:6;cursor:grabbing;box-shadow:3px 8px 0 rgba(30,40,10,.2),6px 16px 20px rgba(20,40,10,.38)}
.pc.lift svg{transform:scale(1.03)}
.pc.bee{box-shadow:none;border-radius:40%}
.pc.bee .wg{transform-box:fill-box;transform-origin:50% 100%;animation:flap .24s ease-in-out infinite alternate}
.pc.bee .wg2{animation-delay:-.12s}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.72)}}
.pc.bee.rest .wg{animation:flap 1.6s ease-in-out infinite alternate}
.pc.out{transition:transform 1.4s cubic-bezier(.45,.05,.55,1),opacity .5s 1s;opacity:0}
.pc .ring{position:absolute;inset:-5px;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .2s}
.pc.ha .ring{opacity:1;box-shadow:0 0 0 4px #ffd98a,0 0 20px 6px rgba(242,190,69,.9);animation:hring .8s ease-in-out infinite}
@keyframes hring{50%{opacity:.4}}
.pc .arw{position:absolute;left:50%;top:50%;width:44%;max-width:56px;aspect-ratio:1;transform:translate(-50%,-50%) rotate(var(--a));pointer-events:none;
  display:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.pc.ha .arw{display:block;animation:nud .8s ease-in-out infinite}
@keyframes nud{50%{margin-left:calc(var(--dx)*8px);margin-top:calc(var(--dy)*8px)}}
.pc.bump{animation:bump .28s}
@keyframes bump{30%{margin-left:calc(var(--bx)*4px);margin-top:calc(var(--by)*4px)}}
.spk{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;z-index:10;pointer-events:none;
  background:radial-gradient(circle,#fff 0 20%,rgba(255,240,180,.9) 30%,transparent 70%);animation:spk .9s ease-out forwards}
@keyframes spk{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.ctools{display:flex;gap:10px;justify-content:center;flex:none;padding-bottom:2px}
.ctools .k-btn{min-height:46px;padding:0 20px;font-size:17px}
.stars{font-size:34px;letter-spacing:4px;color:#f2be45;text-shadow:0 2px 0 #8a5f12;margin:2px 0 4px}
.stars i{font-style:normal;color:rgba(255,255,255,.18);text-shadow:none}
.fact{display:flex;gap:10px;align-items:flex-start;text-align:left;margin:10px 0 12px;padding:10px 12px;border-radius:14px;cursor:pointer;color:#3b2a14;
  background:linear-gradient(180deg,#f4ead3,#e6d6b2);box-shadow:0 3px 0 #b99c62,inset 0 1px 0 #fff}
.fact svg{flex:none;width:60px;height:34px;margin-top:4px}
.fact b{display:block;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:#a0661c;margin-bottom:2px}
.fact span{font-size:16px;line-height:1.35;font-weight:600}
.mix{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#ffe9b8;text-shadow:0 2px 6px #000}
@media (max-height:620px){.cmsg{font-size:14px;min-height:18px}.ib{min-height:34px;font-size:14px}.ctools .k-btn{min-height:40px;font-size:15px}.cday span{font-size:13px}.fact span{font-size:15px}}
@media (prefers-reduced-motion:reduce){.pc.snap{transition-duration:.01s}.pc.bee .wg,.pc.bee .bwu,.pc.bee .bwl,.flw .sw,.pc.ha .ring,.pc.ha .arw{animation:none}}
</style>

  drag={i:i,id:e.pointerId,x:e.clientX,y:e.clientY,p0:Z.P[i],lo:R[0],hi:R[1],at:Z.P[i],side:false,moved:false};
  sGrab(); if(i===0){ buzzOn(); buzzSpeed(0); drag.lt=performance.now(); drag.lp=Z.P[i]; }
  el.onpointermove=move; el.onpointerup=el.onpointercancel=up; }
function move(e){ if(!drag||e.pointerId!==drag.id) return; var b=Z.B[drag.i], s=GEO.s;
  var along=(b.h?e.clientX-drag.x:e.clientY-drag.y)/s, across=(b.h?e.clientY-drag.y:e.clientX-drag.x)/s;
  if(Math.abs(along)>.08) drag.moved=true;
  if(!drag.moved&&Math.abs(across)>.45&&!drag.side){ drag.side=true; sideNote(drag.i); }
  var p=Math.max(drag.lo,Math.min(drag.hi,drag.p0+along)); drag.at=p;
  if(drag.i===0){ var now=performance.now(), dt=Math.max(16,now-drag.lt); buzzSpeed(Math.abs(p-drag.lp)*1000/dt); drag.lt=now; drag.lp=p;
    clearTimeout(drag.bt); drag.bt=setTimeout(function(){ buzzSpeed(0); },140); }
  var q=px(drag.i,p); EL[drag.i].style.transform="translate("+q.x+"px,"+q.y+"px)"; }
function up(e){ if(!drag||e.pointerId!==drag.id) return; var i=drag.i, el=EL[i], np=Math.round(drag.at), p0=drag.p0, d=drag;
  el.onpointermove=el.onpointerup=el.onpointercancel=null; clearTimeout(d.bt); if(i===0) buzzOff(); drag=null; el.classList.remove("lift"); el.classList.add("snap"); place(i,np);
  if(i===0) el.classList.add("rest");
  if(np!==p0){ Z.hist.push({P:Z.P.slice(),moves:Z.moves}); Z.P[i]=np; Z.moves++; sSlide(Math.abs(np-p0)); setTimeout(sThunk,120); tools(); saveCur();
    if(G.solved(Z.P)) win(); else if(said.first!==1&&ST.n<3){ said.first=1; msg("Nice! Keep clearing the way to the gate."); } }
  else if(!d.moved&&!d.side){ /* a tap: wiggle the way it can go */
    if(d.lo===d.hi){ bump(i,0); sNope(); msg(i===0?"The bee is blocked. Slide pieces out of its way!":"That one is stuck for now. Move something else first."); }
    else { bump(i,d.hi>p0?1:-1); msg(Z.B[i].h?"Drag it left or right to slide it.":"Drag it up or down to slide it."); } } }
function bump(i,dir){ var b=Z.B[i], el=EL[i]; el.style.setProperty("--bx",b.h?dir:0); el.style.setProperty("--by",b.h?0:dir);
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
function sideNote(i){ var b=Z.B[i]; sNope(); var t=b.h?SIDEH:SIDEV; msg(t); if(!said.side){ said.side=1; BWK.say(SIDE); } }

function slideTo(i,np,cb){ var el=EL[i], p0=Z.P[i]; busy=true; el.classList.add("snap"); el.style.transition="transform "+(.18+.08*Math.abs(np-p0))+"s cubic-bezier(.3,.8,.35,1.1)";
  Z.hist.push({P:Z.P.slice(),moves:Z.moves}); Z.P[i]=np; Z.moves++; place(i,np); sSlide(Math.abs(np-p0)); if(i===0) buzzFor(.25+.08*Math.abs(np-p0));
  var g=gen; setTimeout(function(){ if(g!==gen) return; el.style.transition=""; sThunk(); busy=false; tools(); saveCur(); if(G.solved(Z.P)) win(); if(cb) cb(); },220+80*Math.abs(np-p0)); }
function sparkle(x,y,n,r){ var bed=$("#bed"); for(var k=0;k<n;k++){ var s=document.createElement("div"), a=k/n*Math.PI*2; s.className="spk"; s.style.left=x+"px"; s.style.top=y+"px";
  s.style.setProperty("--dx",(Math.cos(a)*r)+"px"); s.style.setProperty("--dy",(Math.sin(a)*r-10)+"px"); bed.appendChild(s); setTimeout(function(q){ return function(){ q.remove(); }; }(s),950); } }
function undo(){ if(!Z||busy||!Z.hist.length||Z.done) return; clearHint(); var h=Z.hist.pop(); Z.P=h.P; Z.moves=h.moves; BWK.sfx("tap");
  Z.P.forEach(function(p,i){ EL[i].classList.add("snap"); place(i,p); }); tools(); saveCur(); msg("Undone."); }
function reset(){ if(!Z||busy||Z.done||!Z.hist.length) return; clearHint(); Z.hist.push({P:Z.P.slice(),moves:Z.moves}); Z.P=Z.P0.slice(); Z.moves=0;
  BWK.sfx("whoosh"); Z.P.forEach(function(p,i){ EL[i].classList.add("snap"); place(i,p); }); tools(); saveCur(); msg("Fresh start! (Undo brings your moves back.)"); }
function hint(){
  if(!Z||busy||Z.done||drag) return; clearHint(); var path=G.solve(Z.B,Z.P); if(!path||!path.length) return;
  var m=path[0], i=m[0], b=Z.B[i], dir=m[1]>Z.P[i]?1:-1; Z.hints++; tools(); saveCur(); sHint();
  var el=EL[i], ang=b.h?(dir>0?0:180):(dir>0?90:-90); el.style.setProperty("--a",ang+"deg"); el.style.setProperty("--dx",b.h?dir:0); el.style.setProperty("--dy",b.h?0:dir);
  el.classList.add("ha");
  msg("Slide "+LOOK[i].name+" "+(b.h?(dir>0?"right":"left"):(dir>0?"down":"up"))+(Math.abs(m[1]-Z.P[i])>1?" "+Math.abs(m[1]-Z.P[i])+" squares.":" one square."));
  var g=gen; setTimeout(function(){ if(g!==gen||busy||Z.done||drag) return; clearHint(); slideTo(i,m[1]); },1900); }
function starsOf(h){ return h===0?3:h<=2?2:1; }
function factNo(){ if(Z.bonus){ ST.fx=(ST.fx+1)%FACTS.length; save(); return ST.fx; } return ((today().n%FACTS.length)+FACTS.length)%FACTS.length; }
function win(){
  if(Z.done) return; Z.done=true; saveCur(); var g=gen; tools(); clearHint();
  var fresh=BWG.patch("beegarden"); ST.n++; save();
  msg("Buzz! The bee is free!"); sWin();
  var el=EL[0], s=GEO.s; el.classList.remove("rest","snap"); var q=px(0,N-2);
  setTimeout(function(){ if(g!==gen) return; el.classList.add("out"); el.style.transform="translate("+(q.x+s*2.4)+"px,"+(q.y-s*.8)+"px) scale(.8)";
    sparkle(6*s+s*.4,q.y+s/2,10,s*.9); },250);
  setTimeout(function(){ if(g!==gen) return; var st=starsOf(Z.hints), f=factNo();
    var box=BWK.sheet('<h2>To the flowers!</h2>'+BWG.patchLine(fresh)+'<div class="stars">'+"★★★".slice(0,st)+'<i>'+"★★★".slice(0,3-st)+'</i></div>'+
      '<p>You freed the bee in <b>'+Z.moves+'</b> move'+(Z.moves===1?'':'s')+(Z.hints?' with '+Z.hints+' hint'+(Z.hints>1?'s':''):' with no hints')+'.'+
      (Z.moves<=Z.d?' That\'s the fewest moves possible!':' The fewest possible was '+Z.d+'.')+'</p>'+
      '<div class="fact" data-say="'+FSAY[f].replace(/"/g,"&quot;")+'"><svg viewBox="0 0 200 110" aria-hidden="true">'+(ART.ok?'<g transform="translate(0 5)">'+beePhoto()+'</g>':beeSvg())+'</svg><div><b>Jack\'s Bee Fact</b><span>'+FACTS[f]+'</span></div></div>'+
      '<div class="k-row"><button class="k-btn" data-a="more">Bonus Garden</button><button class="k-btn k-ghost" data-a="out">The Outpost</button></div>');
    box.querySelector('[data-a=more]').onclick=function(){ BWK.closeSheet(true); start(true); };
    box.querySelector('[data-a=out]').onclick=BWG.toOutpost;
    BWK.say(fresh?WINP:FSAY[f]);
  },1700);
}

/* ---------- keys on a computer: U undo, H hint ---------- */
document.addEventListener("keydown",function(e){ if(!document.body.classList.contains("m-play")||document.querySelector(".k-veil.on")) return;
  if(e.key==="u"||e.key==="U"||(e.key==="z"&&(e.metaKey||e.ctrlKey))) undo(); else if(e.key==="h"||e.key==="H") hint(); });
function relayout(){ if(!Z||!document.body.classList.contains("m-play")||!EL.length) return; if(busy||drag){ setTimeout(relayout,400); return; }
  var g=GEO; var n=geo(); if(g&&n.s===g.s&&n.x0===g.x0&&n.y0===g.y0) return; build(); if(Z.done) EL[0].style.opacity="0"; }
window.addEventListener("resize",function(){ requestAnimationFrame(relayout); });
if(window.ResizeObserver) new ResizeObserver(function(){ requestAnimationFrame(relayout); }).observe($("#yard"));

/* ---------- menu ---------- */
function toMenu(){ gen++; busy=false; drag=null; buzzOff(); document.body.className="m-menu"; var t=today();
  var doneToday=ST.day===t.n&&ST.cur&&ST.cur.done;
  $("#bPlay").textContent=doneToday?"Today's Garden ✓":"Today's Garden";
  $("#bBonus").style.display=doneToday?"":"none"; $("#bPlay").classList.toggle("k-ghost",!!doneToday);
  $("#mfoot").textContent=(ST.n?("Bees freed: "+ST.n+". "):"")+DAYN[t.wd]+": "+FOOT[t.wd]; }
$("#bPlay").onclick=function(){ BWK.sfx("open"); start(false); };
$("#bBonus").onclick=function(){ BWK.sfx("open"); start(true); };
$("#bHow").onclick=function(){ BWK.sheet('<div class="how"><h2>How to Play</h2><p>'+INTRO+'</p><p>'+HOW+'</p><p>Hive boxes are three squares long. Honey frames and flower boxes are two. The bee always flies out through the gate on the right.</p><p>Every time you free the bee, you get one of Jack\'s Bee Facts. Jack is a real young beekeeper!</p><p>On a computer: drag with the mouse, U to undo, H for a hint.</p></div>'); BWK.say(HOW); };
$("#bBack").onclick=BWG.toOutpost;
$("#tMenu").onclick=function(){ BWK.sfx("tap"); toMenu(); };
$("#tHint").onclick=function(){ hint(); };
$("#tUndo").onclick=undo; $("#tReset").onclick=reset;

var INTRO="Jack's Bee Garden! Slide the hive boxes, honey frames and flower boxes out of the way, so the bee can fly out the gate to the flowers.";
var HOW="Drag a piece to slide it. Pieces only slide the long way, along their own row or column. Each slide counts as one move, however far it goes. Clear a path, then slide the bee out the gate! Stuck? Tap Hint. Made a mistake? Tap Undo.";
var TAP1="Drag a piece to slide it. Clear a path for the bee!";
var SIDE="Pieces only slide the long way.", SIDEH="That one only slides left and right.", SIDEV="That one only slides up and down.";
var WINP="Buzz! The bee made it to the flowers! You earned a new patch for your badge wall!";
var BONUS="Here's a bonus garden!";
var FSAY=FACTS.map(function(f){ return "Here's Jack's Bee Fact! "+f; });
var L={"jb-intro":INTRO,"jb-how":HOW,"jb-tap":TAP1,"jb-side":SIDE,"jb-win-patch":WINP,"jb-bonus":BONUS};
FSAY.forEach(function(f,i){ L["jb-f"+(i+1)]=f; });
BWK.lines(L);
toMenu();
BWK.init({here:"beegarden", voice:"outpost", intro:INTRO, noHello:true});
window.JBO={start:start,hint:hint,undo:undo,reset:reset,slide:slideTo,win:win,
  solve:function(cb){ if(!Z||Z.done) return; var p=G.solve(Z.B,Z.P), k=0; (function nx(){ if(!Z||Z.done||k>=p.length){ if(cb) cb(); return; } var m=p[k++]; slideTo(m[0],m[1],nx); })(); },
  state:function(){ return Z&&{s:Z.s,flip:Z.flip,d:Z.d,P:Z.P,moves:Z.moves,hints:Z.hints,done:Z.done,geo:GEO,looks:LOOK.map(function(l){return l.kind;})}; },lines:L,G:G,FACTS:FACTS};
})();
</script>
