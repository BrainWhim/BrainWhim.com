/* ==========================================================================

   Story: Finn's animal friends (the 13 photo animals, sl/c-*.webp) want to play hide-and-seek. Tap Go: they hop in and
   duck behind the bush, the haystack, the barrel, the stump, the flowerpot and the crate while Finn counts to three.
   Little: watch them hide, then tap the hiding spots; a friend pops up ("Peekaboo! It's Biscuit the puppy!"), an empty
   spot lets out a butterfly. Find all 3. Big Moonlet: eyes closed while they hide (the yard goes dark), 6 spots and 4
   friends, ears or a tail peek out, and Finn asks for one friend at a time ("Where is Hazel the fox?"); the wrong friend
   pops up, says who it is and ducks back down. Idle 6 s: a spot with a friend behind it rustles (no voice).

  var PROPS=[
    {id:"bush", cov:0.8,  n:"bush",      ar:1.25, svg:'<svg viewBox="0 0 125 100"><defs><radialGradient id="pkBu" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#8fd46a"/><stop offset=".6" stop-color="#4f9a3a"/><stop offset="1" stop-color="#2f6a24"/></radialGradient></defs><g fill="url(#pkBu)"><circle cx="34" cy="60" r="30"/><circle cx="62" cy="42" r="34"/><circle cx="92" cy="60" r="30"/><rect x="10" y="60" width="105" height="40" rx="18"/></g><g fill="#ff8ab0"><circle cx="40" cy="40" r="4"/><circle cx="80" cy="30" r="4"/><circle cx="96" cy="62" r="4"/><circle cx="58" cy="70" r="4"/><circle cx="24" cy="74" r="4"/></g></svg>'},
    {id:"hay", cov:0.7,   n:"haystack",  ar:1.2,  svg:'<svg viewBox="0 0 120 100"><defs><linearGradient id="pkHa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#c9952e"/></linearGradient></defs><path d="M6 100 Q8 30 60 6 Q112 30 114 100z" fill="url(#pkHa)"/><g stroke="#b5832a" stroke-width="1.6" fill="none" opacity=".7"><path d="M30 92 q6-40 26-70"/><path d="M60 96 q2-40 0-84"/><path d="M90 92 q-6-40-26-70"/><path d="M14 80 q20-8 40 0"/><path d="M66 70 q20-8 40 0"/></g></svg>'},
    {id:"barrel", cov:0.95,n:"barrel",    ar:.82,  svg:'<svg viewBox="0 0 82 100"><defs><linearGradient id="pkBa" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a3c1c"/><stop offset=".45" stop-color="#b8743a"/><stop offset="1" stop-color="#5a3014"/></linearGradient></defs><path d="M10 4 h62 q12 46 0 92 h-62 q-12-46 0-92z" fill="url(#pkBa)"/><g fill="#4a4a50"><rect x="4" y="18" width="74" height="6" rx="3"/><rect x="4" y="76" width="74" height="6" rx="3"/></g><ellipse cx="41" cy="5" rx="31" ry="4" fill="#8a5428"/></svg>'},
    {id:"stump", cov:0.85, n:"tree stump",ar:1.3,  svg:'<svg viewBox="0 0 130 100"><defs><linearGradient id="pkSt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a3a1e"/><stop offset=".5" stop-color="#946236"/><stop offset="1" stop-color="#4a2e16"/></linearGradient></defs><path d="M14 22 h102 l4 70 q8 6 6 8 h-122 q-2-2 6-8z" fill="url(#pkSt)"/><ellipse cx="65" cy="22" rx="51" ry="13" fill="#d8b07a"/><ellipse cx="65" cy="22" rx="34" ry="8" fill="none" stroke="#a87a44" stroke-width="2"/><ellipse cx="65" cy="22" rx="16" ry="4" fill="none" stroke="#a87a44" stroke-width="2"/></svg>'},
    {id:"pot", cov:0.5,   n:"flowerpot", ar:.8,   svg:'<svg viewBox="0 0 80 100"><g stroke="#3f8a2a" stroke-width="3"><path d="M26 50 L22 14"/><path d="M40 50 L40 6"/><path d="M54 50 L58 16"/></g><g fill="#ffcc2a"><circle cx="22" cy="14" r="11"/><circle cx="40" cy="8" r="12"/><circle cx="58" cy="16" r="11"/></g><g fill="#6a3a12"><circle cx="22" cy="14" r="4.5"/><circle cx="40" cy="8" r="5"/><circle cx="58" cy="16" r="4.5"/></g><path d="M8 46 h64 l-8 54 h-48z" fill="#d8784a"/><rect x="4" y="44" width="72" height="12" rx="4" fill="#e8895a"/></svg>'},
    {id:"crate", cov:0.85, n:"crate",     ar:1.2,  svg:'<svg viewBox="0 0 120 100"><g fill="#d8a868" stroke="#9a6a34" stroke-width="2"><rect x="6" y="20" width="108" height="78" rx="4"/></g><g fill="#c49050"><rect x="6" y="38" width="108" height="6"/><rect x="6" y="62" width="108" height="6"/></g><g fill="#e04a3a"><circle cx="30" cy="16" r="10"/><circle cx="52" cy="12" r="10"/><circle cx="76" cy="15" r="10"/><circle cx="96" cy="18" r="9"/></g><g fill="#fff" opacity=".5"><circle cx="27" cy="13" r="3"/><circle cx="49" cy="9" r="3"/><circle cx="73" cy="12" r="3"/></g></svg>'}];
  var PH={};   // the photo props that have loaded
  PROPS.forEach(function(p){ var im=new Image(); im.onload=function(){ PH[p.id]=im.src; p.ar=im.naturalWidth/im.naturalHeight; if(G) layout(); }; im.src="pk/"+p.id+".webp?v="+AV; });
  (function(){ var im=new Image(); im.onload=function(){ document.documentElement.classList.add("pkbg"); }; im.src="pk/bg-sm.jpg?v="+AV; })();
  var BFLY=null; (function(){ var im=new Image(); im.onload=function(){ BFLY=im.src; document.documentElement.classList.add("pkbfly"); }; im.src="pk/butterfly.webp?v="+AV; })();
  function bflyArt(){ if(BFLY) return '<img src="'+BFLY+'" alt="">';
    return '<svg viewBox="0 0 60 60"><g class="w"><path d="M30 30 C14 6 2 14 8 28 C2 40 18 48 30 32z" fill="#ff9ad0" stroke="#c0508a" stroke-width="1.5"/><path d="M30 30 C46 6 58 14 52 28 C58 40 42 48 30 32z" fill="#ffb84a" stroke="#c0802a" stroke-width="1.5"/><circle cx="16" cy="22" r="3" fill="#fff"/><circle cx="44" cy="22" r="3" fill="#fff"/></g><rect x="28.5" y="20" width="3" height="20" rx="1.5" fill="#4a2a1a"/></svg>'; }

  /* where the spots stand, as % of the yard: [x center, y of the ground line, width]; back row first so the front draws on top */
  var SPOTS={
    wide:[[15,62,16],[39,55,14],[61,55,14],[85,62,16],[29,93,20],[71,93,20]],
    tall:[[19,57,25],[50,54,23],[81,57,25],[27,78,28],[73,78,28],[50,98,30]]};

  /* ---------- the game ---------- */
  var G=null, shape="wide", idleT=0, rusT=0;
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function cfg(){ return big?{spots:6,hide:4}:{spots:5,hide:3}; }
  function newGame(){ clearTimers(); var c=cfg(), props=shuffle(PROPS.slice()).slice(0,c.spots), who=shuffle(AN.slice()).slice(0,c.hide);
    var at=shuffle(props.map(function(_,i){ return i; })).slice(0,c.hide);
    G={c:c, props:props, who:who, at:{}, found:[], ph:"ready", want:null, order:[], busy:false};
    who.forEach(function(a,k){ G.at[at[k]]=a; });
    build(); goal(); bar(); }
  function clearTimers(){ clearTimeout(idleT); clearInterval(rusT); if(G) (G.tm||[]).forEach(clearTimeout); }
  function later(f,ms){ var t=setTimeout(f,ms); (G.tm=G.tm||[]).push(t); return t; }

  function fit(){ var w=$("yardW"), W=w.clientWidth, H=w.clientHeight; if(!W||!H) return; var A, s=W/H<1.05?"tall":"wide"; A=s==="tall"?.8:1.6;
    var ww=Math.min(W,H*A,1100), hh=ww/A; $("yard").style.width=Math.round(ww)+"px"; $("yard").style.height=Math.round(hh)+"px";
    shape=s; $("yard").classList.toggle("tall",s==="tall"); if(G) layout(); }
  function spots(){ var L=SPOTS[shape]; return G.c.spots===6?L:(shape==="tall"?L.slice(0,5):[L[0],L[1],L[2],L[3],[50,93,22]]); }
  function build(){ var y=$("yard"); [].slice.call(y.querySelectorAll(".slot")).forEach(function(e){ e.remove(); });
    G.props.forEach(function(p,i){ var b=document.createElement("button"); b.className="slot"; b.dataset.i=i; b.setAttribute("aria-label",p.n);
      var a=G.at[i]; b.innerHTML='<span class="sh"></span>'+(a?'<span class="an"><img src="'+aimg(a)+'" alt="" draggable="false"></span>':'')+'<span class="prop">'+(PH[p.id]?'<img src="'+PH[p.id]+'" alt="" draggable="false">':p.svg)+'</span>';
      y.insertBefore(b,$("eyes")); });
    layout(); }
  function layout(){ var L=spots(), Y=$("yard"), A=shape==="tall"?.8:1.6;
    [].forEach.call(Y.querySelectorAll(".slot"),function(b){ var i=+b.dataset.i, p=G.props[i], s=L[i], hPct=s[2]*A/p.ar;   // height as % of the yard's height
      b.style.left=(s[0]-s[2]/2)+"%"; b.style.width=s[2]+"%"; b.style.top=(s[1]-hPct)+"%"; b.style.height=hPct+"%"; b.style.zIndex=Math.round(s[1]);
      /* every friend is about the same size (60% of the spot's width), and never taller than the solid part of the prop */
      var an=b.querySelector(".an"); if(an){ var Wp=Y.clientWidth*s[2]/100, Hp=Y.clientHeight*hPct/100; var aH=Math.min(Wp*.6,Hp*p.cov*.92), solid=Hp*p.cov-Hp*.04; an.style.height=Math.round(aH)+"px";
        b.style.setProperty("--pop",-Math.round(solid-aH*.2)+"px");          /* found: stands on top of the prop, its feet just behind it */
        b.style.setProperty("--peek",-Math.round(solid-aH+aH*.22)+"px"); }  /* Big: the top 22% (ears) shows over the prop */
      var pr=b.querySelector(".prop"); if(PH[p.id]&&!pr.querySelector("img")) pr.innerHTML='<img src="'+PH[p.id]+'" alt="" draggable="false">'; }); }
  function slotEl(i){ return $("yard").querySelector('.slot[data-i="'+i+'"]'); }
  function anEl(i){ var s=slotEl(i); return s&&s.querySelector(".an"); }
  function setAn(i,tx,ty,cls){ var e=anEl(i); if(!e) return; e.style.setProperty("--tx",tx); e.style.setProperty("--ty",ty); if(cls!=null) e.className="an "+cls; }

  /* hide: Little watches them hop in and duck; Big closes its eyes and they leave a peek (ears up top, or a tail at the side) */
  function go(){ if(!G||G.ph!=="ready") newGame(); BWK.finnStop(); G.ph="hiding"; bar(); var keys=Object.keys(G.at).map(Number);
    keys.forEach(function(i){ var L=spots()[i]; setAn(i,(L[0]<50?"-260%":"260%"),"var(--pop)","hop"); });
    if(big) $("eyes").classList.add("on");
    say(big?SHUT:WATCH,big?"pk-shut":"pk-watch");
    later(function(){ SND.patter(); keys.forEach(function(i,k){ later(function(){ setAn(i,"0","var(--pop)","hop"); SND.hop(k); },k*260); }); },350);
    [0,1,2].forEach(function(n){ later(function(){ var nm=$("num"); nm.innerHTML="<b>"+(n+1)+"</b>"; SND.count(n); },900+n*1000); });
    later(function(){ keys.forEach(function(i,k){ later(function(){ var pk=big?(Math.random()<.5?["0","var(--peek)"]:[(spots()[i][0]<50?"-40%":"40%"),"0"]):["0","0"]; G.at[i].peek=pk; setAn(i,pk[0],pk[1],""); SND.duck(); },k*200); }); },2300);
    later(function(){ $("num").innerHTML=""; $("eyes").classList.remove("on"); G.ph="seek"; bar();
      if(big){ G.order=shuffle(G.who.slice()); say(BREADY,"pk-bready",{onend:function(){ askNext(); }}); later(function(){ if(!G.want&&G.ph==="seek") askNext(); },6000); }
      else say(READY,"pk-ready");
      idle(); },3700); }
  function askNext(){ if(G.ph!=="seek") return; G.want=G.order.filter(function(a){ return G.found.indexOf(a)<0; })[0]||null; goal(); if(G.want) say(WHERE(G.want),"pk-w-"+G.want.id); }
  function idle(){ clearTimeout(idleT); clearInterval(rusT); idleT=setTimeout(function(){ rustle(); rusT=setInterval(rustle,6000); },6000); }
  function rustle(){ if(!G||G.ph!=="seek") return; var ks=Object.keys(G.at).map(Number).filter(function(i){ return G.found.indexOf(G.at[i])<0&&(!G.want||G.at[i]===G.want); }); if(!ks.length) return;
    var i=ks[Math.floor(Math.random()*ks.length)], pr=slotEl(i).querySelector(".prop"); pr.classList.remove("rus"); void pr.offsetWidth; pr.classList.add("rus"); SND.rustle(); }
  function bubble(i,txt){ var s=slotEl(i), e=document.createElement("span"), an=s.querySelector(".an"); e.className="pb"; e.textContent=txt;
    if(an) e.style.bottom=Math.round(s.clientHeight*.04+an.offsetHeight-parseFloat(getComputedStyle(s).getPropertyValue("--pop")||0)+6)+"px"; s.appendChild(e); setTimeout(e.remove.bind(e),1700); }
  function sparkle(i){ var s=slotEl(i); for(var k=0;k<8;k++){ var e=document.createElement("i"), an=k/8*6.28; e.className="spk"; e.textContent="✦"; e.style.left="45%"; e.style.top="-30%";
      e.style.setProperty("--dx",(Math.cos(an)*60).toFixed(0)+"px"); e.style.setProperty("--dy",(Math.sin(an)*50).toFixed(0)+"px"); s.appendChild(e); setTimeout(e.remove.bind(e),1050); } }
  function tap(i){ if(!G||G.ph!=="seek"||G.busy) return; idle(); var pr=slotEl(i).querySelector(".prop"); pr.classList.remove("tap","rus"); void pr.offsetWidth; pr.classList.add("tap");
    var a=G.at[i];
    if(!a){ SND.rustle(); var b=document.createElement("span"); b.className="bf"; b.innerHTML=bflyArt(); slotEl(i).appendChild(b); setTimeout(b.remove.bind(b),2300); SND.tinkle(); say(NONE,"pk-none"); return; }
    if(G.found.indexOf(a)>=0){ SND.peek(AN.indexOf(a)); bubble(i,"Peekaboo!"); return; }
    if(big&&G.want&&a!==G.want){   // the wrong friend pops up, says who it is, and ducks back down
      G.busy=true; setAn(i,"0","var(--pop)","out"); SND.peek(AN.indexOf(a)); bubble(i,"Peekaboo!");
      var w=G.want; say(FOUND(a),"pk-f-"+a.id,{onend:function(){ later(function(){ if(G.ph==="seek"&&G.want===w) say(WHERE(w),"pk-w-"+w.id); },300); }});
      later(function(){ setAn(i,a.peek[0],a.peek[1],""); SND.duck(); G.busy=false; },1700); return; }
    G.found.push(a); S.found++; save(); setAn(i,"0","var(--pop)","out"); SND.peek(AN.indexOf(a)); later(function(){ SND.chime(G.found.length); },350); bubble(i,"Peekaboo!"); sparkle(i); goal();
    if(G.found.length>=G.who.length){ G.ph="won"; G.want=null; clearTimeout(idleT); clearInterval(rusT); say(FOUND(a),"pk-f-"+a.id,{onend:function(){ later(win,250); }}); later(function(){ if(G.ph==="won"&&!G.wonDone) win(); },6500); return; }
    if(big){ G.want=null; goal(); say(FOUND(a),"pk-f-"+a.id,{onend:function(){ later(askNext,300); }}); later(function(){ if(!G.want&&G.ph==="seek") askNext(); },6000); }
    else say(FOUND(a),"pk-f-"+a.id); }
  function win(){ if(G.wonDone) return; G.wonDone=true; S.games++; save(); BWK.played&&BWK.played("peekaboo"); SND.win();
    Object.keys(G.at).forEach(function(i){ setAn(+i,"0","var(--pop)","dance"); sparkle(+i); }); bar(); say(big?BALL:ALL,big?"pk-ball":"pk-all"); }
  function goal(){ if(!G){ $("goal").innerHTML=""; return; } var h="";
    G.who.forEach(function(a){ var got=G.found.indexOf(a)>=0, want=big&&G.want===a&&!got; h+='<span class="who'+(got?' got':'')+(want?' want':'')+'"><img src="'+aimg(a)+'" alt="'+(got||want?a.kind:"")+'"></span>'; });
    $("goal").innerHTML=h; }
  $("yard").addEventListener("click",function(e){ var s=e.target.closest(".slot"); if(s) tap(+s.dataset.i); });

  /* ---------- the bottom row (no data-say: Go makes Finn talk, Nov 17) ---------- */
  function bar(){ var ph=G?G.ph:"ready", lbl=ph==="won"?["↺","Play again"]:ph==="ready"?["▶","Go!"]:["↺","Hide again"];
    $("bar").innerHTML='<button class="chip go'+(ph==="ready"||ph==="won"?' pulse':'')+'" data-a="go" aria-label="'+lbl[1]+'"><em>'+lbl[0]+'</em><span>'+lbl[1]+'</span></button>'+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="games" aria-label="More games"><em>☾</em><span>More games</span></button>'; }
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; BWK.sfx("tap");
    if(b.dataset.a==="go"){ if(G.ph==="hiding") return; newGame(); go(); }
    else if(b.dataset.a==="big"){ big=!big; talked=true; BWK.setBig(big,top); newGame(); }
    else if(b.dataset.a==="games"){ BWK.finnStop(); BWK.sfx("whoosh"); setTimeout(function(){ location.href="moonlets-games.html"; },200); } });
  window.addEventListener("bwk-big",function(e){ if(!!e.detail!==big){ big=!!e.detail; newGame(); } });
  document.addEventListener("click",function(e){ if(talked||!e.target.isConnected||e.target.closest("#yard,.chip,.k-head,.k-sheet,.k-veil")) return; say(big?BHI:HI,big?"pk-bhi":"pk-hi"); });
  window.addEventListener("resize",fit); if(window.ResizeObserver) new ResizeObserver(fit).observe($("yardW"));

  newGame(); fit();
  window.PKO={go:go, newGame:newGame, big:function(on){ big=!!on; BWK.setBig(big); newGame(); },
    state:function(){ return G&&{ph:G.ph, spots:G.props.length, hiders:G.who.map(function(a){return a.id;}), found:G.found.map(function(a){return a.id;}), want:G.want&&G.want.id, at:Object.keys(G.at).map(Number), busy:G.busy, shape:shape}; },
    tapHider:function(){ var ks=Object.keys(G.at).map(Number).filter(function(i){ return G.found.indexOf(G.at[i])<0&&(!G.want||G.at[i]===G.want); }); if(ks.length) tap(ks[0]); return ks[0]; },
    tapWrong:function(){ var ks=Object.keys(G.at).map(Number).filter(function(i){ return G.found.indexOf(G.at[i])<0&&G.want&&G.at[i]!==G.want; }); if(ks.length) tap(ks[0]); return ks[0]; },
    tapEmpty:function(){ for(var i=0;i<G.props.length;i++) if(!G.at[i]){ tap(i); return i; } }};
})();
</script>
