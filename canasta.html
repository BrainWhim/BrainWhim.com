/* ===== Club Room Canasta: the club room's octagonal card table seen from straight above, drawn in the browser =====
   Same machinery as Study Spades and Lakehouse Euchre (four seats, your hand along your side), with each team's
   melds on its own side of the table. Tables (the Tables card): one free, two for Club members. */
.ce-pad{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.ce-fit{position:relative;flex:none}
.ce-table{position:absolute;left:0;top:0;transform-origin:0 0}
.ce-round{position:absolute;left:0;top:0;width:1000px;height:1000px;border-radius:50%;background:var(--ce-rimc);background-image:var(--ce-rim);background-size:cover;
  box-shadow:0 26px 50px rgba(0,0,0,.55),0 6px 12px rgba(0,0,0,.35),inset 0 0 0 2px rgba(0,0,0,.35)}
.ce-round::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 26%,rgba(255,236,200,.3),rgba(255,236,200,0) 46%),radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.4) 100%)}
.ce-bead{position:absolute;inset:34px;border-radius:50%;border:2px solid var(--ce-bead);box-shadow:0 1px 0 rgba(255,240,210,.25),inset 0 1px 0 rgba(0,0,0,.4)}
.ce-felt{position:absolute;inset:44px;border-radius:50%;background-color:var(--ce-feltc);
  background-image:radial-gradient(ellipse 18% 11% at 62% 28%,rgba(255,250,215,.17),rgba(255,250,215,0)),radial-gradient(ellipse 14% 9% at 74% 44%,rgba(255,250,215,.14),rgba(255,250,215,0)),radial-gradient(ellipse 20% 12% at 40% 70%,rgba(255,250,215,.1),rgba(255,250,215,0)),radial-gradient(ellipse 12% 8% at 26% 40%,rgba(255,250,215,.09),rgba(255,250,215,0)),
    radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.36)),var(--ce-felt);background-size:auto,auto,auto,auto,auto,512px 512px;
  box-shadow:inset 0 6px 14px rgba(0,0,0,.6),inset 0 0 0 2px rgba(0,0,0,.45)}
.ce-round.nocups .ce-cup{display:none}
.ce-cup{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#1a1208 0 34%,rgba(0,0,0,0) 36%),radial-gradient(circle at 35% 30%,#fff1c2,#d9b25a 45%,#7a5518 85%);
  box-shadow:0 2px 3px rgba(0,0,0,.5),inset 0 -1px 2px rgba(0,0,0,.4)}
.ce-mono{position:absolute;left:50%;top:922px;transform:translate(-50%,-50%);display:flex;align-items:baseline;font-size:24px;line-height:1;pointer-events:none}
.ce-mono b,.ce-mono i{display:inline-block;color:transparent;background:linear-gradient(170deg,#fff1bf,#d9b25a 45%,#8f6a22 75%,#f3d68b);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.ce-mono b{font:500 1em Montserrat,sans-serif}.ce-mono i{font:400 .76em Pacifico,cursive;font-style:normal;margin-left:.05em;padding-right:.15em}
.ce-shelf{position:absolute;left:10px;right:10px;border-radius:26px;background:rgba(15,23,42,.42);border:1.5px solid rgba(255,255,255,.14);display:none}
.ce-table.narrow .ce-shelf{display:block}
#ceCards{position:absolute;left:0;top:0}
.ce-table .bwc.can{cursor:pointer}
.ce-table .bwc.play .fc{box-shadow:inset 0 0 0 3px rgba(214,164,62,.95),inset 0 0 16px 2px rgba(240,190,90,.45)}
.ce-stock{position:absolute;width:150px;height:190px;margin:-95px 0 0 -75px;border-radius:14px;cursor:pointer}
.ce-stock.glow{box-shadow:0 0 0 3px rgba(242,199,90,.85),0 0 24px 6px rgba(242,199,90,.45);animation:bwc-hint 1.2s ease-in-out infinite}
.ce-lab{position:absolute;transform:translate(-50%,-50%);font:700 18px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,250,232,.82);text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none}
/* the suit asked for after an eight: a gold-rimmed disc beside the pile */
.ce-suit{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 32%,#fffdf6,#efe6d2);box-shadow:0 0 0 4px #c9a24f,0 0 0 6px rgba(0,0,0,.35),0 10px 22px rgba(0,0,0,.45);opacity:0;transform:scale(.6);transition:opacity .3s,transform .3s;pointer-events:none}
.ce-suit.on{opacity:1;transform:scale(1)}
.ce-suit b{font:700 62px "Cormorant Garamond",Georgia,serif;line-height:.9}
.ce-suit small{font:700 13px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#5a4320}
.ce-suit.red b{color:#ad1f2a}.ce-suit.blk b{color:#17171c}
/* glass windows on the table: choose a suit, the end of a hand */
.ce-panel{position:absolute;z-index:700;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;padding:26px 28px 24px;border-radius:22px;background:rgba(15,23,42,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1.5px solid rgba(231,199,122,.5);box-shadow:0 24px 50px rgba(0,0,0,.5);color:#fff;text-align:center;display:none}
.ce-panel.on{display:block}
.ce-panel .k{margin:0 0 6px;font:700 15px Montserrat,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#e6c25a}
.ce-panel h3{margin:0 0 10px;font:700 34px Montserrat,sans-serif}

.ce-panel p b{color:#f0d27a}
.ce-suits{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ce-suits button{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,250,240,.94);cursor:pointer;font:700 22px Montserrat,sans-serif;color:#17171c}
.ce-suits button b{font:700 46px "Cormorant Garamond",Georgia,serif;line-height:.8}
.ce-suits button.red{color:#ad1f2a}
.ce-suits button.best{box-shadow:0 0 0 3px #e9b949}
.ce-panel .pk-btn{display:inline-block;width:auto;min-width:240px;padding:14px 26px;font-size:21px;margin:4px 6px 0}
.ce-toast{position:absolute;z-index:650;left:50%;top:620px;transform:translate(-50%,-50%);padding:12px 22px;border-radius:14px;background:rgba(15,23,42,.84);border:1.5px solid rgba(231,199,122,.6);color:#f3d68b;font:700 20px Montserrat,sans-serif;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
.ce-toast.on{opacity:1}
/* portrait phones: the table is drawn small, so its windows and labels are drawn bigger */
.ce-table.narrow .ce-panel{transform:translate(-50%,-50%) scale(1.7)}
.ce-table.narrow .ce-toast{transform:translate(-50%,-50%) scale(1.7)}
.ce-table.narrow .ce-lab{font-size:30px}
.ce-table.narrow .ce-suit{width:150px;height:150px;margin:-75px 0 0 -75px}
.ce-table.narrow .ce-suit b{font-size:78px}.ce-table.narrow .ce-suit small{font-size:17px}
/* melds in your hand: a gold line under each group; the card you've chosen to throw stands up */
.ce-bar{position:absolute;height:5px;border-radius:3px;background:linear-gradient(90deg,#d9b25a,#f3d68b,#d9b25a);box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;z-index:690;opacity:0;transition:left .22s,top .22s,width .22s,opacity .2s}
.ce-bar.on{opacity:1}
.ce-table.narrow .ce-bar{height:8px;border-radius:4px}
.ce-table .bwc.slide{transition:transform .14s ease-out}
.ce-table .bwc.arr{z-index:950!important;cursor:grabbing;box-shadow:0 4px 4px rgba(0,0,0,.25),0 18px 30px rgba(0,0,0,.45)}
.ce-table .bwc.pick .fc{box-shadow:inset 0 0 0 4px #e9b949,inset 0 0 20px 5px rgba(250,205,110,.6)}
.ce-table .bwc.lay .fc{box-shadow:inset 0 0 0 3px rgba(120,190,255,.95),inset 0 0 14px 3px rgba(140,200,255,.45)}
.ce-table.light .ce-lab{color:rgba(60,46,32,.85);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.ce-dw{position:absolute;transform:translate(-50%,-50%);padding:6px 14px;border-radius:10px;background:rgba(15,23,42,.66);border:1.5px solid rgba(231,199,122,.45);color:#fff;font:700 17px Montserrat,sans-serif;letter-spacing:.06em;white-space:nowrap;pointer-events:none}
.ce-dw b{color:#f0d27a}
.ce-table.narrow .ce-dw{font-size:28px;padding:8px 18px}
.ce-pile{position:absolute;width:150px;height:190px;margin:-95px 0 0 -75px;border-radius:14px;pointer-events:none}
.ce-pile.glow,.ce-stock.glow2{box-shadow:0 0 0 3px rgba(242,199,90,.85),0 0 24px 6px rgba(242,199,90,.45)}
/* the toolbar under the table */
.ce-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px;border-radius:12px;background:rgba(15,23,42,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.ce-tools .pk-btn{width:auto;margin:0;padding:8px 16px;min-height:0}
.ce-tools .pk-btn.gold{border-color:rgba(231,199,122,.75);color:#f0d27a;background:rgba(212,175,55,.16)}
.ce-pick{position:fixed;z-index:60;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px;border-radius:12px;
  background:rgba(15,23,42,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(231,199,122,.45);max-width:94vw}
.ce-pick button{font:600 13px Montserrat,sans-serif;color:#f3ead8;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px 12px;cursor:pointer}
.ce-pick button.on{background:rgba(255,255,255,.18);border-color:rgba(231,199,122,.6);color:#fff}
@media (max-width:999px){
  .ce-pick{top:8px;flex-wrap:nowrap;gap:2px;padding:4px}.ce-pick button{font-size:11px;padding:7px 7px;white-space:nowrap}
  .ce-tools{gap:6px;padding:5px;max-width:calc(100vw - 16px)}
  .ce-tools .pk-btn{padding:8px 12px;font-size:13px}
  body.pk.seated .pk-stage{justify-content:flex-start}
}
/* ---- shared with Study Spades ---- */
/* the four seats: a name chip with the score and this hand's points */
.ht-chip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:12px;background:rgba(15,23,42,.66);border:1.5px solid rgba(255,255,255,.18);
  color:#fff;font:700 16px Montserrat,sans-serif;white-space:nowrap;pointer-events:none;z-index:640;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:border-color .25s,box-shadow .25s}
.ht-chip .av{display:inline-flex;width:26px;height:26px}
.ht-chip .sc{color:#f0d27a;font-variant-numeric:tabular-nums}
.ht-chip .hp{font-weight:600;font-size:14px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums}
.ht-chip .hp i{font-style:normal;color:#ff8f9e}
.ht-chip.turn{border-color:rgba(242,199,90,.95);box-shadow:0 0 0 2px rgba(242,199,90,.35),0 0 18px 4px rgba(242,199,90,.35)}
.ce-table.narrow .ht-chip{font-size:27px;padding:8px 18px 8px 10px;gap:12px;border-radius:16px}
.ce-table.narrow .ht-chip .av{width:40px;height:40px}
.ce-table.narrow .ht-chip .hp{font-size:23px}
/* the pass arrow and "pass to" note in the middle of the table */
.ht-mid{position:absolute;left:500px;top:480px;transform:translate(-50%,-50%);padding:10px 18px;border-radius:14px;background:rgba(15,23,42,.6);border:1.5px solid rgba(231,199,122,.45);
  color:#f3e3b6;font:700 18px Montserrat,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-align:center;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;z-index:120}
.ht-mid.on{opacity:1}
.ht-mid b{display:block;font:700 44px "Cormorant Garamond",Georgia,serif;letter-spacing:0;line-height:1;color:#f0d27a;text-transform:none}
.ce-table.narrow .ht-mid{font-size:26px}.ce-table.narrow .ht-mid b{font-size:62px}
/* cards: playable ones stand up a little and glow; cards you've chosen to pass stand up; cards passed to you glow blue */
.ce-table .bwc.can .fc{box-shadow:inset 0 0 0 3px rgba(214,164,62,.95),inset 0 0 16px 2px rgba(240,190,90,.45)}
.ce-table .bwc.dim .fc{filter:brightness(.78) saturate(.8)}
.ce-table .bwc.recv .fc{box-shadow:inset 0 0 0 3px rgba(120,190,255,.95),inset 0 0 14px 3px rgba(140,200,255,.45)}
.ce-table .bwc.pick .fc{box-shadow:inset 0 0 0 4px #e9b949,inset 0 0 20px 5px rgba(250,205,110,.6)}
.ce-table .bwc.won .fc{box-shadow:inset 0 0 0 3px rgba(242,199,90,.9)}
/* the hand-over window lists the four players */
.ht-tally{width:100%;border-collapse:collapse;margin:0 0 16px;font:600 20px Montserrat,sans-serif;color:#fff}
.ht-tally td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:right}
.ht-tally td:first-child{text-align:left}

/* the square study table: canted corners, a wooden frame and a tooled line round the playing surface */
.ce-round.sq{border-radius:84px}.ce-round.sq::before{border-radius:84px;background:radial-gradient(circle at 34% 26%,rgba(255,226,180,.22),rgba(255,226,180,0) 50%),radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 62%,rgba(0,0,0,.35) 100%)}
.ce-round.sq .ce-bead{inset:46px;border-radius:44px}
.ce-round.sq .ce-felt{inset:58px;border-radius:34px;background-image:radial-gradient(ellipse 38% 30% at 36% 30%,rgba(255,220,160,.14),rgba(255,220,160,0)),radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.4)),var(--ce-felt);background-size:auto,auto,512px 512px}
.ce-round.sq .ce-mono{top:918px}
.ce-table.narrow .ht-chip{font-size:30px}.ce-table.narrow .ht-chip .hp{font-size:26px}
.ht-chip.mate{border-color:rgba(231,199,122,.5)}
.ht-chip .hp i{font-style:normal;color:#f0d27a}
/* phones: the team scores sit on the table, so the kit's two score strips aren't needed */
body.pk.seated .pk-mini{display:none!important}
.sp-score{z-index:630}.sp-score b{color:#f0d27a}.sp-score i{font-style:normal;font-weight:600;font-size:.8em;color:rgba(255,255,255,.6)}
.ce-table.narrow .sp-score{font-size:30px}
/* the bid window */
.sp-bids{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:0 0 12px}
.sp-bids button{padding:12px 0;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,250,240,.94);cursor:pointer;font:700 22px Montserrat,sans-serif;color:#17171c}
.sp-bids button:first-child{font-size:17px}
.sp-bids button.best{box-shadow:0 0 0 3px #e9b949;background:#fff4d6}
.sp-bids button:hover{filter:brightness(1.05)}
.sp-note{font-size:15px!important;margin:0!important;color:rgba(255,255,255,.65)!important}
.ht-tally td small{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,.65)}
@media (prefers-reduced-motion:reduce){.ht-mid{transition:none}}
/* ---- Club Room Canasta ---- */
/* the octagonal club table: the shape is cut with clip-path (set in the page for the table's height); a drop shadow follows it */
.cn-shadow{position:absolute;left:0;top:0;width:1000px;filter:drop-shadow(0 26px 30px rgba(0,0,0,.5)) drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.ce-round.oct,.ce-round.oct::before{border-radius:0;box-shadow:none}
.ce-round.oct::before{background:radial-gradient(circle at 34% 24%,rgba(255,226,180,.2),rgba(255,226,180,0) 50%),radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 60%,rgba(0,0,0,.32) 100%)}
.ce-round.oct .ce-bead{display:none}
.ce-round.oct .ce-felt{inset:58px;border-radius:0;box-shadow:none;background-image:radial-gradient(ellipse 40% 30% at 36% 30%,rgba(255,230,170,.12),rgba(255,230,170,0)),radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.42)),var(--ce-felt);background-size:auto,auto,512px 512px}
/* wooden card trays for the stock and the discard pile, like the photo's */
.cn-tray{position:absolute;transform:translate(-50%,-50%);border-radius:10px;pointer-events:none;
  background:var(--cn-tray,linear-gradient(160deg,#7a4a26,#4a2a14));box-shadow:0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,230,190,.35),inset 0 -2px 0 rgba(0,0,0,.35)}

.cn-hit.glow{box-shadow:0 0 0 3px rgba(242,199,90,.85),0 0 24px 6px rgba(242,199,90,.45);animation:bwc-hint 1.2s ease-in-out infinite}
.cn-lab{position:absolute;transform:translate(-50%,-50%);padding:4px 10px;border-radius:9px;background:rgba(15,23,42,.6);border:1px solid rgba(231,199,122,.35);color:#f3e3b6;
  font:700 14px Montserrat,sans-serif;letter-spacing:.06em;white-space:nowrap;pointer-events:none;z-index:640;text-align:center;line-height:1.25}
.cn-lab b{color:#f0d27a}.cn-lab.frz{border-color:rgba(140,200,255,.7);color:#cfe6ff}.cn-lab.stop{border-color:rgba(255,160,160,.7);color:#ffd0d0}

#cnLabP{pointer-events:auto;cursor:pointer}

/* the joker: a gold star and a crescent moon, the BrainWhim sky */

};

/* ---------- the game ----------
   Saved (and sent online) as plain ids ("s-r-d": suit, rank 0-12 = A..K, deck 0/1; "j-0".."j-3" the jokers):
   h[0..3] the hands, stock, pile (bottom first), melds[team] = [{r, ids}], red3[team], phase (draw | play | handover |
   over), turn, dealer, score[team], hand, start (did the team have melds when this turn began: for a concealed
   going out), res, seq, mv. Teams: 0 = seats 0 & 2, 1 = seats 1 & 3. */
var TARGET=5000, mySide=1, S=null, busy=false, cardEl={}, online=false, sb=null, room=null, me=null, reported=false, seq=0;
var CODE=(location.search.match(/[?&]code=([A-Za-z0-9]+)/)||[])[1];
var inLesson=false, practice=false, lessonOnly=null, GID=0, SEL=[];
function team(p){ return p%2; }
function humans(){ return online?[0,2]:[0]; }   /* online (Oct 28): the two people are partners, across from each other */
function isHouse(seat){ return humans().indexOf(seat)<0; }
function mySeat(){ return online&&mySide===2?2:0; }
function myTeam(){ return team(mySeat()); }
function view(seat){ return (seat-mySeat()+4)%4; }
function authority(){ return !online||mySide===1; }
/* who deals (Oct 29, Judy): the deal passes round the table like a real game. Online, the person whose deal it is
   presses Deal. */
function houseDeals(s){ return humans().indexOf(s)<0; }
/* House players deal for themselves (Oct 29, Judy): the results stay up a few seconds, then The House deals on its
   own (online, from the host's window, which plays the House seats). People press Deal only on their own deals. */
var HOUSE_DEAL_MS=6500, autoDealT=null;
function iPress(s){ return houseDeals(s)?authority():(!online||(mySide!==0&&s===mySeat())); }
function dealLabel(nd,base){ return base; }
function pressSeat(s){ return houseDeals(s)?(s+3)%4:s; }   /* Pinochle's Play the Hand after a House bid: the person on its right */
function iMeldGo(s){ return !online||(mySide!==0&&pressSeat(s)===mySeat()); }
function dealHide(nd){ return houseDeals(nd)&&!inLesson?' style="display:none"':''; }
function dealNote(nd){ return houseDeals(nd)&&!inLesson?'<p style="margin:0">'+esc(nameOf(nd))+' deals the next hand in a moment…</p>':''; }
function dealWait(nd){ return houseDeals(nd)?nameOf(nd)+" deals the next hand in a moment…":"Waiting for "+Parlor.oppName()+" to deal…"; }
function autoDeal(nd){
  clearTimeout(autoDealT); if(!houseDeals(nd)||inLesson) return;
  var k=S.seq;
  autoDealT=setTimeout(function(){
    if(!S||S.seq!==k||S.phase!=="handover") return;
    if(busy||(typeof REV!=="undefined"&&REV)){ autoDeal(nd); return; }   /* reviewing the hand, or mid-move: try again shortly */
    var b=PANEL.querySelector("#ceNext"); if(b) b.click();
  },HOUSE_DEAL_MS);
}
var HOUSE_NAMES=["","Walter","Margaret","Beatrice"];
function nameOf(seat){ if(seat===mySeat()&&mySide!==0) return "You"; if(online&&!isHouse(seat)) return mySide===0?(seat===0?"Host":"Guest"):Parlor.oppName(); return HOUSE_NAMES[seat]||"The House"; }
function teamName(t){ var a=t===team(mySeat())?mySeat():t, b=(a+2)%4; return nameOf(a)+" & "+nameOf(b); }
function shuffleIds(a){ return K.shuffle(a); }
function meldOf(t,r){ return S.melds[t].filter(function(m){ return m.r===r; })[0]||null; }
function melded(t){ return S.melds[t].length>0; }
function isCan(m){ return m.ids.length>=7; }
function wildsIn(m){ return m.ids.filter(isWild).length; }
function hasCanasta(t){ return S.melds[t].some(isCan); }
function minNeed(t){ var s=S.score[t]; return s<0?15:s<1500?50:s<3000?90:120; }
function pileTop(){ return S.pile[S.pile.length-1]||null; }
function frozen(){ return S.pile.some(function(id){ return isWild(id)||isRed3(id); }); }
function rankWord(r){ return RNAME[r]; }

function newMatch(){ GID++; S={v:1,game:"canasta",h:[[],[],[],[]],stock:[],pile:[],melds:[[],[]],red3:[[],[]],phase:"draw",turn:0,dealer:3,score:[0,0],hand:0,start:false,res:null,seq:0,mv:null}; dealHand(); }
function dealHand(){
  var d=shuffleIds(ALL.slice());
  S.hand++; if(S.hand>1) S.dealer=(S.dealer+1)%4;
  S.h=[[],[],[],[]]; S.melds=[[],[]]; S.red3=[[],[]]; S.res=null;
  for(var i=0;i<44;i++) S.h[(S.dealer+1+i)%4].push(d.pop());
  S.stock=d; S.pile=[];
  /* red threes are laid out at once and replaced from the stock */

    for(;;){ var r3=S.h[p].filter(isRed3); if(!r3.length) break; r3.forEach(function(id){ S.h[p].splice(S.h[p].indexOf(id),1); S.red3[team(p)].push(id); S.h[p].push(S.stock.pop()); }); } }
  /* turn the up card; a wild card or red three freezes the pile and another card goes on top */
  do { S.pile.push(S.stock.pop()); } while(isWild(pileTop())||isRed3(pileTop()));

function beginTurn(p){ S.turn=p; S.phase="draw"; S.start=melded(team(p)); if(!S.stock.length) endHand(-1); }

  var got=[], r3=[];
  while(S.stock.length){ var id=S.stock.pop(); if(isRed3(id)){ S.red3[team(p)].push(id); r3.push(id); continue; } S.h[p].push(id); got.push(id); break; }
  S.phase="play"; S.mv={p:p,kind:"draw",ids:got,red3:r3};
}

/* making melds. A meld is three or more cards of one rank (aces, fours to kings) with at least two natural cards
   and no more than three wild cards (twos and jokers). Seven or more cards make a canasta. Black threes can be
   melded only when going out. Plans are lists of adds: {r, ids, existing} */
function plan(t,ids,o){

  ids.forEach(function(id){ if(isWild(id)) wilds.push(id); else if(isRed3(id)) return; else { var r=rk(id); if(!groups[r]){ groups[r]=[]; order.push(r); } groups[r].push(id); } });
  (o.extra||[]).forEach(function(id){ var r=rk(id); if(!groups[r]){ groups[r]=[]; order.push(r); } groups[r].push(id); });
  for(var i=0;i<order.length;i++){ var r=order[i], n=groups[r].length, ex=meldOf(t,r);

  adds.forEach(function(a){ if(!a.existing&&a.r!==2&&a.ids.length<3&&wilds.length){ a.ids.push(wilds.shift()); a.w++; } });
  if(adds.some(function(a){ return !a.existing&&a.ids.length<3; })) return {err:"A new meld needs at least three cards"};
  if(wilds.length&&!adds.length) return {err:"Tap one of your melds to add the wild card to it"};
  while(wilds.length){
    var cand=adds.filter(function(a){ return a.r!==2&&a.w<3; }); if(!cand.length) return {err:"A meld can hold no more than three wild cards"};
    if(o.target!=null) cand=cand.filter(function(a){ return a.r===o.target; }).concat(cand.filter(function(a){ return a.r!==o.target; }));
    else cand.sort(function(x,y){ var a=x.n+x.ids.length, b=y.n+y.ids.length; return (a<7?0:1)-(b<7?0:1)||b-a; });

}
/* checks the hand after a meld: you may go out only with a canasta, and until then you keep two cards (one to throw) */

/* taking the pile: the top card must go into a meld at once. A frozen pile (a wild card or red three in it), or a team

  if(isWild(tp)) return {err:"A wild card is on top: the pile can't be taken now"};
  var r=rk(tp), fz=frozen()||!melded(t), h=S.h[p], ex=meldOf(t,r), nat=h.filter(function(id){ return isNat(id)&&rk(id)===r; });
  var gain=S.pile.length-1;

    if(fz&&sel.filter(function(id){ return isNat(id)&&rk(id)===r; }).length<2) return {err:(melded(t)?"The pile is frozen: ":"Before your team's first meld ")+"you need two natural "+rankWord(r)+" to take it"};
    var pl=plan(t,sel,{extra:[tp]}); if(pl.err) return pl;

    var more=findMelds(p,h.filter(function(id){ return use.indexOf(id)<0; }),{noRank:r});

function doTake(p,pl){

  applyAdds(t,pl.adds);

  var got=rest.filter(function(id){ return !isRed3(id); }); S.h[p]=S.h[p].concat(got);

/* scoring a hand: every card in a team's melds, canastas (natural 500, mixed 300), red threes (100 each, 800 for all
   four, minus if the team made no meld), going out 100 (200 concealed), minus the cards left in both partners' hands */
function endHand(went){
  var rows=[];
  for(var t=0;t<2;t++){ var r={melds:0,can:0,red3:0,out:0,hand:0};
    S.melds[t].forEach(function(m){ r.melds+=sumVal(m.ids); if(isCan(m)) r.can+=m.ids.some(isWild)?300:500; });
    var n3=S.red3[t].length; r.red3=(n3===4?800:n3*100)*(melded(t)?1:-1);
    if(went>=0&&team(went)===t) r.out=S.start?100:200;
    r.hand=-(sumVal(S.h[t])+sumVal(S.h[t+2]));
    r.total=r.melds+r.can+r.red3+r.out+r.hand; rows.push(r); }
  S.score[0]+=rows[0].total; S.score[1]+=rows[1].total;
  S.res={rows:rows,went:went,concealed:went>=0&&!S.start};

function winnerTeam(){ var a=S.score[0], b=S.score[1]; return a>b?0:b>a?1:-1; }

/* ---------- The House ----------

   minimum is reached. After that it adds every natural card it can to its team's melds, starts new melds from
   three of a kind (or a pair and a spare wild card), and uses wild cards to finish canastas. It takes the pile
   whenever the rules let it and the pile is worth having. Discards: black threes when the pile is worth stopping,
   then single low cards the other team can't use, never a card the other team has melded while the pile is open,
   and wild cards only when nothing else is left. Low levels play looser. */

  o=o||{}; var g=groupsOf(ids), w=ids.filter(isWild).sort(function(a,b){ return val(a)-val(b); }), out=[], t=team(p);
  Object.keys(g).forEach(function(k){ var r=+k; if(r===o.noRank||meldOf(t,r)) return; if(g[k].length>=3) out.push(g[k].slice()); });
  out.sort(function(a,b){ return sumVal(b)-sumVal(a); });

function houseTake(p,full){

function discardScore(p,id){

  if(isNat(id)&&!isBlack3(id)){ if(n>=2) sc+=24*(n-1); if(meldOf(t,r)) sc+=60; }
  if(isNat(id)&&!isBlack3(id)&&meldOf(o,r)&&!frozen()) sc+=150+S.pile.length*6;

async function houseTurn(){

  if(S.phase!=="play") return;
  var a=houseAction(p); if(a){ await act(function(){ doMeld(p,a.ids,a.target); }); return; }

/* ---------- where every card sits ---------- */
function handKey(id){ var r=rk(id); return r===2?0:r===0?11:r===1?12:r===13?13:r-2; }

    var gap=Math.min(12*o.sc,(o.w-w-(m-1)*16)/Math.max(1,gaps)), step=m>1?Math.min(w*.62,(o.w-w-gap*gaps)/(m-1)):0; if(gap<0) gap=0;

    part.forEach(function(id,k){ if(k&&handKey(id)!==handKey(part[k-1])) x+=gap;
      var off=k-(m-1)/2, rot=rows===2?0:Math.max(-8,Math.min(8,off*.8)), dy=rows===2?0:off*off*.25, lift=SEL.indexOf(id)>=0?o.lift:0;

/* the melds of a team in one row: red threes first, then each meld as a squared stack with its count below */
function rowItems(t){ var it=[]; if(S.red3[t].length) it.push({r3:true,ids:S.red3[t]}); S.melds[t].forEach(function(m){ it.push({m:m,ids:m.ids}); }); return it; }

function positions(){

  if(k===1){ setPos({phase:"draw",me:base.concat([[0,0],[0,2],[5,3]]),pile:[[4,0],[9,1]]}); lessonOnly={only:"stock",say:"Tap the stock for this lesson",check:function(m){ return m&&m.kind==="draw"; }}; glow([]); HITS.classList.add("glow"); return; }
  if(k===2){ setPos({me:base.concat([[0,0],[0,2],[0,1],[5,3]])}); var ac=idsOf([[0,0],[0,2],[0,1]]); lessonOnly={meld:ac,say:"Choose the three glowing aces, then tap Meld",check:function(m){ return m&&m.kind==="meld"; }}; glow(ac); return; }
  if(k===3){ setPos({me:base.concat(["jk",[5,3]]),melds:[[{r:0,cards:[[0,0],[0,2],[0,1]]},{r:7,cards:[[7,0],[7,1],[7,2],[7,3]]}],[]]}); var jk=idsOf(["jk"]); lessonOnly={target:7,say:"Choose the joker, then tap your eights",check:function(m){ return m&&m.kind==="meld"; }}; glow(jk); return; }
  if(k===4){ setPos({me:base.concat([[12,3],[5,3]]),melds:[[{r:0,cards:[[0,0],[0,2],[0,1]]},{r:12,cards:[[12,0],[12,1],[12,2],[12,3],[12,1],[12,2]]}],[]]}); var kg=idsOf([[12,3]]); lessonOnly={target:12,say:"Choose the king, then tap the kings on the table",check:function(m){ return m&&m.kind==="meld"; }}; glow(kg); return; }
  if(k===5){ setPos({phase:"draw",me:base.concat([[6,0],[6,3]]),melds:[[{r:0,cards:[[0,0],[0,2],[0,1]]}],[]],pile:[[4,0],[9,1],[11,3],[5,1],[6,2]]}); lessonOnly={only:"pile",say:"Tap the pile for this lesson",check:function(m){ return m&&m.kind==="take"; }}; HITP.classList.add("glow"); return; }
}
/* practice: a short game to 1,000 against a gentle House, with a coach */
var tipN=0, TIPS=["Keep pairs: they let you take the pile.","Don't throw a card the other team has melded while the pile isn't frozen: they'll take it.","A black three is a safe throw: nobody can take the pile on top of it.","Wild cards are best used to finish a canasta.","Tap Hint any time for a suggestion."];
function startPractice(){

  GID++; newMatch(); busy=true;

}
function practiceTip(){
  if(!S||S.turn!==0) return;
  if(S.phase==="draw"){ if(!takePlan(0,null).err){ Parlor.practiceSay("Take the Pile","<p>You can take the pile: its top card goes into a meld and the rest come to your hand. Tap the pile.</p>"); return; } }
  if(S.phase==="play"&&!melded(0)&&houseAction(0,true)){ Parlor.practiceSay("First Meld","<p>You have enough for your team's first meld ("+minNeed(0)+" points). Tap Hint to see which cards.</p>"); return; }
  if(++tipN%4===1) Parlor.practiceSay("Practice Game","<p>"+TIPS[Math.floor(tipN/4)%TIPS.length]+"</p>");
}

/* ---------- online table (same page: ?code=XXXX). The host sits South and the guest North, as partners.
   The House plays East and West from the host's window, and the host deals. ---------- */
async function push(){
  if(!online||!room||mySide===0) return;
  var st=JSON.parse(JSON.stringify(S));
  var status=S.phase==="over"?"done":(room.guest?"live":(room.status||"lobby"));
  await sb.from("rooms").update({state:st,status:status,updated_at:new Date().toISOString()}).eq("id",room.id);
}
function report(w){ if(reported||!room||!window.bwRateGame||mySide===0) return; reported=true; room.state=JSON.parse(JSON.stringify(S)); bwRateGame(sb,room,me,w); }
function validState(st){
  if(!(st&&st.v===1&&st.game==="canasta"&&Array.isArray(st.h)&&st.h.length===4&&Array.isArray(st.stock)&&Array.isArray(st.pile)&&Array.isArray(st.melds)&&st.melds.length===2&&Array.isArray(st.red3)&&Array.isArray(st.score))) return false;
  var all=st.stock.concat(st.pile); st.h.forEach(function(x){ all=all.concat(x||[]); }); st.red3.forEach(function(x){ all=all.concat(x||[]); });
  st.melds.forEach(function(ms){ (ms||[]).forEach(function(m){ all=all.concat((m&&m.ids)||[]); }); });
  var seenIds={}; return all.length===108&&all.every(function(id){ if(!BYID[id]||seenIds[id]) return false; seenIds[id]=1; return true; });
}
/* catching up (Oct 29): a phone that goes to sleep, a dropped connection or a slow start can miss a live update,
   and the table would then wait forever for a move it never heard about. So each window also re-reads its table when
   the live connection starts (or restarts), when it comes back to the screen, and every few seconds while it waits,
   and plays any newer move it finds. */
var ROWFN=null, catching=false, catchT=null;
async function catchUp(){
  if(!online||!sb||!room||!ROWFN||catching) return; catching=true;
  try{
    var q=await sb.from("rooms").select("*").eq("id",room.id).single(), r=q&&q.data;
    if(r){ var st=r.state||{}, newer=(st.seq||0)>seq||(!S&&validState(st)), joined=!!r.guest&&!(room&&room.guest);
      if(newer||joined) ROWFN(r); }
  }catch(e){}
  catching=false;
}
function startCatchUp(){
  if(catchT) return;
  catchT=setInterval(function(){ if(document.visibilityState!=="hidden"&&!busy) catchUp(); },4000);
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") catchUp(); });
  ["focus","online","pageshow"].forEach(function(ev){ window.addEventListener(ev,function(){ catchUp(); }); });
}
async function bootOnline(){
  online=true; Parlor.seatOnline({label:"Online table "+CODE});
  var cfg=window.BW_PLAY||{};
  if(!cfg.url){ Parlor.status("Can't connect","Missing play-config.js"); return; }
  sb=(window.BW&&BW.client&&BW.client())||supabase.createClient(cfg.url,cfg.anonKey);
  if(window.BW) await BW.settled();
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ Parlor.status("Sign in to join","Use the Lobby to sign in"); if(window.BW){ var a=await BW.openAuth({reason:"Sign in to join this table."}); if(!a.ok) return; sess=(await sb.auth.getSession()).data.session; } if(!sess) return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code",CODE).single();
  if(q.error){ Parlor.status("Table not found",q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==="function"&&bwSendToGame(bwGuessGame(room),CODE)) return;
  if(room.host===me) mySide=1; else if(room.guest===me) mySide=2;
  else if(!room.guest){ var u=await sb.from("rooms").update({guest:me,status:"live"}).eq("id",room.id).select().single(); if(!u.error){ room=u.data; mySide=2; } }
  else mySide=0;   /* watching */
  Parlor.mySeat(0); if(Parlor.table) Parlor.table({sb:sb,room:room,me:me,side:mySide});
  loadOppProfile();
  if(validState(room.state)){ S=room.state; seq=S.seq||0; fit(true); render(false); after(); }
  else if(mySide===1){ newMatch(); seq=1; S.seq=seq; fit(true); await push(); busy=true; await dealAnim(); busy=false; after(); }
  else { S=null; Parlor.status("Dealing…","The host is shuffling the cards"); }
  ROWFN=async function(row){ var p={new:row};
    var hadGuest=room&&room.guest; room=p.new; var st=p.new.state||{};
    if(room.guest&&!hadGuest) loadOppProfile();
    if(!validState(st)){
      if(mySide===1&&(!S||!hadGuest)){ GID++; newMatch(); seq=(seq||0)+1; S.seq=seq; await push(); busy=true; await dealAnim(); busy=false; after(); }
      return;
    }
    if(!hadGuest&&room.guest&&S) { after(); }
    if((st.seq||0)<=seq&&S) return;   /* our own move coming back */
    var dealt=st.mv&&st.mv.kind==="deal", was=S; seq=st.seq||0;
    S=st; GID++; SEL=[]; if(PANEL._pile){ PANEL.classList.remove("on"); PANEL._pile=false; }
    busy=true; if(dealt||!was) await dealAnim(); else await animate(st.mv); busy=false;
    if(st.phase!=="handover"&&st.phase!=="over") PANEL.classList.remove("on","wide");
    after();
  };
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"code=eq."+CODE},function(p){ ROWFN(p.new); }).subscribe(function(st){ if(st==="SUBSCRIBED") catchUp(); });
  startCatchUp();
}
function loadOppProfile(){
  if(!room||!sb||!window.BWAvatar) return; var id=mySide===2?room.host:room.guest; if(!id) return;
  BWAvatar.fetch(sb,[id]).then(function(rows){ oppProfile=rows&&rows[0]||null; chipEls.forEach(function(c){ c._av=null; }); if(S) paintTable(); },function(){});
}

/* ---------- fit to the space ---------- */
function fit(noRender){
  var wide=window.innerWidth>=1000, narrow=!wide&&window.innerWidth<700&&window.innerHeight>window.innerWidth;
  var L=layoutFor(narrow), toolsH=(TOOLS.offsetHeight||46)+10, availW, availH;
  var st2=document.querySelector(".pk-stage"), tp=st2&&seatedNow()?st2.getBoundingClientRect().top+window.scrollY:185;
  if(wide){ availW=(st2&&st2.clientWidth)||(window.innerWidth-560); availH=window.innerHeight-tp-22-toolsH; }
  else { availW=window.innerWidth-12; availH=window.innerHeight-(seatedNow()?tp:56)-88-toolsH-6; }
  if(narrow){ L=layoutFor(true,availH/availW*1000-440); }
  var s=Math.max(.2,Math.min(availW/L.W,availH/L.H,1.2));
  var shape=G.tableH!==L.tableH; G=L; FIT._s=s; if(shape&&curDesign){ var dk=String(curDesign).split(":")[0]; curDesign=null; applyDesign(dk); }
  T.style.width=L.W+"px"; T.style.height=L.H+"px"; T.style.transform="scale("+s+")"; T.classList.toggle("narrow",narrow); T.classList.toggle("bwc-bigv",narrow);
  FIT.style.width=Math.round(L.W*s)+"px"; FIT.style.height=Math.round(L.H*s)+"px";
  document.body.style.setProperty("--pk-size",Math.round(L.W*s)+"px");
  chipEls.forEach(function(c){ c._av=null; });
  if(!noRender&&S&&!busy) render(false);
}
window.addEventListener("resize",function(){ fit(); });
