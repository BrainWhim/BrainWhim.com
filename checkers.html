<style>
/* ===== Checkers: Judy's round garden table seen from straight above, with the board inlaid flush in its top =====
   The whole table top (paint, stencilled damask, inlaid squares, moulded rim, dappled garden light) is painted in code
   once per board (no picture files). Pieces are drawn too: enamel or marble discs with gold rims and a gold emblem;
   kings are a stacked pair with a gold crown. Captured pieces rest on the table beside the board, near their captor. */
.ck-crop{flex:none;width:var(--ck-size);height:var(--ck-size);display:flex;justify-content:center;position:relative}
.ck-scene{flex:none;position:relative;width:var(--ck-size);height:var(--ck-size);font-size:calc(var(--ck-size) / 150)}
.ck-top{position:absolute;inset:0;border-radius:50%;background:var(--ck-top,none) center/100% 100% no-repeat,var(--ck-topc,#ddd);
  box-shadow:0 2.6em 5em rgba(0,0,0,.5),0 .8em 1.6em rgba(0,0,0,.35)}
.ck-layer{position:absolute;inset:0;pointer-events:none}
.ck-sq{position:absolute;width:8.375%;height:8.375%}
.ck-sq.lastf{background:rgba(255,226,150,.14);box-shadow:inset 0 0 0 .3em rgba(255,214,120,.32)}
.ck-sq.lastt{background:rgba(255,226,150,.22);box-shadow:inset 0 0 0 .35em rgba(255,214,120,.55)}
.ck-sq.dest{background:rgba(255,222,140,.22)}
.ck-sq.dest::after{content:"";position:absolute;left:50%;top:50%;width:32%;height:32%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,#fff3c4,#e0b13a);box-shadow:0 0 1.8em rgba(255,214,110,.95);animation:ck-pulse 1.8s ease-in-out infinite}
@keyframes ck-pulse{50%{opacity:.6;transform:translate(-50%,-50%) scale(.82)}}
.ck-hit button{position:absolute;width:8.375%;height:8.375%;padding:0;margin:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.ck-hit button:focus-visible{outline:.3em solid rgba(255,214,120,.8);outline-offset:-.3em}
/* a piece: a thick disc seen from above, its side showing a little below; the gold rim, beads and emblem are one small SVG */
.ck-pc{position:absolute;width:7.035%;height:7.035%;margin:-3.5175% 0 0 -3.5175%;border-radius:50%;background:var(--mat);
  box-shadow:0 .55em 0 var(--edge),0 .95em 1.2em rgba(0,0,0,.45),inset 0 -.6em 1em rgba(0,0,0,.22),inset 0 .45em .7em rgba(255,255,255,.28);transition:transform .2s ease-out}
.ck-pc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .12em .06em rgba(0,0,0,.35))}
.ck-pc.s1{--mat:var(--p1mat);--edge:var(--p1edge)}.ck-pc.s2{--mat:var(--p2mat);--edge:var(--p2edge)}
.ck-pc.king{transform:translateY(-.55em);box-shadow:0 .55em 0 var(--edge),0 .68em 0 rgba(0,0,0,.4),0 1.25em 0 var(--edge),0 1.7em 1.4em rgba(0,0,0,.45),inset 0 -.6em 1em rgba(0,0,0,.22),inset 0 .45em .7em rgba(255,255,255,.28)}
.ck-pc.can::before{content:"";position:absolute;inset:-.55em;border-radius:50%;box-shadow:0 0 0 .3em rgba(242,204,98,.92),0 0 1.5em rgba(255,210,100,.8)}
.ck-pc.them.can::before{box-shadow:0 0 0 .22em rgba(255,255,255,.5),0 0 1em rgba(255,255,255,.35)}
.ck-pc.must::before{animation:ck-ring 1.3s ease-in-out infinite}
@keyframes ck-ring{50%{box-shadow:0 0 0 .45em rgba(255,226,140,.6),0 0 2.4em rgba(255,200,80,.95)}}
.ck-pc.sel{transform:translateY(-1em) scale(1.08);box-shadow:0 .55em 0 var(--edge),0 2.2em 1.8em rgba(0,0,0,.4),inset 0 -.6em 1em rgba(0,0,0,.22),inset 0 .45em .7em rgba(255,255,255,.28)}
.ck-pc.king.sel{transform:translateY(-1.5em) scale(1.08)}
.ck-pc.crowned{animation:ck-crown .6s ease-out}
@keyframes ck-crown{40%{transform:translateY(-1.4em) scale(1.18)}}
.ck-tray .ck-pc{width:4.4%;height:4.4%;margin:-2.2% 0 0 -2.2%;font-size:.62em}
/* Judy's image pieces: anchored at the square's centre, standing up like the chess pieces; glow and lift through the image's own outline */
.ck-im{position:absolute;width:0;height:0}
.ck-im img{position:absolute;left:0;top:0;height:auto;transform:translate(-50%,var(--ay)) translateY(var(--lift,0em));transition:transform .2s ease-out,filter .2s;
  filter:drop-shadow(0 .45em .4em rgba(0,0,0,.45));pointer-events:none;-webkit-user-drag:none}
.ck-im.can img{filter:drop-shadow(0 0 .5em rgba(255,214,110,1)) drop-shadow(0 0 1.2em rgba(255,200,80,.8)) drop-shadow(0 .45em .4em rgba(0,0,0,.4))}
.ck-im.them.can img{filter:drop-shadow(0 0 .3em rgba(255,255,255,.75)) drop-shadow(0 .45em .4em rgba(0,0,0,.4))}
.ck-im.must img{animation:ck-glow 1.3s ease-in-out infinite}
.ck-im.can::before{content:"";position:absolute;left:0;top:0;width:19em;height:15em;transform:translate(-50%,-44%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,232,150,.95) 0,rgba(255,206,96,.7) 55%,rgba(255,200,80,0) 100%)}
.ck-im.them.can::before{background:radial-gradient(closest-side,rgba(255,255,255,.7) 0,rgba(255,255,255,.35) 55%,rgba(255,255,255,0) 100%)}
.ck-im.must::before{animation:ck-pool 1.3s ease-in-out infinite}
@keyframes ck-pool{50%{opacity:.45}}
@keyframes ck-glow{50%{filter:drop-shadow(0 0 .7em rgba(255,226,140,1)) drop-shadow(0 0 1.6em rgba(255,200,80,.95)) drop-shadow(0 .45em .4em rgba(0,0,0,.4))}}
.ck-im.sel{--lift:-1.3em}.ck-im.sel img{filter:drop-shadow(0 0 .45em rgba(255,214,110,1)) drop-shadow(0 1.6em 1em rgba(0,0,0,.35))}
.ck-im.crowned img{animation:ck-crown2 .6s ease-out}
@keyframes ck-crown2{40%{transform:translate(-50%,var(--ay)) translateY(-1.4em) scale(1.12)}}
.ck-tray .ck-im{font-size:.62em}
/* the board picker shown on the preview page */
.ck-pick{position:fixed;z-index:60;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:6px;border-radius:12px;
  background:rgba(15,23,42,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(231,199,122,.45);max-width:94vw}
.ck-pick button{font:600 13px Montserrat,sans-serif;color:#f3ead8;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px 12px;cursor:pointer}
.ck-pick button.on{background:rgba(255,255,255,.18);border-color:rgba(231,199,122,.6);color:#fff}
@media (max-width:999px){.ck-pick{top:62px;flex-wrap:nowrap;gap:2px;padding:4px}.ck-pick button{font-size:11.5px;padding:7px 8px;white-space:nowrap}}

/* sizes: desktop shows the whole round table as the hero; phones zoom in so the board fills the width (the table's sides run off the screen) */
body.pk{--ck-size:min(calc(100vw - 2*var(--pk-side) - 90px),max(360px,calc(100dvh - var(--pk-hdr) - var(--pk-sw) - 44px)),920px)}
@media (min-width:1000px) and (max-width:1180px){body.pk{--ck-size:min(calc(100vw - 2*var(--pk-side) - 60px),max(360px,calc(100dvh - var(--pk-hdr) - var(--pk-sw) - 40px)))}}
@media (max-width:999px){
  body.pk{--ck-size:min(calc(100vw * 1.32),max(300px,calc(100dvh - var(--pk-hdr) - var(--pk-bar) - 150px)));--pk-size:min(calc(100vw - 16px),calc(var(--ck-size) * .72))}
  .ck-crop{width:100vw;clip-path:inset(-30% 0 -30% 0)}
}
@media (prefers-reduced-motion:reduce){.ck-sq.dest::after,.ck-pc.must::before,.ck-pc.crowned{animation:none}}

<script>
/* ---------- painted materials (drawn in the browser; no picture files) ---------- */
function rng(seed){var s=seed%2147483647;if(s<=0)s+=2147483646;return function(){return (s=s*16807%2147483647)/2147483647;};}
function noise2(seed){var r=rng(seed),P=new Uint16Array(512),G=new Float32Array(256),p=[],i,j,t;for(i=0;i<256;i++)p[i]=i;for(i=255;i>0;i--){j=Math.floor(r()*(i+1));t=p[i];p[i]=p[j];p[j]=t;}for(i=0;i<512;i++)P[i]=p[i&255];for(i=0;i<256;i++)G[i]=r();function f(x){return x*x*(3-2*x);}return function(x,y){var xi=Math.floor(x),yi=Math.floor(y),u=f(x-xi),v=f(y-yi),X=xi&255,Y=yi&255;var a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}
function fbm(n,x,y,o){var s=0,a=.5,t=0;for(var i=0;i<o;i++){s+=a*n(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function mix(a,b,t){return a+(b-a)*t;}
function clamp(v){return v<0?0:v>255?255:v;}
function smooth(a,b,x){var t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);}
function marbleTex(o){var c=document.createElement("canvas"),S=192;c.width=c.height=S;var g=c.getContext("2d"),im=g.createImageData(S,S),D=im.data,n=noise2(o.seed),n2=noise2(o.seed+9);
  for(var y=0;y<S;y++)for(var x=0;x<S;x++){var w=fbm(n,x/60,y/60,4),v=Math.pow(1-Math.abs(Math.sin((x*.01+y*.017)*2.4+w*7)),9),cl=fbm(n2,x/90,y/90,3),i=(y*S+x)*4;
    for(var k=0;k<3;k++)D[i+k]=clamp(mix(mix(o.base[k],o.cloud[k],cl*.7),o.vein[k],v*o.amt));D[i+3]=255;}
  g.putImageData(im,0,0);return 'url('+c.toDataURL("image/jpeg",.9)+')';}

/* ---------- the stencilled damask: drawn as a white mask in table units (1 = table radius), then painted with the stencil colour ---------- */
function leaf(g,x,y,len,ang,wid){g.save();g.translate(x,y);g.rotate(ang);g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(len*.45,-wid,len,0);g.quadraticCurveTo(len*.45,wid,0,0);g.fill();g.restore();}
function dot(g,x,y,r){g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function spiral(g,cx,cy,r0,turns,dir,a0,w){var px=null,py=null;for(var i=0;i<=36;i++){var t=i/36,a=a0+dir*t*turns*Math.PI*2,rr=r0*(1-.78*t),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
  if(px!=null){g.lineWidth=w*(1-.5*t);g.beginPath();g.moveTo(px,py);g.lineTo(x,y);g.stroke();}px=x;py=y;}dot(g,px,py,w*.75);}
function flower(g,x,y,r,n){g.save();g.translate(x,y);for(var k=0;k<n;k++){g.save();g.rotate(k*Math.PI*2/n);g.beginPath();g.ellipse(0,-r*.55,r*.27,r*.5,0,0,7);g.fill();g.restore();}
  g.globalCompositeOperation="destination-out";dot(g,0,0,r*.27);g.globalCompositeOperation="source-over";dot(g,0,0,r*.15);g.restore();}
function vineUnit(g,L,i){
  g.lineWidth=.0062;g.beginPath();g.moveTo(-L/2,0);g.bezierCurveTo(-L/4,-.019,L/4,.019,L/2,0);g.stroke();
  leaf(g,-L/4,-.012,.028,-2.2,.0095);leaf(g,L/4,.012,.028,.94,.0095);
  leaf(g,-L/4+.004,-.013,.022,-.75,.0072);leaf(g,L/4-.004,.013,.022,2.39,.0072);
  if(i%2===0)flower(g,0,0,.016,5);else{dot(g,0,-.014,.0048);dot(g,0,.014,.0048);dot(g,-.006,0,.003);dot(g,.006,0,.003);}
}
function medallionHalf(g){
  g.lineWidth=.0095;g.beginPath();g.moveTo(.034,.014);g.bezierCurveTo(.08,.05,.14,.045,.162,.006);g.stroke();
  spiral(g,.146,-.006,.021,1.05,-1,.2,.0085);
  g.lineWidth=.007;g.beginPath();g.moveTo(.042,-.02);g.bezierCurveTo(.09,-.052,.17,-.046,.205,-.016);g.stroke();
  spiral(g,.198,-.026,.012,1,1,1.2,.006);
  leaf(g,.085,.043,.05,.32,.016);leaf(g,.112,-.044,.044,-.42,.014);leaf(g,.18,.022,.036,.38,.012);leaf(g,.215,.004,.028,.1,.009);
  leaf(g,.06,.03,.03,1.35,.007);leaf(g,.24,-.006,.018,-.2,.005);
  dot(g,.258,-.008,.0045);dot(g,.03,-.045,.004);dot(g,.13,.058,.004);
}
function medallion(g,mono){
  [1,-1].forEach(function(s){g.save();g.scale(s,1);medallionHalf(g);g.restore();});
  if(mono){g.lineWidth=.0035;g.beginPath();g.arc(0,0,.05,0,7);g.stroke();return;}
  flower(g,0,0,.036,6);
  leaf(g,0,-.032,.04,-Math.PI/2,.012);leaf(g,-.006,-.032,.03,-Math.PI/2-.6,.009);leaf(g,.006,-.032,.03,-Math.PI/2+.6,.009);
  leaf(g,0,.032,.028,Math.PI/2,.009);
}
function ornaments(g){
  function ring(r,w){g.lineWidth=w;g.beginPath();g.arc(0,0,r,0,7);g.stroke();}
  ring(.936,.0085);ring(.916,.0042);ring(.834,.0048);ring(.822,.0026);
  var U=60;for(var i=0;i<U;i++){g.save();g.rotate(i*Math.PI*2/U);g.translate(0,-.876);vineUnit(g,Math.PI*2*.876/U,i);g.restore();}
  for(var k=0;k<4;k++){g.save();g.rotate(k*Math.PI/2);g.translate(0,-.752);g.scale(1.16,1.16);medallion(g,k===1);g.restore();}
}

/* ---------- the whole table top, one painted picture (1400px square, clipped round by CSS) ---------- */
var BH=.67;   /* the board's half width, in table radii (board = 67% of the table, like Judy's table) */
function paintTable(d){
  var N=1400,R=N/2,c=document.createElement("canvas");c.width=c.height=N;var ctx=c.getContext("2d");
  var m=document.createElement("canvas");m.width=m.height=N;var mg=m.getContext("2d");
  mg.translate(R,R);mg.scale(R,R);mg.fillStyle="#fff";mg.strokeStyle="#fff";mg.lineCap="round";ornaments(mg);
  var mask=mg.getImageData(0,0,N,N).data;
  var im=ctx.createImageData(N,N),D=im.data;
  var nG=noise2(d.seed),nW=noise2(d.seed+3),nS=noise2(d.seed+7),nC=noise2(d.seed+11),nL=noise2(d.seed+19),rr=rng(d.seed+23);
  var half=BH*R,bw=.024*R,outer=half+bw,sq=2*half/8,RIM=.955*R;
  var L=[-.42,-.58,.7],ll=Math.hypot(L[0],L[1],L[2]);L=[L[0]/ll,L[1]/ll,L[2]/ll];
  var col=[0,0,0];
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    var i=(y*N+x)*4,dx=x+.5-R,dy=y+.5-R,r=Math.sqrt(dx*dx+dy*dy);
    if(r>R+2){D[i]=d.top[0];D[i+1]=d.top[1];D[i+2]=d.top[2];D[i+3]=255;continue;}
    var ax=Math.abs(dx),ay=Math.abs(dy),mx=Math.max(ax,ay),spk=rr();
    var grain=fbm(nG,x/320,y/3.2,3),wearN=fbm(nW,x/16,y/16,3),k,wear=0;
    if(r>=RIM){
      /* the moulded edge: a rounded bullnose lit from the top left, with a fine groove where it meets the top */
      var t=(r-RIM)/(R-RIM),th=t*1.4,ux=dx/r,uy=dy/r,nx=ux*Math.sin(th),ny=uy*Math.sin(th),nz=Math.cos(th);
      var lam=Math.max(0,nx*L[0]+ny*L[1]+nz*L[2]),sh=.42+.72*lam,hz=nz+L[2],hx=nx+L[0],hy=ny+L[1],hl=Math.hypot(hx,hy,hz),spec=Math.pow(Math.max(0,(hx*nx+hy*ny+hz*nz)/hl),24)*.22;
      if(t<.07)sh*=.62+t*5;
      for(k=0;k<3;k++)col[k]=d.rim[k]*sh*(1+(grain-.5)*.08)+255*spec;
      wear=smooth(.66,.8,wearN)*d.wear*(.4+t);
      for(k=0;k<3;k++)col[k]=mix(col[k],d.rimUnder[k]*sh,wear);
    } else if(mx<half){
      /* the inlaid squares: brushed paint, a fine crackle on the light squares, soft wear */
      var cx=Math.floor((dx+half)/sq),cy=Math.floor((dy+half)/sq),dark=(cx+cy)%2===1,base=dark?d.sqD:d.sqL;
      var br=fbm(nS,x/240,y/2.6,2),fx=(dx+half)-cx*sq,fy=(dy+half)-cy*sq,edge=Math.min(fx,fy,sq-fx,sq-fy);
      var f=1+(br-.5)*.09+(grain-.5)*.05+(spk-.5)*.03;
      for(k=0;k<3;k++)col[k]=base[k]*f;
      if(!dark&&d.crack){var cr=Math.abs(fbm(nC,x/30,y/30,3)-.5);if(cr<.0075){var cd=(1-cr/.0075)*.11*d.crack;for(k=0;k<3;k++)col[k]*=1-cd;}}
      if(edge<1.1){for(k=0;k<3;k++)col[k]*=.9;}
      wear=smooth(.76,.9,wearN)*d.wear*.45*(edge<5?1.5:1);
      for(k=0;k<3;k++)col[k]=mix(col[k],d.under[k],wear);
    } else if(mx<outer){
      /* the inlay's border strip, set flush, with a dark seam on each side */
      var f2=1+(grain-.5)*.06+(spk-.5)*.03;for(k=0;k<3;k++)col[k]=d.border[k]*f2;
      var s1=mx-half,s2=outer-mx;
      if(s1<1.4||s2<1.6){for(k=0;k<3;k++)col[k]*=.62;} else if(s2<3){for(k=0;k<3;k++)col[k]=mix(col[k],255,.12);}
    } else {
      /* the painted table top with its stencil */
      var f3=1+(grain-.5)*d.grain+(spk-.5)*.035+(fbm(nS,x/90,y/90,2)-.5)*.05;
      for(k=0;k<3;k++)col[k]=d.top[k]*f3;
      var a=mask[i+3]/255;
      if(a>0){var mot=.78+fbm(nC,x/7,y/7,2)*.36;a*=d.stencilA*Math.min(1,mot);if(wearN>.7)a*=.55;for(k=0;k<3;k++)col[k]=mix(col[k],d.stencil[k]*f3,a);}
      wear=smooth(.68,.84,wearN)*d.wear*(.25+1.2*smooth(.82,.95,r/R));
      for(k=0;k<3;k++)col[k]=mix(col[k],d.under[k],wear);
      if(mx<outer+2.2){for(k=0;k<3;k++)col[k]*=.8;}   /* the seam where the inlay meets the top */
    }

}
function end(){
  var kind=winner===0?"draw":(winner===mySide?"win":"lose"), n=colorNames();
  var detail=winner===0?"Forty moves each without a jump":who(1)+": "+count(B,1)+" left, "+who(2)+": "+count(B,2)+" left";
  say(kind==="win"?"You win!":kind==="draw"?"Draw":"Game over",winner===0?"No jumps for forty moves each":"No pieces or no moves left");
  Parlor.info("");
  if(online) report();
  Parlor.finish(kind,detail);
}
function newGame(){
  B=fresh(); turn=1; over=false; winner=0; last=null; took={1:[],2:[]}; quiet=0; seq=0; pend=[]; pendSide=0;
  disp=B.slice(); partial=null; busy=false; hidden=-1; legal=gen(B,1);
  paint(); msg();
}

/* ---------- online table (same page: ?code=XXXX). Saved format matches the old room: {board, turn, last, over, winner, took1, took2} plus path, quiet, seq and mv ---------- */
function rows(b){ var o=[]; for(var r=0;r<8;r++) o.push(b.slice(r*8,r*8+8)); return o; }
function snapshot(m){ return {board:rows(B),turn:turn,last:last?[last[0]>>3,last[0]&7,last[last.length-1]>>3,last[last.length-1]&7]:null,path:last,over:over,winner:winner,took1:took[1],took2:took[2],quiet:quiet,seq:seq,mv:m?{p:m.p,side:3-turn}:null}; }
function applySnap(s){
  if(!s||!s.board){ B=fresh(); turn=1; over=false; winner=0; last=null; took={1:[],2:[]}; quiet=0; seq=0; }
  else { B=[].concat.apply([],s.board); turn=s.turn||1; over=!!s.over; winner=s.winner||0; took={1:s.took1||[],2:s.took2||[]}; quiet=s.quiet||0; seq=s.seq||0;
    last=s.path||(s.last?[s.last[0]*8+s.last[1],s.last[2]*8+s.last[3]]:null); }
  disp=B.slice(); partial=null; pend=[]; pendSide=0; legal=over?[]:gen(B,turn);
}
async function push(m){
  if(!online||!room) return;
  var snap=snapshot(m); room.state=snap;
  await sb.from("rooms").update({state:snap,status:over?"done":"live",updated_at:new Date().toISOString()}).eq("id",room.id);
  if(over) report();
}
function report(){
  if(reported||!over||!room||!window.bwRateGame) return;
  reported=true; room.state=snapshot(); bwRateGame(sb,room,me,winner);   /* the server decides if points move */
}
async function bootOnline(){
  online=true; Parlor.seatOnline({label:"Online table "+CODE});
  var cfg=window.BW_PLAY||{};
  if(!cfg.url){ say("Can't connect","Missing play-config.js"); return; }
  sb=(window.BW&&BW.client&&BW.client())||supabase.createClient(cfg.url,cfg.anonKey);
  if(window.BW) await BW.settled();
  var sess=(await sb.auth.getSession()).data.session;
  if(!sess){ say("Sign in to join","Use Tables to sign in"); if(window.BW){ var a=await BW.openAuth({reason:"Sign in to join this table."}); if(!a.ok) return; sess=(await sb.auth.getSession()).data.session; } if(!sess) return; }
  me=sess.user.id;
  var q=await sb.from("rooms").select("*").eq("code",CODE).single();
  if(q.error){ say("Table not found",q.error.message); return; }
  room=q.data;
  if(typeof bwSendToGame==="function"&&bwSendToGame(bwGuessGame(room),CODE)) return;
  if(room.host===me) mySide=1; else if(room.guest===me) mySide=2;
  else if(!room.guest){ var u=await sb.from("rooms").update({guest:me,status:"live"}).eq("id",room.id).select().single(); if(!u.error){ room=u.data; mySide=2; } }
  else mySide=0;   /* watching */
  nameSeats(); Parlor.mySeat(mySide===2?1:0); Parlor.table&&Parlor.table({sb:sb,room:room,me:me,side:mySide}); layout();
  applySnap(room.state); paint(); if(over) end(); else msg();
  sb.channel("room-"+CODE).on("postgres_changes",{event:"UPDATE",schema:"public",table:"rooms",filter:"code=eq."+CODE},function(p){
    var st=p.new.state||{}; room=p.new;
    if((st.seq||0)<=seq&&st.seq!=null){ if(!over) msg(); return; }   /* our own echo, or an older update */
    /* the other player's move: float it in, hop by hop, from the board we already show */
    if(st.mv&&st.mv.side&&st.mv.side!==mySide&&!busy&&st.seq===seq+1){
      var m=gen(B,st.mv.side).filter(function(x){ return x.p.join()===st.mv.p.join(); })[0];
      if(m){ var wasOver=over; playMove(m,st.mv.side).then(function(){ applySnap(st); paint(); if(over&&!wasOver) end(); else msg(); }); return; }
    }
    var was=over; applySnap(st); paint(); if(over&&!was) end(); else msg();
  }).subscribe();
}

  game:"checkers", title:"Garden Checkers", bg:"checkers-parlor.jpg", home:"tables.html", stage:stage,

    {id:"charcoal",name:"Charcoal Damask",club:true,dots:["#505356","#7acec8","#13804a"]}
  ],

    score:"<ul><li>Take all of your opponent's pieces, or leave them with no legal move, to win.</li><li>If forty moves go by on each side with no jump and no uncrowned piece moving, the game is a draw.</li></ul>"
  },

});
legal=gen(B,1);
new MutationObserver(function(){ var k=document.body.getAttribute("data-set");
  if(PREVIEW&&previewPick&&k!==previewPick){ document.body.setAttribute("data-set",previewPick); return; }
  applyDesign(k||"garden"); }).observe(document.body,{attributes:true,attributeFilter:["data-set"]});
document.addEventListener("DOMContentLoaded",function(){
  layout(); stageReady=true;
  var go=function(){ fontsReady=true; curDesign=null; applyDesign(previewPick||document.body.getAttribute("data-set")||"garden"); previewBar(); paint(); if(CODE) bootOnline(); };
  /* the monogram needs the fonts before the table is painted */
  if(document.fonts&&document.fonts.load) Promise.all([document.fonts.load('500 40px Montserrat'),document.fonts.load('40px Pacifico')]).then(go,go); else go();
});
