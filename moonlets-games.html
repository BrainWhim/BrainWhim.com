<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Moon Games · Moonlets · BrainWhim</title>
<link rel="stylesheet" href="kids.css?v=1113a">
<style>
/* ==========================================================================
   BrainWhim · Moonlets: the Moon Games nook (Nov 13, 2026). The meadow's glowing stepping-stone path leads here.
   A shelf of small games for little Moonlets, more added over time (Judy, Nov 13: Moonlets needs lots more to do).
   Each game is a moonstone card in the GAMES table below: id, name, a short line, page, and a tiny drawing.
   First game: Moon Drops (moonlets-drops.html, four in a row against Finn). Finn's line: mg-hi.
   ========================================================================== */
.bg{position:fixed;inset:-12px;z-index:-1;background:url("kids-moonlets-sm.jpg") 50% 80%/cover;filter:blur(2px) brightness(.5)}
.mg{min-height:100svh;display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:calc(84px + var(--k-safe-t)) 14px calc(18px + var(--k-safe-b))}
.top{width:min(100%,720px);display:flex;justify-content:center;padding-top:16px}
.top .k-finn-in{margin:0}
.top .k-finn{display:block;position:relative;width:fit-content;max-width:100%}
.top .k-fm{position:absolute;left:-12px;top:-18px;z-index:2;width:62px;height:62px;cursor:pointer}
.top .k-finn .k-fb{margin:0;padding:12px 18px 12px 54px;border-radius:20px}
.shelf{width:min(100%,900px);display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin-top:auto;margin-bottom:auto}
.gm{appearance:none;cursor:pointer;width:min(100%,290px);padding:18px 18px 20px;border-radius:28px;text-align:center;font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,rgba(120,110,230,.35),transparent 60%),linear-gradient(180deg,rgba(36,46,104,.92),rgba(14,20,52,.94));
  border:1px solid rgba(255,226,150,.5);
  box-shadow:0 0 0 3px rgba(255,226,150,.08),0 0 26px rgba(255,214,120,.28),0 14px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);
  transition:transform .15s}
.gm::before{content:"✦  ☾  ✧";position:absolute;top:8px;left:0;right:0;font-size:11px;letter-spacing:.5em;color:rgba(255,233,168,.55)}
.gm:active{transform:scale(.97)}
.gm .pic{width:78%;max-width:210px;aspect-ratio:1/1;filter:none}
.gm b{font-size:23px;font-weight:700;color:#fff3d6;line-height:1.1;text-shadow:0 0 12px rgba(255,214,120,.35)}
.gm i{font-style:normal;font-size:14.5px;color:#cfdaf0;line-height:1.35}
.more{font-size:14px;color:#dbe6ff;text-shadow:0 1px 6px rgba(0,0,0,.7);margin:0;text-align:center}
.back{appearance:none;cursor:pointer;border:1px solid rgba(255,236,190,.35);border-radius:999px;padding:12px 22px;font:inherit;font-weight:700;font-size:15px;color:#fff3d6;
  background:linear-gradient(180deg,rgba(32,44,90,.9),rgba(16,24,54,.9));box-shadow:0 6px 14px rgba(0,0,0,.4)}
.mg.go{transition:opacity .5s, transform .5s;opacity:0;transform:scale(1.08)}
@media (max-width:600px){.top .k-fm{width:56px;height:56px}.top .k-finn .k-fb{font-size:15.5px;padding:10px 14px 10px 48px}}
</style>
<link rel="icon" href="favicon.ico?v=1113a" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="bw-icon-32.png?v=1113a"><link rel="icon" type="image/png" sizes="192x192" href="bw-icon-192.png?v=1113a"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=1113a">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main class="mg" id="mg">
  <section class="top" id="finnHere"></section>
  <div class="shelf" id="shelf"></div>
  <p class="more">More moon games are on the way!</p>
  <button class="back" id="bBack">☾ Back to the meadow</button>
</main>

<script src="kids.js?v=1112a"></script>
<script>
(function(){
  var HI="Welcome to the Moon Games! Tap a game to play.";
  BWK.lines({"mg-hi":HI});
  BWK.init({here:"moonlets", voice:"finn", intro:HI, noHello:true});
  var $=function(id){return document.getElementById(id);};
  function face(id){ return '<svg class="k-fm" viewBox="0 0 100 100" aria-hidden="true"><defs>'+
    '<radialGradient id="'+id+'g" cx="30%" cy="35%" r="75%"><stop offset="0" stop-color="#fffaf0"/><stop offset=".6" stop-color="#f6e6bd"/><stop offset="1" stop-color="#dcc188"/></radialGradient>'+
    '<mask id="'+id+'m"><rect width="100" height="100" fill="#fff"/><circle cx="71" cy="37" r="31" fill="#000"/></mask></defs>'+
    '<circle cx="48" cy="54" r="38" fill="url(#'+id+'g)" mask="url(#'+id+'m)"/>'+
    '<ellipse cx="25" cy="58" rx="3.2" ry="4.2" fill="#3b2a12"/><ellipse cx="40" cy="67" rx="3.2" ry="4.2" fill="#3b2a12"/>'+
    '<circle cx="24.2" cy="56.6" r="1.1" fill="#fff"/><circle cx="39.2" cy="65.6" r="1.1" fill="#fff"/>'+
    '<ellipse cx="20" cy="68" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/><ellipse cx="44" cy="78" rx="4.5" ry="2.6" fill="#f2a98f" opacity=".55"/>'+
    '<path d="M27 72 q5 7 11 3" stroke="#3b2a12" stroke-width="2.6" fill="#a5523a" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<g><path d="M68 50l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#fff3c4"/><path d="M80 40l1.1 2.7 2.7 1.1-2.7 1.1-1.1 2.7-1.1-2.7-2.7-1.1 2.7-1.1z" fill="#ffe7a0"/>'+
    '<circle cx="75" cy="58" r="1.6" fill="#fff"/><circle cx="62" cy="44" r="1.2" fill="#ffeab0"/></g></svg>'; }
  var top=$("finnHere");
  top.innerHTML='<div class="k-finn k-finn-in">'+face("mgS")+'<p class="k-fb">'+HI+'</p></div>';
  var talked=false;
  function say(t,clip){ talked=true; BWK.finn(t,{into:top, clip:clip}); }
  top.addEventListener("click",function(e){ if(e.target.closest(".k-fm")) say(HI,"mg-hi"); });
  document.addEventListener("click",function(e){ if(talked || e.target.closest(".gm,.back,.k-head,.k-sheet,.k-veil")) return; say(HI,"mg-hi"); });

  /* a tiny Moon Drops board: lavender face, dark holes, a few moons and stars */
  function dropsPic(){
    var s='<svg class="pic" viewBox="0 0 200 200" aria-hidden="true"><defs>'+
      '<linearGradient id="mgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a8ef0"/><stop offset="1" stop-color="#5040b4"/></linearGradient>'+
      '<radialGradient id="mgH" cx="50%" cy="35%" r="65%"><stop offset="0" stop-color="#05091d"/><stop offset=".75" stop-color="#0d1640"/><stop offset="1" stop-color="#1a2558"/></radialGradient>'+
      '<radialGradient id="mgK" cx="34%" cy="28%" r="72%"><stop offset="0" stop-color="#fff"/><stop offset=".12" stop-color="#fff"/><stop offset=".48" stop-color="#ff8fc8"/><stop offset="1" stop-color="#c4447f"/></radialGradient>'+
      '<radialGradient id="mgF" cx="34%" cy="28%" r="72%"><stop offset="0" stop-color="#fffbe8"/><stop offset=".48" stop-color="#ffd970"/><stop offset="1" stop-color="#c9932c"/></radialGradient>'+
      '<linearGradient id="mgR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c2"/><stop offset="1" stop-color="#d9a94a"/></linearGradient></defs>'+
      '<rect x="14" y="64" width="172" height="122" rx="18" fill="url(#mgB)" stroke="#2c2270" stroke-width="2"/>'+
      '<rect x="14" y="64" width="172" height="20" rx="18" fill="#fff" opacity=".12"/>';
    function moon(x,y,r){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#mgK)"/>'+
      '<ellipse cx="'+(x-r*.3)+'" cy="'+(y-r*.12)+'" rx="'+(r*.09)+'" ry="'+(r*.13)+'" fill="#2a1f3d"/><ellipse cx="'+(x+r*.3)+'" cy="'+(y-r*.12)+'" rx="'+(r*.09)+'" ry="'+(r*.13)+'" fill="#2a1f3d"/>'+
      '<path d="M'+(x-r*.28)+' '+(y+r*.2)+' q'+(r*.28)+' '+(r*.3)+' '+(r*.56)+' 0" stroke="#2a1f3d" stroke-width="'+(r*.08)+'" fill="none" stroke-linecap="round"/>'+
      '<ellipse cx="'+(x-r*.55)+'" cy="'+(y+r*.18)+'" rx="'+(r*.15)+'" ry="'+(r*.09)+'" fill="#ff7896" opacity=".5"/><ellipse cx="'+(x+r*.55)+'" cy="'+(y+r*.18)+'" rx="'+(r*.15)+'" ry="'+(r*.09)+'" fill="#ff7896" opacity=".5"/>'; }
    function star(x,y,r){ var k=r/12; return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#mgF)"/>'+
      '<path transform="translate('+(x-12*k*.62)+','+(y-12*k*.62)+') scale('+(k*.62)+')" d="M12 2.5l2.6 6.1 6.6.6-5 4.4 1.5 6.5L12 16.7 6.3 20.1l1.5-6.5-5-4.4 6.6-.6z" fill="#fff6d2" stroke="#b9861f" stroke-width="1.3" stroke-linejoin="round"/>'; }
    var B=[[0,2,0],[1,1,2]], X=[52,100,148], Y=[104,154];
    for(var r=0;r<2;r++) for(var c=0;c<3;c++){ var x=X[c], y=Y[r], v=B[r][c];
      s+='<circle cx="'+x+'" cy="'+y+'" r="21" fill="url(#mgH)"/>';
      if(v===1) s+=moon(x,y,19); else if(v===2) s+=star(x,y,19);
      s+='<circle cx="'+x+'" cy="'+y+'" r="21.5" fill="none" stroke="url(#mgR)" stroke-width="2.6"/>'; }
    s+=moon(52,34,19)+'<path d="M52 8 v6 M44 12 l3 4 M60 12 l-3 4" stroke="#ffe9a8" stroke-width="2" stroke-linecap="round" opacity=".7"/>'+
      '<text x="168" y="40" font-size="16" fill="#ffe9a8" opacity=".8">✦</text><text x="20" y="56" font-size="11" fill="#d9c8ff" opacity=".8">✧</text>';
    return s+'</svg>'; }
  var GAMES=[{id:"drops", n:"Moon Drops", d:"Drop your moons. Get four in a row before Finn!", href:"moonlets-drops.html", pic:dropsPic}];
  $("shelf").innerHTML=GAMES.map(function(g){ return '<button class="gm" data-href="'+g.href+'">'+g.pic()+'<b>'+g.n+'</b><i>'+g.d+'</i></button>'; }).join("");
  $("shelf").addEventListener("click",function(e){ var b=e.target.closest(".gm"); if(!b) return;
    BWK.sfx("whoosh"); BWK.finnStop(); $("mg").classList.add("go"); setTimeout(function(){ location.href=b.dataset.href; },480); });
  $("bBack").onclick=function(){ BWK.sfx("whoosh"); BWK.finnStop(); setTimeout(function(){ location.href="moonlets.html"; },200); };
  window.addEventListener("pageshow",function(){ $("mg").classList.remove("go"); });
})();
</script>
</body>
</html>
