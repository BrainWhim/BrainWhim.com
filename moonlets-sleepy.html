/* ==========================================================================
   BrainWhim · Moonlets · My Moon Day: Sleepy Moon (Nov 17, 2026), a bedtime wind-down.
   The story: it's bedtime in the little bedroom (the Morning Chart's bedroom, at night). 1) Say goodnight to the glowing
   things: the lamp clicks off, the toys hop into their box, the moon in the window smiles, the buddy (shared with Brush-Brush
   and the Morning Chart) hops into bed and is tucked under the quilt; each one makes the room a little darker.
   2) Moon breaths: a big soft moon grows (breathe in) and shrinks (breathe out), 3 times (Big Moonlet: 5).
   3) Big Moonlet only: "What was good today?" tap up to three happy things. 4) Sweet dreams: a quiet lullaby for a minute,
   stars twinkle, the screen fades darker, and a moon goes on tonight in the week row (only ever adds).
   Pictures: drawn stand-ins until Judy's photos (sy/: bg, lamp, toybox, ball, bear, blocks; the bed reuses mo/bed.webp).
   Lines sy-*. Hook SYO.
   ========================================================================== */
.bg{position:fixed;inset:-12px;z-index:-1;background:#141a3a linear-gradient(180deg,#1b2350,#141a3a 60%,#0e1330) center/cover;filter:blur(1.2px) brightness(.9)}
html.sybg .bg{background:#141a3a url("sy/bg-sm.jpg?v=1117a") center 60%/cover}
@media (min-width:1100px){html.sybg .bg{background-image:url("sy/bg.jpg?v=1117a")}}
#shade{position:fixed;inset:0;z-index:20;pointer-events:none;background:#020414;opacity:0;transition:opacity 20s linear}
#shade.on{opacity:.62}
.sy{height:100svh;min-height:520px;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:calc(84px + var(--k-safe-t)) 12px calc(12px + var(--k-safe-b))}
.top{width:min(100%,720px);display:flex;justify-content:center;padding-top:16px;flex:none;min-height:96px}
@media (max-height:600px){.top{min-height:84px}}
.top .k-finn-in{margin:0}
.top .k-finn{display:block;position:relative;width:fit-content;max-width:100%}
.top .k-fm{position:absolute;left:-12px;top:-18px;z-index:2;width:62px;height:62px;cursor:pointer}
.top .k-finn .k-fb{margin:0;padding:12px 18px 12px 54px;border-radius:20px}

/* the little bedroom (5:3), everything placed in % so it scales */
#wrap{flex:1;min-height:0;width:min(100%,820px);display:flex;align-items:center;justify-content:center}

#dark{position:absolute;inset:0;background:#05061a;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:6}

@keyframes zz{50%{transform:translate(6px,-8px)}}

#box img,#box svg,.toy img,.toy svg{width:100%;height:100%;object-fit:contain;display:block}
/* the breathing moon */
#breath{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;flex-direction:column;gap:3%;background:radial-gradient(circle,rgba(20,24,70,.55),rgba(5,6,26,.85))}

#bm{width:42%;aspect-ratio:1;transform:scale(.62);transition:transform 4s ease-in-out}

#bm.out{transition-duration:5s}

#bt{color:#fff3d6;font-weight:700;font-size:clamp(18px,4svh,32px);text-shadow:0 2px 8px rgba(0,0,0,.6);min-height:1.3em}
#bn{color:#cfd8ff;font-size:clamp(13px,2.2svh,18px);font-weight:700}

#good{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(10,12,40,.8)}

#good .g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:92%}
#good button{appearance:none;border:0;cursor:pointer;border-radius:16px;padding:8px 4px;font:inherit;font-weight:700;font-size:clamp(12px,2svh,16px);color:#3a2a10;

.week b{font-size:12px;color:#c8d0f0}

  function on(){ return BWK.store.get("sound",true) && !!ac(); }
  function tone(f,t,d,v,type,f2,att){ var o=AC.createOscillator(), g=AC.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(att||.01)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(OUT); o.start(t); o.stop(t+d+.05); }
  var SND={
    click:function(){ if(!on()) return; var t=AC.currentTime+.01; tone(1800,t,.05,.06,"square"); tone(900,t+.04,.06,.04,"square"); },
    plunk:function(i){ if(!on()) return; var t=AC.currentTime+.01; tone([392,330,262][i%3],t,.3,.07,"triangle",[392,330,262][i%3]*.8); },
    chime:function(){ if(!on()) return; var t=AC.currentTime+.01; [1047,1319,1568].forEach(function(f,i){ tone(f,t+i*.12,.9,.035,"sine"); }); },
    hop:function(){ if(!on()) return; var t=AC.currentTime+.01; tone(330,t,.3,.06,"sine",660); tone(523,t+.5,.6,.04,"triangle"); },
    swell:function(up,d){ if(!on()) return; var t=AC.currentTime+.02; (up?[220,277,330]:[330,277,220]).forEach(function(f,i){ tone(f,t+i*.05,d,.022,"sine",up?f*1.12:f*.9,d*.45); }); },
    pick:function(){ if(!on()) return; var t=AC.currentTime+.01; tone(784,t,.5,.05,"triangle"); tone(1175,t+.08,.5,.03,"sine"); }
  };
  /* the lullaby (the Brush-Brush Timer's lullaby), quieter, for about a minute, then fading */
  var LUL={beat:.66, notes:[392,330,262,330,392,440,392,330,349,294,247,294,349,392,349,294]}, lulT=0, lulI=0, lulNext=0, lulEnd=0;
  function lullaby(){ if(!on()) return; clearInterval(lulT); lulI=0; lulNext=AC.currentTime+.1; lulEnd=AC.currentTime+60;
    lulT=setInterval(function(){ if(!AC) return; var now=AC.currentTime; if(now>lulEnd){ clearInterval(lulT); return; } var fade=Math.max(.15,Math.min(1,(lulEnd-now)/20));
      while(lulNext<now+.6){ var f=LUL.notes[lulI%LUL.notes.length]; tone(f,lulNext,1.7,.026*fade,"sine",0,.06); tone(f*2,lulNext+.01,.9,.006*fade); if(lulI%3===0) tone(f/2,lulNext,2.2,.016*fade); lulI++; lulNext+=LUL.beat; } },150); }
  function hush(){ clearInterval(lulT); }

  /* ---------- pictures: Judy's photos switch on as they load (sy/); drawn stand-ins meanwhile ---------- */
  var PH={};
  function loadPh(k,src,cb){ var im=new Image(); im.onload=function(){ PH[k]=src; if(cb) cb(); }; im.src=src; }
  var ART={
    lamp:'<svg viewBox="0 0 60 120"><path d="M14 8 h32 l10 38 h-52z" fill="#ffe9b0" stroke="#d9b06a" stroke-width="2"/><rect x="27" y="46" width="6" height="56" fill="#b9905a"/><ellipse cx="30" cy="108" rx="18" ry="6" fill="#8a6236"/></svg>',
    box:'<svg viewBox="0 0 100 80"><rect x="4" y="18" width="92" height="58" rx="6" fill="#d06a5a" stroke="#8a3a2e" stroke-width="3"/><rect x="4" y="18" width="92" height="12" fill="#e98a7a"/><path d="M20 50 h60" stroke="#ffd6c8" stroke-width="4" stroke-linecap="round"/></svg>',
    ball:'<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="#ffcf4a" stroke="#c9932c" stroke-width="2"/><path d="M4 30 q26 -18 52 0 M30 4 q-14 26 0 52" stroke="#e9564a" stroke-width="5" fill="none"/></svg>',
    bear:'<svg viewBox="0 0 60 80"><circle cx="16" cy="14" r="9" fill="#b07a4a"/><circle cx="44" cy="14" r="9" fill="#b07a4a"/><circle cx="30" cy="26" r="18" fill="#c48a56"/><ellipse cx="30" cy="58" rx="20" ry="20" fill="#c48a56"/><ellipse cx="30" cy="31" rx="7" ry="5" fill="#f1d2a8"/><circle cx="23" cy="23" r="2.4" fill="#3b2a20"/><circle cx="37" cy="23" r="2.4" fill="#3b2a20"/><circle cx="30" cy="29" r="2.2" fill="#3b2a20"/><ellipse cx="30" cy="60" rx="10" ry="10" fill="#f1d2a8"/></svg>',
    blocks:'<svg viewBox="0 0 60 50"><rect x="2" y="22" width="26" height="26" rx="3" fill="#7cc6ee" stroke="#3f8fbe" stroke-width="2"/><rect x="32" y="22" width="26" height="26" rx="3" fill="#86e69a" stroke="#2f9a4a" stroke-width="2"/><rect x="17" y="0" width="26" height="24" rx="3" fill="#ff8fb0" stroke="#c4447f" stroke-width="2"/></svg>',
    moon:function(smile){ return '<svg viewBox="0 0 100 100"><defs><radialGradient id="syMn" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fffbe8"/><stop offset=".6" stop-color="#f6e6bd"/><stop offset="1" stop-color="#d9b86a"/></radialGradient></defs>'+
      '<circle cx="50" cy="50" r="44" fill="url(#syMn)"/><circle cx="32" cy="34" r="6" fill="#e6cf98" opacity=".6"/><circle cx="66" cy="70" r="8" fill="#e6cf98" opacity=".5"/>'+
      (smile?'<path d="M30 48 q6 6 12 0 M58 48 q6 6 12 0" stroke="#7a5a30" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M40 64 q10 8 20 0" stroke="#7a5a30" stroke-width="3" fill="none" stroke-linecap="round"/>'
        :'<circle cx="36" cy="46" r="4" fill="#7a5a30"/><circle cx="64" cy="46" r="4" fill="#7a5a30"/><path d="M42 62 q8 5 16 0" stroke="#7a5a30" stroke-width="3" fill="none" stroke-linecap="round"/>')+
      '<ellipse cx="26" cy="58" rx="6" ry="3.5" fill="#ff9a8a" opacity=".45"/><ellipse cx="74" cy="58" rx="6" ry="3.5" fill="#ff9a8a" opacity=".45"/></svg>'; }};
  function pic(k){ return PH[k]?'<img src="'+PH[k]+'" alt="" draggable="false">':ART[k]; }
  function drawThings(){ $("lamp").innerHTML=pic("lamp"); $("box").innerHTML=pic("box"); $("t1").innerHTML=pic("ball"); $("t2").innerHTML=pic("bear"); $("t3").innerHTML=pic("blocks");
    $("moon").innerHTML=ART.moon(done.moon); $("bed").innerHTML='<img src="mo/bed.webp?v=1117a" alt="" draggable="false">'; $("quilt").innerHTML='<img src="mo/bed.webp?v=1117a" alt="" draggable="false">';
    var a=AN[buddyI()]; $("buddy").innerHTML='<img src="sl/c-'+a[0]+'.webp?v=1115a" alt="" draggable="false">'; }
  loadPh("bg","sy/bg-sm.jpg?v="+AV,function(){ document.documentElement.classList.add("sybg","syroom"); });
  ["lamp","box","ball","bear","blocks"].forEach(function(k){ loadPh(k,"sy/"+k+".webp?v="+AV,drawThings); });
  (function(){ var h=""; [[10,14],[24,30],[14,62],[38,70],[8,84],[30,8],[44,40]].forEach(function(p,i){ h+='<i class="star" style="left:'+p[0]+'%;top:'+p[1]+'%;animation-delay:-'+(i*.4)+'s"></i>'; }); $("stars").innerHTML=h; })();

  /* ---------- the bedtime ---------- */
  var big=BWK.big(), ph="night", done={}, picked=[], bTimer=0;
  var THINGS=["lamp","toys","moon","buddy"];
  function glows(){ THINGS.forEach(function(k){ var e=document.querySelector('[data-g="'+k+'"]'); e.classList.toggle("glow",ph==="night"&&!done[k]); }); }
  function darkness(){ var n=Object.keys(done).length; $("dark").style.opacity=(n*.09).toFixed(2); }
  function goodnight(k){ if(ph!=="night"||done[k]) return; done[k]=1;
    if(k==="lamp"){ SND.click(); $("room").classList.add("lampoff"); }
    else if(k==="toys"){ ["t1","t2","t3"].forEach(function(id,i){ setTimeout(function(){ var t=$(id), bx=$("box").getBoundingClientRect(), tr=t.getBoundingClientRect();  /* hop into the middle of the toy box */
          t.style.transform="translate("+Math.round(bx.left+bx.width*(.3+.2*i)-tr.left-tr.width/2)+"px,"+Math.round(bx.top+bx.height*.08-tr.top-tr.height/2)+"px) scale(.7)"; SND.plunk(i); },i*350); }); }  /* they stay peeking over the rim of the box */
    else if(k==="moon"){ SND.chime(); $("moon").innerHTML=ART.moon(true); $("moon").classList.add("smile"); $("win").classList.add("twinkle"); setTimeout(function(){ $("win").classList.remove("twinkle"); },2500); }
    else if(k==="buddy"){ SND.hop(); $("buddy").classList.add("inbed"); setTimeout(function(){ $("zz").classList.add("on"); },1100); }
    glows(); darkness();
    var left=THINGS.filter(function(x){ return !done[x]; }).length;
    say(GN[k],"sy-"+k,{onend:function(){ if(!left) setTimeout(breathe,700); }});
    if(!left) clearTimeout(bTimer), bTimer=setTimeout(function(){ if(ph==="night") breathe(); },9000); }
  document.querySelectorAll("[data-g]").forEach(function(b){ b.addEventListener("click",function(){ goodnight(b.dataset.g); }); });

  /* Judy's photo moon for the breaths (sy/moon.webp); the drawn moon until it loads */
  var MOONOK=false, mi=new Image(); mi.onload=function(){ MOONOK=true; }; mi.src="sy/moon.webp?v=1117a";
  function breathe(){ if(ph!=="night") return; ph="breathe"; clearTimeout(bTimer); bar();
    var bx=$("breath"), bm=$("bm"); bm.innerHTML=MOONOK?'<img src="sy/moon.webp?v=1117a" alt="">':ART.moon(true); bm.className=""; bx.classList.add("on"); $("bt").textContent=""; $("bn").textContent="";
    var N=big?5:3, n=0;
    say(BREATHE,"sy-breathe",{onend:function(){ setTimeout(cycle,600); }});
    function cycle(){ if(ph!=="breathe") return; if(n>=N){ bx.classList.remove("on"); if(big) askGood(); else sleep(); return; } n++;
      $("bn").textContent=n+" of "+N; $("bt").textContent="Breathe in…"; bm.className="in"; SND.swell(true,4);
      setTimeout(function(){ if(ph!=="breathe") return; $("bt").textContent="Breathe out…"; bm.className="out"; SND.swell(false,5); setTimeout(cycle,5200); },4300); } }
  function askGood(){ ph="good"; picked=[]; var h=""; GOOD.forEach(function(g){ h+='<button data-k="'+g[0]+'" aria-label="'+g[1]+'"><em>'+g[2]+'</em>'+g[1]+'</button>'; });
    $("goodG").innerHTML=h; $("good").classList.add("on"); say(ASK,"sy-ask"); bar(); }
  $("goodG").addEventListener("click",function(e){ var b=e.target.closest("button"); if(!b||ph!=="good"||b.classList.contains("on")) return; b.classList.add("on"); SND.pick();
    var g=GOOD.filter(function(x){ return x[0]===b.dataset.k; })[0]; picked.push(g[0]);
    say(g[3],"sy-g-"+g[0],{onend:function(){ if(picked.length>=3&&ph==="good") setTimeout(sleep,500); }}); });
  function sleep(){ if(ph==="dream") return; ph="dream"; $("good").classList.remove("on"); $("breath").classList.remove("on"); $("dark").style.opacity=".45";
    S.days[dayKey()]=1; save(); week(); BWK.played&&BWK.played("sleepy"); bar();
    say(NIGHT,"sy-night",{onend:function(){ lullaby(); $("shade").classList.add("on"); }}); }
  function reset(){ hush(); ph="night"; done={}; picked=[]; clearTimeout(bTimer); $("room").classList.remove("lampoff"); $("moon").classList.remove("smile"); $("buddy").classList.remove("inbed"); $("zz").classList.remove("on");
    ["t1","t2","t3"].forEach(function(id){ var t=$(id); t.style.transform=""; t.classList.remove("away"); }); $("breath").classList.remove("on"); $("good").classList.remove("on"); $("shade").classList.remove("on");
    drawThings(); glows(); darkness(); bar(); }
  function week(){ var now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()), h="", N=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    for(var i=0;i<7;i++){ var dd=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i,12), k=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
      h+='<div class="'+(i===now.getDay()?'today':'')+'"><b>'+N[i]+'</b><i class="'+(S.days[k]?'on':'')+'" aria-label="'+N[i]+(S.days[k]?', bedtime done':'')+'"></i></div>'; }
    $("week").innerHTML=h; }
  function bar(){ $("bar").innerHTML=(ph==="dream"||ph==="breathe"||ph==="good"?'<button class="chip" data-a="again" aria-label="Start again"><em>↺</em><span>Start again</span></button>':'')+
      (ph==="good"?'<button class="chip go" data-a="sleep" aria-label="Goodnight"><em>☾</em><span>Goodnight</span></button>':'')+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="day" data-say="My Moon Day"><em>☾</em><span>My Moon Day</span></button>'; }
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; BWK.sfx("tap"); var a=b.dataset.a;
    if(a==="again"){ reset(); say(AGAIN,"sy-again"); }
    else if(a==="sleep"){ sleep(); }
    else if(a==="big"){ big=!big; talked=true; BWK.setBig(big,top); bar(); }
    else if(a==="day"){ hush(); BWK.finnStop(); BWK.sfx("whoosh"); setTimeout(function(){ location.href="moonlets-day.html"; },200); } });
  window.addEventListener("bwk-big",function(e){ big=!!e.detail; });
  document.addEventListener("click",function(e){ if(talked || !e.target.isConnected || e.target.closest("#room,.chip,.k-head,.k-sheet,.k-veil")) return; say(HI,"sy-hi"); });
  document.addEventListener("visibilitychange",function(){ if(document.hidden) hush(); });

  reset(); week();
  window.SYO={state:function(){ return {ph:ph, done:Object.keys(done), picked:picked.slice(), big:big, night:!!S.days[dayKey()]}; },
    tap:goodnight, breathe:breathe, ask:askGood, sleep:sleep, reset:reset, big:function(o){ big=!!o; BWK.setBig(big); bar(); }};
})();
</script>
</body>
