.p{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}

.wv{background-image:var(--woodv);background-size:600px 1200px;background-repeat:no-repeat;background-color:var(--woodc)}

function card(c,o){
  o=o||{}; var e=document.createElement("div"); e.className="cd "+(c&&(c.s===1||c.s===2)?"red":"blk");
  var s='<div class="sh"></div><div class="s" style="transform:translateZ(1px)"></div>';
  if(o.back||!c) s+='<div class="bk" style="transform:translateZ(2.4px)"><span class="mono"><b>B</b><i>W</i></span></div>';
  else {
    var R=RANKS[c.r], S=SUITS[c.s], mid="";
    if(c.r===0) mid='<div class="pips"><span class="ace" style="left:50%;top:50%">'+S+'</span></div>';
    else if(c.r>=10) mid='<div class="court"><b>'+R+'</b><i>'+S+'</i></div>';
    else mid='<div class="pips">'+LAYOUT[c.r+1].map(function(p){ return '<span class="'+(p[1]>50?"dn":"")+'" style="left:'+p[0]+'%;top:'+p[1]+'%">'+S+'</span>'; }).join("")+'</div>';
    s+='<div class="f" style="transform:translateZ(2.4px)"><div class="ix"><b>'+R+'</b><i>'+S+'</i></div>'+mid+'<div class="ix br"><b>'+R+'</b><i>'+S+'</i></div></div>';
  }
  e.innerHTML=s; CL.appendChild(e); return e;
}
function at(e,x,y,z,r){ e.style.transform="translate3d("+x+"px,"+y+"px,"+(z||-12)+"px)"+(r?" rotate("+r+"deg)":""); }
/* ---------- a sample table ---------- */
var hand=[],pile=[],count=0,me=[0,0];
function val(c){ return c.r===0?1:c.r>=10?10:c.r+1; }
function deal(){
  CL.innerHTML=""; var d=[]; for(var s=0;s<4;s++) for(var r=0;r<13;r++) d.push({s:s,r:r});
  var rr=rng(Date.now()%9999+3); for(var i=d.length-1;i>0;i--){ var j=Math.floor(rr()*(i+1)); var t=d[i]; d[i]=d[j]; d[j]=t; }
  hand=d.splice(0,4); pile=d.splice(0,2); var starter=d.pop(); count=pile.reduce(function(a,c){return a+val(c);},0);
  /* the deck and the starter, cut face up on top */
  for(var k=0;k<6;k++){ var dk=card(null,{back:true}); at(dk,724+k*.6,436-k*.6,-12+k*1.2); }
  var st=card(starter); at(st,742,452,-2,8);
  /* The House's hand, face down and slightly fanned */
  for(k=0;k<4;k++){ var hb=card(null,{back:true}); at(hb,450+k*58,150,-12+k*.5,(k-1.5)*3); }
  /* the crib: four cards face down beside the dealer (you) */
  for(k=0;k<4;k++){ var cb=card(null,{back:true}); at(cb,742+k*1.5,668-k*1.5,-12+k*1.2,-6); }
  pile.forEach(function(c,k){ var pe=card(c); at(pe,380+k*40,440,-12+k*.8,(k%2?3:-2)); pe._pile=1; });
  hand.forEach(function(c,k){ var e=card(c); at(e,350+k*96,712,-12,0); e._c=c; e._k=k; e.onclick=function(){ play(e); }; });
  mark();
}
function mark(){
  var n=0; CL.querySelectorAll(".cd").forEach(function(e){ if(!e._c) return; var ok=count+val(e._c)<=31; e.classList.toggle("play",ok); if(ok)n++; });
  document.getElementById("count").innerHTML="Count<b>"+count+"</b>";
  var d=DESIGNS[cur]; document.getElementById("status").innerHTML="<b>"+d.name+"</b> · "+d.names+". "+(n?n+" of your cards can play.":"Go: none of your cards fit under 31.");
}
function play(e){
  if(!e.classList.contains("play")) return;
  var k=CL.querySelectorAll(".cd").length, np=CL.querySelectorAll(".cd").length;
  var placed=[].filter.call(CL.children,function(x){ return x._pile; }).length;
  e.style.transition="transform .55s cubic-bezier(.3,.7,.3,1)"; at(e,380+placed*40,440,-12+placed*.8+40,(placed%2?3:-2));
  setTimeout(function(){ at(e,380+placed*40,440,-12+placed*.8,(placed%2?3:-2)); },300);
  e._pile=1; count+=val(e._c); e._c=null; e.classList.remove("play"); e.onclick=null; mark();
}
/* ---------- pegs: each player has two; the back peg jumps past the front one ---------- */
var pegs={A:[],B:[]}, score={A:[0,0],B:[0,0]};
function mkPeg(side){ var e=document.createElement("div"); e.className="p peg "+(side==="A"?"a":"b"); e.innerHTML='<div class="ps"></div><div class="pb"></div><div class="ph"></div>'; PL.appendChild(e); return e; }
function setPeg(e,n,side){ var q=holeXY(side,n); e.style.transform="translate3d("+q[0]+"px,"+q[1]+"px,-1px)"; }
function placePegs(){ ['A','B'].forEach(function(sd){ setPeg(pegs[sd][0],score[sd][0],sd); setPeg(pegs[sd][1],score[sd][1],sd); }); }
['A','B'].forEach(function(sd){ pegs[sd]=[mkPeg(sd),mkPeg(sd)]; });
score.A=[41,47]; score.B=[52,58]; placePegs();
document.getElementById("peg").onclick=function(){ var s=score.A, back=s[0]<=s[1]?0:1, front=1-back; s[back]=Math.min(121,s[front]+2); placePegs();
  document.getElementById("status").innerHTML="<b>Pegged.</b> Your back peg jumped ahead to "+s[back]+"."; };
document.getElementById("deal").onclick=deal;
var cache={},cur="maple";
function apply(k){cur=k;var d=DESIGNS[k];if(!cache[k]){var w=canvasOf(1200,600,woodFn(d.table));cache[k]={w:url(w),v:url(rot(w)),top:url(canvasOf(256,256,leatherFn(d.top,k.length*17))),b:url(rot(canvasOf(728,150,woodFn(d.bwood))))};}
  var s=T.style;s.setProperty("--wood",cache[k].w);s.setProperty("--woodv",cache[k].v);s.setProperty("--woodc",d.tablec);s.setProperty("--top",cache[k].top);s.setProperty("--topc","rgb("+d.top+")");s.setProperty("--tool",d.tool);
  s.setProperty("--bwood",cache[k].b);s.setProperty("--bwoodc",d.bwoodc);s.setProperty("--binlay",d.binlay);s.setProperty("--hring",d.hring);s.setProperty("--blab",d.blab);
  s.setProperty("--pegA",d.pegA);s.setProperty("--pegA2",d.pegA2);s.setProperty("--pegB",d.pegB);s.setProperty("--pegB2",d.pegB2);s.setProperty("--cback",d.back);
  document.querySelectorAll("#designs button").forEach(function(b){b.classList.toggle("on",b.dataset.d===k);});mark();}
document.querySelectorAll("#designs button").forEach(function(b){b.onclick=function(){apply(b.dataset.d);};});
function fit(){var w=Math.min(innerWidth-8,1150),s=Math.min(w/868,Math.max(300,innerHeight-240)/868,1.1);document.getElementById("scaler").style.transform="scale("+s+")";var f=document.getElementById("fit");f.style.width=868*s+"px";f.style.height=868*s+"px";}
addEventListener("resize",fit);fit();deal();apply("maple");
</script>
