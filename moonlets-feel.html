/* ==========================================================================
   BrainWhim · Moonlets · My Moon Day: How Do I Feel? (Nov 17, 2026)
   Clover the bunny (the Slime Lab bunny, sl/c-clover) helps little ones name feelings. Two ways to play:
   1) How I feel: tap the face that feels like you. Clover shows it, Finn says it's okay to feel that way and offers one small
      thing to try (a hug for sad, dragon breaths for mad, counting to five for scared, three jumps for excited...). Today's
      feeling goes on the week row as a little colored face (no right or wrong, nothing to lose).
   2) Stories: Finn tells a tiny story about Clover; tap how Clover feels. The expected feeling gets "Yes!"; any other gets
      "Hmm, could be! I think Clover feels…" (feelings are never wrong). Three stories a round, then "More stories".
   Little: happy, sad, mad, scared, surprised, tired. Big Moonlet adds proud, worried, shy, excited (and their stories).
   Faces are drawn stand-ins until Judy's photos (hf/<feeling>.webp, Clover with each feeling; hf/bg). Lines hf-*. Hook HFO.
   ========================================================================== */

  var SND={
    pick:function(k){ if(!on()) return; var t=AC.currentTime+.01, f=PITCH[k]||660; tone(f,t,.45,.07,"triangle"); tone(f*1.5,t+.06,.4,.03,"sine"); },
    yes:function(){ if(!on()) return; var t=AC.currentTime+.02; [659,784,1047].forEach(function(f,i){ tone(f,t+i*.09,.5,.06,"triangle"); }); },
    maybe:function(){ if(!on()) return; var t=AC.currentTime+.02; tone(587,t,.35,.05,"sine"); tone(523,t+.18,.45,.05,"sine"); },
    hug:function(){ if(!on()) return; var t=AC.currentTime+.02; [262,330,392,523].forEach(function(f){ tone(f,t,1.6,.03,"sine"); }); },
    whoosh:function(d){ if(!on()) return; noise(AC.currentTime+.02,d,.08,700); },
    count:function(n){ if(!on()) return; var t=AC.currentTime+.01; tone([523,587,659,698,784][n-1]||784,t,.4,.06,"triangle"); },
    boing:function(){ if(!on()) return; var t=AC.currentTime+.01; tone(220,t,.35,.07,"sine",660); },
    done:function(){ if(!on()) return; var t=AC.currentTime+.05; [523,659,784,1047,1319].forEach(function(f,i){ tone(f,t+i*.1,.6,.05,"triangle"); }); }
  };

  /* ---------- Judy's photos switch on as they load (hf/) ---------- */
  var PH={};
  function loadPh(k,src,cb){ var im=new Image(); im.onload=function(){ PH[k]=src; if(cb) cb(); }; im.src=src; }
  loadPh("bg","hf/bg-sm.jpg?v="+AV,function(){ document.documentElement.classList.add("hfbg"); });
  ORDER.concat(["think"]).forEach(function(k){ loadPh(k,"hf/"+k+".webp?v="+AV,function(){ faces(); if(cur===k||(k==="think"&&cur==="think")) showHero(cur); week(); }); });

  /* ---------- Clover's drawn face (stand-in): viewBox 120 ---------- */
  function bunny(k){ var f=F[k]||{eyes:"open",mouth:"small",think:1}, s='<svg viewBox="0 0 120 120" aria-hidden="true">';
    if(PH[k]) return '<img src="'+PH[k]+'" alt="" draggable="false">';
    var tired=k==="tired", shy=k==="shy";
    s+='<g transform="rotate('+(tired?-6:shy?4:0)+' 60 70)">';
    s+='<ellipse cx="42" cy="28" rx="10" ry="25" fill="url(#hfHead)" stroke="#cdb99a" stroke-width="1.2" transform="rotate(-12 42 28)"/><ellipse cx="42" cy="30" rx="5" ry="18" fill="url(#hfEar)" transform="rotate(-12 42 28)"/>';
    s+='<ellipse cx="78" cy="'+(tired?32:28)+'" rx="10" ry="25" fill="url(#hfHead)" stroke="#cdb99a" stroke-width="1.2" transform="rotate('+(tired?40:12)+' 78 28)"/><ellipse cx="78" cy="'+(tired?34:30)+'" rx="5" ry="18" fill="url(#hfEar)" transform="rotate('+(tired?40:12)+' 78 28)"/>';
    s+='<circle cx="60" cy="70" r="40" fill="url(#hfHead)" stroke="#cdb99a" stroke-width="1.2"/>';
    var bl=(f.x==="blush"||k==="mad")?.75:.42; s+='<ellipse cx="36" cy="80" rx="8" ry="5" fill="#ff8aa0" opacity="'+bl+'"/><ellipse cx="84" cy="80" rx="8" ry="5" fill="#ff8aa0" opacity="'+bl+'"/>';
    function eye(x){ var y=64, o="";
      if(f.eyes==="happy") o='<path d="M'+(x-6)+' '+(y+2)+' q6 -8 12 0" stroke="#3b2a20" stroke-width="3" fill="none" stroke-linecap="round"/>';
      else if(f.eyes==="half") o='<ellipse cx="'+x+'" cy="'+(y+2)+'" rx="5" ry="3" fill="#3b2a20"/><path d="M'+(x-7)+' '+y+' h14" stroke="#3b2a20" stroke-width="2.4" stroke-linecap="round"/>';
      else if(f.eyes==="wide") o='<circle cx="'+x+'" cy="'+y+'" r="8" fill="#fff" stroke="#3b2a20" stroke-width="1.6"/><circle cx="'+x+'" cy="'+(y+1)+'" r="4" fill="#3b2a20"/><circle cx="'+(x-1.3)+'" cy="'+(y-.6)+'" r="1.4" fill="#fff"/>';
      else if(f.eyes==="sparkle") o='<ellipse cx="'+x+'" cy="'+y+'" rx="6.5" ry="7.5" fill="#3b2a20"/><circle cx="'+(x-2)+'" cy="'+(y-3)+'" r="2.4" fill="#fff"/><circle cx="'+(x+2.4)+'" cy="'+(y+2.6)+'" r="1.2" fill="#fff"/>';
      else { var dx=f.eyes==="side"?3:0, dy=f.eyes==="side"?3:0; o='<ellipse cx="'+(x+dx)+'" cy="'+(y+dy)+'" rx="4.6" ry="5.8" fill="#3b2a20"/><circle cx="'+(x+dx-1.4)+'" cy="'+(y+dy-2)+'" r="1.5" fill="#fff"/>'; }
      return o; }
    s+=eye(46)+eye(74);
    if(f.brows==="angry") s+='<path d="M37 52 l13 6 M83 52 l-13 6" stroke="#6a4a30" stroke-width="3" stroke-linecap="round"/>';
    else if(f.brows==="worried") s+='<path d="M38 57 l12 -6 M82 57 l-12 -6" stroke="#6a4a30" stroke-width="2.6" stroke-linecap="round"/>';
    else if(f.brows==="up") s+='<path d="M39 51 q7 -5 14 0 M67 51 q7 -5 14 0" stroke="#6a4a30" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
    s+='<path d="M56 74 h8 l-4 4z" fill="#f08aa0" stroke="#d06a80" stroke-width="1" stroke-linejoin="round"/>';
    var m={smile:'<path d="M50 84 q10 10 20 0" stroke="#3b2a20" stroke-width="3" fill="none" stroke-linecap="round"/>',
      grin:'<path d="M47 82 q13 17 26 0z" fill="#9a3e30" stroke="#3b2a20" stroke-width="2.4" stroke-linejoin="round"/><path d="M53 89 q7 4 14 0 q-7 5 -14 0z" fill="#f08aa0"/>',
      frown:'<path d="M50 91 q10 -9 20 0" stroke="#3b2a20" stroke-width="3" fill="none" stroke-linecap="round"/>',
      flat:'<path d="M50 89 q10 -3 20 0" stroke="#3b2a20" stroke-width="3.2" fill="none" stroke-linecap="round"/>',
      wavy:'<path d="M48 88 q3 -3 6 0 t6 0 t6 0 t6 0" stroke="#3b2a20" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
      bigo:'<ellipse cx="60" cy="89" rx="6" ry="8" fill="#7a2e24" stroke="#3b2a20" stroke-width="2"/>',
      o:'<ellipse cx="60" cy="88" rx="4" ry="5" fill="#7a2e24" stroke="#3b2a20" stroke-width="1.8"/>',
      small:'<path d="M54 85 q6 5 12 0" stroke="#3b2a20" stroke-width="2.6" fill="none" stroke-linecap="round"/>'};
    s+=m[f.mouth]||m.small;
    if(f.x==="tear") s+='<path d="M44 72 q-3 6 0 9 q3 -3 0 -9z" fill="#7fc4ff" stroke="#4a9ae0" stroke-width=".8"/>';
    if(f.x==="drop") s+='<path d="M92 46 q-4 7 0 10 q4 -3 0 -10z" fill="#bfe6ff" stroke="#7fbfe8" stroke-width=".8"/>';
    if(f.x==="puff") s+='<path d="M28 38 l-6 -5 M32 32 l-3 -7 M92 38 l6 -5 M88 32 l3 -7" stroke="#ff6a5a" stroke-width="2.6" stroke-linecap="round"/>';
    s+='</g>';
    if(f.x==="zzz") s+='<text x="92" y="38" font-size="13" font-weight="700" fill="#7a6ab0">z</text><text x="100" y="26" font-size="17" font-weight="700" fill="#7a6ab0">Z</text>';
    if(f.x==="stars") s+='<path d="M18 40 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z M100 46 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" fill="#ffd34a" stroke="#d9a520" stroke-width=".8"/>';
    if(f.think) s+='<circle cx="98" cy="30" r="13" fill="#fff" stroke="#cdb99a" stroke-width="1.2"/><circle cx="86" cy="46" r="4" fill="#fff" stroke="#cdb99a" stroke-width="1"/><text x="98" y="36" font-size="18" font-weight="700" fill="#7a5ac8" text-anchor="middle">?</text>';
    return s+'</svg>'; }

  /* ---------- the game ---------- */
  var big=BWK.big(), mode="me", cur=null, story=null, round=0, seen=[], busy=0;
  function feels(){ return ORDER.filter(function(k){ return big||!F[k].big; }); }
  function faces(){ var ks=feels(), h="", fs=$("faces");
    var W=fs.clientWidth||340, n=ks.length, cols=W<520? (n>6?5:3) : n; if(W<520&&n>6) cols=5; fs.style.setProperty("--cols",cols);
    ks.forEach(function(k){ var f=F[k]; h+='<button class="fc'+(mode==="me"&&cur===k?' on':'')+'" data-k="'+k+'" aria-label="'+f.n+'" style="--fc:'+f.c+';--fd:'+f.d+'"><span class="pf">'+bunny(k)+'</span><b>'+f.n+'</b></button>'; });
    fs.innerHTML=h; }
  function showHero(k){ cur=k; var h=$("hero"); h.innerHTML=bunny(k); $("glow").style.setProperty("--fc",(F[k]||{c:"#fff3c4"}).c); h.className=""; void h.offsetWidth; h.className="pop"; }
  function fx(sym,n,col){ var w=$("heroW"); for(var i=0;i<n;i++) (function(i){ setTimeout(function(){ var e=document.createElement("i"); e.className="fx"; e.textContent=sym; e.style.color=col;
      e.style.left=(20+Math.random()*60)+"%"; e.style.top=(30+Math.random()*30)+"%"; e.style.fontSize=(22+Math.random()*16)+"px"; e.style.setProperty("--dx",((Math.random()-.5)*60)+"px");
      w.appendChild(e); setTimeout(function(){ e.remove(); },1900); },i*160); })(i); }
  function act(k){ var f=F[k], h=$("hero"), hint=$("hint"); clearTimeout(act.t); clearTimeout(act.t2); hint.textContent=""; var old=$("heroW").querySelector(".num"); if(old) old.remove();
    function cls(c){ h.className=""; void h.offsetWidth; h.className=c; }
    if(f.act==="hearts"){ fx("♥",7,"#ff6a8a"); }
    else if(f.act==="stars"){ fx("★",7,"#ffc93c"); }
    else if(f.act==="hug"){ cls("hug"); SND.hug(); fx("♥",5,"#ff8aa0"); }
    else if(f.act==="jump"){ cls("jump"); [0,700,1400].forEach(function(d){ setTimeout(SND.boing,d); }); fx("✦",6,"#ff8ae0"); }
    else if(f.act==="breathe"){ cls("breathe"); var ph=0; (function step(){ if(ph>=4){ hint.textContent=""; return; } hint.textContent=ph%2?"Blow out slowly…":"Breathe in…"; SND.whoosh(ph%2?2.6:2.2); ph++; act.t=setTimeout(step,3000); })(); }
    else if(f.act==="count"){ var n=0; (function step(){ var o=$("heroW").querySelector(".num"); if(o) o.remove(); if(n>=5){ return; } n++; var e=document.createElement("div"); e.className="num"; e.textContent=n; $("heroW").appendChild(e); SND.count(n); act.t2=setTimeout(step,1000); })(); }
    else cls("wig"); }
  function pickMe(k){ var t=dayKey(); S.days[t]={f:k}; save(); SND.pick(k); showHero(k);
    [].forEach.call($("faces").children,function(b){ b.classList.toggle("on",b.dataset.k===k); }); week(); BWK.played&&BWK.played("feel");
    var wait=F[k].act==="breathe"||F[k].act==="count";
    if(wait){ clearTimeout(act.t); clearTimeout(act.t2); $("hint").textContent=""; say(F[k].say,"hf-"+k,{onend:function(){ if(cur===k&&mode==="me") setTimeout(function(){ if(cur===k&&mode==="me") act(k); },400); }}); }
    else { say(F[k].say,"hf-"+k); setTimeout(function(){ act(k); },350); } }

  /* stories */
  function pool(){ return STORIES.map(function(s,i){ return i; }).filter(function(i){ return big||!STORIES[i][2]; }); }
  function nextStory(){ var p=pool().filter(function(i){ return seen.indexOf(i)<0; }); if(!p.length){ seen=[]; p=pool(); }
    story=p[Math.floor(Math.random()*p.length)]; seen.push(story); $("story").classList.remove("ans"); $("stTxt").textContent=STORIES[story][0]+" How does Clover feel?";
    $("stNext").textContent=round>=2?"More stories ▶":"Next story ▶"; showHero("think"); faces(); say(STORIES[story][0]+" How does Clover feel?","hf-st"+(story+1)); }
  function pickStory(k){ if(story==null||$("story").classList.contains("ans")) { SND.pick(k); return; }
    var want=STORIES[story][1]; showHero(want); $("story").classList.add("ans"); round++;
    if(k===want){ SND.yes(); fx("★",5,"#ffc93c"); say("Yes! Clover feels "+F[want].n.toLowerCase()+".","hf-yes-"+want,{onend:endRound}); }
    else { SND.maybe(); say("Hmm, could be! I think Clover feels "+F[want].n.toLowerCase()+".","hf-mb-"+want,{onend:endRound}); }
    $("stNext").textContent=round>=3?"More stories ▶":"Next story ▶"; }
  function endRound(){ if(round>=3){ round=0; SND.done(); fx("★",8,"#ffc93c"); say(SDONE,"hf-sdone"); BWK.played&&BWK.played("feel"); } }
  $("stNext").addEventListener("click",function(){ BWK.sfx("tap"); nextStory(); });

  $("faces").addEventListener("click",function(e){ var b=e.target.closest(".fc"); if(!b) return; if(mode==="me") pickMe(b.dataset.k); else pickStory(b.dataset.k); });
  $("hero").addEventListener("click",function(){ if(mode==="stories"&&story!=null&&!$("story").classList.contains("ans")){ say(STORIES[story][0]+" How does Clover feel?","hf-st"+(story+1)); return; }
    if(cur&&F[cur]) act(cur); else say(PIC,"hf-clover"); });

  function week(){ var now=new Date(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()), h="", N=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    for(var i=0;i<7;i++){ var dd=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i), r=S.days[dayKey(dd)]||{}, f=r.f&&F[r.f];
      h+='<div class="'+(i===now.getDay()?'today':'')+'"><b>'+N[i]+'</b><i style="'+(f?'background:'+f.c:'')+'" aria-label="'+N[i]+(f?', '+f.n:'')+'">'+(f?bunny(r.f):'')+'</i></div>'; }
    $("week").innerHTML=h; }
  function bar(){ $("bar").innerHTML=(mode==="me"?'<button class="chip go" data-a="stories" aria-label="Stories"><em>✦</em><span>Stories</span></button>':'<button class="chip go" data-a="me" aria-label="How I feel"><em>♡</em><span>How I feel</span></button>')+
      '<button class="chip bigc" data-a="big" aria-pressed="'+big+'"><i class="sw"></i><span>Big Moonlet</span></button>'+
      '<button class="chip" data-a="day" data-say="My Moon Day"><em>☾</em><span>My Moon Day</span></button>'; }
  function setMode(m){ mode=m; document.body.classList.toggle("stories",m==="stories"); clearTimeout(act.t); clearTimeout(act.t2); $("hint").textContent="";
    if(m==="stories"){ round=0; say(SHI,"hf-shi",{onend:function(){ if(mode==="stories"&&story==null) nextStory(); }}); story=null; showHero("think"); setTimeout(function(){ if(mode==="stories"&&story==null) nextStory(); },5200); }
    else { story=null; var r=S.days[dayKey()]; showHero(r&&r.f?r.f:"happy"); say(HI,"hf-hi"); }
    faces(); bar(); }
  $("bar").addEventListener("click",function(e){ var b=e.target.closest(".chip"); if(!b) return; BWK.sfx("tap"); var a=b.dataset.a;
    if(a==="stories"||a==="me") setMode(a);
    else if(a==="big"){ big=!big; talked=true; BWK.setBig(big,top); faces(); bar(); }
    else if(a==="day"){ BWK.finnStop(); BWK.sfx("whoosh"); setTimeout(function(){ location.href="moonlets-day.html"; },200); } });
  window.addEventListener("bwk-big",function(e){ if(!!e.detail!==big){ big=!!e.detail; faces(); } });
  document.addEventListener("click",function(e){ if(talked || !e.target.isConnected || e.target.closest("#faces,.chip,#hero,#story,.k-head,.k-sheet,.k-veil")) return; say(HI,"hf-hi"); });
  if(window.ResizeObserver) new ResizeObserver(function(){ faces(); }).observe($("faces"));

  var r0=S.days[dayKey()]; showHero(r0&&r0.f?r0.f:"happy"); faces(); week(); bar();
  window.HFO={state:function(){ return {mode:mode, big:big, cur:cur, story:story, round:round, feels:feels(), today:(S.days[dayKey()]||{}).f}; },
    pick:function(k){ if(mode==="me") pickMe(k); else pickStory(k); }, mode:setMode, next:nextStory, want:function(){ return story!=null?STORIES[story][1]:null; },
    big:function(o){ big=!!o; BWK.setBig(big); faces(); }};
})();
</script>
