<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn · BrainWhim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0D1630;
            color: #CBD5E1;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .card {
                    max-width: 520px;
                    width: 100%;
                    text-align: center;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                }
        .brand { font-size: 22px; margin-bottom: 28px; }
        .brand-brain { font-weight: 700; color: #fff; }
        .brand-whim { font-family: 'Pacifico', cursive; color: #7EB6D9; }
        h1 { color: #8B5CF6; font-size: 32px; margin: 0 0 12px; }
        p { line-height: 1.7; margin: 0 0 28px; }
        a { color: #7EB6D9; text-decoration: none; font-weight: 600; }
        a:hover { color: #a8d4f0; }

.brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
        }
        .page-logo {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }
        .brand-text {
            display: flex;
            align-items: center;
            font-size: 22px;
        }
        .gold-light {
            background: radial-gradient(circle, #8B5CF6 0%, transparent 70%);
            top: 0%;
            left: 10%;
            opacity: 0.70;
        }
        .warm-light {
            background: radial-gradient(circle, #6D28D9 0%, transparent 70%);
            bottom: 0%;
            right: 10%;
            opacity: 0.55;
        }

        @media (max-width: 992px) {
            .aurora-glow { width: 70vw; height: 70vw; filter: none; opacity: 0.28; }
            body {
                background:
                    radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.28), transparent 46%),
                    radial-gradient(circle at 80% 80%, rgba(109, 40, 217, 0.18), transparent 42%),
                    #152048;
            }
        }        


    </style>
</head>

<body>

    <div class="aurora-glow gold-light"></div>
    <div class="aurora-glow warm-light"></div>


    <div class="card">
        <div class="brand">
            <img src="logo-image.png" alt="BrainWhim" class="page-logo">
            <div class="brand-text">
                <span class="brand-brain">Brain</span><span class="brand-whim">Whim</span>
            </div>
        </div>
        <h1>Learn</h1>
        <p>Homeschool tools, skill mapping, and learning systems are on the way. This page is the first placeholder for the Learn track.</p>
        <a href="index.html">Back to BrainWhim</a>
    </div>
</body>

</html>
