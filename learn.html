<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Learn · BrainWhim</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --studio-bg: #141D3B;
            --track-glow: #8B5CF6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            background: var(--studio-bg);
            color: #CBD5E1;
            font-family: 'Montserrat', sans-serif;
            padding-top: 110px;
            overflow-x: hidden;
        }

        /* SPACE CLOUD EXTRA TEXTURE */
        body {
            background-image: 
                radial-gradient(1px 1px at 40px 80px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 180px 240px, rgba(255,255,255,0.4), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 290px 110px, rgba(255,255,255,0.5), rgba(0,0,0,0));
            background-size: 400px 400px;
        }
        
        header {
            background: linear-gradient(to top, rgba(20,29,59,0.85), #1a264d);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--track-glow);
            padding: 0 4%; display: flex; justify-content: space-between; align-items: center;
            position: fixed; top: 0; left: 0; width: 100%; height: 110px; z-index: 99999;
        }
        
        .header-left-group { display: flex; align-items: center; gap: 16px; }
        .header-brand-container { display: flex; align-items: center; text-decoration: none; }
        .header-logo-asset { width: 100px; height: 100px; object-fit: contain; }
        .header-brand-text { font-size: 30px; display: flex; align-items: baseline; margin-left: 4px; }
        .brand-brain { font-weight: 600; color: #fff; }
        .brand-whim { font-family: 'Pacifico', cursive; color: #7EB6D9; margin-left: 2px; }

        .page-wrap {
            min-height: calc(100vh - 110px);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative;
        }
        
        /* EXPANSIVE AURORA CLOUD SCREEN FILLER */
        .aurora-glow {
            position: absolute; width: 75vw; height: 75vw; max-width: 800px;
            border-radius: 50%; filter: blur(140px);
            background: radial-gradient(circle, var(--track-glow) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            opacity: 0.22; pointer-events: none; z-index: 1;
        }

        /* GEOMETRICALLY PERFECT CENTERED ORBIT */
        .orbit-container-block {
            position: relative; z-index: 5;
            width: 420px; height: 420px;
            display: flex; justify-content: center; align-items: center;
        }
        
        .orbit-container-block::before {
            content: ""; position: absolute; width: 100%; height: 100%;
            border-radius: 50%; border: 1px dashed rgba(255,255,255,0.18);
        }
        
        /* OPAQUE WEIGHTED CENTER ORB */
        .center-orb {
            width: 160px; height: 160px; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 22px; z-index: 10;
            background: radial-gradient(circle at 35% 35%, #25335c 0%, #0f1526 80%);
            box-shadow: 0 15px 40px rgba(0,0,0,0.7), inset 0 0 35px var(--track-glow);
        }
        .center-orb-img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; }

        .orbit-ring-rotator { position: absolute; inset: 0; animation: spin 28s linear infinite; pointer-events: none; }
        .sat-wrap { position: absolute; top: 50%; left: 50%; width: 110px; height: 110px; pointer-events: none; }
        
        /* SOLID COUNTER-ROTATED SATELLITE ORBS */
        .sat-orb {
            width: 100%; height: 100%; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; text-decoration: none; font-size: 11px; font-weight: 600; text-align: center;
            background: radial-gradient(circle at 35% 35%, #1f2c52 0%, #0d1324 80%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6), inset 0 0 25px var(--track-glow);
            animation: counter-spin 28s linear infinite;
            pointer-events: auto; line-height: 1.3;
        }
        .sat-orb:hover { transform: scale(1.06); }
        .orb-icon { font-size: 24px; margin-bottom: 4px; display: block; }

        .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-168px) rotate(0deg); }
        .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-168px) rotate(-120deg); }
        .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-168px) rotate(-240deg); }

        .back-link-studio { margin-top: 45px; color: #7EB6D9; text-decoration: none; font-weight: 600; font-size: 14px; z-index: 10; }
        .back-link-studio:hover { color: #fff; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counter-spin { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

        @media (max-width: 992px) {
            header { height: 90px; padding: 0 16px; }
            .header-logo-asset { width: 70px; height: 70px; }
            .header-brand-text { font-size: 22px; }
            body { padding-top: 90px; }
            .orbit-container-block { width: 280px; height: 280px; }
            .center-orb { width: 120px; height: 120px; font-size: 18px; }
            .center-orb-img { width: 36px; height: 36px; }
            .sat-orb, .sat-wrap { width: 84px; height: 84px; }
            .sat-1 { transform: translate(-50%, -50%) rotate(0deg) translateY(-112px) rotate(0deg); }
            .sat-2 { transform: translate(-50%, -50%) rotate(120deg) translateY(-112px) rotate(-120deg); }
            .sat-3 { transform: translate(-50%, -50%) rotate(240deg) translateY(-112px) rotate(-240deg); }
            .orb-icon { font-size: 18px; }
            .sat-orb { font-size: 9px; padding: 4px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left-group">
            <a href="index.html" class="header-brand-container">
                <img src="logo-image.png" alt="BrainWhim" class="header-logo-asset">
                <div class="header-brand-text"><span class="brand-brain">Brain</span><span class="brand-whim">Whim</span></div>
            </a>
        </div>
    </header>

    <div class="page-wrap">
        <div class="aurora-glow"></div>
        <div class="orbit-container-block">
            <div class="center-orb">
                <img src="orb-brain.png" alt="" class="center-orb-img">
                <span>Learn</span>
            </div>
            <div class="orbit-ring-rotator">
                <div class="sat-wrap sat-1">
                    <a class="sat-orb" href="roadmap.html"><span class="orb-icon">🏠</span>Homeschool<br>Connect</a>
                </div>
                <div class="sat-wrap sat-2">
                    <a class="sat-orb" href="roadmap.html"><span class="orb-icon">🧸</span>Early<br>Learning</a>
                </div>
                <div class="sat-wrap sat-3">
                    <a class="sat-orb" href="roadmap.html"><span class="orb-icon">🎯</span>Skills<br>Mapping</a>
                </div>
            </div>
        </div>
        <a class="back-link-studio" href="index.html">← Back to Studio Portal</a>
    </div>

</body>
</html>
